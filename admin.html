<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>p-book admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--text:#15181d;--text2:#4f5866;--text3:#6f7884;--border:#e1e4e9;--accent:#b45309;--accent-bg:#fdf2e2;--ok:#047857;--ok-bg:#e6f5ee;--bad:#b91c1c;--bad-bg:#fdeaea;--info:#1d4ed8;--radius:10px;--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--surface:#1a1d22;--surface2:#22262c;--text:#e7e9ec;--text2:#b5bcc6;--text3:#8d95a0;--border:#2f343b;--accent:#f0a24a;--accent-bg:#382914;--ok:#4ade80;--ok-bg:#132b1c;--bad:#f87171;--bad-bg:#371818;--info:#93c5fd}}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:.4em .6em}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{line-height:1.25;margin:0}
code{font-family:var(--mono);font-size:.86em}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.4em 1em;padding:.45em 1em;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.45em;font-weight:700;white-space:nowrap}
.brand a{color:var(--text);text-decoration:none}
.tabs{display:flex;gap:.15em;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
.tabs a{padding:.42em .7em;border-radius:7px;text-decoration:none;color:var(--text2);font-weight:600;font-size:.86rem;white-space:nowrap}
.tabs a:hover{background:var(--surface2)}
.tabs a[aria-selected=true]{background:var(--accent-bg);color:var(--accent)}
.who{display:flex;align-items:center;gap:.5em;font-size:.8rem;white-space:nowrap}

/* layout */
main{max-width:1180px;margin:0 auto;padding:1em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1em;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1em 1.1em;margin-bottom:1em;min-width:0}
.grid .card{margin-bottom:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:1rem;margin-bottom:.6em}
.card h3{font-size:.86rem;margin:1em 0 .4em;color:var(--text2)}
.muted{color:var(--text3)}
.note{font-size:.76rem;color:var(--text3);margin:.6em 0 0}
.err{color:var(--bad)}
.hot{color:var(--bad)}
.lead{color:var(--text2);margin:0 0 .8em;max-width:62em}

/* small pieces */
.tiles{display:flex;flex-wrap:wrap;gap:.6em}
.tile{border:1px solid var(--border);border-radius:9px;padding:.5em .8em;min-width:7.5em;flex:1}
.tile b{display:block;font-size:1.45rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:.75rem;color:var(--text2)}
.chip{display:inline-block;font-size:.72rem;border:1px solid var(--border);border-radius:999px;padding:.05em .55em;color:var(--text2);white-space:nowrap}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:.3em;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:.35em .75em;font-size:.82rem;font-weight:600;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:.8rem;text-decoration:underline}
.row{display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:.45em 0;border-top:1px solid var(--border)}
.list>li:first-child{border-top:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:.3em 1em;margin:0}
.kv dt{color:var(--text2)}
.kv dd{margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;margin-bottom:1em}
.toolbar input[type=search]{flex:1;min-width:14em}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.38em .8em;font-size:.82rem;font-weight:600;color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--accent-bg);color:var(--accent)}
.box{border:1px solid var(--border);border-radius:9px;padding:.6em .8em;margin:.5em 0}
.box.hot{border-color:var(--bad)}
.box.go{border-color:var(--ok)}
.quote{white-space:pre-wrap;background:var(--surface2);border-radius:7px;padding:.45em .6em;margin:.3em 0;font-size:.84rem}
.why{font-size:.8rem;color:var(--text2);margin:.15em 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{padding:.35em .5em;border-top:1px solid var(--border);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--text2);border-top:0;white-space:nowrap}
td.n,th.n{text-align:right}
.matrix th,.matrix td{text-align:center;white-space:nowrap}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);white-space:normal;min-width:12em}
.gap{color:var(--text3)}
.form{display:grid;gap:.45em}
.form textarea{width:100%;min-height:4.5em;resize:vertical}

/* concepts */
.chap{margin-top:1em}
.chap>h3{margin:0 0 .3em;font-size:.9rem;color:var(--text)}
details.concept{border-top:1px solid var(--border)}
details.concept>summary{display:grid;grid-template-columns:1fr repeat(4,4.2em);gap:.5em;align-items:center;padding:.4em .2em;cursor:pointer;list-style:none}
details.concept>summary::-webkit-details-marker{display:none}
details.concept>summary .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2);font-size:.82rem}
details.concept[open]>summary{font-weight:600}
.chead{display:grid;grid-template-columns:1fr repeat(4,4.2em);gap:.5em;font-size:.72rem;color:var(--text3);padding:0 .2em}
.chead span{text-align:right}
.blocks{margin:0 0 .6em .8em;padding:0;list-style:none}
.blocks li{padding:.2em 0;display:flex;flex-wrap:wrap;gap:.35em;align-items:center}
.blocks button.t{border:0;background:none;padding:0;color:var(--accent);text-align:left;font-size:.86rem}

/* columns chart */
.cols{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:.3em;overflow-x:auto}
.col{flex:1;min-width:20px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col .v{font-size:.66rem;color:var(--text2);font-variant-numeric:tabular-nums}
.col .b{width:100%;max-width:38px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.col .l{font-size:.62rem;color:var(--text3);white-space:nowrap;margin-top:2px}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:-6px 0 24px rgba(0,0,0,.12);z-index:40;display:flex;flex-direction:column}
.drawer header{display:flex;gap:.6em;align-items:flex-start;padding:.9em 1em .6em;border-bottom:1px solid var(--border)}
.drawer header h2{flex:1;font-size:1.05rem}
.drawer .scroll-y{overflow-y:auto;padding:.8em 1em 2em}
.md{line-height:1.65}
.md img,.md svg{max-width:100%;height:auto}
.md table{font-size:.82rem}
.md pre{background:var(--surface2);padding:.6em;border-radius:7px;overflow-x:auto}

/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1em}
.gate .card{max-width:420px;width:100%}
.gate h1{font-size:1.2rem;margin-bottom:.2em}
.gate form{display:grid;gap:.5em;margin:1em 0 .4em}

.toast{position:fixed;left:50%;bottom:1.2em;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.55em 1em;border-radius:8px;font-size:.84rem;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:640px){
  main{padding:.7em}
  .top{padding:.4em .7em}
  .grid{grid-template-columns:1fr}
  details.concept>summary,.chead{grid-template-columns:1fr repeat(2,3.6em)}
  details.concept>summary .opt,.chead .opt{display:none}
}
</style>
</head>
<body>
<div id="gate" class="gate" hidden></div>
<div id="app" hidden>
  <header class="top">
    <div class="brand"><a href="/" id="brand"></a><span class="muted">admin</span></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="who" id="who"></div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>
<aside id="drawer" class="drawer" hidden></aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
// Admin of a p-book: what readers do, what they ask for, and the editors' tools.
// Data: content from the book's bundle, the interaction log and its aggregates from /api/log
// (scoped to this book with ?book=), proposals from /api/proposals. Everything personal needs
// the editor key (PBOOK_ADMIN_KEY), which the server checks and this browser keeps.
import { CONFIG } from './js/config.js';
import { renderMarkdown, parseFrontmatter } from './js/markdown.js';

const ORIG = CONFIG.book?.lang || 'en';                 // the language the book is written in
const UI = ['cs', 'sk'].includes(ORIG) ? 'cs' : 'en';   // the admin speaks Czech or English
const L = (cs, en) => (UI === 'cs' ? cs : en);
const LOC = UI === 'cs' ? 'cs-CZ' : 'en-GB';
const BOOK = CONFIG.book?.slug || location.host;
const DIR = CONFIG.book?.contentDir || 'content';
const pickLang = v => (v && typeof v === 'object') ? (v[ORIG] || v.en || Object.values(v)[0] || '') : (v || '');
// the reader's own Czech words (js/i18n/cs.js) for the English facet words of the config
let PACK = {};
if (UI === 'cs') try { PACK = (await import('./js/i18n/cs.js')).default; } catch (e) {}
const T = s => (typeof s === 'string' && typeof PACK[s] === 'string') ? PACK[s] : s;
const FACET_CS = { lens: 'Svět příkladů', visuality: 'Vizuální styl', depth: 'Hloubka', genre: 'Žánr', lengthBand: 'Délka' };
const TITLE = pickLang(CONFIG.book?.title) || 'p-book';
document.documentElement.lang = UI;
document.title = `${TITLE} · admin`;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => (n == null || Number.isNaN(Number(n))) ? '–' : Number(n).toLocaleString(LOC);
const pct = (a, b) => b ? Math.round(100 * a / b) + ' %' : '–';
const day = t => t ? new Date(t).toLocaleDateString(LOC, { day: 'numeric', month: 'numeric' }) : '–';
const when = t => t ? new Date(t).toLocaleString(LOC, { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '–';
const plural = (n, one, few, many) => UI === 'cs' ? (n === 1 ? one : n >= 2 && n <= 4 ? few : many) : (n === 1 ? one : many);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
// Leftovers of the old admin: a password kept in this browser (it guarded nothing) and a
// Recombee private token its setup screen saved where the book itself could read it.
['pbook-admin-session', 'pbook-admin-hash', 'pbook-admin-pwd', 'pbook-rc-config', 'pbook-rc-token'].forEach(store.del);

let KEY = store.get('pbook-admin-key') || '';
let ADMIN = false;                                       // the server accepted KEY

// ---------- data ----------
async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
const withKey = (o = {}) => ({ ...o, headers: { ...(o.headers || {}), ...(KEY ? { 'X-Pbook-Admin': KEY } : {}) } });
const logUrl = p => `/api/log?${p ? p + '&' : ''}book=${encodeURIComponent(BOOK)}`;
const memo = new Map();
function once(k, fn) {
  if (!memo.has(k)) memo.set(k, fn().catch(e => { memo.delete(k); throw e; }));
  return memo.get(k);
}
const D = {
  book: () => once('book', () => getJSON(CONFIG.book?.bookIndex || `${DIR}/book.json`)),
  bundle: () => once('bundle', loadBundle),
  log: () => once('log', () => getJSON(logUrl(''), withKey()).then(rows => (Array.isArray(rows) ? rows : []).map(norm))),
  usage: () => once('usage', () => getJSON(logUrl('usage=1'))),
  stats: () => once('stats', () => getJSON(logUrl('stats=1'), withKey())),
  classes: () => once('classes', () => getJSON(logUrl('classes=1'), withKey())),
  wallet: () => once('wallet', () => getJSON(logUrl('wallet=1'), withKey())),
  messages: () => once('messages', () => getJSON(logUrl('contacts=1'), withKey())),
  boss: () => once('boss', () => getJSON('/api/boss')),
  proposals: () => once('proposals', loadProposals),
};

// The book's content: one request for the bundle (scripts/build-bundle.mjs), every file
// one by one only for a book without one. Translations count with their original.
async function loadBundle() {
  const book = await D.book();
  const where = new Map();
  book.chapters.forEach((ch, ci) => (ch.files || []).forEach((f, fi) => where.set(`${ch.directory}/${f}`, { ch, ci, fi })));
  let files = null, json = {};
  try { const b = await getJSON(`${DIR}/bundle.${ORIG}.json`); files = b.files; json = b.json || {}; } catch (e) {}
  if (!files) {
    files = {};
    await Promise.all([...where.keys()].map(p => fetch(`${DIR}/${p}`).then(r => r.ok ? r.text() : null)
      .then(t => { if (t) files[p] = t; }).catch(() => {})));
  }
  const jsonFile = name => json[`${DIR}/${name}`] ? Promise.resolve(json[`${DIR}/${name}`]) : getJSON(`${DIR}/${name}`).catch(() => null);
  const blocks = [], byId = new Map(), trOf = new Map(), translations = [];
  for (const [p, raw] of Object.entries(files)) {
    const at = where.get(p);
    if (!at || !p.endsWith('.md')) continue;
    const { meta, body } = parseFrontmatter(raw);
    if (!meta.id) continue;
    const b = { ...meta, body, raw, path: p, chapter: at.ch, order: at.ci * 1e4 + at.fi, langs: [meta.lang || ORIG] };
    if (meta.translationOf) translations.push(b); else { blocks.push(b); byId.set(b.id, b); }
  }
  for (const t of translations) {
    trOf.set(t.id, t.translationOf);
    const o = byId.get(t.translationOf);
    if (o && t.lang && !o.langs.includes(t.lang)) o.langs.push(t.lang);
  }
  blocks.sort((a, b) => a.order - b.order);
  const [cj, pj] = await Promise.all([jsonFile('concepts.json'), jsonFile('concept-proposals.json')]);
  return { book, blocks, byId, trOf, concepts: (cj && cj.concepts) || [], fileProposals: (pj && pj.proposals) || [] };
}
const canon = (B, id) => B.trOf.get(id) || id;
const chapterTitle = ch => ch ? `${ch.number != null ? ch.number + '. ' : ''}${pickLang(ch.title) || ch.id}` : '';

// One log row, flattened: older clients nested their fields one level deeper (data.data).
function norm(r) {
  const d = r.data && typeof r.data === 'object' ? r.data : {};
  const inner = d.data && typeof d.data === 'object' && !Array.isArray(d.data) ? d.data : {};
  return { ...inner, ...d, kind: r.event || d.event || r.type || d.type, type: r.type || d.type,
    user: r.user_id || d.userId || '?', item: r.item_id || d.itemId || null,
    rating: r.rating ?? d.rating, duration: r.duration ?? d.duration, at: Date.parse(r.created_at) || d.ts || 0 };
}
const isText = v => typeof v === 'string' && v.trim() && v !== '(text)';
const AI_KINDS = ['boss_graded', 'team_graded', 'team_ai', 'remix_served'];
const isAiCall = r => AI_KINDS.includes(r.kind) || (r.kind === 'generate_served' && !r.cached);

// ---------- small renderers ----------
const tile = (v, label) => `<div class="tile"><b>${typeof v === 'string' ? esc(v) : num(v)}</b><span>${esc(label)}</span></div>`;
function columns(items) {
  if (!items.length) return `<p class="muted">${L('Zatím bez dat.', 'No data yet.')}</p>`;
  const max = Math.max(1, ...items.map(i => i.v));
  return `<div class="cols">${items.map(i => `<div class="col" title="${esc(i.t || '')}"><span class="v">${num(i.v)}</span>`
    + `<span class="b" style="height:${Math.round(110 * i.v / max)}px"></span><span class="l">${esc(i.l)}</span></div>`).join('')}</div>`;
}
function errText(e) {
  if (e && e.status === 403) return `<p class="muted">🔒 ${L('Tohle uvidí jen editor s klíčem.', 'Only an editor with the key sees this.')}</p>`;
  if (e && e.status === 404) return `<p class="err">${L('Tohle API tu není (lokální server?).', 'This API is not available here (local server?).')}</p>`;
  return `<p class="err">${L('Nepodařilo se načíst: ', 'Could not load: ')}${esc(e && e.message || e)}</p>`;
}
// A card whose body fills in when its data arrives; null removes the card.
function slot(parent, title, fn, cls = '') {
  const el = document.createElement('section');
  el.className = 'card ' + cls;
  el.innerHTML = `${title ? `<h2>${title}</h2>` : ''}<div class="body"><p class="muted">${L('Načítám…', 'Loading…')}</p></div>`;
  parent.appendChild(el);
  const body = el.querySelector('.body');
  Promise.resolve().then(fn).then(html => { if (html == null) el.remove(); else body.innerHTML = html; })
    .catch(e => { body.innerHTML = errText(e); });
  return el;
}
function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

// Clicks: every button says what it does in data-act (and its subject in data-arg)
const ACT = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  e.preventDefault();
  ACT[el.dataset.act](el.dataset.arg, el, e);
});

// ---------- the editor key ----------
async function checkKey() {
  try { return await getJSON('/api/log?check=1', withKey()); } catch (e) { return null; }
}
function showGate(check, msg) {
  $('#app').hidden = true;
  const g = $('#gate');
  g.hidden = false;
  g.innerHTML = `<section class="card">
    <h1>📚 ${esc(TITLE)}</h1><p class="muted">${L('Administrace knihy', 'Book admin')}</p>
    <form id="gateForm">
      <label for="keyIn">${L('Klíč editora', 'Editor key')}</label>
      <input id="keyIn" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">${L('Vstoupit', 'Enter')}</button>
    </form>
    <p class="err" id="gateErr">${esc(msg || '')}</p>
    <p class="note">${L('Klíč je proměnná PBOOK_ADMIN_KEY v nastavení projektu ve Vercelu. Zůstane jen v tomto prohlížeči.',
      'The key is the PBOOK_ADMIN_KEY variable in the Vercel project settings. It stays in this browser only.')}</p>
    ${check && check.configured === false ? `<p class="note err">${L('Server zatím klíč nastavený nemá.', 'The server has no key set yet.')}</p>` : ''}
    <p><button class="linkbtn" data-act="publicMode">${L('Pokračovat bez klíče (jen souhrnné počty)', 'Continue without a key (counts only)')}</button></p>
  </section>`;
  $('#keyIn').focus();
  $('#gateForm').onsubmit = async e => {
    e.preventDefault();
    KEY = $('#keyIn').value.trim();
    const c = await checkKey();
    if (c && c.admin) { store.set('pbook-admin-key', KEY); ADMIN = true; boot(); }
    else $('#gateErr').textContent = c ? L('Tenhle klíč server nezná.', 'The server does not know this key.') : L('Server neodpovídá.', 'The server does not answer.');
  };
}
ACT.publicMode = () => { KEY = ''; ADMIN = false; boot(); };
ACT.logout = () => { store.del('pbook-admin-key'); KEY = ''; ADMIN = false; memo.clear(); location.hash = ''; showGate(null); };

// ---------- shell and routing ----------
const TABS = [
  { id: 'overview', icon: '📊', label: L('Přehled', 'Overview'), view: viewOverview },
  { id: 'content', icon: '📚', label: L('Obsah', 'Content'), view: viewContent },
  { id: 'wishes', icon: '🌱', label: L('Přání a návrhy', 'Wishes & proposals'), view: viewWishes },
  { id: 'shared', icon: '🤝', label: L('Příspěvky čtenářů', 'Reader contributions'), view: viewShared, when: () => CONFIG.features?.community !== false },

// ---------- 📚 content ----------
const CS = { q: '', ch: '', mode: 'list', dim: 'lens' };
function blockSignals(rows, B) {
  const S = new Map();
  const s = id => { id = canon(B, id); return S.get(id) || S.set(id, { viewers: new Set(), views: 0, fin: 0, likes: new Set(), dislikes: new Set(), away: 0, remix: 0, flags: [], dwell: 0, dwellN: 0 }).get(id); };
  for (const r of rows) {
    const id = r.item || r.blockId;
    if (!id) continue;
    if (r.kind === 'detailview') {
      const x = s(id), dur = Number(r.duration) || 0;
      x.viewers.add(r.user); x.views++;
      if (dur) { x.dwell += dur; x.dwellN++; }
      if (dur >= Math.min(12, ((B.byId.get(canon(B, id))?.readingTime) || 3) * 9)) x.fin++;
    } else if (r.kind === 'rating') {
      const v = Number(r.rating);
      if (v >= 0.7) s(id).likes.add(r.user); else if (v > 0 && v < 0.5) s(id).dislikes.add(r.user);
    } else if (r.kind === 'flag' && r.blockId) s(r.blockId).flags.push({ type: r.type, text: r.text, at: r.at });
    else if ((r.kind === 'steer' || r.kind === 'steer_miss') && r.blockId && r.action !== 'praise') s(r.blockId).away++;
    else if (r.kind === 'remix_request' && r.blockId) s(r.blockId).remix++;
  }
  for (const [id, x] of S) {
    const b = B.byId.get(id);
    const expected = ((b && b.readingTime) || 3) * 9;
    x.avg = x.dwellN ? x.dwell / x.dwellN : 0;
    x.shallow = x.viewers.size >= 3 && x.avg > 0 && x.avg < expected * 0.5;
    x.expected = expected;
    x.score = x.flags.length * 3 + x.dislikes.size * 2 + x.away + x.remix + (x.shallow ? 2 : 0) - x.likes.size * 2;
  }
  return S;
}
const chipsOf = b => [
  b.core ? `<span class="chip acc">★ ${L('jádro', 'core')}</span>` : '',
  b.lens && b.lens !== 'generic' ? `<span class="chip">${esc(b.lens)}</span>` : '',
  b.depth && b.depth !== 'standard' ? `<span class="chip">${esc(b.depth)}</span>` : '',
  b.genre && b.genre !== 'explainer' ? `<span class="chip">${esc(b.genre)}</span>` : '',
  b.status && b.status !== 'accepted' ? `<span class="chip bad">${esc(b.status)}</span>` : '',
  b.langs && b.langs.length > 1 ? `<span class="chip">${b.langs.map(esc).join(' ')}</span>` : '',
].join(' ');

async function viewContent(m, alive) {
  m.innerHTML = `<div class="toolbar">
      <input type="search" id="cq" placeholder="${L('Hledat sekci nebo koncept…', 'Search a section or concept…')}" aria-label="${L('Hledat', 'Search')}">
      <select id="cch" aria-label="${L('Kapitola', 'Chapter')}"><option value="">${L('Všechny kapitoly', 'All chapters')}</option></select>
      <div class="seg" role="group"><button data-act="cmode" data-arg="list">${L('Koncepty', 'Concepts')}</button><button data-act="cmode" data-arg="cover">${L('Pokrytí podání', 'Coverage')}</button></div>
    </div><div id="cbody"><p class="muted">${L('Načítám obsah…', 'Loading content…')}</p></div>`;
  const [B, rows, usage] = await Promise.all([D.bundle(), D.log().catch(() => []), D.usage().catch(() => ({}))]);
  if (!alive()) return;
  const chSel = $('#cch');
  chSel.innerHTML += B.book.chapters.map(ch => `<option value="${esc(ch.id)}">${esc(chapterTitle(ch))}</option>`).join('');
  $('#cq').value = CS.q; chSel.value = CS.ch;
  const sig = blockSignals(rows, B);
  const seen = {};
  for (const [id, x] of Object.entries(usage || {})) { const k = canon(B, id); seen[k] = (seen[k] || 0) + x.views; }
  const ctx = { B, sig, seen };
  let t;
  $('#cq').oninput = e => { CS.q = e.target.value; clearTimeout(t); t = setTimeout(() => renderContent(ctx), 150); };
  chSel.onchange = e => { CS.ch = e.target.value; renderContent(ctx); };
  ACT.cmode = v => { CS.mode = v; renderContent(ctx); };
  ACT.cdim = (v, el) => { CS.dim = el.value; renderContent(ctx); };
  renderContent(ctx);
}

function renderContent({ B, sig, seen }) {
  document.querySelectorAll('[data-act=cmode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === CS.mode)));
  const q = CS.q.trim().toLowerCase();
  const inCh = b => !CS.ch || b.chapter.id === CS.ch;
  const hit = b => !q || [b.title, b.id, b.concept].some(x => String(x || '').toLowerCase().includes(q));
  const conceptBlocks = c => (c.blocks && c.blocks.length ? c.blocks.map(id => B.byId.get(id)) : B.blocks.filter(b => String(b.concept || '').split('|').map(s => s.trim()).includes(c.id))).filter(Boolean);
  const concepts = B.concepts.map(c => ({ c, blocks: conceptBlocks(c) }))
    .filter(({ c, blocks }) => (!CS.ch || c.chapter === CS.ch || blocks.some(inCh)) && (!q || [c.title, c.id].some(x => String(x || '').toLowerCase().includes(q)) || blocks.some(hit)));
  let h = '';

  if (CS.mode === 'cover') {
    const dims = Object.entries(CONFIG.facets || {}).filter(([, f]) => !f.derived && Array.isArray(f.values));
    if (!dims.find(([k]) => k === CS.dim)) CS.dim = (dims[0] || ['lens'])[0];
    const vals = (CONFIG.facets?.[CS.dim]?.values) || [];
    const covers = (b, v) => {
      if (CS.dim === 'lang') return b.langs.includes(v);
      const raw = b[CS.dim];
      if (!raw) return v === vals[0];
      const s = String(raw);
      if (s.includes('..')) { const [a, z] = s.split('..').map(x => vals.indexOf(x.trim())); const i = vals.indexOf(v); return a >= 0 && z >= a && i >= a && i <= z; }
      return s.split('|').map(x => x.trim()).includes(v);
    };
    h += `<section class="card"><div class="row" style="margin-bottom:.6em"><label for="cdim">${L('Rozměr', 'Dimension')}</label>
      <select id="cdim" data-act="cdim">${dims.map(([k, f]) => `<option value="${esc(k)}"${k === CS.dim ? ' selected' : ''}>${esc(f.label || k)}</option>`).join('')}</select>
      <span class="note" style="margin:0">${L('Kolik podání má každý koncept pro každou hodnotu; tečka = chybí.', 'How many tellings each concept has for each value; a dot = none.')}</span></div>
      <div class="scroll"><table class="matrix"><thead><tr><th>${L('Koncept', 'Concept')}</th>${vals.map(v => `<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>`
      + concepts.map(({ c, blocks }) => `<tr><td>${esc(c.title || c.id)}</td>${vals.map(v => { const n = blocks.filter(b => covers(b, v)).length; return `<td>${n ? n : '<span class="gap">·</span>'}</td>`; }).join('')}</tr>`).join('')
      + `</tbody></table></div></section>`;
    $('#cbody').innerHTML = h;
    $('#cdim').onchange = e => { CS.dim = e.target.value; renderContent({ B, sig, seen }); };
    return;
  }

  // what needs attention, worst first
  const problems = B.blocks.filter(b => inCh(b) && hit(b) && sig.get(b.id) && (sig.get(b.id).score > 0 || sig.get(b.id).flags.length))
    .map(b => ({ b, s: sig.get(b.id) })).sort((a, z) => z.s.score - a.s.score).slice(0, 20);
  h += `<section class="card"><h2>${L('Potřebuje pozornost', 'Needs attention')} <span class="muted">(${problems.length})</span></h2>`;
  h += problems.length ? problems.map(({ b, s }) => {
    const why = [];
    if (s.flags.length) why.push(`${s.flags.length}× ${L('nahlášeno', 'reported')}`);
    if (s.dislikes.size) why.push(`${s.dislikes.size} 👎`);
    if (s.away) why.push(`${s.away}× ${L('přepnuto na jiné podání', 'switched to another telling')}`);
    if (s.remix) why.push(`${s.remix}× ${L('žádost o úpravu', 'asked to rework')}`);
    if (s.shallow) why.push(L(`čtou krátce (${Math.round(s.avg)} s z ~${Math.round(s.expected)} s)`, `read briefly (${Math.round(s.avg)} s of ~${Math.round(s.expected)} s)`));
    why.push(`${num(s.views)} ${L('zobrazení', 'views')}, ${num(s.fin)} ${L('dočteno', 'finished')}`);
    const texts = s.flags.filter(f => isText(f.text)).slice(-3);
    return `<div class="box${s.score >= 3 ? ' hot' : ''}"><div class="row"><button class="linkbtn" data-act="preview" data-arg="${esc(b.id)}"><b>${esc(b.title || b.id)}</b></button>
      <span class="muted">· ${esc(chapterTitle(b.chapter))}</span></div><div class="why">${why.join(' · ')}</div>
      ${texts.map(f => `<div class="quote">${f.type && f.type !== 'event' ? `<b>${esc(f.type)}:</b> ` : ''}${esc(f.text)} <span class="muted">(${day(f.at)})</span></div>`).join('')}
      <div class="row">${blockButtons(b)}</div></div>`;
  }).join('') : `<p class="muted">${L('Nic: žádná nahlášená chyba, žádné 👎 ani útěky z textu.', 'Nothing: no reports, no 👎, nobody running away from a text.')}</p>`;
  if (!ADMIN) h += `<p class="note">${L('Texty hlášení uvidíš s klíčem editora.', 'The text of reports needs the editor key.')}</p>`;
  h += '</section>';

  // concepts by chapter
  h += `<section class="card"><h2>${L('Koncepty', 'Concepts')} <span class="muted">(${concepts.length})</span></h2>
    <div class="chead"><span style="text-align:left">${L('koncept', 'concept')}</span><span>${L('podání', 'tellings')}</span><span>${L('čtenáři', 'readers')}</span><span class="opt">👍</span><span class="opt">${L('hlášení', 'reports')}</span></div>`;
  const byCh = new Map();
  for (const x of concepts) {
    const key = x.c.chapter || (x.blocks[0] && x.blocks[0].chapter.id) || '';
    (byCh.get(key) || byCh.set(key, []).get(key)).push(x);
  }
  for (const ch of B.book.chapters) {
    const list = byCh.get(ch.id) || byCh.get(ch.directory);
    if (!list) continue;
    h += `<div class="chap"><h3>${esc(chapterTitle(ch))}</h3>` + list.map(({ c, blocks }) => {
      const views = blocks.reduce((n, b) => n + (seen[b.id] || 0), 0);
      const likes = blocks.reduce((n, b) => n + (sig.get(b.id)?.likes.size || 0), 0);
      const flags = blocks.reduce((n, b) => n + (sig.get(b.id)?.flags.length || 0), 0);
      const gap = c.contract && (!c.contract.recallQ || !(c.contract.mustCover || []).length);
      return `<details class="concept"><summary><span>${gap ? `<span title="${L('chybí kontrolní otázka nebo co musí pokrýt', 'missing recall question or must-cover points')}">⚠</span> ` : ''}${esc(c.title || c.id)}</span>`
        + `<span class="n">${blocks.length}</span><span class="n">${num(views)}</span><span class="n opt">${likes || ''}</span><span class="n opt">${flags ? `<b class="hot">${flags}</b>` : ''}</span></summary>`
        + `<ul class="blocks">${blocks.map(b => `<li><button class="t" data-act="preview" data-arg="${esc(b.id)}">${esc(b.title || b.id)}</button> ${chipsOf(b)}`
        + ` <span class="muted">${num(seen[b.id] || 0)} ${L('čt.', 'rd.')}</span></li>`).join('') || `<li class="muted">${L('Žádná sekce.', 'No section.')}</li>`}`
        + `<li><a class="linkbtn" href="/#${encodeURIComponent(c.anchor || c.id)}" target="_blank" rel="noopener">${L('otevřít v knize', 'open in the book')} ↗</a></li></ul></details>`;
    }).join('') + '</div>';
  }
  h += `<p class="note">${L('Čtenáři = různé prohlížeče, které sekci otevřely (z posledních 5 000 zobrazení).', 'Readers = distinct browsers that opened the section (from the latest 5,000 views).')}</p></section>`;
  $('#cbody').innerHTML = h;
}

function blockButtons(b) {
  return `<a class="btn" href="/#${encodeURIComponent(b.id)}" target="_blank" rel="noopener">📖 ${L('V knize', 'In the book')}</a>`

const WRITE_K = 5;   // readers who want a proposal before it is worth writing
async function loadProposals() {
  const B = await D.bundle();
  let srv = { proposals: [], deleted: [], stats: {} };
  try { const d = await getJSON('/api/proposals?stats=1'); if (d && d.ok) srv = { ...srv, ...d }; } catch (e) {}
  // a book may keep the chapter as `tema` and the texts per language
  const tidy = p => ({ ...p, chapter: p.chapter || p.tema || '', title: pickLang(p.title), objective: pickLang(p.objective),
    recallQ: pickLang(p.recallQ), recallA: pickLang(p.recallA) });
  const by = new Map();
  B.fileProposals.forEach(p => by.set(p.slug, { ...tidy(p), origin: 'git' }));
  (srv.proposals || []).forEach(p => by.set(p.slug, { ...tidy(p), origin: by.has(p.slug) ? 'git+live' : 'live' }));
  (srv.deleted || []).forEach(s => by.delete(s));
  return { list: [...by.values()], stats: srv.stats || {} };
}
// What readers asked for, as lines for the AI that drafts proposals (and for the editor to read)
function demandLines(rows) {
  const lines = [];
  for (const r of rows) {
    if (r.kind === 'concept_wish' && isText(r.text)) lines.push(`WISH: ${r.text}`);
    if (r.kind === 'personal_mission' && isText(r.goal)) lines.push(`GOAL: ${r.goal}`);
    if (r.kind === 'steer_miss') lines.push(`MISS: concept=${r.concept || '?'} wanted ${r.facet || r.action || '?'}=${r.value || '?'}`);
    if (r.kind === 'flag' && isText(r.text)) lines.push(`FLAG(${r.type || 'issue'}): ${r.text}`);
    if (r.kind === 'mission_reflection' && Array.isArray(r.disliked)) {
      r.disliked.forEach(id => lines.push(`DISLIKED: block=${id} (mission ${r.mission || '?'})`));
      (r.suggestions || []).forEach(x => lines.push(`SUGGEST: ${x}`));
      if (isText(r.note)) lines.push(`REFLECTION: ${r.note}`);
    }
  }
  return [...new Set(lines)].slice(-80);
}

function viewWishes(m) {
  slot(m, L('Co čtenáři chtějí', 'What readers ask for'), async () => {
    const [rows, B] = await Promise.all([D.log(), D.bundle()]);
    const group = (list, key) => {
      const g = new Map();
      for (const r of list) { const t = String(key(r) || '').trim(); if (!t) continue; const k = t.toLowerCase(); const x = g.get(k) || g.set(k, { text: t, users: new Set(), n: 0 }).get(k); x.users.add(r.user); x.n++; }
      return [...g.values()].sort((a, b) => b.users.size - a.users.size || b.n - a.n);
    };
    const wishes = group(rows.filter(r => r.kind === 'concept_wish' && isText(r.text)), r => r.text);
    const goals = group(rows.filter(r => r.kind === 'personal_mission' && isText(r.goal)), r => r.goal);
    const misses = group(rows.filter(r => r.kind === 'steer_miss'), r => {
      const c = B.concepts.find(x => x.id === r.concept);
      return `${c ? c.title : r.concept || '?'} → ${r.facet || r.action || '?'}${r.value ? ' = ' + r.value : ''}`;
    });
    const refl = rows.filter(r => r.kind === 'mission_reflection' && Array.isArray(r.liked || r.disliked));
    const votes = new Map();
    refl.forEach(r => { (r.liked || []).forEach(id => { const v = votes.get(id) || votes.set(id, { up: 0, down: 0 }).get(id); v.up++; }); (r.disliked || []).forEach(id => { const v = votes.get(id) || votes.set(id, { up: 0, down: 0 }).get(id); v.down++; }); });
    const notes = refl.filter(r => isText(r.note)).slice(-8).reverse();

    let h = '<div class="grid">';
    h += part(L('Nová témata', 'New topics'), wishes, ADMIN || !nWishCount ? L('Zatím žádné přání.', 'No wishes yet.') : L(`${nWishCount} přání; texty uvidíš s klíčem.`, `${nWishCount} wishes; the texts need the key.`));
    h += part(L('Co se chtějí naučit', 'What they came to learn'), goals, L('Zatím nic.', 'Nothing yet.'));
    h += part(L('Chybějící podání (žádost bez odpovědi)', 'Missing tellings (asked for, none existed)'), misses, L('Zatím nic.', 'Nothing yet.'));
    h += `<div><h3>${L('Po zkoušce', 'After the exam')}</h3>`;
    if (!votes.size && !notes.length) h += `<p class="muted">${L('Zatím nic.', 'Nothing yet.')}</p>`;
    else {
      h += `<ul class="list">${[...votes].sort((a, b) => (b[1].down - b[1].up) - (a[1].down - a[1].up)).slice(0, 10).map(([id, v]) =>
        `<li><button class="linkbtn" data-act="preview" data-arg="${esc(id)}">${esc(B.byId.get(canon(B, id))?.title || id)}</button> <span class="muted">· ${v.up} 👍 · ${v.down} 👎</span></li>`).join('')}</ul>`;
      h += notes.map(r => `<div class="quote">${esc(r.note)} <span class="muted">(${esc(r.mission || '')}${r.score != null ? ` · ${r.score}/100` : ''})</span></div>`).join('');
    }
    h += '</div></div>';
    return h;
  });

  slot(m, L('Návrhy nových témat', 'Proposals for new topics'), async () => {
    const [P, B] = await Promise.all([D.proposals(), D.bundle()]);
    const chapters = [...new Set(B.concepts.map(c => c.chapter).filter(Boolean))];
    const st = p => P.stats[p.slug] || {};
    const list = P.list.slice().sort((x, y) => ((st(y).want || 0) - (st(x).want || 0)) || ((st(y).seen || 0) - (st(x).seen || 0)) || String(x.title).localeCompare(String(y.title)));
    let h = `<p class="lead">${L('Návrh se čtenářům ukáže jako šedá karta „chceš tohle téma?“. Hlasy ukážou zájem dřív, než ho někdo začne psát. Uložení platí hned pro všechny čtenáře.',
      'A proposal shows to readers as a grey "want this topic?" card. Their votes show interest before anyone writes it. Saving takes effect for all readers at once.')}</p>`;
    h += `<div class="form box">
        <label for="epDesc"><b>${L('Nový návrh', 'New proposal')}:</b> ${L('popiš téma vlastními slovy (co má čtenář po přečtení umět?). AI doplní cíl, co pokrýt a kontrolní otázku.', 'describe the topic in your own words (what should the reader be able to do afterwards?). The AI completes the goal, what to cover and the recall question.')}</label>
        <textarea id="epDesc"></textarea>
        <div class="row"><label for="epChapter">${L('Kapitola', 'Chapter')}</label>
          <select id="epChapter">${chapters.map(ch => `<option>${esc(ch)}</option>`).join('')}<option value="__new">${L('nová kapitola…', 'new chapter…')}</option></select>
          <input id="epNewChap" hidden placeholder="chNN-slug">
          <button class="btn primary" data-act="propNew" id="epBtn">✨ ${L('Doplnit s AI', 'Complete with AI')}</button></div>
      </div>

        <button class="btn" data-act="mapAnalysis" id="mapBtn">🧭 ${L('Co v knize chybí (AI)', 'What the book is missing (AI)')}</button>
        <button class="btn" data-act="propExport">⬇ concept-proposals.json</button>
      </div>

    h += `<h3>${L('Návrhy u čtenářů', 'Proposals shown to readers')} (${list.length})</h3>`;
    h += list.length ? `<div class="chead"><span style="text-align:left">${L('téma', 'topic')}</span><span>👁</span><span>👍</span><span class="opt">👎</span><span class="opt">${L('zájem', 'interest')}</span></div>`
      + list.map(p => proposalRow(p, st(p), chName(B, p.chapter))).join('') : `<p class="muted">${L('Zatím žádný návrh.', 'No proposals yet.')}</p>`;
    setTimeout(() => { const s = $('#epChapter'); if (s) s.onchange = () => { $('#epNewChap').hidden = s.value !== '__new'; }; });
    return h;
  });
}

const chName = (B, id) => id ? (chapterTitle(B.book.chapters.find(c => c.id === id || c.directory === id)) || id) : '';
function proposalRow(p, st = {}, chapter = '') {
  const seen = st.seen || 0, want = st.want || 0, skip = st.skip || 0;
  const ready = want >= WRITE_K;
  const who = Object.entries(st.voters || {}).filter(([k]) => k.startsWith('want:')).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => `${k.slice(5)} (${n})`).join(', ');
  return `<details class="concept" id="prop-${esc(p.slug)}"><summary><span>${ready ? `<span class="chip ok">${L('k napsání', 'ready')}</span> ` : ''}${esc(p.title)}${chapter ? ` <span class="muted">· ${esc(chapter)}</span>` : ''}</span>`
    + `<span class="n">${num(seen)}</span><span class="n"><b>${num(want)}</b></span><span class="n opt">${num(skip)}</span><span class="n opt">${pct(want, seen)}</span></summary>
    <div class="box">
    <div class="row"><code>${esc(p.slug)}</code> <span class="chip">${esc(p.origin || 'live')}</span></div>
    ${p.objective ? `<div>${esc(p.objective)}</div>` : ''}
    ${p.recallQ ? `<div class="why">${L('Kontrolní otázka', 'Recall')}: ${esc(p.recallQ)}</div>` : ''}
    ${(p.mustCover || []).length ? `<div class="why">${L('Pokrýt', 'Cover')}: ${p.mustCover.map(esc).join(' · ')}</div>` : ''}
    ${who ? `<div class="why">${L('Chtějí ho', 'Wanted by')}: ${esc(who)}</div>` : ''}
    <div class="row" style="margin-top:.3em">
      <button class="btn" data-act="propEdit" data-arg="${esc(p.slug)}">✏️ ${L('Upravit', 'Edit')}</button>
      ${want ? `<button class="btn" data-act="propTailor" data-arg="${esc(p.slug)}">🎯 ${L('Přepsat pro zájemce', 'Tailor to who wants it')}</button>` : ''}
      <button class="btn" data-act="propMd" data-arg="${esc(p.slug)}">⬇ .md</button>
      <button class="btn danger" data-act="propDelete" data-arg="${esc(p.slug)}">🗑 ${L('Smazat', 'Delete')}</button>
    </div><div class="pe"></div></div></details>`;
}

async function propPost(body) {
  const send = () => fetch('/api/proposals', withKey({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }));
  let r = await send();
  if (r.status === 403 && !ADMIN) {
    const k = prompt(L('Klíč editora (PBOOK_ADMIN_KEY), bez něj návrhy měnit nejde:', 'Editor key (PBOOK_ADMIN_KEY), needed to change proposals:'));
    if (k) { KEY = k.trim(); const c = await checkKey(); if (c && c.admin) { ADMIN = true; store.set('pbook-admin-key', KEY); } r = await send(); }
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.ok) { alert(L('Nepovedlo se: ', 'Failed: ') + (d.error || r.status)); return false; }
  memo.delete('proposals');
  return true;
}

function viewShared(m) {
  slot(m, L('Sdílená podání', 'Shared tellings'), async () => {
    const [rows, B] = await Promise.all([D.log(), D.bundle()]);
    let served = [];
    if (CONFIG.recombee?.enabled) {
      try {
        const r = await fetch('/api/recs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          endpoint: '/recomms/users/admin-console/items/', method: 'POST',
          body: { filter: `('state' == "community" OR 'state' == "edited" OR 'state' == "core") AND 'sharedAs' != null`, returnProperties: true, count: 200, cascadeCreate: true } }) });
        const d = r.ok ? await r.json() : {};
        served = (d.recomms || []).map(x => ({ itemId: x.id, ...(x.values || {}) }));
      } catch (e) {}
    }
    const traction = new Map();
    rows.forEach(r => {
      const id = r.item; if (!id) return;
      const t = traction.get(id) || traction.set(id, { views: new Set(), likes: new Set() }).get(id);
      if (r.kind === 'detailview') t.views.add(r.user);
      if (r.kind === 'rating' && Number(r.rating) >= 0.7) t.likes.add(r.user);
    });
    const archived = new Map();
    rows.filter(r => r.kind === 'block_saved' && (r.action === 'shared' || r.state === 'community')).forEach(r => {
      const old = archived.get(r.blockId);
      if (!old || old.at < r.at) archived.set(r.blockId, { itemId: r.blockId, title: r.title, concept: r.concept, body: r.body, bodyLen: r.bodyLen, hasSvg: r.hasSvg,
        sharedAs: r.sharedAs, classGroup: r.classGroup, remixOf: r.remixOf, lens: r.facets?.lens, at: r.at });
    });
    const all = new Map(served.map(i => [i.itemId, i]));
    archived.forEach((a, id) => all.set(id, { ...(all.get(id) || {}), ...a }));
    const list = [...all.values()].map(i => ({ i, views: traction.get(i.itemId)?.views.size || 0, likes: traction.get(i.itemId)?.likes.size || 0 }))
      .sort((a, b) => (!!b.i.nominated - !!a.i.nominated) || (b.likes * 3 + b.views) - (a.likes * 3 + a.views));
    window._shared = new Map(list.map(x => [x.i.itemId, x.i]));
    const canAdopt = !!CONFIG.recombee?.enabled;
    let h = `<p class="lead">${L('Sdílená podání od čtenářů: nová i upravená. Dobrá převezmi do knihy: vylepši je ve studiu, nebo stáhni .md do repozitáře.',
      'Tellings readers wrote or reworked and shared. Take the good ones into the book: polish them in the studio, or download the .md for the repository.')}`
      + (canAdopt ? '' : ` ${L('Přímé převzetí jedním tlačítkem potřebuje Recombee, které tahle kniha nemá zapnuté.', 'One-click adoption needs Recombee, which this book has turned off.')}`) + '</p>';
    h += list.length ? list.map(({ i, views, likes }) => {
      const concept = B.concepts.find(c => c.id === i.concept);
      return `<div class="box${likes >= 5 ? ' go' : ''}"><div class="row"><span class="chip ${i.state === 'core' || i.state === 'edited' ? 'ok' : 'acc'}">${esc(i.state || 'community')}</span>
        <b>${esc(i.title || i.itemId)}</b>${i.nominated ? ` <span class="chip acc">⭐ ${L('doporučeno ve třídě', 'class pick')}</span>` : ''}${i.classGroup ? ` <span class="chip">🏫 ${esc(i.classGroup)}</span>` : ''}</div>
        <div class="why">${esc(concept ? concept.title : i.concept || '')}${i.lens ? ' · ' + esc(i.lens) : ''} · ${esc(i.sharedAs || L('bez jména', 'anonymous'))} · ${num(views)} ${L('čtenářů', 'readers')} · ${num(likes)} 👍${i.at ? ' · ' + day(i.at) : ''}</div>
        ${isText(i.body) ? `<details><summary class="linkbtn">${L('náhled', 'preview')}</summary><div class="quote" id="full-${esc(i.itemId)}">${esc(i.body)}</div>
          ${i.bodyLen || i.hasSvg ? `<button class="btn" data-act="loadFull" data-arg="${esc(i.itemId)}">⤓ ${L('celý text', 'full text')}</button>` : ''}</details>` : ''}

// two-proportion z-test → two-sided p (normal approximation)
function pTwo(x1, n1, x2, n2) {
  if (n1 < 5 || n2 < 5) return null;
  const p = (x1 + x2) / (n1 + n2), se = Math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2));
  if (!se) return null;
  const z = Math.abs(x1 / n1 - x2 / n2) / se;
  const t = 1 / (1 + 0.2316419 * z), d = 0.3989423 * Math.exp(-z * z / 2);
  return 2 * d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
}
// item id → { concept, chapter, meta } through the bundle (translations count with their original)
function itemIndex(B) {
  const conceptOf = new Map();
  for (const c of B.concepts) for (const id of c.blocks || []) conceptOf.set(id, c.id);
  const cTitle = new Map(B.concepts.map(c => [c.id, pickLang(c.title) || c.id]));
  const at = id => {
    const o = B.byId.get(canon(B, id));
    if (!o) return null;
    return { meta: o, concept: o.concept || conceptOf.get(o.id) || conceptOf.get(id) || null, chapter: o.chapter };
  };
  return { at, cTitle };
}

function viewInsights(m) {
  m.innerHTML = `<p class="lead">${L('Posledních 30 dní. Zařízení jsou náhodně rozdělená do dvou skupin: jednu obsluhuje Recombee, druhou doporučování přímo v knize. Čísla jsou souhrny, žádné jednotlivé dítě.',
    'The last 30 days. Devices are split at random into two arms: Recombee serves one, the book’s own recommender the other. Every number is a total, never one child.')}`
    + (CONFIG.recombee?.enabled ? ` ${L('Podíl zařízení na Recombee', 'Share of devices on Recombee')}: <b>${Math.round(100 * Number(CONFIG.recombee.abShare ?? 1))} %</b>.` : ` <b>${L('Recombee je v této knize vypnuté', 'Recombee is off in this book')}</b>.`)
    + `</p><div class="grid"></div>`;
  const g = m.querySelector('.grid');

  slot(g, L('A/B: Recombee proti doporučování knihy', 'A/B: Recombee against the book’s recommender'), async () => {
    const s = await D.insights();
    const arms = ['rc', 'local', 'none'].filter(a => s.arms[a]);
    if (!arms.length) return `<p class="muted">${L('Zatím bez dat.', 'No data yet.')}</p>`;
    const per = (a, k) => s.arms[a].devices ? (s.arms[a][k] / s.arms[a].devices).toFixed(1) : '–';
    const rows = [
      [L('zařízení', 'devices'), a => num(s.arms[a].devices)],
      [L('vrací se (2+ dny)', 'returning (2+ days)'), a => `${num(s.arms[a].returning)} (${shareTxt(s.arms[a].returning, s.arms[a].devices)})`],
      [L('otevřených sekcí na zařízení', 'sections opened per device'), a => per(a, 'views')],
      [L('dočtených sekcí na zařízení (aspoň polovina)', 'sections read per device (at least half)'), a => per(a, 'deepReads')],
      [L('správně zopakovaných konceptů', 'concepts recalled right'), a => num(s.arms[a].recallOk)],
      [L('splněných misí', 'missions passed'), a => num(s.arms[a].missions)],
      [L('vyhraných her a vyřešených výzev', 'games won and challenges solved'), a => num(s.arms[a].gamesWon + s.arms[a].challenges)],
    ];
    let h = `<div class="scroll"><table><tr><th></th>${arms.map(a => `<th class="n">${esc(ARM[a])}</th>`).join('')}</tr>`
      + rows.map(([label, f]) => `<tr><td>${label}</td>${arms.map(a => `<td class="n">${f(a)}</td>`).join('')}</tr>`).join('') + '</table></div>';
    const rc = s.arms.rc, lo = s.arms.local;
    if (rc && lo) {
      const p = pTwo(rc.returning, rc.devices, lo.returning, lo.devices);
      h += `<p class="note">${p == null ? L('Na srovnání je zatím málo zařízení.', 'Too few devices to compare yet.')
        : L(`Rozdíl v podílu vracejících se: ${share(rc.returning, rc.devices) - share(lo.returning, lo.devices)} procentních bodů, p ≈ ${p.toFixed(3)}${p < 0.05 ? ' (spolehlivý)' : ' (zatím může být náhoda)'}.`,
          `Difference in the returning share: ${share(rc.returning, rc.devices) - share(lo.returning, lo.devices)} points, p ≈ ${p.toFixed(3)}${p < 0.05 ? ' (reliable)' : ' (may still be chance)'}.`)}</p>`;
    }
    return h + `<p class="note">${L('Skupina zůstává se zařízením. „Před A/B“ jsou zařízení, která od vydání 7.13 nic nezaznamenala.', 'The arm stays with the device. "Before A/B" are devices with nothing logged since 7.13.')}`
      + ` ${L('Spočítáno', 'Computed')} ${when(s.computedAt)}${s.rows.capped ? ` · <span class="hot">${L('jen část záznamů (limit)', 'part of the rows only (cap)')}</span>` : ''}.</p>`;
  }, 'wide');

  slot(g, L('Doporučovací místa: zobrazeno → kliknuto → dočteno', 'Recommendation surfaces: shown → clicked → read'), async () => {
    const s = await D.insights();
    const list = s.surfaces.slice().sort((a, b) => String(a.surface).localeCompare(b.surface) || a.engine.localeCompare(b.engine));
    const se = s.search;
    if (!list.length && !se.searches) return `<p class="muted">${L('Zatím bez dat: místa se počítají od vydání 7.13.', 'No data yet: surfaces count from release 7.13.')}</p>`;
    let h = `<div class="scroll"><table><tr><th>${L('místo', 'surface')}</th><th>${L('vybírá', 'chosen by')}</th><th class="n">${L('zobrazení', 'impressions')}</th><th class="n">${L('kliknuto', 'clicked')}</th><th class="n">CTR</th><th class="n">${L('dočteno', 'read')}</th></tr>`;
    h += list.map(r => `<tr><td>${esc(SURFACE[r.surface] || r.surface)}</td><td>${esc(ARM[r.engine] || r.engine)}</td><td class="n">${num(r.impressions)}</td>`
      + `<td class="n">${num(r.clicked)}</td><td class="n">${shareTxt(r.clicked, r.impressions)}</td><td class="n">${shareTxt(r.deep, r.clicked)}</td></tr>`).join('');
    for (const [eng, v] of Object.entries(se.byEngine || {})) h += `<tr><td>${L('Hledání', 'Search')}</td><td>${esc(ARM[eng] || eng)}</td><td class="n">${num(v.searches)}</td><td class="n">${num(v.clicked)}</td><td class="n">${shareTxt(v.clicked, v.searches)}</td><td class="n">–</td></tr>`;
    return h + `</table></div><p class="note">${L('Zobrazení = jedno vykreslení police. Kliknuto = do 30 minut otevřená sekce z té police. Dočteno = z kliknutých aspoň polovina sekce.',
      'Impression = one render of a shelf. Clicked = a section from it opened within 30 minutes. Read = of the clicked, at least half of the section seen.')}</p>`;
  }, 'wide');

  slot(g, L('Hledání', 'Search'), async () => {
    const [s, B] = await Promise.all([D.insights(), D.bundle()]);
    const { cTitle } = itemIndex(B);
    const se = s.search;
    let h = `<div class="tiles">${tile(se.searches, L('hledání', 'searches'))}${tile(shareTxt(se.zero, se.searches), L('bez výsledku', 'no result'))}${tile(shareTxt(se.clicked, se.searches), L('s kliknutím', 'with a click'))}</div>`;
    const qs = se.queries || [];
    if (!qs.length) return h + `<p class="note">${L('Dotazy se ukážou, až je napíšou aspoň dvě zařízení.', 'Queries show once at least two devices typed them.')}</p>`;
    h += `<div class="scroll"><table><tr><th>${L('dotaz', 'query')}</th><th class="n">${L('zařízení', 'devices')}</th><th class="n">${L('bez výsledku', 'no result')}</th><th class="n">${L('kliknuto', 'clicked')}</th><th>${L('koncept', 'concept')}</th><th></th></tr>`
      + qs.slice(0, 40).map(q => `<tr><td>${esc(q.q)}</td><td class="n">${num(q.devices)}</td><td class="n${q.zero ? ' hot' : ''}">${num(q.zero)}</td><td class="n">${num(q.clicked)}</td>`
        + `<td>${q.concept ? esc(cTitle.get(q.concept) || q.concept) : '<span class="muted">–</span>'}</td>`
        + `<td>${(q.zero || !q.clicked) ? `<button class="linkbtn" data-act="gap" data-arg="${esc(q.q)}">🌱 ${L('návrh', 'proposal')}</button>${CONFIG.recombee?.enabled ? ` <button class="linkbtn" data-act="synPrefill" data-arg="${esc(q.q)}">≈ ${L('synonymum', 'synonym')}</button>` : ''}` : ''}</td></tr>`).join('')
      + '</table></div>';
    return h + `<p class="note">${L('Jen dotazy aspoň ze dvou zařízení. „Bez výsledku“ a „bez kliknutí“ jsou díry v obsahu nebo ve slovníku: návrh konceptu, nebo synonymum pro Recombee.',
      'Only queries from at least two devices. "No result" and "no click" are gaps in the content or the vocabulary: a concept proposal, or a synonym for Recombee.')}</p>`;
  }, 'wide');

  slot(g, L('Otázky knize, na které neměla odpověď', 'Questions the book could not answer'), async () => {
    const s = await D.insights();
    const a = s.ask, list = (a.questions || []).filter(q => q.unanswered);
    let h = `<div class="tiles">${tile(a.asked, L('otázek', 'questions'))}${tile(shareTxt(a.unanswered, a.asked), L('bez odpovědi', 'unanswered'))}</div>`;
    if (!list.length) return h + `<p class="note">${L('Otázky se ukážou, až stejnou položí aspoň dvě zařízení.', 'Questions show once at least two devices asked the same.')}</p>`;
    return h + `<ul class="list">${list.slice(0, 25).map(q => `<li>${esc(q.q)} <span class="muted">· ${num(q.devices)} ${L('zař.', 'dev.')}</span> <button class="linkbtn" data-act="gap" data-arg="${esc(q.q)}">🌱 ${L('návrh', 'proposal')}</button></li>`).join('')}</ul>`;
  });

  if (CONFIG.recombee?.enabled) slot(g, L('Synonyma hledání (Recombee)', 'Search synonyms (Recombee)'), async () => {
    const r = await rcCall('/synonyms/items/', 'GET', { count: 500 });
    const list = r.synonyms || [];
    return `<p class="lead">${L('Slova, která děti píšou jinak než kniha (např. „heslo“ = „autentizace“). Platí hned pro hledání na Recombee.', 'Words children type differently from the book (e.g. "password" = "authentication"). They apply to the Recombee search at once.')}</p>`
      + `<div class="row"><input id="synTerm" placeholder="${L('co děti píšou', 'what children type')}"><input id="synSyn" placeholder="${L('slovo z knihy', 'the book’s word')}">`
      + `<label class="muted" style="font-size:.8rem"><input type="checkbox" id="synOne"> ${L('jen jedním směrem', 'one way only')}</label>`
      + `<button class="btn primary" data-act="synAdd">＋ ${L('Přidat', 'Add')}</button></div>`
      + (list.length ? `<ul class="list" style="margin-top:.6em">${list.map(x => `<li>${esc(x.term)} ${x.oneWay ? '→' : '↔'} ${esc(x.synonym)} <button class="linkbtn" data-act="synDel" data-arg="${esc(x.id)}">${L('smazat', 'delete')}</button></li>`).join('')}</ul>`
        : `<p class="note">${L('Zatím žádná synonyma.', 'No synonyms yet.')}</p>`);
  });

  slot(g, L('Témata a světy', 'Themes and worlds'), async () => {
    const [s, B] = await Promise.all([D.insights(), D.bundle()]);
    const { at } = itemIndex(B);
    const ch = new Map(), worlds = new Map();
    for (const [id, v] of Object.entries(s.items)) {
      const x = at(id); if (!x) continue;
      const c = ch.get(x.chapter.id) || ch.set(x.chapter.id, { ch: x.chapter, v: 0, d: 0, w: [0, 0, 0, 0, 0] }).get(x.chapter.id);
      c.v += v.v; c.d += v.d; v.w.forEach((n, i) => { c.w[i] += n; });
      const lens = [].concat(x.meta.lens || 'generic')[0];
      if (lens !== 'generic') { const w = worlds.get(lens) || worlds.set(lens, { v: 0, d: 0, w: [0, 0, 0, 0, 0] }).get(lens); w.v += v.v; w.d += v.d; v.w.forEach((n, i) => { w.w[i] += n; }); }
    }
    if (!ch.size) return `<p class="muted">${L('Zatím bez dat.', 'No data yet.')}</p>`;
    const trend = w => { const a = w[0], b = w[1]; return !b ? (a ? '↑' : '') : a > b * 1.2 ? '↑' : a < b * 0.8 ? '↓' : '→'; };
    const row = (label, x) => `<tr><td>${label}</td>${x.w.slice().reverse().map(n => `<td class="n">${num(n)}</td>`).join('')}<td class="n">${trend(x.w)}</td><td class="n">${shareTxt(x.d, x.v)}</td></tr>`;
    const head = `<tr><th></th>${[4, 3, 2, 1, 0].map(i => `<th class="n">${i ? L(`−${i} t.`, `−${i} wk`) : L('tento t.', 'this wk')}</th>`).join('')}<th class="n">${L('trend', 'trend')}</th><th class="n">${L('dočteno', 'read')}</th></tr>`;
    const chRows = [...ch.values()].sort((a, b) => (a.ch.number ?? 99) - (b.ch.number ?? 99)).map(c => row(esc(chapterTitle(c.ch)), c)).join('');
    const wl = CONFIG.facets?.lens?.worldLabels || {};
    const wRows = [...worlds].sort((a, b) => b[1].v - a[1].v).map(([k, x]) => row(esc(wl[k] ? pickLang(wl[k]) : k), x)).join('');
    let h = `<div class="scroll"><table>${head}${chRows}</table></div>`;
    if (wRows) h += `<h3>${L('Světy příkladů', 'Example worlds')}</h3><div class="scroll"><table>${head}${wRows}</table></div>`;
    const cls = Object.entries(s.classes || {});
    if (cls.length) {
      h += `<h3>${L('Třídy (od 5 zařízení): co je nejvíc táhne', 'Classes (5+ devices): what draws them most')}</h3><ul class="list">`
        + cls.map(([code, c]) => {
          const byCh = new Map();
          for (const [id, n] of Object.entries(c.items)) { const x = at(id); if (x) byCh.set(x.chapter.id, (byCh.get(x.chapter.id) || 0) + n); }
          const top = [...byCh].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => esc(chapterTitle(B.book.chapters.find(k => k.id === id))));
          return `<li><code>${esc(code)}</code> <span class="muted">· ${num(c.devices)} ${L('zař.', 'dev.')}</span> ${top.join(' · ')}</li>`;
        }).join('') + '</ul>';
    }
    return h + `<p class="note">${L('Počty zařízení, která v daném týdnu otevřela sekci z kapitoly (jedno zařízení může být ve více sekcích). Dočteno = podíl otevření, kde dítě vidělo aspoň polovinu sekce.',
      'Devices that opened a section of the chapter that week (one device may count in several sections). Read = share of openings where the child saw at least half.')}</p>`;
  }, 'wide');

  slot(g, L('Cesta konceptovým grafem', 'Paths through the concept graph'), async () => {
    const [s, B] = await Promise.all([D.insights(), D.bundle()]);
    const { at, cTitle } = itemIndex(B);
    const C = new Map();
    const cRow = id => C.get(id) || C.set(id, { id, v: 0, d: 0, p: [], entries: 0, exits: 0 }).get(id);
    for (const [id, v] of Object.entries(s.items)) {
      const x = at(id); if (!x || !x.concept) continue;
      const c = cRow(x.concept); c.v += v.v; c.d += v.d; if (v.p != null) c.p.push(v.p);
    }
    for (const [id, n] of Object.entries(s.paths.entries || {})) { const x = at(id); if (x?.concept) cRow(x.concept).entries += n; }
    for (const [id, n] of Object.entries(s.paths.exits || {})) { const x = at(id); if (x?.concept) cRow(x.concept).exits += n; }
    const order = new Map(B.concepts.map((c, i) => [c.id, i]));
    const pairs = new Map();
    for (const p of s.paths.next || []) {
      const a = at(p.from)?.concept, b = at(p.to)?.concept;
      if (!a || !b || a === b) continue;
      pairs.set(a + '>' + b, (pairs.get(a + '>' + b) || 0) + p.devices);
    }
    const drop = [...C.values()].filter(c => c.v >= 5).map(c => ({ ...c, rate: c.d / c.v, stop: c.exits / Math.max(1, c.v) }))
      .sort((a, b) => a.rate - b.rate).slice(0, 10);
    if (!C.size) return `<p class="muted">${L('Zatím bez dat.', 'No data yet.')}</p>`;
    let h = `<div class="grid"><div><h3>${L('Kde děti odpadají (od 5 otevření)', 'Where children drop off (5+ openings)')}</h3>`
      + (drop.length ? `<table><tr><th>${L('koncept', 'concept')}</th><th class="n">${L('otevřeno', 'opened')}</th><th class="n">${L('dočteno', 'read')}</th><th class="n">${L('tady končí', 'ends here')}</th></tr>`
        + drop.map(c => `<tr><td>${(a => a ? `<button class="linkbtn" data-act="preview" data-arg="${esc(a)}">${esc(cTitle.get(c.id) || c.id)}</button>` : esc(cTitle.get(c.id) || c.id))(B.concepts.find(k => k.id === c.id)?.anchor)}</td><td class="n">${num(c.v)}</td><td class="n${c.rate < 0.4 ? ' hot' : ''}">${shareTxt(c.d, c.v)}</td><td class="n">${shareTxt(c.exits, c.v)}</td></tr>`).join('') + '</table>'
        : `<p class="muted">${L('Zatím žádný koncept s 5 otevřeními.', 'No concept with 5 openings yet.')}</p>`)
      + `</div><div><h3>${L('Nejčastější další krok', 'Most common next step')}</h3>`;
    const top = [...pairs].sort((a, b) => b[1] - a[1]).slice(0, 12);
    h += top.length ? `<table><tr><th>${L('z konceptu', 'from')}</th><th>${L('do konceptu', 'to')}</th><th class="n">${L('zařízení', 'devices')}</th></tr>`
      + top.map(([k, n]) => { const [a, b] = k.split('>'); const back = (order.get(b) ?? 0) < (order.get(a) ?? 0);
        return `<tr><td>${esc(cTitle.get(a) || a)}</td><td>${esc(cTitle.get(b) || b)}${back ? ` <span class="chip">${L('zpět', 'back')}</span>` : ''}</td><td class="n">${num(n)}</td></tr>`; }).join('') + '</table>'
      : `<p class="muted">${L('Přechody se ukážou, až je udělají aspoň dvě zařízení.', 'Steps show once at least two devices made them.')}</p>`;
    return h + `</div></div><p class="note">${L('„Tady končí“ = podíl otevření, po kterých dítě v tom sezení už nic dalšího neotevřelo. „Zpět“ = krok ke konceptu, který je v knize dřív.',
      '"Ends here" = share of openings after which the child opened nothing else in that sitting. "Back" = a step to a concept earlier in the book.')}</p>`;
  }, 'wide');

  slot(g, L('Která podání fungují', 'Which tellings work'), async () => {
    const [s, B] = await Promise.all([D.insights(), D.bundle()]);
    const { at } = itemIndex(B);
    const dims = Object.keys(CONFIG.facets || {}).filter(d => ['lens', 'visuality', 'depth', 'genre', 'lengthBand'].includes(d));
    const F = {};
    for (const [id, v] of Object.entries(s.items)) {
      const x = at(id); if (!x || x.meta.type !== 'spine') continue;
      for (const d of dims) {
        const val = [].concat(x.meta[d] || (d === 'lens' ? 'generic' : '–'))[0];
        const f = (F[d] = F[d] || {})[val] || (F[d][val] = { v: 0, d: 0, p: [] });
        f.v += v.v; f.d += v.d; if (v.p != null) f.p.push(v.p);
      }
    }
    const words = CONFIG.facetWords || {};
    const lab = (d, v) => T(pickLang(words[d]?.[v])) || pickLang(CONFIG.facets?.lens?.worldLabels?.[v]) || v;
    const blocks = dims.filter(d => F[d] && Object.keys(F[d]).length > 1).map(d => `<div><h3>${esc(L(FACET_CS[d], '') || pickLang(CONFIG.facets[d].label) || d)}</h3><table>`
      + `<tr><th></th><th class="n">${L('otevřeno', 'opened')}</th><th class="n">${L('dočteno', 'read')}</th><th class="n">${L('průměrně vidět', 'mean seen')}</th></tr>`
      + Object.entries(F[d]).sort((a, b) => b[1].v - a[1].v).map(([val, f]) => `<tr><td>${esc(lab(d, val))}</td><td class="n">${num(f.v)}</td><td class="n">${shareTxt(f.d, f.v)}</td>`
        + `<td class="n">${f.p.length ? Math.round(100 * f.p.reduce((a, b) => a + b, 0) / f.p.length) + ' %' : '–'}</td></tr>`).join('') + '</table></div>').join('');
    const fresh = Object.entries(s.items).map(([id, v]) => ({ x: at(id), v })).filter(o => o.x?.meta.publishedAt && Date.now() - Date.parse(o.x.meta.publishedAt) < 21 * 864e5);
    return (blocks ? `<div class="grid">${blocks}</div>` : `<p class="muted">${L('Zatím bez dat.', 'No data yet.')}</p>`)
      + (fresh.length ? `<h3>${L('Nová podání (3 týdny)', 'New tellings (3 weeks)')}</h3><ul class="list">${fresh.map(o => `<li>${esc(o.x.meta.title || o.x.meta.id)} <span class="muted">· ${num(o.v.v)} ${L('otevřeno', 'opened')}, ${shareTxt(o.v.d, o.v.v)} ${L('dočteno', 'read')}</span></li>`).join('')}</ul>` : '')
      + `<p class="note">${L('Podle toho, jaká podání děti dočítají, se dá rozhodnout, co generovat a psát dál.', 'Which tellings children read to the end tells what to generate and write next.')}</p>`;
  }, 'wide');

  if (CONFIG.recombee?.enabled) slot(g, L('Recombee: scénáře', 'Recombee: scenarios'), async () => {
    const list = await rcCall('/scenarios/', 'GET').catch(() => []);
    const have = new Map((Array.isArray(list) ? list : []).map(x => [x.id, x.endpoint]));
    const db = CONFIG.recombee.database || '';
    return `<table><tr><th>${L('scénář', 'scenario')}</th><th>${L('typ', 'type')}</th><th>${L('v knize', 'in the book')}</th><th></th></tr>`
      + RC_SCENARIOS.map(([id, type, where]) => `<tr><td><code>${esc(id)}</code></td><td>${esc(type)}</td><td>${esc(where)}</td><td>${have.has(id) ? '<span class="chip ok">✓</span>' : `<span class="chip">${L('zatím nepoužitý', 'not used yet')}</span>`}</td></tr>`).join('')
      + `</table><p class="note">${L('Segmentové scénáře potřebují v Recombee nastavenou segmentaci (popis v SCENARIOS.md enginu). Výkon scénářů a vlastní přehledy Recombee:', 'Segment scenarios need their segmentation set in Recombee (engine SCENARIOS.md). Scenario performance and Recombee’s own insights:')}`
      + ` <a href="https://admin.recombee.com/databases/${encodeURIComponent(db)}/kpi" target="_blank" rel="noopener">KPI</a> · <a href="https://admin.recombee.com/databases/${encodeURIComponent(db)}/insights" target="_blank" rel="noopener">Insights</a>.</p>`;
  });
}
ACT.gap = q => {
  navigator.clipboard?.writeText(q).catch(() => {});
  location.hash = '#wishes';
  toast(L('Dotaz je ve schránce: vlož ho do „Nový návrh“.', 'The query is on the clipboard: paste it into "New proposal".'));
};
ACT.synPrefill = q => { const t = $('#synTerm'); if (t) { t.value = q; $('#synSyn').focus(); t.scrollIntoView({ block: 'center' }); } };
ACT.synAdd = async (a, btn) => {
  const term = $('#synTerm').value.trim(), synonym = $('#synSyn').value.trim();
  if (!term || !synonym) return;
  btn.disabled = true;
  try { await rcCall('/synonyms/items/', 'POST', { term, synonym, oneWay: $('#synOne').checked }); toast('✓'); route(); }
  catch (e) { toast(L('Nepovedlo se: ', 'Failed: ') + e.message); }
  btn.disabled = false;
};
ACT.synDel = async id => {
  try { await rcCall('/synonyms/items/' + encodeURIComponent(id), 'DELETE'); route(); }
  catch (e) { toast(L('Nepovedlo se: ', 'Failed: ') + e.message); }
};

// ---------- 🗂 data ----------
function viewData(m) {
  m.innerHTML = '<div class="grid"></div>';
  const g = m.firstChild;
  slot(g, L('Profily pro Tiny', 'Profiles for Tiny'), async () => {
    if (!CONFIG.tiny?.profile) return `<p class="muted">${L('V této knize je profil pro Tiny vypnutý (CONFIG.tiny).', 'This book has the Tiny profile turned off (CONFIG.tiny).')}</p>`;
    return `<p class="lead">${L('Každý čtenář má souhrn pokroku ve tvaru metadata.pbook v1: přečtená, pochopená a udržená jádra, splněné mise, úroveň a oblíbené světy. Žádný vlastní text, jméno ani e-mail.',
      'Every reader has a progress summary in the metadata.pbook v1 shape: cores read, understood and kept, missions passed, level and favourite worlds. No free text, name or e-mail.')}</p>`
      + (ADMIN ? `<button class="btn primary" data-act="tinyExport">⬇ ${L('Stáhnout profily (JSON)', 'Download profiles (JSON)')}</button> <span id="tinyN" class="muted"></span>`
        : `<p class="muted">🔒 ${L('Stažení potřebuje klíč editora.', 'Downloading needs the editor key.')}</p>`);
  });
  slot(g, L('Záznamy', 'Events'), async () => `<p class="lead">${L('Posledních nejvýš 1 000 záznamů této knihy. Celou tabulku vyexportuješ v Supabase.', 'The latest 1,000 events of this book at most. Export the whole table in Supabase.')}</p>`
    + `<button class="btn" data-act="logExport">⬇ ${L('Stáhnout záznamy (JSON)', 'Download events (JSON)')}</button>`
    + (ADMIN ? '' : `<p class="note">${L('Bez klíče jsou texty čtenářů skryté.', 'Without the key, readers’ texts are hidden.')}</p>`));
  slot(g, 'Recombee', async () => CONFIG.recombee?.enabled
    ? `<p class="lead">${L('Doporučování a hledání pro', 'Recommendations and search for')} ${Math.round(100 * Number(CONFIG.recombee.abShare ?? 1))} % ${L('zařízení běží přes Recombee', 'of devices run on Recombee')} (<code>${esc(CONFIG.recombee.database || '')}</code>); ${L('interakce dostává ze všech zařízení. Srovnání skupin je v Insights.', 'it gets the interactions of every device. The arms are compared in Insights.')}</p>`
      + `<p class="note">${L('Katalog, vlastnosti a segmentace (koncept, kapitola, svět) se pošlou po každém nasazení samy (GitHub Action). Ručně:', 'The catalog, properties and segmentations (concept, chapter, world) are sent after every deployment (GitHub Action). By hand:')}</p>`
      + (ADMIN ? `<button class="btn primary" data-act="sync">🔄 ${L('Synchronizovat obsah', 'Sync the content')}</button> <span id="syncOut" class="muted"></span>` : `<p class="muted">🔒 ${L('Potřebuje klíč editora.', 'Needs the editor key.')}</p>`)
    : `<p class="lead">${L('Vypnuté: doporučuje se v prohlížeči čtenáře a interakce se ukládají jen do Supabase.', 'Off: recommendations run in the reader’s browser and interactions go to Supabase only.')}</p>`
      + `<p class="note">${L('Zapnutí: ve Vercelu proměnné RECOMBEE_DB, RECOMBEE_TOKEN, RECOMBEE_REGION a PBOOK_ORIGINS, v js/config.js recombee.enabled: true (a abShare pro A/B), nasadit a tady synchronizovat obsah. Segmentové scénáře nastav podle SCENARIOS.md.',
        'To turn it on: set RECOMBEE_DB, RECOMBEE_TOKEN, RECOMBEE_REGION and PBOOK_ORIGINS in Vercel, recombee.enabled: true in js/config.js (and abShare for the A/B), deploy, then sync the content here. Set up the segment scenarios as SCENARIOS.md says.')}</p>`);
  slot(g, L('Pozvat editora', 'Invite an editor'), async () => `<p class="lead">${L('Odkaz zapne v knize roli editora a ukáže průvodce pro editory.', 'The link turns on the editor role in the book and shows the editor guide.')}</p>`
    + `<button class="btn" data-act="invite">＋ ${L('Vytvořit odkaz', 'Create a link')}</button><div id="inviteOut" style="margin-top:.5em"></div>`);
  slot(g, L('Odkazy', 'Links'), async () => {
    const ucitel = await fetch('/ucitel', { method: 'HEAD' }).then(r => r.ok).catch(() => false);
    return `<ul class="list"><li><a href="/" target="_blank" rel="noopener">📖 ${L('Kniha', 'The book')}</a></li>`
      + (ucitel ? `<li><a href="/ucitel" target="_blank" rel="noopener">🏫 ${L('Stránka pro učitele (kód třídy, dotazník)', 'Teacher page (class code, survey)')}</a></li>` : '')
      + (CONFIG.book?.issuesUrl ? `<li><a href="${esc(CONFIG.book.issuesUrl)}" target="_blank" rel="noopener">🐞 ${L('Hlášení chyb (GitHub)', 'Issues (GitHub)')}</a></li>` : '') + '</ul>';
  });
}
ACT.tinyExport = async (a, btn) => {
  btn.disabled = true;
  try {
    const list = await getJSON(logUrl('profiles=1'), withKey());
    download(`tiny-profily-${BOOK}-${new Date().toISOString().slice(0, 10)}.json`,
      JSON.stringify({ format: 'metadata.pbook', v: 1, book: BOOK, exportedAt: new Date().toISOString(), profiles: list }, null, 2));
    $('#tinyN').textContent = `${num(list.length)} ${plural(list.length, L('profil', 'profile'), L('profily', 'profiles'), L('profilů', 'profiles'))}`;
  } catch (e) { alert(L('Stažení se nepovedlo: ', 'Download failed: ') + e.message); }
  btn.disabled = false;
};
ACT.logExport = async () => {
  const rows = await getJSON(logUrl(''), withKey()).catch(() => []);
  download(`zaznamy-${BOOK}-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(rows, null, 1));
};
ACT.sync = async (a, btn) => {
  btn.disabled = true;
  const out = $('#syncOut');
  out.textContent = L('Posílám…', 'Sending…');
  try {
    const r = await fetch('/api/sync-recombee', withKey({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }));
    const d = await r.json().catch(() => ({}));
    const segs = d.segmentations ? Object.entries(d.segmentations).filter(([, st]) => st >= 400 && st !== 409).map(([k]) => k) : [];
    out.textContent = d.ok ? `✓ ${num(d.imported)} / ${num(d.total)}${d.errors ? ` · ${num(d.errors)} ${L('chyb', 'errors')}` : ''}${segs.length ? ` · ${L('segmentace selhala', 'segmentation failed')}: ${segs.join(', ')}` : ''}` : `✗ ${d.error || r.status}`;
  } catch (e) { out.textContent = '✗ ' + e.message; }
  btn.disabled = false;
};
ACT.invite = () => {
  const code = 'E-' + Array.from(crypto.getRandomValues(new Uint8Array(4)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 6).toUpperCase();
  const url = `${location.origin}/?invite=${code}`;
  $('#inviteOut').innerHTML = `<code style="user-select:all;word-break:break-all">${esc(url)}</code> <button class="btn" data-act="copy" data-arg="${esc(url)}">${L('Kopírovat', 'Copy')}</button>`;
};
ACT.copy = (text, btn) => { navigator.clipboard?.writeText(text).then(() => { btn.textContent = '✓'; }); };

// ---------- start ----------
(async () => {
  const c = await checkKey();
  if (c && c.admin) { ADMIN = true; boot(); return; }
  showGate(c, KEY ? L('Uložený klíč už neplatí.', 'The saved key is no longer valid.') : '');
})();
</script>
</body>
