<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p-book Admin — Content & Marketing Pipeline</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#f3f4f6;--surface:#fff;--text:#111827;--text2:#6b7280;--text3:#9ca3af;--border:#e5e7eb;--accent:#d97706;--accent-bg:#fef3c7;--eng:#2563eb;--prod:#059669;--biz:#d97706;--side:#7c3aed;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06);--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent);text-decoration:none}

/* Layout */
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:52px 1fr;height:100vh;overflow:hidden}
.header{grid-column:1/-1;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.2em;gap:.8em;z-index:10}
.header h1{font-size:.85rem;font-weight:700;color:var(--accent);white-space:nowrap}
.header nav{display:flex;gap:.2em}
.header nav button{padding:.4em .7em;border-radius:6px;font-size:.78rem;font-weight:600;color:var(--text2);transition:all .15s}
.header nav button:hover{background:var(--border)}
.header nav button.active{background:var(--accent-bg);color:var(--accent)}
.spacer{flex:1}
.hstat{font-size:.72rem;color:var(--text3)}

/* Sidebar */
.sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:.8em;font-size:.78rem}
.sf-title{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:1em 0 .4em}
.sf-item{display:flex;align-items:center;gap:.4em;padding:.3em .5em;border-radius:5px;cursor:pointer;transition:background .12s}
.sf-item:hover{background:var(--accent-bg)}
.sf-item.active{background:var(--accent-bg);font-weight:600;color:var(--accent)}
.sf-count{margin-left:auto;font-size:.62rem;color:var(--text3);background:var(--border);padding:.1em .4em;border-radius:8px}
.sf-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sf-pipe{display:flex;align-items:center;gap:.3em;padding:.25em .5em;border-radius:5px;cursor:pointer;font-size:.75rem;transition:background .12s}
.sf-pipe:hover{background:var(--accent-bg)}
.sf-pipe .sf-dot{width:8px;height:8px}
.sf-pipe.active{background:var(--accent-bg);font-weight:600}

/* Main */
.main{overflow-y:auto;padding:1.5em}

/* Cards grid */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.8em;margin-bottom:1.5em}
.cg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8em;text-align:center}
.cg-card h4{font-size:.62rem;font-weight:600;text-transform:uppercase;color:var(--text3);margin-bottom:.3em}
.cg-num{font-size:1.6rem;font-weight:800;color:var(--accent)}
.cg-sub{font-size:.7rem;color:var(--text2)}

/* Status dots everywhere */
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.sdot-draft{background:#d1d5db}.sdot-review{background:#fbbf24}.sdot-approved{background:#60a5fa}.sdot-published{background:#34d399}.sdot-none{background:transparent;border:1.5px dashed #d1d5db}

/* Content list */
.cl{display:flex;flex-direction:column;gap:.4em}
.cl-item{display:grid;grid-template-columns:8px 2.5em 1fr auto auto auto auto;gap:.6em;align-items:center;padding:.55em .7em;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .12s;font-size:.8rem}
.cl-item:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cl-ch{font-size:.65rem;color:var(--text3);font-weight:600}
.cl-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-voice{font-size:.6rem;font-weight:700;text-transform:uppercase;padding:.12em .4em;border-radius:3px;color:#fff}
.cl-pillar{font-size:.6rem;padding:.12em .4em;border-radius:3px;border:1px solid var(--border);color:var(--text2);max-width:10em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-stdc{font-size:.6rem;font-weight:600;padding:.1em .35em;border-radius:3px}
.cl-actions{display:flex;gap:.2em}
.cl-act{font-size:.85rem;padding:.15em .25em;border-radius:4px;transition:background .12s;color:var(--text3)}
.cl-act:hover{background:var(--accent-bg);color:var(--accent)}

/* Detail / Editor - full right panel */
.editor{position:fixed;top:52px;right:0;bottom:0;width:560px;background:var(--surface);border-left:1px solid var(--border);box-shadow:-4px 0 20px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .25s ease;z-index:100;display:flex;flex-direction:column;overflow:hidden}
.editor.open{transform:translateX(0)}
.ed-head{padding:.8em 1.2em;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.6em;flex-shrink:0}
.ed-head h2{font-size:1rem;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-close{font-size:1.1rem;color:var(--text3);padding:.3em}
.ed-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.ed-tab{padding:.5em 1em;font-size:.78rem;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;transition:all .12s}
.ed-tab:hover{color:var(--text)}
.ed-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.ed-body{flex:1;overflow-y:auto;padding:1.2em}
.ed-section{margin-bottom:1.2em}
.ed-label{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin-bottom:.4em}
.ed-tags{display:flex;flex-wrap:wrap;gap:.3em}
.ed-tag{font-size:.72rem;padding:.3em .7em;border-radius:6px;border:1.5px solid var(--border);color:var(--text2);transition:all .12s}
.ed-tag:hover{border-color:var(--text2)}
.ed-tag.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}

/* Content preview — styled like reader */
.ed-preview{background:#fff;border:1px solid var(--border);border-radius:8px;padding:1.2em;font-size:.88rem;line-height:1.7;max-height:500px;overflow-y:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.ed-preview p{margin-bottom:.8em}
.ed-preview h2,.ed-preview h3,.ed-preview h4{font-weight:700;margin:1em 0 .4em}
.ed-preview h2{font-size:1.1rem} .ed-preview h3{font-size:.95rem} .ed-preview h4{font-size:.88rem}
.ed-preview ul,.ed-preview ol{padding-left:1.4em;margin-bottom:.8em}
.ed-preview li{margin-bottom:.3em}
.ed-preview strong{font-weight:700}
.ed-preview em{font-style:italic}
.ed-preview code{font-family:monospace;font-size:.82rem;background:#f3f4f6;padding:.1em .3em;border-radius:3px}
.ed-preview pre{background:#f3f4f6;padding:.8em;border-radius:6px;overflow-x:auto;margin:.8em 0}
.ed-preview blockquote{border-left:3px solid var(--accent);padding-left:.8em;color:var(--text2);margin:.8em 0}
.ed-preview table{width:100%;border-collapse:collapse;margin:.8em 0;font-size:.8rem}
.ed-preview th,.ed-preview td{border:1px solid var(--border);padding:.4em .6em;text-align:left}
.ed-preview th{background:#f9fafb;font-weight:600}
.ed-preview hr{border:none;border-top:1px solid var(--border);margin:1em 0}
.ed-preview img{max-width:100%;border-radius:6px}

/* Social output */
.ed-output{width:100%;min-height:200px;border:1px solid var(--border);border-radius:8px;padding:.8em;font-family:var(--font);font-size:.82rem;line-height:1.5;resize:vertical;background:var(--bg);color:var(--text)}
.ed-format-tabs{display:flex;gap:.2em;flex-wrap:wrap;margin-bottom:.6em}
.ed-fmt{font-size:.7rem;padding:.3em .6em;border-radius:5px;border:1.5px solid var(--border);color:var(--text2)}
.ed-fmt.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.ed-fmt .fmt-rec{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:.2em}
.ed-btn-row{display:flex;gap:.4em;margin-top:.6em;flex-wrap:wrap}
.ed-btn{font-size:.75rem;padding:.4em .8em;border-radius:6px;font-weight:600;border:1.5px solid var(--border);color:var(--text2);transition:all .12s}
.ed-btn:hover{border-color:var(--accent);color:var(--accent)}
.ed-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.ed-btn-primary:hover{background:#b45309}
.ed-btn-push{background:#059669;color:#fff;border-color:#059669}

/* Workflow notes */
.ed-notes{width:100%;min-height:80px;border:1px solid var(--border);border-radius:8px;padding:.6em;font-family:var(--font);font-size:.8rem;resize:vertical;background:var(--surface)}
.ed-history{max-height:200px;overflow-y:auto}
.ed-history-item{padding:.4em 0;border-bottom:1px solid var(--border);font-size:.75rem}
.ed-history-item:last-child{border:none}
.ed-history-meta{font-size:.65rem;color:var(--text3)}

/* Pipeline kanban */
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:.6em;min-height:400px}
.pcol{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.6em;display:flex;flex-direction:column}
.pcol-head{font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:.6em;display:flex;justify-content:space-between;align-items:center;padding-bottom:.4em;border-bottom:2px solid var(--border)}
.pcol-head.draft{border-color:#d1d5db}.pcol-head.review{border-color:#fbbf24}.pcol-head.approved{border-color:#60a5fa}.pcol-head.ready{border-color:#a78bfa}.pcol-head.published{border-color:#34d399}
.pcol-count{background:var(--border);padding:.1em .4em;border-radius:8px;font-size:.6rem}
.pcol-list{flex:1;display:flex;flex-direction:column;gap:.3em;overflow-y:auto}
.pcard{padding:.5em;background:var(--bg);border-radius:6px;cursor:pointer;border-left:3px solid var(--border);transition:all .12s;font-size:.75rem}
.pcard:hover{border-left-color:var(--accent);background:var(--accent-bg)}
.pcard-title{font-weight:600;margin-bottom:.15em;line-height:1.2}
.pcard-meta{font-size:.62rem;color:var(--text3);display:flex;gap:.4em;flex-wrap:wrap}
.pcard-meta .cl-voice{font-size:.55rem}

/* Toast */
.toast{position:fixed;bottom:1.5em;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:#fff;padding:.6em 1.2em;border-radius:8px;font-size:.82rem;font-weight:600;z-index:999;transition:transform .3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Edit fields */
.ed-fields{display:flex;flex-direction:column;gap:.4em}
.ed-field{display:flex;align-items:center;gap:.5em}
.ed-field label{font-size:.7rem;font-weight:600;color:var(--text3);width:7em;flex-shrink:0}
.ed-field .ed-input{flex:1;padding:.35em .5em;border:1px solid var(--border);border-radius:6px;font-family:var(--font);font-size:.8rem;color:var(--text);background:var(--bg)}
.ed-field .ed-input:focus{border-color:var(--accent);outline:none}
.ed-field select.ed-input{appearance:auto}
.ed-body-edit{width:100%;min-height:350px;border:1px solid var(--border);border-radius:8px;padding:.8em;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.78rem;line-height:1.5;resize:vertical;background:var(--bg);color:var(--text);tab-size:2}
.ed-body-edit:focus{border-color:var(--accent);outline:none}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{display:none}.editor{width:100%}.pipeline{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<!-- Login gate -->
<div id="loginGate" style="position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center">
  <div style="text-align:center;max-width:320px;padding:1em">
    <h1 style="font-size:1.2rem;margin-bottom:.8em">&#128218; p-book Admin</h1>
    <div id="loginForm">
      <input type="password" id="adminPwd" placeholder="Admin password" style="width:100%;padding:.5em;border:1.5px solid var(--border);border-radius:6px;font-size:.9rem;text-align:center" onkeydown="if(event.key==='Enter')checkPwd()">
      <button onclick="checkPwd()" style="margin-top:.5em;width:100%;padding:.5em;background:var(--accent);color:#fff;border:none;border-radius:6px;font-weight:600;font-size:.85rem;cursor:pointer">Enter</button>
      <p style="font-size:.68rem;color:var(--text3);margin-top:.5em">Default password: <b>pbook</b> — change it after first login.</p>
    </div>
    <div id="changePwdForm" style="display:none">
      <p style="font-size:.82rem;color:var(--accent);font-weight:600;margin-bottom:.5em">Set your own password</p>
      <input type="password" id="newPwd1" placeholder="New password" style="width:100%;padding:.5em;border:1.5px solid var(--border);border-radius:6px;font-size:.9rem;text-align:center;margin-bottom:.4em">
      <input type="password" id="newPwd2" placeholder="Confirm password" style="width:100%;padding:.5em;border:1.5px solid var(--border);border-radius:6px;font-size:.9rem;text-align:center" onkeydown="if(event.key==='Enter')savePwd()">
      <button onclick="savePwd()" style="margin-top:.5em;width:100%;padding:.5em;background:var(--accent);color:#fff;border:none;border-radius:6px;font-weight:600;font-size:.85rem;cursor:pointer">Save & continue</button>
      <button onclick="skipPwd()" style="margin-top:.3em;width:100%;padding:.4em;background:none;border:none;font-size:.75rem;color:var(--text3);cursor:pointer">Skip for now</button>
    </div>
    <p id="pwdErr" style="color:#dc2626;font-size:.75rem;margin-top:.3em"></p>
  </div>
</div>
<script>
function hashPwd(pwd){return String(Math.abs(Array.from(new Uint8Array(new TextEncoder().encode(pwd))).reduce((h,b)=>(h*31+b)|0,0)))}
function checkPwd(){
  const pwd=document.getElementById('adminPwd').value;
  const stored=localStorage.getItem('pbook-admin-hash');
  if(!stored && pwd==='pbook'){
    // First login with default password — force change
    document.getElementById('loginForm').style.display='none';
    document.getElementById('changePwdForm').style.display='block';
  } else if(stored && hashPwd(pwd)===stored){
    document.getElementById('loginGate').style.display='none';
    localStorage.setItem('pbook-admin-session','1');
  } else if(!stored && pwd==='pbook'){
    document.getElementById('loginGate').style.display='none';
    localStorage.setItem('pbook-admin-session','1');
  } else {
    document.getElementById('pwdErr').textContent='Wrong password';
  }
}
function savePwd(){
  const p1=document.getElementById('newPwd1').value;
  const p2=document.getElementById('newPwd2').value;
  if(p1.length<3){document.getElementById('pwdErr').textContent='At least 3 characters';return}
  if(p1!==p2){document.getElementById('pwdErr').textContent='Passwords don\'t match';return}
  localStorage.setItem('pbook-admin-hash',hashPwd(p1));
  localStorage.setItem('pbook-admin-session','1');
  document.getElementById('loginGate').style.display='none';
}
function skipPwd(){
  localStorage.setItem('pbook-admin-session','1');
  document.getElementById('loginGate').style.display='none';
}
window.changePwd=function(){
  localStorage.removeItem('pbook-admin-session');
  document.getElementById('loginForm').style.display='none';
  document.getElementById('changePwdForm').style.display='block';
  document.getElementById('loginGate').style.display='flex';
  document.getElementById('newPwd1').focus();
};
if(localStorage.getItem('pbook-admin-session')==='1') document.getElementById('loginGate').style.display='none';
</script>

<div class="app">
  <header class="header">
    <h1>&#128218; p-book Admin</h1>
    <nav id="mainNav"></nav>
    <div class="spacer"></div>
    <a href="/#view-map" target="_blank" style="font-size:.75rem;font-weight:600;padding:.35em .8em;border-radius:6px;background:var(--accent);color:#fff;text-decoration:none" title="new content is written in the book's ✍️ author studio">✍️ Write in book</a>
    <button onclick="showRCSetup()" style="font-size:.75rem;font-weight:600;padding:.35em .8em;border-radius:6px;border:1.5px solid var(--accent);color:var(--accent)">Recombee</button>
    <button onclick="syncRecombee()" id="syncBtn" style="font-size:.75rem;font-weight:600;padding:.35em .8em;border-radius:6px;border:1.5px solid #10B981;color:#10B981">Sync Items</button>
    <button onclick="changePwd()" style="font-size:.65rem;color:var(--text3)">Change password</button>
    <button onclick="localStorage.removeItem('pbook-admin-session');location.reload()" style="font-size:.65rem;color:var(--text3)">Logout</button>
    <span class="hstat" id="hstat"></span>
  </header>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main" id="main"></div>
</div>
<div class="editor" id="editor"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { renderMarkdown } from './js/markdown.js';
window.renderMD = renderMarkdown;

// Tabs follow the content lifecycle: readers create DEMAND → PROPOSALS are
// drafted (AI or by hand) and interest-tested as 🌱 ghost items → reader
// contributions land in REVIEW and get adopted into the served book → HEALTH
// keeps shipped content working → CATALOG is the source of truth → REACH
// measures growth (invites, editors). Writing happens in the book's ✍️ studio.
const TABS = ['📥 Demand','🌱 Proposals','⚡ Review','🩺 Health','📚 Catalog','📈 Reach','⚙️ More'];

let book,allBlocks=[],currentTab='📥 Demand',sideFilter=null,editorBlock=null;
// These must be on window because onclick handlers run in global scope

async function init(){
  book=await(await fetch('content/book.json')).json();
  for(const ch of book.chapters){const dir=`content/${ch.directory}`;for(const f of ch.files){try{const t=await(await fetch(`${dir}/${f}`)).text();const{meta,body}=parseFM(t);allBlocks.push({...meta,body,_ch:ch.id,_cn:ch.number,_ct:ch.title,_f:f})}catch(e){}}}
  document.getElementById('hstat').textContent=`${allBlocks.length} blocks · ${book.chapters.length} chapters`;
  document.getElementById('mainNav').innerHTML=TABS.map(t=>`<button class="${t===currentTab?'active':''}" onclick="ST('${t}')">${t}</button>`).join('');
  renderSidebar();showMain();
}

function parseFM(t){const m=t.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);if(!m)return{meta:{},body:t};const meta={};for(const l of m[1].split('\n')){const kv=l.match(/^(\w[\w-]*)\s*:\s*(.*)/);if(kv){let v=kv[2].trim();if(v==='true')v=true;else if(v==='false')v=false;else if(v==='null')v=null;else if(/^\d+$/.test(v))v=parseInt(v);else v=v.replace(/^["']|["']$/g,'');meta[kv[1]]=v}}return{meta,body:m[2].trim()}}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  let h=`<div class="sf-title">Book</div>`;
  h+=`<div class="sf-pipe ${!sideFilter?'active':''}" onclick="SF(null)"><span class="sf-dot" style="background:var(--accent)"></span> All blocks <span class="sf-count">${allBlocks.length}</span></div>`;

  h+=`<div class="sf-title">Chapters</div>`;
  book.chapters.forEach((ch,i)=>{
    const cnt=(allBlocks.filter(b=>b._cn===ch.number)).length;
    h+=`<div class="sf-item ${sideFilter==='ch'+ch.number?'active':''}" onclick="SF('ch${ch.number}')"><span style="font-weight:700;color:var(--accent);width:1.2em">${ch.number}</span> ${ch.title} <span class="sf-count">${cnt}</span></div>`;
  });

  // Content status counts


  sb.innerHTML=h;
}

window.SF=function(f){
  sideFilter=sideFilter===f?null:f;
  // Switch to Content tab to show filtered results
  if(sideFilter && currentTab!=='Content'){currentTab='Content';document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active',b.textContent==='Content'));}
  renderSidebar();showMain();
};
window.ST=function(t){currentTab=t;document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active',b.textContent===t));showMain()};

function showMain(){
  const m=document.getElementById('main');
  if(currentTab==='📥 Demand')renderDemand(m);
  else if(currentTab==='🌱 Proposals')renderProposals(m);
  else if(currentTab==='⚡ Review')renderCommunity(m);
  else if(currentTab==='🩺 Health')renderHealth(m);
  else if(currentTab==='📚 Catalog')renderCatalog(m);
  else if(currentTab==='📈 Reach')renderReach(m);
  else if(currentTab==='⚙️ More')renderMore(m);
  else renderDemand(m);
}

function renderMore(m){
  m.innerHTML=`<h2 style="font-size:1.05rem;font-weight:800;margin-bottom:.5em">How this works</h2>
    <p style="font-size:.78rem;color:var(--text2);max-width:640px">The pipeline (tabs left → right) mirrors how content is made: readers create <b>Demand</b> (steering misses, concept wishes, goals) → <b>Proposals</b> are drafted by AI or by hand and interest-tested as 🌱 ghost cards → readers' and editors' tellings land in <b>Review</b>, where you adopt them into the served book (state <b>edited</b>/<b>core</b>) or improve them first in the book's ✍️ author studio → <b>Health</b> watches shipped content → <b>Catalog</b> is the source of truth → <b>Reach</b> tracks growth and the editor track.</p>
    <p style="font-size:.75rem;color:var(--text3);max-width:640px">Writing happens in the book itself: open any concept with the ✍️ pencil (or <span style="font-family:var(--mono)">/#autor-&lt;slug&gt;</span>) — live preview, image editing, AI coach. Adopted tellings serve to everyone immediately; the ⬇ .md button gives you the canonical file to commit to git. Guides: <a href="HUMANS.md" target="_blank">HUMANS.md</a> · <a href="AGENTS.md" target="_blank">AGENTS.md</a> · <a href="SCENARIOS.md" target="_blank">SCENARIOS.md</a> (Recombee scenarios per surface — create the missing ones in the <a href="https://admin.recombee.com" target="_blank">Admin UI</a>).</p>`;
}

// ===== COVERAGE — the redakce cockpit (spec §12): concept × lens matrix,
// steering demand from reader logs, community nomination queue =====
const LENSES=['generic','ecommerce','media','social-feeds','education','jobs'];
// subspace-aware: "a|b" sets and "a..b" ranges count for every covered value
const LENS_ORDER=LENSES;
function facetCovers(raw,val,allVals){
  if(!raw)return val==='generic';
  const s=String(raw);
  if(s.includes('..')){const[a,b]=s.split('..');const i=allVals.indexOf(a.trim()),j=allVals.indexOf(b.trim()),t=allVals.indexOf(val);return i>=0&&j>=i&&t>=i&&t<=j}
  return s.split('|').map(x=>x.trim()).includes(val);
}
const ADOPTION_K=5; // distinct readers with positive signal → nominated (spec §7)
let _concepts=null,_commItems=null,_logRows=null;

let _logRowsP=null;
function getLogRows(){                       // ONE shared fetch for every tab
  if(_logRows)return Promise.resolve(_logRows);
  if(!_logRowsP)_logRowsP=fetch('/api/log').then(r=>r.ok?r.json():[]).then(x=>{_logRows=Array.isArray(x)?x:[];return _logRows}).catch(()=>{_logRows=[];return _logRows});
  return _logRowsP;
}
async function _loadCoverageData(){
  await Promise.all([                        // parallel, not a waterfall
    (async()=>{if(!_concepts){try{_concepts=(await(await fetch('content/concepts.json')).json()).concepts||[]}catch(e){_concepts=[]}}})(),
    (async()=>{if(!_commItems){
      try{
        const r=await fetch('/api/recs',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({endpoint:'/recomms/users/admin-console/items/',method:'POST',
            body:{filter:`('state' == "community" OR 'state' == "edited" OR 'state' == "core") AND 'sharedAs' != null`,returnProperties:true,count:200,cascadeCreate:true}})});
        const d=r.ok?await r.json():{};
        _commItems=Array.isArray(d)?d:(d.recomms||[]).map(x=>({itemId:x.id,...(x.values||{})}));
      }catch(e){_commItems=[]}
    }})(),
    getLogRows(),
  ]);
}

window.downloadTellingSkeleton=function(conceptId,dim,val){

  const f={lens:'generic',depth:'standard',visuality:'text-first',formalism:'none',lengthBand:'standard',genre:'explainer',lang:'en'};
  if(dim in f)f[dim]=val;
  const slugVal=String(val).replace(/[^a-z0-9]+/gi,'-');
  const md=`---
id: ${conceptId}-${slugVal}-draft
type: spine
title: "${(c.title||conceptId)} — ${val} telling (DRAFT)"
readingTime: 3
standalone: true
core: false
status: draft
voice: universal
concept: ${conceptId}
recallQ: "${(c.contract?.recallQ||'').replace(/"/g,"'")}"
recallA: "${(c.contract?.recallA||'').replace(/"/g,"'")}"
state: edited
lens: ${f.lens}
visuality: ${f.visuality}
depth: ${f.depth}
formalism: ${f.formalism}
lengthBand: ${f.lengthBand}
genre: ${f.genre}
lang: ${f.lang}
---

<!-- DRAFT skeleton for the ${dim}=${val} gap of concept "${conceptId}".
Contract (every telling must let the reader answer the recallQ):
${(c.contract?.mustCover||[]).map(mc=>'- '+(mc.point||mc)).join('\n')}
Place into content/${c.chapter}/NN?-sidebar-*.md AFTER the anchor, register in book.json, migrate + validate. -->

*(write the ${val} telling here)*
`;

async function renderDemand(m){
  m.innerHTML='<div style="padding:2em;color:var(--text3)">Loading reader demand (logs)…</div>';
  await _loadCoverageData();
  const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  h+='<p style="font-size:.75rem;color:var(--text3);margin-bottom:.8em">Reader demand allocates editorial attention. Three streams: unmet steering (missing tellings), concept wishes (missing concepts — feed 🌱 Proposals), and stated learning goals (personal missions).</p>';

  // 1. Steering demand
  const steer=_logRows.filter(r=>r.event==='steer'||r.event==='steer_miss'||(r.data&&(r.data.event==='steer'||r.data.event==='steer_miss')));
  const genReq=_logRows.filter(r=>(r.event||r.data?.event)==='generate_request');
  const missMap={};
  steer.forEach(r=>{
    const d=r.data||r;const ev=d.event||r.event;
    if(ev!=='steer_miss')return;
    const t=d.target||{};const key=`${d.concept||'?'} → ${t.lens||'generic'}·${t.depth||'std'}·${t.visuality||'text'}`;
    missMap[key]=missMap[key]||{n:0,users:new Set()};missMap[key].n++;missMap[key].users.add(r.user_id||d.userId||'?');
  });
  const misses=Object.entries(missMap).sort((a,b)=>b[1].users.size-a[1].users.size).slice(0,15);
  h+='<h3 style="font-size:.9rem;font-weight:700;margin:1em 0 .5em">Missing tellings — the to-write list</h3>';
  h+=`<p style="font-size:.72rem;color:var(--text3)">Steer events: ${steer.length} · generate requests: ${genReq.length}. Ranked by distinct readers.</p>`;
  h+=misses.length?('<table style="font-size:.72rem;border-collapse:collapse;width:100%">'+misses.map(([k,v])=>`<tr><td style="padding:.25em .5em;border-top:1px solid var(--border)">${esc(k)}</td><td style="padding:.25em .5em;border-top:1px solid var(--border);text-align:right">${v.users.size} readers · ${v.n}×</td></tr>`).join('')+'</table>'):'<p style="font-size:.75rem;color:var(--text3)">No unmet steering demand logged yet.</p>';

  // 2. Concept wishes
  const wishes=_logRows.filter(r=>(r.event==='concept_wish'||r.data?.event==='concept_wish'));
  const wishTexts={};
  wishes.forEach(r=>{const d=r.data?.data||r.data||{};const txt=(d.text||'').trim();if(!txt)return;
    (wishTexts[txt.toLowerCase()]=wishTexts[txt.toLowerCase()]||{text:txt,users:new Set()}).users.add(r.userId||r.data?.userId||'?');});
  const wishList=Object.values(wishTexts).sort((x,y)=>y.users.size-x.users.size);
  // 🪞 Post-exam reflections: liked/disliked per block + tap-suggestions + notes
  const refl=(_logRows||[]).filter(r=>(r.event||r.data?.event)==='mission_reflection').map(r=>r.data?.data||r.data||{});
  if(refl.length){
    const agg={};const sugg={};const notes=[];
    refl.forEach(d=>{
      (d.liked||[]).forEach(id=>{(agg[id]=agg[id]||{l:0,d:0}).l++;});
      (d.disliked||[]).forEach(id=>{(agg[id]=agg[id]||{l:0,d:0}).d++;});
      (d.suggestions||[]).forEach(x=>{sugg[x]=(sugg[x]||0)+1;});
      if(d.note)notes.push({note:d.note,mission:d.mission,score:d.score});
    });
    h+='<h3 style="font-size:.9rem;font-weight:700;margin:1.2em 0 .4em">🪞 Post-exam reflections ('+refl.length+')</h3>';
    h+='<p style="font-size:.7rem;color:var(--text3);margin-bottom:.4em">Fresh impressions right after the boss exam — liked/disliked blocks, tap-suggestions and free-text notes. All feed the demand signals for AI drafting.</p>';
    const rows=Object.entries(agg).sort((a,b)=>(b[1].d-b[1].l)-(a[1].d-a[1].l));
    if(rows.length){
      h+='<div style="font-size:.74rem">'+rows.map(([id,c])=>{
        const b2=allBlocks.find(x=>x.id===id);
        return `<div style="display:flex;gap:.5em;padding:.15em 0;border-bottom:1px dashed var(--border)"><span style="flex:1">${esc(b2?.title||id)}</span><span style="color:#10B981">👍 ${c.l}</span><span style="color:#EF4444">👎 ${c.d}</span></div>`;
      }).join('')+'</div>';
    }
    if(Object.keys(sugg).length){
      h+='<div style="margin-top:.4em;font-size:.72rem"><b>Tap-suggestions:</b> '+Object.entries(sugg).sort((a,b)=>b[1]-a[1]).map(([x,n])=>`<span style="border:1px solid var(--border);border-radius:999px;padding:.05em .5em;margin:.1em">${esc(x)} <b>${n}</b></span>`).join(' ')+'</div>';
    }
    if(notes.length){
      h+='<div style="margin-top:.4em;font-size:.72rem">'+notes.slice(-10).reverse().map(n=>`<div style="padding:.12em 0">📝 „${esc(n.note)}" <span style="color:var(--text3)">(${esc(n.mission||'?')}${n.score?` · ${n.score}/100`:''})</span></div>`).join('')+'</div>';
    }
  }
  h+='<h3 style="font-size:.9rem;font-weight:700;margin:1.2em 0 .4em">Missing concepts — reader wishes</h3>';
  h+=wishList.length?`<div style="font-size:.72rem;margin-bottom:.4em">${wishList.slice(0,15).map(w=>`<div>· "${esc(w.text)}" <span style="color:var(--text3)">(${w.users.size} reader${w.users.size>1?'s':''})</span></div>`).join('')}</div><p style="font-size:.7rem;color:var(--text3)">Draft contracts from these in <a href="#" onclick="ST('🌱 Proposals');return false">🌱 Proposals</a>.</p>`
    :'<p style="font-size:.72rem;color:var(--text3)">No reader concept wishes logged yet.</p>';

  // 3. Learning goals (personal missions)
  const goals=_logRows.filter(r=>(r.event||r.data?.event)==='personal_mission');
  const goalTexts={};
  goals.forEach(r=>{const d=r.data?.data||r.data||{};const g=(d.goal||'').trim();if(!g)return;
    (goalTexts[g.toLowerCase()]=goalTexts[g.toLowerCase()]||{text:g,n:0}).n++;});
  const goalList=Object.values(goalTexts).sort((a,b)=>b.n-a.n).slice(0,15);
  h+='<h3 style="font-size:.9rem;font-weight:700;margin:1.2em 0 .4em">Learning goals — what readers came to learn</h3>';
  h+=goalList.length?`<div style="font-size:.72rem">${goalList.map(g=>`<div>· "${esc(g.text)}" <span style="color:var(--text3)">(${g.n}×)</span></div>`).join('')}</div>`
    :'<p style="font-size:.72rem;color:var(--text3)">No personal-mission goals logged yet.</p>';
  m.innerHTML=h;
}

async function renderCommunity(m){
  m.innerHTML='<div style="padding:2em;color:var(--text3)">Loading community layer…</div>';
  await _loadCoverageData();
  const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const commSignals={};
  _logRows.forEach(r=>{
    const id=r.item_id||r.data?.itemId;if(!id||!String(id).startsWith('gen--'))return;
    commSignals[id]=commSignals[id]||{views:new Set(),likes:new Set()};
    if(r.type==='detailview')commSignals[id].views.add(r.user_id);
    if(r.type==='rating'&&(r.rating>=0.7))commSignals[id].likes.add(r.user_id);
  });
  // Durable content archive (Supabase block_saved events) — the truth about what
  // readers create; Recombee items are the serving copy. Merge both, archive wins.
  const archived={};
  const edits=[];
  _logRows.forEach(r=>{
    if((r.event||r.data?.event)!=='block_saved')return;
    const d=r.data||{};
    const rec={itemId:d.blockId,title:d.title,concept:d.concept,body:d.body,svg:d.svg,bodyLen:d.bodyLen,hasSvg:d.hasSvg,
      remixOf:d.remixOf,remixLog:JSON.stringify(d.remixLog||[]),sharedAs:d.sharedAs||'anonymous',
      lens:d.facets?.lens,depth:d.facets?.depth,visuality:d.facets?.visuality,
      action:d.action,state:d.state,user:(d.userId||r.user_id||'?').slice(-8),ts:d.ts||r.server_ts};
    edits.push(rec);
    if(d.action==='shared'||d.state==='community'){
      if(!archived[rec.itemId]||archived[rec.itemId].ts<rec.ts)archived[rec.itemId]=rec;
    }
  });
  const commMap={};
  _commItems.forEach(i=>{commMap[i.itemId]=i;});
  Object.values(archived).forEach(a2=>{commMap[a2.itemId]={...commMap[a2.itemId],...a2};});
  const merged=Object.values(commMap);

  const nominated=merged.map(i=>{
    const s=commSignals[i.itemId]||{views:new Set(),likes:new Set()};
    return {item:i,readers:s.views.size,likes:s.likes.size,score:s.likes.size*3+s.views.size};
  }).sort((a,b)=>b.score-a.score);
  let h=`<h2 style="font-size:1.15rem;font-weight:800;margin-bottom:.3em">⚡ Review — reader contributions (${merged.length})</h2>`;
  h+=`<p style="font-size:.75rem;color:var(--text3);margin-bottom:.8em">Reader-shared tellings, ranked by traction. Adoption threshold: ≥${ADOPTION_K} distinct readers with positive signal. Adopt = download .md, review against the concept contract (HUMANS.md checklist), commit (state: edited), Sync Items. Adoption promotes the author on their 🛠 Editor track.</p>`;
  h+=nominated.length?nominated.map(({item,readers,likes})=>{
    const ready=likes>=ADOPTION_K;
    let wishes='';

// Shared demand-signal extractor: one source of truth for the visible panel
// AND the AI mining (they must never diverge).
function collectDemandSignals(){
  const lines=[];
  (_logRows||[]).forEach(r=>{
    const ev=r.event||r.data?.event;const d=r.data?.data||r.data||{};
    if(ev==='concept_wish'&&d.text)lines.push(`WISH: ${d.text}`);
    if(ev==='steer_miss')lines.push(`MISS: concept=${d.concept||'?'} wanted ${d.dim||d.action||'?'}=${d.value||'?'}${d.wish?` note="${d.wish}"`:''}`);
    if(ev==='flag'&&d.text)lines.push(`FLAG(${d.type||'issue'}): ${d.text}`);
    if(ev==='mission_reflection'){
      (d.disliked||[]).forEach(id=>lines.push(`DISLIKED: block=${id} (mission ${d.mission||'?'})`));
      (d.suggestions||[]).forEach(x=>lines.push(`SUGGEST: ${x}`));
      if(d.note)lines.push(`REFLECTION: ${d.note}`);
    }
  });
  try{JSON.parse(localStorage.getItem('pbook-flags')||'[]').forEach(f=>{if(f.type==='concept-wish')lines.push(`WISH: ${f.text}`);});}catch(_){}
  return [...new Set(lines)].slice(-80);
}

};

// ===== HEALTH — what readers actually read, and which content is failing them.
// Problem content gets parked (status: review) or rewritten with AI, per reader signals. =====
async function renderHealth(m){
  m.innerHTML='<div style="padding:2em;color:var(--text3)">Crunching reader signals…</div>';
  await _loadCoverageData();
  const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Per-block signal aggregation from the interaction log
  const sig={};
  const S=id=>sig[id]=sig[id]||{viewers:new Set(),views:0,fin:0,likes:new Set(),dislikes:new Set(),steerAway:0,praise:0,remixReq:0,dwell:0,dwellN:0};
  for(const r of _logRows){
    const d=r.data||r;const id=r.item_id||d.itemId||d.blockId;if(!id)continue;const s=S(id);const uid=r.user_id||d.userId||'?';
    const t=r.type||d.type,ev=r.event||d.event;
    if(t==='detailview'){s.viewers.add(uid);s.views++;if(d.duration){s.dwell+=d.duration;s.dwellN++}
      const _b=allBlocks.find(x=>x.id===id);const _thr=Math.min(12,((_b?_b.readingTime:3)||3)*60*0.15);
      if((d.duration||0)>=_thr)s.fin++;}
    if(t==='rating'&&(r.rating??d.rating)>=0.7)s.likes.add(uid);
    if(t==='rating'&&(r.rating??d.rating)<0.5)s.dislikes.add(uid);
    if(ev==='steer'&&d.action==='praise')s.praise++;
    else if((ev==='steer'||ev==='steer_miss')&&d.blockId)S(d.blockId).steerAway++;
    if(ev==='remix_request'&&d.blockId)S(d.blockId).remixReq++;
  }
  // Local reader flags (same-origin) count heavily
  let flags=[];try{flags=JSON.parse(localStorage.getItem('pbook-flags')||'[]')}catch(e){}
  const flagsBy={};flags.forEach(f=>{flagsBy[f.blockId]=(flagsBy[f.blockId]||[]);flagsBy[f.blockId].push(f)});

  // Health rows for blocks with any traffic
  const parked=(()=>{try{return JSON.parse(localStorage.getItem('pbook-content-statuses')||'{}')}catch(e){return{}}})();
  const rows=allBlocks.filter(b=>sig[b.id]||flagsBy[b.id]).map(b=>{
    const s=sig[b.id]||S(b.id);
    const fl=(flagsBy[b.id]||[]).length;
    const readers=s.viewers.size,likes=s.likes.size,dislikes=s.dislikes.size;
    const expected=(b.readingTime||3)*60*0.15;                      // seconds to count as read
    const avgDwell=s.dwellN?s.dwell/s.dwellN:0;
    const shallow=readers>=3&&avgDwell>0&&avgDwell<expected*0.5;     // people open it, don't read it
    const score=fl*3+dislikes*2+s.steerAway+s.remixReq+(shallow?2:0)-likes*2-s.praise;
    return{b,s,fl,readers,likes,dislikes,avgDwell,shallow,score,isParked:parked[b.id]==='review'};
  });
  rows.sort((a,x)=>x.score-a.score);
  const problems=rows.filter(r=>r.score>0);

  let h='<h2 style="font-size:1.15rem;font-weight:800;margin-bottom:.3em">Content health</h2>';
  h+=`<p style="font-size:.75rem;color:var(--text3)">${_logRows.length} interactions analyzed · ${rows.length} blocks with traffic · <b style="color:#EF4444">${problems.length} need attention</b>. Score = 3×flags + 2×dislikes + steers-away + remix-requests + shallow-reading − 2×likes − praise.</p>`;

  // What readers read (engagement leaders — the healthy half of the picture)
  const top=rows.filter(r=>r.readers>0).sort((a,x)=>x.readers-a.readers).slice(0,8);
  if(top.length){
    h+='<h3 style="font-size:.9rem;font-weight:700;margin:1em 0 .4em">📖 Most read right now</h3>';
    h+=top.map(r=>`<span style="display:inline-block;font-size:.7rem;border:1px solid var(--border);border-radius:999px;padding:.15em .6em;margin:.15em" title="${r.s.views} served · ${r.s.fin} finished · ${r.s.views-r.s.fin} skipped">${esc(r.b.title)} <b>${r.s.views}</b> served · <b style="color:#10B981">${r.s.fin}</b> fin · ${r.s.views-r.s.fin} skip ${r.likes?`<span style="color:#10B981">${r.likes}❤</span>`:''}</span>`).join('');
  }

  h+='<h3 style="font-size:.9rem;font-weight:700;margin:1.2em 0 .4em">🚑 Problem content (ranked)</h3>';
  if(!problems.length)h+='<p style="font-size:.78rem;color:var(--text3)">Nothing above the waterline — no flags, dislikes or steer-away clusters.</p>';
  for(const r of problems.slice(0,30)){
    const why=[];
    if(r.fl)why.push(`${r.fl}× flagged (${(flagsBy[r.b.id]||[]).map(f=>f.type).join(', ')})`);
    if(r.dislikes)why.push(`${r.dislikes} dislikes`);
    if(r.s.steerAway)why.push(`${r.s.steerAway}× steered away`);
    if(r.s.remixReq)why.push(`${r.s.remixReq}× remix-requested`);
    if(r.shallow)why.push(`shallow reading (avg ${Math.round(r.avgDwell)}s of ~${Math.round((r.b.readingTime||3)*60*0.15)}s)`);
    why.push(`${r.s.views} served → ${r.s.fin} finished / ${r.s.views-r.s.fin} skipped`);
    const flagTexts=(flagsBy[r.b.id]||[]).map(f=>f.text).filter(Boolean).slice(0,2);
    const rxWishes=_logRows.filter(x=>{const d=x.data?.data||x.data||{};return (x.event||x.data?.event)==='remix_request'&&d.blockId===r.b.id&&d.instruction;})
      .map(x=>(x.data?.data||x.data).instruction).slice(-3);
    h+=`<div style="border:1.5px solid ${r.isParked?'var(--border)':'#EF4444'};border-radius:10px;padding:.5em .7em;margin:.4em 0;font-size:.75rem;${r.isParked?'opacity:.6':''}">
      <b>${esc(r.b.title)}</b> <span style="color:var(--text3)">· ${esc(r.b._ch)}/${esc(r.b._f)} · score ${r.score}</span> ${r.isParked?'<span style="color:#D97706;font-weight:700">⏸ PARKED</span>':''}
      <div style="color:var(--text3);font-size:.68rem;margin:.2em 0">${why.join(' · ')||'—'}</div>
      ${flagTexts.length?`<div style="font-size:.68rem;color:#D97706;margin:.2em 0">💬 "${esc(flagTexts.join('" · "'))}"</div>`:''}
      ${rxWishes.length?`<div style="font-size:.68rem;color:#7C3AED;margin:.2em 0">✨ remix wishes: "${esc(rxWishes.join('" · "'))}"</div>`:''}
      <div style="margin-top:.3em;display:flex;gap:.4em;flex-wrap:wrap">
        <button onclick="parkBlock('${r.b.id}','${esc(r.b._ch)}','${esc(r.b._f)}')" style="font-size:.66rem;padding:.2em .6em;border-radius:6px;border:1.5px solid #D97706;color:#D97706">${r.isParked?'▶ Unpark':'⏸ Park'} (status: review)</button>
        <button onclick="aiRewrite('${r.b.id}')" id="rw-${r.b.id}" style="font-size:.66rem;padding:.2em .6em;border-radius:6px;border:1.5px solid var(--accent);color:var(--accent)">✨ AI rewrite from signals</button>
      </div>
      <div id="rwout-${r.b.id}"></div>
    </div>`;
  }
  m.innerHTML=h;
}

// Park = hide from readers until revised. Toggles the local override AND copies the
// one-line file change (the file is the source of truth for deployed readers).
window.parkBlock=function(id,ch,file){
  let st={};try{st=JSON.parse(localStorage.getItem('pbook-content-statuses')||'{}')}catch(e){}
  const parking=st[id]!=='review';
  if(parking)st[id]='review';else delete st[id];
  localStorage.setItem('pbook-content-statuses',JSON.stringify(st));
  const b=allBlocks.find(x=>x.id===id);if(b)b.status=parking?'review':'accepted';
  const dir=(book.chapters.find(c=>c.id===ch)||{}).directory||ch;
  const cmd=parking
    ?`sed -i 's/^status: accepted/status: review/' content/${dir}/${file}`
    :`sed -i 's/^status: review/status: accepted/' content/${dir}/${file}`;
  navigator.clipboard?.writeText(cmd);
  toast((parking?'Parked':'Unparked')+' locally — file command copied to clipboard (run + deploy to affect readers)');
  renderHealth(document.getElementById('main'));
};

// AI rewrite: regenerate the telling from its contract, steered by the reader signals
window.aiRewrite=async function(id){
  const b=allBlocks.find(x=>x.id===id);if(!b||!b.concept){toast('No concept for this block');return}
  const btn=document.getElementById('rw-'+id),out=document.getElementById('rwout-'+id);
  let flags=[];try{flags=JSON.parse(localStorage.getItem('pbook-flags')||'[]').filter(f=>f.blockId===id)}catch(e){}
  const problems=[];
  flags.slice(0,3).forEach(f=>problems.push(`reader flagged (${f.type}): "${(f.text||'').slice(0,120)}"`));
  if(!problems.length)problems.push('readers disengage from this telling (short dwell / steer-away) — make the opening more concrete and tighten it');
  const instructions=`This replaces a telling readers struggled with. Address these signals: ${problems.join('; ')}`.slice(0,300);
  if(btn){btn.disabled=true;btn.textContent='✨ Rewriting…'}
  try{
    const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({concept:b.concept,facets:{lens:b.lens||'generic',visuality:b.visuality||'text-first',depth:b.depth||'standard',formalism:b.formalism||'none',lengthBand:b.lengthBand||'standard',genre:b.genre||'explainer'},instructions})});
    const d=await res.json();
    if(!res.ok||!d.ok)throw new Error(d.error||'generation failed');
    const nb=d.block;
    const fm=['---',`id: ${id}`,`type: spine`,`title: "${(nb.title||'').replace(/"/g,'\\"')}"`,`teaser: ""`,
      `readingTime: ${Math.max(1,Math.round((nb.body||'').split(/\s+/).length/200))}`,`voice: ${b.voice||'universal'}`,
      `concept: ${b.concept}`,`state: ${b.state||'edited'}`,`lens: ${b.lens||'generic'}`,`visuality: ${b.visuality||'text-first'}`,
      `depth: ${b.depth||'standard'}`,`formalism: ${b.formalism||'none'}`,`lengthBand: ${b.lengthBand||'standard'}`,
      nb.recallQ?`recallQ: "${nb.recallQ.replace(/"/g,'\\"')}"`:null,nb.recallA?`recallA: "${nb.recallA.replace(/"/g,'\\"')}"`:null,
      `status: review`,'---','',nb.body||''].filter(Boolean).join('\n');
    if(out)out.innerHTML=`<div style="border:1px dashed var(--accent);border-radius:8px;padding:.5em;margin-top:.4em;font-size:.7rem;max-height:14em;overflow:auto;white-space:pre-wrap">${esc((nb.body||'').slice(0,1200))}</div>
      <button onclick="(function(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.getElementById('rwsrc-${id}').textContent],{type:'text/markdown'}));a.download='${id}.rewrite.md';a.click()})()" style="font-size:.66rem;padding:.2em .6em;border-radius:6px;border:1.5px solid #10B981;color:#10B981;margin-top:.3em">⬇ Download .md (status: review) — review &amp; replace the file</button>
      <pre id="rwsrc-${id}" style="display:none">${esc(fm)}</pre>`;
  }catch(e){if(out)out.innerHTML=`<div style="font-size:.68rem;color:#EF4444;margin-top:.3em">${esc(e.message)}</div>`}
  if(btn){btn.disabled=false;btn.textContent='✨ AI rewrite from signals'}
};

    const ev=r.event||r.data?.event;const d=r.data?.data||r.data||{};
    if(ev==='invite_accepted'&&d.code){(inv[d.code]=inv[d.code]||{n:0,users:new Set()});inv[d.code].n++;inv[d.code].users.add(r.user_id||d.userId||'?');}
    if(ev==='editor_invite_accepted'&&d.code)einv.push({code:d.code,user:r.user_id||'?'});
  });
  // contributor leaderboard: shares, adoptions (approx via community_share), flags, ghost votes
  const per={};
  const bump=(u,k)=>{if(!u)return;(per[u]=per[u]||{share:0,flag:0,ghost:0,wish:0});per[u][k]++;};
  _logRows.forEach(r=>{
    const ev=r.event||r.data?.event;const u=r.user_id||r.data?.userId;
    if(ev==='community_share')bump(u,'share');
    if(ev==='flag')bump(u,'flag');
    if(ev==='ghost_want'||ev==='ghost_skip')bump(u,'ghost');
    if(ev==='concept_wish')bump(u,'wish');
  });
  const board=Object.entries(per).map(([u,s])=>({u,score:s.share*10+s.wish*3+s.flag*2+s.ghost,...s}))
    .sort((a,b)=>b.score-a.score).slice(0,10);
  let h='<h2 style="font-size:1.15rem;font-weight:800;margin-bottom:.3em">📈 Reach — growth & the editor track</h2>';
  h+=`<div style="display:flex;gap:1.5em;flex-wrap:wrap;font-size:.8rem;margin:.4em 0 .8em">
    <span>🔗 invite codes used: <b>${Object.keys(inv).length}</b> (${Object.values(inv).reduce((s,x)=>s+x.users.size,0)} readers)</span>
    <span>🛠 editor invites accepted: <b>${einv.length}</b></span>
  </div>`;
  h+='<h3 style="font-size:.85rem;font-weight:700;margin:.6em 0 .3em">Top contributors</h3>';
  h+=board.length?('<table style="font-size:.72rem;border-collapse:collapse">'+board.map((x,i)=>`<tr><td style="padding:.2em .6em">${i+1}.</td><td style="padding:.2em .6em"><code>${esc(String(x.u).slice(0,14))}…</code></td><td style="padding:.2em .6em">score ${x.score}</td><td style="padding:.2em .6em;color:var(--text3)">${x.share} shared · ${x.wish} wishes · ${x.flag} flags · ${x.ghost} votes</td></tr>`).join('')+'</table>')
    :'<p style="font-size:.72rem;color:var(--text3)">No contribution events logged yet.</p>';
  // editor invite generator (honor-system gate; admin is where seniors land)
  h+=`<h3 style="font-size:.85rem;font-weight:700;margin:1em 0 .3em">Invite an editor</h3>
    <p style="font-size:.72rem;color:var(--text3)">Seniors get editor status on arrival: send them this link. It sets the 🛠 editor role in their book, points them at the editor guide, and links back here.</p>
    <button onclick="genEditorInvite()" style="font-size:.72rem;padding:.3em .7em;border:1.5px solid var(--accent);border-radius:6px;color:var(--accent)">＋ Generate editor invite link</button>
    <div id="editorInviteOut" style="font-size:.74rem;margin-top:.4em"></div>`;
  g.innerHTML=h;
  renderAnalytics(document.getElementById('reachAnalytics'));
}

window.genEditorInvite=function(){
  const code='E-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const url=`${location.origin}/?invite=${code}`;
  const out=document.getElementById('editorInviteOut');
  out.innerHTML=`<code style="user-select:all">${url}</code> <button onclick="navigator.clipboard.writeText('${url}');this.textContent='✓ copied'" style="font-size:.68rem;padding:.15em .5em;border:1px solid var(--border);border-radius:5px">copy</button>
    <div style="color:var(--text3);font-size:.66rem;margin-top:.2em">Acceptances appear above (editor_invite_accepted, code ${code}).</div>`;
};

async function renderAnalytics(el){
  el.innerHTML = '<div style="text-align:center;padding:2em;color:var(--text3)">Loading server-side analytics...</div>';

  let interactions = [];
  try {
    const res={ok:true,json:async()=>await getLogRows()};
    if (res.ok) {
      const raw = await res.json();
      // Normalize Supabase snake_case to camelCase + extract from data column
      interactions = raw.map(r => {
        const d = r.data || {};
        return { userId: r.user_id || d.userId, type: r.type || d.type, itemId: r.item_id || d.itemId, mode: r.mode || d.mode, event: r.event || d.event, duration: r.duration || d.duration, rating: r.rating || d.rating, ts: r.server_ts || d.ts || Date.parse(r.created_at), ...d };
      });
    }
  } catch(e) {}

  // Fallback to localStorage if server has no data
  if (!interactions.length) {
    try { interactions = JSON.parse(localStorage.getItem('pbook-interactions') || '[]'); } catch(e) {}
  }

  const source = interactions.length && interactions[0].serverTs ? 'Server-side log' : 'Browser localStorage (fallback)';
  const userId = localStorage.getItem('pbook-uid') || 'unknown';

  // Parse interactions
  const views = interactions.filter(i => i.type === 'detailview');
  const ratings = interactions.filter(i => i.type === 'rating');
  const bookmarks = interactions.filter(i => i.type === 'bookmark');
  const events = interactions.filter(i => i.type === 'event');
  const modeSwitches = events.filter(e => e.event === 'mode_switch');
  const blockOpens = events.filter(e => e.event === 'open_block');

  // Mode usage from mode_switch events
  const modeCount = {};
  modeSwitches.forEach(e => { modeCount[e.mode] = (modeCount[e.mode] || 0) + 1; });

  // Blocks opened per mode
  const modeBlocks = {};
  blockOpens.forEach(e => {
    if (!modeBlocks[e.mode]) modeBlocks[e.mode] = new Set();
    modeBlocks[e.mode].add(e.blockId);
  });

  // Views per mode
  const modeViews = {};
  views.forEach(v => { const m = v.mode || 'unknown'; modeViews[m] = (modeViews[m] || 0) + 1; });

  // View duration per mode
  const modeDuration = {};
  views.forEach(v => { if (v.duration) { const m = v.mode || 'unknown'; modeDuration[m] = (modeDuration[m] || 0) + v.duration; }});

  // Most viewed items
  const itemViews = {};
  views.forEach(v => { itemViews[v.itemId] = (itemViews[v.itemId] || 0) + 1; });
  const topItems = Object.entries(itemViews).sort((a,b) => b[1]-a[1]).slice(0, 15);

  // Timeline (last 50 events)
  const timeline = interactions.slice(-50).reverse();

  let h = '<h2 style="font-size:1.15rem;font-weight:800;margin-bottom:.3em">Reader Analytics</h2>';
  // Unique users across all interactions
  const allUserIds = new Set();
  interactions.forEach(i => { if (i.userId) allUserIds.add(i.userId); });

  h += `<p style="font-size:.82rem;color:var(--text2);margin-bottom:1em">Source: <b>${source}</b> · ${allUserIds.size} reader${allUserIds.size!==1?'s':''} · ${interactions.length} interactions.</p>`;

  // Summary
  h += '<div class="cg">';
  h += gc('Views', views.length, 'blocks read');
  h += gc('Ratings', ratings.length, 'likes/dislikes');
  h += gc('Bookmarks', bookmarks.length, 'saved');
  h += gc('Mode Switches', modeSwitches.length, 'navigations');
  h += gc('Block Opens', blockOpens.length, 'from various modes');
  h += '</div>';

  // Mode usage — key research metric
  if (Object.keys(modeCount).length) {
    h += '<h3 style="font-size:.9rem;font-weight:700;margin:1em 0 .5em">Mode Usage (switches)</h3>';
    h += '<p style="font-size:.75rem;color:var(--text2);margin-bottom:.5em">How many times the reader switched to each mode. Key for comparing content serving approaches.</p>';
    const maxMode = Math.max(...Object.values(modeCount), 1);
    const modeColors = {netflix:'#7C3AED',read:'#2563EB',mission:'#D97706',map:'#059669',tutor:'#EC4899',search:'#6366F1',profile:'#6B7280',home:'#7C3AED'};
    h += '<div style="display:flex;flex-direction:column;gap:.4em;max-width:500px">';
    Object.entries(modeCount).sort((a,b) => b[1]-a[1]).forEach(([mode, count]) => {
      const pct = Math.round(count / maxMode * 100);
      const uniqueBlocks = modeBlocks[mode]?.size || 0;
      const viewsInMode = modeViews[mode] || 0;
      const durSec = modeDuration[mode] || 0;
      h += `<div>
        <div style="display:flex;align-items:center;gap:.5em">
          <span style="width:5em;font-size:.75rem;font-weight:600;text-align:right">${mode}</span>
          <div style="flex:1;height:18px;background:var(--border);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${modeColors[mode]||'var(--accent)'};border-radius:4px"></div>
          </div>
          <span style="font-size:.72rem;color:var(--text2);width:2.5em">${count}x</span>
        </div>
        <div style="margin-left:5.5em;font-size:.65rem;color:var(--text3)">${viewsInMode} views · ${uniqueBlocks} unique blocks${durSec ? ' · ' + Math.round(durSec) + 's reading' : ''}</div>
      </div>`;
    });
    h += '</div>';
  }

  // Top items
  if (topItems.length) {
    h += '<h3 style="font-size:.9rem;font-weight:700;margin:1.5em 0 .5em">Most Read Sections</h3>';
    h += '<p style="font-size:.68rem;color:var(--text3)">served = views · finished = dwell ≥ min(12 s, 15 % of reading time) · skipped = the rest</p>';
    h += '<div class="cl">';
    topItems.forEach(([itemId, count]) => {
      const b = allBlocks.find(x => x.id === itemId);
      const thr = Math.min(12, ((b?.readingTime) || 3) * 60 * 0.15);
      const fin = views.filter(v => (v.itemId === itemId) && (v.duration || 0) >= thr).length;
      const skip = count - fin;
      h += `<div class="cl-item" style="grid-template-columns:1fr auto"><span class="cl-title">${b ? b.title : itemId}</span><span style="font-size:.72rem;color:var(--text3)">${count} served · <b style="color:#10B981">${fin} finished</b> · ${skip} skipped</span></div>`;
    });
    h += '</div>';
  }

  // Timeline
  if (timeline.length) {
    h += '<details style="margin-top:1.5em"><summary style="font-size:.82rem;font-weight:600;cursor:pointer">Event Timeline (last 50)</summary>';
    h += '<div class="cl" style="margin-top:.5em;font-size:.72rem">';
    timeline.forEach(i => {
      const time = i.ts && isFinite(i.ts) ? new Date(i.ts).toLocaleString() : '—';
      const label = i.event ? `${i.event}: ${i.mode||''}` : `${i.type}: ${i.itemId||''}`;
      h += `<div class="cl-item" style="grid-template-columns:auto 1fr;gap:.5em;padding:.2em .4em">
        <span style="color:var(--text3);white-space:nowrap">${time}</span>
        <span>${label}${i.duration ? ' ('+i.duration+'s)' : ''}${i.mode && i.type !== 'event' ? ' ['+i.mode+']' : ''}</span>
      </div>`;
    });
    h += '</div></details>';
  }

  // Export
  h += '<div style="margin-top:1.5em;display:flex;gap:.5em">';
  h += '<button class="ed-btn ed-btn-primary" onclick="exportLocalAnalytics()">Export analytics (JSON)</button>';
  h += '<button class="ed-btn" onclick="clearAnalytics()">Clear data</button>';
  h += '</div>';

  // Per-user summary
  if (allUserIds.size > 1) {
    h += '<h3 style="font-size:.9rem;font-weight:700;margin:1.5em 0 .5em">Per-Reader Summary</h3>';
    h += '<div class="cl">';
    [...allUserIds].forEach(uid => {
      const uViews = views.filter(v => v.userId === uid).length;
      const uModes = {};
      events.filter(e => e.userId === uid && e.event === 'mode_switch').forEach(e => { uModes[e.mode] = (uModes[e.mode]||0)+1; });
      const topMode = Object.entries(uModes).sort((a,b) => b[1]-a[1])[0];
      h += `<div class="cl-item" style="grid-template-columns:1fr auto auto auto">
        <span style="font-size:.7rem;font-family:monospace">${uid.substring(0,24)}...</span>
        <span style="font-size:.68rem;color:var(--text3)">${uViews} views</span>
        <span style="font-size:.68rem;color:var(--text3)">${Object.keys(uModes).length} modes</span>
        <span style="font-size:.68rem;color:var(--accent)">${topMode ? topMode[0] : '—'}</span>
      </div>`;
    });
    h += '</div>';
  }

  h += `<div style="margin-top:1em;padding:.8em;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:.75rem;color:var(--text2)">
    <b>How it works:</b> Every reader interaction is sent to <b>Supabase</b> (persistent database) via the <code>/api/log</code> endpoint.
    Data persists across deploys and is accessible from both localhost and production.
  </div>`;

  el.innerHTML = h;
}

window.exportLocalAnalytics = async function() {
  let interactions = [];
  // Try Supabase first (all users)
  try {
    const res={ok:true,json:async()=>await getLogRows()};
    if (res.ok) interactions = await res.json();
  } catch(e) {}
  // Fallback to localStorage
  if (!interactions.length) {
    try { interactions = JSON.parse(localStorage.getItem('pbook-interactions') || '[]'); } catch(e) {}
  }
  const data = { exportedAt: new Date().toISOString(), source: interactions.length && interactions[0].user_id ? 'supabase' : 'localStorage', totalInteractions: interactions.length, interactions };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pbook-analytics-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Analytics exported');
};

window.clearAnalytics = function() {
  if (!confirm('Clear all interaction data from this browser?')) return;
  localStorage.removeItem('pbook-interactions');
  toast('Analytics cleared');
  showMain();
};


function editorialList(blocks){
  let h='<div class="cl">';
  blocks.forEach(b=>{
    h+=`<div class="cl-item" style="grid-template-columns:2.5em 1fr auto">
      <span class="cl-ch">Ch${b._cn}</span>
      <span><span class="cl-title" style="cursor:pointer" onclick="OD('${b.id}')">${b.title}</span>
        <span style="font-size:.6rem;color:var(--text3);margin-left:.3em">${b.type}${b.core?' · CORE':''}${b.concept?' · '+esc(b.concept):''}</span></span>
      <span style="flex-shrink:0"><button class="ed-btn" style="font-size:.6rem;padding:.15em .45em" onclick="event.stopPropagation();OD('${b.id}')">Preview</button></span>
    </div>`;
  });
  h+='</div>';
  return h;
}

window.OD=function(id){
  editorBlock=allBlocks.find(b=>b.id===id);
  if(!editorBlock)return;
  renderEditor();
  document.getElementById('editor').classList.add('open');
};
window.CE=function(){document.getElementById('editor').classList.remove('open')};

// Block detail: read-only preview + the two actions that matter — polish the
// telling in the book's author studio, or take the canonical .md for git.
window.renderEditor=function(){
  const b=editorBlock;if(!b)return;
  const ed=document.getElementById('editor');
  let h=`<div class="ed-head">
    <h2>${b.title}</h2>
    <span style="font-size:.65rem;color:var(--text3);margin-left:.3em">Ch${b._cn} · ${b.type}${b.core?' · CORE':''} · ${b.readingTime||3}m · ${b._f}</span>
    <div class="spacer"></div>
    <button class="ed-close" onclick="CE()">&#10005;</button>
  </div>`;
  h+=`<div class="ed-body">
    <div style="display:flex;gap:.4em;flex-wrap:wrap;margin-bottom:.8em">
      <button class="ed-btn" style="border:1.5px solid #EC4899;color:#EC4899;font-weight:700" onclick="improveGitInStudio('${b.id}')" title="load into the book's author studio for a bigger rework">✍️ Improve in studio</button>
      <button class="ed-btn" onclick="downloadGitMd('${b.id}')" title="download the canonical markdown file">⬇ .md</button>
      <a class="ed-btn" href="/#${encodeURIComponent(b.id)}" target="_blank" style="text-decoration:none">📖 Open in book</a>
    </div>
    <div style="font-size:.85rem;line-height:1.6" class="md-preview">${window.renderMD?renderMD(b.body||''):esc(b.body||'')}</div>
  </div>`;
  ed.innerHTML=h;
};

window.improveGitInStudio=function(id){
  const b=allBlocks.find(x=>x.id===id);if(!b)return;
  const slug=b.concept||b.id;
  const KEY='pbook-author-drafts';
  let all={};try{all=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  if(all[slug]?.text?.trim()&&!confirm('The studio already has a draft for "'+slug+'". Overwrite it with this section?'))return;
  all[slug]={text:b.body||'',ts:Date.now()};
  localStorage.setItem(KEY,JSON.stringify(all));
  window.open('/#autor-'+encodeURIComponent(slug),'_blank');
};

window.downloadGitMd=function(id){
  const b=allBlocks.find(x=>x.id===id);if(!b)return;
  const meta=Object.entries(b).filter(([k,v])=>!k.startsWith('_')&&k!=='body'&&v!==null&&v!==undefined&&v!=='')
    .map(([k,v])=>`${k}: ${v}`).join('\n');
  const blob=new Blob([`---\n${meta}\n---\n\n${b.body||''}\n`],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b._f||b.id+'.md';a.click();
};
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

window.syncRecombee=async function(){
  const btn=document.getElementById('syncBtn');
  btn.textContent='Syncing...';btn.disabled=true;btn.style.opacity='.6';
  try{
    const res=await fetch('/api/sync-recombee',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:localStorage.getItem('pbook-admin-pwd')||''})});
    const raw=await res.text();
    let data; try{data=JSON.parse(raw);}catch(_){data={ok:false,error:`endpoint returned ${res.status} — is /api/sync-recombee routed on this server?`};}
    if(data.ok){
      btn.textContent=`Synced ${data.imported}/${data.total}`;btn.style.color='#10B981';
    }else{
      btn.textContent='Sync failed';btn.style.color='#EF4444';
      alert('Sync error: '+(data.error||'unknown')+((res.status===401||/401/.test(data.error||''))?'\n\nHint: RECOMBEE_TOKEN in .env is being rejected by the Recombee DB.':''));
    }
  }catch(e){btn.textContent='Sync error';btn.style.color='#EF4444';alert('Sync error: '+e.message);}
  setTimeout(()=>{btn.textContent='Sync Items';btn.disabled=false;btn.style.opacity='1';btn.style.color='#10B981';},3000);
};

// ---- Recombee setup ----
window.showRCSetup=function(){
  const current=localStorage.getItem('pbook-rc-config')||'';
  let parsed={database:'cvachond-land-free-pbook',token:'',region:'rapi-eu-west'};
  try{parsed=JSON.parse(current)||parsed}catch(e){}
  const el=document.getElementById('main');
  let h='<h2 style="font-size:1.1rem;font-weight:700;margin-bottom:.8em">Recombee Configuration</h2>';
  h+='<p style="font-size:.82rem;color:var(--text2);margin-bottom:1.2em">Set the Recombee API credentials. This is saved in your browser and shared with all readers on this device. For production, deploy with a server-side token proxy.</p>';
  h+='<div style="max-width:500px;display:flex;flex-direction:column;gap:.6em">';
  h+='<div class="ed-field"><label>Database</label><input class="ed-input" id="rcDb" value="'+escH(parsed.database)+'"></div>';
  h+='<div class="ed-field"><label>Private Token</label><input class="ed-input" id="rcToken" type="password" value="'+escH(parsed.token)+'" placeholder="Paste private token from Recombee admin"></div>';
  h+='<div class="ed-field"><label>Region</label><input class="ed-input" id="rcRegion" value="'+escH(parsed.region)+'"></div>';
  h+='</div>';
  h+='<div class="ed-btn-row" style="margin-top:1em">';
  h+='<button class="ed-btn ed-btn-primary" onclick="saveRCConfig()">Save & activate</button>';
  h+='<button class="ed-btn" onclick="testRC()">Test connection</button>';
  h+='<button class="ed-btn" style="color:#dc2626" onclick="clearRCConfig()">Clear token</button>';
  h+='</div>';
  h+='<div id="rcStatus" style="margin-top:1em;font-size:.82rem"></div>';
  // Show current status
  const saved=localStorage.getItem('pbook-rc-config');
  if(saved){
    try{const c=JSON.parse(saved);h+='<div style="margin-top:1.5em;padding:1em;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:.8rem"><b>Active config:</b> '+c.database+' ('+c.region+')<br>Token: '+(c.token?'***'+c.token.slice(-8):'not set')+'</div>'}catch(e){}
  }
  el.innerHTML=h;
};

window.saveRCConfig=function(){
  const config={
    database:document.getElementById('rcDb').value.trim(),
    token:document.getElementById('rcToken').value.trim(),
    region:document.getElementById('rcRegion').value.trim()
  };
  if(!config.token){toast('Token is required');return}
  localStorage.setItem('pbook-rc-config',JSON.stringify(config));
  // Also set for reader (they share localStorage on same domain)
  localStorage.setItem('pbook-rc-token',config.token);
  toast('Recombee config saved — active for all readers on this domain');
  document.getElementById('rcStatus').innerHTML='<span style="color:var(--prod)">&#10003; Config saved. Readers will connect to Recombee on next page load.</span>';
};

window.testRC=function(){
  const db=document.getElementById('rcDb').value.trim();
  const token=document.getElementById('rcToken').value.trim();
  const region=document.getElementById('rcRegion').value.trim();
  const statusEl=document.getElementById('rcStatus');
  statusEl.innerHTML='Testing...';

  // Use proxy (works on deployed site AND localhost with serve-local.js)
  fetch('/.netlify/functions/recombee',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({endpoint:'/items/list/?count=1'})
  })
  .then(function(res){
    if(res.ok) return res.json().then(function(data){statusEl.innerHTML='<span style="color:var(--prod)">&#10003; Connected via proxy! '+JSON.stringify(data).substring(0,100)+'</span>'});
    else return res.text().then(function(text){statusEl.innerHTML='<span style="color:#dc2626">&#10007; Proxy error '+res.status+': '+text.substring(0,100)+'</span>'});
  })
  .catch(function(e){statusEl.innerHTML='<span style="color:#dc2626">&#10007; Connection failed: '+e.message+'</span>'});
};

window.clearRCConfig=function(){
  localStorage.removeItem('pbook-rc-config');
  localStorage.removeItem('pbook-rc-token');
  toast('Recombee config cleared — readers will use local mode');
  showRCSetup();
};

// ---- Toast ----
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

init();
</script>
