<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="system-ui, sans-serif">
  <defs>
    <marker id="tensionStart" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <circle cx="3" cy="3" r="2" fill="#6B7280"/>
    </marker>
    <marker id="tensionEnd" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <circle cx="3" cy="3" r="2" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Warm card background -->
  <rect x="1" y="1" width="678" height="378" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Stakeholder Triangle</text>
  <text x="340" y="49" text-anchor="middle" font-size="11" fill="#6B7280">Balancing competing interests in recommender systems</text>

  <!-- Triangle edges -->
  <line x1="340" y1="102" x2="130" y2="292" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="340" y1="102" x2="550" y2="292" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="130" y1="292" x2="550" y2="292" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Bidirectional tension relationships -->
  <path d="M285 132 L188 258" fill="none" stroke="#6B7280" stroke-width="1.2" marker-start="url(#tensionStart)" marker-end="url(#tensionEnd)"/>
  <path d="M395 132 L492 258" fill="none" stroke="#6B7280" stroke-width="1.2" marker-start="url(#tensionStart)" marker-end="url(#tensionEnd)"/>
  <path d="M230 295 L450 295" fill="none" stroke="#6B7280" stroke-width="1.2" marker-start="url(#tensionStart)" marker-end="url(#tensionEnd)"/>

  <!-- Readable edge labels -->
  <g transform="translate(207 184) rotate(-40)">
    <rect x="-92" y="-13" width="184" height="26" rx="8" fill="#FAFAF7"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">fair exposure vs. relevance</text>
  </g>
  <g transform="translate(473 184) rotate(40)">
    <rect x="-95" y="-13" width="190" height="26" rx="8" fill="#FAFAF7"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">engagement vs. well-being</text>
  </g>
  <g transform="translate(340 292)">
    <rect x="-91" y="-13" width="182" height="26" rx="8" fill="#FAFAF7"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">revenue vs. creator fairness</text>
  </g>

  <!-- Connections mediated by recommender system -->
  <line x1="340" y1="192" x2="340" y2="146" stroke="#1E1B4B" stroke-width="1.5"/>
  <line x1="276" y1="228" x2="183" y2="267" stroke="#1E1B4B" stroke-width="1.5"/>
  <line x1="404" y1="228" x2="497" y2="267" stroke="#1E1B4B" stroke-width="1.5"/>

  <!-- Users -->
  <rect x="252" y="68" width="176" height="78" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <circle cx="340" cy="89" r="9" fill="none" stroke="#0EA5E9" stroke-width="1.7"/>
  <path d="M327 106 Q340 98 353 106" fill="none" stroke="#0EA5E9" stroke-width="1.7" stroke-linecap="round"/>
  <text x="340" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Users</text>
  <text x="340" y="137" text-anchor="middle" font-size="11" fill="#6B7280">relevance, discovery, trust</text>

  <!-- Content Producers -->
  <rect x="30" y="254" width="200" height="78" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <rect x="123" y="263" width="14" height="18" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <line x1="127" y1="269" x2="133" y2="269" stroke="#10B981" stroke-width="1.2"/>
  <line x1="127" y1="273" x2="133" y2="273" stroke="#10B981" stroke-width="1.2"/>
  <line x1="127" y1="277" x2="131" y2="277" stroke="#10B981" stroke-width="1.2"/>
  <text x="130" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Content Producers</text>
  <text x="130" y="318" text-anchor="middle" font-size="11" fill="#6B7280">audience, fair exposure, reach</text>

  <!-- Platform Owners -->
  <rect x="450" y="254" width="200" height="78" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <rect x="538" y="267" width="5" height="14" rx="1" fill="#7C3AED"/>
  <rect x="547" y="263" width="5" height="18" rx="1" fill="#7C3AED"/>
  <rect x="556" y="270" width="5" height="11" rx="1" fill="#7C3AED"/>
  <text x="550" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Platform Owners</text>
  <text x="550" y="318" text-anchor="middle" font-size="11" fill="#6B7280">engagement, revenue, growth</text>

  <!-- Recommender System -->
  <rect x="270" y="192" width="140" height="52" rx="20" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="340" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Recommender</text>
  <text x="340" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">System</text>

  <!-- Legend -->
  <line x1="190" y1="358" x2="220" y2="358" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="228" y="362" font-size="11" fill="#6B7280">Tension / trade-off</text>
  <line x1="378" y1="358" x2="408" y2="358" stroke="#1E1B4B" stroke-width="1.5"/>
  <text x="416" y="362" font-size="11" fill="#6B7280">Mediated by RS</text>
</svg>