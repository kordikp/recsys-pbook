<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="pb143-title pb143-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb143-title">The rich-get-richer loop</title>
  <desc id="pb143-desc">Being shown earns clicks, clicks make an item look like a safer bet, and safer bets get shown more, so a new provider with zero clicks is never shown; reserving a slot for newcomers gives them their first clicks and a fair chance to enter the loop.</desc>
  <defs>
    <marker id="pb143-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#7C3AED"/>
    </marker>
    <marker id="pb143-ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="419" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <text x="320" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">The rich-get-richer loop</text>

  <!-- ============ Left panel: without a fix ============ -->
  <rect x="16" y="60" width="296" height="300" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="164" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Without a fix</text>

  <!-- loop arrows -->
  <path d="M228 124 Q266 150 254 214" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb143-ah-purple)"/>
  <path d="M220 258 Q164 290 110 258" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb143-ah-purple)"/>
  <path d="M76 218 Q62 152 98 126" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb143-ah-purple)"/>

  <!-- loop nodes -->
  <rect x="102" y="104" width="124" height="34" rx="17" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="164" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Shown more</text>

  <rect x="178" y="222" width="118" height="34" rx="17" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="237" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">More clicks</text>

  <rect x="32" y="222" width="118" height="34" rx="17" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="91" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Safer bet</text>

  <!-- who rides the loop -->
  <text x="164" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">★ Big provider</text>
  <text x="164" y="201" text-anchor="middle" font-size="14" fill="#4B5563">years of clicks</text>

  <!-- newcomer left out -->
  <rect x="32" y="290" width="264" height="54" rx="10" fill="#FAFAF7" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="164" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#4B5563">🌱 New provider</text>
  <text x="164" y="333" text-anchor="middle" font-size="14" fill="#4B5563">0 clicks → no data → not shown</text>

  <!-- ============ Right panel: with an exploration slot ============ -->
  <rect x="328" y="60" width="296" height="300" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="476" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">With an exploration slot</text>

  <!-- feed rows -->
  <g>
    <rect x="344" y="104" width="264" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="363" cy="121" r="10" fill="#7C3AED"/>
    <text x="363" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="382" y="126" font-size="15" fill="#1E1B4B">★ Big provider</text>

    <rect x="344" y="146" width="264" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="363" cy="163" r="10" fill="#7C3AED"/>
    <text x="363" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="382" y="168" font-size="15" fill="#1E1B4B">★ Big provider</text>

    <rect x="344" y="188" width="264" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="363" cy="205" r="10" fill="#7C3AED"/>
    <text x="363" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="382" y="210" font-size="15" fill="#1E1B4B">★ Big provider</text>

    <rect x="344" y="230" width="264" height="36" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="363" cy="248" r="10" fill="#F59E0B"/>
    <text x="363" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="382" y="253" font-size="15" font-weight="700" fill="#92400E">🌱 New provider</text>
    <rect x="522" y="238" width="78" height="20" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="561" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">reserved</text>
  </g>

  <!-- payoff -->
  <path d="M476 270 L476 288" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb143-ah-green)"/>
  <text x="476" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">First clicks = first data</text>
  <text x="476" y="336" text-anchor="middle" font-size="15" fill="#4B5563">a fair shot at the loop</text>

  <!-- takeaway -->
  <text x="320" y="396" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Exposure feeds on itself — newcomers need a <tspan fill="#92400E">reserved first chance</tspan>.</text>
</svg>
