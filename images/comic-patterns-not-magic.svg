<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb087-title pb087-desc">
<title id="pb087-title">Your usual, statistically speaking</title>
<desc id="pb087-desc">Four-panel comic in a bakery. 1, Observe: you order a croissant and the clerk, who stands for the recommender, makes a note. 2, Spot your pattern: you order a croissant Monday to Thursday, and with each visit the clerk's guess that you will order one next grows from maybe to almost sure. 3, Spot the crowd's pattern: the clerk's notes on many customers show that people who order croissants also order soup; you have not ordered soup yet. 4, Predict: before you say a word, a croissant and a soup are waiting on the counter. You: I haven't even ordered! Are you psychic? Clerk: No. I just take notes. Takeaway: not magic, patterns: observe, spot patterns, predict. Every order sharpens the guess, yours and everyone else's.</desc>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" font-size="19" font-weight="700" fill="#1E1B4B" text-anchor="middle">Your usual, statistically speaking</text>
