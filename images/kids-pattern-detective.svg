<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb153-title pb153-desc">
  <title id="pb153-title">Not magic: four steps to one recommendation</title>
  <desc id="pb153-desc">A recommendation is a pattern, not magic: the system observes that you read three machine learning articles, detects that you like ML, finds across 10,000 ML readers that 7,500 also read data engineering, and so predicts you will like a data pipeline article you have not seen yet. Every new click feeds back in as more signal.</desc>
  <defs>
    <marker id="pb153-ah-grey" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="pb153-ah-purple" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="pb153-ah-green" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x=".5" y=".5" width="639" height="399" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Not magic: four steps to one recommendation</text>

  <!-- feedback loop over the top -->
  <path d="M544,84 V64 H129 V80" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" marker-end="url(#pb153-ah-green)"/>
  <rect x="236" y="53" width="200" height="22" rx="11" fill="#FAFAF7"/>
  <text x="336" y="69" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">every click feeds step 1</text>

  <!-- 1 Observe -->
  <rect x="24" y="84" width="210" height="112" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="46" cy="106" r="11" fill="#1E1B4B"/>
  <text x="46" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="64" y="111" font-size="16" font-weight="700" fill="#1E1B4B">Observe</text>
  <circle cx="52" cy="144" r="9" fill="#10B981"/>
  <path d="M37,180 Q37,158 52,158 Q67,158 67,180 Z" fill="#10B981"/>
  <text x="80" y="146" font-size="14" fill="#4B5563">You read</text>
  <g font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">
    <rect x="80" y="156" width="44" height="24" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="102" y="173">ML</text>
    <rect x="130" y="156" width="44" height="24" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="152" y="173">ML</text>
    <rect x="180" y="156" width="44" height="24" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="202" y="173">ML</text>
  </g>

  <line x1="238" y1="140" x2="264" y2="140" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb153-ah-grey)"/>

  <!-- 2 Detect -->
  <rect x="270" y="84" width="164" height="112" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="292" cy="106" r="11" fill="#1E1B4B"/>
  <text x="292" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="310" y="111" font-size="16" font-weight="700" fill="#1E1B4B">Detect</text>
  <rect x="300" y="126" width="104" height="30" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="352" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">likes ML</text>
  <text x="352" y="180" text-anchor="middle" font-size="14" fill="#4B5563">3 in a row = a signal</text>

  <!-- 3 Aggregate -->
  <rect x="24" y="212" width="410" height="136" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="46" cy="234" r="11" fill="#1E1B4B"/>
  <text x="46" y="239" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="64" y="239" font-size="16" font-weight="700" fill="#1E1B4B">Aggregate across users</text>
  <text x="44" y="264" font-size="14" fill="#4B5563">10,000 ML readers</text>
  <g>
    <circle cx="50" cy="280" r="6" fill="#10B981"/>
    <circle cx="67" cy="280" r="6" fill="#10B981"/>
    <circle cx="84" cy="280" r="6" fill="#10B981"/>
    <circle cx="101" cy="280" r="6" fill="#10B981"/>
    <circle cx="118" cy="280" r="6" fill="#10B981"/>
    <circle cx="135" cy="280" r="6" fill="#10B981"/>
    <circle cx="152" cy="280" r="6" fill="#10B981"/>
    <circle cx="169" cy="280" r="6" fill="#10B981"/>
    <circle cx="186" cy="280" r="6" fill="#10B981"/>
    <circle cx="203" cy="280" r="6" fill="#10B981"/>
    <circle cx="50" cy="298" r="6" fill="#10B981"/>
    <circle cx="67" cy="298" r="6" fill="#10B981"/>
    <circle cx="84" cy="298" r="6" fill="#10B981"/>
    <circle cx="101" cy="298" r="6" fill="#10B981"/>
    <circle cx="118" cy="298" r="6" fill="#10B981"/>
    <circle cx="135" cy="298" r="6" fill="#D1D5DB"/>
    <circle cx="152" cy="298" r="6" fill="#D1D5DB"/>
    <circle cx="169" cy="298" r="6" fill="#D1D5DB"/>
    <circle cx="186" cy="298" r="6" fill="#D1D5DB"/>
    <circle cx="203" cy="298" r="6" fill="#D1D5DB"/>
  </g>
  <circle cx="50" cy="327" r="6" fill="#10B981"/>
  <text x="62" y="332" font-size="14" fill="#065F46" font-weight="600">also read data eng.</text>
  <line x1="226" y1="296" x2="262" y2="296" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb153-ah-grey)"/>
  <rect x="270" y="252" width="152" height="84" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="346" y="280" text-anchor="middle" font-size="22" font-weight="800" fill="#4C1D95">7,500</text>
  <text x="346" y="302" text-anchor="middle" font-size="14" fill="#4C1D95">of them also read</text>
  <text x="346" y="321" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">data engineering</text>

  <!-- into prediction -->
  <line x1="438" y1="140" x2="466" y2="140" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb153-ah-purple)"/>
  <line x1="426" y1="296" x2="466" y2="296" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb153-ah-purple)"/>

  <!-- 4 Predict -->
  <rect x="472" y="84" width="144" height="264" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="494" cy="106" r="11" fill="#1E1B4B"/>
  <text x="494" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="512" y="111" font-size="16" font-weight="700" fill="#1E1B4B">Predict</text>
  <text x="544" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Picked for you</text>
  <rect x="484" y="166" width="120" height="118" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="500" y="178" width="88" height="24" rx="12" fill="#EDE9FE"/>
  <text x="544" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#4C1D95">data eng.</text>
  <text x="544" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Data pipeline</text>
  <text x="544" y="249" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">article</text>
  <text x="544" y="272" text-anchor="middle" font-size="14" fill="#6B7280">not seen yet</text>
  <text x="544" y="320" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">👍 = more signal</text>

  <text x="320" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Your clicks + everyone's patterns = the prediction. No crystal ball 🔮</text>
</svg>
