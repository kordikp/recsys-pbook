<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 350" width="550" height="350" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrGreen" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="548" height="348" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="275" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Two-Sided Marketplace Recommendations</text>

  <!-- Buyers -->
  <g transform="translate(30,54)">
    <rect x="0" y="0" width="140" height="200" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="70" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Buyers</text>

    <circle cx="40" cy="58" r="19" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="40" y="54" text-anchor="middle" font-size="12">&#x1F464;</text>
    <text x="40" y="69" text-anchor="middle" font-size="11" font-weight="700" fill="#0EA5E9">B1</text>

    <circle cx="100" cy="58" r="19" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="100" y="54" text-anchor="middle" font-size="12">&#x1F464;</text>
    <text x="100" y="69" text-anchor="middle" font-size="11" font-weight="700" fill="#0EA5E9">B2</text>

    <circle cx="40" cy="108" r="19" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="40" y="104" text-anchor="middle" font-size="12">&#x1F464;</text>
    <text x="40" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#0EA5E9">B3</text>

    <circle cx="100" cy="108" r="19" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="100" y="104" text-anchor="middle" font-size="12">&#x1F464;</text>
    <text x="100" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#0EA5E9">B4</text>

    <rect x="8" y="134" width="124" height="39" rx="6" fill="#FFFFFF" stroke="#0EA5E9"/>
    <text x="70" y="149" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Want: relevant items</text>
    <text x="70" y="165" text-anchor="middle" font-size="11" fill="#6B7280">best match, fair price</text>

    <text x="70" y="191" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">Discovery + Satisfaction</text>
  </g>

  <!-- Sellers -->
  <g transform="translate(380,54)">
    <rect x="0" y="0" width="140" height="200" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="70" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Sellers</text>

    <rect x="16" y="39" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="33" y="62" text-anchor="middle" font-size="14">&#x1F3EA;</text>

    <rect x="90" y="39" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="107" y="62" text-anchor="middle" font-size="14">&#x1F3EA;</text>

    <rect x="16" y="86" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="33" y="109" text-anchor="middle" font-size="14">&#x1F3EA;</text>

    <rect x="90" y="86" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="107" y="109" text-anchor="middle" font-size="14">&#x1F3EA;</text>

    <rect x="8" y="134" width="124" height="39" rx="6" fill="#FFFFFF" stroke="#10B981"/>
    <text x="70" y="149" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Want: visibility</text>
    <text x="70" y="165" text-anchor="middle" font-size="11" fill="#6B7280">fair exposure, sales</text>

    <text x="70" y="191" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">Exposure + Revenue</text>
  </g>

  <!-- Platform -->
  <g transform="translate(195,84)">
    <rect x="0" y="0" width="160" height="140" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M10,0 H150 A10,10 0 0 1 160,10 V30 H0 V10 A10,10 0 0 1 10,0 Z" fill="#EDE9FE"/>
    <line x1="0" y1="30" x2="160" y2="30" stroke="#7C3AED" stroke-width="2"/>
    <text x="80" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Platform</text>

    <rect x="18" y="39" width="124" height="41" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="80" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">RecSys Engine</text>
    <text x="80" y="72" text-anchor="middle" font-size="11" fill="#6B7280">ranking + matching</text>

    <rect x="18" y="87" width="124" height="41" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="80" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Balancing objectives</text>
    <text x="80" y="120" text-anchor="middle" font-size="11" fill="#6B7280">relevance vs. fairness</text>
  </g>

  <!-- Buyer/platform flows -->
  <line x1="170" y1="120" x2="192" y2="140" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <rect x="145" y="91" width="76" height="20" rx="5" fill="#FFFFFF" stroke="#0EA5E9"/>
  <text x="183" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#0EA5E9">interactions</text>

  <line x1="192" y1="190" x2="170" y2="210" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <rect x="126" y="218" width="105" height="20" rx="5" fill="#FFFFFF" stroke="#0EA5E9"/>
  <text x="178.5" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#0EA5E9">recommendations</text>

  <!-- Platform/seller flows -->
  <line x1="358" y1="140" x2="380" y2="120" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <rect x="346" y="91" width="68" height="20" rx="5" fill="#FFFFFF" stroke="#10B981"/>
  <text x="380" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#10B981">exposure</text>

  <line x1="380" y1="210" x2="358" y2="190" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <rect x="348" y="218" width="58" height="20" rx="5" fill="#FFFFFF" stroke="#10B981"/>
  <text x="377" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#10B981">listings</text>

  <!-- Warning -->
  <rect x="55" y="274" width="440" height="62" rx="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <circle cx="82" cy="305" r="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
  <text x="82" y="310" text-anchor="middle" font-size="14" fill="#EF4444">&#x26A0;</text>

  <text x="292" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Optimizing for one side can harm the other</text>
  <text x="292" y="309" text-anchor="middle" font-size="11" fill="#6B7280">e.g., showing only top sellers hurts new seller visibility;</text>
  <text x="292" y="325" text-anchor="middle" font-size="11" fill="#6B7280">promoting new sellers may reduce buyer relevance</text>
</svg>