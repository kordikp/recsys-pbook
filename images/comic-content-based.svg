<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" role="img" aria-labelledby="pb050-title pb050-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb050-title">Judging an album by its cover data</title>
<desc id="pb050-desc">Four-panel comic in a record shop. You ask for more albums like your favorite, Midnight Loop. The content-based clerk ignores the other shoppers and reads the album itself: jazz, mellow, slow tempo, soft brass. A brand-new release, Blue Hour, has zero plays but the same four features, so he recommends it anyway. The collaborative clerk asks who else bought Blue Hour; nobody has, so he has nothing yet. Content-based compares the item's features and works on day one; collaborative learns from other people's behavior, needs history, and finds surprises.</desc>
<rect x=".5" y=".5" width="639" height="633" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
