<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">Judging an Album by Its Cover Data</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <circle cx="96" cy="184" r="10" fill="#7C3AED"/>
  <path d="M96 195 L96 251 M96 210 L126 224 L169 194 M96 251 L78 276 M96 251 L115 276" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="308" cy="184" r="10" fill="#10B981"/>
  <path d="M308 195 L308 251 M308 211 L281 225 M308 251 L291 276 M308 251 L326 276" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="169" y="157" width="64" height="72" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="201" y="179" font-size="11.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="201" dy="0">MIDNIGHT</tspan>
    <tspan x="201" dy="16">LOOP</tspan>
    <tspan x="201" dy="18" font-weight="400">mellow jazz</tspan>
  </text>
  <rect x="49" y="78" width="190" height="52" rx="9" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="144" y="99" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="144" dy="0">More like this one,</tspan>
    <tspan x="144" dy="17">please.</tspan>
  </text>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">One favorite album becomes a surprisingly detailed order.</text>

  <!-- Panel 2 -->
  <circle cx="460" cy="225" r="10" fill="#7C3AED"/>
  <path d="M460 236 L460 274 M460 246 L494 218 M460 274 L446 294 M460 274 L474 294" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="744" cy="225" r="10" fill="#10B981"/>
  <path d="M744 236 L744 274 M744 246 L704 210 M744 274 L730 294 M744 274 L758 294" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="511" y="76" width="190" height="146" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="530" y="101" font-size="12.5" fill="#1E1B4B">
    <tspan x="530" dy="0" font-weight="700">ALBUM FEATURES</tspan>
    <tspan x="530" dy="25">Genre: jazz</tspan>
    <tspan x="530" dy="21">Tags: mellow, nocturnal</tspan>
    <tspan x="530" dy="21">Description: late-night</tspan>
    <tspan x="530" dy="21">Audio: 72 BPM, soft brass</tspan>
  </text>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">The clerk reads the music, not the room.</text>

  <!-- Panel 3 -->
  <circle cx="82" cy="476" r="10" fill="#7C3AED"/>
  <path d="M82 487 L82 536 M82 500 L127 478 M82 536 L67 558 M82 536 L98 558" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="320" cy="476" r="10" fill="#10B981"/>
  <path d="M320 487 L320 536 M320 500 L272 478 M320 536 L304 558 M320 536 L336 558" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="151" y="431" width="105" height="91" rx="5" fill="#FEF3C7" stroke="#D97706"/>
  <text x="203.5" y="451" font-size="11.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="203.5" dy="0" font-weight="700">NEW RELEASE</tspan>
    <tspan x="203.5" dy="18">0 PLAYS</tspan>
    <tspan x="203.5" dy="18">jazz · mellow</tspan>
    <tspan x="203.5" dy="16">74 BPM</tspan>
  </text>
  <rect x="91" y="358" width="226" height="54" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="204" y="380" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="204" dy="0">Zero plays?</tspan>
    <tspan x="204" dy="17">No problem.</tspan>
  </text>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The new release has zero plays and several useful adjectives.</text>

  <!-- Panel 4 -->
  <circle cx="484" cy="476" r="10" fill="#7C3AED"/>
  <path d="M484 487 L484 536 M484 500 L565 482 M484 536 L469 558 M484 536 L500 558" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="708" cy="476" r="10" fill="#10B981"/>
  <path d="M708 487 L708 536 M708 500 L632 482 M708 536 L692 558 M708 536 L724 558" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="566" y="447" width="66" height="76" rx="5" fill="#FEF3C7" stroke="#D97706"/>
  <text x="599" y="467" font-size="11" fill="#1E1B4B" text-anchor="middle">
    <tspan x="599" dy="0" font-weight="700">TODAY</tspan>
    <tspan x="599" dy="17">NIGHT</tspan>
    <tspan x="599" dy="15">WINDOW</tspan>
    <tspan x="599" dy="16">74 BPM</tspan>
  </text>
  <rect x="533" y="360" width="184" height="48" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="625" y="390" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">PERFECT MATCH.</text>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Released today; apparently it already knows her type.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Content-based uses item features and preferences; collaborative uses other users' behavior.</text>
</svg>