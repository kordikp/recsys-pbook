<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb099-title pb099-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb099-title">The fastest service after the whistle</title>
<desc id="pb099-desc">Four-panel comic on the match clock. At a goal in minute 23 the fan shouts and the recommender, drawn as a waiter, has already served the goal replay. At half-time the fan asks for UFC finishes in round 1 and gets only round-1 knockouts and tap-outs, while a UFC press chat that merely matches the word is dropped. At the final whistle a crowd of fans arrives at once and the waiter calls in extra servers. Seconds later the fan is still celebrating and already has highlights, stats and analysis on the tray. Sports recommenders react in seconds, scale at the whistle and serve every format.</desc>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="32" font-size="19" font-weight="700" fill="#1E1B4B" text-anchor="middle">The fastest service after the whistle</text>
