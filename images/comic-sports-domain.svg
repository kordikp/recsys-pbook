.2" fill="#1E1B4B"/><circle cx="4" cy="-79" r="2.2" fill="#1E1B4B"/><path d="M-7,-71 Q-2,-66 3,-71" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/></g><rect x="92" y="200" width="118" height="6" rx="3" fill="#9CA3AF"/><rect x="98" y="142" width="106" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="151" y="166" font-size="20" text-anchor="middle">⚽</text><text x="151" y="188" font-size="15" font-weight="700" fill="#4C1D95" text-anchor="middle">Goal replay</text><text x="56" y="246" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Fan</text><text x="244" y="246" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="middle">Recommender</text></g>
