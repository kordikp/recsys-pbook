  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The next pick arrives before the applause ends.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Sports recommenders absorb live behavior, scale through matchday spikes, and respond in seconds.</text>
