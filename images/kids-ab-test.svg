<text x="616" y="376" text-anchor="end" font-size="15" font-weight="700" fill="#065F46">+30%</text>
<rect x="24" y="396" width="592" height="40" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
<text x="320" y="421" text-anchor="middle" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#92400E">The catch:</tspan> B runs a model per listener, so it costs more to serve.</text>
