<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" role="img" aria-labelledby="pb147-title pb147-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb147-title">TuneUp's A/B test: same app, one change</title>
<desc id="pb147-desc">TuneUp randomly splits 10,000 listeners into two groups of 5,000 that differ only in the recommender: A gets the same top-30 Popular Picks, B gets a Personal Mix. Over two weeks B's listeners played 11 tracks a day instead of 8, skipped 15% instead of 35%, and 78% instead of 60% stayed active daily. The catch: B costs more to serve, so the measured win is weighed against the cost.</desc>
