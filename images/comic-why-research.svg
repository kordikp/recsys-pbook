<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb108-title pb108-desc">
<title id="pb108-title">The shortest recipe took decades</title>
<desc id="pb108-desc">Four-panel comic. An engineer tries to improve recommendations by stacking more layers onto a deep neural network. A researcher offers a shortcut instead: the EASE recipe card from 2019, prep time decades of math, cooking one step, a single matrix inverse. On the same benchmark test the small EASE card takes first place and the tall deep network second. The engineer ships the paper: every Recombee research paper runs in production for 500+ customers. Brute force adds layers; research finds a better idea and ships it.</desc>
