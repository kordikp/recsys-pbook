<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 632" role="img" aria-labelledby="pb090-title pb090-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb090-title">Your usual has been expecting you</title>
<desc id="pb090-desc">Four-panel café comic about digital twins. 1: You order just a coffee, but the café's recommender notes the time, your order and that you eyed a muffin for 4 seconds. 2: Many such visit notes are learned into your digital twin, a model of your habits that says: weekdays 8:05, oat latte, extra hot, tempted by muffins. 3: You arrive incognito in sunglasses and a fake moustache; the recommender still offers your usual oat latte, extra hot, because your pattern matches the twin: no name needed. 4: You ask whether you agreed to this; the recommender points to page 47 of the long terms, where you tapped Accept. Takeaway: a digital twin is a model of your habits built from what you do; the real question is whether you knowingly agreed.</desc>
