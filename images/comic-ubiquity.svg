<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">A Highly Recommended Day Off</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="104" y="76" width="246" height="56" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="227" y="99" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="227" dy="0">Today: no algorithmic</tspan>
    <tspan x="227" dy="17">suggestions.</tspan>
  </text>
  <circle cx="75" cy="162" r="10" fill="#7C3AED"/>
  <path d="M75 173 L75 219 M75 187 L104 201 M75 219 L58 245 M75 219 L91 245" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="242" y="150" width="108" height="96" rx="8" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="296" y="175" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="296" dy="0">VIDEO · NEXT</tspan>
    <tspan x="296" dy="24">MUSIC · FOR YOU</tspan>
    <tspan x="296" dy="24">NEWS · TOP PICKS</tspan>
  </text>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Mira attempts one recommendation-free day.</text>

  <!-- Panel 2 -->
  <circle cx="450" cy="190" r="10" fill="#7C3AED"/>
  <path d="M450 201 L450 243 M450 215 L431 231 M450 216 L468 228 M450 243 L433 270 M450 243 L472 266" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="492" y="82" width="132" height="49" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="558" y="102" font-size="12" fill="#1E1B4B" text-anchor="middle">
    <tspan x="558" dy="0" font-weight="700">MAPS</tspan>
    <tspan x="558" dy="16">Faster route</tspan>
  </text>
  <rect x="635" y="143" width="130" height="49" rx="9" fill="#FEF3C7" stroke="#D97706"/>
  <text x="700" y="163" font-size="12" fill="#1E1B4B" text-anchor="middle">
    <tspan x="700" dy="0" font-weight="700">RIDES</tspan>
    <tspan x="700" dy="16">Car nearby</tspan>
  </text>
  <rect x="500" y="215" width="139" height="49" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="569.5" y="235" font-size="12" fill="#1E1B4B" text-anchor="middle">
    <tspan x="569.5" dy="0" font-weight="700">PODCASTS</tspan>
    <tspan x="569.5" dy="16">Play next</tspan>
  </text>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Maps, rides, and podcasts volunteer before she asks.</text>

  <!-- Panel 3 -->
  <rect x="34" y="354" width="153" height="53" rx="9" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="110.5" y="375" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="110.5" dy="0" font-weight="700">237 suggestions</tspan>
    <tspan x="110.5" dy="17">before lunch.</tspan>
  </text>
  <circle cx="91" cy="448" r="10" fill="#7C3AED"/>
  <path d="M91 459 L91 508 M91 474 L127 488 M91 508 L74 535 M91 508 L110 535" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="180" y="416" width="174" height="101" rx="8" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="191" y="427" width="152" height="77" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="267" y="449" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="267" dy="0">SHOPPING · SOCIAL</tspan>
    <tspan x="267" dy="22">SEARCH · FOOD</tspan>
    <tspan x="267" dy="22">Picked for you</tspan>
  </text>
  <path d="M165 518 L367 518" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Naming each one somehow makes the total worse.</text>

  <!-- Panel 4 -->
  <rect x="548" y="354" width="218" height="56" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="657" y="377" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="657" dy="0">For you: a quieter</tspan>
    <tspan x="657" dy="17">digital day tomorrow.</tspan>
  </text>
  <circle cx="470" cy="448" r="10" fill="#7C3AED"/>
  <path d="M470 459 L470 507 M470 475 L516 493 M470 507 L452 536 M470 507 L490 536" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="508" y="492" width="76" height="50" rx="6" fill="#FEF3C7" stroke="#D97706"/>
  <rect x="529" y="474" width="24" height="39" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
  <rect x="624" y="424" width="121" height="122" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <path d="M624 466 L745 466" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="684.5" y="447" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">SMART HOME</text>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Even the escape plan arrives as a personalized suggestion.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Recommenders span daily platforms; once noticed, hundreds of suggestions appear everywhere.</text>
</svg>