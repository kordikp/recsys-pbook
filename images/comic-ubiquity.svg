<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb103-title pb103-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb103-title">A highly recommended day off</title>
<desc id="pb103-desc">Four-panel comic. Mira plans a day off with no recommendations. At breakfast her phone shows YouTube Up next, Spotify Discover Weekly and Netflix Because you watched; she says those three do not count. Browsing, Amazon shows customers who bought this also bought and LinkedIn shows jobs you might be interested in; she wonders whether everything is a recommendation. She searches how to avoid recommendations and the search box autocompletes her question: six spotted by 10 a.m. Almost every app recommends; once you start counting, you cannot stop.</desc>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">A highly recommended day off</text>
