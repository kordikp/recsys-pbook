nd"/><rect x="150" y="181" width="62" height="6" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/><text x="181" y="177" text-anchor="middle" font-size="28">🏖️</text><path d="M216,220 V180 Q216,164 232,164 H248 Q264,164 264,180 V220 Z" fill="#7C3AED"/><path d="M231,165 L240,170 L231,175 Z M249,165 L240,170 L249,175 Z" fill="#FFFFFF"/><circle cx="240" cy="146" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/><circle cx="235" cy="144" r="2.2" fill="#1E1B4B"/><circle cx="245" cy="144" r="2.2" fill="#1E1B4B"/><path d="M235,151 Q240,156 245,151" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/><rect x="10" y="227" width="278" height="24" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="149" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">✓ Success = booked, not browsed</text></g>
