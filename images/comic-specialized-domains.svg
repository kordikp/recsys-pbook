<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb098-title pb098-desc">
<title id="pb098-title">Your next stop is highly recommended</title>
<desc id="pb098-desc">Four-panel comic about what travel, job and education recommendation share. On a travel site you have one week off this year; the recommender suggests Lisbon because it fits your 7 to 14 August dates, and success means a booking, not browsing. On a job board the recommender shows a night-nurse job to the candidate and the candidate's CV to the employer, who first wants a license; success is a hire both sides say yes to. On a learning app you watched 12 algebra videos, but the recommender gives a quiz first because algebra needs fractions; success is learning, not watching. The recommender's notes: all three are rare decisions with little data to learn from, high stakes, and hard limits such as dates, licenses and prerequisites. Your next stop matters more than your next click.</desc>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Your next stop is highly recommended</text>
