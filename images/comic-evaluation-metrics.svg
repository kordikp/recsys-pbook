<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb068-title pb068-desc">
<title id="pb068-title">The clean-plate test has a serving problem</title>
<desc id="pb068-desc">Four-panel comic. 1: The old recommender, a waiter, serves burgers to almost everyone, so the log shows the burger served 100 times with 90 clean plates and the bowl served only 4 times, with 4 clean plates. 2: A new recommender wants to serve the bowl more often, but the offline test only reads that log and says the burger wins, 90 to 4: barely served means barely counted. 3: The fix discounts popularity, so a clean plate of a rarely served dish counts more (popularity penalty beta about 0.30); the offline test then picks the recommender that wins with real diners 34.3% of the time instead of 12.9%, nearly three times as often but not always. 4: Make the score the goal and the waiter serves tiny portions for 100% clean plates, so the score stops measuring lunch.</desc>
