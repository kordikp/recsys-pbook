<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb127-title pb127-desc">
<title id="pb127-title">LightGCN: every layer reaches one hop further</title>
<desc id="pb127-desc">A toy user-item graph unrolled from user U2. Layer 1 brings in the items U2 used (I1, I2, I3), weighted by 1 over the square root of both nodes' degrees, so the popular item I3 counts less (1/3 versus 1/√6). Layer 2 brings in the users who share those items (U1, U3, U4), and layer 3 brings in their other items (I4, I5). After three layers U2's embedding reflects items it never touched: the multi-hop signal that matrix factorization compresses into a single latent space.</desc>
<defs>
<marker id="pb127-h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4C1D95"/></marker>
<marker id="pb127-h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
</defs>
<rect x=".5" y=".5" width="639" height="467" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

<text x="320" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">LightGCN: every layer reaches one hop further</text>
<text x="320" y="62" text-anchor="middle" font-size="14" fill="#6B7280">Toy graph · circles = users, squares = items · arrows = messages to U2</text>

<!-- column bands -->
<rect x="166" y="82" width="130" height="224" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="322" y="82" width="130" height="224" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="478" y="82" width="146" height="224" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="231" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Layer 1</text>
<text x="231" y="123" text-anchor="middle" font-size="14" fill="#4B5563">items U2 used</text>
<text x="387" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">Layer 2</text>
<text x="387" y="123" text-anchor="middle" font-size="14" fill="#4B5563">who share them</text>
<text x="551" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">Layer 3</text>
<text x="551" y="123" text-anchor="middle" font-size="14" fill="#4B5563">their other items</text>

<!-- layer 3 messages: items -> users (dashed) -->
<g stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" fill="none" marker-end="url(#pb127-h2)">
<line x1="519" y1="210" x2="412" y2="210"/>
<line x1="519" y1="219" x2="410" y2="261"/>
<line x1="519" y1="270" x2="412" y2="270"/>
</g>
<!-- layer 2 messages: users -> items -->
<g stroke="#7C3AED" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#pb127-h2)">
<line x1="363" y1="150" x2="256" y2="150"/>
<line x1="365" y1="159" x2="256" y2="201"/>
<line x1="365" y1="219" x2="256" y2="261"/>
<line x1="363" y1="270" x2="256" y2="270"/>
</g>
<!-- layer 1 messages: items -> U2 -->
<g stroke="#4C1D95" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#pb127-h1)">
<line x1="207" y1="152" x2="91" y2="199"/>
<line x1="207" y1="210" x2="93" y2="210"/>
<line x1="207" y1="268" x2="91" y2="221"/>
</g>
<!-- layer-1 weights -->
<g font-size="14" font-weight="600" fill="#4C1D95" text-anchor="middle">
<rect x="117" y="167" width="46" height="22" rx="11" fill="#EDE9FE"/>
<text x="140" y="183">1/√6</text>
<rect x="117" y="199" width="46" height="22" rx="11" fill="#EDE9FE"/>
<text x="140" y="215">1/√6</text>
<rect x="117" y="233" width="46" height="22" rx="11" fill="#EDE9FE"/>
<text x="140" y="249">1/3</text>
</g>

<!-- target user U2 -->
<circle cx="64" cy="210" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="2.5"/>
<text x="64" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">U2</text>
<text x="64" y="256" text-anchor="middle" font-size="14" fill="#065F46">target</text>
<text x="64" y="273" text-anchor="middle" font-size="14" fill="#065F46">user</text>

<!-- layer 1 items -->
<g fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5">
<rect x="211" y="130" width="40" height="40" rx="8"/>
<rect x="211" y="190" width="40" height="40" rx="8"/>
<rect x="211" y="250" width="40" height="40" rx="8"/>
</g>
<g font-size="15" font-weight="700" fill="#1E1B4B" text-anchor="middle">
<text x="231" y="155">I1</text>
<text x="231" y="215">I2</text>
<text x="231" y="275">I3</text>
</g>

<!-- layer 2 users -->
<g fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5">
<circle cx="387" cy="150" r="20"/>
<circle cx="387" cy="210" r="20"/>
<circle cx="387" cy="270" r="20"/>
</g>
<g font-size="15" font-weight="700" fill="#1E1B4B" text-anchor="middle">
<text x="387" y="155">U1</text>
<text x="387" y="215">U3</text>
<text x="387" y="275">U4</text>
</g>

<!-- layer 3 items: new for U2 -->
<rect x="503" y="139" width="80" height="24" rx="12" fill="#EDE9FE"/>
<text x="543" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#4C1D95">new for U2</text>
<g fill="#EDE9FE" stroke="#7C3AED" stroke-width="2">
<rect x="523" y="190" width="40" height="40" rx="8"/>
<rect x="523" y="250" width="40" height="40" rx="8"/>
</g>
<g font-size="15" font-weight="700" fill="#4C1D95" text-anchor="middle">
<text x="543" y="215">I4</text>
<text x="543" y="275">I5</text>
</g>

<!-- the LightGCN step -->
<rect x="16" y="322" width="608" height="90" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="36" y="347" font-size="16" font-weight="700" fill="#1E1B4B">Each layer: a plain weighted sum of neighbours</text>
<text x="36" y="374" font-size="17" fill="#4C1D95">weight(u, i) = 1 / √( |N<tspan font-size="14" dy="4">u</tspan><tspan dy="-4">| · |N</tspan><tspan font-size="14" dy="4">i</tspan><tspan dy="-4">| )</tspan></text>
<text x="36" y="399" font-size="16" fill="#4B5563">U2: 3 items · I1, I2: 2 users → 1/√6 ≈ 0.41 · I3: 3 users → 1/3</text>

<text x="320" y="446" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">3 layers = 3 hops: <tspan fill="#7C3AED">I4 and I5</tspan> now shape U2's embedding</text>
</svg>
