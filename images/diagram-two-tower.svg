<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="478" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="340" y="29" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1B4B">Two-Tower Architecture</text>
  <text x="340" y="49" text-anchor="middle" font-size="12" fill="#6B7280">Separate encoders for users and items, unified embedding space</text>

  <!-- Shared Embedding Space -->
  <g transform="translate(190,63)">
    <rect x="0" y="0" width="300" height="72" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="150" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Shared Embedding Space</text>

    <rect x="10" y="39" width="112" height="24" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="66" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">[0.3, 0.8, ..., 0.5]</text>

    <rect x="178" y="39" width="112" height="24" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="234" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">[0.4, 0.7, ..., 0.6]</text>

    <text x="150" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">similarity</text>
    <line x1="124" y1="51" x2="176" y2="51" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- User Tower -->
  <g transform="translate(100,150)">
    <rect x="0" y="0" width="180" height="240" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="90" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0EA5E9">User Tower</text>

    <line x1="90" y1="-2" x2="90" y2="-15" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="25" y="35" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="90" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Dense Layer (128)</text>

    <line x1="90" y1="65" x2="90" y2="78" stroke="#0EA5E9" stroke-width="1.5"/>

    <rect x="25" y="78" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="90" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Dense Layer (256)</text>

    <line x1="90" y1="108" x2="90" y2="118" stroke="#0EA5E9" stroke-width="1.5"/>

    <rect x="25" y="118" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="90" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Dense Layer (512)</text>

    <line x1="90" y1="148" x2="90" y2="158" stroke="#0EA5E9" stroke-width="1.5"/>

    <rect x="10" y="158" width="160" height="72" rx="6" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="90" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#0EA5E9">Inputs</text>

    <g font-size="11" fill="#1E1B4B">
      <circle cx="27" cy="191" r="3" fill="#0EA5E9"/>
      <text x="36" y="195">Browse history</text>
      <circle cx="27" cy="207" r="3" fill="#0EA5E9"/>
      <text x="36" y="211">Demographics</text>
      <circle cx="27" cy="223" r="3" fill="#0EA5E9"/>
      <text x="36" y="227">Context (time, device)</text>
    </g>
  </g>

  <!-- Item Tower -->
  <g transform="translate(400,150)">
    <rect x="0" y="0" width="180" height="240" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="90" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#10B981">Item Tower</text>

    <line x1="90" y1="-2" x2="90" y2="-15" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="25" y="35" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Dense Layer (128)</text>

    <line x1="90" y1="65" x2="90" y2="78" stroke="#10B981" stroke-width="1.5"/>

    <rect x="25" y="78" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Dense Layer (256)</text>

    <line x1="90" y1="108" x2="90" y2="118" stroke="#10B981" stroke-width="1.5"/>

    <rect x="25" y="118" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Dense Layer (512)</text>

    <line x1="90" y1="148" x2="90" y2="158" stroke="#10B981" stroke-width="1.5"/>

    <rect x="10" y="158" width="160" height="72" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#10B981">Inputs</text>

    <g font-size="11" fill="#1E1B4B">
      <circle cx="27" cy="191" r="3" fill="#10B981"/>
      <text x="36" y="195">Title &amp; description</text>
      <circle cx="27" cy="207" r="3" fill="#10B981"/>
      <text x="36" y="211">Category &amp; attributes</text>
      <circle cx="27" cy="223" r="3" fill="#10B981"/>
      <text x="36" y="227">Image embedding</text>
    </g>
  </g>

  <!-- Independent training annotation -->
  <g transform="translate(290,207)">
    <rect x="7" y="-10" width="86" height="42" rx="7" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="50" y="7" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">Trained</text>
    <text x="50" y="22" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">independently</text>
  </g>

  <!-- Serving Pipeline -->
  <g transform="translate(80,410)">
    <rect x="0" y="0" width="520" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="260" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#D97706">Serving Pipeline</text>
    <text x="260" y="39" text-anchor="middle" font-size="11" fill="#6B7280">Compute user embedding → ANN lookup in item index → Top candidates in &lt;10ms</text>
  </g>
</svg>