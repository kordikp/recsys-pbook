<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-labelledby="pb145-title pb145-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb145-title">Two towers: trained together, served apart</title>
  <desc id="pb145-desc">A user tower and an item tower are trained together so that a user's vector lands near the vectors of items they engage with; at serving time the item vectors are pre-computed into an ANN index, so each request runs only the user tower plus one nearest-neighbour lookup to get 100 to 500 candidates, typically in under 20 ms.</desc>
  <defs>
    <marker id="pb145-ah-g" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#10B981"/></marker>
    <marker id="pb145-ah-p" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="469" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Two towers: trained together, served apart</text>

  <!-- ===== User column (green) ===== -->
  <rect x="24" y="78" width="146" height="28" rx="14" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="97" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">Live, per request</text>

  <rect x="24" y="118" width="146" height="34" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <g>
    <rect x="34" y="129" width="10" height="12" rx="2" fill="#10B981"/>
    <rect x="47" y="129" width="10" height="12" rx="2" fill="#10B981" opacity=".45"/>
    <rect x="60" y="129" width="10" height="12" rx="2" fill="#10B981" opacity=".75"/>
    <rect x="73" y="129" width="10" height="12" rx="2" fill="#10B981" opacity=".3"/>
  </g>
  <text x="91" y="140" font-size="14" font-weight="600" fill="#1E1B4B">user vector</text>

  <line x1="97" y1="176" x2="97" y2="158" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb145-ah-g)"/>
  <polygon points="59,178 135,178 167,300 27,300" fill="#D1FAE5" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
  <line x1="55" y1="218" x2="139" y2="218" stroke="#10B981" stroke-width="1.5" opacity=".4"/>
  <line x1="44" y1="262" x2="150" y2="262" stroke="#10B981" stroke-width="1.5" opacity=".4"/>
  <text x="97" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">User tower</text>

  <line x1="97" y1="320" x2="97" y2="306" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb145-ah-g)"/>
  <rect x="24" y="322" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="97" y="341" text-anchor="middle" font-size="14" fill="#1E1B4B">interaction history</text>
  <rect x="24" y="356" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="97" y="375" text-anchor="middle" font-size="14" fill="#1E1B4B">context · device</text>

  <!-- ===== Item column (purple) ===== -->
  <rect x="470" y="78" width="146" height="28" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="543" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#4C1D95">Offline, in advance</text>

  <rect x="478" y="112" width="130" height="34" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="470" y="118" width="146" height="34" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <g>
    <rect x="480" y="129" width="10" height="12" rx="2" fill="#7C3AED" opacity=".4"/>
    <rect x="493" y="129" width="10" height="12" rx="2" fill="#7C3AED"/>
    <rect x="506" y="129" width="10" height="12" rx="2" fill="#7C3AED" opacity=".6"/>
    <rect x="519" y="129" width="10" height="12" rx="2" fill="#7C3AED" opacity=".3"/>
  </g>
  <text x="537" y="140" font-size="14" font-weight="600" fill="#1E1B4B">all items</text>

  <line x1="543" y1="176" x2="543" y2="158" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb145-ah-p)"/>
  <polygon points="505,178 581,178 613,300 473,300" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/>
  <line x1="501" y1="218" x2="585" y2="218" stroke="#7C3AED" stroke-width="1.5" opacity=".4"/>
  <line x1="490" y1="262" x2="596" y2="262" stroke="#7C3AED" stroke-width="1.5" opacity=".4"/>
  <text x="543" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#4C1D95">Item tower</text>

  <line x1="543" y1="320" x2="543" y2="306" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb145-ah-p)"/>
  <rect x="470" y="322" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="543" y="341" text-anchor="middle" font-size="14" fill="#1E1B4B">title · category</text>
  <rect x="470" y="356" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="543" y="375" text-anchor="middle" font-size="14" fill="#1E1B4B">image features</text>

  <!-- ===== Shared space / index ===== -->
  <line x1="172" y1="135" x2="202" y2="135" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb145-ah-g)"/>
  <line x1="468" y1="135" x2="438" y2="135" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb145-ah-p)"/>
  <rect x="206" y="78" width="228" height="138" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Shared space = ANN index</text>
  <g fill="#7C3AED" opacity=".35">
    <circle cx="232" cy="126" r="5"/><circle cx="246" cy="178" r="5"/><circle cx="240" cy="150" r="5"/>
    <circle cx="262" cy="122" r="5"/><circle cx="372" cy="122" r="5"/><circle cx="392" cy="160" r="5"/>
    <circle cx="412" cy="130" r="5"/><circle cx="356" cy="180" r="5"/><circle cx="414" cy="182" r="5"/>
  </g>
  <circle cx="300" cy="152" r="31" fill="#D1FAE5" fill-opacity=".45" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g fill="#7C3AED">
    <circle cx="318" cy="137" r="5.5"/><circle cx="284" cy="167" r="5.5"/><circle cx="322" cy="168" r="5.5"/>
  </g>
  <circle cx="300" cy="152" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="320" y="204" text-anchor="middle" font-size="14" fill="#4B5563">nearest items = candidates</text>

  <!-- ===== Training ===== -->
  <rect x="206" y="232" width="228" height="152" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="320" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Trained together</text>
  <text x="320" y="276" text-anchor="middle" font-size="14" fill="#6B7280">on (user, item) pairs</text>
  <circle cx="228" cy="312" r="7" fill="#10B981"/>
  <circle cx="292" cy="312" r="7" fill="#7C3AED"/>
  <line x1="239" y1="312" x2="253" y2="312" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M249,307 L255,312 L249,317" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="281" y1="312" x2="267" y2="312" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M271,307 L265,312 L271,317" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="310" y="317" font-size="14" fill="#1E1B4B"><tspan font-weight="700">watched:</tspan> closer</text>
  <circle cx="251" cy="352" r="7" fill="#10B981"/>
  <circle cx="269" cy="352" r="7" fill="#7C3AED"/>
  <line x1="240" y1="352" x2="226" y2="352" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M230,347 L224,352 L230,357" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="280" y1="352" x2="294" y2="352" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M290,347 L296,352 L290,357" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="310" y="357" font-size="14" fill="#1E1B4B"><tspan font-weight="700">negative:</tspan> apart</text>

  <!-- ===== Serving takeaway ===== -->
  <rect x="24" y="402" width="592" height="50" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="44" y="436" font-size="26" font-weight="800" fill="#4C1D95">&lt; 20 ms</text>
  <text x="160" y="422" font-size="15" fill="#1E1B4B">per request: run <tspan font-weight="700">one</tspan> tower + one index lookup</text>
  <text x="160" y="442" font-size="15" fill="#1E1B4B">→ 100–500 candidates for the ranker (typical)</text>
</svg>
