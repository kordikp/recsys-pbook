<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .lane{animation:l 6s ease-in-out infinite}
    .lane2{animation:l 6s ease-in-out infinite;animation-delay:2s}
    .lane3{animation:l 6s ease-in-out infinite;animation-delay:4s}
    @keyframes l{0%,28%,100%{stroke-width:2}8%,20%{stroke-width:3.5}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Open-Source RecSys: Pick by What You're Doing</text>

  <g text-anchor="middle" font-size="12.5">
    <rect class="lane" x="55" y="70" width="215" height="280" rx="12" fill="#D1FAE5" stroke="#10B981"/>
    <text x="162" y="98" font-size="15" font-weight="800" fill="#065F46">LEARNING</text>
    <rect x="75" y="116" width="175" height="48" rx="8" fill="#FFFFFF" stroke="#10B981"/>
    <text x="162" y="136" font-weight="700" fill="#065F46">Surprise</text><text x="162" y="153" fill="#6B7280">classic CF in 10 lines</text>
    <rect x="75" y="172" width="175" height="48" rx="8" fill="#FFFFFF" stroke="#10B981"/>
    <text x="162" y="192" font-weight="700" fill="#065F46">Implicit</text><text x="162" y="209" fill="#6B7280">ALS/BPR, fast C++</text>
    <rect x="75" y="228" width="175" height="48" rx="8" fill="#FFFFFF" stroke="#10B981"/>
    <text x="162" y="248" font-weight="700" fill="#065F46">LensKit</text><text x="162" y="265" fill="#6B7280">teaching-grade rigor</text>
    <text x="162" y="330" fill="#065F46">goal: understand</text>

    <rect class="lane2" x="292" y="70" width="215" height="280" rx="12" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="400" y="98" font-size="15" font-weight="800" fill="#4C1D95">PRODUCTION</text>
    <rect x="312" y="116" width="175" height="48" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
    <text x="400" y="136" font-weight="700" fill="#4C1D95">TorchRec</text><text x="400" y="153" fill="#6B7280">Meta-scale embeddings</text>
    <rect x="312" y="172" width="175" height="48" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
    <text x="400" y="192" font-weight="700" fill="#4C1D95">Merlin / HugeCTR</text><text x="400" y="209" fill="#6B7280">GPU pipelines</text>
    <rect x="312" y="228" width="175" height="48" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
    <text x="400" y="248" font-weight="700" fill="#4C1D95">Faiss / Milvus</text><text x="400" y="265" fill="#6B7280">ANN retrieval</text>
    <text x="400" y="330" fill="#4C1D95">goal: serve millions</text>

    <rect class="lane3" x="529" y="70" width="215" height="280" rx="12" fill="#FEF3C7" stroke="#D97706"/>
    <text x="637" y="98" font-size="15" font-weight="800" fill="#92400E">RESEARCH</text>
    <rect x="549" y="116" width="175" height="48" rx="8" fill="#FFFFFF" stroke="#D97706"/>
    <text x="637" y="136" font-weight="700" fill="#92400E">RecBole</text><text x="637" y="153" fill="#6B7280">70+ models, one API</text>
    <rect x="549" y="172" width="175" height="48" rx="8" fill="#FFFFFF" stroke="#D97706"/>
    <text x="637" y="192" font-weight="700" fill="#92400E">Elliot</text><text x="637" y="209" fill="#6B7280">rigorous evaluation</text>
    <rect x="549" y="228" width="175" height="48" rx="8" fill="#FFFFFF" stroke="#D97706"/>
    <text x="637" y="248" font-weight="700" fill="#92400E">ReChorus</text><text x="637" y="265" fill="#6B7280">sequential baselines</text>
    <text x="637" y="330" fill="#92400E">goal: fair comparison</text>
  </g>
  <text x="400" y="390" text-anchor="middle" font-size="13" fill="#6B7280">Same math, three toolboxes — the mistake is using a teaching library to serve production traffic.</text>
</svg>
