<title id="pb152-title">Filter bubble: one click, six weeks, one topic</title>
<desc id="pb152-desc">One click on a cloud computing article feeds a loop — click, more of the same, click again — until by week 6 the feed is all cloud and feels normal, while edge computing, org design and data governance silently drop out; a healthier feed deliberately mixes in something new.</desc>
