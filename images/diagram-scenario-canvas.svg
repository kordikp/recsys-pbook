<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" role="img" aria-labelledby="pb141-title pb141-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb141-title">One canvas, two placements</title>
<desc id="pb141-desc">The scenario canvas asks the same eight questions for every placement; answered for a homepage carousel and a cart cross-sell in the same shop, they produce two very different designs: one tuned for discovery, one for extra revenue.</desc>
