<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .orbit{animation:o 8s linear infinite;transform-origin:400px 235px}
    @keyframes o{to{transform:rotate(360deg)}}
    .counter{animation:c 8s linear infinite reverse;transform-origin:0 0}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Incident Response: The Loop That Never Panics</text>

  <circle cx="400" cy="235" r="120" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 6"/>
  <g class="orbit"><circle cx="400" cy="115" r="7" fill="#7C3AED"/></g>

  <g text-anchor="middle" font-size="13">
    <rect x="330" y="78" width="140" height="52" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="400" y="99" font-weight="800" fill="#B91C1C">1 · DETECT</text>
    <text x="400" y="118" fill="#B91C1C" font-size="11.5">alert fires: CTR −30 %</text>

    <rect x="545" y="205" width="150" height="52" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="620" y="226" font-weight="800" fill="#92400E">2 · MITIGATE</text>
    <text x="620" y="245" fill="#92400E" font-size="11.5">rollback / safe fallback</text>

    <rect x="330" y="332" width="140" height="52" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="400" y="353" font-weight="800" fill="#075985">3 · DIAGNOSE</text>
    <text x="400" y="372" fill="#075985" font-size="11.5">logs · diffs · features</text>

    <rect x="105" y="205" width="150" height="52" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="180" y="226" font-weight="800" fill="#065F46">4 · POST-MORTEM</text>
    <text x="180" y="245" fill="#065F46" font-size="11.5">blameless → new guardrail</text>
  </g>

  <text x="400" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">mitigate FIRST,</text>
  <text x="400" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">understand second</text>
</svg>
