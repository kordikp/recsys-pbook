<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb066-title pb066-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb066-title">Your cart has been taking notes</title>
<desc id="pb066-desc">Four-panel comic in an online coffee shop. Cross-sell: you put beans in your cart and the shop's recommender offers filters to go with them. Upsell: you look at a basic coffee maker and it suggests the pricier Deluxe that also froths milk. Next basket: on Tuesday oat milk is already in your basket, because you buy it every Tuesday. Returns: you send the Deluxe back and the recommender crosses it out in its notes. Beyond similar products, a shop recommends what goes with your cart, a better version and your usual, and every return teaches it what not to suggest.</desc>
<defs><marker id="pb066-arrow-am" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#F59E0B"/></marker></defs>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
