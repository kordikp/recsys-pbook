<text x="68" y="21" font-size="14" font-weight="600" fill="#1E1B4B">Music app</text>
<!-- server bubble -->
<path d="M22,40 H142 Q154,40 154,52 V96 Q154,108 142,108 H62 L54,127 L46,108 H22 Q10,108 10,96 V52 Q10,40 22,40 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
<text x="82" y="60" text-anchor="middle" font-size="15" fill="#1E1B4B"><tspan x="82">You loved</tspan><tspan x="82" dy="19">this song.</tspan><tspan x="82" dy="19" font-weight="700" fill="#4C1D95">One more?</tspan></text>
<!-- user bubble -->
<path d="M178,58 H278 Q290,58 290,70 V92 Q290,104 278,104 H246 L238,137 L230,104 H178 Q166,104 166,92 V70 Q166,58 178,58 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
<text x="228" y="77" text-anchor="middle" font-size="15" fill="#1E1B4B"><tspan x="228">Yes! On repeat</tspan><tspan x="228" dy="19">all week.</tspan></text>
<!-- floor -->
<path d="M12,220.5 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
<!-- server -->
<path d="M30,220 V180 Q30,164 46,164 H62 Q78,164 78,180 V220 Z" fill="#7C3AED"/>
