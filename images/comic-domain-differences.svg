<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb064-title pb064-desc">
<title id="pb064-title">Same server, different orders</title>
<desc id="pb064-desc">Four-panel comic. A waiter-like recommender knows one rule, more of what you just had, and uses it on four sites. In a music app it offers the song you loved again and you happily replay it all week. In an online shop it offers another laptop right after you bought one. On a news site it offers yesterday's storm story, which is already old news. On a job board it pushes more CEO jobs to an intern who clicked one out of curiosity. Domains differ in repeats, shelf life and what a click means, so one approach cannot fit all.</desc>

<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Same server, different orders</text>
<text x="320" y="53" text-anchor="middle" font-size="15" fill="#4B5563"><tspan font-weight="700" fill="#7C3AED">The recommender</tspan> knows one rule: “more of what you just had.”</text>

<!-- ===== Panel 1: music app ===== -->
<g transform="translate(16,62)">
<rect x="0" y="0" width="298" height="259" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<path d="M0.75,32 V12 Q0.75,0.75 12,0.75 H286 Q297.25,0.75 297.25,12 V32 Z" fill="#F3F4F6"/>
