<path d="M230,161 Q238,169 246,161" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
<!-- verdict -->
<rect x="10" y="227" width="278" height="24" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
<text x="149" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">✓ Repeats are welcome</text>
</g>

