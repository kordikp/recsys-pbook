<circle cx="54" cy="146" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
<circle cx="49" cy="144" r="2.2" fill="#1E1B4B"/><circle cx="59" cy="144" r="2.2" fill="#1E1B4B"/>
<path d="M49,151 Q54,156 59,151" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
