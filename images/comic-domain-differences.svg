<path d="M214,220 V190 Q214,174 230,174 H246 Q262,174 262,190 V220 Z" fill="#10B981"/>
<circle cx="238" cy="156" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
