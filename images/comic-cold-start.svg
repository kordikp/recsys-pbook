<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb048-title pb048-desc">
<title id="pb048-title">Find the tribe: a brand-new item’s first days</title>
<desc id="pb048-desc">Four-panel comic. A recommender robot gets a brand-new item with zero clicks: its tags say what it is, not who will like it. It runs a small trial, showing the item to two triangle people and two circle people; both triangles love it, both circles shrug. The tally reads triangles 2 of 2, circles 0 of 2, so the robot has found the item's tribe. Now every triangle person gets the item, including one who was never asked, the circles are left alone, and the item is not cold anymore.</desc>
