    <path d="M236,155 Q241,151 246,155" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

    <text x="149" y="247" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">Flawless math. Flawed menu.</text>
  </g>

  <text x="320" y="614" text-anchor="middle" font-size="16" fill="#1E1B4B"><tspan font-weight="700">Items, users, interactions:</tspan> when picks go wrong, check the data first.</text>
</svg>
