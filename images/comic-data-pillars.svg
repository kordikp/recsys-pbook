    <path d="M29,222 V182 Q29,166 45,166 H59 Q75,166 75,182 V222 Z" fill="#10B981"/>
    <circle cx="52" cy="145" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
    <circle cx="49" cy="143" r="2.2" fill="#1E1B4B"/>
    <circle cx="61" cy="143" r="2.2" fill="#1E1B4B"/>
    <path d="M50,151 Q55,155 60,151" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    <text x="52" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Mira</text>

    <!-- guest card -->
