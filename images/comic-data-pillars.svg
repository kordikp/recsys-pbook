<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb055-title pb055-desc">
  <title id="pb055-title">Tonight’s special stands on three data pillars</title>
  <desc id="pb055-desc">Four-panel comic. A waiter, who is the recommender, needs three kinds of data before he picks tonight’s special. 1, item catalog: the menu lists each dish with its details, but the risotto’s tag is missing. 2, user catalog: guest Mira’s card says no dairy. 3, interactions: the order book shows that Mira and Leo both ordered tacos and Leo also ordered risotto, the waiter’s best clue. Then he recommends risotto to Mira because taco fans also ordered it, but it is creamy and she said no dairy: flawless math, flawed menu. Takeaway: a recommender rests on items, users and interactions; when picks go wrong, check the data first.</desc>

  <defs>
    <marker id="pb055-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Tonight’s special stands on three data pillars</text>

  <!-- ===== Panel 1: item catalog ===== -->
  <g transform="translate(16,52)">
    <rect x="0" y="0" width="298" height="258" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="11" fill="#1E1B4B"/>
    <text x="24" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Item catalog</text>

    <path d="M104,44 H274 Q286,44 286,56 V84 Q286,96 274,96 H244 L236,124 L228,96 H104 Q92,96 92,84 V56 Q92,44 104,44 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="189" y="65" text-anchor="middle" font-size="16" fill="#1E1B4B">Before I recommend:</text>
    <text x="189" y="85" text-anchor="middle" font-size="16" fill="#1E1B4B">what do we serve?</text>

    <line x1="12" y1="222" x2="286" y2="222" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- menu board -->
    <path d="M34,214 L28,222 M182,214 L188,222" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <rect x="14" y="104" width="188" height="110" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="108" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B" letter-spacing="2">MENU</text>
    <line x1="26" y1="132" x2="190" y2="132" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="26" y="154" font-size="15" fill="#1E1B4B">Tomato soup</text>
    <rect x="132" y="139" width="58" height="20" rx="10" fill="#F3F4F6" stroke="#D1D5DB"/>
    <text x="161" y="153" text-anchor="middle" font-size="14" fill="#1E1B4B">vegan</text>
    <text x="26" y="178" font-size="15" fill="#1E1B4B">Tacos</text>
    <rect x="132" y="163" width="58" height="20" rx="10" fill="#F3F4F6" stroke="#D1D5DB"/>
    <text x="161" y="177" text-anchor="middle" font-size="14" fill="#1E1B4B">spicy</text>
    <text x="26" y="202" font-size="15" fill="#1E1B4B">Risotto</text>
    <rect x="132" y="187" width="58" height="20" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="161" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">?</text>

    <!-- waiter = recommender -->
