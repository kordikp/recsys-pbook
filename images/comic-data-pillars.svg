    <text x="86" y="85" text-anchor="middle" font-size="16" fill="#1E1B4B">No dairy, please.</text>

    <path d="M206,44 H274 Q286,44 286,56 V66 Q286,78 274,78 H246 L238,124 L230,78 H206 Q194,78 194,66 V56 Q194,44 206,44 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
