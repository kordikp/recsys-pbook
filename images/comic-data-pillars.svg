    <text x="221" y="65" text-anchor="middle" font-size="15" fill="#1E1B4B">Creamy risotto?</text>
    <text x="221" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">I said no dairy!</text>

    <line x1="12" y1="222" x2="286" y2="222" stroke="#E5E7EB" stroke-width="1.5"/>

