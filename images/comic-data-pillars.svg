<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1E1B4B">Tonight’s Special: Structural Integrity</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <g>
    <rect x="32" y="76" width="184" height="48" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="44" y="96" font-size="12.5" fill="#1E1B4B">
      <tspan x="44" dy="0">Before I recommend:</tspan>
      <tspan x="44" dy="17">what can we actually make?</tspan>
    </text>

    <rect x="249" y="76" width="125" height="48" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="311.5" y="105" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Surprise me.</text>

    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="75" cy="163" r="10" fill="#7C3AED" stroke="none"/>
      <path d="M75 174 L75 218 M75 185 L103 198 M75 187 L57 204 M75 218 L62 239 M75 218 L88 239"/>
    </g>

    <g>
      <rect x="125" y="141" width="148" height="103" rx="7" fill="#FEF3C7" stroke="#D97706"/>
      <text x="199" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">ITEM CATALOG</text>
      <line x1="141" y1="172" x2="257" y2="172" stroke="#D97706"/>
      <text x="141" y="191" font-size="12" fill="#6B7280">tomato soup · vegan</text>
      <text x="141" y="211" font-size="12" fill="#6B7280">risotto · contains dairy</text>
      <text x="141" y="231" font-size="12" fill="#6B7280">tacos · spicy</text>
    </g>

    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="330" cy="163" r="10" fill="#10B981" stroke="none"/>
      <path d="M330 174 L330 218 M330 186 L306 199 M330 186 L350 201 M330 218 L317 239 M330 218 L343 239"/>
    </g>
  </g>
  <text x="204" y="306" text-anchor="middle" font-size="12" fill="#6B7280">First: a menu whose dishes actually have names.</text>

  <!-- Panel 2 -->
  <g>
    <rect x="424" y="76" width="141" height="44" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="494.5" y="103" text-anchor="middle" font-size="12.5" fill="#1E1B4B">You remembered.</text>

    <rect x="604" y="76" width="162" height="44" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="685" y="103" text-anchor="middle" font-size="12.5" fill="#1E1B4B">The form remembered.</text>

    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="470" cy="158" r="10" fill="#10B981" stroke="none"/>
      <path d="M470 169 L470 216 M470 183 L492 197 M470 183 L451 198 M470 216 L457 239 M470 216 L483 239"/>
    </g>

    <g>
      <rect x="523" y="139" width="145" height="108" rx="7" fill="#E0F2FE" stroke="#0EA5E9"/>
      <rect x="570" y="133" width="51" height="13" rx="5" fill="#FFFFFF" stroke="#0EA5E9"/>
      <text x="595.5" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">USER CATALOG</text>
      <text x="540" y="188" font-size="12" fill="#6B7280">Mira</text>
      <text x="540" y="208" font-size="12" fill="#6B7280">dairy: no</text>
      <text x="540" y="228" font-size="12" fill="#6B7280">spice: yes</text>
    </g>

    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="720" cy="158" r="10" fill="#7C3AED" stroke="none"/>
      <path d="M720 169 L720 216 M720 183 L692 198 M720 183 L739 198 M720 216 L707 239 M720 216 L733 239"/>
    </g>
  </g>
  <text x="596" y="306" text-anchor="middle" font-size="12" fill="#6B7280">Second: one diner, accurately described.</text>

  <!-- Panel 3 -->
  <g>
    <rect x="32" y="356" width="155" height="46" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="109.5" y="376" text-anchor="middle" font-size="12.5" fill="#1E1B4B">
      <tspan x="109.5" dy="0">I tapped past every</tspan>
      <tspan x="109.5" dy="17">“mystery dish.”</tspan>
    </text>

    <rect x="218" y="356" width="156" height="46" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="296" y="376" text-anchor="middle" font-size="12.5" fill="#1E1B4B">
      <tspan x="296" dy="0">Wonderful.</tspan>
      <tspan x="296" dy="17">Ten thousand clicks.</tspan>
    </text>

    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="74" cy="443" r="10" fill="#10B981" stroke="none"/>
      <path d="M74 454 L74 500 M74 467 L104 479 M74 467 L55 481 M74 500 L61 522 M74 500 L87 522"/>
    </g>

    <g>
      <path d="M119 421 H278 V526 L270 519 L262 526 L254 519 L246 526 L238 519 L230 526 L222 519 L214 526 L206 519 L198 526 L190 519 L182 526 L174 519 L166 526 L158 519 L150 526 L142 519 L134 526 L126 519 L119 526 Z" fill="#FFFFFF" stroke="#0EA5E9"/>
      <text x="198.5" y="444" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">INTERACTIONS</text>
      <text x="137" y="466" font-size="12" fill="#6B7280">clicked: “dish_???”</text>
      <text x="137" y="486" font-size="12" fill="#6B7280">skipped: “unknown”</text>
      <text x="137" y="506" font-size="12" fill="#6B7280">repeated 10,000×</text>
    </g>

    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="324" cy="443" r="10" fill="#7C3AED" stroke="none"/>
      <path d="M324 454 L324 500 M324 468 L290 480 M324 468 L344 481 M324 500 L311 522 M324 500 L337 522"/>
    </g>
  </g>
  <text x="204" y="586" text-anchor="middle" font-size="12" fill="#6B7280">Third: interactions—plentiful, but attached to “mystery.”</text>

  <!-- Panel 4 -->
  <g>
    <rect x="424" y="356" width="151" height="44" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="499.5" y="383" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Still dairy-free.</text>

    <rect x="610" y="356" width="156" height="44" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="688" y="383" text-anchor="middle" font-size="12.5" fill="#1E1B4B">The math was flawless.</text>

    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="465" cy="430" r="10" fill="#10B981" stroke="none"/>
      <path d="M465 441 L465 475 M465 453 L489 462 M465 453 L447 466"/>
    </g>

    <g>
      <line x1="445" y1="486" x2="760" y2="486" stroke="#1E1B4B" stroke-width="4" stroke-linecap="round"/>
      <path d="M576 483 H625" stroke="#6B7280" stroke-width="2"/>
      <rect x="590" y="446" width="22" height="35" rx="4" fill="#FFFFFF" stroke="#EF4444"/>
      <line x1="601" y1="446" x2="607" y2="434" stroke="#EF4444" stroke-width="2"/>
      <text x="601" y="468" text-anchor="middle" font-size="12" fill="#EF4444">M</text>
    </g>

    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="728" cy="430" r="10" fill="#7C3AED" stroke="none"/>
      <path d="M728 441 L728 475 M728 453 L703 462 M728 453 L746 466"/>
    </g>

    <g>
      <rect x="450" y="490" width="84" height="56" rx="4" fill="#FEF3C7" stroke="#D97706"/>
      <text x="492" y="523" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E1B4B">ITEMS</text>

      <rect x="548" y="490" width="84" height="56" rx="4" fill="#FEE2E2" stroke="#EF4444"/>
      <path d="M590 490 L584 504 L595 515 L587 530 L592 546" fill="none" stroke="#EF4444" stroke-width="2"/>
      <text x="590" y="523" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E1B4B">USERS</text>

      <rect x="646" y="490" width="116" height="56" rx="4" fill="#D1FAE5" stroke="#10B981"/>
      <text x="704" y="523" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E1B4B">INTERACTIONS</text>
    </g>
  </g>
  <text x="596" y="586" text-anchor="middle" font-size="12" fill="#6B7280">A perfect formula can still serve the wrong foundation.</text>

  <text x="400" y="626" text-anchor="middle" font-size="13" fill="#6B7280">Recommenders need clean item catalogs, user catalogs, and interaction data; algorithms come later.</text>
</svg>