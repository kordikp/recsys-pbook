  <g transform="translate(326,52)">
    <rect x="0" y="0" width="298" height="258" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="11" fill="#1E1B4B"/>
    <text x="24" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">User catalog</text>

