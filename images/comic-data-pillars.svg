    <ellipse cx="124" cy="184" rx="28" ry="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
    <line x1="124" y1="170" x2="124" y2="178" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="104" y="150" width="40" height="20" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="124" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">?</text>

