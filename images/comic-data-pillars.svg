    <path d="M218,186 L211,179" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
    <path d="M217,222 V182 Q217,166 233,166 H247 Q263,166 263,182 V222 Z" fill="#7C3AED"/>
    <path d="M233,168 L240,172 L233,176 Z M247,168 L240,172 L247,176 Z" fill="#FFFFFF"/>
    <circle cx="240" cy="145" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
    <circle cx="231" cy="143" r="2.2" fill="#1E1B4B"/>
    <circle cx="243" cy="143" r="2.2" fill="#1E1B4B"/>
    <path d="M232,151 Q237,155 242,151" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    <text x="240" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Recommender</text>
    </g>
  </g>

