    <circle cx="244" cy="145" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
    <circle cx="235" cy="143" r="2.2" fill="#1E1B4B"/>
    <circle cx="247" cy="143" r="2.2" fill="#1E1B4B"/>
