    <rect x="0" y="0" width="298" height="258" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="11" fill="#1E1B4B"/>
    <text x="24" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Interactions</text>

    <path d="M108,44 H272 Q284,44 284,56 V84 Q284,96 272,96 H246 L238,124 L230,96 H108 Q96,96 96,84 V56 Q96,44 108,44 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="190" y="65" text-anchor="middle" font-size="16" fill="#1E1B4B">Who ordered what?</text>
    <text x="190" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">My best clue.</text>

    <line x1="12" y1="222" x2="286" y2="222" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- order book -->
    <path d="M22,104 H198 Q206,104 206,112 V210 L198,216 L190,210 L182,216 L174,210 L166,216 L158,210 L150,216 L142,210 L134,216 L126,210 L118,216 L110,210 L102,216 L94,210 L86,216 L78,210 L70,216 L62,210 L54,216 L46,210 L38,216 L30,210 L22,216 L14,210 V112 Q14,104 22,104 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="110" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B" letter-spacing="1.5">ORDER BOOK</text>
    <line x1="26" y1="132" x2="194" y2="132" stroke="#E5E7EB" stroke-width="1.5"/>

    <rect x="26" y="139" width="54" height="20" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="53" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Mira</text>
    <line x1="88" y1="149" x2="110" y2="149" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb055-arrow)"/>
    <text x="122" y="154" font-size="15" fill="#1E1B4B">tacos</text>

    <rect x="26" y="163" width="54" height="20" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="53" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Leo</text>
    <line x1="88" y1="173" x2="110" y2="173" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb055-arrow)"/>
    <text x="122" y="178" font-size="15" fill="#1E1B4B">tacos</text>

    <rect x="26" y="187" width="54" height="20" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="53" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Leo</text>
    <line x1="88" y1="197" x2="110" y2="197" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb055-arrow)"/>
    <text x="122" y="202" font-size="15" fill="#1E1B4B">risotto</text>

    <!-- waiter -->
    <g transform="translate(-4,0)">
    <path d="M220,186 L210,180" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
    <path d="M219,222 V182 Q219,166 235,166 H249 Q265,166 265,182 V222 Z" fill="#7C3AED"/>
    <path d="M235,168 L242,172 L235,176 Z M249,168 L242,172 L249,176 Z" fill="#FFFFFF"/>
    <circle cx="242" cy="145" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
    <circle cx="233" cy="143" r="2.2" fill="#1E1B4B"/>
    <circle cx="245" cy="143" r="2.2" fill="#1E1B4B"/>
    <path d="M234,151 Q239,155 244,151" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    <text x="242" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Recommender</text>
    </g>
  </g>

  <!-- ===== Panel 4: tonight's special ===== -->
  <g transform="translate(326,322)">
    <rect x="0" y="0" width="298" height="258" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="11" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="24" y="29" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">!</text>
    <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Tonight’s special</text>

    <path d="M20,44 H132 Q144,44 144,56 V100 Q144,112 132,112 H64 L58,126 L50,112 H20 Q8,112 8,100 V56 Q8,44 20,44 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="76" y="64" text-anchor="middle" font-size="15" fill="#1E1B4B">Taco fans also</text>
