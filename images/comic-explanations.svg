<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 638" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb071-title pb071-desc">
<title id="pb071-title">The waiter has his reasons</title>
<desc id="pb071-desc">Four-panel comic. 1: A waiter, the recommender, serves a diner beet foam flagged as the number-one pick; the diner never ordered it. 2: Asked why, the waiter gives a tidy reason: because you ordered beet salad last week. 3: Is that really why? Partly: he holds up a kitchen ticket that runs down to the floor — beet salad last week, guests like you, rainy evening, new on the menu, plus hundreds more signals, all mixed together. 4: A sign required by EU law (DSA, GDPR) lists three main parameters — your past orders, what is popular, what is new — and the diner protests that the ticket had hundreds. The reason you are shown is a tidy summary, for you and for the law; the real reason is hundreds of signals mixed together, too tangled to trace one by one.</desc>
<rect x=".5" y=".5" width="639" height="637" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<g transform="translate(16,16)"><rect x="0" y="0" width="298" height="270" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="24" cy="26" r="11" fill="#1E1B4B"/><text x="24" y="31" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text><text x="43" y="31" font-size="16" font-weight="700" fill="#1E1B4B">A surprise pick</text><path d="M12,234 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/><rect x="98" y="200" width="104" height="6" rx="3" fill="#D1D5DB"/><path d="M110,206 V234 M190,206 V234" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/><ellipse cx="150" cy="197" rx="36" ry="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><path d="M126,197 C126,167 174,167 174,197 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/><circle cx="140" cy="188" r="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/><circle cx="157" cy="184" r="2.4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/><circle cx="162" cy="192" r="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/><path d="M150,175 V147" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><rect x="151" y="145" width="32" height="22" rx="4" fill="#7C3AED"/><text x="167" y="161" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">#1</text><path d="M17,234 V194 Q17,178 33,178 H47 Q63,178 63,194 V234 Z" fill="#10B981"/><circle cx="40" cy="158" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/><circle cx="34" cy="156" r="2.2" fill="#1E1B4B"/><circle cx="46" cy="156" r="2.2" fill="#1E1B4B"/><path d="M31,149 Q34,146 37,149 M43,149 Q46,146 49,149" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/><circle cx="40" cy="166" r="2.8" fill="none" stroke="#1E1B4B" stroke-width="1.8"/><path d="M213,234 V194 Q213,178 229,178 H243 Q259,178 259,194 V234 Z" fill="#7C3AED"/><path d="M236,183 L227,178 V188 Z M236,183 L245,178 V188 Z" fill="#FFFFFF"/><circle cx="236" cy="183" r="2.5" fill="#FFFFFF"/><path d="M253,194 H263 V218 L258,214 L253,218 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" stroke-linejoin="round"/><circle cx="236" cy="158" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/><circle cx="230" cy="156" r="2.2" fill="#1E1B4B"/><circle cx="242" cy="156" r="2.2" fill="#1E1B4B"/><path d="M231,164 Q236,168 241,164" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/><path d="M22,44 H134 Q146,44 146,56 V86 Q146,98 134,98 H47 L42,138 L33,98 H22 Q10,98 10,86 V56 Q10,44 22,44 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/><text x="78" y="66.3" font-size="15" fill="#1E1B4B" text-anchor="middle">I didn’t order</text><text x="78" y="86.3" font-size="15" fill="#1E1B4B" text-anchor="middle">beet foam.</text><path d="M176,58 H276 Q288,58 288,70 V100 Q288,112 276,112 H237 L232,138 L223,112 H176 Q164,112 164,100 V70 Q164,58 176,58 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/><text x="226" y="80.3" font-size="15" fill="#1E1B4B" text-anchor="middle">Our top pick</text><text x="226" y="100.3" font-size="15" fill="#1E1B4B" text-anchor="middle">for you!</text><text x="40" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">You</text><text x="236" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Recommender</text></g>
