oke="#1E1B4B" stroke-width="1.4" stroke-linejoin="round"/><path d="M22,44 H88 Q100,44 100,56 V66 Q100,78 88,78 H47 L42,138 L33,78 H22 Q10,78 10,66 V56 Q10,44 22,44 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/><text x="55" y="66.3" font-size="15" fill="#1E1B4B" text-anchor="middle">Why me?</text><path d="M122,56 H276 Q288,56 288,68 V98 Q288,110 276,110 H237 L232,138 L223,110 H122 Q110,110 110,98 V68 Q110,56 122,56 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/><text x="199" y="78.3" font-size="15" fill="#1E1B4B" text-anchor="middle">Because you ordered</text><text x="199" y="98.3" font-size="15" fill="#1E1B4B" text-anchor="middle">beet salad last week!</text><text x="149" y="258" text-anchor="middle" font-size="15" fill="#4B5563">Plausible. But found after the pick.</text></g>
