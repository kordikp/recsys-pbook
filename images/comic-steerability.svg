<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" role="img" aria-labelledby="pb100-title pb100-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb100-title">Your feed has a mixing board</title>
<desc id="pb100-desc">Four-panel comic. 1: You ask why your feed is all true crime; the recommender, a DJ behind a closed black box, says you watched one show and it did the rest, and your only controls are thumbs up and down. 2: The DJ turns the box around: it is a mixing board whose sliders (true crime, legal thrillers, comedy) are tastes the model learned by itself. 3: You are sinking into a rabbit hole; the board flags that your mix narrowed from 15 tastes to 5 and suggests the neighbouring legal thrillers. 4: You move the sliders yourself, crime down and thrillers up, and the mix changes right away. A steerable recommender shows its knobs so you can turn them, instead of a black box where only the algorithm decides.</desc>
<defs><clipPath id="pb100-sink"><rect x="0" y="0" width="80" height="236"/></clipPath></defs>
