<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0EA5E9"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#10B981"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#D97706"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="598" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Context-Aware Recommendations</text>

  <!-- Dashed context connectors -->
  <line x1="208" y1="105" x2="271" y2="132" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-blue)"/>
  <line x1="392" y1="105" x2="329" y2="132" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-green)"/>
  <line x1="208" y1="195" x2="272" y2="158" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-amber)"/>
  <line x1="392" y1="195" x2="328" y2="158" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>

  <!-- Central user -->
  <circle cx="300" cy="145" r="31" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="300" y="143" text-anchor="middle" font-size="21">👤</text>
  <text x="300" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#7C3AED">Same User</text>

  <!-- Context 1: Morning commute -->
  <g transform="translate(24 38)">
    <rect width="184" height="88" rx="9" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <rect x="12" y="12" width="22" height="31" rx="4" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.2"/>
    <rect x="20" y="37" width="6" height="2" rx="1" fill="#0EA5E9"/>
    <text x="48" y="22" font-size="12" font-weight="700" fill="#1E1B4B">Morning Commute</text>
    <text x="48" y="40" font-size="11" fill="#6B7280">Short content, news</text>
    <text x="48" y="55" font-size="11" fill="#6B7280">Podcasts, quick reads</text>
    <rect x="48" y="62" width="86" height="20" rx="6" fill="#E0F2FE"/>
    <text x="91" y="76" text-anchor="middle" font-size="11" fill="#0EA5E9">⏱ &lt; 10 min</text>
  </g>

  <!-- Context 2: Office -->
  <g transform="translate(392 38)">
    <rect width="184" height="88" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <rect x="12" y="12" width="25" height="18" rx="3" fill="#D1FAE5" stroke="#10B981" stroke-width="1.2"/>
    <line x1="24.5" y1="30" x2="24.5" y2="38" stroke="#10B981" stroke-width="1.5"/>
    <line x1="16" y1="38" x2="33" y2="38" stroke="#10B981" stroke-width="1.5"/>
    <text x="48" y="22" font-size="12" font-weight="700" fill="#1E1B4B">Office</text>
    <text x="48" y="40" font-size="11" fill="#6B7280">Productivity tools, docs</text>
    <text x="48" y="55" font-size="11" fill="#6B7280">Professional content</text>
    <rect x="48" y="62" width="96" height="20" rx="6" fill="#D1FAE5"/>
    <text x="96" y="76" text-anchor="middle" font-size="11" fill="#10B981">💼 work mode</text>
  </g>

  <!-- Context 3: Gym -->
  <g transform="translate(24 174)">
    <rect width="184" height="88" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <circle cx="24" cy="25" r="13" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="24" y="30" text-anchor="middle" font-size="14">🏋</text>
    <text x="48" y="22" font-size="12" font-weight="700" fill="#1E1B4B">Gym</text>
    <text x="48" y="40" font-size="11" fill="#6B7280">Energetic music</text>
    <text x="48" y="55" font-size="11" fill="#6B7280">Workout videos</text>
    <rect x="48" y="62" width="98" height="20" rx="6" fill="#FEF3C7"/>
    <text x="97" y="76" text-anchor="middle" font-size="11" fill="#D97706">⚡ high energy</text>
  </g>

  <!-- Context 4: Evening couch -->
  <g transform="translate(392 174)">
    <rect width="184" height="88" rx="9" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="11" y="12" width="27" height="20" rx="3" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2"/>
    <line x1="17" y1="19" x2="32" y2="19" stroke="#EF4444" stroke-width="1"/>
    <line x1="24.5" y1="32" x2="24.5" y2="38" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="17" y1="38" x2="32" y2="38" stroke="#EF4444" stroke-width="1.2"/>
    <text x="48" y="22" font-size="12" font-weight="700" fill="#1E1B4B">Evening Couch</text>
    <text x="48" y="40" font-size="11" fill="#6B7280">Movies, long reads</text>
    <text x="48" y="55" font-size="11" fill="#6B7280">Relaxation content</text>
    <rect x="48" y="62" width="96" height="20" rx="6" fill="#FEE2E2"/>
    <text x="96" y="76" text-anchor="middle" font-size="11" fill="#EF4444">🛋 lean back</text>
  </g>

  <!-- Bottom message -->
  <rect x="143" y="272" width="314" height="22" rx="11" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="300" y="287" text-anchor="middle" font-size="11" font-weight="700" fill="#7C3AED">Same user, 4 different recommendation strategies</text>
</svg>