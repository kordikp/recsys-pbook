<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="system-ui, sans-serif">
  <defs>
    <marker id="attArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Warm card background -->
  <rect x="1" y="1" width="678" height="378" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E1B4B">Self-Attention: Not All Past Interactions Matter Equally</text>
  <text x="340" y="48" text-anchor="middle" font-size="12" fill="#6B7280">The model learns which historical items are most relevant for the next prediction</text>

  <!-- Timeline base -->
  <line x1="60" y1="230" x2="630" y2="230" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Attention arcs, vertically separated to prevent collisions -->
  <path d="M598,145 C550,60 135,60 60,154" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.45" marker-end="url(#attArrow)"/>
  <path d="M598,150 C550,82 270,82 200,154" fill="none" stroke="#D97706" stroke-width="2.5" opacity="0.6" marker-end="url(#attArrow)"/>
  <path d="M598,155 C555,103 395,103 340,154" fill="none" stroke="#D97706" stroke-width="4" opacity="0.72" marker-end="url(#attArrow)"/>
  <path d="M598,163 C568,120 477,120 440,154" fill="none" stroke="#D97706" stroke-width="6" opacity="0.85" marker-end="url(#attArrow)"/>
  <path d="M598,174 C582,136 558,134 540,154" fill="none" stroke="#D97706" stroke-width="5" opacity="0.78" marker-end="url(#attArrow)"/>

  <!-- Weight labels on clear background badges -->
  <g>
    <rect x="279" y="55" width="46" height="22" rx="6" fill="#FFFFFF" stroke="#FEF3C7"/>
    <text x="302" y="70" text-anchor="middle" font-size="11" fill="#D97706">0.03</text>
  </g>
  <g>
    <rect x="357" y="77" width="46" height="22" rx="6" fill="#FFFFFF" stroke="#FEF3C7"/>
    <text x="380" y="92" text-anchor="middle" font-size="11" fill="#D97706">0.15</text>
  </g>
  <g>
    <rect x="442" y="97" width="46" height="22" rx="6" fill="#FFFFFF" stroke="#FEF3C7"/>
    <text x="465" y="112" text-anchor="middle" font-size="11" fill="#D97706">0.22</text>
  </g>
  <g>
    <rect x="491" y="115" width="46" height="22" rx="6" fill="#FFFFFF" stroke="#D97706"/>
    <text x="514" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97706">0.32</text>
  </g>
  <g>
    <rect x="548" y="133" width="46" height="22" rx="6" fill="#FFFFFF" stroke="#D97706"/>
    <text x="571" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97706">0.28</text>
  </g>

  <!-- Item 1: Cooking show -->
  <g transform="translate(60,155)">
    <rect x="-35" y="0" width="70" height="70" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="0" y="27" text-anchor="middle" font-size="20">🍳</text>
    <text x="0" y="49" text-anchor="middle" font-size="11" fill="#10B981" font-weight="bold">Cooking</text>
    <text x="0" y="63" text-anchor="middle" font-size="11" fill="#10B981">Show</text>
  </g>

  <!-- Item 2: Sci-fi movie -->
  <g transform="translate(200,155)">
    <rect x="-35" y="0" width="70" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="0" y="27" text-anchor="middle" font-size="20">🚀</text>
    <text x="0" y="49" text-anchor="middle" font-size="11" fill="#0EA5E9" font-weight="bold">Sci-Fi</text>
    <text x="0" y="63" text-anchor="middle" font-size="11" fill="#0EA5E9">Movie</text>
  </g>

  <!-- Item 3: Action movie -->
  <g transform="translate(340,155)">
    <rect x="-35" y="0" width="70" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="0" y="27" text-anchor="middle" font-size="20">💥</text>
    <text x="0" y="49" text-anchor="middle" font-size="11" fill="#0EA5E9" font-weight="bold">Action</text>
    <text x="0" y="63" text-anchor="middle" font-size="11" fill="#0EA5E9">Movie</text>
  </g>

  <!-- Item 4: Action sequel -->
  <g transform="translate(440,155)">
    <rect x="-35" y="0" width="70" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="0" y="27" text-anchor="middle" font-size="20">🎬</text>
    <text x="0" y="49" text-anchor="middle" font-size="11" fill="#0EA5E9" font-weight="bold">Action</text>
    <text x="0" y="63" text-anchor="middle" font-size="11" fill="#0EA5E9">Sequel</text>
  </g>

  <!-- Item 5: Space drama -->
  <g transform="translate(540,155)">
    <rect x="-35" y="0" width="70" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="0" y="27" text-anchor="middle" font-size="20">🌌</text>
    <text x="0" y="49" text-anchor="middle" font-size="11" fill="#0EA5E9" font-weight="bold">Space</text>
    <text x="0" y="63" text-anchor="middle" font-size="11" fill="#0EA5E9">Drama</text>
  </g>

  <!-- Prediction target -->
  <g transform="translate(630,155)">
    <rect x="-32" y="0" width="64" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="0" y="29" text-anchor="middle" font-size="22" fill="#D97706" font-weight="bold">?</text>
    <text x="0" y="50" text-anchor="middle" font-size="11" fill="#D97706" font-weight="bold">Next</text>
    <text x="0" y="64" text-anchor="middle" font-size="11" fill="#D97706" font-weight="bold">Rec</text>
  </g>

  <!-- Time labels -->
  <text x="60" y="251" text-anchor="middle" font-size="11" fill="#6B7280">3 months ago</text>
  <text x="200" y="251" text-anchor="middle" font-size="11" fill="#6B7280">2 months ago</text>
  <text x="340" y="251" text-anchor="middle" font-size="11" fill="#6B7280">1 month ago</text>
  <text x="440" y="251" text-anchor="middle" font-size="11" fill="#6B7280">Last week</text>
  <text x="540" y="251" text-anchor="middle" font-size="11" fill="#6B7280">Yesterday</text>

  <!-- Weight legend -->
  <g transform="translate(60,274)">
    <rect x="0" y="0" width="560" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="18" y="19" font-size="11" font-weight="bold" fill="#1E1B4B">Attention Weights:</text>
    <text x="18" y="41" font-size="11" fill="#6B7280">Arrow thickness = how much each past item influences the next prediction</text>

    <line x1="300" y1="15" x2="330" y2="15" stroke="#D97706" stroke-width="1.5" opacity="0.45"/>
    <text x="338" y="19" font-size="11" fill="#6B7280">Low</text>

    <line x1="385" y1="15" x2="415" y2="15" stroke="#D97706" stroke-width="3" opacity="0.65"/>
    <text x="423" y="19" font-size="11" fill="#6B7280">Medium</text>

    <line x1="475" y1="15" x2="505" y2="15" stroke="#D97706" stroke-width="6" opacity="0.85"/>
    <text x="513" y="19" font-size="11" fill="#6B7280">High</text>
  </g>

  <!-- Insight -->
  <g transform="translate(60,338)">
    <rect x="0" y="0" width="560" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="280" y="20" text-anchor="middle" font-size="11" fill="#7C3AED">The cooking show from months ago barely matters. Recent action/sci-fi items drive the prediction.</text>
  </g>
</svg>