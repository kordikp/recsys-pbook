<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb112-title pb112-desc">
<title id="pb112-title">Same history, three ways to weigh it</title>
<desc id="pb112-desc">Five past interactions, oldest first: a one-off horror film last October, a sci-fi film, an action film, a cooking binge while sick last week, and a sci-fi series yesterday. Averaging gives every item 0.20, so the two one-offs keep 40% of the vote. Keeping only the last 2 items drops the older sci-fi film and hands the cooking binge 50%. Self-attention computes the weights with softmax of q times k over root d: the relevant items get 0.45, 0.25 and 0.22, the one-offs only 8% together. Toy numbers.</desc>
<rect x=".5" y=".5" width="639" height="473" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Same history, three ways to weigh it</text>
<text x="320" y="58" text-anchor="middle" font-size="14" fill="#6B7280">Bar = each past item's share of the vote for the next recs · toy numbers</text>

<!-- method columns -->
<rect x="208" y="72" width="134" height="352" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="349" y="72" width="134" height="352" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="490" y="72" width="134" height="352" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="275" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Average all</text>
<text x="275" y="116" text-anchor="middle" font-size="14" fill="#6B7280">each item 1/5</text>
<text x="416" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Last 2 only</text>
<text x="416" y="116" text-anchor="middle" font-size="14" fill="#6B7280">window k = 2</text>
<text x="557" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#4C1D95">Self-attention</text>
<text x="557" y="116" text-anchor="middle" font-size="14" fill="#4C1D95">softmax(qᵀk / √d)</text>

<!-- history header -->
<text x="24" y="96" font-size="16" font-weight="700" fill="#1E1B4B">Your history</text>
<text x="24" y="116" font-size="14" fill="#6B7280">oldest first ↓</text>

<!-- history rows: y0 = 130 + 48i, centre c = y0 + 22 -->
<rect x="16" y="130" width="184" height="44" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
<text x="38" y="159" text-anchor="middle" font-size="20">🎃</text>
<text x="60" y="149" font-size="15" font-weight="700" fill="#1E1B4B">Horror film</text>
<text x="60" y="166" font-size="14" fill="#92400E">last Oct · once</text>

<rect x="16" y="178" width="184" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="38" y="207" text-anchor="middle" font-size="20">🚀</text>
<text x="60" y="197" font-size="15" font-weight="700" fill="#1E1B4B">Sci-fi film</text>
<text x="60" y="214" font-size="14" fill="#6B7280">2 months ago</text>

<rect x="16" y="226" width="184" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="38" y="255" text-anchor="middle" font-size="20">💥</text>
<text x="60" y="245" font-size="15" font-weight="700" fill="#1E1B4B">Action film</text>
<text x="60" y="262" font-size="14" fill="#6B7280">3 weeks ago</text>

<rect x="16" y="274" width="184" height="44" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
<text x="38" y="303" text-anchor="middle" font-size="20">🍳</text>
<text x="60" y="293" font-size="15" font-weight="700" fill="#1E1B4B">Cooking binge</text>
<text x="60" y="310" font-size="14" fill="#92400E">last week · sick</text>

<rect x="16" y="322" width="184" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="38" y="351" text-anchor="middle" font-size="20">🛸</text>
<text x="60" y="341" font-size="15" font-weight="700" fill="#1E1B4B">Sci-fi series</text>
<text x="60" y="358" font-size="14" fill="#6B7280">yesterday</text>

<!-- A: average all (scale 140 px per 1.0, origin x=222) -->
