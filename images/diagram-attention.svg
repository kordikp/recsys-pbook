<!-- B: last 2 only (origin x=363) -->
<rect x="359" y="132" width="114" height="136" rx="8" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="416" y="196" text-anchor="middle" font-size="14" fill="#6B7280">outside the</text>
<text x="416" y="214" text-anchor="middle" font-size="14" fill="#6B7280">window → 0</text>
<rect x="363" y="288" width="70" height="16" rx="3" fill="#F59E0B"/>
<rect x="363" y="336" width="70" height="16" rx="3" fill="#9CA3AF"/>
<text x="471" y="301" text-anchor="end" font-size="15" font-weight="700" fill="#92400E">0.50</text>
<text x="471" y="349" text-anchor="end" font-size="15" fill="#4B5563">0.50</text>

<!-- C: self-attention (origin x=504) -->
<rect x="504" y="144" width="4.2" height="16" rx="1.5" fill="#F59E0B"/>
<rect x="504" y="192" width="35" height="16" rx="3" fill="#7C3AED"/>
