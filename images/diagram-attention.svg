<text x="612" y="349" text-anchor="end" font-size="15" font-weight="700" fill="#4C1D95">0.45</text>

<!-- bottom row: share of the two one-offs -->
<line x1="220" y1="376" x2="330" y2="376" stroke="#E5E7EB" stroke-width="1.5"/>
<line x1="361" y1="376" x2="471" y2="376" stroke="#E5E7EB" stroke-width="1.5"/>
<line x1="502" y1="376" x2="612" y2="376" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="24" y="396" font-size="15" font-weight="700" fill="#92400E">One-offs' share</text>
<text x="24" y="414" font-size="14" fill="#6B7280">horror + cooking</text>
<text x="275" y="410" text-anchor="middle" font-size="26" font-weight="700" fill="#92400E">40%</text>
<text x="416" y="410" text-anchor="middle" font-size="26" font-weight="700" fill="#92400E">50%</text>
<text x="557" y="410" text-anchor="middle" font-size="26" font-weight="700" fill="#4C1D95">8%</text>

<!-- takeaway -->
<text x="320" y="454" text-anchor="middle" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#92400E">Fixed rules</tspan> keep counting one-offs; <tspan font-weight="700" fill="#4C1D95">attention learns</tspan> to tune them out.</text>
</svg>
