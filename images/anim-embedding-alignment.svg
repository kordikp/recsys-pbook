<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .shift{animation:sh 6s ease-in-out infinite}
    @keyframes sh{0%,18%{transform:translate(0,0)}55%,85%{transform:translate(-70px,0)}100%{transform:translate(0,0)}}
    .link{animation:lk 6s ease-in-out infinite}
    @keyframes lk{0%,18%{opacity:0}55%,85%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Aligning Two Worlds: What Items SAY vs. How They're USED</text>

  <ellipse cx="240" cy="220" rx="150" ry="115" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="240" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#4C1D95">TEXT space</text>
  <text x="240" y="136" text-anchor="middle" font-size="11.5" fill="#6B7280">from titles &amp; descriptions</text>
  <g fill="#7C3AED"><circle cx="185" cy="195" r="6"/><circle cx="230" cy="240" r="6"/><circle cx="280" cy="205" r="6"/><circle cx="205" cy="265" r="6"/><circle cx="295" cy="262" r="6"/></g>

  <g class="shift">
    <ellipse cx="600" cy="220" rx="150" ry="115" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="600" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#065F46">BEHAVIOR space</text>
    <text x="600" y="136" text-anchor="middle" font-size="11.5" fill="#6B7280">from clicks &amp; co-consumption</text>
    <g fill="#10B981"><circle cx="545" cy="195" r="6"/><circle cx="590" cy="240" r="6"/><circle cx="640" cy="205" r="6"/><circle cx="565" cy="265" r="6"/><circle cx="655" cy="262" r="6"/></g>
  </g>

  <g class="link" stroke="#D97706" stroke-width="1.8" stroke-dasharray="4 4">
    <line x1="185" y1="195" x2="425" y2="195"/><line x1="230" y1="240" x2="470" y2="240"/>
    <line x1="280" y1="205" x2="520" y2="205"/><line x1="205" y1="265" x2="445" y2="265"/>
  </g>
  <text x="400" y="356" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E1B4B">training pulls the same item's two views toward one point</text>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">Once aligned, a brand-new item with only text lands where its future audience already lives — cold start, bridged.</text>
</svg>
