<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb011-title pb011-desc">
<title id="pb011-title">Embedding alignment: three separate spaces mapped into one shared space</title>
<desc id="pb011-desc">A text encoder, an image encoder and a behavior model embed the same two items in spaces of different size (768, 512 and 256 dimensions) where the same dimension means different things, so cosine similarity across them is meaningless. A learned map projects all three into one shared space, where training pulls each item's three views together and pushes different items apart, so similarity becomes meaningful.</desc>
<style>
.pb011-anim{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.pb011-c1{animation-name:pb011-c1}.pb011-c2{animation-name:pb011-c2}.pb011-c3{animation-name:pb011-c3}
.pb011-c4{animation-name:pb011-c4}.pb011-c5{animation-name:pb011-c5}.pb011-c6{animation-name:pb011-c6}
.pb011-halo{animation-name:pb011-halo}
@keyframes pb011-c1{0%{transform:translate(-29px,-25px);opacity:0}5%{opacity:1}12%{transform:translate(-29px,-25px)}40%{transform:translate(0,0)}94%{transform:translate(0,0);opacity:1}99%,100%{transform:translate(0,0);opacity:0}}
@keyframes pb011-c2{0%{transform:translate(29px,-25px);opacity:0}5%{opacity:1}12%{transform:translate(29px,-25px)}40%{transform:translate(0,0)}94%{transform:translate(0,0);opacity:1}99%,100%{transform:translate(0,0);opacity:0}}
@keyframes pb011-c3{0%{transform:translate(-38px,43px);opacity:0}5%{opacity:1}12%{transform:translate(-38px,43px)}40%{transform:translate(0,0)}94%{transform:translate(0,0);opacity:1}99%,100%{transform:translate(0,0);opacity:0}}
@keyframes pb011-c4{0%{transform:translate(-32px,87px);opacity:0}5%{opacity:1}12%{transform:translate(-32px,87px)}40%{transform:translate(0,0)}94%{transform:translate(0,0);opacity:1}99%,100%{transform:translate(0,0);opacity:0}}
@keyframes pb011-c5{0%{transform:translate(25px,-61px);opacity:0}5%{opacity:1}12%{transform:translate(25px,-61px)}40%{transform:translate(0,0)}94%{transform:translate(0,0);opacity:1}99%,100%{transform:translate(0,0);opacity:0}}
@keyframes pb011-c6{0%{transform:translate(34px,53px);opacity:0}5%{opacity:1}12%{transform:translate(34px,53px)}40%{transform:translate(0,0)}94%{transform:translate(0,0);opacity:1}99%,100%{transform:translate(0,0);opacity:0}}
@keyframes pb011-halo{0%,38%{opacity:0}45%,94%{opacity:1}99%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.pb011-anim{animation:none !important}}
</style>
<defs>
<marker id="pb011-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="pb011-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
<marker id="pb011-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
</defs>
<rect x=".5" y=".5" width="639" height="483" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Three encoders, three unrelated spaces</text>
<text x="126" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#4B5563">Before alignment</text>
<text x="482" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#4B5563">After alignment</text>

<!-- ===== Left: three native spaces (card tops 76, 186, 296; height 102) ===== -->
<!-- Text -->
<rect x="16" y="76" width="220" height="102" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="27" y="89" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
<text x="48" y="101" font-size="15" font-weight="700" fill="#1E1B4B">Text encoder</text>
<text x="224" y="101" text-anchor="end" font-size="14" fill="#4B5563">768-d</text>
<line x1="30" y1="134" x2="218" y2="134" stroke="#D1D5DB" stroke-width="1.5" marker-end="url(#pb011-ag)"/>
<rect x="45" y="119" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="60" y="140" text-anchor="middle" font-size="17">👟</text>
<rect x="125" y="119" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="140" y="140" text-anchor="middle" font-size="17">🎧</text>
<text x="126" y="169" text-anchor="middle" font-size="14" fill="#4B5563">dim 42 ≈ formality</text>

<!-- Image -->
<rect x="16" y="186" width="220" height="102" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="34" cy="206" r="7.5" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
<text x="48" y="211" font-size="15" font-weight="700" fill="#1E1B4B">Image encoder</text>
<text x="224" y="211" text-anchor="end" font-size="14" fill="#4B5563">512-d</text>
<line x1="30" y1="244" x2="218" y2="244" stroke="#D1D5DB" stroke-width="1.5" marker-end="url(#pb011-ag)"/>
<circle cx="76" cy="244" r="16" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="76" y="250" text-anchor="middle" font-size="17">🎧</text>
<circle cx="184" cy="244" r="16" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="184" y="250" text-anchor="middle" font-size="17">👟</text>
<text x="126" y="279" text-anchor="middle" font-size="14" fill="#4B5563">dim 42 ≈ brightness</text>

<!-- Behavior -->
<rect x="16" y="296" width="220" height="102" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<path d="M34,307 L43,316 L34,325 L25,316 Z" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/>
<text x="48" y="321" font-size="15" font-weight="700" fill="#1E1B4B">Behavior model</text>
<text x="224" y="321" text-anchor="end" font-size="14" fill="#4B5563">256-d</text>
<line x1="30" y1="354" x2="218" y2="354" stroke="#D1D5DB" stroke-width="1.5" marker-end="url(#pb011-ag)"/>
<path d="M118,335 L137,354 L118,373 L99,354 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-linejoin="round"/>
<text x="118" y="360" text-anchor="middle" font-size="17">🎧</text>
<path d="M172,335 L191,354 L172,373 L153,354 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-linejoin="round"/>
<text x="172" y="360" text-anchor="middle" font-size="17">👟</text>
<text x="126" y="390" text-anchor="middle" font-size="14" fill="#4B5563">dim 42 ≈ a hidden taste</text>

<!-- ===== Middle: learned map ===== -->
<g stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" fill="none">
<path d="M244,127 L332,170" marker-end="url(#pb011-ah)"/>
<path d="M244,237 L332,237" marker-end="url(#pb011-ah)"/>
<path d="M244,347 L332,304" marker-end="url(#pb011-ah)"/>
</g>
<text x="290" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">learned map</text>
<text x="290" y="261" text-anchor="middle" font-size="14" font-style="italic" fill="#4C1D95">e.g. W·e + b</text>

<!-- ===== Right: shared space ===== -->
<rect x="340" y="76" width="284" height="322" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="482" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Shared space · d dims</text>

<ellipse class="pb011-anim pb011-halo" cx="410" cy="168" rx="52" ry="50" fill="#D1FAE5" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4"/>
<ellipse class="pb011-anim pb011-halo" cx="556" cy="302" rx="52" ry="50" fill="#D1FAE5" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4"/>

<line x1="452" y1="207" x2="514" y2="263" stroke="#6B7280" stroke-width="2.2" stroke-linecap="round" marker-start="url(#pb011-ak)" marker-end="url(#pb011-ak)"/>

<!-- item A (sneaker): text, image, behavior views; cluster centre (410,160) -->
<g class="pb011-anim pb011-c1"><rect x="375" y="133" width="32" height="32" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="391" y="155" text-anchor="middle" font-size="18">👟</text></g>
<g class="pb011-anim pb011-c2"><circle cx="429" cy="149" r="17" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="429" y="155" text-anchor="middle" font-size="18">👟</text></g>
<g class="pb011-anim pb011-c3"><path d="M410,165 L430,185 L410,205 L390,185 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/><text x="410" y="191" text-anchor="middle" font-size="18">👟</text></g>
<!-- item B (headphones); cluster centre (556,294) -->
<g class="pb011-anim pb011-c4"><rect x="521" y="267" width="32" height="32" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="537" y="289" text-anchor="middle" font-size="18">🎧</text></g>
<g class="pb011-anim pb011-c5"><circle cx="575" cy="283" r="17" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="575" y="289" text-anchor="middle" font-size="18">🎧</text></g>
<g class="pb011-anim pb011-c6"><path d="M556,299 L576,319 L556,339 L536,319 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/><text x="556" y="325" text-anchor="middle" font-size="18">🎧</text></g>

<text x="476" y="160" font-size="15" font-weight="700" fill="#065F46">pull together</text>
<text x="476" y="179" font-size="14" fill="#4B5563">same item's views</text>
<text x="470" y="262" text-anchor="end" font-size="15" font-weight="700" fill="#4B5563">push apart</text>
<text x="470" y="281" text-anchor="end" font-size="14" fill="#4B5563">different items</text>

<!-- ===== Verdict badges ===== -->
<rect x="16" y="408" width="220" height="34" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
<text x="126" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">✗ cosine: meaningless</text>
<rect x="340" y="408" width="284" height="34" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
<text x="482" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">✓ cosine: meaningful</text>

<text x="320" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Map every view into one shared space — then similarity means something.</text>
</svg>
