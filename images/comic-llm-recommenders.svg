<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1E1B4B">Prompt Service, Backed by the Stockroom</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="112" y="76" width="250" height="58" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="128" y="99" font-size="12.5" fill="#1E1B4B">
    <tspan x="128" dy="0">Early Radiohead, but more</tspan>
    <tspan x="128" dy="18">electronic. Less depressing.</tspan>
  </text>
  <circle cx="94" cy="188" r="10" fill="#7C3AED"/>
  <path d="M94 199 L94 239 M94 211 L72 226 M94 211 L114 223" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="304" cy="180" r="10" fill="#0EA5E9"/>
  <path d="M304 191 L304 239 M304 204 L281 216 M304 204 L326 219" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="48" y="242" width="300" height="10" rx="3" fill="#FEF3C7" stroke="#D97706"/>
  <text x="204" y="306" text-anchor="middle" font-size="12" fill="#6B7280">A customer submits a mood, an era, and one emotional veto.</text>

  <!-- Panel 2 -->
  <rect x="426" y="76" width="258" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="442" y="99" font-size="12.5" fill="#1E1B4B">
    <tspan x="442" dy="0">You’ll love “Neon Sorrow”</tspan>
    <tspan x="442" dy="18">by Static Orchard.</tspan>
  </text>
  <circle cx="474" cy="184" r="10" fill="#7C3AED"/>
  <path d="M474 195 L474 241 M474 207 L454 220 M474 207 L505 220" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="730" cy="184" r="10" fill="#0EA5E9"/>
  <path d="M730 195 L730 241 M730 207 L708 220 M730 207 L750 220" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="558" y="163" width="82" height="78" rx="4" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="599" y="191" text-anchor="middle" font-size="10" font-weight="700" fill="#1E1B4B">
    <tspan x="599" dy="0">NEON</tspan>
    <tspan x="599" dy="14">SORROW</tspan>
  </text>
  <path d="M434 246 H758" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
  <text x="596" y="306" text-anchor="middle" font-size="12" fill="#6B7280">The clerk names it with the confidence of a barcode.</text>

  <!-- Panel 3 -->
  <rect x="34" y="356" width="248" height="58" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="50" y="379" font-size="12.5" fill="#1E1B4B">
    <tspan x="50" dy="0">Your last six months say:</tspan>
    <tspan x="50" dy="18">try Moderat.</tspan>
  </text>
  <circle cx="86" cy="464" r="10" fill="#10B981"/>
  <path d="M86 475 L86 521 M86 488 L111 500 M86 488 L66 502" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="330" cy="464" r="10" fill="#0EA5E9"/>
  <path d="M330 475 L330 521 M330 488 L308 501 M330 488 L350 501" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="174" y="444" width="82" height="78" rx="4" fill="#FFFFFF" stroke="#6B7280"/>
  <path d="M188 458 H238 M188 469 H224 M188 480 H242 M188 491 H218 M188 502 H234" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <path d="M42 526 H366" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
  <text x="204" y="586" text-anchor="middle" font-size="12" fill="#6B7280">The owner consults the least poetic document in the shop.</text>

  <!-- Panel 4 -->
  <rect x="538" y="356" width="222" height="58" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="554" y="379" font-size="12.5" fill="#1E1B4B">
    <tspan x="554" dy="0">You do adjectives.</tspan>
    <tspan x="554" dy="18">I’ll do inventory.</tspan>
  </text>
  <circle cx="484" cy="468" r="10" fill="#7C3AED"/>
  <path d="M484 479 L484 526 M484 492 L512 504 M484 492 L464 505" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="708" cy="468" r="10" fill="#10B981"/>
  <path d="M708 479 L708 526 M708 492 L674 504 M708 492 L730 505" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="574" y="446" width="86" height="82" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
  <path d="M588 462 H646 M588 475 H632 M588 512 H646 M617 485 A10 10 0 1 0 617 505 A10 10 0 1 0 617 485" fill="none" stroke="#1E1B4B" stroke-width="2"/>
  <text x="596" y="586" text-anchor="middle" font-size="12" fill="#6B7280">At last, the fluent clerk meets the useful stockroom.</text>

  <text x="400" y="626" text-anchor="middle" font-size="13" fill="#6B7280">LLMs parse intent and explain choices; behavioral recommenders personalize and ground results.</text>
</svg>