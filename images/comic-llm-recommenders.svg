<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 636" role="img" aria-labelledby="pb078-title pb078-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb078-title">Prompt service, backed by the stockroom</title>
<desc id="pb078-desc">Four-panel comic in a record shop. You ask for something like early Radiohead but more electronic and less depressing; the LLM clerk understands and restates it as electronic, dreamy, not gloomy. Then he confidently recommends Neon Sorrow by Static Orchard, but the catalog search finds 0 results: the LLM invented the record. The stockroom recommender has no idea what less depressing means, but your last six months of listening point to a real record in stock. Together, the recommender picks real items from your history and the LLM explains them in your words.</desc>
