<rect x=".5" y=".5" width="639" height="635" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="34" font-size="19" font-weight="700" fill="#1E1B4B" text-anchor="middle">Prompt service, backed by the stockroom</text>
