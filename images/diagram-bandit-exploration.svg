<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 532" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb113-title pb113-desc">
<title id="pb113-title">How UCB balances exploring and exploiting</title>
<desc id="pb113-desc">Toy example of the UCB rule: each item gets a score equal to its estimated click rate plus an uncertainty bonus that is large when the item has been served only a few times. With 1,000 serves so far, item C has the lowest estimate (3.0%) but has been tried only 20 times, so its bonus of 2.9 gives it the top score of 5.9 and it is served to explore. After 30 more tries its estimate is 3.4% and its bonus has shrunk to 1.9, so its score of 5.3 falls below item A's 5.5 and the system goes back to exploiting A. Few tries earn a big bonus; each try shrinks it until the data decides.</desc>
<rect x=".5" y=".5" width="639" height="531" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">UCB: estimate + uncertainty bonus</text>
<text x="320" y="62" text-anchor="middle" font-size="15" fill="#4B5563">score = estimated click rate + c·√(ln t / n) · toy numbers, c = 5</text>
<rect x="16" y="80" width="608" height="194" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="40" cy="104" r="12" fill="#7C3AED"/><text x="40" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="62" y="110" font-size="16" font-weight="700" fill="#1E1B4B">Now · t = 1,000 serves</text>
<rect x="420" y="97" width="18" height="14" rx="3" fill="#7C3AED"/><text x="444" y="109" font-size="14" fill="#4B5563">estimate</text>
<rect x="516" y="97" width="18" height="14" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/><text x="540" y="109" font-size="14" fill="#4B5563">bonus</text>
<text x="40" y="147.5" font-size="16" font-weight="700" fill="#1E1B4B">A</text>
<text x="60" y="147" font-size="14" fill="#4B5563">n = 700</text>
<rect x="150" y="132" width="240.0" height="20" rx="3" fill="#7C3AED"/>
<text x="384.0" y="147" text-anchor="end" font-size="14" font-weight="700" fill="#FFFFFF">5.0</text>
<rect x="391.0" y="132" width="23.0" height="20" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="488" y="147.5" font-size="16" font-weight="700" fill="#1E1B4B">= 5.5</text>
<text x="40" y="185.5" font-size="16" font-weight="700" fill="#1E1B4B">B</text>
<text x="60" y="185" font-size="14" fill="#4B5563">n = 280</text>
<rect x="150" y="170" width="201.6" height="20" rx="3" fill="#7C3AED"/>
<text x="345.6" y="185" text-anchor="end" font-size="14" font-weight="700" fill="#FFFFFF">4.2</text>
<rect x="352.6" y="170" width="37.4" height="20" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="488" y="185.5" font-size="16" font-weight="700" fill="#1E1B4B">= 5.0</text>
<rect x="28" y="201" width="584" height="34" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="40" y="223.5" font-size="16" font-weight="700" fill="#1E1B4B">C</text>
<text x="60" y="223" font-size="14" fill="#4B5563">n = 20</text>
<rect x="150" y="208" width="144.0" height="20" rx="3" fill="#7C3AED"/>
<text x="288.0" y="223" text-anchor="end" font-size="14" font-weight="700" fill="#FFFFFF">3.0</text>
<rect x="295.0" y="208" width="138.2" height="20" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="363.6" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">+2.9</text>
<text x="488" y="223.5" font-size="16" font-weight="700" fill="#92400E">= 5.9</text>
<rect x="540" y="206" width="64" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/><text x="572" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">explore</text>
<line x1="150" y1="244" x2="486" y2="244" stroke="#D1D5DB" stroke-width="1.5"/>
<line x1="150" y1="244" x2="150" y2="248" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="150" y="264" text-anchor="middle" font-size="14" fill="#6B7280">0</text>
<line x1="198" y1="244" x2="198" y2="248" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="198" y="264" text-anchor="middle" font-size="14" fill="#6B7280">1</text>
<line x1="246" y1="244" x2="246" y2="248" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="246" y="264" text-anchor="middle" font-size="14" fill="#6B7280">2</text>
<line x1="294" y1="244" x2="294" y2="248" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="294" y="264" text-anchor="middle" font-size="14" fill="#6B7280">3</text>
<line x1="342" y1="244" x2="342" y2="248" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="342" y="264" text-anchor="middle" font-size="14" fill="#6B7280">4</text>
<line x1="390" y1="244" x2="390" y2="248" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="390" y="264" text-anchor="middle" font-size="14" fill="#6B7280">5</text>
<line x1="438" y1="244" x2="438" y2="248" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="438" y="264" text-anchor="middle" font-size="14" fill="#6B7280">6</text>
<line x1="486" y1="244" x2="486" y2="248" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="486" y="264" text-anchor="middle" font-size="14" fill="#6B7280">7</text>
<text x="40" y="264" font-size="14" fill="#4B5563">click rate, %</text>
<rect x="16" y="290" width="608" height="194" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="40" cy="314" r="12" fill="#7C3AED"/><text x="40" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="62" y="320" font-size="16" font-weight="700" fill="#1E1B4B">After 30 more tries of C · t = 1,030</text>
<rect x="28" y="335" width="584" height="34" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="40" y="357.5" font-size="16" font-weight="700" fill="#1E1B4B">A</text>
<text x="60" y="357" font-size="14" fill="#4B5563">n = 700</text>
<rect x="150" y="342" width="240.0" height="20" rx="3" fill="#7C3AED"/>
<text x="384.0" y="357" text-anchor="end" font-size="14" font-weight="700" fill="#FFFFFF">5.0</text>
<rect x="391.0" y="342" width="23.0" height="20" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="488" y="357.5" font-size="16" font-weight="700" fill="#7C3AED">= 5.5</text>
<rect x="540" y="340" width="64" height="24" rx="12" fill="#7C3AED"/><text x="572" y="357" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">exploit</text>
<text x="40" y="395.5" font-size="16" font-weight="700" fill="#1E1B4B">B</text>
<text x="60" y="395" font-size="14" fill="#4B5563">n = 280</text>
<rect x="150" y="380" width="201.6" height="20" rx="3" fill="#7C3AED"/>
<text x="345.6" y="395" text-anchor="end" font-size="14" font-weight="700" fill="#FFFFFF">4.2</text>
<rect x="352.6" y="380" width="37.4" height="20" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="488" y="395.5" font-size="16" font-weight="700" fill="#1E1B4B">= 5.0</text>
<text x="40" y="433.5" font-size="16" font-weight="700" fill="#1E1B4B">C</text>
<text x="60" y="433" font-size="14" fill="#4B5563">n = 50</text>
<rect x="150" y="418" width="163.2" height="20" rx="3" fill="#7C3AED"/>
<text x="307.2" y="433" text-anchor="end" font-size="14" font-weight="700" fill="#FFFFFF">3.4</text>
<rect x="314.2" y="418" width="90.2" height="20" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="358.8" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">+1.9</text>
<text x="488" y="433.5" font-size="16" font-weight="700" fill="#1E1B4B">= 5.3</text>
<line x1="150" y1="454" x2="486" y2="454" stroke="#D1D5DB" stroke-width="1.5"/>
<line x1="150" y1="454" x2="150" y2="458" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="150" y="474" text-anchor="middle" font-size="14" fill="#6B7280">0</text>
<line x1="198" y1="454" x2="198" y2="458" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="198" y="474" text-anchor="middle" font-size="14" fill="#6B7280">1</text>
<line x1="246" y1="454" x2="246" y2="458" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="246" y="474" text-anchor="middle" font-size="14" fill="#6B7280">2</text>
<line x1="294" y1="454" x2="294" y2="458" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="294" y="474" text-anchor="middle" font-size="14" fill="#6B7280">3</text>
<line x1="342" y1="454" x2="342" y2="458" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="342" y="474" text-anchor="middle" font-size="14" fill="#6B7280">4</text>
<line x1="390" y1="454" x2="390" y2="458" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="390" y="474" text-anchor="middle" font-size="14" fill="#6B7280">5</text>
<line x1="438" y1="454" x2="438" y2="458" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="438" y="474" text-anchor="middle" font-size="14" fill="#6B7280">6</text>
<line x1="486" y1="454" x2="486" y2="458" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="486" y="474" text-anchor="middle" font-size="14" fill="#6B7280">7</text>
<text x="40" y="474" font-size="14" fill="#4B5563">click rate, %</text>
<text x="320" y="514" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Few tries earn a big <tspan fill="#92400E">bonus</tspan>; each try shrinks it until the data decides.</text>
</svg>
