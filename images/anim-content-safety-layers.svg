<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .item{animation:go 5s linear infinite}
    .item2{animation:go 5s linear infinite;animation-delay:1.6s}
    .item3{animation:stop3 5s linear infinite;animation-delay:3.2s}
    @keyframes go{0%{transform:translateX(0);opacity:0}6%{opacity:1}30%{transform:translateX(180px)}60%{transform:translateX(390px)}92%{opacity:1}100%{transform:translateX(600px);opacity:0}}
    @keyframes stop3{0%{transform:translateX(0);opacity:0}6%{opacity:1}30%{transform:translateX(180px)}55%,70%{transform:translateX(330px);opacity:1}85%,100%{transform:translateX(330px) translateY(90px);opacity:0}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Content Safety: Three Gates Before the Feed</text>

  <g text-anchor="middle" font-size="12.5">
    <rect x="160" y="90" width="170" height="200" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="245" y="118" font-size="14" font-weight="800" fill="#B91C1C">1 · UPLOAD</text>
    <text x="245" y="142" fill="#B91C1C">automated scan</text>
    <text x="245" y="162" fill="#6B7280">hashes · classifiers</text>
    <text x="245" y="182" fill="#6B7280">blocks the illegal</text>

    <rect x="370" y="90" width="170" height="200" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="455" y="118" font-size="14" font-weight="800" fill="#92400E">2 · ELIGIBILITY</text>
    <text x="455" y="142" fill="#92400E">recommendable?</text>
    <text x="455" y="162" fill="#6B7280">borderline stays</text>
    <text x="455" y="182" fill="#6B7280">searchable, NOT pushed</text>

    <rect x="580" y="90" width="170" height="200" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="665" y="118" font-size="14" font-weight="800" fill="#065F46">3 · RANKING</text>
    <text x="665" y="142" fill="#065F46">quality signals</text>
    <text x="665" y="162" fill="#6B7280">reports · trust · age</text>
    <text x="665" y="182" fill="#6B7280">gates amplification</text>
  </g>

  <line x1="70" y1="240" x2="750" y2="240" stroke="#E5E7EB" stroke-width="2"/>
  <g class="item"><rect x="70" y="226" width="56" height="28" rx="7" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/><text x="98" y="245" text-anchor="middle" font-size="11">video A</text></g>
  <g class="item2"><rect x="70" y="226" width="56" height="28" rx="7" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/><text x="98" y="245" text-anchor="middle" font-size="11">video B</text></g>
  <g class="item3"><rect x="70" y="226" width="56" height="28" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="98" y="245" text-anchor="middle" font-size="11">video C</text></g>
  <text x="455" y="352" text-anchor="middle" font-size="12" fill="#92400E">C: allowed to exist, denied the megaphone</text>

  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">"Free to post" and "free to be amplified" are different rights — the recommender is where the second one is decided.</text>
</svg>
