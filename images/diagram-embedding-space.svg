<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb120-title pb120-desc">
<title id="pb120-title">Similar songs sit close together in an embedding space</title>
<desc id="pb120-desc">An embedding turns every song into a vector, a point in a learned space where distance means similarity. A calm jazz ballad, an acoustic folk track and an ambient electronic track sit close together despite different genre tags, while an upbeat jazz swing track sits far away despite sharing the jazz tag. Recommending means finding the points nearest to you: here the three songs inside the circle.</desc>
<rect x=".5" y=".5" width="639" height="455" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

<text x="320" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Similar songs sit close together</text>
<text x="320" y="62" text-anchor="middle" font-size="14" fill="#6B7280">Embedding space · 2 of many dimensions, named for illustration</text>

<!-- plot -->
<g>
  <line x1="48" y1="372" x2="428" y2="372" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="48" y1="84" x2="48" y2="372" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="238" y="396" text-anchor="middle" font-size="14" fill="#4B5563">energy: calm → intense</text>
  <text x="30" y="228" text-anchor="middle" font-size="14" fill="#4B5563" transform="rotate(-90 30 228)">mood: sad → euphoric</text>

  <!-- many other songs -->
  <g fill="#D1D5DB">
    <circle cx="92" cy="128" r="4"/>
    <circle cx="168" cy="150" r="4"/>
    <circle cx="232" cy="112" r="4"/>
    <circle cx="214" cy="178" r="4"/>
    <circle cx="262" cy="292" r="4"/>
    <circle cx="318" cy="338" r="4"/>
    <circle cx="410" cy="246" r="4"/>
    <circle cx="336" cy="262" r="4"/>
    <circle cx="300" cy="96" r="4"/>
  </g>


  <!-- neighbourhood of you -->
  <circle cx="150" cy="274" r="90" fill="#EDE9FE" fill-opacity="0.6" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- same tag, far apart -->
  <line x1="196" y1="290" x2="366" y2="124" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>

  <!-- far songs -->
  <g fill="#9CA3AF">
    <circle cx="366" cy="124" r="7"/>
    <circle cx="404" cy="166" r="7"/>
    <circle cx="282" cy="168" r="7"/>
    <circle cx="384" cy="318" r="7"/>
  </g>
  <text x="366" y="108" text-anchor="middle" font-size="15" fill="#1E1B4B">jazz swing</text>
  <text x="404" y="150" text-anchor="middle" font-size="15" fill="#1E1B4B">dance</text>
  <text x="282" y="152" text-anchor="middle" font-size="15" fill="#1E1B4B">pop</text>
  <text x="384" y="302" text-anchor="middle" font-size="15" fill="#1E1B4B">metal</text>

  <!-- near songs = recommended -->
  <g fill="#7C3AED">
    <circle cx="196" cy="290" r="7"/>
    <circle cx="100" cy="292" r="7"/>
    <circle cx="124" cy="224" r="7"/>
  </g>
  <text x="186" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">jazz ballad</text>
  <text x="100" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">folk</text>
  <text x="136" y="229" font-size="15" font-weight="600" fill="#4C1D95">ambient</text>

  <!-- you -->
  <circle cx="152" cy="262" r="6.5" fill="#10B981"/>
  <path d="M140,282 a12,12 0 0 1 24,0 z" fill="#10B981"/>
  <text x="152" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">you</text>

  <!-- callouts -->
  <rect x="220" y="194" width="186" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="313" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">same tag “jazz”, far apart</text>
  <text x="236" y="362" font-size="15" font-weight="700" fill="#4C1D95">3 nearest = recommended</text>
</g>

<!-- vector card -->
<g>
  <rect x="448" y="80" width="176" height="308" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="462" y="108" font-size="15" font-weight="700" fill="#1E1B4B">Each dot is a vector</text>
  <text x="462" y="130" font-size="14" fill="#6B7280">(energy, mood, …)</text>

  <rect x="456" y="144" width="160" height="104" rx="8" fill="#EDE9FE"/>
  <text x="466" y="168" font-size="14" fill="#1E1B4B">jazz ballad</text>
  <text x="466" y="190" font-size="15" font-weight="600" fill="#4C1D95" font-family="ui-monospace, Menlo, Consolas, monospace">[0.4, 0.3, …]</text>
  <text x="466" y="216" font-size="14" fill="#1E1B4B">ambient</text>
  <text x="466" y="238" font-size="15" font-weight="600" fill="#4C1D95" font-family="ui-monospace, Menlo, Consolas, monospace">[0.2, 0.5, …]</text>

  <text x="466" y="276" font-size="14" fill="#1E1B4B">jazz swing</text>
  <text x="466" y="298" font-size="15" font-weight="600" fill="#4B5563" font-family="ui-monospace, Menlo, Consolas, monospace">[0.8, 0.9, …]</text>

  <line x1="462" y1="318" x2="610" y2="318" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="462" y="342" font-size="14" fill="#4B5563">Learned from what</text>
  <text x="462" y="362" font-size="14" fill="#4B5563">people play together</text>
</g>

<text x="320" y="434" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Recommend the nearest points: distance decides, not the genre tag.</text>
</svg>
