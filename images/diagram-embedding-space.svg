<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowOrange2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="478" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E1B4B">Items in Embedding Space</text>
  <text x="340" y="48" text-anchor="middle" font-size="12" fill="#6B7280">Similar items cluster together; recommendations = finding nearest neighbors</text>

  <g transform="translate(60,70)">
    <line x1="0" y1="310" x2="560" y2="310" stroke="#E5E7EB" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="310" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="280" y="340" text-anchor="middle" font-size="11" fill="#6B7280">Dimension 1</text>
    <text x="-20" y="155" text-anchor="middle" font-size="11" fill="#6B7280" transform="rotate(-90,-20,155)">Dimension 2</text>

    <!-- Sci-Fi cluster -->
    <g>
      <ellipse cx="130" cy="75" rx="85" ry="65" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,3"/>
      <g fill="#7C3AED">
        <circle cx="100" cy="60" r="6"/>
        <circle cx="140" cy="50" r="6"/>
        <circle cx="120" cy="90" r="6"/>
        <circle cx="155" cy="75" r="6"/>
        <circle cx="90" cy="80" r="6"/>
        <circle cx="135" cy="105" r="6"/>
        <circle cx="165" cy="55" r="6"/>
        <circle cx="110" cy="45" r="6"/>
      </g>
      <text x="130" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C3AED">Sci-Fi Movies</text>
    </g>

    <!-- Cooking cluster -->
    <g>
      <ellipse cx="420" cy="140" rx="80" ry="60" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,3"/>
      <g fill="#10B981">
        <circle cx="400" cy="125" r="6"/>
        <circle cx="430" cy="145" r="6"/>
        <circle cx="445" cy="120" r="6"/>
        <circle cx="410" cy="160" r="6"/>
        <circle cx="460" cy="150" r="6"/>
        <circle cx="390" cy="145" r="6"/>
        <circle cx="440" cy="170" r="6"/>
      </g>
      <text x="420" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#10B981">Cooking Shows</text>
    </g>

    <!-- Sports cluster -->
    <g>
      <ellipse cx="280" cy="245" rx="90" ry="50" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>
      <g fill="#D97706">
        <circle cx="260" cy="235" r="6"/>
        <circle cx="290" cy="250" r="6"/>
        <circle cx="310" cy="230" r="6"/>
        <circle cx="245" cy="255" r="6"/>
        <circle cx="275" cy="270" r="6"/>
        <circle cx="320" cy="260" r="6"/>
        <circle cx="300" cy="215" r="6"/>
        <circle cx="255" cy="220" r="6"/>
      </g>
      <text x="280" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706">Sports Content</text>
    </g>

    <!-- User preference -->
    <polygon points="105,75 109,86 121,86 112,93 115,105 105,98 95,105 98,93 89,86 101,86" fill="#D97706" stroke="#D97706" stroke-width="1"/>
    <line x1="115" y1="85" x2="150" y2="98" stroke="#D97706" stroke-width="2" marker-end="url(#arrowOrange2)"/>
    <text x="75" y="72" font-size="11" fill="#D97706" font-weight="bold">Your taste</text>

    <!-- New item -->
    <g transform="translate(175,65)">
      <circle cx="0" cy="0" r="8" fill="#7C3AED"/>
      <rect x="8" y="-15" width="42" height="26" rx="5" fill="#7C3AED"/>
      <text x="29" y="3" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">NEW</text>
    </g>
    <line x1="175" y1="65" x2="155" y2="75" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Explanatory callout positioned clear of every cluster label -->
  <g>
    <rect x="350" y="72" width="280" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="367" cy="89" r="5" fill="#7C3AED"/>
    <text x="380" y="93" font-size="11" font-weight="bold" fill="#1E1B4B">Items close together = behaviorally similar</text>
  </g>

  <!-- Legend, separated from the Dimension 1 label -->
  <g transform="translate(80,438)">
    <polygon points="0,-8 2,-2 9,-2 4,2 6,9 0,5 -6,9 -4,2 -9,-2 -2,-2" fill="#D97706"/>
    <text x="20" y="4" font-size="11" fill="#6B7280">User preference</text>

    <line x1="130" y1="0" x2="160" y2="0" stroke="#D97706" stroke-width="2" marker-end="url(#arrowOrange2)"/>
    <text x="168" y="4" font-size="11" fill="#6B7280">Recommendation direction</text>

    <circle cx="335" cy="0" r="5" fill="#7C3AED"/>
    <text x="345" y="4" font-size="11" fill="#6B7280">New item (placed by content)</text>
  </g>

  <text x="340" y="469" text-anchor="middle" font-size="11" fill="#6B7280">New items can be placed in embedding space based on their content features alone</text>
</svg>