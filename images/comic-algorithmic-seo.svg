<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb040-title pb040-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb040-title">The Best Book in the Store, Depending</title>
<desc id="pb040-desc">Four-panel comic. 1, quality: an author holds her cozy mystery Tea &amp; Alibis and says it is the best book in the store and will be #1. 2, discoverability: the recommender asks who it is for; she answers cozy-mystery fans, no dragons, and those words become the book's tags. 3, Mina and Tom type the same search, a good book: Mina's #1 is Tea &amp; Alibis and Dragonfire is her #50; Tom's #1 is Dragonfire and Tea &amp; Alibis is his #50. 4, asked whether she is #1, the recommender says yes for Mina, #50 for Tom; the author is fine, she wrote it for Mina. There is no single #1: success is quality times discoverability, being #1 for the readers you wrote for.</desc>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

