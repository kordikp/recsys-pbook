<!-- takeaway -->
<text x="320" y="596" text-anchor="middle" font-size="17" fill="#1E1B4B"><tspan font-weight="700" fill="#7C3AED">No single #1:</tspan> every reader gets their own ranking.</text>
<text x="320" y="622" text-anchor="middle" font-size="17" fill="#1E1B4B"><tspan font-weight="700" fill="#92400E">Quality × discoverability:</tspan> be #1 for the readers you wrote for.</text>
</svg>
