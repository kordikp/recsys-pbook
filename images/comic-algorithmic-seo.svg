<rect x="174" y="204" width="9" height="32"/><rect x="185" y="208" width="12" height="28" fill="#D1D5DB"/><rect x="199" y="203" width="10" height="33"/><rect x="211" y="207" width="11" height="29" fill="#D1D5DB"/><rect x="224" y="204" width="10" height="32"/><rect x="236" y="209" width="12" height="27" fill="#D1D5DB"/><rect x="250" y="203" width="10" height="33"/><rect x="262" y="206" width="12" height="30" fill="#D1D5DB"/>
