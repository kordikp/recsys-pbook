<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn04-title pn04-desc">
  <title id="pn04-title">Two places an AI agent can stand</title>
  <desc id="pn04-desc">An AI agent can stand on your side of the counter, as your shop's assistant calling your recommender as a tool, or on the customer's side, as another company's assistant shopping your store for Mira. Either way a machine reads the list, and Mira confirms before money moves.</desc>
  <defs>
    <marker id="pn04-ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="pn04-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
  </defs>
  <rect x=".5" y=".5" width="639" height="451" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Two places an AI agent can stand</text>
  <text x="168" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#4C1D95">Your shop</text>
  <text x="474" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">The customer's side</text>
  <text x="322" y="70" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">the counter</text>

  <!-- row 1 -->
  <rect x="16" y="86" width="608" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="112" font-size="15" font-weight="700" fill="#1E1B4B">1 · Agent as caller</text>
  <!-- row 2 -->
  <rect x="16" y="248" width="608" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="274" font-size="15" font-weight="700" fill="#1E1B4B">2 · Agent as customer</text>

  <line x1="322" y1="80" x2="322" y2="404" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>

  <g>
    <rect x="28" y="134" width="120" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="88" y="159" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Recommender</text>
    <text x="88" y="181" text-anchor="middle" font-size="14" fill="#4C1D95">retrieve → rank</text>
    <line x1="254" y1="129" x2="254" y2="137" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <circle cx="254" cy="127" r="3" fill="#7C3AED"/>
    <rect x="236" y="137" width="36" height="28" rx="8" fill="#7C3AED"/>
    <circle cx="247" cy="151" r="3.5" fill="#FFFFFF"/><circle cx="261" cy="151" r="3.5" fill="#FFFFFF"/>
    <rect x="240" y="169" width="28" height="24" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="254" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Your assistant</text>
    <text x="254" y="228" text-anchor="middle" font-size="14" fill="#4B5563">your company</text>
    <line x1="232" y1="146" x2="154" y2="146" stroke="#7C3AED" stroke-width="2.25" stroke-linecap="round" marker-end="url(#pn04-ap)"/>
    <text x="192" y="138" text-anchor="middle" font-size="14" fill="#4C1D95">tool call</text>
    <line x1="152" y1="178" x2="230" y2="178" stroke="#7C3AED" stroke-width="2.25" stroke-linecap="round" marker-end="url(#pn04-ap)"/>
    <text x="192" y="198" text-anchor="middle" font-size="14" fill="#4C1D95">facts + why</text>
    <line x1="278" y1="151" x2="440" y2="151" stroke="#7C3AED" stroke-width="2.25" stroke-linecap="round" marker-end="url(#pn04-ap)"/>
    
    <rect x="446" y="135" width="118" height="32" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="505" y="156" text-anchor="middle" font-size="15" fill="#1E1B4B">3 picks + why</text>
    <rect x="446" y="176" width="118" height="28" rx="14" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="505" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">✓ Confirm buy</text>
    <circle cx="600" cy="148" r="11" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <circle cx="596" cy="147" r="1.6" fill="#1E1B4B"/><circle cx="604" cy="147" r="1.6" fill="#1E1B4B"/>
    <path d="M596,152 Q600,155 604,152" fill="none" stroke="#1E1B4B" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M584,194 Q584,163 600,163 Q616,163 616,194 Z" fill="#10B981"/>
    <text x="600" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Mira</text>
  </g>
  <g>
    <rect x="28" y="296" width="120" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="88" y="321" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Recommender</text>
    <text x="88" y="343" text-anchor="middle" font-size="14" fill="#4C1D95">retrieve → rank</text>
    <line x1="392" y1="291" x2="392" y2="299" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="392" cy="289" r="3" fill="#F59E0B"/>
    <rect x="374" y="299" width="36" height="28" rx="8" fill="#F59E0B"/>
    <circle cx="385" cy="313" r="3.5" fill="#FFFFFF"/><circle cx="399" cy="313" r="3.5" fill="#FFFFFF"/>
    <rect x="378" y="331" width="28" height="24" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="392" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Mira's assistant</text>
    <text x="392" y="390" text-anchor="middle" font-size="14" fill="#4B5563">another company</text>
    <line x1="368" y1="308" x2="154" y2="308" stroke="#F59E0B" stroke-width="2.25" stroke-linecap="round" marker-end="url(#pn04-aa)"/>
    <text x="244" y="300" text-anchor="middle" font-size="14" fill="#92400E">visits your shop</text>
    <line x1="152" y1="340" x2="366" y2="340" stroke="#F59E0B" stroke-width="2.25" stroke-linecap="round" marker-end="url(#pn04-aa)"/>
    <text x="244" y="360" text-anchor="middle" font-size="14" fill="#92400E">ranked list + facts</text>
    <line x1="416" y1="313" x2="440" y2="313" stroke="#F59E0B" stroke-width="2.25" stroke-linecap="round" marker-end="url(#pn04-aa)"/>
    
    <rect x="446" y="297" width="118" height="32" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="505" y="318" text-anchor="middle" font-size="15" fill="#1E1B4B">3 picks + why</text>
    <rect x="446" y="338" width="118" height="28" rx="14" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="505" y="357" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">✓ Confirm buy</text>
    <circle cx="600" cy="310" r="11" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <circle cx="596" cy="309" r="1.6" fill="#1E1B4B"/><circle cx="604" cy="309" r="1.6" fill="#1E1B4B"/>
    <path d="M596,314 Q600,317 604,314" fill="none" stroke="#1E1B4B" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M584,356 Q584,325 600,325 Q616,325 616,356 Z" fill="#10B981"/>
    <text x="600" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Mira</text>
  </g>

  <text x="320" y="432" text-anchor="middle" font-size="15" fill="#1E1B4B">Either way <tspan font-weight="700" fill="#4C1D95">a machine reads the list</tspan>, and <tspan font-weight="700" fill="#065F46">Mira confirms</tspan> before money moves.</text>
</svg>
