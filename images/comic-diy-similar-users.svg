<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <defs>
    <symbol id="person" viewBox="0 0 30 72">
      <circle cx="15" cy="11" r="10" fill="currentColor"/>
      <line x1="15" y1="22" x2="15" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="15" y1="31" x2="3" y2="42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="15" y1="31" x2="27" y2="42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="15" y1="50" x2="6" y2="69" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="15" y1="50" x2="24" y2="69" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The Closest Neighbor Is a Matter of Taste</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="92" y="78" width="224" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="204" y="101" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="204" y="101">Same three takeout places?</tspan>
    <tspan x="204" y="121">Give each one 1–5.</tspan>
  </text>
  <use href="#person" x="68" y="166" width="30" height="72" color="#7C3AED"/>
  <use href="#person" x="190" y="166" width="30" height="72" color="#10B981"/>
  <use href="#person" x="312" y="166" width="30" height="72" color="#D97706"/>
  <text x="83" y="254" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">MIRA</text>
  <text x="205" y="254" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">NIA</text>
  <text x="327" y="254" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">SOL</text>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Mira asks two actual neighbors about the same three meals.</text>

  <!-- Panel 2 -->
  <rect x="426" y="80" width="340" height="166" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="596" y="103" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">SAME ORDERS, SIDE BY SIDE</text>
  <text font-size="12" fill="#1E1B4B">
    <tspan x="442" y="129" font-weight="700">ORDER</tspan>
    <tspan x="556" y="129" font-weight="700" fill="#7C3AED">MIRA</tspan>
    <tspan x="612" y="129" font-weight="700" fill="#10B981">NIA Δ</tspan>
    <tspan x="687" y="129" font-weight="700" fill="#D97706">SOL Δ</tspan>

    <tspan x="442" y="160">NOODLES</tspan>
    <tspan x="570" y="160">5</tspan>
    <tspan x="622" y="160">4  (1)</tspan>
    <tspan x="697" y="160">2  (3)</tspan>

    <tspan x="442" y="194">TACOS</tspan>
    <tspan x="570" y="194">2</tspan>
    <tspan x="622" y="194">2  (0)</tspan>
    <tspan x="697" y="194">5  (3)</tspan>

    <tspan x="442" y="228">CURRY</tspan>
    <tspan x="570" y="228">4</tspan>
    <tspan x="622" y="228">5  (1)</tspan>
    <tspan x="697" y="228">3  (1)</tspan>
  </text>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Shared ratings make their differences comparable.</text>

  <!-- Panel 3 -->
  <rect x="36" y="360" width="160" height="105" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="116" y="385" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="116" y="385" font-weight="700" fill="#10B981">NIA</tspan>
    <tspan x="116" y="409">1 + 0 + 1</tspan>
    <tspan x="116" y="429">÷ 3 = 0.67</tspan>
  </text>
  <rect x="72" y="438" width="88" height="20" rx="9" fill="#10B981" stroke="#10B981"/>
  <text x="116" y="452" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CLOSEST</text>

  <rect x="218" y="360" width="160" height="105" rx="9" fill="#FEF3C7" stroke="#D97706"/>
  <text x="298" y="385" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="298" y="385" font-weight="700" fill="#D97706">SOL</tspan>
    <tspan x="298" y="409">3 + 3 + 1</tspan>
    <tspan x="298" y="429">÷ 3 = 2.33</tspan>
  </text>

  <rect x="68" y="485" width="230" height="44" rx="9" fill="#FFFFFF" stroke="#D97706"/>
  <text x="183" y="512" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Can we recount the tacos?</text>
  <use href="#person" x="330" y="474" width="30" height="72" color="#D97706"/>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The lower average difference identifies Nia as Mira's match.</text>

  <!-- Panel 4 -->
  <rect x="424" y="358" width="160" height="52" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="504" y="389" font-size="12.5" fill="#1E1B4B" text-anchor="middle">What should I order next?</text>

  <rect x="598" y="358" width="172" height="52" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="684" y="379" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="684" y="379">Dumplings.</tspan>
    <tspan x="684" y="398">Apparently, we love them.</tspan>
  </text>

  <use href="#person" x="480" y="443" width="30" height="72" color="#7C3AED"/>
  <use href="#person" x="686" y="443" width="30" height="72" color="#10B981"/>
  <line x1="450" y1="524" x2="742" y2="524" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="587" y="466" width="74" height="58" rx="6" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="624" y="491" font-size="10.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="624" y="491">DUMPLINGS</tspan>
    <tspan x="624" y="510">5 / 5</tspan>
  </text>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Mira's dinner now comes with peer-reviewed confidence.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Taste neighbors have low mean differences on shared ratings and drive collaborative filtering.</text>
</svg>