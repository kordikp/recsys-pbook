<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 652" role="img" aria-labelledby="pb062-title pb062-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb062-title">The closest neighbor is a matter of taste</title>
<desc id="pb062-desc">Four-panel comic. Mira asks Sol, who lives next door, and Nia, who lives across town, to rate the same three takeout dishes from 1 to 5. Mira gives noodles 5, tacos 2, curry 4; Nia gives 4, 2, 5; Sol gives 2, 5, 3. Dumplings are left out because Mira has not tried them. Nia is off from Mira by 1, 0 and 1, an average gap of 0.67; Sol is off by 3, 3 and 1, an average of 2.33, and asks for a recount of the tacos. Nia is the closest taste neighbor, so Mira tries the dumplings Nia rated 5. Taste neighbor means the smallest average gap on dishes you both rated; collaborative filtering recommends what taste neighbors loved.</desc>
<rect x=".5" y=".5" width="639" height="651" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" font-size="19" font-weight="700" fill="#1E1B4B" text-anchor="middle">The closest neighbor is a matter of taste</text>
