" fill="#1E1B4B"/><path d="M245,129 Q250,133 255,129" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/><path d="M152,180 H210" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><text x="48" y="218" font-size="15" font-weight="700" fill="#065F46" text-anchor="middle">Mira</text><text x="112" y="218" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">Sol</text><text x="250" y="218" font-size="15" font-weight="700" fill="#4B5563" text-anchor="middle">Nia</text><text x="112" y="238" font-size="14" fill="#6B7280" text-anchor="middle">next door</text><text x="250" y="238" font-size="14" fill="#6B7280" text-anchor="middle">across town</text></g>
<g transform="translate(326,52)"><rect x="0" y="0" width="298" height="258" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="24" cy="24" r="11" fill="#1E1B4B"/><text x="24" y="29" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Line up the scores</text><rect x="128" y="46" width="44" height="130" rx="8" fill="#D1FAE5"/><text x="150" y="66" font-size="15" font-weight="700" fill="#065F46" text-anchor="middle">Mira</text><text x="204" y="66" font-size="15" font-weight="700" fill="#4B5563" text-anchor="middle">Nia</text><text x="258" y="66" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">Sol</text><text x="16" y="98" font-size="15" fill="#1E1B4B">🍜 Noodles</text><text x="150" y="98" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle">5</text><text x="204" y="98" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle">4</text><text x="258" y="98" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle">2</text><text x="16" y="128" font-size="15" fill="#1E1B4B">🌮 Tacos</text><text x="150" y="128" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle">2</text><text x="204" y="128" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle">2</text><text x="258" y="128" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle">5</text><text x="16" y="158" font-size="15" fill="#1E1B4B">🍛 Curry</text><text x="150" y="158" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle">4</text><text x="204" y="158" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle">5</text><text x="258" y="158" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle">3</text><path d="M14,186 H284" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 4"/><text x="16" y="210" font-size="15" fill="#6B7280">🥟 Dumplings</text><text x="150" y="210" font-size="16" font-weight="700" fill="#065F46" text-anchor="middle">?</text><text x="204" y="210" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">5</text><text x="258" y="210" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">–</text><text x="149" y="240" font-size="14" fill="#4B5563" text-anchor="middle">Compare only dishes both people rated.</text></g>
<g transform="translate(16,322)"><rect x="0" y="0" width="298" height="258" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="24" cy="24" r="11" fill="#1E1B4B"/><text x="24" y="29" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">How far from Mira?</text><rect x="12" y="42" width="132" height="106" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/><text x="78" y="63" font-size="15" font-weight="700" fill="#4B5563" text-anchor="middle">Nia</text><text x="78" y="84" font-size="15" fill="#1E1B4B" text-anchor="middle">off by 1, 0, 1</text><text x="78" y="110" text-anchor="middle" fill="#065F46"><tspan font-size="14">avg gap </tspan><tspan font-size="22" font-weight="700">0.67</tspan></text><rect x="22" y="118" width="112" height="22" rx="11" fill="#10B981"/><text x="78" y="134" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">closest taste</text><rect x="154" y="42" width="132" height="106" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/><text x="220" y="63" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">Sol</text><text x="220" y="84" font-size="15" fill="#1E1B4B" text-anchor="middle">off by 3, 3, 1</text><text x="220" y="110" text-anchor="middle" fill="#92400E"><tspan font-size="14">avg gap </tspan><tspan font-size="22" font-weight="700">2.33</tspan></text><text x="220" y="134" font-size="14" fill="#92400E" text-anchor="middle">far apart</text><path d="M12,250 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/><path d="M236,250 V212 Q236,196 252,196 H264 Q280,196 280,212 V250 Z" fill="#F59E0B"/><circle cx="258" cy="176" r="16" fill="#FFFFFF" stroke="#92400E" stroke-width="2"/><path d="M242,173 A16,16 0 0 1 274,173 Z" fill="#92400E"/><path d="M268,173 H283" stroke="#92400E" stroke-width="3.5" stroke-linecap="round"/><circle cx="253" cy="177" r="2.1" fill="#1E1B4B"/><circle cx="263" cy="177" r="2.1" fill="#1E1B4B"/><path d="M253,186 Q258,182 263,186" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/><path d="M249,170 L255,172 M261,172 L267,170" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/><path d="M26,182 H206 Q218,182 218,194 V193 L236,198 L218,207 V214 Q218,226 206,226 H26 Q14,226 14,214 V194 Q14,182 26,182 Z" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round"/><text x="116" y="209.25" font-size="15" fill="#1E1B4B" text-anchor="middle"><tspan x="116">Can we recount the tacos?</tspan></text></g>
<g transform="translate(326,322)"><rect x="0" y="0" width="298" height="258" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="24" cy="24" r="11" fill="#1E1B4B"/><text x="24" y="29" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Borrow her taste</text><path d="M12,246 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/><path d="M24,42 H176 Q188,42 188,54 V80 Q188,92 176,92 H58 L52,134 L42,92 H24 Q12,92 12,80 V54 Q12,42 24,42 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-linejoin="round"/><text x="100" y="62.25" font-size="15" fill="#1E1B4B" text-anchor="middle"><tspan x="100">Try the dumplings.</tspan><tspan x="100" dy="20">I gave them a 5!</tspan></text><path d="M124,100 H274 Q286,100 286,112 V138 Q286,150 274,150 H246 L244,150 L230,150 H124 Q112,150 112,138 V112 Q112,100 124,100 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/><text x="199" y="120.25" font-size="15" fill="#1E1B4B" text-anchor="middle"><tspan x="199">My closest neighbor</tspan><tspan x="199" dy="20">lives across town!</tspan></text><path d="M30,246 V208 Q30,192 46,192 H58 Q74,192 74,208 V246 Z" fill="#D1D5DB"/><circle cx="52" cy="154" r="7" fill="#4B5563"/><circle cx="52" cy="172" r="16" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/><circle cx="47" cy="173" r="2.1" fill="#1E1B4B"/><circle cx="57" cy="173" r="2.1" fill="#1E1B4B"/><path d="M47,179 Q52,183 57,179" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/><path d="M224,246 V208 Q224,192 240,192 H252 Q268,192 268,208 V246 Z" fill="#10B981"/><circle cx="246" cy="172" r="16" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/><circle cx="241" cy="173" r="2.1" fill="#1E1B4B"/><circle cx="251" cy="173" r="2.1" fill="#1E1B4B"/><circle cx="246" cy="181" r="2.6" fill="none" stroke="#1E1B4B" stroke-width="1.8"/><rect x="96" y="164" width="108" height="76" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="150" y="183" font-size="14" fill="#4C1D95" text-anchor="middle">for Mira</text><text x="150" y="211" font-size="24" fill="#1E1B4B" text-anchor="middle">🥟</text><text x="150" y="232" font-size="15" font-weight="700" fill="#4C1D95" text-anchor="middle">dumplings</text></g>
<text x="320" y="608" font-size="16" fill="#1E1B4B" text-anchor="middle"><tspan font-weight="700" fill="#065F46">Taste neighbor</tspan> = smallest average gap on dishes you both rated.</text>
<text x="320" y="634" font-size="16" fill="#1E1B4B" text-anchor="middle"><tspan font-weight="700" fill="#7C3AED">Collaborative filtering</tspan> recommends what your taste neighbors loved.</text>
</svg>