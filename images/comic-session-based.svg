<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 616" role="img" aria-labelledby="pb097-title pb097-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb097-title">No past, just browsing</title>
<desc id="pb097-desc">Four-panel comic. An anonymous shopper with no account clicks a jacket, boots and gloves: three clicks are all the shop knows. A deep model, built to learn patterns from long click histories, finds three clicks too little and calls them a snack, not a pattern. A simple counter, item-KNN, looks at what other shoppers who clicked these items also clicked and finds wool socks. The shopper is happy with the socks while the deep model asks them to keep clicking for a week. Few clicks starve a deep model; simple also-clicked counting often wins.</desc>
<defs>
  <clipPath id="pb097-clip"><rect x="0" y="0" width="298" height="252" rx="12"/></clipPath>
</defs>

<rect x=".5" y=".5" width="639" height="615" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">No past, just browsing</text>

<!-- ===== Panel 1: a stranger, three clicks ===== -->
<g transform="translate(16,52)">
  <rect x="0" y="0" width="298" height="252" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
  <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">A stranger, three clicks</text>

  <!-- bubble -->
  <path d="M24,46 H212 Q224,46 224,58 V70 Q224,82 212,82 H64 L54,110 L48,82 H24 Q12,82 12,70 V58 Q12,46 24,46 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="118" y="69" text-anchor="middle" font-size="15" fill="#1E1B4B">No account. Just browsing.</text>

  <!-- shopper with a blank name tag -->
  <path d="M12,214.5 H96" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M26,214 V174 Q26,158 42,158 H56 Q72,158 72,174 V214 Z" fill="#10B981"/>
  <circle cx="49" cy="137" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
  <circle cx="44" cy="135" r="2.2" fill="#1E1B4B"/>
  <circle cx="54" cy="135" r="2.2" fill="#1E1B4B"/>
  <path d="M44,143 Q49,147 54,143" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="33" y="171" width="32" height="20" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.2"/>
  <text x="49" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">???</text>
  <text x="49" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Anonymous</text>

  <!-- the whole session -->
  <text x="104" y="128" font-size="14" fill="#4B5563">All the shop knows:</text>
  <rect x="104" y="140" width="48" height="48" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="168" y="140" width="48" height="48" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="232" y="140" width="48" height="48" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="128" y="174" text-anchor="middle" font-size="26">🧥</text>
  <text x="192" y="174" text-anchor="middle" font-size="26">🥾</text>
  <text x="256" y="174" text-anchor="middle" font-size="26">🧤</text>
  <path d="M155,164 L165,164 M161,160 L165,164 L161,168 M219,164 L229,164 M225,160 L229,164 L225,168" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="208" text-anchor="middle" font-size="14" fill="#1E1B4B">jacket</text>
  <text x="192" y="208" text-anchor="middle" font-size="14" fill="#1E1B4B">boots</text>
  <text x="256" y="208" text-anchor="middle" font-size="14" fill="#1E1B4B">gloves</text>
</g>

<!-- ===== Panel 2: the deep model ===== -->
<g transform="translate(326,52)">
  <rect x="0" y="0" width="298" height="252" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
  <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
