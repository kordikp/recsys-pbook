  <circle cx="49" cy="137" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
  <path d="M42,134 Q44,131 46,134 M52,134 Q54,131 56,134" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M43,141 Q49,149 55,141 Z" fill="#1E1B4B" stroke="#1E1B4B" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="33" y="171" width="32" height="20" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.2"/>
  <text x="49" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">???</text>

