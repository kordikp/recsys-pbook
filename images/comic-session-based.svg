  <circle cx="73" cy="138" r="3.5" fill="#1E1B4B"/>
  <path d="M39,131 L54,127 M81,131 L66,127" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M50,157 Q55,153 60,157 Q65,161 70,157" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <rect x="54" y="164" width="12" height="6" fill="#4C1D95"/>
  <rect x="22" y="170" width="76" height="44" rx="12" fill="#7C3AED"/>
  <rect x="34" y="178" width="52" height="7" rx="3.5" fill="#EDE9FE"/>
  <rect x="34" y="189" width="52" height="7" rx="3.5" fill="#EDE9FE"/>
  <rect x="34" y="200" width="52" height="7" rx="3.5" fill="#EDE9FE"/>
  <text x="60" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Deep model</text>

  <!-- the click history it was built for -->
  <text x="122" y="140" font-size="14" fill="#4B5563">Built for long histories:</text>
  <g clip-path="url(#pb097-clip)">
    <rect x="122" y="152" width="20" height="24" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
