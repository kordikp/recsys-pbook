  <rect x="37" y="182" width="22" height="6" rx="3" fill="#EDE9FE"/>
  <text x="48" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">item-KNN</text>

  <!-- tally board -->
  <rect x="88" y="112" width="198" height="114" rx="10" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="100" y="134" font-size="14" fill="#4B5563">Others also clicked:</text>
  <rect x="94" y="146" width="186" height="26" rx="6" fill="#EDE9FE"/>
  <text x="102" y="164" font-size="15" font-weight="700" fill="#4C1D95">wool socks</text>
  <text x="102" y="192" font-size="15" fill="#1E1B4B">scarf</text>
  <text x="102" y="216" font-size="15" fill="#1E1B4B">flip-flops</text>
  <g fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round">
    <!-- wool socks: 5 + 5 + 2 -->
    <path d="M192,151 V167 M197,151 V167 M202,151 V167 M207,151 V167 M188,165 L211,153"/>
    <path d="M220,151 V167 M225,151 V167 M230,151 V167 M235,151 V167 M216,165 L239,153"/>
    <path d="M248,151 V167 M253,151 V167"/>
    <!-- scarf: 5 + 1 -->
    <path d="M192,179 V195 M197,179 V195 M202,179 V195 M207,179 V195 M188,193 L211,181"/>
    <path d="M220,179 V195"/>
    <!-- flip-flops: 1 -->
    <path d="M192,203 V219"/>
  </g>
</g>

<!-- ===== Panel 4: next on screen ===== -->
<g transform="translate(326,316)">
  <rect x="0" y="0" width="298" height="252" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
  <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Next on screen</text>

  <!-- shopper bubble -->
  <path d="M24,46 H98 Q110,46 110,58 V86 Q110,98 98,98 H62 L54,116 L48,98 H24 Q12,98 12,86 V58 Q12,46 24,46 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="61" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Socks!</text>
