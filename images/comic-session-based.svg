    <rect x="206" y="170" width="76" height="44" rx="12" fill="#7C3AED"/>
    <rect x="218" y="178" width="52" height="7" rx="3.5" fill="#EDE9FE"/>
    <rect x="218" y="189" width="52" height="7" rx="3.5" fill="#EDE9FE"/>
