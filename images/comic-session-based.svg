  <text x="149" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">That’s a snack.</text>

  <!-- big robot, worried -->
  <path d="M12,214.5 H108" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="110" x2="60" y2="120" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
