  </g>
  <text x="244" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Deep model</text>
</g>

<text x="320" y="600" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Few clicks starve a deep model; <tspan fill="#7C3AED">simple “also clicked” counting</tspan> often wins.</text>
</svg>
