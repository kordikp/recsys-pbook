  <text x="261" y="113" font-size="12.5" fill="#1E1B4B" text-anchor="middle">No account. Just browsing.</text>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Seven in ten shoppers arrive nameless; this visit is the file.</text>

