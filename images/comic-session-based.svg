  <text x="136" y="186" text-anchor="middle" font-size="24">🧦</text>
  <text x="136" y="205" text-anchor="middle" font-size="14" fill="#1E1B4B">wool socks</text>

  <!-- big robot, still hoping (same look as panel 2) -->
  <g clip-path="url(#pb097-clip)">
    <line x1="244" y1="110" x2="244" y2="120" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
