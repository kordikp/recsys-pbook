  <path d="M132,46 H274 Q286,46 286,58 V86 Q286,98 274,98 H238 L230,116 L226,98 H132 Q120,98 120,86 V58 Q120,46 132,46 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
