    <rect x="218" y="152" width="20" height="24" rx="4" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="242" y="152" width="20" height="24" rx="4" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="266" y="152" width="20" height="24" rx="4" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="290" y="152" width="20" height="24" rx="4" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <path d="M122,186 V191 H190 V186" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
  <text x="156" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">3 clicks</text>
  <text x="246" y="208" text-anchor="middle" font-size="14" fill="#6B7280">empty</text>
</g>

<!-- ===== Panel 3: the counter ===== -->
<g transform="translate(16,316)">
  <rect x="0" y="0" width="298" height="252" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
  <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">The counter (item-KNN)</text>

  <!-- bubble -->
  <path d="M24,46 H274 Q286,46 286,58 V86 Q286,98 274,98 H60 L50,122 L44,98 H24 Q12,98 12,86 V58 Q12,46 24,46 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="149" y="68" text-anchor="middle" font-size="15" fill="#1E1B4B">People who clicked these also</text>
  <text x="149" y="88" text-anchor="middle" font-size="15" fill="#1E1B4B">clicked wool socks. <tspan font-weight="700">I just count.</tspan></text>

  <!-- small robot, content -->
  <path d="M12,214.5 H82" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="128" x2="48" y2="136" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
