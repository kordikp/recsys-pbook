  <text x="545" y="385" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Please upload your childhood.</text>
  <path d="M755 460 H773 M758 473 H773 M756 486 H770" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The questionnaire is thorough. The customer is already leaving.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Short sessions starve deep models; item-KNN can use strong local item similarity.</text>
