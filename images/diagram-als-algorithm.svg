<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="598" height="348" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E1B4B">Alternating Least Squares (ALS)</text>
  <text x="300" y="43" text-anchor="middle" font-size="11" fill="#6B7280">Matrix factorization via alternating optimization</text>

  <!-- Matrix X: sparse user-item matrix -->
  <g transform="translate(30,65)">
    <text x="40" y="-5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E1B4B">X</text>
    <text x="40" y="111" text-anchor="middle" font-size="11" fill="#6B7280">(users × items)</text>
    <rect x="0" y="0" width="80" height="96" rx="4" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.2"/>

    <rect x="4" y="4" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.7"/>
    <rect x="36" y="4" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.5"/>
    <rect x="20" y="20" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.8"/>
    <rect x="64" y="20" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.4"/>
    <rect x="4" y="36" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.6"/>
    <rect x="52" y="36" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.9"/>
    <rect x="36" y="52" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.3"/>
    <rect x="64" y="52" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.7"/>
    <rect x="20" y="68" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.5"/>
    <rect x="52" y="68" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.8"/>
    <rect x="4" y="84" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.4"/>
    <rect x="64" y="84" width="12" height="12" rx="2" fill="#0EA5E9" opacity="0.6"/>

    <rect x="20" y="4" width="12" height="12" rx="2" fill="none" stroke="#E5E7EB"/>
    <rect x="52" y="4" width="12" height="12" rx="2" fill="none" stroke="#E5E7EB"/>
    <rect x="4" y="20" width="12" height="12" rx="2" fill="none" stroke="#E5E7EB"/>
    <rect x="36" y="20" width="12" height="12" rx="2" fill="none" stroke="#E5E7EB"/>
    <rect x="20" y="36" width="12" height="12" rx="2" fill="none" stroke="#E5E7EB"/>
    <rect x="36" y="36" width="12" height="12" rx="2" fill="none" stroke="#E5E7EB"/>
  </g>

  <text x="130" y="120" text-anchor="middle" font-size="20" fill="#1E1B4B">≈</text>

  <!-- Matrix U: dense user factors -->
  <g transform="translate(155,65)">
    <text x="22" y="-5" text-anchor="middle" font-size="12" font-weight="bold" fill="#0EA5E9">U</text>
    <text x="22" y="111" text-anchor="middle" font-size="11" fill="#6B7280">(users × k)</text>
    <rect x="0" y="0" width="44" height="96" rx="4" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>

    <rect x="4" y="4" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.5"/>
    <rect x="24" y="4" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.7"/>
    <rect x="4" y="20" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.8"/>
    <rect x="24" y="20" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.4"/>
    <rect x="4" y="36" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.6"/>
    <rect x="24" y="36" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.9"/>
    <rect x="4" y="52" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.3"/>
    <rect x="24" y="52" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.7"/>
    <rect x="4" y="68" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.5"/>
    <rect x="24" y="68" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.8"/>
    <rect x="4" y="84" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.7"/>
    <rect x="24" y="84" width="16" height="12" rx="2" fill="#0EA5E9" opacity="0.4"/>
  </g>

  <text x="218" y="120" text-anchor="middle" font-size="16" fill="#1E1B4B">×</text>

  <!-- Matrix V transpose: dense item factors -->
  <g transform="translate(235,65)">
    <text x="40" y="-5" text-anchor="middle" font-size="12" font-weight="bold" fill="#10B981">Vᵀ</text>
    <text x="40" y="59" text-anchor="middle" font-size="11" fill="#6B7280">(k × items)</text>
    <rect x="0" y="0" width="80" height="44" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>

    <rect x="4" y="4" width="12" height="16" rx="2" fill="#10B981" opacity="0.6"/>
    <rect x="20" y="4" width="12" height="16" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="36" y="4" width="12" height="16" rx="2" fill="#10B981" opacity="0.4"/>
    <rect x="52" y="4" width="12" height="16" rx="2" fill="#10B981" opacity="0.7"/>
    <rect x="64" y="4" width="12" height="16" rx="2" fill="#10B981" opacity="0.5"/>
    <rect x="4" y="24" width="12" height="16" rx="2" fill="#10B981" opacity="0.7"/>
    <rect x="20" y="24" width="12" height="16" rx="2" fill="#10B981" opacity="0.5"/>
    <rect x="36" y="24" width="12" height="16" rx="2" fill="#10B981" opacity="0.9"/>
    <rect x="52" y="24" width="12" height="16" rx="2" fill="#10B981" opacity="0.3"/>
    <rect x="64" y="24" width="12" height="16" rx="2" fill="#10B981" opacity="0.8"/>
  </g>

  <!-- Alternating step 1 -->
  <rect x="350" y="60" width="230" height="70" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="465" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E1B4B">Step 1: Fix V, Solve for U</text>

  <g transform="translate(372,92)">
    <rect x="0" y="0" width="24" height="18" rx="3" fill="#D1FAE5" stroke="#10B981"/>
    <text x="12" y="13" text-anchor="middle" font-size="11" font-weight="bold" fill="#10B981">V</text>
    <text x="31" y="13" font-size="11" fill="#6B7280">fixed</text>
  </g>

  <g transform="translate(455,92)">
    <rect x="0" y="0" width="24" height="18" rx="3" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="12" y="13" text-anchor="middle" font-size="11" font-weight="bold" fill="#0EA5E9">U</text>
    <text x="31" y="13" font-size="11" font-weight="600" fill="#0EA5E9">→ update</text>
  </g>

  <path d="M580 130 Q590 155 580 175" fill="none" stroke="#1E1B4B" stroke-width="1.5"/>
  <polygon points="577,175 580,183 583,175" fill="#1E1B4B"/>

  <!-- Alternating step 2 -->
  <rect x="350" y="185" width="230" height="70" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="465" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E1B4B">Step 2: Fix U, Solve for V</text>

  <g transform="translate(372,217)">
    <rect x="0" y="0" width="24" height="18" rx="3" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="12" y="13" text-anchor="middle" font-size="11" font-weight="bold" fill="#0EA5E9">U</text>
    <text x="31" y="13" font-size="11" fill="#6B7280">fixed</text>
  </g>

  <g transform="translate(455,217)">
    <rect x="0" y="0" width="24" height="18" rx="3" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="12" y="13" text-anchor="middle" font-size="11" font-weight="bold" fill="#10B981">V</text>
    <text x="31" y="13" font-size="11" font-weight="600" fill="#10B981">→ update</text>
  </g>

  <!-- Repeat loop -->
  <path d="M350 240 Q310 260 310 190 Q310 130 350 130" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-dasharray="5 3"/>
  <polygon points="350,126 350,134 342,130" fill="#1E1B4B"/>
  <text x="280" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B" transform="rotate(-90 280 195)">Repeat until</text>
  <text x="294" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B" transform="rotate(-90 294 195)">convergence</text>

  <!-- Key insight -->
  <rect x="35" y="286" width="530" height="52" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="300" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#7C3AED">Key Insight</text>
  <text x="300" y="326" text-anchor="middle" font-size="11" fill="#1E1B4B">Each step is a ridge regression with a closed-form solution: U ← X V(VᵀV + λI)⁻¹</text>
</svg>