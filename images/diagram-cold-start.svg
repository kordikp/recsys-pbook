<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb117-title pb117-desc">
  <title id="pb117-title">Cold start is a hand-off, not one fix</title>
  <desc id="pb117-desc">For a new user and for a new item alike, the system first guesses from what it already knows (popularity, demographics or a short survey; content features, beeFormer, metadata neighbors or editor picks), then explores with bandits or reserved exploration slots, and collaborative filtering takes over once enough interactions pile up.</desc>
  <defs>
    <marker id="pb117-arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#9CA3AF"/>
    </marker>
    <marker id="pb117-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#F59E0B"/>
    </marker>
    <marker id="pb117-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="451" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <!-- title -->
  <text x="320" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Cold start is a hand-off, not one fix</text>

  <!-- warm-up axis -->
  <text x="24" y="70" font-size="14" fill="#4B5563">❄️ cold: 0 interactions</text>
  <text x="616" y="70" text-anchor="end" font-size="14" fill="#4B5563">warm: plenty of data ☀️</text>
  <line x1="24" y1="82" x2="610" y2="82" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pb117-arr-grey)"/>

  <!-- column headers -->
  <text x="24" y="112" font-size="15" font-weight="700" fill="#1E1B4B">1 · Educated guess</text>
  <text x="248" y="112" font-size="15" font-weight="700" fill="#92400E">2 · Explore</text>
  <text x="452" y="112" font-size="15" font-weight="700" fill="#4C1D95">3 · Learn from clicks</text>

  <!-- lane: new user -->
  <text x="24" y="140" font-size="15" font-weight="700" fill="#065F46">👤 New user</text>
  <rect x="24" y="150" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="42" cy="176" r="3" fill="#9CA3AF"/>
  <text x="54" y="181" font-size="15" fill="#1E1B4B">Popularity fallback</text>
  <circle cx="42" cy="200" r="3" fill="#9CA3AF"/>
  <text x="54" y="205" font-size="15" fill="#1E1B4B">Demographics, survey</text>
  <circle cx="42" cy="224" r="3" fill="#9CA3AF"/>
  <text x="54" y="229" font-size="15" fill="#1E1B4B">Linked accounts</text>

  <rect x="248" y="150" width="180" height="100" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="264" y="180" font-size="15" font-weight="700" fill="#92400E">🎲 Bandit picks</text>
  <text x="264" y="205" font-size="14" fill="#92400E">narrow in within</text>
  <text x="264" y="226" font-size="14" fill="#92400E">~10–20 interactions</text>

  <!-- lane: new item -->
  <text x="24" y="288" font-size="15" font-weight="700" fill="#1E1B4B">📦 New item</text>
  <rect x="24" y="298" width="200" height="104" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="42" cy="317" r="3" fill="#9CA3AF"/>
  <text x="54" y="322" font-size="15" fill="#1E1B4B">Content features</text>
  <circle cx="42" cy="339" r="3" fill="#9CA3AF"/>
  <text x="54" y="344" font-size="15" fill="#1E1B4B">beeFormer embedding</text>
  <circle cx="42" cy="361" r="3" fill="#9CA3AF"/>
  <text x="54" y="366" font-size="15" fill="#1E1B4B">Metadata neighbors</text>
  <circle cx="42" cy="383" r="3" fill="#9CA3AF"/>
  <text x="54" y="388" font-size="15" fill="#1E1B4B">Editor picks</text>

  <rect x="248" y="298" width="180" height="104" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="264" y="330" font-size="15" font-weight="700" fill="#92400E">🎯 Exploration slots</text>
  <text x="264" y="355" font-size="14" fill="#92400E">~5–15% of each list</text>
  <text x="264" y="376" font-size="14" fill="#92400E">kept for newcomers</text>

  <!-- hand-off arrows -->
  <line x1="226" y1="200" x2="244" y2="200" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb117-arr-amber)"/>
  <line x1="226" y1="350" x2="244" y2="350" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb117-arr-amber)"/>
  <line x1="430" y1="200" x2="448" y2="200" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb117-arr-purple)"/>
  <line x1="430" y1="350" x2="448" y2="350" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb117-arr-purple)"/>

  <!-- collaborative filtering takes over -->
  <rect x="452" y="150" width="164" height="252" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="534" y="238" text-anchor="middle" font-size="28">👥</text>
  <text x="534" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#4C1D95">Collaborative</text>
  <text x="534" y="291" text-anchor="middle" font-size="16" font-weight="700" fill="#4C1D95">filtering</text>
  <text x="534" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#4C1D95">takes over</text>
  <text x="534" y="340" text-anchor="middle" font-size="14" fill="#4C1D95">once real clicks</text>
  <text x="534" y="359" text-anchor="middle" font-size="14" fill="#4C1D95">pile up</text>

  <!-- takeaway -->
  <text x="320" y="434" text-anchor="middle" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#7C3AED">Combine, don't choose:</tspan> each layer covers until behavior data arrives.</text>
</svg>
