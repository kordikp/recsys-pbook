<rect x="114" y="156" width="72" height="24" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="150" y="173" font-size="14" fill="#4C1D95" text-anchor="middle">weather</text><rect x="192" y="156" width="84" height="24" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="234" y="173" font-size="14" fill="#4C1D95" text-anchor="middle">Riverside</text>
<text x="114" y="210" font-size="14" font-weight="700" fill="#065F46">→ Riverside readers</text><path d="M20,44 H156 Q168,44 168,56 V82 Q168,94 156,94 H63 L58,134 L49,94 H20 Q8,94 8,82 V56 Q8,44 20,44 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/><text x="88" y="64.5" font-size="16" fill="#1E1B4B" text-anchor="middle"><tspan x="88">No clicks yet, so…</tspan><tspan x="88" dy="20">what’s it about?</tspan></text><text x="12" y="256" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="start">Recommender</text>
</g>
