<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb085-title pb085-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb085-title">Today’s news expires before lunch</title>
<desc id="pb085-desc">Four-panel comic about why news is the hardest recommendation domain. 8:00: a storm alert for Riverside is published with zero clicks, so the recommender cannot learn from clicks and instead goes by what the story is about (weather, Riverside) and sends it to Riverside readers. 12:00: now the storm alert is the most-read story and the recommender pushes it, but you reply that the storm is over and you already read it at 8: by the time clicks pile up the story is stale, and nobody reads news twice. Afternoon: the recommender notes gossip gets more clicks, but the editor keeps the newsroom's own investigation pinned on top, while the recommender personalises the rest. Evening: your football feed also gets Sunday's vote; you never asked for politics, but you still vote. Takeaway: news is fresh every hour and stale by noon, so go by what a story is about; and it is too important for clicks alone, so editors pin what matters and the feed mixes topics.</desc>
