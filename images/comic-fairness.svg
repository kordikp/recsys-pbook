<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb073-title pb073-desc">
<title id="pb073-title">A fair chance at the front</title>
<desc id="pb073-desc">Four-panel comic at a market. The recommender robot gives the front spot to the top seller: Mara has sold 40 muffins, newcomer Leo has sold 0 croissants and sits in the back corner. The front spot brings more shoppers, more shoppers bring more sales, and more sales win the front spot again, so the popular get more popular. Leo asks how to get the front spot; the robot says just outsell Mara, but nobody walks to the back. Then a new rule reserves a front spot for newcomers: a shopper discovers Leo's croissants and he makes his first sale. A fair-chance spot gives newcomers a turn to be seen.</desc>
