<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .swap{animation:sw 5s ease-in-out infinite}
    @keyframes sw{0%,30%{opacity:.45}45%,90%{opacity:1}100%{opacity:.45}}
    .old{animation:so 5s ease-in-out infinite}
    @keyframes so{0%,30%{opacity:1}45%,90%{opacity:.35}100%{opacity:1}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Score Items — or Score the Whole Slate?</text>

  <g font-size="13" text-anchor="middle">
    <text x="215" y="76" font-weight="800" fill="#4B5563">TOP-K BY ITEM SCORE</text>
    <g class="old">
      <rect x="90" y="92" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/><text x="215" y="117">🎬 Action Movie A <tspan fill="#6B7280">0.93</tspan></text>
      <rect x="90" y="140" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/><text x="215" y="165">🎬 Action Movie B <tspan fill="#6B7280">0.91</tspan></text>
      <rect x="90" y="188" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/><text x="215" y="213">🎬 Action Movie C <tspan fill="#6B7280">0.90</tspan></text>
      <rect x="90" y="236" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/><text x="215" y="261">🎬 Action Movie D <tspan fill="#6B7280">0.89</tspan></text>
      <text x="215" y="308" fill="#B91C1C" font-weight="700">four near-duplicates 😴</text>
    </g>

    <text x="585" y="76" font-weight="800" fill="#065F46">SLATE-OPTIMIZED SET</text>
    <g class="swap">
      <rect x="460" y="92" width="250" height="40" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/><text x="585" y="117">🎬 Action Movie A <tspan fill="#065F46">anchor</tspan></text>
      <rect x="460" y="140" width="250" height="40" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/><text x="585" y="165">😂 Comedy Pick <tspan fill="#065F46">variety</tspan></text>
      <rect x="460" y="188" width="250" height="40" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/><text x="585" y="213">🎥 Documentary <tspan fill="#065F46">depth</tspan></text>
      <rect x="460" y="236" width="250" height="40" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/><text x="585" y="261">✨ New Release <tspan fill="#065F46">discovery</tspan></text>
      <text x="585" y="308" fill="#065F46" font-weight="700">a menu, not an echo ✔</text>
    </g>
  </g>
  <text x="400" y="352" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E1B4B">value(slate) ≠ Σ value(item) — items interact on the screen</text>
  <text x="400" y="385" text-anchor="middle" font-size="13" fill="#6B7280">Users pick from the SET you show: near-duplicates cannibalize each other; diversity earns the extra click.</text>
</svg>
