<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="pb031-title pb031-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb031-title">Greedy slate building: each pick changes what the next one is worth</title>
<desc id="pb031-desc">Toy example with six candidate films and a slate value in which a topic's first film counts fully, its second half, its third a quarter. Taking the top 4 by item score gives four sci-fi films: their scores sum to 3.56, but the slate is worth only 0.92 + 0.45 + 0.22 + 0.11 = 1.70. Greedy slate building adds, at each step, the candidate with the highest marginal gain given what is already on the slate: once sci-fi A is in, every other sci-fi film is worth half, so comedy E and documentary F are picked before sci-fi B. Its item scores sum to only 3.14, yet the slate is worth 2.69. Score the page, not the items.</desc>
