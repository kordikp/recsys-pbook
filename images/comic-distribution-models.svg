<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The House Always Recommends</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="170" y="76" width="190" height="42" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="265" y="102" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Try this—Nina liked it.</text>
  <circle cx="126" cy="169" r="10" fill="#7C3AED"/>
  <path d="M126 180 L126 229 M126 193 L155 210 M126 195 L106 214" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="278" cy="169" r="10" fill="#10B981"/>
  <path d="M278 180 L278 229 M278 194 L245 210 M278 195 L297 214" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="201" cy="211" rx="31" ry="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Social graph: a friend's taste reaches your table first.</text>

  <!-- Panel 2 -->
  <rect x="430" y="76" width="105" height="34" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="482.5" y="98" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Your usual?</text>
  <rect x="557.5" y="78" width="85" height="28" rx="9" fill="#FEF3C7" stroke="#D97706"/>
  <text x="600" y="97" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">EVERY FRI.</text>
  <circle cx="508" cy="165" r="10" fill="#0EA5E9"/>
  <path d="M508 176 L508 225 M508 190 L538 208 M508 190 L489 207" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="678" cy="165" r="10" fill="#7C3AED"/>
  <path d="M678 176 L678 225 M678 191 L648 211 M678 191 L696 210" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M558 218 Q582 239 606 218 Z" fill="#FEF3C7" stroke="#D97706"/>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Subscription: she chose soup once, then Friday chose it.</text>

  <!-- Panel 3 -->
  <rect x="36" y="365" width="139" height="90" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="105.5" y="393" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="105.5" y="393">COMMUNITY PICKS</tspan>
    <tspan x="105.5" y="416" fill="#7C3AED">12 votes</tspan>
  </text>
  <circle cx="197" cy="474" r="10" fill="#7C3AED"/>
  <path d="M197 485 L197 527 M197 495 L170 473 M197 496 L216 510" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="235" y="383" width="135" height="70" rx="8" fill="#D1FAE5" stroke="#10B981"/>
  <text x="302.5" y="412" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="302.5" y="412">BOOK CLUB</tspan>
    <tspan x="302.5" y="433" fill="#10B981">GROUP TRAY</tspan>
  </text>
  <circle cx="302" cy="478" r="10" fill="#10B981"/>
  <path d="M302 489 L302 528 M302 499 L276 480 M302 499 L326 479" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Community picks fill one board; group-based trays serve clubs.</text>

  <!-- Panel 4 -->
  <rect x="430" y="356" width="205" height="44" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="532.5" y="383" font-size="12.5" fill="#1E1B4B" text-anchor="middle">I chose your next six.</text>
  <circle cx="486" cy="432" r="10" fill="#0EA5E9"/>
  <path d="M486 443 L486 486 M486 455 L518 469 M486 456 L466 473" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="636" cy="438" r="10" fill="#7C3AED"/>
  <path d="M636 449 L636 487 M636 460 L610 474 M636 460 L656 478" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M440 510 H746 M455 493 Q468 507 481 493 M525 493 Q538 507 551 493 M595 493 Q608 507 621 493 M665 493 Q678 507 691 493" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="700" y="418" width="60" height="70" rx="6" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="730" y="443" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="730" y="443">MENU</tspan>
    <tspan x="730" y="465" fill="#7C3AED">YOUR PICK</tspan>
  </text>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">They owned the menu. The conveyor owned the evening.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Feeds use social, subscription, community, group, or algorithmic models; the last is taking over.</text>
</svg>