<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" role="img" aria-labelledby="pb058-title pb058-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb058-title">The House Always Recommends</title>
<desc id="pb058-desc">Four-panel comic about content distribution models. Panel 1: each post in a feed got there through one of five models: social graph (your friend Nina liked it), subscription (you follow Bake Daily), community-curated (top-voted in a gardening community), group-based (new in your book club) and algorithmic (suggested for you). Panels 2 to 4 show the same feed over time. Back then, one post in five is suggested by the algorithm and the user says: my feed, my rules. After an update the recommender says it saw them finish every cat video, so house rules, it picks; three in five are suggested. Today four in five are suggested and Nina's post sits at the bottom; the user says they miss choosing what they see, then scrolls for one more. Takeaway: most feeds mix these models and keep handing more to the algorithm.</desc>
