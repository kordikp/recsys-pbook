<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb043-title pb043-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb043-title">The clerk who reads the room—and the label</title>
<desc id="pb043-desc">Four-panel comic. An author's first novel, Murder at the Bee Farm, has zero sales, so there is no purchase data to recommend it from. The clerk, beeFormer, explains that it read millions of descriptions and saw who loved each one. The back cover reads: sweet honey, a dead beekeeper. A topic matcher says it is about bees and sends it to beekeepers; beeFormer reads a whodunit and sends it to mystery fans: taste, not topic. A reader with zero reviews to go on finds it exactly her taste: the clerk read the back cover. beeFormer predicts who will like an item from its description, with no history needed; in the paper's test it never trained on books, yet recall on books rose 131%.</desc>
