<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb134-title pb134-desc">
<title id="pb134-title">Choosing a model: start simple, upgrade on evidence</title>
<desc id="pb134-desc">Model selection in three steps: a popularity baseline is the floor, a strong simple model such as item k-NN or EASE is the working baseline, and you upgrade only when a test shows the upgrade wins. Which upgrade to try depends on your hardest constraint: frequent new items or users point to hybrids or beeFormer, order-dependent behaviour to SASRec or BERT4Rec, a fast-changing catalog to contextual bandits, many feature types to DeepFM or DCN, and 100M+ items to two-tower retrieval with ANN search.</desc>
<defs><marker id="pb134-ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9CA3AF"/></marker><marker id="pb134-ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7C3AED"/></marker></defs>
<rect x=".5" y=".5" width="639" height="465" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Choosing a model: start simple, upgrade on evidence</text>
<rect x="20" y="64" width="172" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="44" cy="96.0" r="12" fill="#10B981"/>
<text x="44" y="101.0" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="64" y="92" font-size="15" font-weight="700" fill="#1E1B4B">Popularity</text>
<text x="64" y="112" font-size="14" fill="#4B5563">the floor to beat</text>
<line x1="196" y1="96.0" x2="212" y2="96.0" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pb134-ahg)"/>
<rect x="218" y="64" width="172" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="242" cy="96.0" r="12" fill="#10B981"/>
<text x="242" y="101.0" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="262" y="92" font-size="15" font-weight="700" fill="#1E1B4B">Simple model</text>
<text x="262" y="112" font-size="14" fill="#4B5563">k-NN or EASE</text>
<line x1="394" y1="96.0" x2="410" y2="96.0" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pb134-ahg)"/>
<rect x="416" y="64" width="204" height="64" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
<circle cx="440" cy="96.0" r="12" fill="#F59E0B"/>
<text x="440" y="101.0" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<text x="460" y="92" font-size="15" font-weight="700" fill="#1E1B4B">Upgrade if it wins</text>
<text x="460" y="112" font-size="14" fill="#92400E">tested against step 2</text>
<line x1="518" y1="132" x2="518" y2="150" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
<text x="20" y="168" font-size="14" font-weight="700" fill="#4B5563">If your hardest constraint is…</text>
<text x="518" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">…step 3 tries</text>
<rect x="20" y="180" width="346" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="38" cy="200" r="5" fill="#F59E0B"/>
<text x="54" y="205" font-size="15" fill="#1E1B4B">New items or users all the time</text>
<line x1="374" y1="200" x2="408" y2="200" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pb134-ahp)"/>
<rect x="416" y="180" width="204" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="518" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Hybrid · beeFormer</text>
<rect x="20" y="228" width="346" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="38" cy="248" r="5" fill="#F59E0B"/>
<text x="54" y="253" font-size="15" fill="#1E1B4B">Order matters: what comes next?</text>
<line x1="374" y1="248" x2="408" y2="248" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pb134-ahp)"/>
<rect x="416" y="228" width="204" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="518" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">SASRec · BERT4Rec</text>
<rect x="20" y="276" width="346" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="38" cy="296" r="5" fill="#F59E0B"/>
<text x="54" y="301" font-size="15" fill="#1E1B4B">Catalog churns, must explore</text>
<line x1="374" y1="296" x2="408" y2="296" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pb134-ahp)"/>
<rect x="416" y="276" width="204" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="518" y="301" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Contextual bandits</text>
<rect x="20" y="324" width="346" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="38" cy="344" r="5" fill="#F59E0B"/>
<text x="54" y="349" font-size="15" fill="#1E1B4B">Many kinds of features</text>
<line x1="374" y1="344" x2="408" y2="344" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pb134-ahp)"/>
<rect x="416" y="324" width="204" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="518" y="349" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">DeepFM · DCN</text>
<rect x="20" y="372" width="346" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="38" cy="392" r="5" fill="#F59E0B"/>
<text x="54" y="397" font-size="15" fill="#1E1B4B">100M+ items</text>
<line x1="374" y1="392" x2="408" y2="392" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pb134-ahp)"/>
<rect x="416" y="372" width="204" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="518" y="397" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Two-tower + ANN</text>
<text x="320" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">No test win, no upgrade: the <tspan fill="#065F46">simple model</tspan> stays.</text>
</svg>
