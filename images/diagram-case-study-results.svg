<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="598" height="328" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="300" y="26" text-anchor="middle" fill="#1E1B4B" font-size="14" font-weight="700">Measured Impact of Personalized Recommendations</text>

  <!-- Axes -->
  <line x1="90" y1="42" x2="90" y2="240" stroke="#1E1B4B" stroke-width="1.2"/>
  <line x1="90" y1="240" x2="575" y2="240" stroke="#1E1B4B" stroke-width="1.2"/>

  <!-- Y-axis label -->
  <text x="20" y="141" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600" transform="rotate(-90 20 141)">Improvement (%)</text>

  <!-- Grid and scale labels -->
  <line x1="90" y1="240" x2="575" y2="240" stroke="#E5E7EB" stroke-width="1"/>
  <text x="82" y="244" text-anchor="end" fill="#6B7280" font-size="11">0%</text>

  <line x1="90" y1="203" x2="575" y2="203" stroke="#E5E7EB" stroke-width="1"/>
  <text x="82" y="207" text-anchor="end" fill="#6B7280" font-size="11">50%</text>

  <line x1="90" y1="165" x2="575" y2="165" stroke="#E5E7EB" stroke-width="1"/>
  <text x="82" y="169" text-anchor="end" fill="#6B7280" font-size="11">100%</text>

  <line x1="90" y1="127" x2="575" y2="127" stroke="#E5E7EB" stroke-width="1"/>
  <text x="82" y="131" text-anchor="end" fill="#6B7280" font-size="11">150%</text>

  <line x1="90" y1="89" x2="575" y2="89" stroke="#E5E7EB" stroke-width="1"/>
  <text x="82" y="93" text-anchor="end" fill="#6B7280" font-size="11">200%</text>

  <!-- FTV Prima: +34% video views -->
  <rect x="110" y="214" width="55" height="26" rx="4" fill="#0EA5E9"/>
  <text x="137.5" y="209" text-anchor="middle" fill="#0EA5E9" font-size="11" font-weight="700">+34%</text>
  <text x="137.5" y="258" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">FTV Prima</text>
  <text x="137.5" y="274" text-anchor="middle" fill="#6B7280" font-size="11">video views</text>

  <!-- Audiomack: +206% plays -->
  <rect x="185" y="84" width="55" height="156" rx="4" fill="#10B981"/>
  <text x="212.5" y="79" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">+206%</text>
  <text x="212.5" y="258" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Audiomack</text>
  <text x="212.5" y="274" text-anchor="middle" fill="#6B7280" font-size="11">plays</text>

  <!-- Slickdeals: +70% CTR -->
  <rect x="260" y="187" width="55" height="53" rx="4" fill="#D97706"/>
  <text x="287.5" y="182" text-anchor="middle" fill="#D97706" font-size="11" font-weight="700">+70%</text>
  <text x="287.5" y="258" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Slickdeals</text>
  <text x="287.5" y="274" text-anchor="middle" fill="#6B7280" font-size="11">CTR</text>

  <!-- 9GAG: +37% views -->
  <rect x="335" y="212" width="55" height="28" rx="4" fill="#0EA5E9"/>
  <text x="362.5" y="207" text-anchor="middle" fill="#0EA5E9" font-size="11" font-weight="700">+37%</text>
  <text x="362.5" y="258" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">9GAG</text>
  <text x="362.5" y="274" text-anchor="middle" fill="#6B7280" font-size="11">views</text>

  <!-- Crexi: +40% buy actions -->
  <rect x="410" y="210" width="55" height="30" rx="4" fill="#7C3AED"/>
  <text x="437.5" y="205" text-anchor="middle" fill="#7C3AED" font-size="11" font-weight="700">+40%</text>
  <text x="437.5" y="258" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Crexi</text>
  <text x="437.5" y="274" text-anchor="middle" fill="#6B7280" font-size="11">buy actions</text>

  <!-- itison: +2000% ROI with compressed scale -->
  <rect x="485" y="60" width="55" height="180" rx="4" fill="#D97706"/>
  <text x="512.5" y="54" text-anchor="middle" fill="#D97706" font-size="11" font-weight="700">+2000%</text>

  <!-- Clean scale-break marker -->
  <path d="M485 77 L490 73 L495 81 L500 73 L505 81 L510 73 L515 81 L520 73 L525 81 L530 73 L535 81 L540 77"
        fill="none" stroke="#FAFAF7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="512.5" y="105" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">scale</text>
  <text x="512.5" y="120" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">break</text>
  <text x="512.5" y="258" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">itison</text>
  <text x="512.5" y="274" text-anchor="middle" fill="#6B7280" font-size="11">ROI</text>

  <!-- Legend -->
  <rect x="70" y="290" width="500" height="28" rx="7" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <circle cx="86" cy="304" r="5" fill="#0EA5E9"/>
  <text x="95" y="308" fill="#6B7280" font-size="11">Video</text>

  <circle cx="151" cy="304" r="5" fill="#10B981"/>
  <text x="160" y="308" fill="#6B7280" font-size="11">Music</text>

  <circle cx="216" cy="304" r="5" fill="#D97706"/>
  <text x="225" y="308" fill="#6B7280" font-size="11">Deals</text>

  <circle cx="280" cy="304" r="5" fill="#0EA5E9"/>
  <text x="289" y="308" fill="#6B7280" font-size="11">Social</text>

  <circle cx="349" cy="304" r="5" fill="#7C3AED"/>
  <text x="358" y="308" fill="#6B7280" font-size="11">Real estate</text>

  <circle cx="456" cy="304" r="5" fill="#D97706"/>
  <text x="465" y="308" fill="#6B7280" font-size="11">Deals (ROI)</text>
</svg>