<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb115-title pb115-desc">
  <title id="pb115-title">Five production systems, the same three lessons</title>
  <desc id="pb115-desc">Spotify, YouTube, Netflix, The Daily Telegraph and Recombee work in different domains, yet they keep teaching the same three lessons: stage the work from a huge catalog down to a ranked handful, optimise long-term engagement rather than clicks, and keep testing, because the system is never finished. The algorithms are well known; the edge is the engineering around them.</desc>
  <defs>
    <marker id="pb115-head-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#9CA3AF"/>
    </marker>
    <marker id="pb115-head-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#7C3AED"/>
    </marker>
    <marker id="pb115-head-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="439" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <text x="320" y="38" text-anchor="middle" fill="#1E1B4B" font-size="19" font-weight="700">Five production systems, the same three lessons</text>

  <!-- Five systems -->
  <g font-size="15" text-anchor="middle">
    <rect x="22" y="58" width="112" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="78" y="78" fill="#1E1B4B" font-weight="700">Spotify</text>
    <text x="78" y="97" fill="#4B5563" font-size="14">music</text>

    <rect x="143" y="58" width="112" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="199" y="78" fill="#1E1B4B" font-weight="700">YouTube</text>
    <text x="199" y="97" fill="#4B5563" font-size="14">video</text>

    <rect x="264" y="58" width="112" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="320" y="78" fill="#1E1B4B" font-weight="700">Netflix</text>
    <text x="320" y="97" fill="#4B5563" font-size="14">film &amp; TV</text>

    <rect x="385" y="58" width="112" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="441" y="78" fill="#1E1B4B" font-weight="700">Telegraph</text>
    <text x="441" y="97" fill="#4B5563" font-size="14">news</text>

    <rect x="506" y="58" width="112" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="562" y="78" fill="#1E1B4B" font-weight="700">Recombee</text>
    <text x="562" y="97" fill="#4B5563" font-size="14">many domains</text>
  </g>

  <!-- Converging comb: systems -> lessons -->
  <g fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round">
    <path d="M78 106 V124 M199 106 V124 M320 106 V124 M441 106 V124 M562 106 V124 M78 124 H562"/>
    <path d="M116 124 V146" marker-end="url(#pb115-head-grey)"/>
    <path d="M320 124 V146" marker-end="url(#pb115-head-grey)"/>
    <path d="M524 124 V146" marker-end="url(#pb115-head-grey)"/>
  </g>

  <!-- Lesson cards -->
  <g>
    <rect x="22" y="152" width="188" height="224" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="226" y="152" width="188" height="224" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="430" y="152" width="188" height="224" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

    <g font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="46" cy="178" r="12" fill="#1E1B4B"/><text x="46" y="183">1</text>
      <circle cx="250" cy="178" r="12" fill="#1E1B4B"/><text x="250" y="183">2</text>
      <circle cx="454" cy="178" r="12" fill="#1E1B4B"/><text x="454" y="183">3</text>
    </g>
    <g font-size="16" font-weight="700" fill="#1E1B4B">
      <text x="66" y="184">Stage the work</text>
      <text x="270" y="184">Choose the goal</text>
      <text x="474" y="184">Keep testing</text>
    </g>
  </g>

  <!-- Card 1: funnel -->
  <g font-size="14" text-anchor="middle">
    <rect x="32" y="202" width="168" height="28" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="116" y="221" fill="#4C1D95">100s of millions</text>
    <path d="M116 232 V244" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pb115-head-purple)"/>
    <rect x="42" y="248" width="148" height="28" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="116" y="267" fill="#4C1D95">~1,000 candidates</text>
    <path d="M116 278 V290" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pb115-head-purple)"/>
    <rect x="52" y="294" width="128" height="28" rx="7" fill="#7C3AED"/>
    <text x="116" y="313" fill="#FFFFFF" font-weight="700">ranked handful</text>
  </g>

  <!-- Card 2: clicks vs watch time -->
  <g font-size="15" text-anchor="middle">
    <rect x="250" y="202" width="140" height="30" rx="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="320" y="222" fill="#92400E" font-weight="700">✗ clicks</text>
    <line x1="305" y1="217" x2="353" y2="217" stroke="#92400E" stroke-width="1.5"/>
    <text x="320" y="252" fill="#92400E" font-size="14">clickbait wins</text>
    <path d="M320 260 V274" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pb115-head-grey)"/>
    <rect x="250" y="280" width="140" height="30" rx="15" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="320" y="300" fill="#065F46" font-weight="700">✓ watch time</text>
    <text x="320" y="330" fill="#065F46" font-size="14">people stay</text>
  </g>

  <!-- Card 3: loop -->
  <g>
    <circle cx="524" cy="262" r="44" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M562 240 A44 44 0 0 1 566 250" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb115-head-amber)"/>
    <path d="M482.7 247 A44 44 0 0 1 488 236.8" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb115-head-amber)"/>
    <path d="M534 305 A44 44 0 0 1 522 306" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb115-head-amber)"/>
    <g font-size="14" text-anchor="middle" fill="#92400E" font-weight="700">
      <rect x="499" y="206" width="50" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="524" y="223">test</text>
      <rect x="536" y="272" width="56" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="564" y="289">learn</text>
      <rect x="458" y="272" width="54" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="485" y="289">ship</text>
    </g>
    <text x="524" y="267" text-anchor="middle" fill="#4B5563" font-size="14">repeat</text>
    <text x="524" y="330" text-anchor="middle" fill="#92400E" font-size="14">new playlist each Monday</text>
  </g>

  <!-- Card footers: where the text shows it -->
  <g font-size="14" fill="#4B5563" text-anchor="middle">
    <line x1="38" y1="344" x2="194" y2="344" stroke="#E5E7EB" stroke-width="1.5"/>
    <line x1="242" y1="344" x2="398" y2="344" stroke="#E5E7EB" stroke-width="1.5"/>
    <line x1="446" y1="344" x2="602" y2="344" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="116" y="365">e.g. YouTube</text>
    <text x="320" y="365">e.g. YouTube</text>
    <text x="524" y="365">e.g. Spotify, Netflix</text>
  </g>

  <text x="320" y="412" text-anchor="middle" fill="#1E1B4B" font-size="15">The algorithms are well known. <tspan font-weight="700" fill="#4C1D95">The edge is the engineering around them.</tspan></text>
</svg>
