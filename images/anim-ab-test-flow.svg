<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .flow{stroke-dasharray:6 6;animation:f 1.2s linear infinite}
    @keyframes f{to{stroke-dashoffset:-12}}
    .pulseA{animation:pa 3s ease-in-out infinite}
    .pulseB{animation:pb 3s ease-in-out infinite}
    @keyframes pa{0%,45%,100%{opacity:1}55%,90%{opacity:.55}}
    @keyframes pb{0%,45%,100%{opacity:.55}55%,90%{opacity:1}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">A/B Test: One Question, Two Realities</text>

  <!-- users in -->
  <g fill="#6B7280" font-size="12">
    <circle cx="80" cy="180" r="13" fill="#E5E7EB" stroke="#9CA3AF"/><text x="80" y="185" text-anchor="middle" fill="#1E1B4B">👤</text>
    <circle cx="80" cy="215" r="13" fill="#E5E7EB" stroke="#9CA3AF"/><text x="80" y="220" text-anchor="middle" fill="#1E1B4B">👤</text>
    <circle cx="80" cy="250" r="13" fill="#E5E7EB" stroke="#9CA3AF"/><text x="80" y="255" text-anchor="middle" fill="#1E1B4B">👤</text>
    <text x="80" y="290" text-anchor="middle">all users</text>
  </g>

  <!-- randomizer -->
  <rect x="150" y="185" width="120" height="58" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="210" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">RANDOM</text>
  <text x="210" y="228" text-anchor="middle" font-size="12" fill="#6B7280">coin flip 50/50</text>
  <line class="flow" x1="100" y1="214" x2="148" y2="214" stroke="#9CA3AF" stroke-width="2"/>

  <!-- branch A -->
  <path class="flow" d="M272 200 C320 170 340 140 380 128" fill="none" stroke="#10B981" stroke-width="2"/>
  <g class="pulseA">
    <rect x="384" y="92" width="220" height="72" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="494" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Group A · old ranker</text>
    <text x="494" y="140" text-anchor="middle" font-size="12" fill="#065F46">sees recommendations as before</text>
    <text x="640" y="122" font-size="13" fill="#065F46">CTR</text>
    <rect x="640" y="130" width="90" height="10" rx="5" fill="#E5E7EB"/>
    <rect x="640" y="130" width="58" height="10" rx="5" fill="#10B981"/>
    <text x="740" y="140" font-size="12" fill="#065F46">5.8%</text>
  </g>

  <!-- branch B -->
  <path class="flow" d="M272 228 C320 258 340 288 380 300" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <g class="pulseB">
    <rect x="384" y="264" width="220" height="72" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="494" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Group B · new ranker</text>
    <text x="494" y="312" text-anchor="middle" font-size="12" fill="#4C1D95">sees the candidate change</text>
    <text x="640" y="294" font-size="13" fill="#4C1D95">CTR</text>
    <rect x="640" y="302" width="90" height="10" rx="5" fill="#E5E7EB"/>
    <rect x="640" y="302" width="72" height="10" rx="5" fill="#7C3AED"/>
    <text x="740" y="312" font-size="12" fill="#4C1D95">7.2%</text>
  </g>

  <text x="400" y="398" text-anchor="middle" font-size="13" fill="#6B7280">Same time, same world — the only difference is the ranker. The metric gap is the causal effect.</text>
</svg>
