    .pb000-draw{stroke-dasharray:100 100;stroke-dashoffset:0;animation:pb000-draw 10s linear infinite}
    @keyframes pb000-draw{0%{stroke-dashoffset:100}45%,100%{stroke-dashoffset:0}}
    .pb000-ring{opacity:0;animation:pb000-ring 10s ease-out infinite}
    @keyframes pb000-ring{0%{opacity:0}2%{opacity:1}10%,100%{opacity:0}}
    .pb000-halo{opacity:0;animation:pb000-halo 10s ease-out infinite}
    @keyframes pb000-halo{0%{opacity:0}3%{opacity:1}22%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.pb000-draw,.pb000-ring,.pb000-halo{animation:none !important}}
  </style>
