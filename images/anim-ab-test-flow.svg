<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" role="img" aria-labelledby="pb000-title pb000-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb000-title">Peeking: an A/B test “win” on day 2 that was luck</title>
  <desc id="pb000-desc">A toy A/B test where the new ranker B is truly no better than A. B's measured lift wobbles inside a grey noise band that narrows as users accumulate. Checked every day, it pokes above the band on day 2 (+3% CTR, p = 0.04) and tempts the team to ship; at the planned end on day 14 it shows no real difference. Peeking and stopping at the first good-looking result raises the chance of a false win from 5% to 20–30%, so fix the end date before you start.</desc>
