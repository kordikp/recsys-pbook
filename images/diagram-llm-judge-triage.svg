<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn05-title pn05-desc">
<title id="pn05-title">LLM judge as a fast filter in front of human and A/B checks</title>
<desc id="pn05-desc">Three prompts write the “why we picked this” line for a streaming app. An LLM judge grades them in hours and cheaply, but it is biased by answer order, length, its own model’s writing and popular items, so it only cuts the clear loser. The two survivors must pass a human check (does the judge agree with editors on a labeled sample, with order swapped), and then an A/B test with real users, which takes weeks, decides which one ships. Simulated users run in a separate side lane to stress-test the chat: they are too agreeable and too mainstream, so they get no vote on what ships.</desc>
