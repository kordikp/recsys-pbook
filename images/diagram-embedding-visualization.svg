<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="pb121-title pb121-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb121-title">Reading a 2D map of item embeddings</title>
<desc id="pb121-desc">Each movie's 128-number embedding is projected to a 2D map with PCA, t-SNE or UMAP. On the map, look for clusters of the same genre, transition zones where one genre blends into another, and outliers worth checking. Trust who sits next to whom; t-SNE distorts the gaps and sizes between clusters, while UMAP keeps the overall layout more faithfully. Toy example.</desc>
