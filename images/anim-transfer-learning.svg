<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .pkt{animation:p 4.5s linear infinite;offset-path:path('M235 190 C320 120 480 120 565 190')}
    @keyframes p{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Transfer Learning: Taste Travels Through Text</text>

  <g text-anchor="middle" font-size="12.5">
    <rect x="65" y="150" width="170" height="170" rx="12" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2.5"/>
    <text x="150" y="180" font-size="15" font-weight="800" fill="#075985">MOVIES</text>
    <text x="150" y="204" fill="#075985">rich history:</text>
    <text x="150" y="222" fill="#075985">sci-fi · thrillers · docu</text>
    <text x="150" y="256" font-size="24">🎬</text>
    <text x="150" y="296" fill="#6B7280">source domain</text>

    <rect x="565" y="150" width="170" height="170" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2.5"/>
    <text x="650" y="180" font-size="15" font-weight="800" fill="#065F46">BOOKS</text>
    <text x="650" y="204" fill="#065F46">zero history here —</text>
    <text x="650" y="222" fill="#065F46">but taste carries over</text>
    <text x="650" y="256" font-size="24">📚</text>
    <text x="650" y="296" fill="#6B7280">target domain</text>
  </g>

  <path d="M235 190 C320 120 480 120 565 190" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 6"/>
  <g class="pkt"><rect x="-38" y="-14" width="76" height="28" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text y="5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4C1D95">"sci-fi"</text></g>
  <rect x="318" y="208" width="164" height="58" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="400" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="#4C1D95">shared TEXT space</text>
  <text x="400" y="252" text-anchor="middle" font-size="11.5" fill="#6B7280">one embedding for both worlds</text>

  <text x="400" y="360" text-anchor="middle" font-size="13" fill="#6B7280">IDs don't transfer — language does. Describe items in words and a movie lover's vector already lives near the right books.</text>
</svg>
