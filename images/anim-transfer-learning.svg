<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb033-title pb033-desc">
  <title id="pb033-title">Taste learned on movies, reused on books</title>
  <desc id="pb033-desc">One text reader (for example beeFormer) serves two shops. In a movie app with years of clicks it reads each movie's description while real viewers teach it which words bring which fans: fast-paced action draws thrill-seekers, character-driven drama draws drama lovers. In a new book shop with zero reads, the same reader takes book descriptions with the same kinds of words and predicts the same audiences. Item IDs stay in their own app; descriptions exist everywhere, so the learned taste travels.</desc>
  <style>
    .pb033-dot{opacity:0}
    .pb033-in1{animation:pb033-in1 8s ease-in-out infinite}
    .pb033-back1{animation:pb033-back1 8s ease-in-out infinite}
    .pb033-in2{animation:pb033-in2 8s ease-in-out infinite}
    .pb033-out2{animation:pb033-out2 8s ease-in-out infinite}
    .pb033-pred{animation:pb033-pred 8s ease-out infinite}
    @keyframes pb033-in1{0%{opacity:0;transform:translateX(0)}3%{opacity:1}18%{opacity:1;transform:translateX(74px)}21%,100%{opacity:0;transform:translateX(74px)}}
    @keyframes pb033-back1{0%{opacity:0;transform:translateX(0)}3%{opacity:1}18%{opacity:1;transform:translateX(-72px)}21%,100%{opacity:0;transform:translateX(-72px)}}
    @keyframes pb033-in2{0%,24%{opacity:0;transform:translateX(0)}27%{opacity:1}38%{opacity:1;transform:translateX(82px)}40%,100%{opacity:0;transform:translateX(82px)}}
    @keyframes pb033-out2{0%,38%{opacity:0;transform:translateX(0)}40%{opacity:1}48%{opacity:1;transform:translateX(78px)}51%,100%{opacity:0;transform:translateX(78px)}}
    @keyframes pb033-pred{0%,44%{opacity:.18}50%,100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.pb033-in1,.pb033-back1,.pb033-in2,.pb033-out2,.pb033-pred{animation:none !important}}
  </style>
  <defs>
    <marker id="pb033-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="pb033-ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
    <marker id="pb033-an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="395" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Taste learned on movies, reused on books</text>

  <!-- column headers -->
  <g font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle">
    <text x="148" y="70">item description</text>
    <text x="354" y="70">text reader, e.g. beeFormer</text>
    <text x="523" y="70">who likes it</text>
  </g>

  <!-- ===== band 1: movie app, learning ===== -->
  <rect x="16" y="82" width="608" height="124" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="107" font-size="15" font-weight="700" fill="#1E1B4B">1 · Movie app <tspan font-weight="400" fill="#4B5563">· years of clicks</tspan></text>
  <text x="438" y="107" font-size="14" font-weight="600" fill="#065F46">real viewers teach it</text>

  <rect x="32" y="126" width="232" height="30" rx="15" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="146" font-size="15">🎬</text>
  <text x="70" y="146" font-size="15" fill="#4B5563"><tspan font-weight="700" fill="#1E1B4B">fast-paced</tspan> action</text>
  <rect x="32" y="166" width="232" height="30" rx="15" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="186" font-size="15">🎬</text>
  <text x="70" y="186" font-size="15" fill="#4B5563"><tspan font-weight="700" fill="#1E1B4B">character-driven</tspan> drama</text>

  <!-- real viewers (solid) -->
  <g fill="#10B981">
    <circle cx="452" cy="135" r="5.5"/><path d="M444,150 Q444,141 452,141 Q460,141 460,150 Z"/>
    <circle cx="470" cy="135" r="5.5"/><path d="M462,150 Q462,141 470,141 Q478,141 478,150 Z"/>
    <circle cx="452" cy="175" r="5.5"/><path d="M444,190 Q444,181 452,181 Q460,181 460,190 Z"/>
    <circle cx="470" cy="175" r="5.5"/><path d="M462,190 Q462,181 470,181 Q478,181 478,190 Z"/>
  </g>
  <text x="488" y="146" font-size="15" fill="#1E1B4B">thrill-seekers</text>
  <text x="488" y="186" font-size="15" fill="#1E1B4B">drama lovers</text>

  <!-- arrows band 1: description in, real viewers feed back -->
  <g stroke-width="2.5" stroke-linecap="round">
    <line x1="270" y1="141" x2="298" y2="141" stroke="#6B7280" marker-end="url(#pb033-ag)"/>
    <line x1="270" y1="181" x2="298" y2="181" stroke="#6B7280" marker-end="url(#pb033-ag)"/>
    <line x1="436" y1="141" x2="410" y2="141" stroke="#10B981" marker-end="url(#pb033-an)"/>
    <line x1="436" y1="181" x2="410" y2="181" stroke="#10B981" marker-end="url(#pb033-an)"/>
  </g>

  <!-- ===== band 2: book shop, using ===== -->
  <rect x="16" y="222" width="608" height="124" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="247" font-size="15" font-weight="700" fill="#1E1B4B">2 · New book shop <tspan font-weight="400" fill="#4B5563">· 0 reads so far</tspan></text>
  <text x="438" y="247" font-size="14" font-weight="600" fill="#4C1D95">predicted from words</text>

  <rect x="32" y="266" width="232" height="30" rx="15" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="286" font-size="15">📚</text>
  <text x="70" y="286" font-size="15" fill="#4B5563"><tspan font-weight="700" fill="#1E1B4B">fast-paced</tspan> thriller</text>
  <rect x="32" y="306" width="232" height="30" rx="15" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="326" font-size="15">📚</text>
  <text x="70" y="326" font-size="15" fill="#4B5563"><tspan font-weight="700" fill="#1E1B4B">character-driven</tspan> novel</text>

  <g stroke-width="2.5" stroke-linecap="round">
    <line x1="270" y1="281" x2="298" y2="281" stroke="#6B7280" marker-end="url(#pb033-ag)"/>
    <line x1="270" y1="321" x2="298" y2="321" stroke="#6B7280" marker-end="url(#pb033-ag)"/>
    <line x1="410" y1="281" x2="434" y2="281" stroke="#7C3AED" marker-end="url(#pb033-ap)"/>
    <line x1="410" y1="321" x2="434" y2="321" stroke="#7C3AED" marker-end="url(#pb033-ap)"/>
  </g>

  <!-- predicted audiences (dashed people) -->
  <g class="pb033-pred">
    <g fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 2">
      <circle cx="452" cy="275" r="5.5"/><path d="M444,290 Q444,281 452,281 Q460,281 460,290 Z"/>
      <circle cx="470" cy="275" r="5.5"/><path d="M462,290 Q462,281 470,281 Q478,281 478,290 Z"/>
      <circle cx="452" cy="315" r="5.5"/><path d="M444,330 Q444,321 452,321 Q460,321 460,330 Z"/>
      <circle cx="470" cy="315" r="5.5"/><path d="M462,330 Q462,321 470,321 Q478,321 478,330 Z"/>
    </g>
    <text x="488" y="286" font-size="15" fill="#1E1B4B">thrill-seekers</text>
    <text x="488" y="326" font-size="15" fill="#1E1B4B">drama lovers</text>
  </g>

  <!-- ===== the one text reader spanning both shops ===== -->
  <rect x="304" y="120" width="100" height="222" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <line x1="354" y1="198.0" x2="354" y2="208.0" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="354" cy="196.0" r="4" fill="#7C3AED"/>
  <rect x="330" y="208.0" width="48" height="38" rx="11" fill="#7C3AED"/>
  <g stroke="#FFFFFF" stroke-width="2" fill="none">
    <circle cx="344" cy="223.0" r="6.5"/>
    <circle cx="364" cy="223.0" r="6.5"/>
    <line x1="350.5" y1="223.0" x2="357.5" y2="223.0"/>
  </g>
  <circle cx="344" cy="223.0" r="2.5" fill="#FFFFFF"/>
  <circle cx="364" cy="223.0" r="2.5" fill="#FFFFFF"/>
  <path d="M347,236 Q354,241 361,236" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="354" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#4C1D95">one model</text>

  <!-- moving signals: words and real viewers meet in the reader; then words in, audience out -->
  <g stroke="#FFFFFF" stroke-width="2">
    <circle class="pb033-dot pb033-in1" cx="272" cy="141" r="6" fill="#6B7280"/>
    <circle class="pb033-dot pb033-in1" cx="272" cy="181" r="6" fill="#6B7280"/>
    <circle class="pb033-dot pb033-back1" cx="434" cy="141" r="6" fill="#10B981"/>
    <circle class="pb033-dot pb033-back1" cx="434" cy="181" r="6" fill="#10B981"/>
    <circle class="pb033-dot pb033-in2" cx="272" cy="281" r="6" fill="#6B7280"/>
    <circle class="pb033-dot pb033-in2" cx="272" cy="321" r="6" fill="#6B7280"/>
    <circle class="pb033-dot pb033-out2" cx="354" cy="281" r="6" fill="#7C3AED"/>
    <circle class="pb033-dot pb033-out2" cx="354" cy="321" r="6" fill="#7C3AED"/>
  </g>

  <text x="320" y="376" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">IDs stay in their app. <tspan fill="#4C1D95">Descriptions exist everywhere</tspan>, so taste travels.</text>
</svg>
