<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .p1{stroke-dasharray:520;stroke-dashoffset:520;animation:d1 6s linear infinite}
    @keyframes d1{20%{stroke-dashoffset:520}90%,100%{stroke-dashoffset:0}}
    .p2{stroke-dasharray:520;stroke-dashoffset:520;animation:d2 6s linear infinite}
    @keyframes d2{5%{stroke-dashoffset:520}45%,100%{stroke-dashoffset:0}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Build vs. Buy: Time to Value</text>

  <g stroke="#9CA3AF" stroke-width="1.5">
    <line x1="90" y1="320" x2="740" y2="320"/><line x1="90" y1="320" x2="90" y2="80"/>
  </g>
  <text x="415" y="348" text-anchor="middle" font-size="12" fill="#6B7280">time →</text>
  <text x="74" y="200" text-anchor="middle" font-size="12" fill="#6B7280" transform="rotate(-90 74 200)">value delivered</text>

  <path class="p2" d="M90 318 C150 240 200 165 340 140 C480 116 600 110 730 108" fill="none" stroke="#10B981" stroke-width="3.5"/>
  <path class="p1" d="M90 319 C220 316 300 310 400 270 C520 222 640 150 730 96" fill="none" stroke="#7C3AED" stroke-width="3.5"/>

  <g font-size="13">
    <rect x="150" y="120" width="205" height="46" rx="9" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="252" y="139" text-anchor="middle" font-weight="800" fill="#065F46">BUY (SaaS API)</text>
    <text x="252" y="157" text-anchor="middle" font-size="11.5" fill="#065F46">weeks to live · ceiling later</text>
    <rect x="470" y="240" width="230" height="46" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="585" y="259" text-anchor="middle" font-weight="800" fill="#4C1D95">BUILD (own stack)</text>
    <text x="585" y="277" text-anchor="middle" font-size="11.5" fill="#4C1D95">quarters to live · full control</text>
  </g>
  <line x1="330" y1="80" x2="330" y2="320" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="330" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">crossover: does it ever come?</text>

  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">The honest question isn't "can we build it" — it's whether ranking is your differentiator or your plumbing.</text>
</svg>
