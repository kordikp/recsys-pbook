<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 498" role="img" aria-labelledby="pn07-title pn07-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pn07-title">North star and guardrails: which version ships?</title>
<desc id="pn07-desc">Two A/B test results compared with today's recommender. Version A raises the north-star metric a little and all three guardrails (diversity, complaints, speed) stay inside their margins, so it ships. Version B raises the north star a lot, but diversity falls past its margin, so it is blocked. A change ships only if the north star improves and every guardrail holds.</desc>
<defs>
<pattern id="pn07-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#D1D5DB" stroke-width="2"/></pattern>
<pattern id="pn07-hatch-red" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#FCA5A5" stroke-width="2"/></pattern>
</defs>
<rect x=".5" y=".5" width="639" height="497" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Two test results. Which one ships?</text>
<text x="320" y="61" text-anchor="middle" font-size="14" fill="#6B7280">North star here: e.g. members still subscribed next month</text>
<g id="pn07-panel-a">
<rect x="20" y="78" width="290" height="366" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="36" y="92" width="100" height="28" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="86" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Version A</text>
<text x="36" y="164" font-size="16" font-weight="700" fill="#1E1B4B"><tspan fill="#10B981">★</tspan> North star</text>
<text x="36" y="186" font-size="15" fill="#4B5563">up a little</text>
<rect x="206" y="170" width="36" height="44" rx="3" fill="#D1D5DB"/>
<rect x="256" y="156" width="36" height="58" rx="3" fill="#10B981"/>
<line x1="200" y1="170" x2="298" y2="170" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="196" y1="214" x2="298" y2="214" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="224" y="234" text-anchor="middle" font-size="14" fill="#4B5563">today</text>
<text x="274" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">A</text>
<line x1="36" y1="248" x2="294" y2="248" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="36" y="272" font-size="14" font-weight="700" fill="#4B5563">Guardrails</text>
<text x="148" y="272" text-anchor="middle" font-size="14" fill="#4B5563">today</text>
<text x="206" y="272" text-anchor="middle" font-size="14" fill="#4B5563">margin</text>
<text x="294" y="379" text-anchor="end" font-size="14" fill="#4B5563">worse →</text>
<text x="36" y="301" font-size="15" fill="#1E1B4B">Diversity</text>
<rect x="206" y="287" width="88" height="18" fill="url(#pn07-hatch)"/>
<line x1="124" y1="296" x2="294" y2="296" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
<line x1="148" y1="287" x2="148" y2="305" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
<line x1="206" y1="286" x2="206" y2="306" stroke="#6B7280" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="166" cy="296" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
<text x="36" y="329" font-size="15" fill="#1E1B4B">Complaints</text>
<rect x="206" y="315" width="88" height="18" fill="url(#pn07-hatch)"/>
<line x1="124" y1="324" x2="294" y2="324" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
<line x1="148" y1="315" x2="148" y2="333" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
<line x1="206" y1="314" x2="206" y2="334" stroke="#6B7280" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="182" cy="324" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
<text x="36" y="357" font-size="15" fill="#1E1B4B">Speed</text>
<rect x="206" y="343" width="88" height="18" fill="url(#pn07-hatch)"/>
<line x1="124" y1="352" x2="294" y2="352" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
<line x1="148" y1="343" x2="148" y2="361" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
<line x1="206" y1="342" x2="206" y2="362" stroke="#6B7280" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="160" cy="352" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
<rect x="36" y="388" width="258" height="42" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
<text x="50" y="415" font-size="18" font-weight="800" fill="#065F46">✓ SHIP</text>
<text x="282" y="414" text-anchor="end" font-size="14" fill="#065F46">every guardrail holds</text>
</g>
<g id="pn07-panel-b">
<rect x="330" y="78" width="290" height="366" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="346" y="92" width="100" height="28" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="396" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Version B</text>
<text x="346" y="164" font-size="16" font-weight="700" fill="#1E1B4B"><tspan fill="#10B981">★</tspan> North star</text>
<text x="346" y="186" font-size="15" fill="#4B5563">up a lot</text>
<rect x="516" y="170" width="36" height="44" rx="3" fill="#D1D5DB"/>
<rect x="566" y="120" width="36" height="94" rx="3" fill="#10B981"/>
<line x1="510" y1="170" x2="608" y2="170" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="506" y1="214" x2="608" y2="214" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="534" y="234" text-anchor="middle" font-size="14" fill="#4B5563">today</text>
<text x="584" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">B</text>
<line x1="346" y1="248" x2="604" y2="248" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="346" y="272" font-size="14" font-weight="700" fill="#4B5563">Guardrails</text>
<text x="458" y="272" text-anchor="middle" font-size="14" fill="#4B5563">today</text>
<text x="516" y="272" text-anchor="middle" font-size="14" fill="#4B5563">margin</text>
<text x="604" y="379" text-anchor="end" font-size="14" fill="#4B5563">worse →</text>
<rect x="338" y="283" width="274" height="26" rx="6" fill="#FEE2E2"/><text x="346" y="301" font-size="15" font-weight="700" fill="#991B1B">Diversity</text>
<rect x="516" y="287" width="88" height="18" fill="url(#pn07-hatch-red)"/>
<line x1="434" y1="296" x2="604" y2="296" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
<line x1="458" y1="287" x2="458" y2="305" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
<line x1="516" y1="286" x2="516" y2="306" stroke="#DC2626" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="562" cy="296" r="7" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
<text x="346" y="329" font-size="15" fill="#1E1B4B">Complaints</text>
<rect x="516" y="315" width="88" height="18" fill="url(#pn07-hatch)"/>
<line x1="434" y1="324" x2="604" y2="324" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
<line x1="458" y1="315" x2="458" y2="333" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
<line x1="516" y1="314" x2="516" y2="334" stroke="#6B7280" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="474" cy="324" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
<text x="346" y="357" font-size="15" fill="#1E1B4B">Speed</text>
<rect x="516" y="343" width="88" height="18" fill="url(#pn07-hatch)"/>
<line x1="434" y1="352" x2="604" y2="352" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
<line x1="458" y1="343" x2="458" y2="361" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
<line x1="516" y1="342" x2="516" y2="362" stroke="#6B7280" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="488" cy="352" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
<rect x="346" y="388" width="258" height="42" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="360" y="415" font-size="18" font-weight="800" fill="#991B1B">✕ BLOCKED</text>
<text x="592" y="414" text-anchor="end" font-size="14" fill="#991B1B">guardrail broken</text>
</g>
<text x="320" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">A bigger <tspan fill="#065F46">north-star</tspan> gain can't outvote a <tspan fill="#991B1B">broken guardrail</tspan>.</text>
</svg>
