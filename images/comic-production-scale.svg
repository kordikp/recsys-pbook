<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The Lunch Rush Has a Memory Budget</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="42" y="92" width="105" height="132" rx="7" fill="#FEF3C7" stroke="#D97706"/>
  <path d="M42 132H147 M42 174H147" fill="none" stroke="#D97706" stroke-width="2"/>
  <text x="94.5" y="114" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="middle">307 GB PANTRY</text>
  <rect x="172" y="84" width="194" height="56" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="269" y="107" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="269" y="107">10⁹ orders every day</tspan>
    <tspan x="269" y="127">20 ms to plate them</tspan>
  </text>
  <circle cx="215" cy="171" r="10" fill="#7C3AED"/>
  <path d="M215 182V216 M215 190L196 202 M215 190L231 201 M215 216L203 236 M215 216L227 236" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="310" cy="171" r="10" fill="#10B981"/>
  <path d="M310 182V216 M310 190L292 200 M310 190L329 195 M310 216L298 236 M310 216L322 236" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">A billion lunch orders meet a 20 ms patience budget.</text>

  <!-- Panel 2 -->
  <rect x="430" y="102" width="94" height="122" rx="7" fill="#D1FAE5" stroke="#10B981"/>
  <text x="477" y="137" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="477" y="137">SHARED BASES</tspan>
    <tspan x="477" y="160">26 GB</tspan>
  </text>
  <rect x="558" y="102" width="128" height="78" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="622" y="128" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="622" y="128">SPARSE CODE</tspan>
    <tspan x="622" y="151">2 · 0 · 0 · 7</tspan>
  </text>
  <path d="M531 143H550 M544 137L550 143L544 149" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="570" cy="211" r="10" fill="#7C3AED"/>
  <path d="M570 222V248 M570 230L552 218 M570 230L588 218 M570 248L560 264 M570 248L580 264" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="720" cy="211" r="10" fill="#10B981"/>
  <path d="M720 222V248 M720 230L701 219 M720 230L738 219 M720 248L710 264 M720 248L730 264" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">CompresSAE makes 307 GB into 26 GB; CTR slips only 1.35%.</text>

  <!-- Panel 3 -->
  <text x="130" y="407" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="82" y="407">DENSE</tspan>
    <tspan x="178" y="407">SPARSE ELSA</tspan>
  </text>
  <circle cx="82" cy="472" r="35" fill="#FEF3C7" stroke="#D97706"/>
  <circle cx="178" cy="472" r="35" fill="#D1FAE5" stroke="#10B981"/>
  <path d="M65 456h6v6h-6z M82 449h6v6h-6z M98 458h6v6h-6z M70 475h6v6h-6z M91 478h6v6h-6z M78 491h6v6h-6z M99 490h6v6h-6z M164 459h7v7h-7z M181 474h7v7h-7z M166 488h7v7h-7z" fill="#D97706"/>
  <circle cx="225" cy="472" r="10" fill="#10B981"/>
  <path d="M225 483V517 M225 491L207 483 M225 491L244 476 M225 517L213 537 M225 517L237 537" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="247" y="397" width="126" height="54" rx="9" fill="#FFFFFF" stroke="#10B981"/>
  <text x="310" y="420" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="310" y="420">Sparse one.</tspan>
    <tspan x="310" y="439">Slightly better.</tspan>
  </text>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Leaving most spices out regularizes the recipe.</text>

  <!-- Panel 4 -->
  <rect x="440" y="405" width="95" height="128" rx="7" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="487.5" y="434" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <tspan x="487.5" y="434">26 GB</tspan>
    <tspan x="487.5" y="458">Σ sparse</tspan>
    <tspan x="487.5" y="482">bases</tspan>
  </text>
  <path d="M758 492H548 M564 484L548 492L564 500" fill="none" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
  <text x="680" y="479" font-size="12.5" font-weight="700" fill="#0EA5E9" text-anchor="middle">10⁹ orders/day</text>
  <circle cx="670" cy="516" r="10" fill="#10B981"/>
  <path d="M670 527V551 M670 535L651 528 M670 535L689 528 M670 551L660 565 M670 551L680 565" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="575" y="382" width="185" height="58" rx="9" fill="#FFFFFF" stroke="#10B981"/>
  <text x="667.5" y="406" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="667.5" y="406">Good.</tspan>
    <tspan x="667.5" y="426">The rush hates fragile recipes.</tspan>
  </text>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">At noon, mathematical elegance proves it can take the heat.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">CompresSAE reconstructs embeddings from sparse codes: 307 GB to 26 GB, with 1.35% CTR loss.</text>
</svg>