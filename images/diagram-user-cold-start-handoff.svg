<text x="212" y="46" font-size="15" font-weight="700" fill="#1E1B4B">Popular</text>
<text x="185" y="70" font-size="14" fill="#6B7280">in the segment</text>
<line x1="183" y1="82" x2="300" y2="82" stroke="#E5E7EB" stroke-width="1.5"/>
<line x1="313" y1="150" x2="327" y2="150" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pn02-arr)"/>
