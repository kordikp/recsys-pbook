<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn02-title pn02-desc">
<title id="pn02-title">User cold start: from the visit's context to the person's own clicks</title>
<desc id="pn02-desc">A first-time visitor arrives from a trail-shoe ad on a phone at 9 pm; the shop first shows what is popular in that segment, may ask one skippable question, and after the first click on a waterproof trail shoe shows items others also viewed plus a little variety; as interactions add up, the weight shifts from these defaults to the person's own clicks.</desc>
