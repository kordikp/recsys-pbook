<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 632" role="img" aria-labelledby="pb038-title pb038-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb038-title">The future is up for remote control</title>
<desc id="pb038-desc">Three-panel comic. An engineer builds the remote that steers a recommender with a single button, watch time, and asks what could go wrong. That one button then sorts everyone’s screen: your news, the big debates and which sellers get sales, and a viewer is startled that the news is sorted by watch time. In the last panel the remote is so big that five people hold it together, each pressing their own button: engineer (watch time), business (real value), lawmaker (fair rules), researcher (well-being) and you (my controls), whose button is marked new. Takeaway: a recommender steers news, debates and sales, too big a remote for engineers alone.</desc>
