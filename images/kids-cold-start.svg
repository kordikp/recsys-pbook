<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb148-title pb148-desc">
  <title id="pb148-title">Cold start: from popular-for-everyone to picked-for-you</title>
  <desc id="pb148-desc">On day 1 a new account has no interaction history, so the recommender can only show what is popular with everyone; each click, read and skip adds a clue (day 2: three data engineering articles, week 1: hands-on, Python, under 20 minutes, mornings) until the list becomes personal. Asking for interests at sign-up is a shortcut that gives day-2 quality on day 1.</desc>
  <style>
    .pb148-pop { animation: pb148-pop 10s ease-out infinite both; transform-box: fill-box; transform-origin: center; }
    .pb148-d0 { animation-delay: .6s; }
    .pb148-d1 { animation-delay: 2s; }
    .pb148-d2 { animation-delay: 2.5s; }
    .pb148-d3 { animation-delay: 3s; }
    .pb148-d4 { animation-delay: 3.5s; }
    .pb148-d5 { animation-delay: 4s; }
    @keyframes pb148-pop {
      0% { opacity: 0; transform: scale(.6); }
      6% { opacity: 1; transform: scale(1.08); }
      9% { opacity: 1; transform: scale(1); }
      90% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .pb148-pop { animation: none !important; } }
  </style>
  <defs>
    <marker id="pb148-ah-grey" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9CA3AF"/>
    </marker>
    <marker id="pb148-ah-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="447" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <!-- Onboarding shortcut: Day 1 jumps to Day 2 quality -->
  <text x="214" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">Shortcut: ask for interests at sign-up</text>
  <path d="M108 66 C 128 40, 300 40, 318 62" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#pb148-ah-amber)"/>

  <!-- Timeline pills -->
  <rect x="16" y="68" width="184" height="34" rx="17" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="108" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Day 1 · new account</text>
  <rect x="228" y="68" width="184" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="320" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Day 2</text>
  <rect x="440" y="68" width="184" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="532" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Week 1</text>
  <line x1="204" y1="85" x2="223" y2="85" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pb148-ah-grey)"/>
  <line x1="416" y1="85" x2="435" y2="85" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pb148-ah-grey)"/>

  <!-- Row 1: what the system knows -->
  <circle cx="22" cy="127" r="5" fill="#10B981"/>
  <text x="34" y="132" font-size="14" font-weight="600" fill="#6B7280">What your clicks have told it</text>

  <rect x="16" y="142" width="184" height="104" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="108" y="190" text-anchor="middle" font-size="26">❄️</text>
  <text x="108" y="220" text-anchor="middle" font-size="15" fill="#6B7280">Nothing yet</text>

  <rect x="228" y="142" width="184" height="104" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <g class="pb148-pop pb148-d0">
    <rect x="238" y="181" width="164" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="320" y="199" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">data engineering ×3</text>
  </g>

  <rect x="440" y="142" width="184" height="104" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <g class="pb148-pop pb148-d1">
    <rect x="461" y="153" width="142" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="532" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">data engineering</text>
  </g>
  <g class="pb148-pop pb148-d2">
    <rect x="455" y="181" width="82" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="496" y="199" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">hands-on</text>
  </g>
  <g class="pb148-pop pb148-d3">
    <rect x="543" y="181" width="66" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="576" y="199" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">Python</text>
  </g>
  <g class="pb148-pop pb148-d4">
    <rect x="451" y="209" width="74" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="488" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">&lt; 20 min</text>
  </g>
  <g class="pb148-pop pb148-d5">
    <rect x="531" y="209" width="82" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="572" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">mornings</text>
  </g>

  <!-- Row 2: what it recommends -->
  <circle cx="22" cy="271" r="5" fill="#7C3AED"/>
  <text x="34" y="276" font-size="14" font-weight="600" fill="#6B7280">So it recommends</text>

  <rect x="16" y="286" width="184" height="118" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="28" y="312" font-size="16" font-weight="700" fill="#1E1B4B">🔥 Top for everyone</text>
  <rect x="26" y="324" width="164" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="36" y="344" font-size="14" fill="#1E1B4B">🐱 Viral cat video</text>
  <rect x="26" y="360" width="164" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="36" y="380" font-size="14" fill="#1E1B4B">⭐ Celebrity news</text>

  <rect x="228" y="286" width="184" height="118" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="240" y="312" font-size="16" font-weight="700" fill="#1E1B4B">More of that topic</text>
  <rect x="238" y="324" width="164" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="248" y="344" font-size="14" fill="#1E1B4B">Data pipelines 101</text>
  <rect x="238" y="360" width="164" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="248" y="380" font-size="14" fill="#1E1B4B">Data lakes in brief</text>

  <rect x="440" y="286" width="184" height="118" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="452" y="312" font-size="16" font-weight="700" fill="#4C1D95">Picked for you</text>
  <rect x="450" y="324" width="164" height="30" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="460" y="344" font-size="14" fill="#1E1B4B">Python lab · 12 min</text>
  <rect x="450" y="360" width="164" height="30" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="460" y="380" font-size="14" fill="#1E1B4B">Pipeline lab · 15 min</text>

  <!-- Takeaway -->
  <text x="320" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#6B7280">No history = the same popular list for everyone. Each click makes it yours.</text>
</svg>
