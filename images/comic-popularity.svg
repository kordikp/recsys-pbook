  <rect x="10" y="194" width="128" height="9" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M45,180 H79 Q78,194 62,194 Q46,194 45,180 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-linejoin="round"/>
  <g fill="#10B981">
