<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The Usual, for Absolutely Everyone</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <g>
    <rect x="42" y="78" width="180" height="58" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="62" y="101" font-size="12.5" fill="#1E1B4B">
      <tspan x="62" dy="0">First time here.</tspan>
      <tspan x="62" dy="18">What's good?</tspan>
    </text>
    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="92" cy="184" r="10" fill="#0EA5E9" stroke="none"/>
      <line x1="92" y1="195" x2="92" y2="229"/>
      <line x1="92" y1="205" x2="75" y2="216"/>
      <line x1="92" y1="205" x2="109" y2="216"/>
    </g>
    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="310" cy="184" r="10" fill="#7C3AED" stroke="none"/>
      <line x1="310" y1="195" x2="310" y2="229"/>
      <line x1="310" y1="205" x2="292" y2="216"/>
      <line x1="310" y1="205" x2="327" y2="211"/>
    </g>
    <line x1="52" y1="236" x2="352" y2="236" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
    <g>
      <path d="M171 218 Q184 238 197 218 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <line x1="169" y1="218" x2="199" y2="218" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">A new diner arrives with zero order history.</text>

  <!-- Panel 2 -->
  <g>
    <g>
      <rect x="430" y="76" width="140" height="108" rx="9" fill="#D1FAE5" stroke="#10B981"/>
      <text x="500" y="99" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">TRENDING</text>
      <path d="M483 121 Q500 146 517 121 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <line x1="481" y1="121" x2="519" y2="121" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
      <text x="500" y="167" font-size="12.5" fill="#1E1B4B" text-anchor="middle">27 ORDERS</text>
    </g>
    <rect x="584" y="78" width="176" height="56" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="602" y="101" font-size="12.5" fill="#1E1B4B">
      <tspan x="602" dy="0">The green bowl.</tspan>
      <tspan x="602" dy="18">Everyone's getting it.</tspan>
    </text>
    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="680" cy="204" r="10" fill="#7C3AED" stroke="none"/>
      <line x1="680" y1="215" x2="680" y2="254"/>
      <line x1="680" y1="226" x2="650" y2="237"/>
      <line x1="680" y1="226" x2="700" y2="240"/>
    </g>
    <g>
      <path d="M625 230 Q638 250 651 230 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <line x1="623" y1="230" x2="653" y2="230" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">The crowd supplies a surprisingly solid default.</text>

  <!-- Panel 3 -->
  <g>
    <rect x="62" y="358" width="234" height="56" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="82" y="381" font-size="12.5" fill="#1E1B4B">
      <tspan x="82" dy="0">Green bowl for you.</tspan>
      <tspan x="82" dy="18">And you. And you.</tspan>
    </text>
    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="348" cy="464" r="10" fill="#7C3AED" stroke="none"/>
      <line x1="348" y1="475" x2="348" y2="523"/>
      <line x1="348" y1="487" x2="323" y2="498"/>
      <line x1="348" y1="487" x2="366" y2="499"/>
    </g>
    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="76" cy="468" r="10" fill="#0EA5E9" stroke="none"/>
      <line x1="76" y1="479" x2="76" y2="521"/>
      <circle cx="178" cy="468" r="10" fill="#D97706" stroke="none"/>
      <line x1="178" y1="479" x2="178" y2="521"/>
      <circle cx="280" cy="468" r="10" fill="#10B981" stroke="none"/>
      <line x1="280" y1="479" x2="280" y2="521"/>
    </g>
    <g fill="#D1FAE5" stroke="#10B981" stroke-width="2">
      <path d="M59 510 Q76 534 93 510 Z"/>
      <path d="M161 510 Q178 534 195 510 Z"/>
      <path d="M263 510 Q280 534 297 510 Z"/>
    </g>
    <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round">
      <line x1="57" y1="510" x2="95" y2="510"/>
      <line x1="159" y1="510" x2="197" y2="510"/>
      <line x1="261" y1="510" x2="299" y2="510"/>
    </g>
  </g>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">One recommendation scales beautifully to every table.</text>

  <!-- Panel 4 -->
  <g>
    <rect x="430" y="358" width="144" height="52" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="449" y="389" font-size="12.5" fill="#1E1B4B">I hate cilantro.</text>
    <rect x="590" y="358" width="174" height="56" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="608" y="381" font-size="12.5" fill="#1E1B4B">
      <tspan x="608" dy="0">Excellent.</tspan>
      <tspan x="608" dy="18">You're outvoted.</tspan>
    </text>
    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="500" cy="466" r="10" fill="#0EA5E9" stroke="none"/>
      <line x1="500" y1="477" x2="500" y2="523"/>
      <line x1="500" y1="489" x2="480" y2="501"/>
      <line x1="500" y1="489" x2="521" y2="501"/>
    </g>
    <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="684" cy="466" r="10" fill="#7C3AED" stroke="none"/>
      <line x1="684" y1="477" x2="684" y2="523"/>
      <line x1="684" y1="489" x2="662" y2="501"/>
      <line x1="684" y1="489" x2="704" y2="501"/>
    </g>
    <line x1="448" y1="532" x2="736" y2="532" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
    <g>
      <path d="M574 510 Q592 534 610 510 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <line x1="572" y1="510" x2="612" y2="510" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="585" cy="506" r="3" fill="#10B981"/>
      <circle cx="597" cy="505" r="3" fill="#10B981"/>
    </g>
  </g>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The bestseller remains unmoved by one person's taste.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Popularity recommends trends to everyone; its biggest weakness is ignoring individual preferences.</text>
</svg>