  <path d="M132,42 H278 Q290,42 290,54 V82 Q290,94 278,94 H246 L238,127 L232,94 H132 Q120,94 120,82 V54 Q120,42 132,42 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
