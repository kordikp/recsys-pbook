  </g>

  <!-- waiter -->
  <path d="M215,222 V186 Q215,170 231,170 H245 Q261,170 261,186 V222 Z" fill="#7C3AED"/>
  <rect x="224" y="192" width="28" height="30" rx="3" fill="#FFFFFF"/>
  <path d="M231,171 L238,175 L231,179 Z M245,171 L238,175 L245,179 Z" fill="#FFFFFF"/>
  <circle cx="238" cy="149" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
  <path d="M227,147 Q230,144 233,147 M239,147 Q242,144 245,147" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M230,155 Q235,159 240,155" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

  <path d="M22,42 H98 Q110,42 110,54 V82 Q110,94 98,94 H70 L62,127 L56,94 H22 Q10,94 10,82 V54 Q10,42 22,42 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="60" y="63" text-anchor="middle" font-size="16" fill="#1E1B4B">I hate</text>
