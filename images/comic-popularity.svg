  <g>
    <path d="M87,222 V186 Q87,170 103,170 H117 Q133,170 133,186 V222 Z" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <circle cx="110" cy="149" r="17" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="105" cy="148" r="2.2" fill="#1E1B4B"/><circle cx="115" cy="148" r="2.2" fill="#1E1B4B"/>
    <path d="M106,157 H114" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="122" cy="126" r="2.5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <circle cx="126" cy="100" r="16" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="126" y="106" text-anchor="middle" font-size="17">🍕</text>
  </g>
  <g>
    <path d="M155,222 V186 Q155,170 171,170 H185 Q201,170 201,186 V222 Z" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <circle cx="178" cy="149" r="17" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="173" cy="148" r="2.2" fill="#1E1B4B"/><circle cx="183" cy="148" r="2.2" fill="#1E1B4B"/>
    <path d="M174,157 H182" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
