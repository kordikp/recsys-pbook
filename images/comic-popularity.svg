  <circle cx="57" cy="148.5" r="2.2" fill="#1E1B4B"/><circle cx="67" cy="148.5" r="2.2" fill="#1E1B4B"/>
  <path d="M56,159.5 Q62,153 68,159.5" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

