  <text x="43" y="31" font-size="16" font-weight="700" fill="#1E1B4B">Count the orders</text>
  <path d="M12,222 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>

  <!-- board -->
  <path d="M36,210 V221 M188,210 V221" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <rect x="8" y="104" width="208" height="106" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="20" y="124" font-size="14" font-weight="700" fill="#4C1D95">Most ordered today</text>
  <rect x="14" y="131" width="196" height="25" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="22" y="149" font-size="16">🍜</text>
  <text x="44" y="149" font-size="15" font-weight="700" fill="#1E1B4B">Cilantro noodles</text>
  <text x="202" y="149" text-anchor="end" font-size="15" font-weight="700" fill="#7C3AED">27</text>
  <text x="22" y="176" font-size="16">🍔</text>
  <text x="44" y="176" font-size="15" fill="#1E1B4B">Burger</text>
  <text x="202" y="176" text-anchor="end" font-size="15" fill="#4B5563">19</text>
  <text x="22" y="200" font-size="16">🥗</text>
  <text x="44" y="200" font-size="15" fill="#1E1B4B">Salad</text>
  <text x="202" y="200" text-anchor="end" font-size="15" fill="#4B5563">12</text>

  <!-- waiter -->
  <path d="M233,222 V186 Q233,170 249,170 H263 Q279,170 279,186 V222 Z" fill="#7C3AED"/>
  <rect x="242" y="192" width="28" height="30" rx="3" fill="#FFFFFF"/>
  <path d="M249,171 L256,175 L249,179 Z M263,171 L256,175 L263,179 Z" fill="#FFFFFF"/>
  <circle cx="256" cy="149" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
  <circle cx="247" cy="147" r="2.2" fill="#1E1B4B"/><circle cx="259" cy="147" r="2.2" fill="#1E1B4B"/>
  <path d="M248,155 Q253,159 258,155" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

  <path d="M70,42 H276 Q288,42 288,54 V82 Q288,94 276,94 H260 L254,127 L246,94 H70 Q58,94 58,82 V54 Q58,42 70,42 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="173" y="63" text-anchor="middle" font-size="16" fill="#1E1B4B">Most people order the</text>
  <text x="173" y="83" text-anchor="middle" font-size="16" fill="#1E1B4B">noodles. Safe bet!</text>

  <text x="149" y="247" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">Decent guess, zero history needed.</text>
</g>

<!-- ===== Panel 3: same dish for every table ===== -->
