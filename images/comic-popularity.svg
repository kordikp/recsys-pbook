<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 636" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb089-title pb089-desc">
<title id="pb089-title">The usual, for absolutely everyone</title>
<desc id="pb089-desc">Four-panel diner comic. A first-time guest with no order history asks what is good. The waiter, who plays the recommender, checks a board of today's most-ordered dishes (cilantro noodles 27, burger 19, salad 12) and suggests the top one: a safe bet with zero history. He then serves the same noodles to every table, although each guest was craving something different. The guest who hates cilantro is told: sorry, you're outvoted, 27 to 1. Popularity is a solid start for newcomers, but everyone gets the same list.</desc>

<rect x=".5" y=".5" width="639" height="635" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">The usual, for absolutely everyone</text>

<!-- ===== Panel 1: a new guest ===== -->
<g transform="translate(16,50)">
  <rect x="0" y="0" width="298" height="262" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
  <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="43" y="31" font-size="16" font-weight="700" fill="#1E1B4B">A new guest</text>
  <path d="M12,222 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>

  <!-- guest (you) -->
  <path d="M37,222 V186 Q37,170 53,170 H67 Q83,170 83,186 V222 Z" fill="#10B981"/>
  <circle cx="60" cy="149" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
  <circle cx="57" cy="147" r="2.2" fill="#1E1B4B"/><circle cx="69" cy="147" r="2.2" fill="#1E1B4B"/>
  <path d="M58,155 Q63,159 68,155" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- empty history card -->
  <rect x="96" y="150" width="106" height="56" rx="8" fill="#FAFAF7" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="149" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#4B5563">Past orders</text>
  <text x="149" y="195" text-anchor="middle" font-size="15" fill="#6B7280">none yet</text>

  <!-- waiter (recommender) -->
  <path d="M215,222 V186 Q215,170 231,170 H245 Q261,170 261,186 V222 Z" fill="#7C3AED"/>
  <rect x="224" y="192" width="28" height="30" rx="3" fill="#FFFFFF"/>
  <path d="M231,171 L238,175 L231,179 Z M245,171 L238,175 L245,179 Z" fill="#FFFFFF"/>
  <circle cx="238" cy="149" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
  <circle cx="229" cy="147" r="2.2" fill="#1E1B4B"/><circle cx="241" cy="147" r="2.2" fill="#1E1B4B"/>
  <path d="M230,155 Q235,159 240,155" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

  <path d="M24,44 H150 Q162,44 162,56 V82 Q162,94 150,94 H70 L62,127 L54,94 H24 Q12,94 12,82 V56 Q12,44 24,44 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="87" y="64" text-anchor="middle" font-size="16" fill="#1E1B4B">First time here.</text>
  <text x="87" y="84" text-anchor="middle" font-size="16" fill="#1E1B4B">What’s good?</text>

  <text x="60" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">You</text>
  <text x="238" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Recommender</text>
</g>

