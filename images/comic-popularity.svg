<text x="320" y="616" text-anchor="middle" font-size="16" fill="#1E1B4B"><tspan font-weight="700" fill="#7C3AED">Popularity:</tspan> a <tspan font-weight="700" fill="#065F46">solid start</tspan> for newcomers, but <tspan font-weight="700" fill="#92400E">the same list for everyone</tspan>.</text>
</svg>
