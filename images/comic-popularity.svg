  <text x="43" y="31" font-size="16" font-weight="700" fill="#1E1B4B">Outvoted</text>
  <path d="M12,222 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>

  <!-- guest (you), not happy -->
  <path d="M39,222 V186 Q39,170 55,170 H69 Q85,170 85,186 V222 Z" fill="#10B981"/>
  <circle cx="62" cy="149" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
