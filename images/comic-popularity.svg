  <rect x="8" y="194" width="214" height="9" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <g stroke="#9CA3AF" stroke-width="1.5" fill="#FFFFFF" stroke-linejoin="round">
    <path d="M25,180 H59 Q58,194 42,194 Q26,194 25,180 Z"/>
    <path d="M93,180 H127 Q126,194 110,194 Q94,194 93,180 Z"/>
    <path d="M161,180 H195 Q194,194 178,194 Q162,194 161,180 Z"/>
  </g>
  <g fill="#10B981">
    <ellipse cx="35" cy="177" rx="5" ry="2.6" transform="rotate(-25 35 177)"/><ellipse cx="43" cy="175" rx="5" ry="2.6" transform="rotate(15 43 175)"/><ellipse cx="51" cy="177" rx="5" ry="2.6" transform="rotate(-20 51 177)"/>
    <ellipse cx="103" cy="177" rx="5" ry="2.6" transform="rotate(-25 103 177)"/><ellipse cx="111" cy="175" rx="5" ry="2.6" transform="rotate(15 111 175)"/><ellipse cx="119" cy="177" rx="5" ry="2.6" transform="rotate(-20 119 177)"/>
    <ellipse cx="171" cy="177" rx="5" ry="2.6" transform="rotate(-25 171 177)"/><ellipse cx="179" cy="175" rx="5" ry="2.6" transform="rotate(15 179 175)"/><ellipse cx="187" cy="177" rx="5" ry="2.6" transform="rotate(-20 187 177)"/>
  </g>

  <!-- waiter -->
  <path d="M229,222 V186 Q229,170 245,170 H259 Q275,170 275,186 V222 Z" fill="#7C3AED"/>
  <rect x="238" y="192" width="28" height="30" rx="3" fill="#FFFFFF"/>
  <path d="M245,171 L252,175 L245,179 Z M259,171 L252,175 L259,179 Z" fill="#FFFFFF"/>
  <circle cx="252" cy="149" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
  <circle cx="243" cy="147" r="2.2" fill="#1E1B4B"/><circle cx="255" cy="147" r="2.2" fill="#1E1B4B"/>
  <path d="M244,155 Q249,159 254,155" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

  <path d="M22,42 H276 Q288,42 288,54 V64 Q288,76 276,76 H258 L252,128 L244,76 H22 Q10,76 10,64 V54 Q10,42 22,42 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
