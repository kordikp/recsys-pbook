<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .bar{animation:grow 4s ease-in-out infinite}
    @keyframes grow{0%,15%{transform:scaleX(.4)}55%,85%{transform:scaleX(1)}100%{transform:scaleX(.4)}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">What a Skip Means Depends on WHEN You Skip</text>

  <g font-size="13">
    <text x="70" y="102" font-weight="700" fill="#B91C1C">skip &lt; 5 s</text>
    <rect x="190" y="86" width="380" height="24" rx="12" fill="#FEE2E2"/>
    <rect class="bar" x="190" y="86" width="330" height="24" rx="12" fill="#EF4444" style="transform-origin:190px 98px"/>
    <text x="586" y="103" font-weight="700" fill="#B91C1C">strong negative</text>
    <text x="190" y="130" fill="#6B7280" font-size="12">"not this, not now" — thumbnail or mood mismatch; demote hard</text>

    <text x="70" y="182" font-weight="700" fill="#92400E">skip mid-way</text>
    <rect x="190" y="166" width="380" height="24" rx="12" fill="#FEF3C7"/>
    <rect class="bar" x="190" y="166" width="200" height="24" rx="12" fill="#D97706" style="transform-origin:190px 178px"/>
    <text x="586" y="183" font-weight="700" fill="#92400E">mild negative</text>
    <text x="190" y="210" fill="#6B7280" font-size="12">hooked, then lost — content promised more than it delivered</text>

    <text x="70" y="262" font-weight="700" fill="#4B5563">skip at 90 %</text>
    <rect x="190" y="246" width="380" height="24" rx="12" fill="#E5E7EB"/>
    <rect class="bar" x="190" y="246" width="60" height="24" rx="12" fill="#9CA3AF" style="transform-origin:190px 258px"/>
    <text x="586" y="263" font-weight="700" fill="#4B5563">barely negative</text>
    <text x="190" y="290" fill="#6B7280" font-size="12">practically finished — often just the outro; treat as near-complete</text>

    <text x="70" y="342" font-weight="700" fill="#065F46">replay / save</text>
    <rect x="190" y="326" width="380" height="24" rx="12" fill="#D1FAE5"/>
    <rect class="bar" x="190" y="326" width="360" height="24" rx="12" fill="#10B981" style="transform-origin:190px 338px"/>
    <text x="586" y="343" font-weight="700" fill="#065F46">strong positive</text>
  </g>
  <text x="400" y="398" text-anchor="middle" font-size="13" fill="#6B7280">One event type, four meanings — duration turns "skip" from a click into a sentence.</text>
</svg>
