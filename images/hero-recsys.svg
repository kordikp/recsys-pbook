<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
  <title id="title">How recommendations work</title>
  <desc id="desc">A user’s music, video, and book interests flow into a recommendation algorithm, which creates personalized For you, Trending, and Discover items.</desc>
  <defs>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="518" height="218" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="18" y="25" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1E1B4B">How recommendations work</text>
  <text x="18" y="43" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Your interests help a recommender choose personalized items.</text>

  <!-- User-to-interest relationships -->
  <path d="M96 123 C105 123 106 79 116 79" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M96 128 C105 128 106 129 116 129" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M96 133 C105 133 106 179 116 179" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Interest-to-algorithm relationships -->
  <path d="M220 79 C232 79 234 101 246 101" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M220 129 L246 129" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M220 179 C232 179 234 157 246 157" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Algorithm-to-results relationships -->
  <path d="M334 101 C347 101 350 79 365 79" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M334 129 L365 129" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M334 157 C347 157 350 179 365 179" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- User -->
  <rect x="16" y="68" width="80" height="122" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="56" cy="99" r="20" fill="#EDE9FE"/>
  <circle cx="56" cy="96" r="12" fill="#FEF3C7"/>
  <path d="M44 95 Q44 80 56 80 Q68 80 68 95 Q64 88 56 88 Q48 88 44 95Z" fill="#D97706"/>
  <circle cx="52" cy="97" r="1.5" fill="#1E1B4B"/>
  <circle cx="60" cy="97" r="1.5" fill="#1E1B4B"/>
  <path d="M52 103 Q56 106 60 103" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M43 119 Q56 110 69 119 L73 153 L39 153Z" fill="#7C3AED"/>
  <path d="M68 123 L76 135" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <rect x="71" y="129" width="13" height="22" rx="3" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="74" y="133" width="7" height="11" rx="1" fill="#E0F2FE"/>
  <text x="56" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">You</text>

  <!-- Input interests -->
  <rect x="116" y="58" width="104" height="42" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="137" cy="79" r="12" fill="#D1FAE5"/>
  <text x="137" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15">🎵</text>
  <text x="156" y="84" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E1B4B">Music</text>

  <rect x="116" y="108" width="104" height="42" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="137" cy="129" r="12" fill="#EDE9FE"/>
  <text x="137" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15">🎬</text>
  <text x="156" y="134" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E1B4B">Videos</text>

  <rect x="116" y="158" width="104" height="42" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <circle cx="137" cy="179" r="12" fill="#FEF3C7"/>
  <text x="137" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15">📚</text>
  <text x="156" y="184" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E1B4B">Books</text>

  <!-- Recommender -->
  <rect x="246" y="78" width="88" height="102" rx="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="290" cy="107" r="18" fill="#FFFFFF"/>
  <text x="290" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20">🧠</text>
  <text x="290" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">Algorithm</text>
  <text x="290" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Recommender</text>

  <!-- Personalized music -->
  <rect x="365" y="58" width="139" height="42" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="375" y="76" font-family="system-ui, sans-serif" font-size="13">⭐</text>
  <text x="394" y="77" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">For you</text>
  <text x="375" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Music</text>
  <rect x="444" y="66" width="15" height="25" rx="3" fill="#D1FAE5"/>
  <path d="M454 71 V82 M454 72 L458 71 V78" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <circle cx="451" cy="83" r="3" fill="#10B981"/>
  <rect x="463" y="66" width="15" height="25" rx="3" fill="#FEE2E2"/>
  <path d="M467 84 L474 72 M469 74 L476 80" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <rect x="482" y="66" width="15" height="25" rx="3" fill="#E0F2FE"/>
  <rect x="486" y="72" width="7" height="13" rx="2" fill="#0EA5E9"/>
  <path d="M487 76 H492 M487 80 H492" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Personalized videos -->
  <rect x="365" y="108" width="139" height="42" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="375" y="127" font-family="system-ui, sans-serif" font-size="13">🔥</text>
  <text x="394" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Trending</text>
  <text x="375" y="143" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Videos</text>
  <rect x="444" y="116" width="24" height="18" rx="3" fill="#FEF3C7"/>
  <path d="M444 128 L452 122 L458 128 L463 124 L468 129 V134 H444Z" fill="#10B981"/>
  <circle cx="456" cy="125" r="5" fill="#7C3AED"/>
  <path d="M454 122 L459 125 L454 128Z" fill="#FFFFFF"/>
  <rect x="472" y="116" width="24" height="18" rx="3" fill="#E0F2FE"/>
  <rect x="475" y="119" width="7" height="7" rx="2" fill="#EF4444"/>
  <circle cx="485" cy="125" r="5" fill="#FFFFFF"/>
  <path d="M483 122 L488 125 L483 128Z" fill="#7C3AED"/>
  <rect x="444" y="138" width="18" height="3" rx="1.5" fill="#E5E7EB"/>
  <rect x="472" y="138" width="15" height="3" rx="1.5" fill="#E5E7EB"/>

  <!-- Personalized books -->
  <rect x="365" y="158" width="139" height="42" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="375" y="177" font-family="system-ui, sans-serif" font-size="13">💡</text>
  <text x="394" y="178" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Discover</text>
  <text x="375" y="193" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Books</text>
  <rect x="445" y="165" width="12" height="27" rx="2" fill="#0EA5E9"/>
  <path d="M448 171 H454 M448 175 H454" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="461" y="165" width="12" height="27" rx="2" fill="#EF4444"/>
  <path d="M464 171 H470 M464 175 H470" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="477" y="165" width="12" height="27" rx="2" fill="#10B981"/>
  <path d="M480 171 H486 M480 175 H486" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="493" y="165" width="7" height="27" rx="2" fill="#D97706"/>
</svg>