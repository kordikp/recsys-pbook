<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb057-title pb057-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb057-title">The shop follows your lead</title>
<desc id="pb057-desc">Four-panel comic. On your first visit the shop's recommender knows nothing about you: its notepad shows only a question mark. As you browse, every move leaves a footprint (a click on jazz, a skip of metal, piano replayed three times) and the recommender follows the trail, noting each one. Weeks of footprints later its notes rate piano, jazz and late nights high and metal at zero. On the next visit it offers late-night piano jazz. You never told it; your footprints did.</desc>
<defs>
<clipPath id="pb057-clip"><rect x="0" y="0" width="298" height="266" rx="12"/></clipPath>
<g id="pb057-footL"><path d="M-13,0 C-13,-4 -10,-5.2 -6,-5.2 C-1,-5.2 3,-7.4 8,-7.4 C12,-7.4 13.4,-3.5 12.6,0.6 C11.8,4.6 7.6,6 2.6,4.6 C-1.6,3.4 -5.6,5 -9,4.6 C-12,4.2 -13,2.4 -13,0 Z"/><circle cx="16" cy="-5.6" r="3"/><circle cx="17.6" cy="-0.9" r="2.2"/><circle cx="17.2" cy="3" r="1.9"/><circle cx="15.8" cy="6.3" r="1.6"/></g>
<g id="pb057-footR"><use href="#pb057-footL" transform="scale(1,-1)"/></g>
</defs>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" font-size="19" font-weight="700" fill="#1E1B4B" text-anchor="middle">The shop follows your lead</text>

