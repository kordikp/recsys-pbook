<circle cx="118" cy="247" r="16" fill="#EDE9FE" fill-opacity=".45" stroke="#4C1D95" stroke-width="2.5"/>
<path d="M26,50 H174 Q186,50 186,62 V72 Q186,84 174,84 H52 L46,134 L40,84 H26 Q14,84 14,72 V62 Q14,50 26,50 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
<text x="100" y="73" font-size="16" fill="#1E1B4B" text-anchor="middle">Noted. Noted. Noted.</text>
</g>

