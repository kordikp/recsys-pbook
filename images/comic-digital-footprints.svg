<path d="M235,161 Q240,165 245,161" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
<path d="M226,198 L212,200" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
<rect x="168" y="176" width="42" height="52" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<rect x="168" y="176" width="42" height="9" rx="3" fill="#7C3AED"/>
<text x="189" y="217" font-size="24" font-weight="700" fill="#7C3AED" text-anchor="middle">?</text>
