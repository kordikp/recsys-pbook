<text x="149" y="84" text-anchor="middle" font-size="15" fill="#1E1B4B">Never tried one? Leave it blank.</text>

<path d="M102,106 H274 Q286,106 286,118 V128 Q286,140 274,140 H148 L140,160 L134,140 H102 Q90,140 90,128 V118 Q90,106 102,106 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
<text x="188" y="128" text-anchor="middle" font-size="15" fill="#1E1B4B">Nuts? Never tried. Blank!</text>

<path d="M12,230.5 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
