<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" role="img" aria-labelledby="pb059-title pb059-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb059-title">The office snack spreadsheet gets personal</title>
<desc id="pb059-desc">Four-panel comic. A talking office spreadsheet asks the team to rate snacks from 1 to 5 and leave a blank for anything they never tried; Ava has never tried nuts. The answers form a rating matrix: users (Ava, Bo, Cy) are rows, items (cookies, apples, nuts) are columns, ratings fill the cells, and Ava's nuts cell is blank. When Bo adds all 1,000 snacks from the supplier, Ava has rated only 10 of them, so 99% of her row is blank. The spreadsheet notices Ava rates just like Cy, who gave nuts a 4, and guesses a 4 for her blank: the blanks are what a recommender predicts.</desc>
<rect x=".5" y=".5" width="639" height="629" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

<!-- ===== Panel 1: the survey ===== -->
<g transform="translate(16,16)">
