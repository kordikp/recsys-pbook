<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The Office Snack Spreadsheet Gets Personal</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <g>
    <rect x="34" y="76" width="190" height="48" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="49" y="96" font-size="12.5" fill="#1E1B4B">
      <tspan x="49" dy="0">Quick survey:</tspan>
      <tspan x="49" dy="17">Rate every snack, 1–5.</tspan>
    </text>

    <circle cx="91" cy="166" r="10" fill="#7C3AED"/>
    <path d="M91 177 L91 222 M91 187 L68 199 M91 188 L112 199 M91 222 L78 245 M91 222 L105 245" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="111" y="181" width="84" height="66" rx="5" fill="#FFFFFF" stroke="#6B7280"/>
    <text x="153" y="198" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">SNACKS</text>
    <text x="122" y="217" font-size="12" fill="#6B7280">Chips</text>
    <text x="181" y="217" font-size="12" fill="#7C3AED" text-anchor="end">5</text>
    <text x="122" y="236" font-size="12" fill="#6B7280">Apple</text>
    <text x="181" y="236" font-size="12" fill="#7C3AED" text-anchor="end">1</text>

    <circle cx="267" cy="169" r="10" fill="#10B981"/>
    <path d="M267 180 L267 224 M267 190 L246 204 M267 191 L286 203 M267 224 L254 247 M267 224 L280 247" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="338" cy="169" r="10" fill="#0EA5E9"/>
    <path d="M338 180 L338 224 M338 190 L318 203 M338 190 L357 201 M338 224 L326 247 M338 224 L351 247" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">First, everyone rates the same snacks from 1 to 5.</text>

  <!-- Panel 2 -->
  <g>
    <text x="615" y="82" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">TEAM SNACK RATINGS</text>
    <rect x="438" y="92" width="324" height="145" rx="5" fill="#FFFFFF" stroke="#6B7280"/>
    <rect x="438" y="92" width="324" height="36" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
    <path d="M498 92 V237 M586 92 V237 M674 92 V237 M438 128 H762 M438 164 H762 M438 200 H762" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>

    <text x="542" y="115" font-size="12" fill="#1E1B4B" text-anchor="middle">Chips</text>
    <text x="630" y="115" font-size="12" fill="#1E1B4B" text-anchor="middle">Apple</text>
    <text x="718" y="115" font-size="12" fill="#1E1B4B" text-anchor="middle">Nuts</text>

    <text x="468" y="151" font-size="12" fill="#10B981" text-anchor="middle">Ava</text>
    <text x="468" y="187" font-size="12" fill="#D97706" text-anchor="middle">Bo</text>
    <text x="468" y="223" font-size="12" fill="#0EA5E9" text-anchor="middle">Cy</text>

    <text x="542" y="151" font-size="12.5" fill="#1E1B4B" text-anchor="middle">5</text>
    <text x="630" y="151" font-size="12.5" fill="#1E1B4B" text-anchor="middle">1</text>
    <text x="542" y="187" font-size="12.5" fill="#1E1B4B" text-anchor="middle">1</text>
    <text x="630" y="187" font-size="12.5" fill="#1E1B4B" text-anchor="middle">5</text>
    <text x="718" y="187" font-size="12.5" fill="#1E1B4B" text-anchor="middle">5</text>
    <text x="542" y="223" font-size="12.5" fill="#1E1B4B" text-anchor="middle">5</text>
    <text x="630" y="223" font-size="12.5" fill="#1E1B4B" text-anchor="middle">1</text>
    <text x="718" y="223" font-size="12.5" fill="#1E1B4B" text-anchor="middle">4</text>
  </g>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Rows are teammates; columns are snacks; cells hold ratings.</text>

  <!-- Panel 3 -->
  <g>
    <rect x="38" y="365" width="220" height="150" rx="4" fill="#FFFFFF" stroke="#6B7280"/>
    <path d="M58 365 V515 M78 365 V515 M98 365 V515 M118 365 V515 M138 365 V515 M158 365 V515 M178 365 V515 M198 365 V515 M218 365 V515 M238 365 V515 M38 390 H258 M38 415 H258 M38 440 H258 M38 465 H258 M38 490 H258" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="59" y="391" width="18" height="23" rx="2" fill="#D1FAE5"/>
    <rect x="159" y="441" width="18" height="23" rx="2" fill="#E0F2FE"/>
    <rect x="219" y="466" width="18" height="23" rx="2" fill="#FEF3C7"/>

    <rect x="270" y="360" width="105" height="52" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="322.5" y="380" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
      <tspan x="322.5" dy="0">10,000 columns.</tspan>
      <tspan x="322.5" dy="17">Six coworkers.</tspan>
    </text>

    <circle cx="319" cy="447" r="10" fill="#7C3AED"/>
    <path d="M319 458 L319 500 M319 470 L296 480 M319 470 L339 480 M319 500 L307 522 M319 500 L332 522" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="361" cy="447" r="10" fill="#10B981"/>
    <path d="M361 458 L361 500 M361 470 L344 481 M361 470 L377 480 M361 500 L350 522 M361 500 L374 522" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <text x="148" y="535" font-size="12.5" font-weight="700" fill="#EF4444" text-anchor="middle">&gt;99% BLANK</text>
  </g>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The sheet is impressive; the information is mostly air.</text>

  <!-- Panel 4 -->
  <g>
    <rect x="540" y="355" width="228" height="48" rx="9" fill="#FEF3C7" stroke="#D97706"/>
    <text x="654" y="375" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
      <tspan x="654" dy="0">Ava, your blank looks</tspan>
      <tspan x="654" dy="17">very much like a 4.</tspan>
    </text>

    <rect x="430" y="415" width="148" height="98" rx="5" fill="#FFFFFF" stroke="#6B7280"/>
    <path d="M470 415 V513 M506 415 V513 M542 415 V513 M430 447 H578 M430 480 H578" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="488" y="437" font-size="12" fill="#6B7280" text-anchor="middle">C</text>
    <text x="524" y="437" font-size="12" fill="#6B7280" text-anchor="middle">A</text>
    <text x="560" y="437" font-size="12" fill="#6B7280" text-anchor="middle">N</text>
    <text x="450" y="469" font-size="12" fill="#10B981" text-anchor="middle">Ava</text>
    <text x="450" y="502" font-size="12" fill="#0EA5E9" text-anchor="middle">Cy</text>
    <text x="488" y="469" font-size="12.5" fill="#1E1B4B" text-anchor="middle">5</text>
    <text x="524" y="469" font-size="12.5" fill="#1E1B4B" text-anchor="middle">1</text>
    <text x="560" y="469" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">?</text>
    <text x="488" y="502" font-size="12.5" fill="#1E1B4B" text-anchor="middle">5</text>
    <text x="524" y="502" font-size="12.5" fill="#1E1B4B" text-anchor="middle">1</text>
    <text x="560" y="502" font-size="12.5" fill="#0EA5E9" text-anchor="middle">4</text>

    <rect x="635" y="416" width="133" height="34" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="701.5" y="438" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Fine. Cashews.</text>

    <circle cx="620" cy="486" r="10" fill="#7C3AED"/>
    <path d="M620 497 L620 538 M620 508 L645 517 M620 508 L601 520 M620 538 L608 558 M620 538 L633 558" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="708" cy="486" r="10" fill="#10B981"/>
    <path d="M708 497 L708 538 M708 508 L683 518 M708 508 L730 518 M708 538 L696 558 M708 538 L721 558" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M647 514 Q664 530 681 514 L677 531 Q664 540 651 531 Z" fill="#FEF3C7" stroke="#D97706"/>
    <circle cx="657" cy="518" r="3" fill="#D97706"/>
    <circle cx="666" cy="520" r="3" fill="#D97706"/>
    <circle cx="674" cy="517" r="3" fill="#D97706"/>
  </g>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">At last, the empty box starts looking suspiciously edible.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">A rating matrix uses user rows, item columns, and rating cells; sparse blanks need prediction.</text>
</svg>