<!-- takeaway -->
<text x="320" y="586" text-anchor="middle" font-size="16" fill="#1E1B4B"><tspan font-weight="700" fill="#065F46">Users</tspan> are rows, <tspan font-weight="700">items</tspan> are columns, <tspan font-weight="700">ratings</tspan> fill the cells.</text>
<text x="320" y="610" text-anchor="middle" font-size="16" fill="#1E1B4B">Most cells stay <tspan font-weight="700" fill="#92400E">blank</tspan>. The blanks are what you <tspan font-weight="700" fill="#7C3AED">predict</tspan>.</text>
