<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 508" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn16-title pn16-desc">
<title id="pn16-title">Multi-task ranking: many predictions in, one value out</title>
<desc id="pn16-desc">One shared model predicts four behaviours for each item (click, buy, return, hide); the product team gives each a weight, negative for returns and hides, and the weighted sum is the item's value. The neon dress gets more clicks but scores 0.10; the dark jeans score 0.54 and rank first. The model predicts; the team decides what each behaviour is worth.</desc>
