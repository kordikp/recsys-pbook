<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb154-title pb154-desc">
  <title id="pb154-title">The recommendation pipeline: retrieve, rank, re-rank</title>
  <desc id="pb154-desc">A recommendation passes three stages that see fewer items but look harder at each: retrieval quickly pulls about 1,000 candidates from millions using many sources, ranking gives each candidate a careful score, and re-ranking shapes the final 10 to 30 items for variety, freshness and rules, all in under 200 milliseconds.</desc>
  <defs>
    <marker id="pb154-ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="639" height="467" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Fewer items at each step, more care per item</text>

  <!-- funnel: how many items each stage handles -->
  <path d="M20 64 L200 64 L185 164 L35 164 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="110" y="110" text-anchor="middle" font-size="22" font-weight="700" fill="#4C1D95">Millions</text>
  <text x="110" y="134" text-anchor="middle" font-size="14" fill="#4C1D95">of items</text>
  <path d="M40 178 L180 178 L164 278 L56 278 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="110" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#4C1D95">~1,000</text>
  <text x="110" y="248" text-anchor="middle" font-size="14" fill="#4C1D95">candidates</text>
  <path d="M61 292 L159 292 L145 392 L75 392 Z" fill="#7C3AED" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="110" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">10–30</text>
  <text x="110" y="362" text-anchor="middle" font-size="14" fill="#FFFFFF">shown</text>

  <!-- stage 1: retrieve -->
  <g transform="translate(0,64)">
    <rect x="220" y="0" width="400" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="252" cy="30" r="13" fill="#7C3AED"/>
    <text x="252" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
    <text x="274" y="36" font-size="18" font-weight="700" fill="#1E1B4B">Retrieve</text>
    <text x="240" y="64" font-size="15" fill="#1E1B4B">Many quick nets at once</text>
    <text x="240" y="86" font-size="14" fill="#4B5563">better too many than miss one</text>
    <rect x="486" y="12" width="118" height="22" rx="11" fill="#EDE9FE"/>
    <text x="545" y="28" text-anchor="middle" font-size="14" fill="#4C1D95">similar users</text>
    <rect x="486" y="39" width="118" height="22" rx="11" fill="#EDE9FE"/>
    <text x="545" y="55" text-anchor="middle" font-size="14" fill="#4C1D95">similar items</text>
    <rect x="486" y="66" width="118" height="22" rx="11" fill="#EDE9FE"/>
    <text x="545" y="82" text-anchor="middle" font-size="14" fill="#4C1D95">trending now</text>
  </g>

  <!-- stage 2: rank -->
  <g transform="translate(0,178)">
    <rect x="220" y="0" width="400" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="252" cy="30" r="13" fill="#7C3AED"/>
    <text x="252" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
    <text x="274" y="36" font-size="18" font-weight="700" fill="#1E1B4B">Rank</text>
    <text x="240" y="64" font-size="15" fill="#1E1B4B">One careful score per item</text>
    <text x="240" y="86" font-size="14" fill="#4B5563">odds of click, watch, buy</text>
    <text x="604" y="20" text-anchor="end" font-size="14" fill="#6B7280">e.g.</text>
    <rect x="478" y="31" width="14" height="14" rx="3" fill="#D1D5DB"/>
    <rect x="498" y="32" width="64" height="12" rx="4" fill="#7C3AED"/>
    <text x="568" y="43" font-size="14" fill="#1E1B4B">.92</text>
    <rect x="478" y="53" width="14" height="14" rx="3" fill="#D1D5DB"/>
    <rect x="498" y="54" width="57" height="12" rx="4" fill="#C4B5FD"/>
    <text x="561" y="65" font-size="14" fill="#1E1B4B">.81</text>
    <rect x="478" y="75" width="14" height="14" rx="3" fill="#D1D5DB"/>
    <rect x="498" y="76" width="33" height="12" rx="4" fill="#C4B5FD"/>
    <text x="537" y="87" font-size="14" fill="#1E1B4B">.47</text>
  </g>

  <!-- stage 3: re-rank -->
  <g transform="translate(0,292)">
    <rect x="220" y="0" width="400" height="100" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="252" cy="30" r="13" fill="#7C3AED"/>
    <text x="252" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    <text x="274" y="36" font-size="18" font-weight="700" fill="#1E1B4B">Re-rank</text>
    <text x="240" y="64" font-size="15" fill="#1E1B4B">Shape the final list</text>
    <text x="240" y="86" font-size="14" fill="#4B5563">variety, freshness, rules</text>
    <text x="492" y="32" text-anchor="middle" font-size="18">🎬</text>
    <text x="492" y="58" text-anchor="middle" font-size="18">🎬</text>
    <text x="492" y="84" text-anchor="middle" font-size="18">🎬</text>
    <line x1="514" y1="52" x2="544" y2="52" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb154-ah)"/>
    <text x="572" y="32" text-anchor="middle" font-size="18">🎬</text>
    <text x="572" y="58" text-anchor="middle" font-size="18">🎵</text>
    <text x="572" y="84" text-anchor="middle" font-size="18">📰</text>
  </g>

  <!-- time budget -->
  <rect x="20" y="408" width="600" height="40" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="320" y="433" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">All three steps: under 200 ms, on every request</text>
</svg>
