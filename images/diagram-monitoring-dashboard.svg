<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" role="img" aria-labelledby="pb135-title pb135-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb135-title">HTTP 200 everywhere, and still broken</title>
  <desc id="pb135-desc">Two dashboards watch the same recommender at the same moment. Traditional monitoring shows all green: every request returns HTTP 200, the error rate is normal and latency is within the SLA. Recommender monitoring shows it is quietly broken: ranking quality (nDCG) has been falling for days, catalog coverage has collapsed to the same 50 items for everyone, and a feature's null rate jumped from 0.1% to 15% in a day. Being up is not the same as being useful.</desc>

  <rect x=".5" y=".5" width="639" height="411" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <text x="320" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">HTTP 200 everywhere, and still broken</text>
  <text x="320" y="64" text-anchor="middle" font-size="14" fill="#6B7280">One recommender, one moment, two dashboards</text>

  <!-- Left: traditional monitoring -->
  <rect x="24" y="84" width="284" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="44" y="114" font-size="16" font-weight="700" fill="#1E1B4B">Traditional monitoring</text>
  <text x="44" y="134" font-size="14" fill="#6B7280">Is it up?</text>
  <line x1="40" y1="148" x2="292" y2="148" stroke="#E5E7EB"/>

  <text x="44" y="173" font-size="15" font-weight="600" fill="#1E1B4B">Server responses</text>
  <text x="44" y="192" font-size="14" fill="#4B5563">HTTP 200 on every request</text>
  <circle cx="274" cy="177" r="11" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <path d="M268.5 177.5l3.8 3.8 7-7.5" fill="none" stroke="#065F46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="202" x2="292" y2="202" stroke="#E5E7EB"/>

  <text x="44" y="223" font-size="15" font-weight="600" fill="#1E1B4B">Error rate</text>
  <text x="44" y="242" font-size="14" fill="#4B5563">normal</text>
  <circle cx="274" cy="227" r="11" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <path d="M268.5 227.5l3.8 3.8 7-7.5" fill="none" stroke="#065F46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="252" x2="292" y2="252" stroke="#E5E7EB"/>

  <text x="44" y="273" font-size="15" font-weight="600" fill="#1E1B4B">Latency</text>
  <text x="44" y="292" font-size="14" fill="#4B5563">within the SLA</text>
  <circle cx="274" cy="277" r="11" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <path d="M268.5 277.5l3.8 3.8 7-7.5" fill="none" stroke="#065F46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="44" y="314" width="244" height="34" rx="17" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="166" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">✓ All green</text>

  <!-- Right: recommender monitoring -->
  <rect x="332" y="84" width="284" height="280" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="352" y="114" font-size="16" font-weight="700" fill="#4C1D95">Recommender monitoring</text>
  <text x="352" y="134" font-size="14" fill="#6B7280">Is it recommending well?</text>
  <line x1="348" y1="148" x2="600" y2="148" stroke="#E5E7EB"/>

  <text x="352" y="173" font-size="15" font-weight="600" fill="#1E1B4B">Ranking quality</text>
  <text x="352" y="192" font-size="14" fill="#DC2626">nDCG falling for days</text>
  <line x1="530" y1="192" x2="598" y2="192" stroke="#E5E7EB"/>
  <polyline points="530,164 542,163 554,165 566,164 574,170 582,178 590,183 596,186" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="596" cy="186" r="3.5" fill="#DC2626"/>
  <line x1="348" y1="202" x2="600" y2="202" stroke="#E5E7EB"/>

  <text x="352" y="223" font-size="15" font-weight="600" fill="#1E1B4B">Catalog coverage</text>
  <text x="352" y="242" font-size="14" fill="#DC2626">same 50 items for all</text>
  <line x1="530" y1="242" x2="598" y2="242" stroke="#E5E7EB"/>
  <polyline points="530,214 546,214 552,222 566,222 572,231 584,231 590,236 596,236" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="596" cy="236" r="3.5" fill="#DC2626"/>
  <line x1="348" y1="252" x2="600" y2="252" stroke="#E5E7EB"/>

  <text x="352" y="273" font-size="15" font-weight="600" fill="#1E1B4B">Feature nulls</text>
  <text x="352" y="292" font-size="14" fill="#DC2626">0.1% → 15% in a day</text>
  <line x1="530" y1="292" x2="598" y2="292" stroke="#E5E7EB"/>
  <polyline points="530,290 548,290 566,289 578,290 584,276 590,266 596,264" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="596" cy="264" r="3.5" fill="#DC2626"/>

  <rect x="352" y="314" width="244" height="34" rx="17" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="474" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">✗ Quietly broken</text>

  <!-- Takeaway -->
  <text x="320" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B"><tspan fill="#065F46">Up</tspan> is not <tspan fill="#4C1D95">useful</tspan>: watch what it recommends, not just that it answers.</text>
</svg>
