<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" role="img" aria-labelledby="pb047-title pb047-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb047-title">Ask a friend, then ask a million</title>
<desc id="pb047-desc">Four-panel comic. You and Maya, a colleague, loved the same five shows. Maya finishes Silo and says you would love it; you have not seen it yet. That evening the app suggests Silo too, and you ask whether Maya told it. The app has never heard of Maya: it found people who loved your five shows and saw that they also loved Silo. Collaborative filtering finds people who liked what you liked and recommends what they loved that you have not seen.</desc>
<rect x=".5" y=".5" width="639" height="627" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

