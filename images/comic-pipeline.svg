<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb088-title pb088-desc">
<title id="pb088-title">Lunch, served by committee</title>
<desc id="pb088-desc">Four-panel comic about the three stages of a recommendation pipeline. 1 Retrieve: a fetcher grabs 40 dishes that might fit out of 5,000, fast, without tasting. 2 Rank: a taster scores each of the 40 carefully; the top three are all noodle soups (ramen 9.4, pho 9.1, udon 8.9), then curry 8.2 and salad 7.6. 3 Re-rank: an editor swaps two of the noodle soups for the curry and the salad, so the tray has variety. 4 Served: you ask whether lunch really needed a committee; the committee says it met while the page loaded, in under 200 milliseconds.</desc>
<defs><marker id="pb088-ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/></marker></defs>
