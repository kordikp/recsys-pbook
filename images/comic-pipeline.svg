<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">Lunch, Served by Committee</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <g>
    <rect x="38" y="78" width="174" height="52" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="50" y="99" font-size="12.5" fill="#1E1B4B">Recommend me lunch.</text>
    <text x="50" y="117" font-size="12.5" fill="#1E1B4B">I have no time.</text>

    <circle cx="92" cy="177" r="10" fill="#7C3AED"/>
    <path d="M92 188 L92 226 M92 198 L73 212 M92 198 L108 214 M92 226 L79 247 M92 226 L105 247" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="151" y="213" width="103" height="28" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <path d="M161 226 H244" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="174" cy="241" r="5" fill="#FFFFFF" stroke="#0EA5E9"/>
    <circle cx="231" cy="241" r="5" fill="#FFFFFF" stroke="#0EA5E9"/>

    <circle cx="309" cy="177" r="10" fill="#10B981"/>
    <path d="M309 188 L309 226 M309 198 L290 213 M309 198 L327 211 M309 226 L297 247 M309 226 L321 247" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="238" y="82" width="132" height="42" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="250" y="108" font-size="12.5" fill="#1E1B4B">Starting the line.</text>
  </g>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">One request enters the lunch line.</text>

  <!-- Panel 2 -->
  <g>
    <rect x="430" y="76" width="88" height="27" rx="7" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="474" y="95" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">RETRIEVE</text>

    <path d="M438 126 H559 M438 174 H559" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="448" y="135" width="25" height="27" rx="4" fill="#FEF3C7" stroke="#D97706"/>
    <circle cx="496" cy="148" r="14" fill="#D1FAE5" stroke="#10B981"/>
    <rect x="523" y="132" width="28" height="31" rx="4" fill="#FEE2E2" stroke="#EF4444"/>

    <circle cx="615" cy="165" r="10" fill="#10B981"/>
    <path d="M615 176 L615 218 M615 188 L580 165 M615 188 L639 204 M615 218 L602 243 M615 218 L629 243" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M569 163 L578 159 L578 171 Z" fill="#D97706" stroke="#D97706"/>

    <rect x="646" y="82" width="116" height="42" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="658" y="108" font-size="12.5" fill="#1E1B4B">Close enough—for now.</text>

    <circle cx="744" cy="184" r="10" fill="#7C3AED"/>
    <path d="M744 195 L744 229 M744 205 L731 218 M744 205 L756 218 M744 229 L734 247 M744 229 L754 247" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M570 194 H588 M566 204 H586" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Retrieve: grab a fast, rough candidate set.</text>

  <!-- Panel 3 -->
  <g>
    <rect x="270" y="354" width="94" height="27" rx="7" fill="#FEF3C7" stroke="#D97706"/>
    <text x="317" y="373" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">SCORE</text>

    <rect x="38" y="358" width="157" height="45" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="50" y="385" font-size="12.5" fill="#1E1B4B">You measured the pickle?</text>

    <circle cx="72" cy="459" r="10" fill="#7C3AED"/>
    <path d="M72 470 L72 515 M72 482 L91 492 M72 482 L57 497 M72 515 L60 539 M72 515 L84 539" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="122" y="442" width="54" height="67" rx="6" fill="#D1FAE5" stroke="#10B981"/>
    <circle cx="149" cy="461" r="10" fill="#10B981"/>
    <text x="149" y="493" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">9.2</text>

    <rect x="184" y="442" width="54" height="67" rx="6" fill="#FEF3C7" stroke="#D97706"/>
    <path d="M199 465 H223 L211 452 Z" fill="#D97706"/>
    <text x="211" y="493" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">8.7</text>

    <rect x="246" y="442" width="54" height="67" rx="6" fill="#FEE2E2" stroke="#EF4444"/>
    <rect x="263" y="451" width="20" height="20" rx="4" fill="#EF4444"/>
    <text x="273" y="493" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">4.1</text>

    <circle cx="341" cy="459" r="10" fill="#10B981"/>
    <path d="M341 470 L341 515 M341 482 L321 496 M341 482 L356 499 M341 515 L329 539 M341 515 L353 539" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Score: judge each candidate more precisely.</text>

  <!-- Panel 4 -->
  <g>
    <rect x="430" y="356" width="205" height="48" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="442" y="377" font-size="12.5" fill="#1E1B4B">Did my lunch need</text>
    <text x="442" y="395" font-size="12.5" fill="#1E1B4B">three interviews?</text>

    <circle cx="753" cy="376" r="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.5"/>
    <path d="M753 376 L753 366 M753 376 L761 381" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
    <text x="753" y="416" font-size="12.5" font-weight="700" fill="#0EA5E9" text-anchor="middle">184 ms</text>

    <rect x="647" y="427" width="101" height="27" rx="7" fill="#D1FAE5" stroke="#10B981"/>
    <text x="697.5" y="446" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">RE-RANK</text>

    <circle cx="469" cy="480" r="10" fill="#7C3AED"/>
    <path d="M469 491 L469 527 M469 502 L488 512 M469 502 L455 516 M469 527 L458 550 M469 527 L480 550" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="516" y="510" width="121" height="25" rx="6" fill="#E0F2FE" stroke="#0EA5E9"/>
    <circle cx="541" cy="510" r="13" fill="#D1FAE5" stroke="#10B981"/>
    <path d="M566 516 H591 L578 494 Z" fill="#D97706"/>
    <rect x="607" y="488" width="17" height="28" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>

    <circle cx="688" cy="480" r="10" fill="#10B981"/>
    <path d="M688 491 L688 527 M688 502 L665 515 M688 502 L706 513 M688 527 L676 550 M688 527 L700 550" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Re-rank: diversify the final plate, then serve.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Production pipelines orchestrate retrieval, scoring, and re-ranking, often in under 200 ms.</text>
</svg>