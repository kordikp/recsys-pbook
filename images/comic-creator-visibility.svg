    <text x="657" y="476" font-size="10.5" font-weight="700" fill="#EF4444" text-anchor="middle">TIKTOK</text>
    <text x="657" y="491" font-size="11.5" fill="#1E1B4B" text-anchor="middle">18 SEC</text>

    <rect x="526" y="355" width="140" height="47" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="596" y="375" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Finally:</text>
    <text x="596" y="393" font-size="12.5" fill="#1E1B4B" text-anchor="middle">two full sets.</text>
  </g>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The same act gets tailored to each room's definition of success.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Strong starts and engagement rate drive reach; YouTube values watch time, TikTok completion.</text>
</svg>