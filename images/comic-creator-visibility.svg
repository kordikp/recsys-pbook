    <text x="702.5" y="113" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Smaller crowd.</text>
    <text x="702.5" y="130" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Much longer stay.</text>
  </g>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">YouTube's booker prefers minutes watched to doors opened.</text>

