    <text x="535" y="476" font-size="10.5" font-weight="700" fill="#0EA5E9" text-anchor="middle">YOUTUBE</text>
    <text x="535" y="491" font-size="11.5" fill="#1E1B4B" text-anchor="middle">8 MIN</text>

