<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" role="img" aria-labelledby="pb053-title pb053-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb053-title">1,000 clicks, nobody stayed</title>
<desc id="pb053-desc">Four-panel comic. You, the creator, post video A with a shocking “Wait till you see this!” thumbnail and get 1,000 clicks. Three seconds in, all 1,000 viewers have left: nobody waited to see it. Video B, an honest 8-minute “Fix a flat tire”, gets only 100 clicks, but all 100 watch to the end. The recommender cares more about minutes watched than clicks: A earned about 50 minutes (1,000 clicks × 3 seconds), B 800 minutes (100 × 8 minutes), so B gets recommended more. 100 viewers who stay beat 1,000 who leave; YouTube rewards watch time, TikTok watching to the end.</desc>
<defs><clipPath id="pb053-clip"><rect x="0" y="0" width="298" height="262" rx="12"/></clipPath></defs>
<rect x=".5" y=".5" width="639" height="633" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
