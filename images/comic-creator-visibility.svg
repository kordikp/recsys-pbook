    <text x="310" y="374" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle">TIKTOK</text>
    <text x="310" y="394" font-size="12.5" fill="#1E1B4B" text-anchor="middle">All four finished.</text>
    <text x="310" y="412" font-size="12.5" fill="#1E1B4B" text-anchor="middle">18 seconds flat.</text>
  </g>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">TikTok's booker counts who makes it through the whole set.</text>

  <!-- Panel 4 -->
  <g>
    <circle cx="596" cy="438" r="11" fill="#7C3AED"/>
    <path d="M596 450 L596 497 M596 464 L568 477 M596 464 L624 477 M596 497 L580 526 M596 497 L612 526" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

