  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <g>
    <rect x="34" y="76" width="136" height="58" rx="7" fill="#FEF3C7" stroke="#D97706"/>
    <text x="102" y="99" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="middle">BEST OPENER</text>
    <text x="102" y="118" font-size="12.5" fill="#1E1B4B" text-anchor="middle">IN TOWN!</text>

