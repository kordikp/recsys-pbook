<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn10-title pn10-desc">
  <title id="pn10-title">Spelling the next product's code</title>
  <desc id="pn10-desc">Similar products share the start of their code. Instead of searching the catalog, the sequence model reads the shopper's viewed products as codes and spells the next product's code one piece at a time, 7, then 1, then 9; code 7-1-9 is looked up in the catalog (rain trousers) and passed on to ranking.</desc>
  <style>
    .pn10-anim { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .pn10-s1 { animation-name: pn10-s1; }
    .pn10-s2 { animation-name: pn10-s2; }
    .pn10-s3 { animation-name: pn10-s3; }
    .pn10-s4 { animation-name: pn10-s4; }
    @keyframes pn10-s1 { 0%, 8% { opacity: 0 } 12%, 100% { opacity: 1 } }
    @keyframes pn10-s2 { 0%, 20% { opacity: 0 } 24%, 100% { opacity: 1 } }
    @keyframes pn10-s3 { 0%, 32% { opacity: 0 } 36%, 100% { opacity: 1 } }
    @keyframes pn10-s4 { 0%, 44% { opacity: 0 } 50%, 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .pn10-anim { animation: none !important; } }
  </style>
  <defs>
    <marker id="pn10-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="pn10-ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="499" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Spelling the next product's code</text>

  <!-- ===== Left: what the shopper viewed ===== -->
  <text x="16" y="80" font-size="15" font-weight="700" fill="#065F46">Shopper viewed</text>
  <g font-size="15" fill="#1E1B4B">
    <rect x="16" y="92" width="160" height="46" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="28" y="111">🥾 Hiking boots</text>
    <text x="28" y="130" font-size="14" font-weight="700" fill="#065F46">7-3-12</text>
    <rect x="16" y="144" width="160" height="46" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="28" y="163">🧦 Wool socks</text>
    <text x="28" y="182" font-size="14" font-weight="700" fill="#065F46">7-3-40</text>
    <rect x="16" y="196" width="160" height="46" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="28" y="215">🧥 Rain jacket</text>
    <text x="28" y="234" font-size="14" font-weight="700" fill="#065F46">7-1-4</text>
  </g>
  <path d="M96,248 V270" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pn10-ag)"/>

  <!-- the model -->
  <rect x="16" y="278" width="160" height="104" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="96" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Sequence model</text>
  <text x="96" y="322" text-anchor="middle" font-size="14" fill="#1E1B4B">writes the next code</text>
  <g font-size="26" font-weight="700" fill="#7C3AED" text-anchor="middle">
    <text class="pn10-anim pn10-s1" x="58" y="362">7</text>
    <text class="pn10-anim pn10-s2" x="77" y="360" font-size="20" fill="#A78BFA">-</text>
    <text class="pn10-anim pn10-s2" x="96" y="362">1</text>
    <text class="pn10-anim pn10-s3" x="115" y="360" font-size="20" fill="#A78BFA">-</text>
    <text class="pn10-anim pn10-s3" x="134" y="362">9</text>
  </g>

  <!-- ===== Right: the learned code tree ===== -->
  <rect x="192" y="58" width="432" height="342" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="208" y="84" font-size="15" font-weight="700" fill="#1E1B4B">Product codes</text>
  <text x="608" y="84" text-anchor="end" font-size="14" fill="#6B7280">aisles have numbers, not names</text>
  <g font-size="14" fill="#4B5563" text-anchor="middle">
    <text x="232" y="112">aisle</text>
    <text x="306" y="112">shelf</text>
    <text x="378" y="112">slot</text>
  </g>

  <!-- grey connectors (all branches) -->
  <g fill="none" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M249,259 H269 V210 H289"/>
    <path d="M269,259 V327 H289"/>
    <path d="M323,210 H360"/>
    <path d="M341,210 V172 H360"/>
    <path d="M341,210 V248 H360"/>
    <path d="M323,327 H341 V308 H360"/>
    <path d="M341,327 V346 H360"/>
  </g>

  <!-- collapsed sibling aisles -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="215" y="124" width="34" height="28" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="232" y="143" fill="#9CA3AF">3</text>
    <text x="268" y="143" fill="#9CA3AF">…</text>
    <rect x="215" y="364" width="34" height="28" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="232" y="383" fill="#9CA3AF">12</text>
    <text x="268" y="383" fill="#9CA3AF">…</text>
  </g>

  <!-- neutral chips -->
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#1E1B4B">
    <rect x="215" y="245" width="34" height="28" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <rect x="289" y="196" width="34" height="28" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <rect x="289" y="313" width="34" height="28" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="306" y="332">3</text>
    <rect x="360" y="196" width="36" height="28" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  </g>

  <!-- leaves -->
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#065F46">
    <rect x="360" y="158" width="36" height="28" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="378" y="177">4</text>
    <rect x="360" y="294" width="36" height="28" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="378" y="313">12</text>
    <rect x="360" y="332" width="36" height="28" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="378" y="351">40</text>
    <rect x="360" y="234" width="36" height="28" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="378" y="253" fill="#92400E">15</text>
  </g>
  <g font-size="15" fill="#1E1B4B">
    <text x="406" y="177">🧥 Rain jacket</text>
    <text x="406" y="253">☔ Rain poncho</text>
    <text x="406" y="313">🥾 Hiking boots</text>
    <text x="406" y="351">🧦 Wool socks</text>
  </g>
  <g font-size="14" fill="#065F46" text-anchor="end">
    <text x="608" y="177">viewed</text>
    <text x="608" y="313">viewed</text>
    <text x="608" y="351">viewed</text>
  </g>
  <rect x="534" y="237" width="74" height="22" rx="11" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="571" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">new today</text>
  <text x="406" y="274" font-size="14" fill="#92400E">code from its description</text>

  <!-- ===== the spelled path (animated) ===== -->
  <path class="pn10-anim pn10-s1" d="M176,330 C196,330 196,259 211,259" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pn10-ap)"/>
  <g class="pn10-anim pn10-s1">
    <rect x="215" y="245" width="34" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  </g>
  <g class="pn10-anim pn10-s2">
    <path d="M249,259 H269 V210 H289" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="289" y="196" width="34" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  </g>
  <g class="pn10-anim pn10-s3">
    <rect x="354" y="192" width="258" height="36" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <path d="M323,210 H360" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="360" y="196" width="36" height="28" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="604" y="215" text-anchor="end" font-size="14" font-weight="700" fill="#7C3AED">next</text>
  </g>

  <!-- labels of the spelled path (always visible) -->
  <g font-size="15" font-weight="700" fill="#4C1D95" text-anchor="middle">
    <text x="232" y="264">7</text>
    <text x="306" y="215">1</text>
    <text x="378" y="215">9</text>
  </g>
  <text x="406" y="215" font-size="15" font-weight="700" fill="#4C1D95">👖 Rain trousers</text>

  <!-- ===== result row ===== -->
  <g class="pn10-anim pn10-s4">
    <rect x="96" y="414" width="76" height="34" rx="9" fill="#7C3AED"/>
    <text x="134" y="437" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">7-1-9</text>
    <path d="M178,431 H206" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pn10-ap)"/>
    <rect x="212" y="414" width="208" height="34" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="316" y="437" text-anchor="middle" font-size="15" fill="#1E1B4B">catalog: <tspan font-weight="700">Rain trousers</tspan></text>
    <path d="M426,431 H454" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pn10-ag)"/>
    <rect x="460" y="414" width="84" height="34" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="502" y="437" text-anchor="middle" font-size="15" fill="#1E1B4B">ranking</text>
  </g>

  <text x="320" y="480" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Similar products share a code's start, so the model <tspan fill="#7C3AED">spells</tspan> its way there.</text>
</svg>
