<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 568" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb129-title pb129-desc">
<title id="pb129-title">Implicit signals differ in how much intent they carry</title>
<desc id="pb129-desc">Six implicit signals ordered from frequent and cheap to rare and deliberate: impression, click or tap, extended view or read, add to cart or save, purchase or subscribe, plus return or cancel as a strong negative. Intent strength rises down the list while ambiguity falls. A composite score weights each signal type, for example click weight 1 and purchase weight 5, so 3 clicks plus 1 purchase give 3 times 1 plus 1 times 5 equals 8: one purchase outweighs a handful of clicks.</desc>
