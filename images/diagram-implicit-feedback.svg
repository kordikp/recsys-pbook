<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="strengthGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="barGreenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="498" height="398" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E1B4B">Implicit Feedback Signals</text>
  <text x="280" y="49" text-anchor="middle" font-size="11" fill="#6B7280">Ranked by signal strength (strongest at top)</text>

  <!-- Signal strength arrow on left -->
  <line x1="58" y1="82" x2="58" y2="345" stroke="url(#strengthGrad)" stroke-width="4"/>
  <path d="M52,82 L58,68 L64,82 Z" fill="#10B981"/>
  <text x="58" y="62" text-anchor="middle" font-size="11" fill="#6B7280">Strong</text>
  <text x="58" y="365" text-anchor="middle" font-size="11" fill="#6B7280">Weak</text>
  <text x="30" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#10B981" transform="rotate(-90,30,218)">Signal Strength</text>

  <!-- Bar 1: Purchase -->
  <g transform="translate(90,78)">
    <rect width="370" height="36" rx="6" fill="url(#barGreenGrad)"/>
    <text x="16" y="23" font-size="13" font-weight="bold" fill="#1E1B4B">Purchase / Subscribe</text>
    <text x="354" y="23" text-anchor="end" font-size="11" font-weight="bold" fill="#1E1B4B">strongest</text>
  </g>

  <!-- Bar 2: Save/Bookmark -->
  <g transform="translate(90,124)">
    <rect width="310" height="36" rx="6" fill="url(#barGreenGrad)" opacity="0.82"/>
    <text x="16" y="23" font-size="13" font-weight="bold" fill="#1E1B4B">Save / Bookmark / Favorite</text>
  </g>

  <!-- Bar 3: Complete -->
  <g transform="translate(90,170)">
    <rect width="260" height="36" rx="6" fill="url(#barGreenGrad)" opacity="0.64"/>
    <text x="16" y="23" font-size="13" font-weight="bold" fill="#1E1B4B">Complete (watch/read 80%+)</text>
  </g>

  <!-- Bar 4: Click/View -->
  <g transform="translate(90,216)">
    <rect width="200" height="36" rx="6" fill="url(#barGreenGrad)" opacity="0.46"/>
    <text x="16" y="23" font-size="12" font-weight="bold" fill="#1E1B4B">Click / View</text>
  </g>

  <!-- Bar 5: Impression -->
  <g transform="translate(90,262)">
    <rect width="130" height="36" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="16" y="23" font-size="11" font-weight="bold" fill="#6B7280">Impression</text>
  </g>

  <!-- Bar 6: Skip/Dismiss -->
  <g transform="translate(90,308)">
    <rect width="170" height="36" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="16" y="23" font-size="12" font-weight="bold" fill="#EF4444">Skip / Dismiss</text>
    <text x="154" y="23" text-anchor="end" font-size="11" fill="#EF4444">negative</text>
  </g>

  <!-- Clear right-side annotations -->
  <g transform="translate(414,130)">
    <text x="0" y="0" font-size="11" fill="#6B7280">Explicit</text>
    <text x="0" y="15" font-size="11" fill="#6B7280">commitment</text>
  </g>
  <g transform="translate(310,232)">
    <text x="0" y="0" font-size="11" fill="#6B7280">Low effort,</text>
    <text x="0" y="15" font-size="11" fill="#6B7280">high volume</text>
  </g>

  <!-- Separator between positive and negative -->
  <line x1="90" y1="303" x2="460" y2="303" stroke="#EF4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
</svg>