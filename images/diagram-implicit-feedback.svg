<text x="320" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Six signals, six levels of intent</text>
<text x="320" y="62" text-anchor="middle" font-size="14" fill="#6B7280">Frequent and cheap at the top · rare and deliberate below</text>
