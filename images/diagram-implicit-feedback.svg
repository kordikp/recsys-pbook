<text x="604" y="444" text-anchor="end" font-size="18" fill="#1E1B4B" font-style="italic">r<tspan font-size="14" dy="5">ij</tspan><tspan dy="-5" font-style="normal"> = Σ</tspan><tspan font-size="14" dy="5" font-style="normal">k</tspan><tspan dy="-5"> w</tspan><tspan font-size="14" dy="5">k</tspan><tspan dy="-5" font-style="normal"> · </tspan>a<tspan font-size="14" dy="5">ij</tspan><tspan font-size="14" dy="-12" font-style="normal">(k)</tspan></text>
<line x1="36" y1="460" x2="604" y2="460" stroke="#C4B5FD" stroke-width="1"/>
<text x="36" y="492" font-size="15" fill="#1E1B4B">e.g. w<tspan font-size="14" dy="4">click</tspan><tspan dy="-4"> = 1, w</tspan><tspan font-size="14" dy="4">purchase</tspan><tspan dy="-4"> = 5:</tspan></text>
