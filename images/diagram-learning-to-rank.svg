<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" role="img" aria-labelledby="pb130-title pb130-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb130-title">Learning to rank: three ways to grade the same list</title>
<desc id="pb130-desc">One toy query, three candidates, and a model that ranks B above A. Pointwise scores each item on its own (MSE 0.30) and never checks the order. Pairwise checks every pair and finds 1 of 3 flipped. Listwise scores the whole list with top positions weighted most (NDCG@3 = 0.80). Pointwise grades items; pairwise and listwise grade the order.</desc>
<style>.pb130-num{font-variant-numeric:tabular-nums}</style>
<rect x=".5" y=".5" width="639" height="483" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Three ways to grade the same ranking</text>
<text x="320" y="58" text-anchor="middle" font-size="14" fill="#6B7280">Toy query: three candidates, and the model puts B above A</text>
<rect x="20" y="72" width="600" height="92" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="36" y="100" font-size="14" fill="#6B7280">item</text>
<text x="36" y="126" font-size="14" font-weight="600" fill="#065F46">true label y</text>
<text x="36" y="150" font-size="14" font-weight="600" fill="#4C1D95">model score f</text>
<rect x="183" y="84" width="26" height="22" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="196" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">A</text>
<g class="pb130-num"><text x="196" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">2</text><text x="196" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">1.2</text></g>
<rect x="231" y="84" width="26" height="22" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="244" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">B</text>
<g class="pb130-num"><text x="244" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">1</text><text x="244" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">1.5</text></g>
<rect x="279" y="84" width="26" height="22" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="292" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">C</text>
<g class="pb130-num"><text x="292" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">0</text><text x="292" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">0.1</text></g>
<line x1="330" y1="86" x2="330" y2="150" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="350" y="107" font-size="14" font-weight="600" fill="#065F46">ideal order</text>
<text x="350" y="143" font-size="14" font-weight="600" fill="#4C1D95">model order</text>
<rect x="451" y="91" width="26" height="22" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="464" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">A</text>
<rect x="485" y="91" width="26" height="22" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="498" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">B</text>
<rect x="519" y="91" width="26" height="22" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="532" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">C</text>
<rect x="451" y="127" width="26" height="22" rx="6" fill="#EDE9FE" stroke="#F59E0B" stroke-width="2"/><text x="464" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">B</text>
<rect x="485" y="127" width="26" height="22" rx="6" fill="#EDE9FE" stroke="#F59E0B" stroke-width="2"/><text x="498" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">A</text>
<rect x="519" y="127" width="26" height="22" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="532" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">C</text>
<text x="556" y="143" font-size="14" font-weight="700" fill="#92400E">swap</text>
<rect x="20" y="180" width="192" height="254" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="34" y="206" font-size="17" font-weight="700" fill="#1E1B4B">Pointwise</text>
<text x="34" y="227" font-size="14" fill="#6B7280">one item at a time</text>
<rect x="34" y="240" width="26" height="22" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="47" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">A</text>
<g class="pb130-num"><text x="70" y="256" font-size="15" fill="#4B5563">(1.2 − 2)²</text><text x="198" y="256" text-anchor="end" font-size="15" font-weight="700" fill="#1E1B4B">0.64</text></g>
<rect x="34" y="268" width="26" height="22" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="47" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">B</text>
<g class="pb130-num"><text x="70" y="284" font-size="15" fill="#4B5563">(1.5 − 1)²</text><text x="198" y="284" text-anchor="end" font-size="15" font-weight="700" fill="#1E1B4B">0.25</text></g>
<rect x="34" y="296" width="26" height="22" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="47" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">C</text>
<g class="pb130-num"><text x="70" y="312" font-size="15" fill="#4B5563">(0.1 − 0)²</text><text x="198" y="312" text-anchor="end" font-size="15" font-weight="700" fill="#1E1B4B">0.01</text></g>
<text x="34" y="340" font-size="14" fill="#6B7280">fits values, not order</text>
<line x1="34" y1="356" x2="198" y2="356" stroke="#E5E7EB" stroke-width="1.5"/>
<g class="pb130-num"><text x="34" y="380" font-size="17" font-weight="700" fill="#1E1B4B">MSE = 0.30</text></g>
<text x="34" y="401" font-size="14" fill="#4B5563">position: ignored</text>
<text x="34" y="420" font-size="14" fill="#6B7280">MSE, cross-entropy</text>
<rect x="224" y="180" width="192" height="254" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="238" y="206" font-size="17" font-weight="700" fill="#1E1B4B">Pairwise</text>
<text x="238" y="227" font-size="14" fill="#6B7280">one pair at a time</text>
<rect x="230" y="236" width="180" height="28" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
<text x="238" y="256" font-size="15" font-weight="700" fill="#1E1B4B">A ≻ B</text>
<g class="pb130-num"><text x="292" y="256" font-size="15" fill="#4B5563">1.2 &lt; 1.5</text></g>
<text x="400" y="256" text-anchor="end" font-size="17" font-weight="700" fill="#92400E">✗</text>
<text x="238" y="284" font-size="15" font-weight="700" fill="#1E1B4B">A ≻ C</text>
<g class="pb130-num"><text x="292" y="284" font-size="15" fill="#4B5563">1.2 &gt; 0.1</text></g>
<text x="400" y="284" text-anchor="end" font-size="17" font-weight="700" fill="#10B981">✓</text>
<text x="238" y="312" font-size="15" font-weight="700" fill="#1E1B4B">B ≻ C</text>
<g class="pb130-num"><text x="292" y="312" font-size="15" fill="#4B5563">1.5 &gt; 0.1</text></g>
<text x="400" y="312" text-anchor="end" font-size="17" font-weight="700" fill="#10B981">✓</text>
<text x="238" y="340" font-size="14" fill="#6B7280">only score gaps matter</text>
<line x1="238" y1="356" x2="402" y2="356" stroke="#E5E7EB" stroke-width="1.5"/>
<g class="pb130-num"><text x="238" y="380" font-size="17" font-weight="700" fill="#92400E">1 of 3 pairs wrong</text></g>
<text x="238" y="401" font-size="14" fill="#4B5563">position: indirect</text>
<text x="238" y="420" font-size="14" fill="#6B7280">BPR, RankNet, hinge</text>
<rect x="428" y="180" width="192" height="254" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="442" y="206" font-size="17" font-weight="700" fill="#1E1B4B">Listwise</text>
<text x="442" y="227" font-size="14" fill="#6B7280">gain × position discount</text>
<text x="442" y="256" font-size="15" fill="#6B7280">1.</text>
<rect x="459" y="240" width="26" height="22" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="472" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">B</text>
<g class="pb130-num"><text x="606" y="256" text-anchor="end" font-size="15" fill="#4B5563">1 × 1.00</text></g>
<text x="442" y="284" font-size="15" fill="#6B7280">2.</text>
<rect x="459" y="268" width="26" height="22" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="472" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">A</text>
<g class="pb130-num"><text x="606" y="284" text-anchor="end" font-size="15" fill="#4B5563">3 × 0.63</text></g>
<text x="442" y="312" font-size="15" fill="#6B7280">3.</text>
<rect x="459" y="296" width="26" height="22" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="472" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">C</text>
<g class="pb130-num"><text x="606" y="312" text-anchor="end" font-size="15" fill="#4B5563">0 × 0.50</text></g>
<text x="442" y="340" font-size="14" fill="#6B7280">2.89 ÷ ideal 3.63</text>
<line x1="442" y1="356" x2="606" y2="356" stroke="#E5E7EB" stroke-width="1.5"/>
<g class="pb130-num"><text x="442" y="380" font-size="17" font-weight="700" fill="#1E1B4B">NDCG@3 = 0.80</text></g>
<text x="442" y="401" font-size="14" fill="#4B5563">position: explicit</text>
<text x="442" y="420" font-size="14" fill="#6B7280">LambdaMART, SoftRank</text>
<text x="320" y="462" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Pointwise grades items; pairwise and listwise <tspan fill="#7C3AED">grade the order</tspan>.</text>
</svg>
