<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 390" width="650" height="390" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowDownBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrowDownGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10B981"/>
    </marker>
    <marker id="arrowDownPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowRightAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="648" height="388" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="325" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Learning to Rank Approaches</text>
  <text x="325" y="47" text-anchor="middle" font-size="11" fill="#6B7280">Three paradigms for training ranking models</text>

  <line x1="217" y1="58" x2="217" y2="268" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="433" y1="58" x2="433" y2="268" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Pointwise -->
  <g transform="translate(108,0)">
    <rect x="-80" y="58" width="160" height="34" rx="7" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="0" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Pointwise</text>

    <rect x="-50" y="106" width="100" height="72" rx="7" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <rect x="-38" y="117" width="76" height="10" rx="3" fill="#E0F2FE"/>
    <rect x="-38" y="133" width="54" height="8" rx="3" fill="#E0F2FE"/>
    <text x="-38" y="160" font-size="11" fill="#6B7280">score =</text>
    <text x="38" y="160" text-anchor="end" font-size="11" font-weight="700" fill="#0EA5E9">3.5</text>

    <line x1="0" y1="180" x2="0" y2="194" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrowDownBlue)"/>

    <rect x="-66" y="202" width="132" height="30" rx="7" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1"/>
    <text x="0" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">MSE / Cross-Entropy</text>

    <text x="0" y="249" text-anchor="middle" font-size="11" fill="#6B7280">Predict absolute score</text>
    <text x="0" y="264" text-anchor="middle" font-size="11" fill="#6B7280">for each item independently</text>
  </g>

  <!-- Pairwise -->
  <g transform="translate(325,0)">
    <rect x="-80" y="58" width="160" height="34" rx="7" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Pairwise</text>

    <rect x="-60" y="106" width="120" height="72" rx="7" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <rect x="-50" y="116" width="44" height="22" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
    <text x="-28" y="132" text-anchor="middle" font-size="11" fill="#1E1B4B">item A</text>
    <text x="0" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">&gt;</text>
    <rect x="6" y="116" width="44" height="22" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
    <text x="28" y="132" text-anchor="middle" font-size="11" fill="#1E1B4B">item B</text>
    <text x="0" y="162" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">P(A &gt; B) = ?</text>

    <line x1="0" y1="180" x2="0" y2="194" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowDownGreen)"/>

    <rect x="-62" y="202" width="124" height="30" rx="7" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
    <text x="0" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">BPR / Hinge Loss</text>

    <text x="0" y="249" text-anchor="middle" font-size="11" fill="#6B7280">Learn relative ordering</text>
    <text x="0" y="264" text-anchor="middle" font-size="11" fill="#6B7280">between item pairs</text>
  </g>

  <!-- Listwise -->
  <g transform="translate(542,0)">
    <rect x="-80" y="58" width="160" height="34" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="0" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Listwise</text>

    <rect x="-50" y="106" width="100" height="72" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="-40" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">1</text>
    <rect x="-30" y="113" width="68" height="11" rx="3" fill="#7C3AED"/>
    <text x="-40" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">2</text>
    <rect x="-30" y="129" width="56" height="11" rx="3" fill="#EDE9FE"/>
    <text x="-40" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">3</text>
    <rect x="-30" y="145" width="44" height="11" rx="3" fill="#EDE9FE"/>
    <text x="0" y="171" text-anchor="middle" font-size="11" fill="#6B7280">full ranking</text>

    <line x1="0" y1="180" x2="0" y2="194" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowDownPurple)"/>

    <rect x="-68" y="202" width="136" height="30" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
    <text x="0" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">NDCG Optimization</text>

    <text x="0" y="249" text-anchor="middle" font-size="11" fill="#6B7280">Directly optimize the</text>
    <text x="0" y="264" text-anchor="middle" font-size="11" fill="#6B7280">entire ranked list metric</text>
  </g>

  <!-- Comparison -->
  <rect x="30" y="278" width="590" height="68" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="325" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Comparison</text>

  <text x="108" y="315" text-anchor="middle" font-size="11" font-weight="600" fill="#0EA5E9">Complexity</text>
  <text x="108" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#0EA5E9">Simple</text>

  <text x="325" y="315" text-anchor="middle" font-size="11" font-weight="600" fill="#10B981">Complexity</text>
  <text x="325" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#10B981">Medium</text>

  <text x="542" y="315" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">Complexity</text>
  <text x="542" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#7C3AED">Highest</text>

  <text x="325" y="362" text-anchor="middle" font-size="11" font-weight="600" fill="#D97706">Ranking quality improvement</text>
  <line x1="148" y1="374" x2="502" y2="374" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowRightAmber)"/>
</svg>