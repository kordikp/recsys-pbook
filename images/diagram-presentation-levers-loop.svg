<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="pn15-title pn15-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pn15-title">Five presentation levers and the loop they feed</title>
  <desc id="pn15-desc">A streaming home screen has five levers the product team controls without touching the model: placement, slot count, row label, artwork and a Not interested control. The layout decides what people click, clicks become logs, and logs train the next model, so position bias leaks into training unless every impression is logged with its position, row and device.</desc>
  <defs>
    <marker id="pn15-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#7C3AED"/>
    </marker>
    <clipPath id="pn15-screen">
      <rect x="30" y="70" width="192" height="330"/>
    </clipPath>
  </defs>

  <rect x=".5" y=".5" width="639" height="469" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <!-- column headings -->
  <text x="24" y="40" font-size="17" font-weight="700" fill="#1E1B4B">Five levers, same model</text>
  <text x="384" y="40" font-size="17" font-weight="700" fill="#1E1B4B">What the model learns</text>

  <!-- phone -->
  <rect x="20" y="58" width="212" height="354" rx="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="106" y="68" width="40" height="6" rx="3" fill="#E5E7EB"/>

  <g clip-path="url(#pn15-screen)">
    <!-- row 1 -->
    <text x="44" y="100" font-size="14" fill="#6B7280">Continue watching</text>
    <rect x="44" y="108" width="34" height="34" rx="5" fill="#E5E7EB"/>
    <rect x="84" y="108" width="34" height="34" rx="5" fill="#E5E7EB"/>
    <rect x="124" y="108" width="34" height="34" rx="5" fill="#E5E7EB"/>
    <rect x="164" y="108" width="34" height="34" rx="5" fill="#E5E7EB"/>
    <rect x="204" y="108" width="34" height="34" rx="5" fill="#E5E7EB"/>

    <!-- row 2 (highlighted): 4 tiles + a cut-off 5th -->
    <rect x="26" y="156" width="200" height="116" rx="10" fill="#EDE9FE"/>
    <rect x="44" y="192" width="34" height="58" rx="5" fill="#DDD6FE"/>
    <rect x="84" y="192" width="34" height="58" rx="5" fill="#DDD6FE"/>
    <circle cx="101" cy="216" r="7" fill="#7C3AED"/>
    <path d="M89,250 C89,229 113,229 113,250 Z" fill="#7C3AED"/>
    <rect x="124" y="192" width="34" height="58" rx="5" fill="#DDD6FE"/>
    <rect x="164" y="192" width="34" height="58" rx="5" fill="#DDD6FE"/>
    <rect x="204" y="192" width="34" height="58" rx="5" fill="#DDD6FE"/>

    <!-- row 3 -->
    <text x="44" y="300" font-size="14" fill="#6B7280">Trending now</text>
    <rect x="44" y="308" width="34" height="34" rx="5" fill="#E5E7EB"/>
    <rect x="84" y="308" width="34" height="34" rx="5" fill="#E5E7EB"/>
    <rect x="124" y="308" width="34" height="34" rx="5" fill="#E5E7EB"/>
    <rect x="164" y="308" width="34" height="34" rx="5" fill="#E5E7EB"/>
    <rect x="204" y="308" width="34" height="34" rx="5" fill="#E5E7EB"/>
    <text x="126" y="372" font-size="14" text-anchor="middle" fill="#6B7280">… 37 more rows</text>
  </g>
  <rect x="26" y="156" width="200" height="116" rx="10" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="44" y="180" font-size="14" font-weight="700" fill="#4C1D95">Because you watched <tspan font-style="italic">Dark</tspan></text>
  <rect x="96" y="396" width="60" height="4" rx="2" fill="#D1D5DB"/>

  <!-- "Not interested" menu dropping from tile 4 (badge 5 marks its menu button) -->
  <rect x="118" y="236" width="102" height="28" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="169" y="255" font-size="14" text-anchor="middle" fill="#1E1B4B">Not interested</text>

  <!-- numbered badges on the phone -->
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="26" cy="221" r="11" fill="#7C3AED"/><text x="26" y="226">1</text>
    <circle cx="226" cy="221" r="11" fill="#7C3AED"/><text x="226" y="226">2</text>
    <circle cx="26" cy="156" r="11" fill="#7C3AED"/><text x="26" y="161">3</text>
    <circle cx="84" cy="192" r="11" fill="#7C3AED"/><text x="84" y="197">4</text>
    <circle cx="192" cy="200" r="11" fill="#7C3AED"/><text x="192" y="205">5</text>
  </g>

  <!-- legend -->
  <g font-size="14">
    <circle cx="254" cy="118" r="11" fill="#7C3AED"/><text x="254" y="123" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
    <text x="272" y="123" font-size="15" font-weight="700" fill="#1E1B4B">Placement</text>
    <text x="272" y="141" fill="#4B5563">row 2 of 40</text>

    <circle cx="254" cy="170" r="11" fill="#7C3AED"/><text x="254" y="175" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
    <text x="272" y="175" font-size="15" font-weight="700" fill="#1E1B4B">Slot count</text>
    <text x="272" y="193" fill="#4B5563">4 on a phone</text>

    <circle cx="254" cy="222" r="11" fill="#7C3AED"/><text x="254" y="227" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
    <text x="272" y="227" font-size="15" font-weight="700" fill="#1E1B4B">Row label</text>
    <text x="272" y="245" fill="#4B5563">says why</text>

    <circle cx="254" cy="274" r="11" fill="#7C3AED"/><text x="254" y="279" text-anchor="middle" font-weight="700" fill="#FFFFFF">4</text>
    <text x="272" y="279" font-size="15" font-weight="700" fill="#1E1B4B">Artwork</text>
    <text x="272" y="297" fill="#4B5563">per viewer</text>

    <circle cx="254" cy="326" r="11" fill="#7C3AED"/><text x="254" y="331" text-anchor="middle" font-weight="700" fill="#FFFFFF">5</text>
    <text x="272" y="331" font-size="15" font-weight="700" fill="#1E1B4B">Feedback</text>
    <text x="272" y="349" fill="#4B5563">must really act</text>
  </g>

  <!-- loop -->
  <g stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#pn15-head)">
    <line x1="488" y1="114" x2="518" y2="114"/>
    <line x1="574" y1="140" x2="574" y2="294"/>
    <line x1="520" y1="322" x2="490" y2="322"/>
    <line x1="434" y1="298" x2="434" y2="142"/>
  </g>

  <rect x="384" y="92" width="100" height="44" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="434" y="119" font-size="15" font-weight="700" text-anchor="middle" fill="#1E1B4B">Layout</text>

  <rect x="524" y="92" width="100" height="44" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="574" y="119" font-size="15" font-weight="700" text-anchor="middle" fill="#065F46">Clicks</text>

  <rect x="524" y="300" width="100" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="574" y="327" font-size="15" font-weight="700" text-anchor="middle" fill="#1E1B4B">Logs</text>

  <rect x="384" y="300" width="100" height="44" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="434" y="327" font-size="15" font-weight="700" text-anchor="middle" fill="#4C1D95">Next model</text>


  <!-- amber: position bias, sitting on the Clicks -> Logs arrow -->
  <rect x="452" y="160" width="168" height="76" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="464" y="183" font-size="15" font-weight="700" fill="#92400E">⚠ Position bias</text>
  <text x="464" y="203" font-size="14" fill="#1E1B4B">top tiles get clicked</text>
  <text x="464" y="222" font-size="14" fill="#1E1B4B">partly for being on top</text>

  <!-- green: the fix, attached to Logs -->
  <line x1="574" y1="346" x2="574" y2="360" stroke="#10B981" stroke-width="2"/>
  <rect x="412" y="360" width="212" height="50" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="424" y="381" font-size="14" font-weight="700" fill="#065F46">✓ Log position, row, device</text>
  <text x="424" y="400" font-size="14" fill="#065F46">with every impression</text>

  <!-- takeaway -->
  <text x="320" y="448" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1B4B">The <tspan fill="#7C3AED">interface</tspan> decides what data your next model learns from.</text>
</svg>
