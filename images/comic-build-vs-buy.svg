<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The House Playlist Ate the House Special</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="32" y="76" width="190" height="52" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="127" y="98" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="127">Let's build our own playlist</tspan>
    <tspan x="127" dy="17">recommender.</tspan>
  </text>
  <rect x="238" y="82" width="136" height="42" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="306" y="107" font-size="12.5" fill="#1E1B4B" text-anchor="middle">For background music?</text>
  <circle cx="126" cy="177" r="10" fill="#7C3AED"/>
  <path d="M126 188 L126 231 M126 198 L105 213 M126 198 L148 211 M126 231 L111 251 M126 231 L142 251" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="302" cy="177" r="10" fill="#10B981"/>
  <path d="M302 188 L302 231 M302 199 L283 213 M302 199 L322 212 M302 231 L287 251 M302 231 L317 251" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M202 174 L202 205 M202 174 L222 169 L222 197 M202 205 C192 198 190 212 201 211 M222 197 C212 190 210 204 221 203" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">A café team treats personalized playlists as a small feature.</text>

  <!-- Panel 2 -->
  <rect x="426" y="86" width="94" height="72" rx="7" fill="#FEF3C7" stroke="#D97706"/>
  <text x="473" y="109" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">
    <tspan x="473">PROTOTYPE</tspan>
    <tspan x="473" dy="25" font-size="17">3 MONTHS</tspan>
  </text>
  <rect x="574" y="113" width="158" height="102" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="653" y="143" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="653" font-weight="700">NOW PLAYING</tspan>
    <tspan x="653" dy="24">Mira → lo-fi</tspan>
    <tspan x="653" dy="19" fill="#7C3AED">94% match</tspan>
  </text>
  <circle cx="480" cy="207" r="10" fill="#10B981"/>
  <circle cx="531" cy="207" r="10" fill="#7C3AED"/>
  <path d="M480 218 L480 257 M480 228 L500 237 M480 257 L467 276 M480 257 L493 276 M531 218 L531 257 M531 228 L510 237 M531 257 L518 276 M531 257 L544 276" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M744 145 L744 169 M744 145 L756 141 M744 169 C735 163 734 176 743 175" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Three months later, the prototype reads the room.</text>

  <!-- Panel 3 -->
  <rect x="34" y="360" width="101" height="72" rx="7" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="84.5" y="383" font-size="12" font-weight="700" fill="#EF4444" text-anchor="middle">
    <tspan x="84.5">OPERATIONS</tspan>
    <tspan x="84.5" dy="25" font-size="17">MONTH 18</tspan>
  </text>
  <rect x="230" y="374" width="139" height="86" rx="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="299.5" y="401" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="299.5" font-weight="700" fill="#EF4444">2:13 AM</tspan>
    <tspan x="299.5" dy="23">MODEL DRIFT</tspan>
    <tspan x="299.5" dy="18">Please retune me.</tspan>
  </text>
  <circle cx="151" cy="467" r="10" fill="#10B981"/>
  <circle cx="192" cy="477" r="10" fill="#7C3AED"/>
  <path d="M151 478 L151 521 M151 488 L171 497 M151 521 L138 543 M151 521 L164 543 M192 488 L188 527 M190 498 L211 483 M188 527 L174 547 M188 527 L203 547" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M210 480 L221 469 M218 466 L224 472 M207 483 L213 489" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Eighteen months of uptime, tuning, and midnight alerts follow.</text>

  <!-- Panel 4 -->
  <rect x="426" y="356" width="176" height="48" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="514" y="385" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Could I get a coffee?</text>
  <rect x="638" y="410" width="126" height="96" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="701" y="438" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="701" font-weight="700">PLAYLIST: LIVE</tspan>
    <tspan x="701" dy="23">ESPRESSO BAR:</tspan>
    <tspan x="701" dy="18" fill="#EF4444">BACKLOG</tspan>
  </text>
  <circle cx="467" cy="459" r="10" fill="#0EA5E9"/>
  <circle cx="548" cy="459" r="10" fill="#10B981"/>
  <circle cx="596" cy="459" r="10" fill="#7C3AED"/>
  <path d="M467 470 L467 520 M467 481 L491 491 M467 520 L453 545 M467 520 L481 545 M548 470 L548 520 M548 481 L525 493 M548 481 L570 492 M548 520 L534 545 M548 520 L562 545 M596 470 L596 520 M596 481 L574 492 M596 481 L616 489 M596 520 L582 545 M596 520 L610 545" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M493 486 L513 486 L510 503 L496 503 Z M513 489 C523 488 522 499 512 498" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The playlist shipped. The espresso bar stayed on the roadmap.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Build if personalization is core; buy if it's a feature—after weighing ops and opportunity cost.</text>
</svg>