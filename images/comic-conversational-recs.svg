<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb052-title pb052-desc">
<title id="pb052-title">Tell me what I want—then check the receipts</title>
<desc id="pb052-desc">Four-panel comic. You ask a chat AI for something cozy with real stakes and one smug dragon, and it understands every nuance. Alone, it suggests Dragon Tea Party, which you read last month and which is sold out: it cannot see your history or the shop's stock. The recommender alone checks your receipts, sees dragons, and suggests the grim Dragon War VII, ignoring the word cozy. Together, the chat AI turns your words into a query, the recommender picks Tea and Talons from your history and the live catalog, and the chat AI explains the pick: cozy, real stakes, a very smug dragon, new to you and in stock.</desc>
<defs>
<marker id="pb052-ha" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F59E0B"/></marker>
<marker id="pb052-hp" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
</defs>
