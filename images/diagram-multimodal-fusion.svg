<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowRed" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="698" height="338" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Multimodal Fusion Strategies</text>
  <text x="350" y="44" text-anchor="middle" font-size="11" fill="#6B7280">How to combine text, image, and audio signals in recommendations</text>

  <line x1="233" y1="58" x2="233" y2="320" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="467" y1="58" x2="467" y2="320" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Early Fusion -->
  <g transform="translate(117 0)">
    <rect x="-95" y="58" width="190" height="30" rx="7" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="0" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Early Fusion</text>

    <rect x="-83" y="102" width="50" height="27" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="-58" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Text</text>

    <rect x="-25" y="102" width="50" height="27" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="0" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Image</text>

    <rect x="33" y="102" width="50" height="27" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="58" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Audio</text>

    <line x1="-58" y1="129" x2="-14" y2="151" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="129" x2="0" y2="151" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="58" y1="129" x2="14" y2="151" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="-47" y="151" width="94" height="28" rx="5" fill="#FEF3C7" stroke="#D97706"/>
    <text x="0" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">Concatenate</text>

    <line x1="0" y1="179" x2="0" y2="190" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="-50" y="190" width="100" height="30" rx="6" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="0" y="209" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Shared Model</text>

    <line x1="0" y1="220" x2="0" y2="239" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="-38" y="239" width="76" height="28" rx="5" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="0" y="257" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Output</text>

    <text x="0" y="294" text-anchor="middle" font-size="11" fill="#6B7280">Combine raw features first,</text>
    <text x="0" y="310" text-anchor="middle" font-size="11" fill="#6B7280">then learn jointly</text>
  </g>

  <!-- Late Fusion -->
  <g transform="translate(350 0)">
    <rect x="-95" y="58" width="190" height="30" rx="7" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Late Fusion</text>

    <rect x="-87" y="102" width="54" height="27" rx="5" fill="#D1FAE5" stroke="#10B981"/>
    <text x="-60" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Text</text>
    <line x1="-60" y1="129" x2="-60" y2="143" stroke="#10B981" stroke-width="1.5"/>

    <rect x="-27" y="102" width="54" height="27" rx="5" fill="#D1FAE5" stroke="#10B981"/>
    <text x="0" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Image</text>
    <line x1="0" y1="129" x2="0" y2="143" stroke="#10B981" stroke-width="1.5"/>

    <rect x="33" y="102" width="54" height="27" rx="5" fill="#D1FAE5" stroke="#10B981"/>
    <text x="60" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Audio</text>
    <line x1="60" y1="129" x2="60" y2="143" stroke="#10B981" stroke-width="1.5"/>

    <rect x="-87" y="143" width="54" height="27" rx="5" fill="#FFFFFF" stroke="#10B981"/>
    <text x="-60" y="161" text-anchor="middle" font-size="11" fill="#1E1B4B">Model 1</text>

    <rect x="-27" y="143" width="54" height="27" rx="5" fill="#FFFFFF" stroke="#10B981"/>
    <text x="0" y="161" text-anchor="middle" font-size="11" fill="#1E1B4B">Model 2</text>

    <rect x="33" y="143" width="54" height="27" rx="5" fill="#FFFFFF" stroke="#10B981"/>
    <text x="60" y="161" text-anchor="middle" font-size="11" fill="#1E1B4B">Model 3</text>

    <line x1="-60" y1="170" x2="-13" y2="190" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="170" x2="0" y2="190" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="170" x2="13" y2="190" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="-41" y="190" width="82" height="28" rx="5" fill="#FEF3C7" stroke="#D97706"/>
    <text x="0" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">Combine</text>

    <line x1="0" y1="218" x2="0" y2="239" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="-38" y="239" width="76" height="28" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="0" y="257" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Output</text>

    <text x="0" y="294" text-anchor="middle" font-size="11" fill="#6B7280">Independent models per modality,</text>
    <text x="0" y="310" text-anchor="middle" font-size="11" fill="#6B7280">combine predictions at the end</text>
  </g>

  <!-- Cross-Attention -->
  <g transform="translate(583 0)">
    <rect x="-95" y="58" width="190" height="30" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="0" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Cross-Attention</text>

    <rect x="-83" y="102" width="50" height="27" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="-58" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Text</text>

    <rect x="-25" y="102" width="50" height="27" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="0" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Image</text>

    <rect x="33" y="102" width="50" height="27" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="58" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Audio</text>

    <line x1="-33" y1="108" x2="-25" y2="108" stroke="#EF4444" stroke-width="1.4" marker-end="url(#arrowRed)"/>
    <line x1="-25" y1="123" x2="-33" y2="123" stroke="#EF4444" stroke-width="1.4" marker-end="url(#arrowRed)"/>
    <line x1="25" y1="108" x2="33" y2="108" stroke="#EF4444" stroke-width="1.4" marker-end="url(#arrowRed)"/>
    <line x1="33" y1="123" x2="25" y2="123" stroke="#EF4444" stroke-width="1.4" marker-end="url(#arrowRed)"/>

    <line x1="-58" y1="129" x2="-34" y2="150" stroke="#7C3AED" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="129" x2="0" y2="150" stroke="#7C3AED" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="58" y1="129" x2="34" y2="150" stroke="#7C3AED" stroke-width="1.3" stroke-linecap="round"/>

    <rect x="-80" y="150" width="160" height="44" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="0" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">Cross-Attention</text>
    <text x="0" y="184" text-anchor="middle" font-size="11" fill="#6B7280">Q, K, V across modalities</text>

    <line x1="0" y1="194" x2="0" y2="207" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="-68" y="207" width="136" height="28" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="0" y="225" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Fused Representation</text>

    <line x1="0" y1="235" x2="0" y2="245" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="-38" y="245" width="76" height="28" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="0" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Output</text>

    <text x="0" y="294" text-anchor="middle" font-size="11" fill="#6B7280">Modalities attend to each other,</text>
    <text x="0" y="310" text-anchor="middle" font-size="11" fill="#6B7280">learning cross-modal interactions</text>
  </g>
</svg>