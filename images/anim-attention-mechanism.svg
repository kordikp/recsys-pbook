<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="pb001-title pb001-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb001-title">Self-attention: the query decides what counts</title>
<desc id="pb001-desc">Self-attention for the newest position of a watch history (cooking show, guitar lesson, sci-fi trailer, band live, drum solo). The query of item 5 is compared with every key by a scaled dot product; softmax turns the scores (−1.0, 1.6, −0.4, 1.4, 1.8) into weights that sum to 1 (0.02, 0.31, 0.04, 0.25, 0.38) instead of a plain average of 0.20 each; the future item 6 is masked. The output z5 is the weighted sum of the value vectors and is used to predict item 6. The old guitar lesson outweighs the newer sci-fi trailer: weight follows similarity to the query, not just recency.</desc>
<style>
