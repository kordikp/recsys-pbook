<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .w1{animation:wv 5s ease-in-out infinite}
    @keyframes wv{0%,20%,100%{stroke-width:2;opacity:.5}45%,75%{stroke-width:7;opacity:1}}
    .w2{animation:wf 5s ease-in-out infinite}
    @keyframes wf{0%,20%,100%{stroke-width:5;opacity:.9}45%,75%{stroke-width:2;opacity:.45}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Self-Attention: Not All History Weighs the Same</text>

  <!-- history items -->
  <g text-anchor="middle" font-size="12">
    <rect x="70" y="250" width="110" height="64" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="125" y="276" font-size="18">🍳</text><text x="125" y="298" fill="#075985">cooking show</text>
    <rect x="212" y="250" width="110" height="64" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="267" y="276" font-size="18">🎸</text><text x="267" y="298" fill="#075985">guitar lesson</text>
    <rect x="354" y="250" width="110" height="64" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="409" y="276" font-size="18">🎬</text><text x="409" y="298" fill="#075985">sci-fi trailer</text>
    <rect x="496" y="250" width="110" height="64" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="551" y="276" font-size="18">🎸</text><text x="551" y="298" fill="#075985">band live</text>
    <rect x="638" y="250" width="110" height="64" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="693" y="276" font-size="18">🥁</text><text x="693" y="298" fill="#075985">drum solo</text>
    <text x="409" y="345" fill="#6B7280">watch history (oldest → newest)</text>
  </g>

  <!-- query -->
  <rect x="330" y="80" width="160" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="410" y="103" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4C1D95">next item = ?</text>
  <text x="410" y="122" text-anchor="middle" font-size="11.5" fill="#4C1D95">query attends to history</text>

  <!-- attention edges -->
  <line class="w2" x1="384" y1="138" x2="128" y2="248" stroke="#9CA3AF"/>
  <line class="w1" x1="396" y1="138" x2="268" y2="248" stroke="#7C3AED"/>
  <line class="w2" x1="410" y1="138" x2="409" y2="248" stroke="#9CA3AF"/>
  <line class="w1" x1="424" y1="138" x2="550" y2="248" stroke="#7C3AED"/>
  <line class="w1" x1="436" y1="138" x2="690" y2="248" stroke="#7C3AED"/>

  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">Weights are computed per prediction: for a music query the guitar items glow, the cooking show fades — recency isn't the only signal.</text>
</svg>
