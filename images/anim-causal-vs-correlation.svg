<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .swing{transform-origin:595px 210px;animation:sw 4s ease-in-out infinite}
    @keyframes sw{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-8deg)}}
    .qm{animation:q 4s ease-in-out infinite}
    @keyframes q{0%,100%{opacity:.5}50%{opacity:1}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Correlation Is Not a Recommendation Win</text>

  <!-- left: correlation -->
  <rect x="45" y="66" width="330" height="290" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="210" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#D97706">CORRELATION (observed)</text>
  <g stroke="#9CA3AF"><line x1="85" y1="310" x2="345" y2="310"/><line x1="85" y1="310" x2="85" y2="120"/></g>
  <text x="215" y="332" text-anchor="middle" font-size="12" fill="#6B7280">users who saw recommendations</text>
  <text x="72" y="215" text-anchor="middle" font-size="12" fill="#6B7280" transform="rotate(-90 72 215)">purchases</text>
  <g fill="#D97706" opacity=".85">
    <circle cx="115" cy="286" r="5"/><circle cx="141" cy="270" r="5"/><circle cx="166" cy="277" r="5"/>
    <circle cx="192" cy="247" r="5"/><circle cx="215" cy="238" r="5"/><circle cx="241" cy="214" r="5"/>
    <circle cx="266" cy="220" r="5"/><circle cx="291" cy="188" r="5"/><circle cx="317" cy="169" r="5"/><circle cx="334" cy="150" r="5"/>
  </g>
  <line x1="103" y1="292" x2="345" y2="146" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="210" y="130" text-anchor="middle" font-size="12" fill="#92400E">…but heavy shoppers get MORE recommendations anyway</text>

  <!-- right: causation via experiment -->
  <rect x="425" y="66" width="330" height="290" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="590" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#10B981">CAUSATION (experiment)</text>
  <g class="swing">
    <line x1="595" y1="210" x2="595" y2="130" stroke="#6B7280" stroke-width="3"/>
    <line x1="495" y1="210" x2="695" y2="210" stroke="#6B7280" stroke-width="4"/>
    <rect x="465" y="214" width="80" height="40" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="505" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">with recs</text>
    <rect x="649" y="214" width="80" height="40" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="689" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#4B5563">held out</text>
  </g>
  <circle cx="595" cy="126" r="7" fill="#6B7280"/>
  <text x="590" y="300" text-anchor="middle" font-size="13" fill="#065F46">randomize WHO gets recs →</text>
  <text x="590" y="320" text-anchor="middle" font-size="13" fill="#065F46">the lift you weigh is the true effect</text>
  <text class="qm" x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">Ask: would they have bought it anyway? Only a held-out group can answer.</text>
</svg>
