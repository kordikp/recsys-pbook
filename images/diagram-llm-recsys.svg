<text x="320" y="103" font-size="17" font-weight="700" fill="#1E1B4B" text-anchor="middle">feature extractor</text>
<text x="526" y="82" font-size="14" fill="#4B5563" text-anchor="middle">3 · LLM as</text>
<text x="526" y="103" font-size="17" font-weight="700" fill="#1E1B4B" text-anchor="middle">chat interface</text>
