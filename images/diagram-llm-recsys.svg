<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 365" width="650" height="365" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrGreen" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="648" height="363" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="325" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">LLM Integration Architectures for Recommendation</text>

  <!-- Architecture 1: LLM as Recommender -->
  <g transform="translate(10,44)">
    <rect x="0" y="0" width="195" height="250" rx="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="97.5" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">LLM as Recommender</text>

    <circle cx="97.5" cy="50" r="15" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <circle cx="97.5" cy="45" r="4" fill="#0EA5E9"/>
    <path d="M89.5 57 C90.5 50.5 104.5 50.5 105.5 57" fill="#0EA5E9"/>
    <text x="97.5" y="76" text-anchor="middle" font-size="11" fill="#6B7280">query</text>

    <line x1="97.5" y1="80" x2="97.5" y2="91" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrBlue)"/>

    <rect x="52.5" y="95" width="90" height="32" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="97.5" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">LLM</text>

    <line x1="97.5" y1="127" x2="97.5" y2="141" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrBlue)"/>

    <rect x="57.5" y="145" width="80" height="28" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="97.5" y="163" text-anchor="middle" font-size="11" fill="#1E1B4B">Items</text>

    <circle cx="157" cy="159" r="13" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="157" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#EF4444">✗</text>

    <text x="97.5" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">Hallucination risk</text>
    <text x="97.5" y="220" text-anchor="middle" font-size="11" fill="#6B7280">No grounding in catalog</text>
  </g>

  <!-- Architecture 2: LLM as Feature Extractor -->
  <g transform="translate(220,44)">
    <rect x="0" y="0" width="195" height="250" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <text x="97.5" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">LLM as Feature Extractor</text>

    <rect x="57.5" y="38" width="80" height="28" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="97.5" y="56" text-anchor="middle" font-size="11" fill="#1E1B4B">Items</text>

    <line x1="97.5" y1="66" x2="97.5" y2="80" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrBlue)"/>

    <rect x="52.5" y="84" width="90" height="30" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="97.5" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">LLM</text>

    <line x1="97.5" y1="114" x2="97.5" y2="128" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrBlue)"/>

    <rect x="47.5" y="132" width="100" height="28" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="97.5" y="150" text-anchor="middle" font-size="11" fill="#D97706">Embeddings</text>

    <line x1="97.5" y1="160" x2="97.5" y2="174" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrGreen)"/>

    <rect x="47.5" y="178" width="100" height="30" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="97.5" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">RecSys</text>

    <text x="97.5" y="226" text-anchor="middle" font-size="11" fill="#6B7280">LLM enriches features,</text>
    <text x="97.5" y="242" text-anchor="middle" font-size="11" fill="#6B7280">RecSys ranks items</text>
  </g>

  <!-- Architecture 3: Hybrid -->
  <g transform="translate(430,44)">
    <rect x="0" y="0" width="210" height="250" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="105" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">LLM + RecSys Hybrid</text>

    <circle cx="105" cy="48" r="15" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <circle cx="105" cy="43" r="4" fill="#0EA5E9"/>
    <path d="M97 55 C98 48.5 112 48.5 113 55" fill="#0EA5E9"/>
    <text x="105" y="73" text-anchor="middle" font-size="11" fill="#6B7280">User</text>

    <line x1="91" y1="62" x2="57" y2="81" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrBlue)"/>

    <rect x="10" y="85" width="90" height="38" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="55" y="101" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">LLM</text>
    <text x="55" y="116" text-anchor="middle" font-size="11" fill="#6B7280">intent parsing</text>

    <line x1="100" y1="104" x2="110" y2="104" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrBlue)"/>

    <rect x="114" y="85" width="86" height="38" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="157" y="101" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">RecSys</text>
    <text x="157" y="116" text-anchor="middle" font-size="11" fill="#6B7280">retrieval</text>

    <line x1="157" y1="123" x2="157" y2="133" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrGreen)"/>

    <rect x="56" y="137" width="120" height="38" rx="6" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="116" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">LLM</text>
    <text x="116" y="168" text-anchor="middle" font-size="11" fill="#6B7280">response generation</text>

    <line x1="116" y1="175" x2="116" y2="185" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrBlue)"/>

    <rect x="56" y="189" width="120" height="28" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="116" y="207" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Grounded response</text>

    <rect x="36" y="222" width="138" height="24" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="105" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">✓ Production Standard</text>
  </g>

  <text x="325" y="319" text-anchor="middle" font-size="11" fill="#6B7280">Direct LLM recommendations lack catalog grounding.</text>
  <text x="325" y="336" text-anchor="middle" font-size="11" fill="#6B7280">Hybrid architectures combine LLM understanding with RecSys precision.</text>
  <text x="325" y="355" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">The hybrid approach is the dominant pattern in production systems.</text>
</svg>