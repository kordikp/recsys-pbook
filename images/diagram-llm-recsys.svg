<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" aria-labelledby="pb131-title pb131-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb131-title">Three places to put an LLM in a recommender</title>
<desc id="pb131-desc">An LLM can be the recommender itself (fluent, but it may invent titles and never saw your clicks), a feature extractor that turns item text into embeddings for a RecSys, or a chat interface that turns words into a query for a RecSys and explains its picks; the reliable designs leave the choosing to a recommender trained on behavior.</desc>
<defs><marker id="pb131-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
