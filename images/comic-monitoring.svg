<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb082-title pb082-desc">
<title id="pb082-title">Everything is fine, served promptly</title>
<desc id="pb082-desc">Four-panel comic in a café where the barista is the recommender. 1: a regular orders a muffin and the barista notes: loves muffins. 2: the barista now shows only muffins and calls them the best seller; the regular replies that it is all the barista has — what is shown gets sold, then shown more. 3: the regular silently thinks a salad would be nicer lately, but the barista serves the usual muffin; nothing is said and no error is logged. 4: the health checks show uptime 100%, speed 80 ms, errors 0, the barista celebrates perfect service, but the regular is gone and no alert fired. Uptime and speed checks cannot see wrong suggestions, so also watch what people choose, how it shifts and who stops coming.</desc>
<defs>
<g id="pb082-muffin">
<path d="M-8,0 L-10,-11 H10 L8,0 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M-4,-1 L-5,-10 M0,-1 V-10 M4,-1 L5,-10" stroke="#F59E0B" stroke-width="1.2"/>
<path d="M-12,-11 Q-13,-24 0,-24 Q13,-24 12,-11 Z" fill="#92400E"/>
</g>
