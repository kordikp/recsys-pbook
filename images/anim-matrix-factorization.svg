<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 464" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb019-title pb019-desc">
<title id="pb019-title">One ALS half-step: freeze the item vectors, solve each user exactly</title>
<desc id="pb019-desc">ALS learns user and item embeddings by alternating. With the item vectors V frozen, user 1's vector is a tiny ridge regression over only the two items user 1 rated (ratings 5 and 3 on items 1 and 3): the 2 by 2 system with matrix 0.75, 0.33, 0.33, 1.00 and right-hand side 4.3, 4.2 gives u1 = (4.55, 2.70). Every user is solved the same way, independently and in parallel; then U is frozen and the items are solved, repeated 10 to 20 times. Each row of U and V is an embedding, and a dot product scores any user-item pair, e.g. the missing rating of item 2 is u1 times v2 = 4.35.</desc>
<style>
.pb019-a1{animation:pb019-k1 10s linear infinite}
.pb019-a2{animation:pb019-k2 10s linear infinite}
.pb019-a3{animation:pb019-k3 10s linear infinite}
.pb019-a4{animation:pb019-k4 10s linear infinite}
@keyframes pb019-k1{0%,4%{opacity:0}8%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes pb019-k2{0%,14%{opacity:0}18%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes pb019-k3{0%,26%{opacity:0}30%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes pb019-k4{0%,38%{opacity:0}42%,94%{opacity:1}98%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.pb019-a1,.pb019-a2,.pb019-a3,.pb019-a4{animation:none !important}}</style>
