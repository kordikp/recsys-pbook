<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .fill1{animation:fx 6s ease-in-out infinite}
    @keyframes fx{0%,20%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Matrix Factorization: X ≈ U · Vᵀ</text>

  <!-- X sparse -->
  <g>
    <text x="150" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">X · ratings (sparse)</text>
    <g stroke="#E5E7EB">
      <rect x="70" y="100" width="160" height="160" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
      <line x1="70" y1="140" x2="230" y2="140"/><line x1="70" y1="180" x2="230" y2="180"/><line x1="70" y1="220" x2="230" y2="220"/>
      <line x1="110" y1="100" x2="110" y2="260"/><line x1="150" y1="100" x2="150" y2="260"/><line x1="190" y1="100" x2="190" y2="260"/>
    </g>
    <g font-size="14" text-anchor="middle" fill="#7C3AED" font-weight="700">
      <text x="90" y="126">5</text><text x="170" y="126">3</text>
      <text x="130" y="166">4</text><text x="210" y="166">2</text>
      <text x="90" y="206">1</text><text x="190" y="206">?</text>
      <text x="110" y="246">?</text><text x="210" y="246">5</text>
    </g>
    <text x="150" y="282" text-anchor="middle" font-size="11.5" fill="#6B7280">users × items · mostly empty</text>
  </g>

  <text x="272" y="185" font-size="26" fill="#1E1B4B">≈</text>

  <!-- U -->
  <g>
    <text x="360" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">U · user tastes</text>
    <rect x="315" y="100" width="90" height="160" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <line x1="315" y1="140" x2="405" y2="140" stroke="#A7F3D0"/><line x1="315" y1="180" x2="405" y2="180" stroke="#A7F3D0"/><line x1="315" y1="220" x2="405" y2="220" stroke="#A7F3D0"/>
    <line x1="360" y1="100" x2="360" y2="260" stroke="#A7F3D0"/>
    <text x="360" y="282" text-anchor="middle" font-size="11.5" fill="#6B7280">users × k</text>
  </g>
  <text x="432" y="185" font-size="22" fill="#1E1B4B">×</text>
  <!-- V^T -->
  <g>
    <text x="560" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">Vᵀ · item traits</text>
    <rect x="460" y="120" width="200" height="80" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <line x1="460" y1="160" x2="660" y2="160" stroke="#FDE68A"/>
    <line x1="510" y1="120" x2="510" y2="200" stroke="#FDE68A"/><line x1="560" y1="120" x2="560" y2="200" stroke="#FDE68A"/><line x1="610" y1="120" x2="610" y2="200" stroke="#FDE68A"/>
    <text x="560" y="222" text-anchor="middle" font-size="11.5" fill="#6B7280">k × items · k ≈ 50 hidden dimensions</text>
  </g>

  <g class="fill1">
    <rect x="682" y="130" width="102" height="60" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="733" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#4C1D95">? → 4.3</text>
    <text x="733" y="174" text-anchor="middle" font-size="10.5" fill="#4C1D95">uᵢ · vⱼ predicts</text>
  </g>
  <text x="400" y="330" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E1B4B">two thin matrices explain one huge sparse one</text>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">The k dimensions are learned "taste axes" nobody named — funny vs serious, mainstream vs niche — discovered from behavior alone.</text>
</svg>
