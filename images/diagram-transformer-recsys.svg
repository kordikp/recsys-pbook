<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 430" width="650" height="430" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="648" height="428" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <defs>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,10 L5,0 L10,10" fill="#1E1B4B"/>
    </marker>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#1E1B4B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E1B4B">Transformer Block for Sequential Recommendation</text>

  <!-- Side label -->
  <g transform="translate(625,207) rotate(90)">
    <text x="0" y="0" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED" font-style="italic">SASRec / BERT4Rec Architecture</text>
  </g>

  <!-- Top: Next Item Prediction -->
  <rect x="155" y="36" width="190" height="28" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="250" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E1B4B">Next Item Prediction &#x2192; i&#x2086;</text>

  <!-- Arrow from FFN to prediction -->
  <line x1="250" y1="79" x2="250" y2="65" stroke="#1E1B4B" stroke-width="1.5" marker-end="url(#arrowUp)"/>

  <!-- Feed-Forward Network -->
  <rect x="155" y="80" width="190" height="38" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="250" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E1B4B">Feed-Forward Network</text>

  <!-- Residual connection and Layer Norm annotations -->
  <g transform="translate(470,78)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="600">Also includes:</text>
    <text x="75" y="39" text-anchor="middle" font-size="11" fill="#7C3AED">+ Residual connections</text>
    <text x="75" y="56" text-anchor="middle" font-size="11" fill="#7C3AED">+ Layer normalization</text>
  </g>

  <!-- Arrow from Self-Attention to FFN -->
  <line x1="250" y1="144" x2="250" y2="120" stroke="#1E1B4B" stroke-width="1.5" marker-end="url(#arrowUp)"/>

  <!-- Self-Attention Block -->
  <rect x="90" y="145" width="370" height="125" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="275" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E1B4B">Self-Attention</text>

  <!-- Q, K, V cells -->
  <g transform="translate(110,174)">
    <rect x="0" y="0" width="30" height="24" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="15" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C3AED">Q</text>

    <rect x="40" y="0" width="30" height="24" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="55" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#0EA5E9">K</text>

    <rect x="80" y="0" width="30" height="24" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="95" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C3AED">V</text>
  </g>

  <!-- Arrow from Q, K, V to attention matrix -->
  <line x1="220" y1="186" x2="250" y2="186" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arrowRight)"/>

  <!-- Attention matrix visualization -->
  <g transform="translate(260,172)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="12" height="12" fill="#0EA5E9" opacity="0.9"/>
    <rect x="14" y="0" width="12" height="12" fill="#E0F2FE"/>
    <rect x="28" y="0" width="12" height="12" fill="#E0F2FE"/>
    <rect x="42" y="0" width="12" height="12" fill="#E0F2FE"/>
    <rect x="56" y="0" width="12" height="12" fill="#E0F2FE"/>

    <!-- Row 2 -->
    <rect x="0" y="14" width="12" height="12" fill="#0EA5E9" opacity="0.4"/>
    <rect x="14" y="14" width="12" height="12" fill="#0EA5E9" opacity="0.8"/>
    <rect x="28" y="14" width="12" height="12" fill="#E0F2FE"/>
    <rect x="42" y="14" width="12" height="12" fill="#E0F2FE"/>
    <rect x="56" y="14" width="12" height="12" fill="#E0F2FE"/>

    <!-- Row 3 -->
    <rect x="0" y="28" width="12" height="12" fill="#0EA5E9" opacity="0.2"/>
    <rect x="14" y="28" width="12" height="12" fill="#0EA5E9" opacity="0.3"/>
    <rect x="28" y="28" width="12" height="12" fill="#0EA5E9" opacity="0.7"/>
    <rect x="42" y="28" width="12" height="12" fill="#E0F2FE"/>
    <rect x="56" y="28" width="12" height="12" fill="#E0F2FE"/>

    <!-- Row 4 -->
    <rect x="0" y="42" width="12" height="12" fill="#0EA5E9" opacity="0.15"/>
    <rect x="14" y="42" width="12" height="12" fill="#0EA5E9" opacity="0.5"/>
    <rect x="28" y="42" width="12" height="12" fill="#0EA5E9" opacity="0.3"/>
    <rect x="42" y="42" width="12" height="12" fill="#0EA5E9" opacity="0.85"/>
    <rect x="56" y="42" width="12" height="12" fill="#E0F2FE"/>

    <!-- Row 5 -->
    <rect x="0" y="56" width="12" height="12" fill="#0EA5E9" opacity="0.2"/>
    <rect x="14" y="56" width="12" height="12" fill="#0EA5E9" opacity="0.15"/>
    <rect x="28" y="56" width="12" height="12" fill="#0EA5E9" opacity="0.6"/>
    <rect x="42" y="56" width="12" height="12" fill="#0EA5E9" opacity="0.25"/>
    <rect x="56" y="56" width="12" height="12" fill="#0EA5E9" opacity="0.9"/>

    <rect x="-1" y="-1" width="70" height="70" rx="3" fill="none" stroke="#0EA5E9" stroke-width="1.2"/>
  </g>

  <!-- Causal mask -->
  <g transform="translate(260,172)" fill="none" stroke="#EF4444" stroke-width="1.3" stroke-linecap="round">
    <line x1="12" y1="0" x2="68" y2="56" stroke-width="1.5" stroke-dasharray="3,2"/>

    <path d="M31 3 L37 9 M37 3 L31 9"/>
    <path d="M45 3 L51 9 M51 3 L45 9"/>
    <path d="M59 3 L65 9 M65 3 L59 9"/>

    <path d="M45 17 L51 23 M51 17 L45 23"/>
    <path d="M59 17 L65 23 M65 17 L59 23"/>

    <path d="M59 31 L65 37 M65 31 L59 37"/>
  </g>

  <text x="342" y="207" font-size="11" fill="#EF4444" font-weight="600">Causal Mask</text>
  <text x="342" y="224" font-size="11" fill="#6B7280">(no peeking at future)</text>
  <text x="294" y="256" text-anchor="middle" font-size="11" fill="#6B7280">Attention scores</text>

  <!-- Arrow from positional encoding to Self-Attention -->
  <line x1="250" y1="288" x2="250" y2="272" stroke="#1E1B4B" stroke-width="1.2" marker-end="url(#arrowUp)"/>

  <!-- Positional encoding -->
  <rect x="115" y="289" width="270" height="24" rx="5" fill="#FEF3C7" stroke="#D97706"/>
  <text x="250" y="305" text-anchor="middle" font-size="11" fill="#D97706" font-weight="600">Positional Encoding (PE)</text>

  <text x="60" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">+ Positional</text>
  <text x="60" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Encoding</text>

  <!-- Item-to-positional-encoding relationships -->
  <g stroke="#6B7280" stroke-width="1" fill="none">
    <line x1="138" y1="347" x2="138" y2="314"/>
    <line x1="194" y1="347" x2="194" y2="314"/>
    <line x1="250" y1="347" x2="250" y2="314"/>
    <line x1="306" y1="347" x2="306" y2="314"/>
    <line x1="362" y1="347" x2="362" y2="314"/>
  </g>

  <g font-size="14" font-weight="bold" fill="#D97706">
    <text x="138" y="345" text-anchor="middle">+</text>
    <text x="194" y="345" text-anchor="middle">+</text>
    <text x="250" y="345" text-anchor="middle">+</text>
    <text x="306" y="345" text-anchor="middle">+</text>
    <text x="362" y="345" text-anchor="middle">+</text>
  </g>

  <!-- Item Sequence -->
  <text x="60" y="373" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Item Sequence</text>

  <g transform="translate(120,348)">
    <rect x="0" y="0" width="36" height="36" rx="5" fill="#7C3AED"/>
    <text x="18" y="24" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">i&#x2081;</text>

    <rect x="56" y="0" width="36" height="36" rx="5" fill="#0EA5E9"/>
    <text x="74" y="24" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">i&#x2082;</text>

    <rect x="112" y="0" width="36" height="36" rx="5" fill="#10B981"/>
    <text x="130" y="24" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">i&#x2083;</text>

    <rect x="168" y="0" width="36" height="36" rx="5" fill="#0EA5E9"/>
    <text x="186" y="24" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">i&#x2084;</text>

    <rect x="224" y="0" width="36" height="36" rx="5" fill="#D97706"/>
    <text x="242" y="24" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">i&#x2085;</text>
  </g>

  <!-- Formula annotation -->
  <text x="250" y="414" text-anchor="middle" font-size="11" fill="#6B7280">Attention(Q,K,V) = softmax(QK&#x1D40;/&#x221A;d&#x2096;) &#x00B7; V</text>
</svg>