<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The Company Your Cart Keeps</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <g>
    <rect x="30" y="76" width="180" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="120" y="99" font-size="12.5" fill="#1E1B4B" text-anchor="middle">I want a book I'll love.</text>
    <text x="120" y="118" font-size="12.5" fill="#1E1B4B" text-anchor="middle">I cannot explain my taste.</text>

    <rect x="232" y="82" width="144" height="44" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="304" y="109" font-size="12.5" fill="#1E1B4B" text-anchor="middle">What do you buy?</text>

    <g stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="94" cy="187" r="10" fill="#EDE9FE"/>
      <line x1="94" y1="197" x2="94" y2="231"/>
      <line x1="94" y1="207" x2="72" y2="218"/>
      <line x1="94" y1="208" x2="116" y2="216"/>
      <line x1="94" y1="231" x2="82" y2="248"/>
      <line x1="94" y1="231" x2="106" y2="248"/>
    </g>

    <g>
      <rect x="126" y="207" width="54" height="35" rx="4" fill="#FFFFFF" stroke="#6B7280"/>
      <rect x="133" y="194" width="10" height="30" rx="2" fill="#EDE9FE" stroke="#7C3AED"/>
      <rect x="146" y="189" width="10" height="35" rx="2" fill="#E0F2FE" stroke="#0EA5E9"/>
      <rect x="159" y="197" width="10" height="27" rx="2" fill="#FEF3C7" stroke="#D97706"/>
    </g>

    <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="303" cy="187" r="10" fill="#D1FAE5"/>
      <line x1="303" y1="197" x2="303" y2="231"/>
      <line x1="303" y1="207" x2="280" y2="217"/>
      <line x1="303" y1="207" x2="326" y2="216"/>
      <line x1="303" y1="231" x2="291" y2="248"/>
      <line x1="303" y1="231" x2="315" y2="248"/>
    </g>

    <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">At the bookstore, taste is easier to show than to describe.</text>
  </g>

  <!-- Panel 2 -->
  <g>
    <rect x="422" y="76" width="170" height="44" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="507" y="103" font-size="12.5" fill="#1E1B4B" text-anchor="middle">They bought my three.</text>

    <rect x="604" y="76" width="164" height="44" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="686" y="103" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Then they bought this.</text>

    <g stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="470" cy="172" r="10" fill="#EDE9FE"/>
      <line x1="470" y1="182" x2="470" y2="217"/>
      <line x1="470" y1="192" x2="450" y2="203"/>
      <line x1="470" y1="193" x2="491" y2="202"/>
      <line x1="470" y1="217" x2="458" y2="235"/>
      <line x1="470" y1="217" x2="482" y2="235"/>
    </g>

    <g stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="574" cy="172" r="10" fill="#E0F2FE"/>
      <line x1="574" y1="182" x2="574" y2="217"/>
      <line x1="574" y1="192" x2="555" y2="202"/>
      <line x1="574" y1="192" x2="593" y2="202"/>
      <line x1="574" y1="217" x2="563" y2="235"/>
      <line x1="574" y1="217" x2="585" y2="235"/>
    </g>

    <g stroke="#D97706" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="630" cy="172" r="10" fill="#FEF3C7"/>
      <line x1="630" y1="182" x2="630" y2="217"/>
      <line x1="630" y1="192" x2="611" y2="202"/>
      <line x1="630" y1="192" x2="649" y2="202"/>
      <line x1="630" y1="217" x2="619" y2="235"/>
      <line x1="630" y1="217" x2="641" y2="235"/>
    </g>

    <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="730" cy="172" r="10" fill="#D1FAE5"/>
      <line x1="730" y1="182" x2="730" y2="217"/>
      <line x1="730" y1="192" x2="710" y2="203"/>
      <line x1="730" y1="193" x2="750" y2="202"/>
      <line x1="730" y1="217" x2="718" y2="235"/>
      <line x1="730" y1="217" x2="742" y2="235"/>
    </g>

    <g>
      <rect x="521" y="238" width="14" height="25" rx="2" fill="#EDE9FE" stroke="#7C3AED"/>
      <rect x="541" y="234" width="14" height="29" rx="2" fill="#E0F2FE" stroke="#0EA5E9"/>
      <rect x="561" y="240" width="14" height="23" rx="2" fill="#FEF3C7" stroke="#D97706"/>
      <path d="M585 250 L675 250" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
      <path d="M667 244 L675 250 L667 256" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
      <rect x="686" y="230" width="18" height="33" rx="2" fill="#D1FAE5" stroke="#10B981"/>
    </g>

    <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Similar shopping histories reveal taste without a questionnaire.</text>
  </g>

  <!-- Panel 3 -->
  <g>
    <rect x="30" y="354" width="132" height="46" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="96" y="373" font-size="12.5" fill="#1E1B4B" text-anchor="middle">One million</text>
    <text x="96" y="391" font-size="12.5" fill="#1E1B4B" text-anchor="middle">taste twins?</text>

    <rect x="174" y="354" width="202" height="46" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="275" y="373" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Let's ask what</text>
    <text x="275" y="391" font-size="12.5" fill="#1E1B4B" text-anchor="middle">travels together.</text>

    <g stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="70" cy="452" r="10" fill="#EDE9FE"/>
      <line x1="70" y1="462" x2="70" y2="500"/>
      <line x1="70" y1="473" x2="51" y2="484"/>
      <line x1="70" y1="473" x2="89" y2="484"/>
      <line x1="70" y1="500" x2="59" y2="518"/>
      <line x1="70" y1="500" x2="81" y2="518"/>
    </g>

    <g>
      <line x1="145" y1="453" x2="196" y2="478" stroke="#6B7280" stroke-width="2"/>
      <line x1="145" y1="453" x2="236" y2="443" stroke="#6B7280" stroke-width="2"/>
      <line x1="196" y1="478" x2="236" y2="443" stroke="#6B7280" stroke-width="2"/>
      <rect x="132" y="434" width="18" height="34" rx="2" fill="#EDE9FE" stroke="#7C3AED"/>
      <rect x="187" y="462" width="18" height="34" rx="2" fill="#E0F2FE" stroke="#0EA5E9"/>
      <rect x="227" y="426" width="18" height="34" rx="2" fill="#FEF3C7" stroke="#D97706"/>
    </g>

    <g>
      <rect x="154" y="509" width="112" height="31" rx="5" fill="#FEF3C7" stroke="#D97706"/>
      <path d="M154 519 L210 532 L266 519" fill="none" stroke="#D97706" stroke-width="1.5"/>
      <text x="210" y="521" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">AMAZON · 2003</text>
    </g>

    <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="330" cy="452" r="10" fill="#D1FAE5"/>
      <line x1="330" y1="462" x2="330" y2="500"/>
      <line x1="330" y1="473" x2="311" y2="484"/>
      <line x1="330" y1="473" x2="349" y2="484"/>
      <line x1="330" y1="500" x2="319" y2="518"/>
      <line x1="330" y1="500" x2="341" y2="518"/>
    </g>

    <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Amazon's 2003 trick: item-to-item links scale better.</text>
  </g>

  <!-- Panel 4 -->
  <g>
    <rect x="422" y="356" width="92" height="42" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="468" y="382" font-size="12.5" fill="#1E1B4B" text-anchor="middle">No quiz?</text>

    <rect x="530" y="356" width="240" height="42" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="650" y="382" font-size="12.5" fill="#1E1B4B" text-anchor="middle">The products have references.</text>

    <g stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="470" cy="450" r="10" fill="#EDE9FE"/>
      <line x1="470" y1="460" x2="470" y2="500"/>
      <line x1="470" y1="471" x2="451" y2="482"/>
      <line x1="470" y1="471" x2="489" y2="482"/>
      <line x1="470" y1="500" x2="459" y2="518"/>
      <line x1="470" y1="500" x2="481" y2="518"/>
    </g>

    <g>
      <line x1="535" y1="514" x2="659" y2="514" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="542" y="468" width="19" height="46" rx="2" fill="#EDE9FE" stroke="#7C3AED"/>
      <rect x="574" y="478" width="19" height="36" rx="2" fill="#E0F2FE" stroke="#0EA5E9"/>
      <rect x="625" y="460" width="22" height="54" rx="2" fill="#D1FAE5" stroke="#10B981"/>
      <path d="M561 480 C572 456 606 451 625 472" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
      <path d="M617 468 L625 472 L618 478" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="714" cy="450" r="10" fill="#D1FAE5"/>
      <line x1="714" y1="460" x2="714" y2="500"/>
      <line x1="714" y1="471" x2="695" y2="482"/>
      <line x1="714" y1="471" x2="733" y2="482"/>
      <line x1="714" y1="500" x2="703" y2="518"/>
      <line x1="714" y1="500" x2="725" y2="518"/>
    </g>

    <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Soon the shelf knows which books keep getting introduced.</text>
  </g>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Collaborative filtering recommends what similar users liked; item-item links make this scale.</text>
</svg>