<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowUpPurple" markerWidth="8" markerHeight="6" refX="4" refY="1" orient="auto">
      <path d="M0,6 L4,0 L8,6" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="598" height="448" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Two-Tower Architecture</text>
  <text x="300" y="43" text-anchor="middle" font-size="11" fill="#6B7280">Decoupled encoding for scalable retrieval</text>

  <!-- Score output -->
  <rect x="235" y="52" width="130" height="32" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="300" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Score = u · v</text>

  <!-- Dot product -->
  <rect x="248" y="92" width="104" height="28" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="300" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Dot Product</text>
  <line x1="300" y1="92" x2="300" y2="86" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowUpPurple)"/>

  <!-- Tower-to-dot-product relationships -->
  <line x1="230" y1="140" x2="260" y2="120" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="370" y1="140" x2="340" y2="120" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round"/>

  <!-- User Tower -->
  <g transform="translate(70,0)">
    <rect x="0" y="140" width="180" height="220" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="90" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#7C3AED">User Tower</text>

    <rect x="15" y="170" width="150" height="26" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="90" y="187" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">User Embedding (128-d)</text>

    <line x1="90" y1="196" x2="90" y2="204" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="20" y="204" width="140" height="24" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="90" y="220" text-anchor="middle" font-size="11" fill="#1E1B4B">Dense (256) + ReLU</text>

    <line x1="90" y1="228" x2="90" y2="236" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="20" y="236" width="140" height="24" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="90" y="252" text-anchor="middle" font-size="11" fill="#1E1B4B">Dense (512) + ReLU</text>

    <line x1="90" y1="260" x2="90" y2="270" stroke="#7C3AED" stroke-width="1.5"/>

    <rect x="10" y="270" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#7C3AED"/>
    <text x="90" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#7C3AED">User Features</text>
    <g font-size="11" fill="#6B7280">
      <circle cx="24" cy="302" r="3" fill="#7C3AED"/>
      <text x="32" y="306">Watch / click history</text>
      <circle cx="24" cy="317" r="3" fill="#7C3AED"/>
      <text x="32" y="321">Demographics</text>
      <circle cx="24" cy="332" r="3" fill="#7C3AED"/>
      <text x="32" y="336">Context (time, device)</text>
    </g>
  </g>

  <rect x="80" y="364" width="160" height="24" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="160" y="381" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">Online (per request)</text>

  <!-- Item Tower -->
  <g transform="translate(350,0)">
    <rect x="0" y="140" width="180" height="220" rx="8" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="90" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#0EA5E9">Item Tower</text>

    <rect x="15" y="170" width="150" height="26" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="90" y="187" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Item Embedding (128-d)</text>

    <line x1="90" y1="196" x2="90" y2="204" stroke="#0EA5E9" stroke-width="1.5"/>
    <rect x="20" y="204" width="140" height="24" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="90" y="220" text-anchor="middle" font-size="11" fill="#1E1B4B">Dense (256) + ReLU</text>

    <line x1="90" y1="228" x2="90" y2="236" stroke="#0EA5E9" stroke-width="1.5"/>
    <rect x="20" y="236" width="140" height="24" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="90" y="252" text-anchor="middle" font-size="11" fill="#1E1B4B">Dense (512) + ReLU</text>

    <line x1="90" y1="260" x2="90" y2="270" stroke="#0EA5E9" stroke-width="1.5"/>

    <rect x="10" y="270" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#0EA5E9"/>
    <text x="90" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#0EA5E9">Item Features</text>
    <g font-size="11" fill="#6B7280">
      <circle cx="24" cy="302" r="3" fill="#0EA5E9"/>
      <text x="32" y="306">Title and description</text>
      <circle cx="24" cy="317" r="3" fill="#0EA5E9"/>
      <text x="32" y="321">Category and tags</text>
      <circle cx="24" cy="332" r="3" fill="#0EA5E9"/>
      <text x="32" y="336">Image / audio embedding</text>
    </g>
  </g>

  <rect x="360" y="364" width="160" height="24" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="440" y="381" text-anchor="middle" font-size="11" font-weight="600" fill="#0EA5E9">Offline (pre-computed)</text>

  <!-- ANN Index -->
  <line x1="440" y1="388" x2="440" y2="397" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 2"/>
  <rect x="100" y="398" width="400" height="41" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="300" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">ANN Index</text>
  <text x="300" y="433" text-anchor="middle" font-size="11" fill="#6B7280">Pre-computed item embeddings stored for fast nearest-neighbor lookup</text>
</svg>