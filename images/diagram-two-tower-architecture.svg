<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 464" width="640" height="464" role="img" aria-labelledby="pb144-title pb144-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb144-title">Two-tower architecture: the towers meet only at the dot product</title>
  <desc id="pb144-desc">The user tower and the item tower share nothing until the final dot product s(u,i) = e_u transposed times e_i, so every item embedding can be computed once offline and stored in an ANN index, while only the user tower runs online per request (1 to 5 ms) before a nearest-neighbour search returns the top-k items.</desc>
  <defs>
    <marker id="pb144-ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#10B981"/>
    </marker>
    <marker id="pb144-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="463" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <!-- Title -->
  <text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Two towers that meet only at the dot product</text>

  <!-- Independence wall (focal) -->
  <line x1="320" y1="62" x2="320" y2="334" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>

  <!-- Phase pills -->
  <rect x="70" y="58" width="180" height="30" rx="15" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="160" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">Online · every request</text>
  <rect x="390" y="58" width="180" height="30" rx="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="480" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Offline · periodic batch</text>

  <!-- Feature cards -->
  <rect x="50" y="104" width="220" height="54" rx="11" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="160" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">User features x<tspan font-size="14" dy="4">u</tspan></text>
  <text x="160" y="147" text-anchor="middle" font-size="14" fill="#4B5563">recent history · context</text>
  <rect x="370" y="104" width="220" height="54" rx="11" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="480" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Item features x<tspan font-size="14" dy="4">i</tspan></text>
  <text x="480" y="147" text-anchor="middle" font-size="14" fill="#4B5563">title · category · image</text>

  <line x1="160" y1="160" x2="160" y2="178" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb144-ah-green)"/>
  <line x1="480" y1="160" x2="480" y2="178" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb144-ah-purple)"/>

  <!-- Towers (narrowing: features squeezed into d numbers) -->
  <polygon points="70,184 250,184 214,248 106,248" fill="#D1FAE5" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
  <text x="160" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">user tower g<tspan font-size="14" dy="4">θ</tspan></text>
  <text x="160" y="234" text-anchor="middle" font-size="14" fill="#065F46">1–5 ms</text>
  <polygon points="390,184 570,184 534,248 426,248" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/>
  <text x="480" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#4C1D95">item tower h<tspan font-size="14" dy="4">φ</tspan></text>
  <text x="480" y="234" text-anchor="middle" font-size="14" fill="#4C1D95">minutes–hours</text>

  <!-- Wall label -->
  <rect x="256" y="196" width="128" height="44" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="320" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">independent</text>
  <text x="320" y="232" text-anchor="middle" font-size="14" fill="#92400E">no shared layers</text>

  <line x1="160" y1="250" x2="160" y2="264" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb144-ah-green)"/>
  <line x1="480" y1="250" x2="480" y2="262" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb144-ah-purple)"/>

  <!-- User embedding: one fresh vector -->
  <text x="104" y="285" text-anchor="end" font-size="16" font-weight="700" fill="#065F46">e<tspan font-size="14" dy="4">u</tspan></text>
  <g fill="#10B981" stroke="#065F46" stroke-width="1">
    <rect x="112" y="270" width="18" height="18" rx="3" fill-opacity=".9"/>
    <rect x="134" y="270" width="18" height="18" rx="3" fill-opacity=".35"/>
    <rect x="156" y="270" width="18" height="18" rx="3" fill-opacity=".7"/>
    <rect x="178" y="270" width="18" height="18" rx="3" fill-opacity=".15"/>
    <rect x="200" y="270" width="18" height="18" rx="3" fill-opacity=".55"/>
    <rect x="222" y="270" width="18" height="18" rx="3" fill-opacity=".8"/>
  </g>
  <text x="160" y="312" text-anchor="middle" font-size="14" fill="#4B5563">computed fresh</text>

  <!-- ANN index: every item embedding, cached -->
  <rect x="370" y="268" width="220" height="62" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <g fill="#7C3AED" stroke="#4C1D95" stroke-width="1">
    <rect x="392" y="280" width="12" height="12" rx="2" fill-opacity=".25"/>
    <rect x="406" y="280" width="12" height="12" rx="2" fill-opacity=".7"/>
    <rect x="420" y="280" width="12" height="12" rx="2" fill-opacity=".45"/>
    <rect x="392" y="294" width="12" height="12" rx="2" fill-opacity=".8"/>
    <rect x="406" y="294" width="12" height="12" rx="2" fill-opacity=".2"/>
    <rect x="420" y="294" width="12" height="12" rx="2" fill-opacity=".6"/>
    <rect x="392" y="308" width="12" height="12" rx="2" fill-opacity=".5"/>
    <rect x="406" y="308" width="12" height="12" rx="2" fill-opacity=".85"/>
    <rect x="420" y="308" width="12" height="12" rx="2" fill-opacity=".3"/>
  </g>
  <text x="446" y="294" font-size="16" font-weight="700" fill="#4C1D95">ANN index</text>
  <text x="446" y="316" font-size="14" fill="#4B5563">all e<tspan font-size="14" dy="3">i</tspan><tspan dy="-3">, cached</tspan></text>

  <!-- Meeting point: the only place the towers interact -->
  <path d="M160 320 V378 H168" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pb144-ah-green)"/>
  <path d="M480 332 V378 L472 378" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pb144-ah-purple)"/>
  <rect x="174" y="350" width="292" height="58" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="320" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">s(u, i) = e<tspan font-size="14" dy="4">u</tspan><tspan font-size="14" dy="-11">T</tspan><tspan dy="7"> e</tspan><tspan font-size="14" dy="4">i</tspan></text>
  <text x="320" y="397" text-anchor="middle" font-size="14" fill="#4C1D95">nearest-neighbour search → top-k items</text>

  <!-- Takeaway -->
  <text x="320" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Nothing crosses until the dot product — so <tspan fill="#7C3AED">items are embedded once, offline</tspan>.</text>
</svg>
