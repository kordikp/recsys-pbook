<text x="320" y="592" font-size="17" fill="#1E1B4B" text-anchor="middle"><tspan font-weight="700" fill="#92400E">Ads pay?</tspan> The recommender maximizes your <tspan font-weight="700">watch time</tspan>.</text>
<text x="320" y="618" font-size="17" fill="#1E1B4B" text-anchor="middle"><tspan font-weight="700" fill="#065F46">You pay?</tspan> It maximizes your <tspan font-weight="700">enjoyment</tspan>, so you renew.</text>
