<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 636" role="img" aria-labelledby="pb086-title pb086-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb086-title">The clerk’s favorite movie is a metric</title>
<desc id="pb086-desc">Four-panel comic. The same clerk, standing in for a recommender, gets the same question in two shops: something I will enjoy tonight? In the free shop, paid for by ads, his objective is maximum watch time, so his favorite is a 12-part epic with autoplay; at 2 a.m. you are still watching, and he counts six hours and nine ad breaks: objective met. In the members' shop, where you pay, his objective is renewals, so his favorite is one film that fits you; you are in bed by ten and will renew: objective met. What a recommender suggests depends on its objective, and the objective follows who pays.</desc>
