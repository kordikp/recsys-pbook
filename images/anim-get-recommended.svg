<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" role="img" aria-labelledby="pb015-title pb015-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb015-title">Which video gets recommended next: 1,000 clicks or 100 full watches?</title>
  <desc id="pb015-desc">Two 10-minute videos, toy numbers. A clickbait video gets 1,000 clicks but viewers leave after about 3 seconds, so it earns only 50 minutes of watch time and is shown to fewer people next round. An honest video gets 100 clicks, all watched to the end, so it earns 1,000 minutes of watch time and is shown to more people. Clicks get a video tried; watch time decides whether it is recommended.</desc>
  <style>
    .pb015-a{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-out}
    .pb015-fillA{transform-box:fill-box;transform-origin:0 50%;animation-name:pb015-fillA}
    .pb015-fillB{transform-box:fill-box;transform-origin:0 50%;animation-name:pb015-fillB;animation-timing-function:linear}
    .pb015-headA{animation-name:pb015-headA}
    .pb015-headB{animation-name:pb015-headB;animation-timing-function:linear}
    .pb015-gone{animation-name:pb015-gone}
    .pb015-done{animation-name:pb015-done}
    .pb015-tot{animation-name:pb015-tot}
    .pb015-verd{animation-name:pb015-verd}
    @keyframes pb015-fillA{0%{transform:scaleX(0)}3%,100%{transform:scaleX(1)}}
    @keyframes pb015-fillB{0%{transform:scaleX(0)}28%,100%{transform:scaleX(1)}}
    @keyframes pb015-headA{0%{transform:translateX(-6px)}3%,100%{transform:translateX(0)}}
    @keyframes pb015-headB{0%{transform:translateX(-252px)}28%,100%{transform:translateX(0)}}
    @keyframes pb015-gone{0%,4%{opacity:0}8%,100%{opacity:1}}
    @keyframes pb015-done{0%,28%{opacity:0}32%,100%{opacity:1}}
    @keyframes pb015-tot{0%,32%{opacity:0}38%,100%{opacity:1}}
    @keyframes pb015-verd{0%,40%{opacity:0}46%,100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.pb015-a{animation:none !important}}
  </style>

  <rect x=".5" y=".5" width="639" height="485" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="32" y="46" font-size="20" font-weight="700" fill="#1E1B4B">Which video gets recommended next?</text>
  <text x="32" y="70" font-size="14" fill="#6B7280">Two 10-minute videos · toy numbers</text>

  <!-- ===== Video A: clickbait ===== -->
  <g transform="translate(24,0)">
    <rect x="0" y="86" width="284" height="328" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- thumbnail -->
    <rect x="16" y="102" width="252" height="76" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="50" cy="140" r="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <path d="M44,131 L44,149 L59,140 Z" fill="#F59E0B"/>
    <text x="80" y="134" font-size="16" font-weight="700" fill="#92400E">😱 You WON’T</text>
    <text x="80" y="156" font-size="16" font-weight="700" fill="#92400E">believe this!</text>
    <rect x="214" y="150" width="46" height="20" rx="5" fill="#1E1B4B"/>
    <text x="237" y="165" text-anchor="middle" font-size="14" fill="#FFFFFF">10:00</text>

    <text x="16" y="217"><tspan font-size="28" font-weight="700" fill="#1E1B4B">1,000</tspan><tspan font-size="16" fill="#4B5563"> clicks</tspan></text>

    <text x="16" y="243" font-size="15" fill="#4B5563">each viewer watched</text>
    <rect x="16" y="252" width="252" height="14" rx="7" fill="#E5E7EB"/>
    <rect class="pb015-a pb015-fillA" x="16" y="252" width="8" height="14" rx="4" fill="#F59E0B"/>
    <circle class="pb015-a pb015-headA" cx="22" cy="259" r="7" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
    <text class="pb015-a pb015-gone" x="16" y="288" font-size="15" font-weight="700" fill="#92400E">3 s, then gone 👋</text>

    <g class="pb015-a pb015-tot">
      <text x="16" y="318" font-size="16" fill="#4B5563">1,000 × 3 s =</text>
      <text x="16" y="348"><tspan font-size="26" font-weight="700" fill="#92400E">50 min</tspan><tspan font-size="16" fill="#4B5563"> watch time</tspan></text>
    </g>

    <g class="pb015-a pb015-verd">
      <rect x="16" y="364" width="252" height="34" rx="17" fill="#FEF3C7"/>
      <text x="142" y="386" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">▼ next round: shown less</text>
    </g>
  </g>

  <!-- ===== Video B: honest ===== -->
  <g transform="translate(332,0)">
    <rect x="0" y="86" width="284" height="328" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="16" y="102" width="252" height="76" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="50" cy="140" r="18" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <path d="M44,131 L44,149 L59,140 Z" fill="#10B981"/>
    <text x="80" y="134" font-size="16" font-weight="700" fill="#065F46">How to fix a</text>
    <text x="80" y="156" font-size="16" font-weight="700" fill="#065F46">bike chain 🚲</text>
    <rect x="214" y="150" width="46" height="20" rx="5" fill="#1E1B4B"/>
    <text x="237" y="165" text-anchor="middle" font-size="14" fill="#FFFFFF">10:00</text>

    <text x="16" y="217"><tspan font-size="28" font-weight="700" fill="#1E1B4B">100</tspan><tspan font-size="16" fill="#4B5563"> clicks</tspan></text>

    <text x="16" y="243" font-size="15" fill="#4B5563">each viewer watched</text>
    <rect x="16" y="252" width="252" height="14" rx="7" fill="#E5E7EB"/>
    <rect class="pb015-a pb015-fillB" x="16" y="252" width="252" height="14" rx="7" fill="#10B981"/>
    <circle class="pb015-a pb015-headB" cx="268" cy="259" r="7" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
    <text class="pb015-a pb015-done" x="16" y="288" font-size="15" font-weight="700" fill="#065F46">the whole 10 min</text>

    <g class="pb015-a pb015-tot">
      <text x="16" y="318" font-size="16" fill="#4B5563">100 × 10 min =</text>
      <text x="16" y="348"><tspan font-size="26" font-weight="700" fill="#065F46">1,000 min</tspan><tspan font-size="16" fill="#4B5563"> watch time</tspan></text>
    </g>

    <g class="pb015-a pb015-verd">
      <rect x="16" y="364" width="252" height="34" rx="17" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <text x="142" y="386" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">▲ next round: shown more</text>
    </g>
  </g>

  <!-- ===== the recommender states the rule ===== -->
  <g transform="translate(138,0)">
    <line x1="13" y1="428" x2="13" y2="436" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <circle cx="13" cy="427" r="2.5" fill="#7C3AED"/>
    <rect x="0" y="436" width="26" height="22" rx="7" fill="#7C3AED"/>
    <circle cx="8" cy="445" r="2.6" fill="#FFFFFF"/>
    <circle cx="18" cy="445" r="2.6" fill="#FFFFFF"/>
    <path d="M8.5,451 Q13,455 17.5,451" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <rect x="40" y="428" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M40.75,441 L33,448 L40.75,455" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="39" y="442" width="3" height="12" fill="#FFFFFF"/>
    <text x="202" y="454" text-anchor="middle" font-size="16" font-weight="600" fill="#1E1B4B">Clicks are nice. Watch time decides.</text>
  </g>
</svg>
