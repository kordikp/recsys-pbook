<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .rise{animation:r 5s ease-in-out infinite}
    @keyframes r{0%,10%{transform:translateY(0)}55%,80%{transform:translateY(-170px)}100%{transform:translateY(0)}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">How Content Gets Discovered</text>

  <!-- funnel layers -->
  <g text-anchor="middle">
    <path d="M120 90 L680 90 L600 170 L200 170 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="400" y="124" font-size="15" font-weight="700" fill="#4C1D95">indexed &amp; eligible</text>
    <text x="400" y="146" font-size="12" fill="#6B7280">good metadata · right catalog · no policy strikes</text>
    <path d="M200 178 L600 178 L520 258 L280 258 Z" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="400" y="212" font-size="15" font-weight="700" fill="#075985">candidate pools</text>
    <text x="400" y="234" font-size="12" fill="#6B7280">fresh · similar-to-liked · trending in your niche</text>
    <path d="M280 266 L520 266 L460 346 L340 346 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="400" y="300" font-size="15" font-weight="700" fill="#065F46">ranked &amp; shown</text>
    <text x="400" y="322" font-size="12" fill="#065F46">early signals decide the next round</text>
  </g>

  <!-- a rising item -->
  <g class="rise">
    <rect x="60" y="330" width="90" height="40" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="105" y="349" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">your video</text>
    <text x="105" y="363" text-anchor="middle" font-size="10" fill="#B45309">tags ✓ hook ✓</text>
  </g>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">You can't buy the ranking — but metadata, watchable openings and honest titles carry you up two layers.</text>
</svg>
