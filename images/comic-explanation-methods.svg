<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb070-title pb070-desc">
<title id="pb070-title">Can I see how you made that choice?</title>
<desc id="pb070-desc">Four-panel comic. 1: A diner asks a glass-box recommender why it served ramen; its rules are visible inside (if hungry and cold day, then ramen) — an intrinsic model, where the rules are the explanation. 2: Or a black-box recommender serves the same ramen but only says “It’s complicated”: often more accurate, but its millions of knobs cannot be read. 3: A post-hoc add-on explainer such as LIME or SHAP pokes the black box from outside, changing one thing at a time: as is gives ramen, not hungry gives salad, warm day still gives ramen. 4: Its verdict, “mostly because you’re hungry”, is only probably right, because it never saw inside. Intrinsic: you read the real reason. Post-hoc: a careful guess from outside that works on any model.</desc>
<defs><marker id="pb070-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6B7280"/></marker></defs>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="33" font-size="19" text-anchor="middle" font-weight="700" fill="#1E1B4B">Can I see how you made that choice?</text>
<g transform="translate(16,48)"><rect x="0" y="0" width="298" height="264" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="24" cy="25" r="11" fill="#1E1B4B"/><text x="24" y="30" font-size="14" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text><text x="43" y="31" font-size="16" font-weight="700" fill="#1E1B4B">Intrinsic: a glass box</text><path d="M12,224.5 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/><path d="M24,44 H112 Q124,44 124,56 V66 Q124,78 112,78 H53 L50,126 L39,78 H24 Q12,78 12,66 V56 Q12,44 24,44 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/><text x="68" y="66.5" font-size="15" text-anchor="middle" fill="#1E1B4B">Why ramen?</text><path d="M160,42 H272 Q284,42 284,54 V78 Q284,90 272,90 H222 L215,99 L208,90 H160 Q148,90 148,78 V54 Q148,42 160,42 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/><text x="216" y="61.5" font-size="15" text-anchor="middle" fill="#1E1B4B">No secrets.</text><text x="216" y="81.5" font-size="15" text-anchor="middle" fill="#1E1B4B">Read my rules!</text><path d="M27,224 V184 Q27,168 43,168 H57 Q73,168 73,184 V224 Z" fill="#10B981"/><circle cx="50" cy="147" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/><circle cx="45" cy="146" r="2.2" fill="#1E1B4B"/><circle cx="55" cy="146" r="2.2" fill="#1E1B4B"/><path d="M45,153 Q50,157.5 55,153" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="110" cy="222" rx="22" ry="4" fill="#E5E7EB"/><text x="110" y="217" font-size="26" text-anchor="middle">🍜</text><rect x="146" y="100" width="138" height="124" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><path d="M252,108 L274,130 M262,108 L274,120" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/><circle cx="208" cy="117" r="2.4" fill="#1E1B4B"/><circle cx="222" cy="117" r="2.4" fill="#1E1B4B"/><path d="M209,124 Q215,129 221,124" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/><path d="M158,136.5 H272" stroke="#EDE9FE" stroke-width="1.5"/><text x="162" y="160" font-size="15" fill="#1E1B4B"><tspan fill="#6B7280">if</tspan> hungry <tspan fill="#10B981" font-weight="700">✓</tspan></text><text x="162" y="183" font-size="15" fill="#1E1B4B"><tspan fill="#6B7280">and</tspan> cold day <tspan fill="#10B981" font-weight="700">✓</tspan></text><text x="162" y="207" font-size="15" font-weight="700" fill="#4C1D95"><tspan fill="#6B7280" font-weight="400">→</tspan> ramen</text><text x="149" y="252" font-size="15" text-anchor="middle" fill="#4B5563">The rules are the explanation.</text></g>
