.5"/><path d="M193,184 L190.7,179.6" stroke="#EDE9FE" stroke-width="1.5" stroke-linecap="round"/><circle cx="215" cy="184" r="6" fill="none" stroke="#EDE9FE" stroke-width="1.5"/><path d="M215,184 L210.0,184.4" stroke="#EDE9FE" stroke-width="1.5" stroke-linecap="round"/><circle cx="237" cy="184" r="6" fill="none" stroke="#EDE9FE" stroke-width="1.5"/><path d="M237,184 L235.5,188.8" stroke="#EDE9FE" stroke-width="1.5" stroke-linecap="round"/><circle cx="259" cy="184" r="6" fill="none" stroke="#EDE9FE" stroke-width="1.5"/><path d="M259,184 L262.8,187.2" stroke="#EDE9FE" stroke-width="1.5" stroke-linecap="round"/><text x="215" y="210" font-size="14" text-anchor="middle" fill="#EDE9FE">millions of knobs</text><text x="149" y="252" font-size="15" text-anchor="middle" fill="#4B5563">Often more accurate. Can’t be read.</text></g>
