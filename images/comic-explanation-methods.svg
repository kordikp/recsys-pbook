FF"/><circle cx="229" cy="117" r="1.8" fill="#FFFFFF"/><line x1="242" y1="119" x2="250" y2="119" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb070-arrow)"/><text x="270.5" y="126" font-size="20" text-anchor="middle">🍜</text><rect x="96" y="143" width="98" height="30" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/><text x="145" y="163" font-size="15" text-anchor="middle" font-weight="700" fill="#92400E">not hungry</text><line x1="198" y1="158" x2="208" y2="158" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb070-arrow)"/><rect x="212" y="146" width="26" height="24" rx="5" fill="#1E1B4B"/><circle cx="221" cy="156" r="1.8" fill="#FFFFFF"/><circle cx="229" cy="156" r="1.8" fill="#FFFFFF"/><line x1="242" y1="158" x2="250" y2="158" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb070-arrow)"/><rect x="255" y="141" width="31" height="34" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/><text x="270.5" y="165" font-size="20" text-anchor="middle">🥗</text><rect x="96" y="182" width="98" height="30" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="145" y="202" font-size="15" text-anchor="middle" fill="#1E1B4B">warm day</text><line x1="198" y1="197" x2="208" y2="197" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb070-arrow)"/><rect x="212" y="185" width="26" height="24" rx="5" fill="#1E1B4B"/><circle cx="221" cy="195" r="1.8" fill="#FFFFFF"/><circle cx="229" cy="195" r="1.8" fill="#FFFFFF"/><line x1="242" y1="197" x2="250" y2="197" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb070-arrow)"/><text x="270.5" y="204" font-size="20" text-anchor="middle">🍜</text><text x="149" y="252" font-size="15" text-anchor="middle" fill="#4B5563">Add-on explainer, e.g. LIME or SHAP</text></g>
