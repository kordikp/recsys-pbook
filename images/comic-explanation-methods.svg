<text x="320" y="618" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B"><tspan fill="#4C1D95">Intrinsic:</tspan> read the real reason. <tspan fill="#92400E">Post-hoc:</tspan> a careful guess from outside.</text>
