<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 482" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb028-title pb028-desc">
<title id="pb028-title">One recommender, a different job in each placement</title>
<desc id="pb028-desc">A recommendation scenario is one placement with its own job, settings and success metric. On the homepage a user who is just browsing needs discovery: high diversity and exploration, a relaxed speed budget, measured by session depth. In the cart a user about to pay needs fast cross-sell of add-ons for the phone they are buying, with little diversity or exploration, measured by add-to-cart rate. Product pages, search, email and onboarding are scenarios too.</desc>
<style>
  .pb028-knob, .pb028-fill, .pb028-tiles { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  .pb028-knob { animation-name: pb028-knob; }
  .pb028-fill { animation-name: pb028-fill; }
  .pb028-tiles { animation-name: pb028-tiles; }
  @keyframes pb028-knob { 0%, 12% { transform: translateX(var(--pb028-dx)); } 28%, 90% { transform: translateX(0); } 100% { transform: translateX(var(--pb028-dx)); } }
  @keyframes pb028-fill { 0%, 12% { stroke-dasharray: var(--pb028-m) 999px; } 28%, 90% { stroke-dasharray: var(--pb028-f) 999px; } 100% { stroke-dasharray: var(--pb028-m) 999px; } }
  @keyframes pb028-tiles { 0%, 18% { opacity: .3; } 32%, 90% { opacity: 1; } 100% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .pb028-knob, .pb028-fill, .pb028-tiles { animation: none !important; } }
</style>
