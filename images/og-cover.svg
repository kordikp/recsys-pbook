<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <!-- OG card: light, explicit colors only (no CSS vars, no gradients that rasterizers drop) -->
  <rect width="1200" height="630" fill="#FAFAF7"/>
  <rect width="1200" height="8" fill="#7C3AED"/>

  <!-- left: message -->
  <text x="80" y="150" font-size="30" font-weight="600" fill="#7C3AED" letter-spacing="4">A SELF-RECOMMENDING LIVING BOOK</text>
  <text x="80" y="235" font-size="60" font-weight="800" fill="#1E1B4B">How Recommendations</text>
  <text x="80" y="305" font-size="60" font-weight="800" fill="#1E1B4B">Work</text>
  <text x="80" y="375" font-size="30" fill="#4B5563">A book about recommender systems</text>
  <text x="80" y="415" font-size="30" fill="#4B5563">that personalizes itself with one.</text>

  <!-- pills -->
  <g font-size="24" font-weight="600">
    <rect x="80" y="455" width="170" height="52" rx="26" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="165" y="489" text-anchor="middle" fill="#7C3AED">🎛 Steer it</text>
    <rect x="266" y="455" width="180" height="52" rx="26" fill="none" stroke="#10B981" stroke-width="2.5"/>
    <text x="356" y="489" text-anchor="middle" fill="#059669">✨ Remix it</text>
    <rect x="462" y="455" width="190" height="52" rx="26" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <text x="557" y="489" text-anchor="middle" fill="#B45309">🌱 Extend it</text>
  </g>

  <text x="80" y="572" font-size="24" fill="#6B7280">Pavel Kordík &amp; Eva Nečasová · Recombee × CTU Prague</text>
  <text x="1120" y="572" text-anchor="end" font-size="24" font-weight="600" fill="#7C3AED">recsys-pbook.vercel.app</text>

  <!-- right: fanned telling cards of one concept -->
  <g transform="translate(830,100) rotate(-6)">
    <rect width="300" height="180" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="20" y="20" width="86" height="30" rx="15" fill="#FEF3C7"/>
    <text x="63" y="41" text-anchor="middle" font-size="17" font-weight="700" fill="#B45309">⚡ shared</text>
    <rect x="20" y="70" width="260" height="12" rx="6" fill="#E5E7EB"/>
    <rect x="20" y="94" width="220" height="12" rx="6" fill="#E5E7EB"/>
    <rect x="20" y="118" width="240" height="12" rx="6" fill="#E5E7EB"/>
    <text x="20" y="162" font-size="16" fill="#9CA3AF">🌍 česky · story</text>
  </g>
  <g transform="translate(870,160) rotate(3)">
    <rect width="300" height="180" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="20" y="20" width="80" height="30" rx="15" fill="#D1FAE5"/>
    <text x="60" y="41" text-anchor="middle" font-size="17" font-weight="700" fill="#059669">edited</text>
    <rect x="20" y="70" width="150" height="90" rx="8" fill="#EDE9FE"/>
    <path d="M45 135 L85 95 L110 115 L145 80" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
    <rect x="185" y="72" width="95" height="12" rx="6" fill="#E5E7EB"/>
    <rect x="185" y="96" width="95" height="12" rx="6" fill="#E5E7EB"/>
    <text x="20" y="178" font-size="16" fill="#9CA3AF">📐 diagram · e-commerce</text>
  </g>
  <g transform="translate(845,250) rotate(-2)">
    <rect width="310" height="190" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <rect x="20" y="20" width="76" height="30" rx="15" fill="#EDE9FE"/>
    <text x="58" y="41" text-anchor="middle" font-size="17" font-weight="800" fill="#7C3AED">CORE</text>
    <rect x="20" y="70" width="270" height="12" rx="6" fill="#D1D5DB"/>
    <rect x="20" y="94" width="240" height="12" rx="6" fill="#D1D5DB"/>
    <rect x="20" y="118" width="255" height="12" rx="6" fill="#D1D5DB"/>
    <rect x="20" y="142" width="180" height="12" rx="6" fill="#D1D5DB"/>
    <text x="20" y="180" font-size="16" fill="#9CA3AF">∑ formulas · technical</text>
  </g>
  <text x="990" y="485" text-anchor="middle" font-size="20" font-weight="600" fill="#6B7280">one concept · many tellings</text>
</svg>
