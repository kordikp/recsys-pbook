<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" role="img" aria-labelledby="pb007-title pb007-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb007-title">A new hiking boot's first day in an online shop</title>
  <desc id="pb007-desc">A brand-new hiking boot has zero clicks, so its "customers also liked" box is empty: collaborative filtering has nothing to go on. Its hiking tag matches the trail shoe, a known product with lots of fans, so the shop gives the boot a small trial slot in a trail-shoe fan's feed. The fan likes it, and the boot's "customers also liked" starts filling from real behavior. The tag makes a first guess; a small trial checks it.</desc>
  <style>
    .pb007-anim{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-out}
    .pb007-halo{opacity:0;animation-name:pb007-halo}
    @keyframes pb007-halo{0%{opacity:0}4%{opacity:1}12%{opacity:1}18%,100%{opacity:0}}
    .pb007-s2{animation-name:pb007-s2}
    @keyframes pb007-s2{0%,13%{opacity:0}19%,96%{opacity:1}100%{opacity:0}}
    .pb007-s3{animation-name:pb007-s3}
    @keyframes pb007-s3{0%,23%{opacity:0}29%,96%{opacity:1}100%{opacity:0}}
    .pb007-drop{transform-box:fill-box;transform-origin:center;animation-name:pb007-drop}
    @keyframes pb007-drop{0%,27%{opacity:0;transform:translateY(-14px)}33%,96%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    .pb007-pop{transform-box:fill-box;transform-origin:center;animation-name:pb007-pop}
    @keyframes pb007-pop{0%,35%{opacity:0;transform:scale(.3)}39%{opacity:1;transform:scale(1.35)}43%,96%{opacity:1;transform:scale(1)}100%{opacity:0}}
    .pb007-s4{animation-name:pb007-s4}
    @keyframes pb007-s4{0%,41%{opacity:0}47%,96%{opacity:1}100%{opacity:0}}
    .pb007-s5{animation-name:pb007-s5}
    @keyframes pb007-s5{0%,45%{opacity:0}52%,96%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.pb007-anim{animation:none !important}.pb007-halo{opacity:0}}
  </style>
  <defs>
    <path id="pb007-heart" d="M0,7 C-9,1 -10,-6 -5,-8 C-2,-9 0,-7 0,-5 C0,-7 2,-9 5,-8 C10,-6 9,1 0,7 Z"/>
    <marker id="pb007-ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
    <marker id="pb007-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
    <marker id="pb007-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="447" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <!-- ===== TL: the new boot, day 1 ===== -->
  <rect x="24" y="20" width="248" height="164" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="46" cy="42" r="11" fill="#1E1B4B"/>
  <text x="46" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="64" y="48" font-size="17" font-weight="700" fill="#1E1B4B">Hiking boot</text>
  <rect x="200" y="31" width="56" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="228" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">NEW</text>
  <rect x="40" y="62" width="48" height="48" rx="10" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="95" text-anchor="middle" font-size="26">🥾</text>
  <rect x="104" y="64" width="70" height="22" rx="11" fill="#EDE9FE"/>
  <text x="139" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">hiking</text>
  <text x="104" y="106" font-size="15" font-weight="700" fill="#92400E">0 clicks</text>
  <text x="40" y="132" font-size="15" fill="#4B5563">Customers also liked</text>
  <rect class="pb007-anim pb007-halo" x="34" y="136" width="228" height="42" rx="12" fill="none" stroke="#F59E0B" stroke-width="5" stroke-opacity=".4"/>
  <rect x="40" y="142" width="216" height="30" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="148" y="162" text-anchor="middle" font-size="15" fill="#92400E">no customers yet</text>

  <!-- ===== TR: the known look-alike ===== -->
  <rect x="368" y="20" width="248" height="164" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="384" y="48" font-size="17" font-weight="700" fill="#1E1B4B">Trail shoe</text>
  <rect x="552" y="62" width="48" height="48" rx="10" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="576" y="95" text-anchor="middle" font-size="26">👟</text>
  <rect x="384" y="64" width="70" height="22" rx="11" fill="#EDE9FE"/>
  <text x="419" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">hiking</text>
  <g fill="#10B981">
    <circle cx="390" cy="95" r="4"/><path d="M384,107 Q384,100 390,100 Q396,100 396,107 Z"/>
    <circle cx="404" cy="95" r="4"/><path d="M398,107 Q398,100 404,100 Q410,100 410,107 Z"/>
    <circle cx="418" cy="95" r="4"/><path d="M412,107 Q412,100 418,100 Q424,100 424,107 Z"/>
  </g>
  <text x="432" y="106" font-size="15" font-weight="700" fill="#065F46">lots of fans</text>
  <text x="384" y="132" font-size="15" fill="#4B5563">Customers also liked</text>
  <rect x="384" y="142" width="216" height="30" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="404" y="164" text-anchor="middle" font-size="18">🎒</text>
  <text x="434" y="164" text-anchor="middle" font-size="18">🧦</text>

  <!-- ===== step 2: same tag ===== -->
  <g class="pb007-anim pb007-s2">
    <line x1="178" y1="75" x2="380" y2="75" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb007-ap)"/>
    <circle cx="320" cy="36" r="11" fill="#1E1B4B"/>
    <text x="320" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="320" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">same tag</text>
  </g>

  <!-- ===== step 3: trial for its fans ===== -->
  <g class="pb007-anim pb007-s3">
    <line x1="408" y1="188" x2="408" y2="234" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb007-aa)"/>
    <circle cx="432" cy="212" r="11" fill="#1E1B4B"/>
    <text x="432" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="450" y="217" font-size="15" font-weight="700" fill="#92400E">trial for its fans</text>
  </g>

  <!-- ===== BR: a trail-shoe fan's feed ===== -->
  <rect x="368" y="240" width="248" height="164" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <g fill="#10B981">
    <circle cx="392" cy="255" r="6"/><path d="M383,272 Q383,263 392,263 Q401,263 401,272 Z"/>
  </g>
  <text x="410" y="268" font-size="16" font-weight="700" fill="#1E1B4B">Trail-shoe fan's feed</text>
  <text x="384" y="292" font-size="14" font-weight="600" fill="#4C1D95">Recommended for you</text>
  <rect x="384" y="312" width="48" height="48" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4"/>
  <g class="pb007-anim pb007-drop"><text x="408" y="345" text-anchor="middle" font-size="26">🥾</text></g>
  <rect x="444" y="312" width="48" height="48" rx="10" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="468" y="345" text-anchor="middle" font-size="26">🎒</text>
  <rect x="504" y="312" width="48" height="48" rx="10" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="528" y="345" text-anchor="middle" font-size="26">🧦</text>
  <text x="408" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">trial slot</text>
  <text x="498" y="382" text-anchor="middle" font-size="14" fill="#6B7280">usual picks</text>
  <g transform="translate(384,312)">
    <g class="pb007-anim pb007-pop">
      <circle cx="0" cy="0" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
      <use href="#pb007-heart" transform="translate(0,0.5) scale(0.62)" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== step 4: first like flows back to the boot ===== -->
  <g class="pb007-anim pb007-s4">
    <line x1="364" y1="336" x2="278" y2="336" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb007-ag)"/>
    <circle cx="320" cy="296" r="11" fill="#1E1B4B"/>
    <text x="320" y="301" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="313" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">first</text>
    <use href="#pb007-heart" transform="translate(342,318) scale(0.8)" fill="#10B981"/>
  </g>

  <!-- ===== BL: the same boot, after the trial ===== -->
  <g class="pb007-anim pb007-s5">
    <rect x="24" y="240" width="248" height="164" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="40" y="268" font-size="17" font-weight="700" fill="#1E1B4B">Hiking boot <tspan font-size="14" font-weight="400" fill="#4B5563">later</tspan></text>
    <rect x="200" y="251" width="56" height="24" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="220" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">1</text>
    <use href="#pb007-heart" transform="translate(237,263) scale(0.75)" fill="#10B981"/>
    <rect x="40" y="282" width="48" height="48" rx="10" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="64" y="315" text-anchor="middle" font-size="26">🥾</text>
    <rect x="104" y="284" width="70" height="22" rx="11" fill="#EDE9FE"/>
    <text x="139" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">hiking</text>
    <text x="104" y="326" font-size="15" font-weight="700" fill="#065F46">first real fan</text>
    <text x="40" y="352" font-size="15" fill="#4B5563">Customers also liked</text>
    <rect x="40" y="362" width="216" height="30" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="60" y="384" text-anchor="middle" font-size="18">👟</text>
    <text x="78" y="382" font-size="15" font-weight="700" fill="#065F46">Trail shoe</text>
  </g>

  <!-- takeaway -->
  <text x="320" y="432" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">The <tspan fill="#7C3AED">tag</tspan> makes a first guess; a <tspan fill="#92400E">small trial</tspan> checks it.</text>
</svg>
