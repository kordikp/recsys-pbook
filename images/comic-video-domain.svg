<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb105-title pb105-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb105-title">It remembers where you fell asleep</title>
<desc id="pb105-desc">Four-panel comic. A viewer falls asleep halfway through episode 3; the recommender logs 50% watched, which means unfinished, not disliked. Next morning the phone shows that episode in Continue Watching at 50%, because the progress belongs to the account, not the screen. Behind the scenes the recommender knows the series, season and episode order, so when episode 3 reaches its credits, episode 4 is already lined up as Watch Next.</desc>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="34" font-size="19" font-weight="700" fill="#1E1B4B" text-anchor="middle">It remembers where you fell asleep</text>
