<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .tick{animation:tk 7s ease-in-out infinite}
    .tick:nth-of-type(2){animation-delay:1.1s}.tick:nth-of-type(3){animation-delay:2.2s}
    .tick:nth-of-type(4){animation-delay:3.3s}.tick:nth-of-type(5){animation-delay:4.4s}.tick:nth-of-type(6){animation-delay:5.5s}
    @keyframes tk{0%,12%,100%{transform:scale(1)}4%,8%{transform:scale(1.25)}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Ship-It Ethics Checklist for Recommenders</text>

  <g font-size="13.5">
    <g class="tick" style="transform-origin:88px 84px"><circle cx="88" cy="84" r="13" fill="#10B981"/><text x="88" y="89" text-anchor="middle" fill="#fff" font-size="13">✓</text></g>
    <text x="115" y="80" font-weight="700" fill="#1E1B4B">User impact</text>
    <text x="115" y="98" fill="#6B7280" font-size="12">optimizing well-being proxies, not raw engagement alone</text>

    <g class="tick" style="transform-origin:88px 138px"><circle cx="88" cy="138" r="13" fill="#10B981"/><text x="88" y="143" text-anchor="middle" fill="#fff" font-size="13">✓</text></g>
    <text x="115" y="134" font-weight="700" fill="#1E1B4B">Fairness of exposure</text>
    <text x="115" y="152" fill="#6B7280" font-size="12">small creators &amp; the long tail get their exploration share</text>

    <g class="tick" style="transform-origin:88px 192px"><circle cx="88" cy="192" r="13" fill="#10B981"/><text x="88" y="197" text-anchor="middle" fill="#fff" font-size="13">✓</text></g>
    <text x="115" y="188" font-weight="700" fill="#1E1B4B">Diversity floor</text>
    <text x="115" y="206" fill="#6B7280" font-size="12">no feed collapses into a single topic or viewpoint</text>

    <g class="tick" style="transform-origin:88px 246px"><circle cx="88" cy="246" r="13" fill="#D97706"/><text x="88" y="251" text-anchor="middle" fill="#fff" font-size="13">!</text></g>
    <text x="115" y="242" font-weight="700" fill="#1E1B4B">Transparency</text>
    <text x="115" y="260" fill="#92400E" font-size="12">can a user see WHY this was recommended — and correct it?</text>

    <g class="tick" style="transform-origin:88px 300px"><circle cx="88" cy="300" r="13" fill="#D97706"/><text x="88" y="305" text-anchor="middle" fill="#fff" font-size="13">!</text></g>
    <text x="115" y="296" font-weight="700" fill="#1E1B4B">Vulnerable users</text>
    <text x="115" y="314" fill="#92400E" font-size="12">minors &amp; crisis contexts get safe defaults, not maximal engagement</text>

    <g class="tick" style="transform-origin:88px 354px"><circle cx="88" cy="354" r="13" fill="#EF4444"/><text x="88" y="359" text-anchor="middle" fill="#fff" font-size="13">✗</text></g>
    <text x="115" y="350" font-weight="700" fill="#1E1B4B">Audit trail</text>
    <text x="115" y="368" fill="#B91C1C" font-size="12">no logged rationale per slate yet — DSA asks for it; fix before launch</text>
  </g>
  <rect x="520" y="120" width="225" height="180" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="632" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#4C1D95">Why a checklist?</text>
  <text x="632" y="178" text-anchor="middle" font-size="12" fill="#4C1D95">Ethics debt behaves like</text>
  <text x="632" y="196" text-anchor="middle" font-size="12" fill="#4C1D95">tech debt: cheap to prevent,</text>
  <text x="632" y="214" text-anchor="middle" font-size="12" fill="#4C1D95">brutal to refactor after</text>
  <text x="632" y="232" text-anchor="middle" font-size="12" fill="#4C1D95">a scandal or a regulator.</text>
  <text x="632" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#4C1D95">Green = automated test exists</text>
</svg>
