<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb012-title pb012-desc">
<title id="pb012-title">Two pre-launch checklists</title>
<desc id="pb012-desc">A one-item checklist (engagement went up, ship it) next to the ethics checklist: before launch a team talks through six areas — user impact, fairness, privacy, safety, transparency and accountability — and writes down an honest answer to each, including where it falls short.</desc>
<style>
.pb012-m0{animation:pb012-m0 10s linear infinite}.pb012-m1{animation:pb012-m1 10s linear infinite}.pb012-m2{animation:pb012-m2 10s linear infinite}
.pb012-m3{animation:pb012-m3 10s linear infinite}.pb012-m4{animation:pb012-m4 10s linear infinite}.pb012-m5{animation:pb012-m5 10s linear infinite}
.pb012-b0{animation:pb012-b0 10s linear infinite}.pb012-b1{animation:pb012-b1 10s linear infinite}.pb012-b2{animation:pb012-b2 10s linear infinite}
.pb012-b3{animation:pb012-b3 10s linear infinite}.pb012-b4{animation:pb012-b4 10s linear infinite}.pb012-b5{animation:pb012-b5 10s linear infinite}
@keyframes pb012-m0{0%,8.5%{opacity:0}9.5%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes pb012-m1{0%,16%{opacity:0}17%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes pb012-m2{0%,23.5%{opacity:0}24.5%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes pb012-m3{0%,31%{opacity:0}32%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes pb012-m4{0%,38.5%{opacity:0}39.5%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes pb012-m5{0%,46%{opacity:0}47%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes pb012-b0{0%,2.5%{opacity:0}3%,8.5%{opacity:1}9%,100%{opacity:0}}
@keyframes pb012-b1{0%,10%{opacity:0}10.5%,16%{opacity:1}16.5%,100%{opacity:0}}
@keyframes pb012-b2{0%,17.5%{opacity:0}18%,23.5%{opacity:1}24%,100%{opacity:0}}
@keyframes pb012-b3{0%,25%{opacity:0}25.5%,31%{opacity:1}31.5%,100%{opacity:0}}
@keyframes pb012-b4{0%,32.5%{opacity:0}33%,38.5%{opacity:1}39%,100%{opacity:0}}
@keyframes pb012-b5{0%,40%{opacity:0}40.5%,46%{opacity:1}46.5%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.pb012-m0,.pb012-m1,.pb012-m2,.pb012-m3,.pb012-m4,.pb012-m5,.pb012-b0,.pb012-b1,.pb012-b2,.pb012-b3,.pb012-b4,.pb012-b5{animation:none !important}}
</style>
<rect x=".5" y=".5" width="639" height="459" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Two pre-launch checklists</text>

<!-- The shortcut: a one-item sticky note -->
<g transform="rotate(-3 110 212)">
  <rect x="26" y="142" width="168" height="140" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="82" y="133" width="56" height="16" rx="2" fill="#D1D5DB" opacity=".7"/>
  <text x="42" y="176" font-size="15" font-weight="700" fill="#92400E">Pre-launch:</text>
  <rect x="42" y="191" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#92400E" stroke-width="1.5"/>
  <path d="M46 201 L50.5 205.5 L58 196.5" fill="none" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="206" font-size="15" fill="#1E1B4B">Engagement up</text>
  <text x="42" y="254" font-size="16" font-weight="700" fill="#1E1B4B">Ship it! 🚀</text>
</g>
<text x="110" y="320" text-anchor="middle" font-size="14" fill="#92400E">one box, one number</text>

<!-- The ethics checklist: a clipboard -->
<rect x="216" y="62" width="408" height="342" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="372" y="50" width="96" height="22" rx="6" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="420" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">The ethics checklist</text>
<g stroke="#E5E7EB" stroke-width="1.5">
  <line x1="236" y1="160" x2="604" y2="160"/>
  <line x1="236" y1="206" x2="604" y2="206"/>
  <line x1="236" y1="252" x2="604" y2="252"/>
  <line x1="236" y1="298" x2="604" y2="298"/>
  <line x1="236" y1="344" x2="604" y2="344"/>
</g>
<rect class="pb012-m4" x="228" y="299" width="384" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>

<!-- empty boxes under every mark -->
<g fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5">
  <rect x="242" y="126" width="22" height="22" rx="6"/>
  <rect x="242" y="172" width="22" height="22" rx="6"/>
  <rect x="242" y="218" width="22" height="22" rx="6"/>
  <rect x="242" y="264" width="22" height="22" rx="6"/>
  <rect x="242" y="310" width="22" height="22" rx="6"/>
  <rect x="242" y="356" width="22" height="22" rx="6"/>
</g>

<!-- row texts -->
<g font-size="16" font-weight="700" fill="#1E1B4B">
  <text x="278" y="134">User impact</text>
  <text x="278" y="180">Fairness</text>
  <text x="278" y="226">Privacy</text>
  <text x="278" y="272">Safety</text>
  <text x="278" y="318">Transparency</text>
  <text x="278" y="364">Accountability</text>
</g>
<g font-size="15" fill="#4B5563">
  <text x="278" y="152">Well-being, or just engagement?</text>
  <text x="278" y="198">Fair to all creators and user groups?</text>
  <text x="278" y="244">Only the data you need, with real consent?</text>
  <text x="278" y="290">Harmful content and rabbit holes caught?</text>
  <text x="278" y="336">Stated goal = real goal?</text>
  <text x="278" y="382">Who answers when it causes harm?</text>
</g>
<g class="pb012-m4"><rect x="472" y="308" width="128" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/><text x="536" y="326" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">gap documented</text></g>

<!-- "talking it through" bubbles (only during the animation) -->
<g fill="#E5E7EB">
  <g class="pb012-b0" opacity="0"><rect x="236" y="127" width="34" height="20" rx="10"/><g fill="#6B7280"><circle cx="245" cy="137" r="2.2"/><circle cx="253" cy="137" r="2.2"/><circle cx="261" cy="137" r="2.2"/></g></g>
  <g class="pb012-b1" opacity="0"><rect x="236" y="173" width="34" height="20" rx="10"/><g fill="#6B7280"><circle cx="245" cy="183" r="2.2"/><circle cx="253" cy="183" r="2.2"/><circle cx="261" cy="183" r="2.2"/></g></g>
  <g class="pb012-b2" opacity="0"><rect x="236" y="219" width="34" height="20" rx="10"/><g fill="#6B7280"><circle cx="245" cy="229" r="2.2"/><circle cx="253" cy="229" r="2.2"/><circle cx="261" cy="229" r="2.2"/></g></g>
  <g class="pb012-b3" opacity="0"><rect x="236" y="265" width="34" height="20" rx="10"/><g fill="#6B7280"><circle cx="245" cy="275" r="2.2"/><circle cx="253" cy="275" r="2.2"/><circle cx="261" cy="275" r="2.2"/></g></g>
  <g class="pb012-b4" opacity="0"><rect x="236" y="311" width="34" height="20" rx="10"/><g fill="#6B7280"><circle cx="245" cy="321" r="2.2"/><circle cx="253" cy="321" r="2.2"/><circle cx="261" cy="321" r="2.2"/></g></g>
  <g class="pb012-b5" opacity="0"><rect x="236" y="357" width="34" height="20" rx="10"/><g fill="#6B7280"><circle cx="245" cy="367" r="2.2"/><circle cx="253" cy="367" r="2.2"/><circle cx="261" cy="367" r="2.2"/></g></g>
</g>

<!-- answers: green tick = answered, amber ! = honest gap -->
<g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <g class="pb012-m0"><rect x="242" y="126" width="22" height="22" rx="6" fill="#10B981" stroke="none"/><path d="M247.5 137.5 L251.5 141.5 L258.5 133"/></g>
  <g class="pb012-m1"><rect x="242" y="172" width="22" height="22" rx="6" fill="#10B981" stroke="none"/><path d="M247.5 183.5 L251.5 187.5 L258.5 179"/></g>
  <g class="pb012-m2"><rect x="242" y="218" width="22" height="22" rx="6" fill="#10B981" stroke="none"/><path d="M247.5 229.5 L251.5 233.5 L258.5 225"/></g>
  <g class="pb012-m3"><rect x="242" y="264" width="22" height="22" rx="6" fill="#10B981" stroke="none"/><path d="M247.5 275.5 L251.5 279.5 L258.5 271"/></g>
  <g class="pb012-m4"><rect x="242" y="310" width="22" height="22" rx="6" fill="#F59E0B" stroke="none"/><path d="M253 315.5 V323"/><circle cx="253" cy="327.5" r="1.6" fill="#FFFFFF" stroke="none"/></g>
  <g class="pb012-m5"><rect x="242" y="356" width="22" height="22" rx="6" fill="#10B981" stroke="none"/><path d="M247.5 367.5 L251.5 371.5 L258.5 363"/></g>
</g>

<text x="320" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Not perfection: six honest answers, gaps included, before you ship.</text>
</svg>
