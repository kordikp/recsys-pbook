<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb025-title pb025-desc">
  <title id="pb025-title">The user lifecycle in footprints: what the system knows and what it should do at each stage</title>
  <desc id="pb025-desc">A user walks a trail of footprints (interactions). At cold start (0 to 10 interactions) the system knows almost nothing, so it shows popular picks and asks at sign-up. In growth (10 to 100) it knows basic tastes and moves to taste neighbors plus a few surprises. When mature (100 to 1,000+) it knows detailed tastes and gives tailored picks plus diversity. When the user is declining, footprints thin out and old tastes fade, so it tries something new to win them back. Exploration share, from the telling's table: 50%+, 20 to 30%, 5 to 10%, 15 to 20%. Footprints build the picture, and each stage needs its own strategy.</desc>
  <style>
    .pb025-anim { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .pb025-walk { animation-name: pb025-walk; }
    .pb025-cover { animation-name: pb025-walk-c; }
    .pb025-grow2, .pb025-grow3 { transform-box: fill-box; transform-origin: 0 50%; animation-timing-function: ease-out; }
    .pb025-grow2 { animation-name: pb025-grow2; }
    .pb025-grow3 { animation-name: pb025-grow3; }
    .pb025-stale { animation-name: pb025-stale; }
    .pb025-zzz, .pb025-sleepy { animation-name: pb025-zzz; }
    .pb025-awake { animation-name: pb025-awake; }
    @keyframes pb025-walk {
      0% { transform: translateX(-556px); opacity: 0; }
      3% { transform: translateX(-556px); opacity: 1; }
      45%, 94% { transform: translateX(0); opacity: 1; }
      97% { transform: translateX(0); opacity: 0; }
      100% { transform: translateX(-556px); opacity: 0; }
    }
    @keyframes pb025-walk-c {
      0%, 3% { transform: translateX(-556px); }
      45%, 96% { transform: translateX(0); }
      99%, 100% { transform: translateX(-556px); }
    }
    @keyframes pb025-grow2 { 0%, 16.5% { transform: scaleX(0); } 22.5%, 96% { transform: scaleX(1); } 99%, 100% { transform: scaleX(0); } }
    @keyframes pb025-grow3 { 0%, 28.2% { transform: scaleX(0); } 34.2%, 96% { transform: scaleX(1); } 99%, 100% { transform: scaleX(0); } }
    @keyframes pb025-stale { 0%, 28.2% { opacity: 0; } 34.2%, 40.7% { opacity: 1; } 46.7%, 96% { opacity: .35; } 99%, 100% { opacity: 0; } }
    @keyframes pb025-zzz { 0%, 41% { opacity: 0; } 43%, 100% { opacity: 1; } }
    @keyframes pb025-awake { 0%, 41% { opacity: 1; } 43%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pb025-anim { animation: none !important; } }
  </style>
