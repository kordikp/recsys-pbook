<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .walker{animation:w 7s ease-in-out infinite}
    @keyframes w{0%,8%{transform:translateX(0)}30%{transform:translateX(170px)}55%{transform:translateX(360px)}80%,92%{transform:translateX(545px)}100%{transform:translateX(0)}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">A Reader's Journey Through the Recommender</text>

  <line x1="70" y1="300" x2="730" y2="300" stroke="#E5E7EB" stroke-width="3"/>
  <g class="walker"><text x="95" y="284" font-size="26" text-anchor="middle">🚶</text></g>

  <g text-anchor="middle" font-size="12.5">
    <circle cx="95" cy="300" r="8" fill="#EF4444"/>
    <rect x="35" y="90" width="130" height="120" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="100" y="115" font-weight="800" fill="#B91C1C">DAY 0 · cold</text>
    <text x="100" y="138" fill="#B91C1C">zero history</text>
    <text x="100" y="158" fill="#6B7280">popular + onboarding</text>
    <text x="100" y="178" fill="#6B7280">picks carry the day</text>

    <circle cx="270" cy="300" r="8" fill="#D97706"/>
    <rect x="205" y="90" width="130" height="120" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="270" y="115" font-weight="800" fill="#92400E">WEEK 1 · warm</text>
    <text x="270" y="138" fill="#92400E">a dozen signals</text>
    <text x="270" y="158" fill="#6B7280">CF wakes up, mixes</text>
    <text x="270" y="178" fill="#6B7280">with content features</text>

    <circle cx="455" cy="300" r="8" fill="#0EA5E9"/>
    <rect x="390" y="90" width="130" height="120" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="455" y="115" font-weight="800" fill="#075985">MONTH 1 · known</text>
    <text x="455" y="138" fill="#075985">stable taste profile</text>
    <text x="455" y="158" fill="#6B7280">personalized shelves,</text>
    <text x="455" y="178" fill="#6B7280">exploration ~10 %</text>

    <circle cx="640" cy="300" r="8" fill="#10B981"/>
    <rect x="575" y="90" width="130" height="120" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="640" y="115" font-weight="800" fill="#065F46">MATURE</text>
    <text x="640" y="138" fill="#065F46">risk: the loop closes</text>
    <text x="640" y="158" fill="#6B7280">diversity + novelty</text>
    <text x="640" y="178" fill="#6B7280">keep it breathing</text>
  </g>
  <text x="400" y="355" text-anchor="middle" font-size="13" fill="#6B7280">The right algorithm depends on where the reader stands — a mature profile needs freshness more than accuracy.</text>
</svg>
