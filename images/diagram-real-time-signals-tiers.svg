<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 532" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn17-title pn17-desc">
  <title id="pn17-title">Three speeds of signal, one model, and where skew creeps in</title>
  <desc id="pn17-desc">Maya's clicks reach the model at three speeds: a nightly batch up to a day old, a stream that updates a feature store within minutes, and the request itself carrying her last clicks within seconds, so the page switches from a frying pan to camping gear. Below, the same live feature is computed twice: the served copy says 41 tent views while the training copy, rebuilt later from full logs, says 58 because it counts clicks from after the moment. The fix is to log the features exactly as served and train on them.</desc>
  <defs>
    <marker id="pn17-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="pn17-ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
    <marker id="pn17-agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="531" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Three speeds of signal, one model</text>

  <!-- Maya -->
  <rect x="16" y="66" width="90" height="222" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <circle cx="61" cy="118" r="13" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="56.5" cy="116" r="1.6" fill="#1E1B4B"/>
  <circle cx="65.5" cy="116" r="1.6" fill="#1E1B4B"/>
  <path d="M56.5,122 Q61,125 65.5,122" fill="none" stroke="#1E1B4B" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M43,158 Q43,135 61,135 Q79,135 79,158 Z" fill="#10B981"/>
  <text x="61" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">Maya</text>
  <text x="61" y="210" text-anchor="middle" font-size="15">⛺⛺⛺</text>
  <text x="61" y="232" text-anchor="middle" font-size="14" fill="#1E1B4B">3 tents</text>
  <text x="61" y="254" text-anchor="middle" font-size="14" fill="#4B5563">21:04</text>

  <!-- Maya -> lanes -->
  <g stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#pn17-ag)">
    <line x1="108" y1="97" x2="125" y2="97"/>
    <line x1="108" y1="177" x2="125" y2="177"/>
    <line x1="108" y1="257" x2="125" y2="257"/>
  </g>

  <!-- Lane 1: batch -->
  <rect x="128" y="70" width="250" height="54" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="146" y="92" font-size="17">🌙</text>
  <text x="172" y="91" font-size="15" font-weight="700" fill="#1E1B4B">Nightly batch</text>
  <rect x="290" y="77" width="80" height="20" rx="10" fill="#F3F4F6"/>
  <text x="330" y="91.5" text-anchor="middle" font-size="14" fill="#4B5563">≤ 24 h old</text>
  <text x="172" y="113" font-size="14" fill="#4B5563">long-term taste, bestsellers</text>

  <!-- Lane 2: stream -->
  <rect x="128" y="150" width="250" height="54" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="142" y="161" width="24" height="12" rx="6" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="149" cy="167" r="2.2" fill="#10B981"/>
  <circle cx="157" cy="167" r="2.2" fill="#10B981"/>
  <text x="172" y="171" font-size="15" font-weight="700" fill="#1E1B4B">Stream</text>
  <rect x="290" y="157" width="80" height="20" rx="10" fill="#F3F4F6"/>
  <text x="330" y="171.5" text-anchor="middle" font-size="14" fill="#4B5563">minutes</text>
  <text x="172" y="193" font-size="14" fill="#4B5563">views last hour, sold out</text>

  <!-- Lane 3: request -->
  <rect x="128" y="230" width="250" height="54" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="146" y="252" font-size="17">⚡</text>
  <text x="172" y="251" font-size="15" font-weight="700" fill="#1E1B4B">Request</text>
  <rect x="290" y="237" width="80" height="20" rx="10" fill="#F3F4F6"/>
  <text x="330" y="251.5" text-anchor="middle" font-size="14" fill="#4B5563">seconds</text>
  <text x="172" y="273" font-size="14" fill="#4B5563">her last 3 clicks</text>

  <!-- lanes -> model -->
  <g stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" fill="none">
    <line x1="380" y1="97" x2="474" y2="97" marker-end="url(#pn17-ap)"/>
    <line x1="380" y1="177" x2="408" y2="177"/>
    <line x1="448" y1="177" x2="474" y2="177" marker-end="url(#pn17-ap)"/>
    <line x1="380" y1="257" x2="474" y2="257" marker-end="url(#pn17-ap)"/>
  </g>
  <!-- feature store cylinder -->
  <path d="M408,167 L408,189 A20,5 0 0 0 448,189 L448,167" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <ellipse cx="428" cy="167" rx="20" ry="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="428" y="214" text-anchor="middle" font-size="14" fill="#4C1D95">feature store</text>

  <!-- Model -->
  <rect x="478" y="66" width="146" height="222" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="551" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Model ranks</text>
  <text x="551" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">the page</text>
  <rect x="490" y="132" width="122" height="34" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="551" y="154" text-anchor="middle" font-size="14" fill="#9CA3AF">frying pan</text>
  <line x1="512" y1="149" x2="590" y2="149" stroke="#9CA3AF" stroke-width="1.5"/>
  <rect x="490" y="176" width="122" height="34" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="551" y="198" text-anchor="middle" font-size="14" fill="#1E1B4B">sleeping bags</text>
  <rect x="490" y="218" width="122" height="34" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="551" y="240" text-anchor="middle" font-size="14" fill="#1E1B4B">camping stoves</text>
  <text x="551" y="276" text-anchor="middle" font-size="14" fill="#4B5563">at 21:06</text>

  <!-- Skew inset -->
  <rect x="16" y="306" width="608" height="210" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="333" font-size="16" font-weight="700" fill="#1E1B4B">Skew: one feature, two copies</text>
  <text x="32" y="355" font-size="14" fill="#4B5563">"tent views, last hour" · toy numbers</text>

  <rect x="32" y="368" width="250" height="88" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="157" y="390" text-anchor="middle" font-size="14" fill="#1E1B4B">Served live · stream</text>
  <text x="157" y="425" text-anchor="middle" font-size="30" font-weight="700" fill="#1E1B4B">41</text>
  <text x="157" y="446" text-anchor="middle" font-size="14" fill="#4B5563">late phone events missing</text>

  <rect x="358" y="368" width="250" height="88" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="483" y="390" text-anchor="middle" font-size="14" fill="#1E1B4B">Training copy · rebuilt later</text>
  <text x="483" y="425" text-anchor="middle" font-size="30" font-weight="700" fill="#1E1B4B">58</text>
  <text x="483" y="446" text-anchor="middle" font-size="14" fill="#4B5563">counts clicks from the future</text>

  <circle cx="320" cy="412" r="22" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <g stroke="#92400E" stroke-width="3" stroke-linecap="round"><line x1="310" y1="406" x2="330" y2="406"/><line x1="310" y1="418" x2="330" y2="418"/><line x1="315" y1="425" x2="325" y2="399"/></g>

  <!-- fix: log what you serve -->
  <path d="M157,458 L157,474 Q157,480 163,480 L477,480 Q483,480 483,474 L483,461" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#pn17-agr)"/>
  <text x="320" y="503" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">Fix: log what you serve, then train on it</text>
</svg>
