<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="678" height="398" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Objectives Radar</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#6B7280">Different domains prioritize different recommendation objectives</text>

  <!-- Radar grid rings -->
  <g fill="none" stroke="#E5E7EB" stroke-width="1">
    <polygon points="340,190 365.98,205 365.98,235 340,250 314.02,235 314.02,205"/>
    <polygon points="340,160 391.96,190 391.96,250 340,280 288.04,250 288.04,190"/>
    <polygon points="340,130 417.94,175 417.94,265 340,310 262.06,265 262.06,175"/>
    <polygon points="340,100 443.92,160 443.92,280 340,340 236.08,280 236.08,160"/>
    <polygon points="340,70 469.9,145 469.9,295 340,370 210.1,295 210.1,145" stroke-width="1.2"/>
  </g>

  <!-- Axis lines -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="340" y1="220" x2="340" y2="70"/>
    <line x1="340" y1="220" x2="469.9" y2="145"/>
    <line x1="340" y1="220" x2="469.9" y2="295"/>
    <line x1="340" y1="220" x2="340" y2="370"/>
    <line x1="340" y1="220" x2="210.1" y2="295"/>
    <line x1="340" y1="220" x2="210.1" y2="145"/>
  </g>

  <!-- E-commerce profile -->
  <polygon points="340,130 469.9,145 469.9,295 340,280 314.02,235 288.04,190"
    fill="#EDE9FE" fill-opacity="0.72" stroke="#7C3AED" stroke-width="2"/>
  <g fill="#7C3AED">
    <circle cx="340" cy="130" r="4"/>
    <circle cx="469.9" cy="145" r="4"/>
    <circle cx="469.9" cy="295" r="4"/>
    <circle cx="340" cy="280" r="4"/>
    <circle cx="314.02" cy="235" r="4"/>
    <circle cx="288.04" cy="190" r="4"/>
  </g>

  <!-- News profile -->
  <polygon points="340,70 391.96,190 417.94,265 340,340 210.1,295 262.06,175"
    fill="#FEF3C7" fill-opacity="0.68" stroke="#D97706" stroke-width="2"/>
  <g fill="#D97706">
    <circle cx="340" cy="70" r="4"/>
    <circle cx="391.96" cy="190" r="4"/>
    <circle cx="417.94" cy="265" r="4"/>
    <circle cx="340" cy="340" r="4"/>
    <circle cx="210.1" cy="295" r="4"/>
    <circle cx="262.06" cy="175" r="4"/>
  </g>

  <!-- Scale labels -->
  <g font-size="11" text-anchor="middle" fill="#6B7280">
    <g>
      <rect x="347" y="179" width="20" height="22" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="357" y="194">1</text>
    </g>
    <g>
      <rect x="347" y="149" width="20" height="22" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="357" y="164">2</text>
    </g>
    <g>
      <rect x="347" y="119" width="20" height="22" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="357" y="134">3</text>
    </g>
    <g>
      <rect x="347" y="89" width="20" height="22" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="357" y="104">4</text>
    </g>
    <g>
      <rect x="348" y="65" width="20" height="22" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="358" y="80">5</text>
    </g>
  </g>

  <!-- Axis labels -->
  <g font-size="11" font-weight="600" fill="#1E1B4B">
    <text x="340" y="58" text-anchor="middle">Engagement</text>
    <text x="482" y="140" text-anchor="start">Revenue</text>
    <text x="482" y="302" text-anchor="start">Relevance</text>
    <text x="340" y="388" text-anchor="middle">Diversity</text>
    <text x="196" y="302" text-anchor="end">Freshness</text>
    <text x="196" y="140" text-anchor="end">Fairness</text>
  </g>

  <!-- Legend -->
  <rect x="40" y="62" width="126" height="58" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="52" y1="81" x2="72" y2="81" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="62" cy="81" r="3.5" fill="#7C3AED"/>
  <text x="80" y="85" font-size="11" fill="#1E1B4B">E-commerce</text>
  <line x1="52" y1="102" x2="72" y2="102" stroke="#D97706" stroke-width="2"/>
  <circle cx="62" cy="102" r="3.5" fill="#D97706"/>
  <text x="80" y="106" font-size="11" fill="#1E1B4B">News</text>
</svg>