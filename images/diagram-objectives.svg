<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" aria-labelledby="pb138-title pb138-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb138-title">One platform, three objectives</title>
<desc id="pb138-desc">The same recommender, viewer and catalog produce three different home screens depending on what it is told to maximize: watch time surfaces cliffhangers and autoplay, revenue surfaces premium rentals and promoted titles, satisfaction surfaces what the viewer would value. The objective decides what you see and whose goals win.</desc>
