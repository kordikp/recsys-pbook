  <text x="86" y="259" font-size="15" font-weight="700" text-anchor="end" fill="#4C1D95">2010–18</text>
  <rect x="122" y="224" width="494" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="140" y="250" font-size="16" font-weight="700" fill="#1E1B4B">Deep learning</text>
  <text x="140" y="271" font-size="15" fill="#4B5563">YouTube’s neural network, transformers</text>
  <path d="M523,236L543,236M523,236L543,248M523,236L543,260M523,236L543,272M523,248L543,236M523,248L543,248M523,248L543,260M523,248L543,272M523,260L543,236M523,260L543,248M523,260L543,260M523,260L543,272M523,272L543,236M523,272L543,248M523,272L543,260M523,272L543,272M543,236L563,236M543,236L563,248M543,236L563,260M543,236L563,272M543,248L563,236M543,248L563,248M543,248L563,260M543,248L563,272M543,260L563,236M543,260L563,248M543,260L563,260M543,260L563,272M543,272L563,236M543,272L563,248M543,272L563,260M543,272L563,272M563,236L583,236M563,236L583,248M563,236L583,260M563,236L583,272M563,248L583,236M563,248L583,248M563,248L583,260M563,248L583,272M563,260L583,236M563,260L583,248M563,260L583,260M563,260L583,272M563,272L583,236M563,272L583,248M563,272L583,260M563,272L583,272M583,236L603,236M583,236L603,248M583,236L603,260M583,236L603,272M583,248L603,236M583,248L603,248M583,248L603,260M583,248L603,272M583,260L603,236M583,260L603,248M583,260L603,260M583,260L603,272M583,272L603,236M583,272L603,248M583,272L603,260M583,272L603,272" stroke="#C4B5FD" stroke-width="1" fill="none"/>
  <g fill="#7C3AED">
    <circle cx="523" cy="236" r="2.8"/><circle cx="523" cy="248" r="2.8"/><circle cx="523" cy="260" r="2.8"/><circle cx="523" cy="272" r="2.8"/>
    <circle cx="543" cy="236" r="2.8"/><circle cx="543" cy="248" r="2.8"/><circle cx="543" cy="260" r="2.8"/><circle cx="543" cy="272" r="2.8"/>
    <circle cx="563" cy="236" r="2.8"/><circle cx="563" cy="248" r="2.8"/><circle cx="563" cy="260" r="2.8"/><circle cx="563" cy="272" r="2.8"/>
    <circle cx="583" cy="236" r="2.8"/><circle cx="583" cy="248" r="2.8"/><circle cx="583" cy="260" r="2.8"/><circle cx="583" cy="272" r="2.8"/>
    <circle cx="603" cy="236" r="2.8"/><circle cx="603" cy="248" r="2.8"/><circle cx="603" cy="260" r="2.8"/><circle cx="603" cy="272" r="2.8"/>
  </g>

  <!-- era 4: the twist -->
  <text x="86" y="327" font-size="15" font-weight="700" text-anchor="end" fill="#065F46">2019–22</text>
  <rect class="pb016-halo" style="animation-delay:2.4s" x="118" y="288" width="502" height="68" rx="13" fill="none" stroke="#10B981" stroke-width="5" stroke-opacity=".45"/>
  <rect x="122" y="292" width="494" height="60" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="140" y="318" font-size="16" font-weight="700" fill="#065F46">Simplicity strikes back</text>
  <text x="140" y="339" font-size="15" fill="#065F46">An “embarrassingly shallow” model matches deep nets</text>
  <use href="#pb016-grid" x="546" y="305" color="#10B981"/>

  <!-- era 5 -->
  <text x="86" y="395" font-size="15" font-weight="700" text-anchor="end" fill="#4C1D95">2023–now</text>
  <rect x="122" y="360" width="494" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="140" y="386" font-size="16" font-weight="700" fill="#1E1B4B">LLMs + lean models</text>
  <text x="140" y="407" font-size="15" fill="#4B5563">Ask in plain words · lean, efficient models</text>
  <path d="M514,374 h32 a6,6 0 0 1 6,6 v16 a6,6 0 0 1 -6,6 h-22 l-8,7 v-7 h-2 a6,6 0 0 1 -6,-6 v-16 a6,6 0 0 1 6,-6 z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/>
