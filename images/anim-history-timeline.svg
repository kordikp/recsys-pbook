  </defs>

  <rect x=".5" y=".5" width="639" height="479" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#1E1B4B">Thirty years of recommenders, in five eras</text>
  <text x="612" y="76" font-size="14" text-anchor="end" fill="#6B7280">Model complexity</text>

  <!-- spine -->
  <line x1="104" y1="118" x2="104" y2="390" stroke="#DDD6FE" stroke-width="3" stroke-linecap="round"/>

  <!-- era 1 -->
  <text x="86" y="123" font-size="15" font-weight="700" text-anchor="end" fill="#4C1D95">1992–98</text>
  <rect x="122" y="88" width="494" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="140" y="114" font-size="16" font-weight="700" fill="#1E1B4B">Collaborative filtering</text>
  <text x="140" y="135" font-size="15" fill="#4B5563">GroupLens, Amazon’s “Customers who bought…”</text>
  <use href="#pb016-grid" x="546" y="101" color="#7C3AED"/>

  <!-- era 2 -->
  <text x="86" y="191" font-size="15" font-weight="700" text-anchor="end" fill="#4C1D95">2003–09</text>
  <rect x="122" y="156" width="494" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="140" y="182" font-size="16" font-weight="700" fill="#1E1B4B">Industrial scale</text>
  <text x="140" y="203" font-size="15" fill="#92400E">Netflix Prize: $1M winner too complex to ship</text>
  <g color="#7C3AED">
    <use href="#pb016-grid" x="534" y="165"/>
    <use href="#pb016-grid" x="546" y="171"/>
    <use href="#pb016-grid" x="558" y="177"/>
  </g>

