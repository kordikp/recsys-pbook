<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .spark{animation:s 5s linear infinite}
    @keyframes s{0%{transform:translateX(0)}100%{transform:translateX(560px)}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Thirty Years of Recommender Systems</text>

  <line x1="90" y1="210" x2="710" y2="210" stroke="#9CA3AF" stroke-width="3"/>
  <circle class="spark" cx="105" cy="210" r="6" fill="#7C3AED"/>

  <g text-anchor="middle" font-size="12">
    <circle cx="120" cy="210" r="7" fill="#7C3AED"/>
    <text x="120" y="184" font-weight="800" font-size="14" fill="#4C1D95">1992</text>
    <rect x="62" y="232" width="116" height="52" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="120" y="252" font-weight="700" fill="#4C1D95">Tapestry</text>
    <text x="120" y="270" fill="#6B7280">first collaborative</text>

    <circle cx="270" cy="210" r="7" fill="#0EA5E9"/>
    <text x="270" y="184" font-weight="800" font-size="14" fill="#075985">2006</text>
    <rect x="212" y="120" width="116" height="52" rx="8" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="270" y="140" font-weight="700" fill="#075985">Netflix Prize</text>
    <text x="270" y="158" fill="#6B7280">MF goes mainstream</text>

    <circle cx="420" cy="210" r="7" fill="#10B981"/>
    <text x="420" y="184" font-weight="800" font-size="14" fill="#065F46">2016</text>
    <rect x="362" y="232" width="116" height="52" rx="8" fill="#D1FAE5" stroke="#10B981"/>
    <text x="420" y="252" font-weight="700" fill="#065F46">Deep learning</text>
    <text x="420" y="270" fill="#6B7280">YouTube DNN era</text>

    <circle cx="560" cy="210" r="7" fill="#D97706"/>
    <text x="560" y="184" font-weight="800" font-size="14" fill="#92400E">2019</text>
    <rect x="502" y="120" width="116" height="52" rx="8" fill="#FEF3C7" stroke="#D97706"/>
    <text x="560" y="140" font-weight="700" fill="#92400E">Two-tower + ANN</text>
    <text x="560" y="158" fill="#6B7280">retrieval at scale</text>

    <circle cx="690" cy="210" r="7" fill="#EF4444"/>
    <text x="690" y="184" font-weight="800" font-size="14" fill="#B91C1C">2024</text>
    <rect x="632" y="232" width="116" height="52" rx="8" fill="#FEE2E2" stroke="#EF4444"/>
    <text x="690" y="252" font-weight="700" fill="#B91C1C">LLMs arrive</text>
    <text x="690" y="270" fill="#6B7280">semantic cold start</text>
  </g>

  <text x="400" y="330" text-anchor="middle" font-size="13" fill="#6B7280">Each era kept the last one's core: patterns in behavior — and added a new way to read them.</text>
</svg>
