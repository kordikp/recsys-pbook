<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="pb016-title pb016-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb016-title">Thirty years of recommender systems, in five eras</title>
  <desc id="pb016-desc">A timeline from 1992 to today in five eras: collaborative filtering (1992–1998: GroupLens, Amazon’s “Customers who bought…”), industrial scale (2003–2009: the Netflix Prize, whose $1M winner was too complex to ship), deep learning (2010–2018: YouTube’s neural network, transformers), simplicity strikes back (2019–2022: an “embarrassingly shallow” linear model matches deep networks) and LLMs plus lean models (2023–now). Small icons show the typical model growing from one table to a pile of models to a deep network, then shrinking back. What lasted solved real problems at scale, not the fanciest math.</desc>
  <style>
    .pb016-ring{opacity:0;animation:pb016-ring 10s ease-out infinite}
    @keyframes pb016-ring{0%{opacity:0}3%{opacity:1}12%,100%{opacity:0}}
    .pb016-halo{opacity:0;animation:pb016-halo 10s ease-out infinite}
    @keyframes pb016-halo{0%{opacity:0}4%{opacity:1}24%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.pb016-ring,.pb016-halo{animation:none !important}}
  </style>
