      <rect x="0" y="0" width="7" height="7" rx="1.5" fill="currentColor"/>
      <rect x="9" y="0" width="7" height="7" rx="1.5" fill="#E5E7EB"/>
      <rect x="18" y="0" width="7" height="7" rx="1.5" fill="currentColor"/>
      <rect x="27" y="0" width="7" height="7" rx="1.5" fill="#E5E7EB"/>
      <rect x="0" y="9" width="7" height="7" rx="1.5" fill="#E5E7EB"/>
      <rect x="9" y="9" width="7" height="7" rx="1.5" fill="currentColor"/>
      <rect x="18" y="9" width="7" height="7" rx="1.5" fill="#E5E7EB"/>
      <rect x="27" y="9" width="7" height="7" rx="1.5" fill="currentColor"/>
      <rect x="0" y="18" width="7" height="7" rx="1.5" fill="currentColor"/>
      <rect x="9" y="18" width="7" height="7" rx="1.5" fill="#E5E7EB"/>
      <rect x="18" y="18" width="7" height="7" rx="1.5" fill="#E5E7EB"/>
      <rect x="27" y="18" width="7" height="7" rx="1.5" fill="currentColor"/>
      <rect x="0" y="27" width="7" height="7" rx="1.5" fill="#E5E7EB"/>
      <rect x="9" y="27" width="7" height="7" rx="1.5" fill="currentColor"/>
      <rect x="18" y="27" width="7" height="7" rx="1.5" fill="currentColor"/>
