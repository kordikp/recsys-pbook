    <g>
      <circle cx="190" cy="480" r="10" fill="#10B981"/>
      <path d="M190 491 L190 521 M190 499 L175 510 M190 499 L205 510 M190 521 L180 539 M190 521 L200 539" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g>
      <circle cx="320" cy="480" r="10" fill="#0EA5E9"/>
      <path d="M320 491 L320 521 M320 499 L305 510 M320 499 L335 510 M320 521 L310 539 M320 521 L330 539" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Deeper rounds keep the friend-of-friend trail intact.</text>
  </g>

  <!-- Panel 4 -->
  <g>
    <rect x="432" y="356" width="120" height="160" rx="8" fill="#FFFFFF" stroke="#6B7280"/>
    <text x="492" y="376" font-size="11" font-weight="700" fill="#1E1B4B" text-anchor="middle">PINSAGE MAP</text>
    <path d="M451 414 L480 392 L516 416 L536 390 M451 414 L476 449 L516 416 L532 466 M476 449 L510 484 L532 466" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <g fill="#EDE9FE" stroke="#7C3AED">
      <circle cx="451" cy="414" r="6"/>
      <circle cx="480" cy="392" r="6"/>
      <circle cx="516" cy="416" r="6"/>
      <circle cx="536" cy="390" r="6"/>
      <circle cx="476" cy="449" r="6"/>
      <circle cx="532" cy="466" r="6"/>
      <circle cx="510" cy="484" r="6"/>
    </g>
    <text x="492" y="505" font-size="10.5" fill="#6B7280" text-anchor="middle">3B nodes · 18B edges</text>

    <rect x="566" y="356" width="198" height="52" rx="9" fill="#FEF3C7" stroke="#D97706"/>
    <text x="665" y="376" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
      <tspan x="665" dy="0">Your fourth-hop baker</tspan>
      <tspan x="665" dy="17">is expecting you.</tspan>
    </text>

    <circle cx="607" cy="474" r="10" fill="#D97706"/>
    <path d="M607 485 L607 517 M607 493 L590 505 M607 493 L624 505 M607 517 L596 537 M607 517 L618 537" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="714" cy="474" r="10" fill="#7C3AED"/>
    <path d="M714 485 L714 517 M714 493 L697 505 M714 493 L731 505 M714 517 L703 537 M714 517 L725 537" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

    <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">PinSage scaled this walk to 3B nodes and 18B edges.</text>
  </g>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Graph neural recommenders preserve multi-hop paths, capturing structure matrix factors flatten.</text>
</svg>