<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 666" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb077-title pb077-desc">
<title id="pb077-title">The best advice travels through people</title>
<desc id="pb077-desc">Four-panel comic. Matrix factorization boils you down to two taste scores (savoury 0.9, sweet 0.1), so it skips cookies. A graph method like LightGCN keeps who-liked-what as links and follows them: layer 1 reaches Ana, who also likes olives and likes falafel (roughly what a classic also-liked model such as EASE finds); layer 2 reaches Ben, who also likes falafel and likes tahini cookies. You love the cookies and ask who Ben is: Ana's falafel buddy, two hops away. Taste scores flatten the trail; a graph follows it hop by hop. Pinterest's PinSage worked on a graph of 3 billion nodes and 18 billion edges.</desc>

<rect x=".5" y=".5" width="639" height="665" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">The best advice travels through people</text>

<!-- ===== Panel 1: matrix factorization ===== -->
<g transform="translate(16,52)">
  <rect x="0" y="0" width="298" height="264" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
  <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Matrix factorization</text>

  <path d="M24,42 H246 Q258,42 258,54 V86 Q258,98 246,98 H74 L66,148 L58,98 H24 Q12,98 12,86 V54 Q12,42 24,42 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="135" y="64" text-anchor="middle" font-size="16" fill="#1E1B4B">I boiled you down to</text>
  <text x="135" y="86" text-anchor="middle" font-size="16" fill="#1E1B4B">two numbers. Cookies? Skip.</text>

  <path d="M12,236.5 H286" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- recommender -->
  <path d="M41,236 V202 Q41,186 57,186 H71 Q87,186 87,202 V236 Z" fill="#7C3AED"/>
  <rect x="69" y="195" width="12" height="8" rx="2" fill="#FFFFFF"/>
  <circle cx="64" cy="168" r="16" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
  <circle cx="59" cy="166" r="2.2" fill="#1E1B4B"/>
  <circle cx="69" cy="166" r="2.2" fill="#1E1B4B"/>
  <path d="M59,174 Q64,178 69,174" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M86,206 L116,196" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
  <text x="64" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Recommender</text>

  <!-- taste card -->
  <rect x="120" y="118" width="166" height="104" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="134" y="142" font-size="14" font-weight="700" fill="#4C1D95">Your taste scores</text>
  <text x="134" y="174" font-size="15" fill="#1E1B4B">savoury</text>
  <rect x="198" y="163" width="50" height="12" rx="3" fill="#FFFFFF"/>
  <rect x="198" y="163" width="45" height="12" rx="3" fill="#7C3AED"/>
  <text x="256" y="174" font-size="14" font-weight="700" fill="#1E1B4B">0.9</text>
  <text x="134" y="204" font-size="15" fill="#1E1B4B">sweet</text>
  <rect x="198" y="193" width="50" height="12" rx="3" fill="#FFFFFF"/>
  <rect x="198" y="193" width="6" height="12" rx="2" fill="#7C3AED"/>
  <text x="256" y="204" font-size="14" font-weight="700" fill="#1E1B4B">0.1</text>
</g>

<!-- ===== Panel 2: graph, layer 1 ===== -->
<g transform="translate(326,52)">
  <rect x="0" y="0" width="298" height="264" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
  <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Graph (LightGCN), layer 1</text>
  <g transform="translate(-4,0)">

  <!-- edges -->
  <polyline points="34,92 79,160 124,92 169,160" fill="none" stroke="#EDE9FE" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="34,92 79,160 124,92 169,160" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="169,160 214,92 259,160" fill="none" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- people -->
  <text x="34" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">You</text>
  <circle cx="34" cy="92" r="15" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <circle cx="29.5" cy="90" r="1.8" fill="#1E1B4B"/><circle cx="38.5" cy="90" r="1.8" fill="#1E1B4B"/>
  <path d="M30,97 Q34,100 38,97" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>

  <text x="124" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Ana</text>
  <circle cx="124" cy="92" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="119.5" cy="90" r="1.8" fill="#1E1B4B"/><circle cx="128.5" cy="90" r="1.8" fill="#1E1B4B"/>
  <path d="M120,97 Q124,100 128,97" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>

  <text x="144" y="97" font-size="14" font-weight="700" fill="#7C3AED">hop 1</text>
  <text x="214" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#9CA3AF">Ben</text>
  <circle cx="214" cy="92" r="15" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <circle cx="209.5" cy="90" r="1.8" fill="#9CA3AF"/><circle cx="218.5" cy="90" r="1.8" fill="#9CA3AF"/>
  <path d="M210,97 Q214,100 218,97" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- items -->
  <circle cx="79" cy="160" r="21" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="79" y="168" text-anchor="middle" font-size="22">🫒</text>
  <text x="79" y="202" text-anchor="middle" font-size="15" fill="#4B5563">olives</text>

  <circle cx="169" cy="160" r="21" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
  <text x="169" y="168" text-anchor="middle" font-size="22">🧆</text>
  <text x="169" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">falafel</text>

  <circle cx="259" cy="160" r="21" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
  <text x="259" y="168" text-anchor="middle" font-size="22" opacity="0.35">🍪</text>
  <text x="259" y="202" text-anchor="middle" font-size="15" fill="#9CA3AF">cookies</text>

  </g>
  <rect x="12" y="210" width="274" height="46" rx="8" fill="#EDE9FE"/>
  <text x="149" y="229" text-anchor="middle" font-size="15" fill="#1E1B4B">Ana likes olives too, and falafel.</text>
  <text x="149" y="249" text-anchor="middle" font-size="14" fill="#4C1D95">1 layer ≈ classic “also liked” (EASE)</text>
</g>

<!-- ===== Panel 3: graph, layer 2 ===== -->
<g transform="translate(16,328)">
  <rect x="0" y="0" width="298" height="264" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
  <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Graph (LightGCN), layer 2</text>
  <g transform="translate(-4,0)">

  <polyline points="34,92 79,160 124,92 169,160 214,92 259,160" fill="none" stroke="#EDE9FE" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="34,92 79,160 124,92 169,160 214,92 259,160" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="34" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">You</text>
  <circle cx="34" cy="92" r="15" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <circle cx="29.5" cy="90" r="1.8" fill="#1E1B4B"/><circle cx="38.5" cy="90" r="1.8" fill="#1E1B4B"/>
  <path d="M30,97 Q34,100 38,97" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>

  <text x="124" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Ana</text>
  <circle cx="124" cy="92" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="119.5" cy="90" r="1.8" fill="#1E1B4B"/><circle cx="128.5" cy="90" r="1.8" fill="#1E1B4B"/>
  <path d="M120,97 Q124,100 128,97" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>

  <text x="144" y="97" font-size="14" font-weight="700" fill="#7C3AED">hop 1</text>
  <text x="234" y="97" font-size="14" font-weight="700" fill="#7C3AED">hop 2</text>
  <text x="214" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Ben</text>
  <circle cx="214" cy="92" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="209.5" cy="90" r="1.8" fill="#1E1B4B"/><circle cx="218.5" cy="90" r="1.8" fill="#1E1B4B"/>
  <path d="M210,97 Q214,100 218,97" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>

  <circle cx="79" cy="160" r="21" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="79" y="168" text-anchor="middle" font-size="22">🫒</text>
  <text x="79" y="202" text-anchor="middle" font-size="15" fill="#4B5563">olives</text>

  <circle cx="169" cy="160" r="21" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="169" y="168" text-anchor="middle" font-size="22">🧆</text>
  <text x="169" y="202" text-anchor="middle" font-size="15" fill="#4B5563">falafel</text>

  <circle cx="259" cy="160" r="21" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
  <text x="259" y="168" text-anchor="middle" font-size="22">🍪</text>
  <text x="259" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">cookies</text>

  </g>
  <rect x="12" y="210" width="274" height="46" rx="8" fill="#EDE9FE"/>
  <text x="149" y="229" text-anchor="middle" font-size="15" fill="#1E1B4B">Ben likes falafel too, and cookies!</text>
  <text x="149" y="249" text-anchor="middle" font-size="14" fill="#4C1D95">Each extra layer = one hop further</text>
</g>

<!-- ===== Panel 4: payoff ===== -->
<g transform="translate(326,328)">
  <rect x="0" y="0" width="298" height="264" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
  <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Dessert</text>

  <path d="M24,40 H164 Q176,40 176,52 V76 Q176,88 164,88 H78 L70,148 L62,88 H24 Q12,88 12,76 V52 Q12,40 24,40 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="94" y="60" text-anchor="middle" font-size="16" fill="#1E1B4B">Tahini cookies? Yes!</text>
  <text x="94" y="80" text-anchor="middle" font-size="16" fill="#1E1B4B">But who’s Ben?</text>

  <path d="M124,94 H276 Q288,94 288,106 V128 Q288,140 276,140 H234 L228,150 L222,140 H124 Q112,140 112,128 V106 Q112,94 124,94 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="200" y="114" text-anchor="middle" font-size="16" fill="#1E1B4B">Ana’s falafel buddy.</text>
  <text x="200" y="134" text-anchor="middle" font-size="16" fill="#1E1B4B">Two hops away.</text>

  <path d="M12,236.5 H286" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- you -->
  <path d="M47,236 V202 Q47,186 63,186 H77 Q93,186 93,202 V236 Z" fill="#10B981"/>
  <circle cx="70" cy="168" r="16" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
  <circle cx="65" cy="165" r="2.2" fill="#1E1B4B"/>
  <circle cx="75" cy="165" r="2.2" fill="#1E1B4B"/>
  <path d="M63,172 Q70,182 77,172 Z" fill="#1E1B4B" stroke="#1E1B4B" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M92,206 L110,196" stroke="#10B981" stroke-width="7" stroke-linecap="round"/>
  <text x="122" y="203" text-anchor="middle" font-size="22">🍪</text>
  <text x="70" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">You</text>

  <!-- recommender -->
  <path d="M205,236 V202 Q205,186 221,186 H235 Q251,186 251,202 V236 Z" fill="#7C3AED"/>
  <rect x="233" y="195" width="12" height="8" rx="2" fill="#FFFFFF"/>
  <circle cx="228" cy="168" r="16" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
  <circle cx="223" cy="166" r="2.2" fill="#1E1B4B"/>
  <circle cx="233" cy="166" r="2.2" fill="#1E1B4B"/>
  <path d="M222,174 Q228,179 234,173" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
  <text x="228" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Recommender</text>
</g>

<!-- takeaway -->
<text x="320" y="624" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">Scores flatten the trail. A <tspan fill="#7C3AED">graph</tspan> follows it, hop by hop.</text>
<text x="320" y="648" text-anchor="middle" font-size="14" fill="#4B5563">At scale: Pinterest’s PinSage worked on 3 billion nodes and 18 billion edges.</text>
</svg>
