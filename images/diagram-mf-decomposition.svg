<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 506" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb133-title pb133-desc">
<title id="pb133-title">Matrix factorization: R ≈ U × Vᵀ</title>
<desc id="pb133-desc">Matrix factorization replaces a mostly empty ratings matrix R with two thin matrices of learned taste factors, U for users and V for items; multiplying a user's row by an item's column fills any missing cell. Toy example with k = 2 factors (intensity, humor): You = [0.9, 0.2] times thriller A = [0.8, 0.1] gives 0.74, while comedy B gives only 0.27. At the scale in the text, 50 trillion mostly empty cells become about 10 billion learned numbers.</desc>
<rect x=".5" y=".5" width="639" height="505" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Matrix factorization: R ≈ U × Vᵀ</text>
<text x="320" y="59" text-anchor="middle" font-size="14" fill="#6B7280">Toy example: 3 users, 4 films, k = 2 taste factors</text>
