<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb074-title pb074-desc">
  <title id="pb074-title">The Librarian Reads More Than Books</title>
  <desc id="pb074-desc">Four-panel comic. A reader asks a librarian for something short and romantic. Clue 1, what the book is: the catalog card says Sunny Hearts is a 96-page upbeat romance. Clue 2, who she is: her member card says age 29, lives downtown, likes romance. Clue 3, what she does: she checked out three 900-page crime novels this week, "for a friend". The librarian combines all three clues and hands her Love at First Clue: short, romance, crime. A recommender reads three clues: what an item is, who you are and what you do; leave one out and the pick gets worse.</desc>

  <rect x="0.5" y="0.5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">The Librarian Reads More Than Books</text>

  <!-- ===== Panel 1: what the book IS ===== -->
  <g transform="translate(16,52)">
    <rect x="0" y="0" width="298" height="252" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
    <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">What the book IS</text>

    <path d="M24,42 H178 Q190,42 190,54 V80 Q190,92 178,92 H54 L44,108 L42,92 H24 Q12,92 12,80 V54 Q12,42 24,42 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="101" y="62" text-anchor="middle" font-size="15" fill="#1E1B4B">Something short and</text>
    <text x="101" y="82" text-anchor="middle" font-size="15" fill="#1E1B4B">romantic, please.</text>

    <!-- catalog card -->
    <rect x="72" y="110" width="154" height="94" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="86" y="131" font-size="14" font-weight="700" fill="#4B5563" letter-spacing="1">CATALOG</text>
    <text x="86" y="154" font-size="16" font-weight="700" fill="#1E1B4B">Sunny Hearts</text>
    <text x="86" y="175" font-size="15" fill="#1E1B4B">romance · upbeat</text>
    <text x="86" y="195" font-size="15" fill="#1E1B4B">96 pages</text>

    <path d="M12,210.5 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>

    <!-- reader -->
    <g transform="translate(38,210)">
      <path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#10B981"/>
      <circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
      <circle cx="-6" cy="-79" r="2.2" fill="#1E1B4B"/>
      <circle cx="6" cy="-79" r="2.2" fill="#1E1B4B"/>
      <path d="M-5,-71 Q0,-67 5,-71" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- librarian -->
    <g transform="translate(260,210)">
      <circle cx="0" cy="-96" r="8" fill="#4C1D95"/>
      <path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#7C3AED"/>
      <rect x="5" y="-46" width="12" height="8" rx="2" fill="#FFFFFF"/>
      <circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
      <circle cx="-7" cy="-78" r="5.5" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
      <circle cx="7" cy="-78" r="5.5" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
      <path d="M-1.5,-78 H1.5" stroke="#1E1B4B" stroke-width="1.6"/>
      <circle cx="-9" cy="-78" r="1.8" fill="#1E1B4B"/>
      <circle cx="5" cy="-78" r="1.8" fill="#1E1B4B"/>
      <path d="M-5,-68 Q0,-65 5,-68" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <rect x="84" y="220" width="130" height="24" rx="12" fill="#F3F4F6"/>
    <text x="149" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#4B5563">item attributes</text>
  </g>

  <!-- ===== Panel 2: who you ARE ===== -->
  <g transform="translate(326,52)">
    <rect x="0" y="0" width="298" height="252" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
    <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">Who you ARE</text>

    <path d="M24,42 H150 Q162,42 162,54 V80 Q162,92 150,92 H54 L44,108 L42,92 H24 Q12,92 12,80 V54 Q12,42 24,42 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="87" y="62" text-anchor="middle" font-size="15" fill="#1E1B4B">My card says it:</text>
    <text x="87" y="82" text-anchor="middle" font-size="15" fill="#1E1B4B">I love romance!</text>

    <!-- member card -->
    <rect x="72" y="110" width="154" height="94" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="86" y="131" font-size="14" font-weight="700" fill="#065F46" letter-spacing="1">MEMBER CARD</text>
    <text x="86" y="155" font-size="15" fill="#1E1B4B">Age: 29</text>
    <text x="86" y="175" font-size="15" fill="#1E1B4B">Lives: downtown</text>
    <text x="86" y="195" font-size="15" fill="#1E1B4B">Likes: <tspan font-weight="700">romance</tspan></text>

    <path d="M12,210.5 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>

    <g transform="translate(38,210)">
      <path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#10B981"/>
      <circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
      <path d="M-9,-79 Q-6,-83 -3,-79 M3,-79 Q6,-83 9,-79" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-6,-71 Q0,-65 6,-71" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(260,210)">
      <circle cx="0" cy="-96" r="8" fill="#4C1D95"/>
      <path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#7C3AED"/>
      <rect x="5" y="-46" width="12" height="8" rx="2" fill="#FFFFFF"/>
      <circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
      <circle cx="-7" cy="-78" r="5.5" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
      <circle cx="7" cy="-78" r="5.5" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
      <path d="M-1.5,-78 H1.5" stroke="#1E1B4B" stroke-width="1.6"/>
      <circle cx="-9" cy="-78" r="1.8" fill="#1E1B4B"/>
      <circle cx="5" cy="-78" r="1.8" fill="#1E1B4B"/>
      <path d="M-5,-68 Q0,-65 5,-68" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <rect x="94" y="220" width="110" height="24" rx="12" fill="#F3F4F6"/>
    <text x="149" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#4B5563">user profile</text>
  </g>

  <!-- ===== Panel 3: what you DO ===== -->
  <g transform="translate(16,316)">
    <rect x="0" y="0" width="298" height="252" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="24" cy="25" r="11" fill="#1E1B4B"/>
    <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">What you DO</text>

    <!-- librarian asks -->
    <path d="M104,42 H274 Q286,42 286,54 V80 Q286,92 274,92 H262 L256,104 L248,92 H104 Q92,92 92,80 V54 Q92,42 104,42 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="189" y="62" text-anchor="middle" font-size="15" fill="#1E1B4B">Your third 900-page</text>
    <text x="189" y="82" text-anchor="middle" font-size="15" fill="#1E1B4B">crime novel this week?</text>

    <!-- reader answers -->
    <path d="M74,100 H164 Q174,100 174,110 V120 Q174,130 164,130 H84 L62,136 L70,128 Q64,125 64,118 V110 Q64,100 74,100 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="119" y="120" text-anchor="middle" font-size="15" fill="#1E1B4B">For… a friend.</text>

    <!-- checkout stack -->
    <rect x="104" y="138" width="108" height="23" rx="3" fill="#1E1B4B"/>
    <text x="158" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">CRIME</text>
    <rect x="96" y="162" width="122" height="23" rx="3" fill="#312E81"/>
    <text x="157" y="179" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">CRIME</text>
    <rect x="100" y="186" width="116" height="24" rx="3" fill="#1E1B4B"/>
    <text x="158" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">CRIME</text>

    <path d="M12,210.5 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>

    <g transform="translate(38,210)">
      <path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#10B981"/>
      <circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
      <circle cx="-9" cy="-80" r="2.2" fill="#1E1B4B"/>
      <circle cx="3" cy="-80" r="2.2" fill="#1E1B4B"/>
      <path d="M-6,-69 Q-3,-72 0,-69 Q3,-66 6,-69" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-20,-92 Q-25,-84 -20,-81 Q-15,-84 -20,-92 Z" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(260,210)">
      <circle cx="0" cy="-96" r="8" fill="#4C1D95"/>
      <path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#7C3AED"/>
      <rect x="5" y="-46" width="12" height="8" rx="2" fill="#FFFFFF"/>
      <circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
      <circle cx="-7" cy="-78" r="5.5" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
      <circle cx="7" cy="-78" r="5.5" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
      <path d="M-1.5,-78 H1.5" stroke="#1E1B4B" stroke-width="1.6"/>
      <circle cx="-9" cy="-78" r="1.8" fill="#1E1B4B"/>
      <circle cx="5" cy="-78" r="1.8" fill="#1E1B4B"/>
      <path d="M-12,-87 H-3 M3,-89 Q7,-93 12,-89" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-4,-67 H4" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <rect x="104" y="220" width="90" height="24" rx="12" fill="#F3F4F6"/>
    <text x="149" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#4B5563">behavior</text>
  </g>

  <!-- ===== Panel 4: all three together ===== -->
  <g transform="translate(326,316)">
    <rect x="0" y="0" width="298" height="252" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="24" cy="25" r="11" fill="#7C3AED"/>
    <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="43" y="30" font-size="16" font-weight="700" fill="#1E1B4B">All three together</text>

    <path d="M24,42 H122 Q134,42 134,54 V80 Q134,92 122,92 H54 L44,108 L42,92 H24 Q12,92 12,80 V54 Q12,42 24,42 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="73" y="62" text-anchor="middle" font-size="15" fill="#1E1B4B">How did</text>
    <text x="73" y="82" text-anchor="middle" font-size="15" fill="#1E1B4B">you know?!</text>

    <path d="M156,42 H274 Q286,42 286,54 V80 Q286,92 274,92 H262 L256,104 L248,92 H156 Q144,92 144,80 V54 Q144,42 156,42 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="215" y="62" text-anchor="middle" font-size="15" fill="#1E1B4B">I read more</text>
    <text x="215" y="82" text-anchor="middle" font-size="15" fill="#1E1B4B">than books.</text>

    <!-- the pick -->
    <rect x="68" y="110" width="164" height="96" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="150" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Love at First Clue</text>
    <circle cx="92" cy="149" r="9" fill="#1E1B4B"/>
    <text x="92" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="108" y="154" font-size="15" fill="#1E1B4B">short</text>
    <circle cx="92" cy="171" r="9" fill="#1E1B4B"/>
    <text x="92" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="108" y="176" font-size="15" fill="#1E1B4B">romance</text>
    <circle cx="92" cy="193" r="9" fill="#1E1B4B"/>
    <text x="92" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="108" y="198" font-size="15" fill="#1E1B4B">crime</text>

    <path d="M12,210.5 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>

    <g transform="translate(38,210)">
      <path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#10B981"/>
      <circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
      <path d="M-9,-79 Q-6,-83 -3,-79 M3,-79 Q6,-83 9,-79" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-6,-71 Q0,-62 6,-71 Z" fill="#1E1B4B" stroke="#1E1B4B" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(260,210)">
      <circle cx="0" cy="-96" r="8" fill="#4C1D95"/>
      <path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#7C3AED"/>
      <rect x="5" y="-46" width="12" height="8" rx="2" fill="#FFFFFF"/>
      <circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
      <circle cx="-7" cy="-78" r="5.5" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
      <circle cx="7" cy="-78" r="5.5" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
      <path d="M-1.5,-78 H1.5" stroke="#1E1B4B" stroke-width="1.6"/>
      <path d="M-10,-78 Q-7,-81 -4,-78 M4,-78 Q7,-81 10,-78" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-6,-68 Q0,-63 6,-68" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <rect x="62" y="220" width="174" height="24" rx="12" fill="#EDE9FE"/>
    <text x="149" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">the recommendation</text>
  </g>

  <!-- takeaway -->
  <text x="320" y="598" text-anchor="middle" font-size="16" fill="#1E1B4B">A recommender reads three clues: <tspan font-weight="700" fill="#4C1D95">what it IS</tspan>, <tspan font-weight="700" fill="#4C1D95">who you ARE</tspan>, <tspan font-weight="700" fill="#4C1D95">what you DO</tspan>.</text>
  <text x="320" y="624" text-anchor="middle" font-size="16" fill="#1E1B4B">Leave one out and the pick gets worse.</text>
</svg>
