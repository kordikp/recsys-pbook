<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="698" height="478" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="350" y="25" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">RecSys Anti-Patterns</text>
  <text x="350" y="44" text-anchor="middle" font-size="11" fill="#6B7280">Common pitfalls that silently degrade recommender systems</text>

  <!-- 1. Accuracy Trap -->
  <g transform="translate(15,60)">
    <rect width="160" height="170" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <g transform="translate(65,8)">
      <polygon points="15,0 30,26 0,26" fill="#D97706"/>
      <text x="15" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
    </g>
    <text x="80" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Accuracy Trap</text>
    <g text-anchor="middle" font-size="11" fill="#6B7280">
      <text x="80" y="70">Optimizing accuracy alone</text>
      <text x="80" y="85">recommends only popular</text>
      <text x="80" y="100">items. High nDCG, zero</text>
      <text x="80" y="115">serendipity.</text>
    </g>
    <rect x="10" y="124" width="140" height="39" rx="6" fill="#FEE2E2"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Accuracy &#x2260;</text>
    <text x="80" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">User Satisfaction</text>
  </g>

  <!-- 2. Popularity Loop -->
  <g transform="translate(185,60)">
    <rect width="160" height="170" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <g transform="translate(65,8)">
      <polygon points="15,0 30,26 0,26" fill="#D97706"/>
      <text x="15" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
    </g>
    <text x="80" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Popularity Loop</text>
    <g text-anchor="middle" font-size="11" fill="#6B7280">
      <text x="80" y="70">Popular items get</text>
      <text x="80" y="85">recommended more, collect</text>
      <text x="80" y="100">more clicks, become even</text>
      <text x="80" y="115">more popular.</text>
    </g>
    <rect x="10" y="124" width="140" height="39" rx="6" fill="#FEE2E2"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Rich-get-richer</text>
    <text x="80" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">feedback loop</text>
  </g>

  <!-- 3. Power User Bias -->
  <g transform="translate(355,60)">
    <rect width="160" height="170" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <g transform="translate(65,8)">
      <polygon points="15,0 30,26 0,26" fill="#D97706"/>
      <text x="15" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
    </g>
    <text x="80" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Power User Bias</text>
    <g text-anchor="middle" font-size="11" fill="#6B7280">
      <text x="80" y="70">1% of users generate 50%</text>
      <text x="80" y="85">of training data. Model</text>
      <text x="80" y="100">overfits to power users'</text>
      <text x="80" y="115">tastes.</text>
    </g>
    <rect x="10" y="124" width="140" height="39" rx="6" fill="#FEE2E2"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Majority of users</text>
    <text x="80" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">underserved</text>
  </g>

  <!-- 4. Ignoring Temporal -->
  <g transform="translate(525,60)">
    <rect width="160" height="170" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <g transform="translate(65,8)">
      <polygon points="15,0 30,26 0,26" fill="#D97706"/>
      <text x="15" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
    </g>
    <text x="80" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Ignoring Temporal</text>
    <g text-anchor="middle" font-size="11" fill="#6B7280">
      <text x="80" y="70">Random train/test split</text>
      <text x="80" y="85">leaks future info into</text>
      <text x="80" y="100">training. Inflated offline</text>
      <text x="80" y="115">metrics.</text>
    </g>
    <rect x="10" y="124" width="140" height="39" rx="6" fill="#FEE2E2"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Data leakage from</text>
    <text x="80" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">the future</text>
  </g>

  <!-- 5. Cold Start Avoidance -->
  <g transform="translate(15,240)">
    <rect width="160" height="170" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <g transform="translate(65,8)">
      <polygon points="15,0 30,26 0,26" fill="#EF4444"/>
      <text x="15" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
    </g>
    <text x="80" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Cold Start Avoidance</text>
    <g text-anchor="middle" font-size="11" fill="#6B7280">
      <text x="80" y="70">Excluding new users/items</text>
      <text x="80" y="85">from evaluation. Model</text>
      <text x="80" y="100">looks great but fails</text>
      <text x="80" y="115">in production.</text>
    </g>
    <rect x="10" y="124" width="140" height="39" rx="6" fill="#FEE2E2"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Survival bias in</text>
    <text x="80" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">evaluation</text>
  </g>

  <!-- 6. Click Optimization -->
  <g transform="translate(185,240)">
    <rect width="160" height="170" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <g transform="translate(65,8)">
      <polygon points="15,0 30,26 0,26" fill="#EF4444"/>
      <text x="15" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
    </g>
    <text x="80" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Click Optimization</text>
    <g text-anchor="middle" font-size="11" fill="#6B7280">
      <text x="80" y="70">Maximizing clicks</text>
      <text x="80" y="85">promotes clickbait. Users</text>
      <text x="80" y="100">click but bounce</text>
      <text x="80" y="115">immediately.</text>
    </g>
    <rect x="10" y="124" width="140" height="39" rx="6" fill="#FEE2E2"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Clicks &#x2260;</text>
    <text x="80" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Engagement</text>
  </g>

  <!-- 7. Feature Kitchen Sink -->
  <g transform="translate(355,240)">
    <rect width="160" height="170" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <g transform="translate(65,8)">
      <polygon points="15,0 30,26 0,26" fill="#EF4444"/>
      <text x="15" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
    </g>
    <text x="80" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Feature Kitchen Sink</text>
    <g text-anchor="middle" font-size="11" fill="#6B7280">
      <text x="80" y="70">Adding every available</text>
      <text x="80" y="85">feature without ablation.</text>
      <text x="80" y="100">Noise drowns signal;</text>
      <text x="80" y="115">latency increases.</text>
    </g>
    <rect x="10" y="124" width="140" height="39" rx="6" fill="#FEE2E2"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">More features &#x2260;</text>
    <text x="80" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Better model</text>
  </g>

  <!-- 8. Position Bias -->
  <g transform="translate(525,240)">
    <rect width="160" height="170" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <g transform="translate(65,8)">
      <polygon points="15,0 30,26 0,26" fill="#EF4444"/>
      <text x="15" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
    </g>
    <text x="80" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Position Bias</text>
    <g text-anchor="middle" font-size="11" fill="#6B7280">
      <text x="80" y="70">Top-ranked items get clicked</text>
      <text x="80" y="85">regardless of relevance.</text>
      <text x="80" y="100">Model learns position,</text>
      <text x="80" y="115">not quality.</text>
    </g>
    <rect x="10" y="124" width="140" height="39" rx="6" fill="#FEE2E2"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Position &#x2260;</text>
    <text x="80" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Relevance</text>
  </g>

  <!-- Bottom note -->
  <rect x="120" y="424" width="460" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="350" y="441" text-anchor="middle" font-size="11" fill="#1E1B4B">Each anti-pattern can persist undetected for months</text>
  <text x="350" y="456" text-anchor="middle" font-size="11" fill="#1E1B4B">if only standard accuracy metrics are tracked.</text>
</svg>