<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Collaborative filtering recommendation demo</title>
  <desc id="desc">An interaction matrix identifies Alice as a user similar to you, then predicts that you may like an unseen action movie.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="269" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <!-- Interaction matrix -->
  <rect x="14" y="14" width="266" height="230" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="28" y="37" font-size="15" font-weight="700" fill="#1E1B4B">Interaction Matrix</text>

  <text x="125" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">Sci-Fi</text>
  <text x="168" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">Drama</text>
  <text x="211" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">Action</text>
  <text x="254" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">Comedy</text>

  <!-- You -->
  <rect x="24" y="68" width="244" height="28" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="59" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">You</text>
  <text x="125" y="87" text-anchor="middle" font-size="14" fill="#10B981">👍</text>
  <text x="168" y="87" text-anchor="middle" font-size="14" fill="#10B981">👍</text>
  <text x="211" y="87" text-anchor="middle" font-size="15" fill="#6B7280">·</text>
  <text x="254" y="87" text-anchor="middle" font-size="15" fill="#6B7280">·</text>

  <!-- Bob -->
  <rect x="24" y="97" width="244" height="28" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="59" y="116" text-anchor="middle" font-size="12" fill="#1E1B4B">Bob</text>
  <text x="125" y="116" text-anchor="middle" font-size="15" fill="#6B7280">·</text>
  <text x="168" y="116" text-anchor="middle" font-size="15" fill="#6B7280">·</text>
  <text x="211" y="116" text-anchor="middle" font-size="14" fill="#6B7280">👍</text>
  <text x="254" y="116" text-anchor="middle" font-size="14" fill="#6B7280">👍</text>

  <!-- Carol -->
  <rect x="24" y="126" width="244" height="28" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="59" y="145" text-anchor="middle" font-size="12" fill="#1E1B4B">Carol</text>
  <text x="125" y="145" text-anchor="middle" font-size="14" fill="#10B981">👍</text>
  <text x="168" y="145" text-anchor="middle" font-size="15" fill="#6B7280">·</text>
  <text x="211" y="145" text-anchor="middle" font-size="15" fill="#6B7280">·</text>
  <text x="254" y="145" text-anchor="middle" font-size="14" fill="#6B7280">👍</text>

  <!-- Alice, the similar user -->
  <rect x="24" y="155" width="244" height="28" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="59" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Alice</text>
  <text x="125" y="174" text-anchor="middle" font-size="14" fill="#10B981">👍</text>
  <text x="168" y="174" text-anchor="middle" font-size="14" fill="#10B981">👍</text>
  <text x="211" y="174" text-anchor="middle" font-size="14" fill="#10B981">👍</text>
  <text x="254" y="174" text-anchor="middle" font-size="15" fill="#6B7280">·</text>

  <text x="146" y="197" text-anchor="middle" font-size="11" fill="#6B7280">· = not seen yet</text>
  <rect x="65" y="204" width="162" height="27" rx="13.5" fill="#D1FAE5"/>
  <circle cx="82" cy="217.5" r="5" fill="#10B981"/>
  <text x="151" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Similar users found</text>

  <!-- Prediction arrow -->
  <text x="302" y="111" text-anchor="middle" font-size="11" font-weight="700" fill="#10B981">predict</text>
  <line x1="287" y1="123" x2="319" y2="123" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- Recommendation result -->
  <rect x="326" y="14" width="300" height="230" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="476" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Recommended for You</text>
  <text x="476" y="55" text-anchor="middle" font-size="11" fill="#6B7280">Items you haven't seen — predicted</text>
  <text x="476" y="68" text-anchor="middle" font-size="11" fill="#6B7280">from similar users</text>

  <!-- Recommended item -->
  <rect x="336" y="80" width="132" height="82" rx="9" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="402" y="103" text-anchor="middle" font-size="18">🎬</text>
  <text x="402" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Action Movie</text>
  <text x="402" y="140" text-anchor="middle" font-size="11" fill="#1E1B4B">Alice 👍 → likely</text>
  <text x="402" y="154" text-anchor="middle" font-size="11" fill="#1E1B4B">for you</text>

  <!-- Item without a matching signal -->
  <rect x="480" y="80" width="132" height="82" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="546" y="103" text-anchor="middle" font-size="18">😄</text>
  <text x="546" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Comedy</text>
  <text x="546" y="140" text-anchor="middle" font-size="11" fill="#6B7280">No similar user</text>
  <text x="546" y="154" text-anchor="middle" font-size="11" fill="#6B7280">signal</text>

  <text x="476" y="183" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">Find similar users → See what they liked →</text>
  <text x="476" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">Recommend unseen items</text>

  <text x="476" y="220" text-anchor="middle" font-size="11" fill="#6B7280">This is how Netflix, Spotify, and Amazon</text>
  <text x="476" y="234" text-anchor="middle" font-size="11" fill="#6B7280">work at scale</text>

  <text x="320" y="263" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">Collaborative Filtering — the foundation of modern recommender systems</text>
</svg>