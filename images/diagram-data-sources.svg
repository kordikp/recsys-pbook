<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb118-title pb118-desc">
  <title id="pb118-title">Three clues, one recommendation: what it is, who you are, what you do</title>
  <desc id="pb118-desc">A recommender combines three kinds of data: item metadata (what each video IS), user attributes (who YOU are) and interactions (what you DO). Your profile says industry analysis, but you watch product design three hours a day, so the recommender trusts the behavior and picks the design video next.</desc>
  <defs>
    <marker id="pb118-ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="pb118-ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
    <marker id="pb118-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="395" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <text x="320" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Three clues, one recommendation</text>
  <text x="320" y="60" text-anchor="middle" font-size="14" fill="#6B7280">e.g. picking your next video</text>

  <!-- ===== Clue 1: what it IS ===== -->
  <g transform="translate(16,78)">
    <rect x="0" y="0" width="192" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="16" y="32" font-size="20">🎬</text>
    <text x="46" y="32" font-size="18" font-weight="700" fill="#1E1B4B">What it IS</text>
    <text x="46" y="53" font-size="15" fill="#4B5563">item metadata</text>
    <rect x="12" y="68" width="168" height="32" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
    <text x="24" y="89" font-size="15" fill="#1E1B4B">Video A · design</text>
    <rect x="12" y="106" width="168" height="32" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
    <text x="24" y="127" font-size="15" fill="#1E1B4B">Video B · analysis</text>
  </g>

  <!-- ===== Clue 2: who YOU are ===== -->
  <g transform="translate(224,78)">
    <rect x="0" y="0" width="192" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="16" y="32" font-size="20">👤</text>
    <text x="46" y="32" font-size="18" font-weight="700" fill="#1E1B4B">Who YOU are</text>
    <text x="46" y="53" font-size="15" fill="#4B5563">user attributes</text>
    <rect x="12" y="68" width="168" height="32" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
    <text x="24" y="89" font-size="15" fill="#1E1B4B">English · Berlin</text>
    <rect x="12" y="106" width="168" height="32" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="24" y="127" font-size="15" fill="#92400E">Profile: analysis</text>
  </g>

  <!-- ===== Clue 3: what you DO (strongest) ===== -->
  <g transform="translate(432,78)">
    <rect x="0" y="0" width="192" height="150" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="16" y="32" font-size="20">👆</text>
    <text x="46" y="32" font-size="18" font-weight="700" fill="#1E1B4B">What you DO</text>
    <text x="46" y="53" font-size="15" fill="#065F46">interaction data</text>
    <rect x="12" y="68" width="168" height="32" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="24" y="89" font-size="15" fill="#1E1B4B">Skips analysis</text>
    <rect x="12" y="106" width="168" height="32" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="24" y="127" font-size="15" font-weight="700" fill="#065F46">3 h/day of design</text>
  </g>

  <!-- the clash between stated and actual taste -->
  <circle cx="424" cy="200" r="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="424" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">vs</text>

  <!-- clues flow into the recommender -->
  <line x1="112" y1="232" x2="280" y2="268" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pb118-ah-grey)"/>
  <line x1="320" y1="232" x2="320" y2="267" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pb118-ah-grey)"/>
  <line x1="528" y1="232" x2="360" y2="268" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb118-ah-green)"/>

  <!-- speech bubble -->
  <rect x="16" y="274" width="192" height="60" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M207.25,296 L218,304 L207.25,312" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="205" y="297" width="3" height="14" fill="#FFFFFF"/>
  <text x="112" y="299" text-anchor="middle" font-size="15" fill="#1E1B4B">You say analysis.</text>
  <text x="112" y="321" text-anchor="middle" font-size="15" fill="#1E1B4B">Your clicks say design.</text>

  <!-- the recommender -->
  <rect x="226" y="272" width="180" height="64" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <g transform="translate(236,6)">
    <line x1="20" y1="282" x2="20" y2="289" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="281" r="2.5" fill="#7C3AED"/>
    <rect x="7" y="289" width="26" height="22" rx="7" fill="#7C3AED"/>
    <circle cx="15" cy="298" r="2.6" fill="#FFFFFF"/>
    <circle cx="25" cy="298" r="2.6" fill="#FFFFFF"/>
    <path d="M15.5,304 Q20,309 24.5,304" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
  <text x="282" y="310" font-size="16" font-weight="700" fill="#4C1D95">Recommender</text>

  <line x1="408" y1="304" x2="426" y2="304" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb118-ah-purple)"/>

  <!-- the result -->
  <rect x="432" y="272" width="192" height="64" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="448" y="297" font-size="14" fill="#4B5563">Next up for you</text>
  <text x="448" y="322" font-size="16" font-weight="700" fill="#1E1B4B">▶ Video A · design</text>

  <text x="320" y="374" text-anchor="middle" font-size="16" font-weight="600" fill="#1E1B4B">All three help; when they clash, <tspan font-weight="700" fill="#065F46">what you DO</tspan> wins.</text>
</svg>
