<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 430" width="500" height="430" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowAxis" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1E1B4B"/>
    </marker>
    <marker id="arrowAxisUp" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto-start-reverse">
      <path d="M0,6 L4,0 L8,6 Z" fill="#1E1B4B"/>
    </marker>
    <marker id="arrowMove" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="498" height="428" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Multi-Objective Optimization</text>
  <text x="250" y="44" text-anchor="middle" font-size="11" fill="#6B7280">Pareto frontier: trade-offs between competing objectives</text>

  <!-- Axes -->
  <line x1="70" y1="340" x2="460" y2="340" stroke="#1E1B4B" stroke-width="1.5" marker-end="url(#arrowAxis)"/>
  <text x="270" y="371" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1B4B">Engagement</text>

  <line x1="70" y1="340" x2="70" y2="58" stroke="#1E1B4B" stroke-width="1.5" marker-end="url(#arrowAxisUp)"/>
  <text x="30" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1B4B" transform="rotate(-90 30 200)">Diversity</text>

  <!-- Axis tick marks -->
  <g stroke="#1E1B4B" stroke-width="1">
    <line x1="160" y1="340" x2="160" y2="345"/>
    <line x1="260" y1="340" x2="260" y2="345"/>
    <line x1="360" y1="340" x2="360" y2="345"/>
    <line x1="70" y1="270" x2="65" y2="270"/>
    <line x1="70" y1="200" x2="65" y2="200"/>
    <line x1="70" y1="130" x2="65" y2="130"/>
  </g>

  <!-- Regions -->
  <path d="M100,80 C180,78 280,95 350,120 L400,180 L440,300 L440,60 L100,60 Z" fill="#FEE2E2" fill-opacity="0.48"/>
  <path d="M100,80 C160,82 230,100 290,140 C330,168 370,220 400,300 L400,340 L70,340 L70,80 Z" fill="#EDE9FE" fill-opacity="0.55"/>

  <text x="322" y="92" font-size="12" fill="#EF4444" font-style="italic">Infeasible</text>
  <text x="280" y="315" font-size="12" fill="#6B7280" font-style="italic">Suboptimal</text>

  <!-- Pareto frontier -->
  <path d="M100,80 C160,82 230,100 290,140 C330,168 370,220 400,300" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <text x="148" y="72" font-size="11" font-weight="600" fill="#7C3AED">Pareto Frontier</text>

  <!-- Max Diversity -->
  <circle cx="118" cy="84" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="100" y="111" font-size="11" font-weight="600" fill="#10B981">Max Diversity</text>
  <text x="100" y="127" font-size="11" fill="#6B7280">Low engagement</text>

  <!-- Balanced -->
  <circle cx="230" cy="104" r="6" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
  <text x="241" y="91" font-size="11" font-weight="600" fill="#7C3AED">Balanced</text>

  <!-- Current system -->
  <circle cx="270" cy="210" r="8" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="284" y="188" width="112" height="46" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="340" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#D97706">Current System</text>
  <text x="340" y="224" text-anchor="middle" font-size="11" fill="#6B7280">room to improve</text>

  <!-- Target -->
  <circle cx="310" cy="130" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="322" y="115" width="72" height="30" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="358" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Target</text>

  <!-- Improvement direction -->
  <line x1="275" y1="203" x2="304" y2="137" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowMove)"/>

  <!-- Max Engagement -->
  <circle cx="390" cy="270" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
  <text x="378" y="252" text-anchor="end" font-size="11" font-weight="600" fill="#EF4444">Max Engagement</text>
  <text x="378" y="294" text-anchor="end" font-size="11" fill="#6B7280">Filter bubble risk</text>

  <!-- Legend -->
  <rect x="72" y="390" width="356" height="28" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="89" cy="404" r="4" fill="#7C3AED"/>
  <text x="99" y="408" font-size="11" fill="#6B7280">On frontier (optimal trade-off)</text>
  <circle cx="261" cy="404" r="4" fill="#D97706"/>
  <text x="271" y="408" font-size="11" fill="#6B7280">Off frontier (can improve both)</text>
</svg>