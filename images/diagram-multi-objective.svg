<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb136-title pb136-desc">
<title id="pb136-title">Pareto frontier: relevance versus diversity</title>
<desc id="pb136-desc">Five ranking configurations from the table plotted by relevance (nDCG@10) and diversity (intra-list distance). Pure relevance, mild diversification, balanced and heavy diversification form the Pareto frontier: moving along it, more diversity always costs relevance. Random ranking lies below it and is dominated, because heavy diversification beats it on both axes (0.61 versus 0.35 relevance, 0.84 versus 0.80 diversity).</desc>
<rect x=".5" y=".5" width="639" height="483" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Pareto frontier: relevance vs. diversity</text>
<text x="320" y="59" text-anchor="middle" font-size="14" fill="#6B7280">Five rankings from the table · higher is better on both axes</text>
<rect x="16" y="74" width="608" height="364" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<g stroke="#E5E7EB" stroke-width="1">
<line x1="96" y1="92" x2="576" y2="92"/>
<line x1="96" y1="162" x2="576" y2="162"/>
<line x1="96" y1="232" x2="576" y2="232"/>
<line x1="96" y1="302" x2="576" y2="302"/>
<line x1="256" y1="92" x2="256" y2="372"/>
<line x1="416" y1="92" x2="416" y2="372"/>
<line x1="576" y1="92" x2="576" y2="372"/>
</g>
<g stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round">
<line x1="96" y1="92" x2="96" y2="372"/>
<line x1="96" y1="372" x2="576" y2="372"/>
</g>
<g font-size="14" fill="#6B7280" text-anchor="end">
<text x="86" y="377">0.2</text>
<text x="86" y="307">0.4</text>
<text x="86" y="237">0.6</text>
<text x="86" y="167">0.8</text>
<text x="86" y="97">1.0</text>
</g>
<g font-size="14" fill="#6B7280" text-anchor="middle">
<text x="96" y="394">0.3</text>
<text x="256" y="394">0.5</text>
<text x="416" y="394">0.7</text>
<text x="576" y="394">0.9</text>
</g>
<text x="336" y="422" text-anchor="middle" font-size="15" font-weight="600" fill="#1E1B4B">Relevance (nDCG@10) →</text>
<text x="0" y="0" transform="translate(46 232) rotate(-90)" text-anchor="middle" font-size="15" font-weight="600" fill="#1E1B4B">Diversity (intra-list distance) →</text>
<rect x="136" y="92" width="440" height="70" fill="#FEF3C7" fill-opacity="0.6" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="566" y="114" text-anchor="end" font-size="14" font-weight="600" fill="#92400E">better than random on both</text>
<polyline points="344,148 440,204 488,260 512,334" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#7C3AED" stroke="#FFFFFF" stroke-width="2">
<circle cx="344" cy="148" r="7"/>
<circle cx="440" cy="204" r="7"/>
<circle cx="488" cy="260" r="7"/>
<circle cx="512" cy="334" r="7"/>
</g>
<text x="482" y="232" font-size="15" font-weight="700" fill="#7C3AED">Pareto frontier</text>
<g font-size="15" fill="#1E1B4B">
<text x="332" y="153" text-anchor="end">Heavy diversification</text>
<text x="452" y="209">Balanced</text>
<text x="474" y="265" text-anchor="end">Mild diversification</text>
<text x="500" y="339" text-anchor="end">Pure relevance</text>
</g>
<line x1="136" y1="170" x2="136" y2="178" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
<circle cx="136" cy="162" r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
<rect x="104" y="178" width="250" height="66" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
<text x="116" y="199" font-size="15" font-weight="700" fill="#1E1B4B">Random ranking: dominated</text>
<text x="116" y="218" font-size="14" fill="#92400E">Heavy diversification wins both:</text>
<text x="116" y="236" font-size="14" fill="#92400E">0.61 &gt; 0.35 and 0.84 &gt; 0.80</text>
<text x="320" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B"><tspan fill="#7C3AED">On the frontier</tspan>, more diversity costs relevance. <tspan fill="#92400E">Below it</tspan>, you can gain both.</text>
</svg>
