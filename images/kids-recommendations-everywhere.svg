<text x="62" y="473" text-anchor="middle" font-size="26" font-weight="800" fill="#4C1D95">8</text>
<text x="96" y="458" font-size="16" font-weight="700" fill="#1E1B4B">before bedtime — and that skips dating apps, banking, Slack.</text>
<text x="96" y="480" font-size="15" fill="#4B5563">Try it: count the ones in your own day.</text>
