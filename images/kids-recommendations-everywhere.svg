<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 504" role="img" aria-labelledby="pb155-title pb155-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb155-title">One ordinary day, eight recommenders</title>
<desc id="pb155-desc">A toy day from 7:00 to 23:50 passes through eight apps — Google News, Spotify, LinkedIn, Google Search, TikTok, Amazon, Netflix and YouTube — and each one fills a slot with picks from a recommender, under labels like Discover Weekly, For You, Because you watched and Up Next. Once you know the labels, you see recommenders everywhere.</desc>
<rect x=".5" y=".5" width="639" height="503" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">One ordinary day, eight recommenders</text>
<g font-size="14" fill="#4B5563"><text x="320" y="66" text-anchor="middle">A toy day ·  <tspan fill="#4C1D95" font-weight="600">purple</tspan> = a slot a recommender fills</text></g>
