<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb054-title pb054-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb054-title">The customer is always right to edit</title>
<desc id="pb054-desc">Four-panel comic about controlling your recommendation data. 1, the deal: you give the recommender data about you and get better picks in return. 2, Not interested: you say “not interested” to more true crime and it notes to show less of it. 3, clear history and profiles: power tools from your partner's weekend are cleared from your history and your partner gets a separate profile. 4, your legal rights: under GDPR or CCPA you can see, take a copy of, and delete everything it knows about you. Private browsing and privacy settings are also in the toolkit.</desc>
