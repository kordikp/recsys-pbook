<text x="224" y="405" font-size="15" font-weight="600" fill="#1E1B4B">Pipelines</text>
<text x="224" y="423" font-size="14" fill="#6B7280">Airflow</text>
<rect x="346" y="385" width="124" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="358" y="405" font-size="15" font-weight="600" fill="#1E1B4B">A/B tests</text>
<text x="358" y="423" font-size="14" fill="#6B7280">Eppo, Statsig</text>
<rect x="480" y="385" width="124" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="492" y="405" font-size="15" font-weight="600" fill="#1E1B4B">Monitoring</text>
<text x="492" y="423" font-size="14" fill="#6B7280">drift, latency</text>
<text x="320" y="476" text-anchor="middle" font-size="16" font-weight="600" fill="#1E1B4B">The algorithm is <tspan font-weight="800" fill="#7C3AED">1 box of 12</tspan> — the rest you build or buy.</text>
</svg>
