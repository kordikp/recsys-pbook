<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="598" height="448" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E1B4B">Recommender System Tech Stack</text>
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#6B7280">Layered architecture from data ingestion to orchestration</text>

  <!-- Layer 4: Orchestration -->
  <g transform="translate(60,72)">
    <rect x="0" y="0" width="480" height="72" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="240" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#7C3AED">Orchestration</text>

    <g transform="translate(30,30)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#7C3AED"/>
      <text x="60" y="20" text-anchor="middle" font-size="11" fill="#1E1B4B">ML Pipeline</text>
    </g>
    <g transform="translate(175,30)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#7C3AED"/>
      <text x="60" y="20" text-anchor="middle" font-size="11" fill="#1E1B4B">A/B Testing</text>
    </g>
    <g transform="translate(320,30)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#7C3AED"/>
      <text x="65" y="20" text-anchor="middle" font-size="11" fill="#1E1B4B">Monitoring</text>
    </g>
  </g>

  <!-- Serving to Orchestration -->
  <line x1="300" y1="167" x2="300" y2="152" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Layer 3: Serving -->
  <g transform="translate(60,175)">
    <rect x="0" y="0" width="480" height="72" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="240" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#0EA5E9">Serving</text>

    <g transform="translate(20,30)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#0EA5E9"/>
      <text x="65" y="20" text-anchor="middle" font-size="11" fill="#1E1B4B">Model Serving</text>
    </g>
    <g transform="translate(175,30)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#0EA5E9"/>
      <text x="60" y="20" text-anchor="middle" font-size="11" fill="#1E1B4B">ANN Index</text>
    </g>
    <g transform="translate(320,30)">
      <rect x="0" y="0" width="140" height="32" rx="6" fill="#FFFFFF" stroke="#0EA5E9"/>
      <text x="70" y="20" text-anchor="middle" font-size="11" fill="#1E1B4B">Feature Lookup</text>
    </g>
  </g>

  <!-- Training to Serving -->
  <line x1="300" y1="270" x2="300" y2="255" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Layer 2: Training -->
  <g transform="translate(60,278)">
    <rect x="0" y="0" width="480" height="72" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="240" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97706">Training</text>

    <g transform="translate(60,30)">
      <rect x="0" y="0" width="150" height="32" rx="6" fill="#FFFFFF" stroke="#D97706"/>
      <text x="75" y="20" text-anchor="middle" font-size="11" fill="#1E1B4B">Offline Training</text>
    </g>
    <g transform="translate(260,30)">
      <rect x="0" y="0" width="170" height="32" rx="6" fill="#FFFFFF" stroke="#D97706"/>
      <text x="85" y="20" text-anchor="middle" font-size="11" fill="#1E1B4B">Experiment Tracking</text>
    </g>
  </g>

  <!-- Data to Training -->
  <line x1="300" y1="373" x2="300" y2="358" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Layer 1: Data Layer -->
  <g transform="translate(60,381)">
    <rect x="0" y="0" width="480" height="58" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
    <text x="240" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E1B4B">Data Layer</text>

    <g transform="translate(20,26)">
      <rect x="0" y="0" width="120" height="26" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/>
      <text x="60" y="17" text-anchor="middle" font-size="11" fill="#1E1B4B">Kafka</text>
    </g>
    <g transform="translate(170,26)">
      <rect x="0" y="0" width="140" height="26" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/>
      <text x="70" y="17" text-anchor="middle" font-size="11" fill="#1E1B4B">Feature Store</text>
    </g>
    <g transform="translate(340,26)">
      <rect x="0" y="0" width="130" height="26" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/>
      <text x="65" y="17" text-anchor="middle" font-size="11" fill="#1E1B4B">Data Warehouse</text>
    </g>
  </g>

  <!-- Side labels -->
  <text x="20" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6B7280" transform="rotate(-90,20,112)">TOP</text>
  <text x="20" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#6B7280" transform="rotate(-90,20,410)">BASE</text>
  <line x1="35" y1="85" x2="35" y2="430" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3,3"/>
</svg>