<text x="464" y="256" font-size="15" font-weight="600" fill="#1E1B4B">ANN search</text>
<text x="464" y="274" font-size="14" fill="#6B7280">FAISS, Milvus</text>
<rect x="452" y="290" width="152" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="464" y="310" font-size="15" font-weight="600" fill="#1E1B4B">Online features</text>
<text x="464" y="328" font-size="14" fill="#6B7280">Redis, Flink</text>
<path d="M528 352 L528 368" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
<path d="M204 259 L224 259" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb140-ak)"/>
