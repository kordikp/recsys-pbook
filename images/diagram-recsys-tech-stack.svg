<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb140-title pb140-desc">
<title id="pb140-title">A recommender is a stack, not an algorithm</title>
<desc id="pb140-desc">A production recommender has four layers: data (event streams, feature store, warehouse), training (the algorithm, experiment tracking, tuning), serving (model serving, ANN search, online features) and orchestration (pipelines, A/B tests, monitoring) running underneath all of them. User clicks flow in, a ranked list returns in under 200 ms, and the algorithm is just one of twelve boxes.</desc>
<defs><marker id="pb140-ag" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#10B981"/></marker><marker id="pb140-ak" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#9CA3AF"/></marker></defs>
<rect x=".5" y=".5" width="639" height="495" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">A recommender is a stack, not an algorithm</text>
<circle cx="320" cy="60" r="10" fill="#10B981"/><path d="M304 98 v-8 a16 16 0 0 1 32 0 v8 z" fill="#10B981"/>
<path d="M300 86 L122 86 Q112 86 112 96 L112 124" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb140-ag)"/>
<text x="206" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">clicks, views</text>
<path d="M528 130 L528 96 Q528 86 518 86 L348 86" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb140-ag)"/>
<text x="450" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">ranked list in &lt; 200 ms</text>
<rect x="24" y="132" width="176" height="216" rx="12" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="48" cy="158" r="12" fill="#1E1B4B"/><text x="48" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="68" y="164" font-size="17" font-weight="700" fill="#1E1B4B">Data</text>
<rect x="36" y="182" width="152" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="48" y="202" font-size="15" font-weight="600" fill="#1E1B4B">Event stream</text>
<text x="48" y="220" font-size="14" fill="#6B7280">Kafka, Kinesis</text>
<rect x="36" y="236" width="152" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="48" y="256" font-size="15" font-weight="600" fill="#1E1B4B">Feature store</text>
<text x="48" y="274" font-size="14" fill="#6B7280">Feast, Tecton</text>
<rect x="36" y="290" width="152" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="48" y="310" font-size="15" font-weight="600" fill="#1E1B4B">Warehouse</text>
<text x="48" y="328" font-size="14" fill="#6B7280">BigQuery</text>
<path d="M112 352 L112 368" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
<rect x="232" y="132" width="176" height="216" rx="12" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="256" cy="158" r="12" fill="#1E1B4B"/><text x="256" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="276" y="164" font-size="17" font-weight="700" fill="#1E1B4B">Training</text>
<rect x="244" y="182" width="152" height="46" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="256" y="202" font-size="15" font-weight="600" fill="#4C1D95">The algorithm</text>
