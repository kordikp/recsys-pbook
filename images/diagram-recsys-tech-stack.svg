<rect x="24" y="372" width="592" height="72" rx="12" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="48" cy="398" r="12" fill="#1E1B4B"/><text x="48" y="403" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<text x="68" y="404" font-size="17" font-weight="700" fill="#1E1B4B">Orchestration</text>
<text x="38" y="428" font-size="14" fill="#4B5563">runs &amp; watches it all</text>
