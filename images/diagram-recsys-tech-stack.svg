<text x="256" y="256" font-size="15" font-weight="600" fill="#1E1B4B">Experiments</text>
<text x="256" y="274" font-size="14" fill="#6B7280">MLflow, W&amp;B</text>
<rect x="244" y="290" width="152" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="256" y="310" font-size="15" font-weight="600" fill="#1E1B4B">Tuning</text>
