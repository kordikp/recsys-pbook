<text x="484" y="164" font-size="17" font-weight="700" fill="#1E1B4B">Serving</text>
<rect x="452" y="182" width="152" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
