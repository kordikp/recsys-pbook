<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .squeeze{animation:sq 5s ease-in-out infinite}
    @keyframes sq{0%,20%{transform:scaleX(1)}55%,85%{transform:scaleX(.12)}100%{transform:scaleX(1)}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">From One-Hot Sparse to Dense Embeddings</text>

  <text x="110" y="86" font-size="14" font-weight="700" fill="#4B5563">sparse one-hot · 1M dims</text>
  <g>
    <rect x="70" y="100" width="660" height="34" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <rect x="322" y="104" width="14" height="26" rx="3" fill="#EF4444"/>
    <text x="700" y="122" font-size="12" fill="#6B7280" text-anchor="end">…zeros everywhere except item #391 402</text>
  </g>
  <text x="400" y="168" text-anchor="middle" font-size="13" fill="#B91C1C">no notion of similarity: item 391 402 is as far from 391 403 as from anything</text>

  <path d="M400 186 L400 226" stroke="#7C3AED" stroke-width="3" marker-end="url(#m)"/>
  <defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker></defs>
  <text x="470" y="212" font-size="12.5" fill="#4C1D95">learned projection (embedding table)</text>

  <text x="110" y="262" font-size="14" font-weight="700" fill="#065F46">dense embedding · 64 dims</text>
  <g class="squeeze" style="transform-origin:400px 293px">
    <rect x="270" y="276" width="260" height="34" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  </g>
  <g font-size="11" fill="#065F46" text-anchor="middle">
    <text x="300" y="297">0.42</text><text x="340" y="297">-0.13</text><text x="380" y="297">0.88</text>
    <text x="420" y="297">0.05</text><text x="460" y="297">-0.61</text><text x="500" y="297">…</text>
  </g>
  <text x="400" y="345" text-anchor="middle" font-size="13" fill="#065F46">every number means something — nearby vectors = similar items</text>
  <text x="400" y="385" text-anchor="middle" font-size="13" fill="#6B7280">15 000× smaller, and finally computable: similarity, arithmetic, ANN search all live in this space.</text>
</svg>
