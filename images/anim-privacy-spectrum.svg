<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 506" role="img" aria-labelledby="pb023-title pb023-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb023-title">What leaves your phone in five privacy setups, and what each costs in recommendation quality</title>
<desc id="pb023-desc">Five ways to train a recommender, ordered from least to most private. With no protection your raw clicks go to the server. Central differential privacy (epsilon 5) still sends raw clicks but the server adds noise to what it outputs: roughly 2 to 5 percent quality loss. Federated learning trains on your phone and sends only gradients: 5 to 15 percent. Local differential privacy (epsilon 1) adds noise on your phone before anything leaves: 15 to 30 percent. On-device only sends nothing and loses collaborative filtering. Encrypted setups such as MPC and homomorphic encryption pay in compute: fully homomorphic encryption carries about 10,000 times overhead. No setup gets privacy for free; the rough percentages come from the comparison table in the text.</desc>
