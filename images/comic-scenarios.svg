    <circle cx="706" cy="198" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M706 209 L706 242 M706 218 L684 229 M706 219 L724 228 M706 242 L695 261 M706 242 L718 261" fill="none"/>
  </g>
