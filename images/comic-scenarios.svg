<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">Same Shopper, Different Job Description</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <g>
    <rect x="30" y="72" width="104" height="28" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="82" y="91" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="middle">HOMEPAGE</text>
  </g>
  <g>
    <rect x="160" y="82" width="210" height="58" rx="9" fill="#FFFFFF" stroke="#7C3AED"/>
    <text x="265" y="105" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
      <tspan x="265">Welcome. Try popular, new,</tspan>
      <tspan x="265" dy="18">or something surprising.</tspan>
    </text>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round">
    <circle cx="84" cy="185" r="10" fill="#10B981" stroke="none"/>
    <path d="M84 196 L84 236 M84 207 L66 220 M84 208 L99 219 M84 236 L72 258 M84 236 L96 258" fill="none"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round">
    <circle cx="282" cy="183" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M282 194 L282 235 M282 205 L259 218 M282 205 L305 213 M282 235 L270 258 M282 235 L294 258" fill="none"/>
  </g>
  <g>
    <line x1="139" y1="236" x2="225" y2="236" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="145" y="197" width="22" height="34" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
    <rect x="173" y="190" width="22" height="41" rx="4" fill="#FEF3C7" stroke="#D97706"/>
    <rect x="201" y="201" width="18" height="30" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  </g>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Entry: homepage. State: unknown. Pool: broad. Metric: clicks.</text>

  <!-- Panel 2 -->
  <g>
    <rect x="422" y="72" width="74" height="28" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="459" y="91" font-size="12.5" font-weight="700" fill="#0EA5E9" text-anchor="middle">SEARCH</text>
    <rect x="506" y="72" width="136" height="28" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="574" y="91" font-size="12.5" font-weight="700" fill="#7C3AED" text-anchor="middle">PRODUCT DETAIL</text>
  </g>
  <g>
    <rect x="568" y="112" width="194" height="56" rx="9" fill="#FFFFFF" stroke="#7C3AED"/>
    <text x="665" y="134" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
      <tspan x="665">Now you're searching boots.</tspan>
      <tspan x="665" dy="18">I'll stay relevant.</tspan>
    </text>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round">
    <circle cx="468" cy="193" r="10" fill="#10B981" stroke="none"/>
    <path d="M468 204 L468 241 M468 214 L487 222 M468 214 L452 225 M468 241 L456 261 M468 241 L480 261" fill="none"/>
  </g>
