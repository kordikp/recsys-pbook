<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb095-title pb095-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb095-title">Same shopper, different job description</title>
<desc id="pb095-desc">Four-panel comic following one shopper through one shop. On the homepage the shopper is just looking around, so the recommender shows a bit of everything: its job is to inspire, and success is the shopper exploring. On a hiking-boot product page it offers three similar pairs to compare: success is a click on one. In the cart the shopper begs for no more boots and the recommender offers matching socks: its job is a quick add-on, and success is the shopper adding it. In an email a week later the shopper asks why it keeps changing; different place, different job: bring the shopper back. Each placement is its own scenario with its own job, rules and success metric; one algorithm everywhere is mediocre everywhere.</desc>
