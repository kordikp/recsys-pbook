    <path d="M525 222 L540 222 L548 231 L548 237 L524 237 Z" fill="#0EA5E9" stroke="#1E1B4B" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="537" cy="180" r="4" fill="#10B981"/>
  </g>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Search and item pages need fast, relevant candidates.</text>

  <!-- Panel 3 -->
  <g>
    <rect x="30" y="352" width="62" height="28" rx="9" fill="#FEF3C7" stroke="#D97706"/>
