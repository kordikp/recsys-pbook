<text x="81" y="61" text-anchor="middle" font-size="16" fill="#1E1B4B"><tspan x="81">You love punk.</tspan><tspan x="81" dy="20">More punk?</tspan></text>
<path d="M172,46 H274 Q286,46 286,58 V84 Q286,96 274,96 H231 L225,109 L217,96 H172 Q160,96 160,84 V58 Q160,46 172,46 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
