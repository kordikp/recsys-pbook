<path d="M223,131 A19,19 0 0 1 261,131" fill="none" stroke="#065F46" stroke-width="3.5" stroke-linecap="round"/>
<rect x="219" y="123" width="8" height="16" rx="3" fill="#065F46"/><rect x="257" y="123" width="8" height="16" rx="3" fill="#065F46"/>
<!-- bubbles -->
