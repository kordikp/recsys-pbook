<text x="152" y="169" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">♪ Song A</text>
<rect x="110" y="178" width="84" height="20" rx="10" fill="#D1FAE5"/>
<text x="152" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">played 41×</text>
<!-- listener -->
<path d="M219,208 V168 Q219,152 235,152 H249 Q265,152 265,168 V208 Z" fill="#10B981"/>
<circle cx="242" cy="131" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
<circle cx="234" cy="129" r="2.2" fill="#1E1B4B"/><circle cx="244" cy="129" r="2.2" fill="#1E1B4B"/>
