<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb084-title pb084-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb084-title">Please repeat yourself</title>
<desc id="pb084-desc">Four-panel comic: a recommender used to movies starts at a music app and keeps applying video habits. It offers something new, but the listener wants the same song again, played 41 times: a replay is a yes. It offers the listener's top genre, punk, at midnight, but the moment calls for calm. It hands over one perfect song, but the run lasts an hour. On day two it serves a 7 a.m. run mix that starts with the favorite song again. Video: something new, your usual taste, one title. Music: again, fits the moment, a whole playlist.</desc>

<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Please repeat yourself</text>
<text x="320" y="54" text-anchor="middle" font-size="15" fill="#4B5563">A movie recommender’s first day at a music app</text>

