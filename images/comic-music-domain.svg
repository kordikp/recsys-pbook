<text x="88" y="61" text-anchor="middle" font-size="16" fill="#1E1B4B"><tspan x="88">Heard it already.</tspan><tspan x="88" dy="20">Something new?</tspan></text>
<path d="M184,46 H274 Q286,46 286,58 V84 Q286,96 274,96 H247 L241,109 L233,96 H184 Q172,96 172,84 V58 Q172,46 184,46 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
<text x="229" y="67" text-anchor="middle" font-size="16" fill="#1E1B4B"><tspan x="229" font-weight="700">No — again!</tspan><tspan x="229" dy="20">My song!</tspan></text>
<text x="62" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Recommender</text>
<text x="242" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">You</text>
</g>

