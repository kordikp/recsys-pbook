<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .hl{animation:h 6s ease-in-out infinite}
    .hl2{animation:h 6s ease-in-out infinite;animation-delay:2s}
    .hl3{animation:h 6s ease-in-out infinite;animation-delay:4s}
    @keyframes h{0%,28%,100%{stroke-width:2;filter:none}8%,20%{stroke-width:3.5}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Three Formulas That Run Recommendations</text>

  <g font-size="14">
    <rect class="hl" x="55" y="70" width="690" height="94" rx="12" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="80" y="100" font-weight="800" fill="#4C1D95">Cosine similarity</text>
    <text x="80" y="124" font-family="Georgia,serif" font-style="italic" font-size="17" fill="#1E1B4B">sim(u, v) = (u · v) / (‖u‖ ‖v‖)</text>
    <text x="80" y="148" fill="#6B7280" font-size="12.5">how close two taste vectors point — the workhorse of "similar items" and "users like you"</text>

    <rect class="hl2" x="55" y="178" width="690" height="94" rx="12" fill="#D1FAE5" stroke="#10B981"/>
    <text x="80" y="208" font-weight="800" fill="#065F46">nDCG (ranking quality)</text>
    <text x="80" y="232" font-family="Georgia,serif" font-style="italic" font-size="17" fill="#1E1B4B">DCG = Σ ( (2^relᵢ − 1) / log₂(i + 1) ) ,   nDCG = DCG / IDCG</text>
    <text x="80" y="256" fill="#6B7280" font-size="12.5">rewards putting good items HIGH — position i discounts logarithmically, exactly like attention does</text>

    <rect class="hl3" x="55" y="286" width="690" height="94" rx="12" fill="#FEF3C7" stroke="#D97706"/>
    <text x="80" y="316" font-weight="800" fill="#92400E">BPR (learning from pairs)</text>
    <text x="80" y="340" font-family="Georgia,serif" font-style="italic" font-size="17" fill="#1E1B4B">L = − Σ ln σ( score(u, i⁺) − score(u, i⁻) )</text>
    <text x="80" y="364" fill="#6B7280" font-size="12.5">no ratings needed: just push what the user chose (i⁺) above what they skipped (i⁻)</text>
  </g>
</svg>
