<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 524" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb128-title pb128-desc">
<title id="pb128-title">Five ways to combine recommenders</title>
<desc id="pb128-desc">Five hybrid patterns: blend the scores with fixed weights, switch to one method by situation, narrow candidates in stages (the cascade, the production default), feed one model's score into another as a feature, or let one model work on another's learned item vectors. Real systems stack them: switching retrieval, a cascade, one ranking model.</desc>
<defs>
<marker id="pb128-ag" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#6B7280"/></marker>
<marker id="pb128-ap" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker>
</defs>
<rect x=".5" y=".5" width="639" height="523" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Five ways to combine recommenders</text>

<!-- 1 Weighted -->
<g transform="translate(16,56)">
<rect width="608" height="76" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="16" y="32" font-size="16" font-weight="700" fill="#1E1B4B">Weighted</text>
<text x="16" y="54" font-size="14" fill="#4B5563">Blend the scores</text>
<rect x="196" y="10" width="108" height="24" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="250" y="27" text-anchor="middle" font-size="14" fill="#1E1B4B">CF <tspan font-weight="700">0.8</tspan></text>
<rect x="196" y="42" width="108" height="24" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="250" y="59" text-anchor="middle" font-size="14" fill="#1E1B4B">Content <tspan font-weight="700">0.5</tspan></text>
<line x1="306" y1="22" x2="331" y2="31" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb128-ag)"/>
<line x1="306" y1="54" x2="331" y2="45" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb128-ag)"/>
<circle cx="358" cy="38" r="24" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="358" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">60/40</text>
<line x1="384" y1="38" x2="412" y2="38" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb128-ap)"/>
<rect x="418" y="24" width="60" height="28" rx="8" fill="#7C3AED"/>
<text x="448" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">0.68</text>
<text x="592" y="43" text-anchor="end" font-size="14" fill="#6B7280">toy numbers</text>
</g>

<!-- 2 Switching -->
<g transform="translate(16,142)">
<rect width="608" height="76" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="16" y="32" font-size="16" font-weight="700" fill="#1E1B4B">Switching</text>
<text x="16" y="54" font-size="14" fill="#4B5563">Pick one per situation</text>
<circle cx="206" cy="27" r="7" fill="#10B981"/>
<rect x="196" y="37" width="20" height="18" rx="8" fill="#10B981"/>
<line x1="220" y1="38" x2="236" y2="38" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb128-ag)"/>
<polygon points="240,38 284,12 328,38 284,64" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="284" y="43" text-anchor="middle" font-size="14" fill="#1E1B4B">history?</text>
<line x1="308" y1="26" x2="360" y2="21" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb128-ag)"/>
<line x1="308" y1="50" x2="360" y2="55" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb128-ag)"/>
<rect x="366" y="8" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="426" y="26" text-anchor="middle" font-size="14" fill="#1E1B4B"><tspan fill="#6B7280">yes:</tspan> CF</text>
<rect x="366" y="42" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="426" y="60" text-anchor="middle" font-size="14" fill="#1E1B4B"><tspan fill="#6B7280">no:</tspan> Popular</text>
<text x="592" y="43" text-anchor="end" font-size="14" fill="#6B7280">only one runs</text>
</g>

<!-- 3 Cascade (emphasised) -->
<g transform="translate(16,228)">
<rect width="608" height="76" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="16" y="32" font-size="16" font-weight="700" fill="#1E1B4B">Cascade</text>
<rect x="88" y="16" width="92" height="24" rx="12" fill="#7C3AED"/>
<text x="134" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">the default</text>
<text x="16" y="54" font-size="14" fill="#4B5563">Narrow down in stages</text>
<rect x="196" y="10" width="92" height="56" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="242" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Retrieve</text>
<text x="242" y="53" text-anchor="middle" font-size="14" fill="#4B5563">millions</text>
<line x1="292" y1="44" x2="326" y2="44" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb128-ag)"/>
<text x="309" y="34" text-anchor="middle" font-size="14" fill="#4B5563">100s</text>
<rect x="332" y="17" width="92" height="42" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="378" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Rank</text>
<line x1="428" y1="44" x2="462" y2="44" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb128-ap)"/>
<text x="445" y="34" text-anchor="middle" font-size="14" fill="#4B5563">top</text>
<rect x="468" y="22" width="92" height="32" rx="8" fill="#7C3AED"/>
<text x="514" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Re-rank</text>
</g>

<!-- 4 Feature augmentation -->
<g transform="translate(16,314)">
<rect width="608" height="76" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="16" y="32" font-size="16" font-weight="700" fill="#1E1B4B">Feature augmentation</text>
<text x="16" y="54" font-size="14" fill="#4B5563">A score becomes an input</text>
<rect x="216" y="24" width="52" height="28" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="242" y="43" text-anchor="middle" font-size="14" fill="#1E1B4B">CF</text>
<line x1="270" y1="30" x2="300" y2="20" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb128-ag)"/>
<rect x="306" y="4" width="136" height="68" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="310" y="8" width="128" height="21" rx="5" fill="#FEF3C7"/>
<text x="320" y="24" font-size="14" fill="#92400E">CF score <tspan font-weight="700">0.8</tspan></text>
<text x="320" y="45" font-size="14" fill="#4B5563">genre</text>
<text x="320" y="64" font-size="14" fill="#4B5563">time of day</text>
<line x1="446" y1="38" x2="470" y2="38" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb128-ap)"/>
<rect x="476" y="20" width="120" height="36" rx="8" fill="#7C3AED"/>
<text x="536" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Ranking model</text>
</g>

<!-- 5 Meta-level -->
<g transform="translate(16,400)">
<rect width="608" height="76" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="16" y="32" font-size="16" font-weight="700" fill="#1E1B4B">Meta-level</text>
<text x="16" y="54" font-size="14" fill="#4B5563">Share learned vectors</text>
<rect x="196" y="20" width="92" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="242" y="43" text-anchor="middle" font-size="14" fill="#1E1B4B">Text model</text>
<line x1="292" y1="45" x2="320" y2="45" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb128-ag)"/>
<g fill="#7C3AED">
<rect x="326" y="38" width="14" height="14" rx="3" fill-opacity=".9"/>
<rect x="344" y="38" width="14" height="14" rx="3" fill-opacity=".35"/>
<rect x="362" y="38" width="14" height="14" rx="3" fill-opacity=".7"/>
<rect x="380" y="38" width="14" height="14" rx="3" fill-opacity=".2"/>
<rect x="398" y="38" width="14" height="14" rx="3" fill-opacity=".55"/>
<rect x="416" y="38" width="14" height="14" rx="3" fill-opacity=".8"/>
<rect x="434" y="38" width="14" height="14" rx="3" fill-opacity=".3"/>
</g>
<text x="387" y="28" text-anchor="middle" font-size="14" fill="#4B5563">item vectors</text>
<line x1="452" y1="45" x2="470" y2="45" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb128-ap)"/>
<rect x="476" y="20" width="120" height="36" rx="8" fill="#7C3AED"/>
<text x="536" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Recommender</text>
</g>

<text x="320" y="506" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Real systems stack them: <tspan fill="#4C1D95">switch → cascade → one ranking model</tspan></text>
</svg>
