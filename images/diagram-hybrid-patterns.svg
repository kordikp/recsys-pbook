<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10B981"/>
    </marker>
    <marker id="arrDark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="698" height="398" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">Hybrid Recommender Patterns</text>
  <text x="350" y="47" text-anchor="middle" font-size="11" fill="#6B7280">Five common strategies for combining recommendation approaches</text>

  <!-- Pattern 1: Weighted -->
  <g transform="translate(15,62)">
    <rect width="200" height="140" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="100" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Weighted</text>

    <rect x="15" y="38" width="50" height="27" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="40" y="56" text-anchor="middle" font-size="11" fill="#1E1B4B">A</text>

    <rect x="15" y="75" width="50" height="27" rx="4" fill="#D1FAE5" stroke="#10B981"/>
    <text x="40" y="93" text-anchor="middle" font-size="11" fill="#1E1B4B">B</text>

    <line x1="65" y1="51.5" x2="91" y2="67" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="65" y1="88.5" x2="91" y2="71" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrGreen)"/>

    <circle cx="106" cy="69" r="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="106" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">w</text>

    <line x1="120" y1="69" x2="148" y2="69" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="153" y="55" width="36" height="28" rx="4" fill="#7C3AED"/>
    <text x="171" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">out</text>

    <text x="15" y="119" font-size="11" fill="#6B7280">Scores from A and B</text>
    <text x="15" y="133" font-size="11" fill="#6B7280">combined with weights</text>
  </g>

  <!-- Pattern 2: Switching -->
  <g transform="translate(245,62)">
    <rect width="200" height="140" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="100" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Switching</text>

    <polygon points="55,69 80,50 105,69 80,88" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="80" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">?</text>

    <line x1="93" y1="55" x2="119" y2="43" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="124" y="31" width="34" height="24" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="141" y="47" text-anchor="middle" font-size="11" fill="#1E1B4B">A</text>

    <line x1="93" y1="83" x2="119" y2="93" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrGreen)"/>
    <rect x="124" y="82" width="34" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
    <text x="141" y="98" text-anchor="middle" font-size="11" fill="#1E1B4B">B</text>

    <line x1="20" y1="69" x2="51" y2="69" stroke="#7C3AED" stroke-width="1.25" stroke-dasharray="4,3" marker-end="url(#arrDark)"/>
    <text x="16" y="52" font-size="11" fill="#6B7280">context</text>

    <text x="20" y="119" font-size="11" fill="#6B7280">Pick A or B based</text>
    <text x="20" y="133" font-size="11" fill="#6B7280">on current context</text>
  </g>

  <!-- Pattern 3: Cascade -->
  <g transform="translate(35,222)">
    <rect width="330" height="140" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="165" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Cascade</text>

    <text x="46" y="41" text-anchor="middle" font-size="11" fill="#6B7280">1000s</text>
    <text x="136" y="41" text-anchor="middle" font-size="11" fill="#6B7280">100s</text>
    <text x="228" y="41" text-anchor="middle" font-size="11" fill="#6B7280">10s</text>

    <rect x="14" y="47" width="64" height="40" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="46" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">A</text>
    <text x="46" y="78" text-anchor="middle" font-size="11" fill="#6B7280">rough</text>

    <line x1="78" y1="67" x2="99" y2="67" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="104" y="47" width="64" height="40" rx="5" fill="#D1FAE5" stroke="#10B981"/>
    <text x="136" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">B</text>
    <text x="136" y="78" text-anchor="middle" font-size="11" fill="#6B7280">precise</text>

    <line x1="168" y1="67" x2="189" y2="67" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="194" y="47" width="68" height="40" rx="5" fill="#FEF3C7" stroke="#D97706"/>
    <text x="228" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">C</text>
    <text x="228" y="78" text-anchor="middle" font-size="11" fill="#6B7280">diversify</text>

    <line x1="262" y1="67" x2="279" y2="67" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="284" y="53" width="36" height="28" rx="4" fill="#7C3AED"/>
    <text x="302" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">out</text>

    <text x="20" y="106" font-size="11" fill="#6B7280">Sequential filtering: each stage refines</text>
    <text x="20" y="122" font-size="11" fill="#6B7280">the candidate set from the previous one</text>
  </g>

  <!-- Pattern 4: Feature Augmentation -->
  <g transform="translate(385,222)">
    <rect width="148" height="140" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="74" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Feature Aug.</text>

    <rect x="8" y="44" width="30" height="28" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="23" y="62" text-anchor="middle" font-size="11" fill="#1E1B4B">A</text>

    <line x1="38" y1="58" x2="44" y2="58" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="49" y="44" width="42" height="28" rx="4" fill="#FEF3C7" stroke="#D97706"/>
    <text x="70" y="62" text-anchor="middle" font-size="11" fill="#1E1B4B">feat</text>

    <line x1="91" y1="58" x2="97" y2="58" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="102" y="44" width="30" height="28" rx="4" fill="#D1FAE5" stroke="#10B981"/>
    <text x="117" y="62" text-anchor="middle" font-size="11" fill="#1E1B4B">B</text>

    <text x="15" y="94" font-size="11" fill="#6B7280">A's output feeds</text>
    <text x="15" y="110" font-size="11" fill="#6B7280">as features to B</text>
  </g>

  <!-- Pattern 5: Meta-level -->
  <g transform="translate(548,62)">
    <rect width="140" height="140" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="70" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Meta-level</text>

    <rect x="20" y="34" width="100" height="26" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="70" y="51" text-anchor="middle" font-size="11" fill="#1E1B4B">A</text>

    <line x1="70" y1="60" x2="70" y2="67" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="20" y="72" width="100" height="24" rx="4" fill="#FEF3C7" stroke="#D97706"/>
    <text x="70" y="88" text-anchor="middle" font-size="11" fill="#1E1B4B">embeddings</text>

    <line x1="70" y1="96" x2="70" y2="103" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrGreen)"/>

    <rect x="20" y="108" width="100" height="26" rx="4" fill="#D1FAE5" stroke="#10B981"/>
    <text x="70" y="125" text-anchor="middle" font-size="11" fill="#1E1B4B">B</text>
  </g>

  <!-- Footer note -->
  <text x="350" y="388" text-anchor="middle" font-size="11" fill="#6B7280">Each pattern trades off complexity, interpretability, and performance differently</text>
</svg>