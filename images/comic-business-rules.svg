<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb045-title pb045-desc">
<title id="pb045-title">Tonight’s special has terms and conditions</title>
<desc id="pb045-desc">Four-panel comic. A guest asks for a dessert; the waiter, the recommender, ranks by taste: lemon tart, tiramisu, cheesecake. The manager, the business rules, strikes the lemon tart because it is sold out, then boosts the cheesecake because twelve are left, so it jumps above the tiramisu. The guest asks if this is the best; the waiter says it is the best one we have. The recommender ranks what you would like; business rules drop what cannot be served and boost what the business needs.</desc>
