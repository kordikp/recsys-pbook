<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, sans-serif">
  <rect x="0.75" y="0.75" width="498.5" height="298.5" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="250" y="25" text-anchor="middle" fill="#1E1B4B" font-size="14" font-weight="700">Freshness Decay by Domain</text>

  <!-- Grid lines -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="60" y1="52" x2="470" y2="52"/>
    <line x1="60" y1="97" x2="470" y2="97"/>
    <line x1="60" y1="142" x2="470" y2="142"/>
    <line x1="60" y1="189" x2="470" y2="189"/>
  </g>

  <!-- Axes -->
  <g stroke="#1E1B4B" stroke-width="1.25">
    <line x1="60" y1="45" x2="60" y2="240"/>
    <line x1="60" y1="240" x2="470" y2="240"/>
  </g>

  <!-- Y axis label and ticks -->
  <text x="18" y="145" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="500" transform="rotate(-90 18 145)">Relevance Weight</text>
  <g fill="#6B7280" font-size="11">
    <text x="53" y="56" text-anchor="end">1.0</text>
    <text x="53" y="101" text-anchor="end">0.75</text>
    <text x="53" y="146" text-anchor="end">0.50</text>
    <text x="53" y="193" text-anchor="end">0.25</text>
    <text x="53" y="244" text-anchor="end">0.0</text>
  </g>

  <!-- X axis ticks and label -->
  <g fill="#6B7280" font-size="11">
    <text x="100" y="256" text-anchor="middle">1h</text>
    <text x="150" y="256" text-anchor="middle">6h</text>
    <text x="200" y="256" text-anchor="middle">1d</text>
    <text x="260" y="256" text-anchor="middle">1w</text>
    <text x="330" y="256" text-anchor="middle">1m</text>
    <text x="400" y="256" text-anchor="middle">1y</text>
    <text x="455" y="256" text-anchor="middle">5y</text>
  </g>
  <text x="265" y="272" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="500">Time Since Publication</text>

  <!-- Subtle fill areas -->
  <path d="M60,52 Q80,55 100,100 Q120,170 150,220 Q180,235 250,238 L470,239 L470,240 L60,240 Z" fill="#FEE2E2" opacity="0.45"/>
  <path d="M60,52 Q100,55 150,65 Q200,100 250,150 Q300,200 350,225 Q400,235 470,238 L470,240 L60,240 Z" fill="#FEF3C7" opacity="0.32"/>
  <path d="M60,52 Q150,55 250,62 Q350,72 400,80 Q450,90 470,95 L470,240 L60,240 Z" fill="#D1FAE5" opacity="0.32"/>

  <!-- Domain curves -->
  <path d="M60,52 Q80,55 100,100 Q120,170 150,220 Q180,235 250,238 L470,239" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M60,52 Q100,55 150,65 Q200,100 250,150 Q300,200 350,225 Q400,235 470,238" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M60,52 Q150,55 250,62 Q350,72 400,80 Q450,90 470,95" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Breaking news annotation -->
  <circle cx="115" cy="130" r="3.5" fill="#EF4444"/>
  <line x1="118" y1="128" x2="142" y2="114" stroke="#EF4444" stroke-width="1"/>
  <text x="148" y="116" fill="#EF4444" font-size="11" font-weight="500">Breaking news</text>
  <text x="148" y="130" fill="#EF4444" font-size="11">loses value fast</text>

  <!-- Movies annotation -->
  <circle cx="440" cy="86" r="3.5" fill="#10B981"/>
  <line x1="437" y1="89" x2="414" y2="99" stroke="#10B981" stroke-width="1"/>
  <text x="350" y="108" fill="#10B981" font-size="11" font-weight="500">Classics remain</text>
  <text x="350" y="122" fill="#10B981" font-size="11">relevant for years</text>

  <!-- Legend, positioned fully clear of all curves -->
  <rect x="320" y="132" width="145" height="72" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <line x1="328" y1="150" x2="344" y2="150" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="350" y="154" fill="#1E1B4B" font-size="11" font-weight="600">News</text>
  <text x="456" y="154" text-anchor="end" fill="#6B7280" font-size="11">hours</text>

  <line x1="328" y1="173" x2="344" y2="173" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <text x="350" y="177" fill="#1E1B4B" font-size="11" font-weight="600">Social Media</text>
  <text x="456" y="177" text-anchor="end" fill="#6B7280" font-size="11">days</text>

  <line x1="328" y1="196" x2="344" y2="196" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <text x="350" y="200" fill="#1E1B4B" font-size="11" font-weight="600">Movies</text>
  <text x="456" y="200" text-anchor="end" fill="#6B7280" font-size="11">years</text>

  <!-- Bottom note -->
  <text x="250" y="291" text-anchor="middle" fill="#6B7280" font-size="11">Decay function: w(t) = exp(-lambda * t) -- lambda varies by domain</text>
</svg>