<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" role="img" aria-labelledby="pb126-title pb126-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb126-title">Every kind of content has its own shelf life</title>
  <desc id="pb126-desc">Four bars on a shared timeline from minutes to decades show how long an item stays worth recommending after it is published: breaking news fades within minutes to hours, social media posts within hours to days, e-commerce products within weeks to months, while music and movies stay relevant for years to decades. One decay speed for all content would either push yesterday's news to the top or bury the classics.</desc>
  <defs>
    <linearGradient id="pb126-g-news" gradientUnits="userSpaceOnUse" x1="68" y1="0" x2="194" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="1"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pb126-g-social" gradientUnits="userSpaceOnUse" x1="152" y1="0" x2="278" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="1"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pb126-g-shop" gradientUnits="userSpaceOnUse" x1="320" y1="0" x2="446" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="1"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pb126-g-music" gradientUnits="userSpaceOnUse" x1="488" y1="0" x2="614" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="1"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x=".5" y=".5" width="639" height="471" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <text x="26" y="40" font-size="20" font-weight="700" fill="#1E1B4B">Every kind of content has its own shelf life</text>
  <text x="26" y="64" font-size="15" fill="#4B5563">Purple bar = how much an item is still worth recommending</text>

  <!-- Row 1: breaking news (y0 = 92) -->
  <g>
    <text x="26" y="108" font-size="16" fill="#1E1B4B"><tspan>📰 </tspan><tspan font-weight="700">Breaking news</tspan><tspan font-size="14" fill="#6B7280"> · e.g. election results</tspan></text>
    <text x="614" y="108" text-anchor="end" font-size="15" font-weight="600" fill="#4C1D95">fresh for minutes–hours</text>
    <rect x="26" y="118" width="588" height="24" rx="6" fill="#EEF0F3"/>
    <g stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3">
      <line x1="110" y1="114" x2="110" y2="146"/><line x1="194" y1="114" x2="194" y2="146"/><line x1="278" y1="114" x2="278" y2="146"/>
      <line x1="362" y1="114" x2="362" y2="146"/><line x1="446" y1="114" x2="446" y2="146"/><line x1="530" y1="114" x2="530" y2="146"/>
    </g>
    <rect x="26" y="118" width="588" height="24" rx="6" fill="url(#pb126-g-news)"/>
  </g>

  <!-- Row 2: social media (y0 = 158) -->
  <g>
    <text x="26" y="174" font-size="16" fill="#1E1B4B"><tspan>💬 </tspan><tspan font-weight="700">Social media</tspan><tspan font-size="14" fill="#6B7280"> · e.g. trending memes</tspan></text>
    <text x="614" y="174" text-anchor="end" font-size="15" font-weight="600" fill="#4C1D95">fresh for hours–days</text>
    <rect x="26" y="184" width="588" height="24" rx="6" fill="#EEF0F3"/>
    <g stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3">
      <line x1="110" y1="180" x2="110" y2="212"/><line x1="194" y1="180" x2="194" y2="212"/><line x1="278" y1="180" x2="278" y2="212"/>
      <line x1="362" y1="180" x2="362" y2="212"/><line x1="446" y1="180" x2="446" y2="212"/><line x1="530" y1="180" x2="530" y2="212"/>
    </g>
    <rect x="26" y="184" width="588" height="24" rx="6" fill="url(#pb126-g-social)"/>
  </g>

  <!-- Row 3: e-commerce (y0 = 224) -->
  <g>
    <text x="26" y="240" font-size="16" fill="#1E1B4B"><tspan>🛍️ </tspan><tspan font-weight="700">E-commerce</tspan><tspan font-size="14" fill="#6B7280"> · e.g. holiday products</tspan></text>
    <text x="614" y="240" text-anchor="end" font-size="15" font-weight="600" fill="#4C1D95">fresh for weeks–months</text>
    <rect x="26" y="250" width="588" height="24" rx="6" fill="#EEF0F3"/>
    <g stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3">
      <line x1="110" y1="246" x2="110" y2="278"/><line x1="194" y1="246" x2="194" y2="278"/><line x1="278" y1="246" x2="278" y2="278"/>
      <line x1="362" y1="246" x2="362" y2="278"/><line x1="446" y1="246" x2="446" y2="278"/><line x1="530" y1="246" x2="530" y2="278"/>
    </g>
    <rect x="26" y="250" width="588" height="24" rx="6" fill="url(#pb126-g-shop)"/>
  </g>

  <!-- Row 4: music & movies (y0 = 290) -->
  <g>
    <text x="26" y="306" font-size="16" fill="#1E1B4B"><tspan>🎵 </tspan><tspan font-weight="700">Music &amp; movies</tspan><tspan font-size="14" fill="#6B7280"> · e.g. classic albums</tspan></text>
    <text x="614" y="306" text-anchor="end" font-size="15" font-weight="600" fill="#4C1D95">fresh for years–decades</text>
    <rect x="26" y="316" width="588" height="24" rx="6" fill="#EEF0F3"/>
    <g stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3">
      <line x1="110" y1="312" x2="110" y2="344"/><line x1="194" y1="312" x2="194" y2="344"/><line x1="278" y1="312" x2="278" y2="344"/>
      <line x1="362" y1="312" x2="362" y2="344"/><line x1="446" y1="312" x2="446" y2="344"/><line x1="530" y1="312" x2="530" y2="344"/>
    </g>
    <rect x="26" y="316" width="588" height="24" rx="6" fill="url(#pb126-g-music)"/>
  </g>

  <!-- Shared time axis -->
  <g font-size="14" fill="#4B5563" text-anchor="middle">
    <text x="68" y="366">minutes</text>
    <text x="152" y="366">hours</text>
    <text x="236" y="366">days</text>
    <text x="320" y="366">weeks</text>
    <text x="404" y="366">months</text>
    <text x="488" y="366">years</text>
    <text x="572" y="366">decades</text>
  </g>
  <text x="320" y="388" text-anchor="middle" font-size="14" fill="#6B7280">time since it was published →</text>

  <!-- Takeaway: the trade-off -->
  <rect x="26" y="404" width="588" height="48" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="320" y="434" text-anchor="middle" font-size="15" fill="#92400E"><tspan font-weight="700">One decay speed for all?</tspan> Stale news on top, or classics buried.</text>
</svg>
