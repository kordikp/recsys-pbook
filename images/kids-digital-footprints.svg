<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb151-title pb151-desc">
  <title id="pb151-title">Every move leaves a footprint</title>
  <desc id="pb151-desc">Every interaction leaves a behavioral footprint the recommender reads as a signal: a click, a 3-second bounce, a full read with a bookmark (a big footprint), a search, and even a skipped post or a podcast at 2x speed you never noticed. The more footprints, the more the system goes from a new colleague making total guesses to a long-time collaborator who knows you prefer concise, data-driven summaries.</desc>
  <defs>
    <marker id="pb151-head-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#10B981"/>
    </marker>
    <g id="pb151-print">
      <path d="M-26,1 C-26,-6 -18,-9 -8,-8 C4,-7 14,-10 19,-6 C24,-2 22,6 14,8 C4,10 -6,9 -16,9 C-23,9 -26,6 -26,1 Z"/>
      <circle cx="26" cy="-8" r="4"/>
      <circle cx="29" cy="-1" r="3.2"/>
      <circle cx="28" cy="5.5" r="2.8"/>
      <circle cx="25" cy="10.5" r="2.4"/>
    </g>
  </defs>

  <rect x=".5" y=".5" width="639" height="435" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#1E1B4B">Every move leaves a footprint</text>
  <text x="32" y="66" font-size="15" fill="#4B5563">Bigger print = stronger signal</text>

  <!-- the trail, in fresh snow -->
  <rect x="24" y="84" width="592" height="184" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- prints you meant -->
  <g fill="#10B981">
    <use href="#pb151-print" transform="translate(76,152) rotate(-6)"/>
    <use href="#pb151-print" transform="translate(174,178) rotate(6) scale(0.6,-0.6)"/>
    <use href="#pb151-print" transform="translate(272,152) rotate(-6) scale(1.45)"/>
    <use href="#pb151-print" transform="translate(372,178) rotate(6) scale(1,-1)"/>
  </g>
  <!-- prints you never noticed -->
  <g fill="#D1FAE5" stroke="#10B981" stroke-width="1.6" stroke-dasharray="3 2">
    <use href="#pb151-print" transform="translate(470,152) rotate(-6) scale(0.85)"/>
    <use href="#pb151-print" transform="translate(568,178) rotate(6) scale(0.85,-0.85)"/>
  </g>

  <!-- "you didn't notice" bracket -->
  <text x="519" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">You didn't notice. It did.</text>
  <path d="M428,124 V118 H610 V124" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-size="15" fill="#1E1B4B" text-anchor="middle">
    <text x="74" y="226">Clicked</text>
    <text x="74" y="246">an article</text>
    <text x="172" y="226">Left after</text>
    <text x="172" y="246">3 seconds</text>
    <text x="270" y="226" font-weight="700">Read it all,</text>
    <text x="270" y="246" font-weight="700">bookmarked</text>
    <text x="370" y="226">Searched</text>
    <text x="370" y="246">“PM tools”</text>
    <text x="468" y="226">Skipped</text>
    <text x="468" y="246">a post</text>
    <text x="566" y="226">Podcast</text>
    <text x="566" y="246">at 2× speed</text>
  </g>

  <!-- what the recommender knows -->
  <rect x="24" y="290" width="264" height="96" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <g>
    <text x="54" y="314" text-anchor="middle" font-size="16" font-weight="700" fill="#F59E0B">?</text>
    <rect x="41" y="324" width="26" height="22" rx="7" fill="#7C3AED"/>
    <circle cx="49" cy="333" r="2.6" fill="#FFFFFF"/>
    <circle cx="59" cy="333" r="2.6" fill="#FFFFFF"/>
    <path d="M50,340 H58" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="80" y="318" font-size="15" font-weight="700" fill="#1E1B4B">Day 1: new colleague</text>
  <text x="80" y="341" font-size="15" fill="#4B5563">“Slack? Email?”</text>
  <text x="80" y="363" font-size="15" fill="#4B5563">Total guesses.</text>

  <!-- more footprints -->
  <use href="#pb151-print" transform="translate(320,316) scale(0.42)" fill="#10B981"/>
  <path d="M298,338 H340" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb151-head-green)"/>

  <rect x="352" y="290" width="264" height="96" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <g>
    <line x1="382" y1="315" x2="382" y2="322" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <circle cx="382" cy="314" r="2.5" fill="#7C3AED"/>
    <rect x="369" y="322" width="26" height="22" rx="7" fill="#7C3AED"/>
    <circle cx="377" cy="331" r="2.6" fill="#FFFFFF"/>
    <circle cx="387" cy="331" r="2.6" fill="#FFFFFF"/>
    <path d="M377.5,337 Q382,342 386.5,337" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
  <text x="408" y="318" font-size="15" font-weight="700" fill="#4C1D95">Long-time collaborator</text>
  <text x="408" y="341" font-size="15" fill="#1E1B4B">Concise summaries,</text>
  <text x="408" y="363" font-size="15" fill="#1E1B4B">data-driven. Spot on.</text>

  <text x="320" y="416" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">You train the recommender with every step — even ones you don't notice.</text>
</svg>
