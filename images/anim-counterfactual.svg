<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .ghost{animation:gh 5s ease-in-out infinite}
    @keyframes gh{0%,25%{opacity:.25}55%,85%{opacity:.9}100%{opacity:.25}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Counterfactual: The Question Logs Can't Answer Directly</text>

  <g stroke="#9CA3AF" stroke-width="1.5"><line x1="90" y1="320" x2="740" y2="320"/><line x1="90" y1="320" x2="90" y2="80"/></g>
  <text x="415" y="348" text-anchor="middle" font-size="12" fill="#6B7280">session timeline →</text>
  <text x="74" y="200" text-anchor="middle" font-size="12" fill="#6B7280" transform="rotate(-90 74 200)">engagement</text>

  <path d="M90 300 C200 285 300 250 420 235 C540 220 640 210 730 205" fill="none" stroke="#7C3AED" stroke-width="3.5"/>
  <circle cx="420" cy="235" r="7" fill="#7C3AED"/>
  <rect x="300" y="115" width="240" height="40" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="420" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">FACT: we showed ranking π — this happened</text>

  <g class="ghost">
    <path d="M420 235 C520 255 620 275 730 290" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="470" y="300" width="255" height="40" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="597" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">WHAT IF: ranking π′? — never observed</text>
  </g>

  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">Off-policy evaluation reweights logged clicks (IPS) to estimate the ghost line — no new experiment needed, big variance included.</text>
</svg>
