<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="pb150-title pb150-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb150-title">Content-based filtering: match the track's own features</title>
<desc id="pb150-desc">You loved a jazz track with piano, brushed drums and a calm mood. The system compares those features with each candidate: a brand-new release with 0 plays shares all 4 and is recommended, a similar jazz track shares 2, and the most-played chart hit shares none. Content-based filtering looks at what an item is, not at who played it, so new items can be recommended on day one.</desc>
<defs><marker id="pb150-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#7C3AED"/></marker></defs>
