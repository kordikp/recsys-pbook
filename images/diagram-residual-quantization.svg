<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn11-title pn11-desc">
<title id="pn11-title">Residual quantization builds a semantic ID coarse to fine</title>
<desc id="pn11-desc">An item's text (title, brand, category, price) is embedded by Sentence-T5 and encoded into a latent vector z. Level 1 picks the nearest of its 256 codebook vectors, e.g. vector 7, and passes the leftover r1 = z minus e7 to level 2, which picks vector 1 and passes r2 = r1 minus e1 to level 3, which picks vector 4. The leftovers shrink at every level, so the code (7, 1, 4) goes from coarse to fine. Two items that collide on (7, 1, 4) get a fourth token: (7, 1, 4, 0) and (7, 1, 4, 1).</desc>
<defs><marker id="pn11-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#7C3AED"/></marker><marker id="pn11-ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#6B7280"/></marker></defs>
<rect x=".5" y=".5" width="639" height="483" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Residual quantization: building a semantic ID</text>
<text x="320" y="60" text-anchor="middle" font-size="14" fill="#6B7280">Toy 2-D view, same scale in every panel · dashed = leftover (residual)</text>
<rect x="16" y="74" width="228" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="130" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Item text</text>
<text x="130" y="118" text-anchor="middle" font-size="14" fill="#4B5563">title · brand · category · price</text>
<rect x="280" y="74" width="108" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="334" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Sentence-T5</text>
<text x="334" y="118" text-anchor="middle" font-size="14" fill="#4B5563">768-d vector</text>
<rect x="424" y="74" width="92" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="470" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">RQ-VAE</text>
<text x="470" y="118" text-anchor="middle" font-size="14" fill="#4B5563">encoder</text>
<rect x="552" y="74" width="72" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="588" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#4C1D95">z</text>
<text x="588" y="118" text-anchor="middle" font-size="14" fill="#4B5563">32-d</text>
<line x1="248" y1="102" x2="276" y2="102" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pn11-ahg)"/>
<line x1="392" y1="102" x2="420" y2="102" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pn11-ahg)"/>
<line x1="520" y1="102" x2="548" y2="102" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pn11-ahg)"/>
<rect x="16" y="146" width="186" height="220" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="30" y="172" font-size="15" font-weight="700" fill="#1E1B4B">Level 1</text>
<text x="30" y="192" font-size="14" fill="#4B5563">codebook of 256</text>
<circle cx="172" cy="178" r="17" fill="#7C3AED"/><text x="172" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">7</text>
