<text x="332" y="404" font-size="14" font-weight="700" fill="#92400E">Collision: two items at (7, 1, 4)</text>
<text x="332" y="426" font-size="15" fill="#1E1B4B">→ (7, 1, 4, <tspan font-weight="700">0</tspan>) and (7, 1, 4, <tspan font-weight="700">1</tspan>)</text>
<text x="320" y="466" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Each token explains what the previous ones missed: <tspan fill="#7C3AED">coarse → fine</tspan>.</text>
</svg>
