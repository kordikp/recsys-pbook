<text x="150" y="302" font-size="15" font-weight="700" fill="#4C1D95">e₇</text>
<text x="182" y="236" font-size="15" font-weight="700" fill="#7C3AED">z</text>
<text x="109" y="350" text-anchor="middle" font-size="15" fill="#1E1B4B">r₁ = z − e₇</text>
<rect x="227" y="146" width="186" height="220" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
