<line x1="321" y1="278" x2="325" y2="250" stroke="#4C1D95" stroke-width="1.75" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="287" y1="290" x2="325" y2="250" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pn11-ah)"/>
