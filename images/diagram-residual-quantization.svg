<text x="333" y="296" font-size="15" font-weight="700" fill="#4C1D95">e₁</text>
<text x="331" y="242" font-size="15" font-weight="700" fill="#7C3AED">r₁</text>
<text x="320" y="350" text-anchor="middle" font-size="15" fill="#1E1B4B">r₂ = r₁ − e₁</text>
<rect x="438" y="146" width="186" height="220" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
