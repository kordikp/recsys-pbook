<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="pb142-title pb142-desc" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title id="pb142-title">User-level CF vs. session-based recommendation</title>
  <desc id="pb142-desc">User-level collaborative filtering reads months of a known user&apos;s history and learns stable taste (literary fiction); session-based recommendation reads only the few clicks of the current visit and catches what the visitor wants right now (cookbooks), even without a login; for a logged-in user the best system blends both.</desc>
  <defs>
    <marker id="pb142-head-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#10B981"/></marker>
    <marker id="pb142-head-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#F59E0B"/></marker>
  </defs>
  <rect x=".5" y=".5" width="639" height="419" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Two memories: who you are, what you want now</text>

  <!-- left: user-level CF -->
  <rect x="24" y="60" width="284" height="210" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="166" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#065F46">User-level CF</text>
  <text x="166" y="109" text-anchor="middle" font-size="14" fill="#4B5563">months of a known user&apos;s history</text>
  <g>
    <rect x="49" y="138" width="10" height="30" rx="2" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <rect x="62" y="132" width="10" height="36" rx="2" fill="#10B981" stroke="#065F46" stroke-width="1"/>
    <rect x="75" y="140" width="10" height="28" rx="2" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <rect x="88" y="128" width="10" height="40" rx="2" fill="#6EE7B7" stroke="#065F46" stroke-width="1"/>
    <rect x="101" y="135" width="10" height="33" rx="2" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <rect x="114" y="142" width="10" height="26" rx="2" fill="#10B981" stroke="#065F46" stroke-width="1"/>
    <rect x="127" y="130" width="10" height="38" rx="2" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <rect x="140" y="137" width="10" height="31" rx="2" fill="#6EE7B7" stroke="#065F46" stroke-width="1"/>
    <rect x="153" y="133" width="10" height="35" rx="2" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <rect x="166" y="139" width="10" height="29" rx="2" fill="#10B981" stroke="#065F46" stroke-width="1"/>
    <rect x="179" y="129" width="10" height="39" rx="2" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <rect x="192" y="141" width="10" height="27" rx="2" fill="#6EE7B7" stroke="#065F46" stroke-width="1"/>
    <rect x="205" y="134" width="10" height="34" rx="2" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <rect x="218" y="131" width="10" height="37" rx="2" fill="#10B981" stroke="#065F46" stroke-width="1"/>
    <rect x="231" y="138" width="10" height="30" rx="2" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <rect x="244" y="132" width="10" height="36" rx="2" fill="#6EE7B7" stroke="#065F46" stroke-width="1"/>
    <rect x="257" y="140" width="10" height="28" rx="2" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <rect x="270" y="135" width="10" height="33" rx="2" fill="#10B981" stroke="#065F46" stroke-width="1"/>
    <line x1="42" y1="169" x2="290" y2="169" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="44" y="188" font-size="14" fill="#6B7280">months ago</text>
  <text x="288" y="188" text-anchor="end" font-size="14" fill="#6B7280">today</text>
  <rect x="50" y="200" width="232" height="34" rx="17" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="166" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">📚 Taste: literary fiction</text>
  <text x="166" y="256" text-anchor="middle" font-size="14" fill="#4B5563">🔑 needs login · slow to notice change</text>

  <!-- right: session-based -->
  <rect x="332" y="60" width="284" height="210" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="474" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#92400E">Session-based</text>
  <text x="474" y="109" text-anchor="middle" font-size="14" fill="#4B5563">only the clicks of this visit</text>
    <rect x="360" y="124" width="56" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="388" y="153" text-anchor="middle" font-size="20">🍳</text>
    <rect x="446" y="124" width="56" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="474" y="153" text-anchor="middle" font-size="20">🍳</text>
    <rect x="532" y="124" width="56" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="560" y="153" text-anchor="middle" font-size="20">🍳</text>
    <line x1="420" y1="146" x2="440" y2="146" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" marker-end="url(#pb142-head-amber)"/>
    <line x1="506" y1="146" x2="526" y2="146" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" marker-end="url(#pb142-head-amber)"/>
  <text x="474" y="188" text-anchor="middle" font-size="14" fill="#6B7280">click 1 → 2 → 3, just now</text>
  <rect x="358" y="200" width="232" height="34" rx="17" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="474" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">🍳 Right now: cookbooks</text>
  <text x="474" y="256" text-anchor="middle" font-size="14" fill="#4B5563">👤 no login · but only a few clicks</text>

  <!-- blend -->
  <line x1="166" y1="276" x2="238" y2="300" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb142-head-green)"/>
  <line x1="474" y1="276" x2="402" y2="300" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb142-head-amber)"/>
  <rect x="150" y="304" width="340" height="62" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="320" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Logged in? Blend both:</text>
  <text x="320" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">cookbooks with literary flair</text>

  <text x="320" y="398" text-anchor="middle" font-size="15" font-weight="600" fill="#1E1B4B">History knows who you are; the session knows what you want now.</text>
</svg>
