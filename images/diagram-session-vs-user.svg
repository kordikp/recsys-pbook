<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="650" height="300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrRightGreen" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#10B981"/>
    </marker>
    <marker id="arrRightAmber" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="0.75" y="0.75" width="648.5" height="298.5" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="325" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">User-Level CF vs. Session-Based Recommendations</text>

  <line x1="325" y1="48" x2="325" y2="274" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="325" y="291" text-anchor="middle" font-size="11" fill="#6B7280">vs.</text>

  <g transform="translate(20,55)">
    <text x="145" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#10B981">User-Level CF</text>

    <circle cx="30" cy="42" r="14" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="30" cy="37" r="5" fill="#10B981"/>
    <path d="M20,48 Q30,55 40,48" fill="none" stroke="#10B981" stroke-width="1.5"/>

    <line x1="55" y1="42" x2="260" y2="42" stroke="#10B981" stroke-width="2"/>
    <circle cx="68" cy="42" r="5" fill="#D1FAE5" stroke="#10B981"/>
    <circle cx="86" cy="42" r="5" fill="#D1FAE5" stroke="#10B981"/>
    <circle cx="104" cy="42" r="5" fill="#D1FAE5" stroke="#10B981"/>
    <circle cx="122" cy="42" r="5" fill="#D1FAE5" stroke="#10B981"/>
    <circle cx="140" cy="42" r="5" fill="#D1FAE5" stroke="#10B981"/>
    <circle cx="158" cy="42" r="5" fill="#D1FAE5" stroke="#10B981"/>
    <circle cx="176" cy="42" r="5" fill="#10B981" fill-opacity="0.45" stroke="#10B981"/>
    <circle cx="194" cy="42" r="5" fill="#10B981" fill-opacity="0.6" stroke="#10B981"/>
    <circle cx="212" cy="42" r="5" fill="#10B981" fill-opacity="0.75" stroke="#10B981"/>
    <circle cx="230" cy="42" r="5" fill="#10B981" fill-opacity="0.9" stroke="#10B981"/>
    <circle cx="248" cy="42" r="5" fill="#10B981" stroke="#10B981"/>

    <text x="68" y="64" text-anchor="middle" font-size="11" fill="#6B7280">months ago</text>
    <text x="248" y="64" text-anchor="middle" font-size="11" fill="#6B7280">today</text>

    <line x1="150" y1="74" x2="150" y2="96" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrRightGreen)"/>

    <rect x="65" y="100" width="170" height="44" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="150" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Stable Profile</text>
    <text x="150" y="135" text-anchor="middle" font-size="11" fill="#6B7280">Long-term preferences</text>

    <g transform="translate(30,155)">
      <circle cx="5" cy="6" r="3" fill="#10B981"/>
      <text x="14" y="10" font-size="11" fill="#1E1B4B">Deep personalization</text>
    </g>
    <g transform="translate(30,172)">
      <circle cx="5" cy="6" r="3" fill="#10B981"/>
      <text x="14" y="10" font-size="11" fill="#1E1B4B">Requires login / user ID</text>
    </g>
    <g transform="translate(30,189)">
      <circle cx="5" cy="6" r="3" fill="#10B981"/>
      <text x="14" y="10" font-size="11" fill="#1E1B4B">Slow to adapt to changes</text>
    </g>
    <g transform="translate(30,206)">
      <circle cx="5" cy="6" r="3" fill="#10B981"/>
      <text x="14" y="10" font-size="11" fill="#1E1B4B">Rich similarity signals</text>
    </g>
  </g>

  <g transform="translate(345,55)">
    <text x="145" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#D97706">Session-Based</text>

    <rect x="20" y="20" width="250" height="46" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>

    <line x1="55" y1="42" x2="230" y2="42" stroke="#D97706" stroke-width="2"/>

    <rect x="65" y="30" width="28" height="24" rx="4" fill="#FEF3C7" stroke="#D97706"/>
    <text x="79" y="47" text-anchor="middle" font-size="11" fill="#1E1B4B">1</text>
    <line x1="95" y1="42" x2="109" y2="42" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrRightAmber)"/>

    <rect x="115" y="30" width="28" height="24" rx="4" fill="#FEF3C7" stroke="#D97706"/>
    <text x="129" y="47" text-anchor="middle" font-size="11" fill="#1E1B4B">2</text>
    <line x1="145" y1="42" x2="157" y2="42" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrRightAmber)"/>

    <rect x="163" y="30" width="28" height="24" rx="4" fill="#FEF3C7" stroke="#D97706"/>
    <text x="177" y="47" text-anchor="middle" font-size="11" fill="#1E1B4B">3</text>
    <line x1="193" y1="42" x2="203" y2="42" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrRightAmber)"/>

    <rect x="207" y="30" width="28" height="24" rx="4" fill="#FEF3C7" stroke="#D97706"/>
    <text x="221" y="47" text-anchor="middle" font-size="11" fill="#1E1B4B">4</text>

    <text x="145" y="81" text-anchor="middle" font-size="11" fill="#6B7280">current session (minutes)</text>

    <line x1="150" y1="85" x2="150" y2="96" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrRightAmber)"/>

    <rect x="65" y="100" width="170" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="150" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Current Intent</text>
    <text x="150" y="135" text-anchor="middle" font-size="11" fill="#6B7280">What they want right now</text>

    <g transform="translate(30,155)">
      <circle cx="5" cy="6" r="3" fill="#D97706"/>
      <text x="14" y="10" font-size="11" fill="#1E1B4B">Immediate responsiveness</text>
    </g>
    <g transform="translate(30,172)">
      <circle cx="5" cy="6" r="3" fill="#D97706"/>
      <text x="14" y="10" font-size="11" fill="#1E1B4B">Works for anonymous users</text>
    </g>
    <g transform="translate(30,189)">
      <circle cx="5" cy="6" r="3" fill="#D97706"/>
      <text x="14" y="10" font-size="11" fill="#1E1B4B">Captures shifting intent</text>
    </g>
    <g transform="translate(30,206)">
      <circle cx="5" cy="6" r="3" fill="#D97706"/>
      <text x="14" y="10" font-size="11" fill="#1E1B4B">Sparse data per session</text>
    </g>
  </g>
</svg>