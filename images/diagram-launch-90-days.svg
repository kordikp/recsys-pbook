<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn13-title pn13-desc">
<title id="pn13-title">Klara's first 90 days: pass each gate before moving on</title>
<desc id="pn13-desc">Launching recommendations in three phases of about a month each. Days 1 to 30, measure: one surface, a tracking plan that logs impressions with position, and a bestseller baseline. Gate 1: events flowing and the baseline live. Days 31 to 60, experiment: the model appears only now, as an A/B test against the baseline with a small holdout that sees no recommendations, with metrics and guardrails written down first. Gate 2: lift measured against the holdout. Days 61 to 90, rhythm: weekly ship or kill review, a monthly one-pager with the lift in money, then the next surface. Tracking, a baseline and a holdout come before the model.</desc>
