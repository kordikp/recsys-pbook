<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb083-title pb083-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb083-title">The boutique has more than one dress code</title>
<desc id="pb083-desc">Four-panel comic about multimodal recommendation. 1: A blindfolded shop recommender reads only the tags; two dresses both tagged elegant evening wear must be the same dress, it says, though one is a sleek black sheath and the other a gold sequin ball gown. 2: It adds the photos, takes off the blindfold and sees the difference. 3: Words and photos share one map (as in CLIP): the shopper types sleek black dress and the words land right next to the sheath photo, far from the gown, so the sheath is the match. 4: Receipts add what shoppers actually buy (as in beeFormer): the photos suggest heels, but people who bought the sheath also bought sneakers. Takeaway: multimodal means tags, photos and what shoppers buy, in one recommender.</desc>
