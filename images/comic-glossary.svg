<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The Usual, in Unusual Words</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="42" y="76" width="244" height="58" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="56" y="99" font-size="12.5" fill="#1E1B4B">
    <tspan x="56" dy="0">Would you like an anaerobic</tspan>
    <tspan x="56" dy="18">single-origin macchiato?</tspan>
  </text>
  <circle cx="101" cy="178" r="10" fill="#7C3AED"/>
  <path d="M101 188 L101 218 M101 198 L82 211 M101 198 L120 211 M101 218 L88 239 M101 218 L114 239" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="318" cy="176" r="10" fill="#10B981"/>
  <path d="M318 186 L318 218 M318 198 L300 209 M318 198 L336 209 M318 218 L306 239 M318 218 L330 239" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M224 225 L370 225" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">The menu assumes everyone already speaks coffee.</text>

  <!-- Panel 2 -->
  <circle cx="478" cy="137" r="10" fill="#7C3AED"/>
  <path d="M478 147 L478 187 M478 157 L466 175 M478 157 L539 173 M478 187 L466 210 M478 187 L490 210" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="540" y="78" width="222" height="132" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="554" y="100" font-size="12" fill="#1E1B4B">
    <tspan x="554" dy="0" font-weight="700">POCKET GLOSSARY</tspan>
    <tspan x="554" dy="25">anaerobic — fermented without air</tspan>
    <tspan x="554" dy="22">single-origin — from one place</tspan>
    <tspan x="554" dy="22">macchiato — espresso with milk</tspan>
  </text>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">She looks up each unfamiliar term instead of guessing.</text>

  <!-- Panel 3 -->
  <rect x="34" y="356" width="192" height="64" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="48" y="380" font-size="12.5" fill="#1E1B4B">
    <tspan x="48" dy="0">Is “medium” a specialist</tspan>
    <tspan x="48" dy="18">term too?</tspan>
  </text>
  <rect x="246" y="356" width="124" height="46" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="308" y="384" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Only here.</text>
  <circle cx="105" cy="458" r="10" fill="#7C3AED"/>
  <path d="M105 468 L105 500 M105 478 L87 490 M105 478 L123 490 M105 500 L92 524 M105 500 L118 524" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="310" cy="458" r="10" fill="#10B981"/>
  <path d="M310 468 L310 500 M310 478 L292 490 M310 478 L328 490 M310 500 L297 524 M310 500 L323 524" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Soon, even ordinary words seem suspicious.</text>

  <!-- Panel 4 -->
  <rect x="430" y="356" width="188" height="46" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="524" y="384" font-size="12.5" fill="#1E1B4B" text-anchor="middle">I’ll have the definition.</text>
  <rect x="644" y="356" width="118" height="46" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="703" y="384" font-size="12.5" fill="#1E1B4B" text-anchor="middle">One coffee.</text>
  <circle cx="500" cy="458" r="10" fill="#7C3AED"/>
  <path d="M500 468 L500 500 M500 478 L482 490 M500 478 L518 490 M500 500 L487 524 M500 500 L513 524" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="702" cy="458" r="10" fill="#10B981"/>
  <path d="M702 468 L702 500 M702 478 L684 490 M702 478 L720 490 M702 500 L689 524 M702 500 L715 524" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The jargon is finally translated into something drinkable.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">A glossary maps specialized or unfamiliar terms to concise definitions for quick reference.</text>
</svg>