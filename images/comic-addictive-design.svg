<text x="320" y="584" font-size="16" fill="#1E1B4B" text-anchor="middle"><tspan font-weight="700" fill="#7C3AED">Infinite scroll</tspan> removes the end. <tspan font-weight="700" fill="#7C3AED">Autoplay</tspan> removes the choice.</text>
<text x="320" y="608" font-size="15" fill="#1E1B4B" text-anchor="middle"><tspan font-weight="700" fill="#92400E">Badges</tspan> pull you back, and most of us never touch a <tspan font-weight="700">default</tspan>.</text>
