in="round"/><text font-size="15" fill="#1E1B4B" text-anchor="middle"><tspan x="90" y="58.8">I'll stop at the end</tspan><tspan x="90" y="77.8">of the feed.</tspan></text><path d="M200,46 H276 Q288,46 288,58 V70 Q288,82 276,82 H257 L250,125 L243,82 H200 Q188,82 188,70 V58 Q188,46 200,46 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/><text font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="middle"><tspan x="238" y="69.6">What end?</tspan></text><text x="44" y="241" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">You</text><text x="284" y="241" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="end">Recommender</text></g>
