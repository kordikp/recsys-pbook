<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 624" role="img" aria-labelledby="pb036-title pb036-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb036-title">The house always recommends one more</title>
<desc id="pb036-desc">Four-panel comic over one evening. 9:02 pm: you plan to stop at the end of the feed, but the recommender keeps adding cards — infinite scroll has no end. 10:47 pm: an episode ends and the next starts in 3 seconds — autoplay said yes for you. 12:40 am: a badge with 7 new things pulls you back for one more look. 1:15 am: the autoplay switch is 3 menus deep, so you leave it for tomorrow. Infinite scroll removes the stopping point, autoplay removes the decision to continue, and because most people never change a default, the session keeps going.</desc>
<rect x=".5" y=".5" width="639" height="623" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="34" font-size="19" font-weight="700" fill="#1E1B4B" text-anchor="middle">The house always recommends one more</text>
<g transform="translate(16,48)"><rect x="0" y="0" width="298" height="248" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="24" cy="20" r="11" fill="#1E1B4B"/><text x="24" y="25" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="42" y="26" font-size="16" font-weight="700" fill="#1E1B4B">Infinite scroll</text><circle cx="221" cy="20" r="7" fill="none" stroke="#4B5563" stroke-width="1.6"/><path d="M221,16 V20 H224" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linecap="round"/><text x="284" y="25" font-size="14" fill="#4B5563" text-anchor="end">9:02 pm</text><path d="M12,222 H286" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/><path d="M64,182 L84,172" stroke="#10B981" stroke-width="7" stroke-linecap="round"/><path d="M21,222 V182 Q21,166 37,166 H51 Q67,166 67,182 V222 Z" fill="#10B981"/><circle cx="44" cy="145" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/><circle cx="41" cy="143" r="2.2" fill="#1E1B4B"/><circle cx="53" cy="143" r="2.2" fill="#1E1B4B"/><path d="M42,151 Q47,155 52,151" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/><path d="M100,190 V221 H226 V205 H124 V190 Z" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5" stroke-linejoin="round"/><rect x="126" y="208" width="11" height="11" rx="2" fill="#DDD6FE"/><path d="M140,213 H147" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/><rect x="150" y="208" width="11" height="11" rx="2" fill="#DDD6FE"/><path d="M164,213 H171" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/><rect x="174" y="208" width="11" height="11" rx="2" fill="#DDD6FE"/><path d="M188,213 H195" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/><rect x="198" y="208" width="11" height="11" rx="2" fill="#DDD6FE"/><path d="M212,213 H219" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/><rect x="104" y="196" width="16" height="7" rx="1.5" fill="#DDD6FE"/><rect x="84" y="102" width="56" height="90" rx