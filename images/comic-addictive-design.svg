le cx="254" cy="145" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/><circle cx="245" cy="143" r="2.2" fill="#1E1B4B"/><circle cx="257" cy="143" r="2.2" fill="#1E1B4B"/><path d="M246,151 Q251,155 256,151" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/><path d="M130,38 H276 Q288,38 288,50 V76 Q288,88 276,88 H257 L250,125 L243,88 H130 Q118,88 118,76 V50 Q118,38 130,38 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/><text font-size="15" fill="#1E1B4B" text-anchor="middle"><tspan x="203" y="58.8">7 new things!</tspan><tspan x="203" y="77.8">What if you miss one?</tspan></text><path d="M22,62 H94 Q106,62 106,74 V100 Q106,112 94,112 H49 L42,126 L35,112 H22 Q10,112 10,100 V74 Q10,62 22,62 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/><text font-size="15" fill="#1E1B4B" text-anchor="middle"><tspan x="58" y="82.8">…Okay.</tspan><tspan x="58" y="101.8">One look.</tspan></text></g>
