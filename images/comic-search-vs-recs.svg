    <line x1="584" y1="207" x2="698" y2="207" stroke="#6B7280" stroke-width="2"/>
  </g>
  <g>
    <circle cx="751" cy="118" r="10" fill="#D97706"/>
    <path d="M751 129 L751 173 M751 142 L720 153 M751 142 L771 151 M751 172 L740 203 M751 172 L763 203" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
