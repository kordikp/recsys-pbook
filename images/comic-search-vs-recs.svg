<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">Same Search, Different Footprints</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1: two shoppers submit the same query -->
  <g>
    <circle cx="67" cy="111" r="10" fill="#7C3AED"/>
    <path d="M67 122 L67 166 M67 136 L96 118 M67 165 L53 194 M67 165 L81 194" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    <text x="67" y="211" font-size="12" fill="#6B7280" text-anchor="middle">Maya</text>
  </g>
  <g>
    <rect x="102" y="94" width="168" height="40" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
    <circle cx="119" cy="113" r="5" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <line x1="123" y1="117" x2="128" y2="122" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <text x="138" y="118" font-size="12.5" fill="#1E1B4B">running shoes</text>
  </g>
  <g>
    <circle cx="331" cy="184" r="10" fill="#10B981"/>
    <path d="M331 195 L331 224 M331 204 L307 191 M331 223 L320 242 M331 223 L342 242" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
