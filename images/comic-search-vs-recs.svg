<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" role="img" aria-labelledby="pb096-title pb096-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb096-title">Same search, different footprints</title>
<desc id="pb096-desc">Four-panel comic. Maya and Leo both search a shoe shop for “running shoes”. The shop’s search finds the same three matching shoes for both: Racer, Trail and Cushion. Then it orders them by what each of them bought before: Maya, who bought a race bib and light socks, gets the light Racer first; Leo, who bought a knee brace and gel insoles, gets the Cushion first. Leo protests that they typed the same thing; the search replies that his knees didn’t. Search finds the matches, your history decides the order, and that ordering is a recommender, the same engine that fills a home feed.</desc>
