  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Both notes enter the same meaning-based stockroom.</text>

  <!-- Panel 3: histories steer ranking -->
  <g>
    <rect x="31" y="367" width="130" height="53" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="96" y="389" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">Maya</text>
    <text x="96" y="407" font-size="12" fill="#6B7280" text-anchor="middle">race pace · light shoes</text>
  </g>
  <g>
    <rect x="31" y="476" width="130" height="53" rx="8" fill="#D1FAE5" stroke="#10B981"/>
    <text x="96" y="498" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">Leo</text>
    <text x="96" y="516" font-size="12" fill="#6B7280" text-anchor="middle">soft landings · support</text>
  </g>
  <g>
    <rect x="176" y="421" width="98" height="55" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="225" y="442" font-size="11.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">SAME QUERY</text>
    <text x="225" y="461" font-size="12" fill="#1E1B4B" text-anchor="middle">running shoes</text>
  </g>
  <g>
    <path d="M161 393 C190 393 190 432 210 432 M240 432 C266 432 268 393 291 393" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <path d="M161 503 C190 503 190 465 210 465 M240 465 C266 465 268 503 291 503" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="291" y="368" width="84" height="51" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
    <path d="M307 395 C321 395 325 383 332 383 L342 396 L359 401 L359 407 L306 407 Z" fill="#7C3AED" stroke="#1E1B4B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="291" y="477" width="84" height="51" rx="8" fill="#D1FAE5" stroke="#10B981"/>
    <path d="M306 500 C320 500 323 491 331 491 L342 501 L360 505 L360 514 L305 514 Z" fill="#10B981" stroke="#1E1B4B" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="310" y1="510" x2="356" y2="510" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The same request meets two different customer histories.</text>

  <!-- Panel 4: personalized results -->
  <g>
    <rect x="424" y="355" width="180" height="43" rx="9" fill="#FFFFFF" stroke="#7C3AED"/>
    <text x="514" y="382" font-size="12.5" fill="#1E1B4B" text-anchor="middle">We asked for the same thing.</text>
  </g>
  <g>
    <rect x="610" y="355" width="160" height="43" rx="9" fill="#FEF3C7" stroke="#D97706"/>
    <text x="690" y="382" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Your knees did not.</text>
  </g>
  <g>
    <circle cx="463" cy="451" r="10" fill="#7C3AED"/>
    <path d="M463 462 L463 512 M463 476 L490 490 M463 476 L442 493 M463 511 L451 541 M463 511 L477 541" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M485 486 C499 486 504 474 511 474 L522 488 L542 493 L542 501 L483 501 Z" fill="#7C3AED" stroke="#1E1B4B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="681" cy="451" r="10" fill="#10B981"/>
    <path d="M681 462 L681 512 M681 476 L650 497 M681 476 L703 492 M681 511 L669 541 M681 511 L695 541" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M620 496 C635 496 639 486 647 486 L658 497 L676 501 L676 512 L619 512 Z" fill="#10B981" stroke="#1E1B4B" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="624" y1="507" x2="672" y2="507" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <g>
    <circle cx="572" cy="442" r="10" fill="#D97706"/>
    <path d="M572 453 L572 505 M572 469 L548 487 M572 469 L598 487 M572 504 L561 537 M572 504 L584 537" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">One query, two very personally stocked answers.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Search and recommendations use one embedding retrieval pipeline; user signals personalize results.</text>
</svg>