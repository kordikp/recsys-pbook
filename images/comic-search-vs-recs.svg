  </g>
  <g>
    <rect x="139" y="166" width="168" height="40" rx="8" fill="#D1FAE5" stroke="#10B981"/>
    <circle cx="156" cy="185" r="5" fill="none" stroke="#10B981" stroke-width="2"/>
    <line x1="160" y1="189" x2="165" y2="194" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <text x="175" y="190" font-size="12.5" fill="#1E1B4B">running shoes</text>
  </g>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Maya and Leo hand over exactly the same request.</text>

  <!-- Panel 2: one shared embedding-based stockroom -->
  <g>
    <rect x="426" y="91" width="116" height="34" rx="7" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="484" y="113" font-size="12" fill="#1E1B4B" text-anchor="middle">running shoes</text>
    <path d="M542 108 L562 128" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="426" y="157" width="116" height="34" rx="7" fill="#D1FAE5" stroke="#10B981"/>
    <text x="484" y="179" font-size="12" fill="#1E1B4B" text-anchor="middle">running shoes</text>
    <path d="M542 174 L562 154" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g>
