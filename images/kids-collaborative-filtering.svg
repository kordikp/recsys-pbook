<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb149-title pb149-desc">
  <title id="pb149-title">Your taste twin picks your next show</title>
  <desc id="pb149-desc">Collaborative filtering compares likes: Maya liked all five of the shows you liked, Sam only one, so Maya is your taste twin, and Silo, which she loved and you have not seen, is recommended to you. Nobody had to describe their taste.</desc>
  <style>
    .pb149-chk { fill: none; stroke: #10B981; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .pb149-dash { stroke: #D1D5DB; stroke-width: 2.5; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="pb149-ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker>
    <marker id="pb149-ah-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
  </defs>
  <rect x=".5" y=".5" width="639" height="499" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Your taste twin picks your next show</text>
  <text x="320" y="64" text-anchor="middle" font-size="14" fill="#6B7280">Toy example: You and Maya from the text, plus Sam · ✓ = liked it</text>

  <rect x="24" y="84" width="360" height="352" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="311" y="92" width="68" height="282" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <circle cx="206" cy="108" r="9" fill="#10B981"/><path d="M193,136 Q193,122 206,122 Q219,122 219,136 Z" fill="#10B981"/>
  <text x="206" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">You</text>
  <circle cx="274" cy="108" r="9" fill="#9CA3AF"/><path d="M261,136 Q261,122 274,122 Q287,122 287,136 Z" fill="#9CA3AF"/>
  <text x="274" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Sam</text>
  <circle cx="345" cy="108" r="9" fill="#9CA3AF"/><path d="M332,136 Q332,122 345,122 Q358,122 358,136 Z" fill="#9CA3AF"/>
  <text x="345" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">Maya</text>
  <line x1="36" y1="170" x2="372" y2="170" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="197" font-size="15" fill="#1E1B4B">Shawshank</text>
  <path class="pb149-chk" d="M199,192 l5,5 l9,-10"/>
  <path class="pb149-chk" d="M267,192 l5,5 l9,-10"/>
  <path class="pb149-chk" d="M338,192 l5,5 l9,-10"/>
  <text x="40" y="229" font-size="15" fill="#1E1B4B">Breaking Bad</text>
  <path class="pb149-chk" d="M199,224 l5,5 l9,-10"/>
  <line class="pb149-dash" x1="268" y1="224" x2="280" y2="224"/>
  <path class="pb149-chk" d="M338,224 l5,5 l9,-10"/>
  <text x="40" y="261" font-size="15" fill="#1E1B4B">Dark</text>
  <path class="pb149-chk" d="M199,256 l5,5 l9,-10"/>
  <line class="pb149-dash" x1="268" y1="256" x2="280" y2="256"/>
  <path class="pb149-chk" d="M338,256 l5,5 l9,-10"/>
  <text x="40" y="293" font-size="15" fill="#1E1B4B">Succession</text>
  <path class="pb149-chk" d="M199,288 l5,5 l9,-10"/>
  <line class="pb149-dash" x1="268" y1="288" x2="280" y2="288"/>
  <path class="pb149-chk" d="M338,288 l5,5 l9,-10"/>
  <text x="40" y="325" font-size="15" fill="#1E1B4B">Severance</text>
  <path class="pb149-chk" d="M199,320 l5,5 l9,-10"/>
  <line class="pb149-dash" x1="268" y1="320" x2="280" y2="320"/>
  <path class="pb149-chk" d="M338,320 l5,5 l9,-10"/>
  <line x1="36" y1="340" x2="372" y2="340" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="362" font-size="15" font-weight="700" fill="#1E1B4B">Shared with you</text>
  <text x="274" y="362" text-anchor="middle" font-size="16" fill="#4B5563">1 of 5</text>
  <text x="345" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">5 of 5</text>

  <rect x="32" y="388" width="344" height="40" rx="8" fill="#EDE9FE"/>
  <text x="40" y="413" font-size="15" font-weight="700" fill="#4C1D95">Silo</text>
  <text x="206" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#7C3AED">?</text>
  <line class="pb149-dash" x1="268" y1="408" x2="280" y2="408"/>
  <path class="pb149-chk" d="M338,408 l5,5 l9,-10"/>

  <line x1="384" y1="256" x2="400" y2="256" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb149-ah-g)"/>
  <rect x="404" y="210" width="212" height="92" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="420" y="238" font-size="15" font-weight="700" fill="#065F46">① Most similar: Maya</text>
  <text x="420" y="262" font-size="15" fill="#1E1B4B">has all 5 of your likes</text>
  <text x="420" y="286" font-size="14" fill="#4B5563">Sam: 1 of 5. Sorry, Sam.</text>

  <line x1="510" y1="306" x2="510" y2="338" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb149-ah-p)"/>

  <line x1="360" y1="408" x2="400" y2="408" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb149-ah-p)"/>
  <rect x="404" y="344" width="212" height="92" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="420" y="370" font-size="15" font-weight="700" fill="#4C1D95">② Borrow her favorite</text>
  <text x="420" y="400" font-size="20" font-weight="700" fill="#1E1B4B">For you: Silo 🎬</text>
  <text x="420" y="424" font-size="14" fill="#4B5563">she loved it · new to you</text>

  <text x="320" y="474" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Nobody described their taste. <tspan fill="#7C3AED">Shared likes did the talking.</tspan></text>
</svg>
