.pb010-squeeze{transform-box:fill-box;transform-origin:50% 100%;animation:pb010-squeeze 10s ease-in-out infinite}
@keyframes pb010-squeeze{0%{opacity:0;transform:scale(2.92,0.6)}4%,8%{opacity:1;transform:scale(2.92,0.6)}36%,93%{opacity:1;transform:scale(1,1)}98%,100%{opacity:0;transform:scale(1,1)}}
.pb010-drop{transform-box:fill-box;transform-origin:50% 100%;animation:pb010-drop 10s ease-in-out infinite}
@keyframes pb010-drop{0%{opacity:0;transform:scaleY(1.667)}4%,8%{opacity:1;transform:scaleY(1.667)}36%,93%{opacity:1;transform:scaleY(1)}98%,100%{opacity:0;transform:scaleY(1)}}
.pb010-late{animation:pb010-late 10s ease-in-out infinite}
@keyframes pb010-late{0%,30%{opacity:0}38%,93%{opacity:1}98%,100%{opacity:0}}
.pb010-draw{stroke-dasharray:100 100;animation:pb010-draw 10s linear infinite}
@keyframes pb010-draw{0%,12%{stroke-dashoffset:100;opacity:1}46%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
.pb010-gap{animation:pb010-gap 10s ease-in-out infinite}
@keyframes pb010-gap{0%,36%{opacity:0}48%,93%{opacity:1}98%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.pb010-shift,.pb010-squeeze,.pb010-drop,.pb010-late,.pb010-draw,.pb010-gap{animation:none !important}}
</style>
