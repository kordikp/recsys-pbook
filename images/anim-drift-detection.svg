<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" aria-labelledby="pb010-title pb010-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb010-title">Four kinds of drift, and the server dashboard that misses them all</title>
<desc id="pb010-desc">A deployed recommender goes stale in four places. Feature drift: today's inputs shift away from the training data (check with PSI or a KS test). Prediction drift: the model's scores bunch together (track the p10, p50 and p90 of scores). Label drift: users click less whatever is shown, for example a base click rate falling from 5% to 3% (track the baseline CTR). Concept drift: the inputs look the same but users react differently, so predicted and actual engagement pull apart; the gap shows up only once delayed outcomes arrive. A server dashboard of 200 OK, latency and uptime stays green through all four, so each drift needs its own check, and a diagnosis before any retrain.</desc>
