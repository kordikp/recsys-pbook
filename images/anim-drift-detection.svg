<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .drift{animation:d 6s ease-in-out infinite}
    @keyframes d{0%,15%{transform:translateX(0)}60%,85%{transform:translateX(150px)}100%{transform:translateX(0)}}
    .alert{animation:a 6s ease-in-out infinite}
    @keyframes a{0%,40%{opacity:0}62%,85%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Model Drift: The World Moves, the Model Doesn't</text>

  <g stroke="#9CA3AF" stroke-width="1.5">
    <line x1="70" y1="330" x2="740" y2="330"/><line x1="70" y1="330" x2="70" y2="90"/>
  </g>
  <text x="405" y="356" text-anchor="middle" font-size="12" fill="#6B7280">feature value (e.g. session length)</text>
  <text x="56" y="210" text-anchor="middle" font-size="12" fill="#6B7280" transform="rotate(-90 56 210)">frequency</text>

  <!-- training distribution: fixed -->
  <path d="M110 330 C200 330 210 120 300 120 C390 120 400 330 490 330 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5" opacity=".9"/>
  <text x="300" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">training data</text>

  <!-- production distribution: drifts right -->
  <g class="drift">
    <path d="M150 330 C240 330 250 150 340 150 C430 150 440 330 530 330 Z" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="345" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#D97706">production traffic</text>
  </g>

  <g class="alert">
    <rect x="565" y="96" width="180" height="64" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="655" y="122" text-anchor="middle" font-size="14" font-weight="800" fill="#B91C1C">⚠ DRIFT ALERT</text>
    <text x="655" y="144" text-anchor="middle" font-size="12" fill="#B91C1C">PSI &gt; 0.2 — retrain</text>
  </g>

  <text x="400" y="398" text-anchor="middle" font-size="13" fill="#6B7280">Monitor input distributions, not just accuracy — accuracy reports arrive late, drift shows up first.</text>
</svg>
