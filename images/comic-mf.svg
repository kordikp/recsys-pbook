<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb081-title pb081-desc">
  <title id="pb081-title">Matrix factorization: every missing rating is one dot product</title>
  <desc id="pb081-desc">A ratings table of 100 million users by 500,000 items has 50 trillion cells, about 99% of them empty. Matrix factorization learns a few numbers for every user and every item; in the text's toy example two taste factors, roughly intensity and humor: you (0.9, 0.2), thriller A (0.8, 0.1), comedy B (0.1, 0.9). A missing rating is predicted as the dot product: you times A is 0.9 times 0.8 plus 0.2 times 0.1, which is 0.74, a strong match because the two vectors point the same way; you times B is 0.27, a weak match.</desc>

  <defs>
    <marker id="pb081-ah-g" markerWidth="10" markerHeight="10" refX="3" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#10B981"/></marker>
    <marker id="pb081-ah-p" markerWidth="10" markerHeight="10" refX="3" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker>
    <marker id="pb081-ah-n" markerWidth="10" markerHeight="10" refX="3" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#9CA3AF"/></marker>
    <marker id="pb081-ah-ax" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#9CA3AF"/></marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="483" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Every missing rating is one dot product</text>
  <text x="320" y="58" text-anchor="middle" font-size="14" fill="#6B7280">Toy example from the text: 2 taste factors (real systems use 50–200)</text>

  <!-- ===== Card 1: the ratings table ===== -->
  <rect x="16" y="74" width="224" height="256" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="38" cy="97" r="11" fill="#1E1B4B"/>
  <text x="38" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="56" y="102" font-size="16" font-weight="700" fill="#1E1B4B">Ratings table</text>

  <text x="89" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">A</text>
  <text x="115" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#4B5563">B</text>
  <text x="68" y="150" text-anchor="end" font-size="15" font-weight="700" fill="#065F46">You</text>

  <!-- grid 5 cols x 4 rows, cell 26 -->
  <g stroke="#E5E7EB" stroke-width="1.2" fill="#FFFFFF">
    <rect x="128" y="132" width="26" height="26" rx="3"/>
    <rect x="180" y="132" width="26" height="26" rx="3"/>
    <rect x="102" y="158" width="26" height="26" rx="3"/>
    <rect x="128" y="158" width="26" height="26" rx="3"/>
    <rect x="154" y="158" width="26" height="26" rx="3"/>
    <rect x="180" y="158" width="26" height="26" rx="3"/>
    <rect x="76" y="184" width="26" height="26" rx="3"/>
    <rect x="102" y="184" width="26" height="26" rx="3"/>
    <rect x="154" y="184" width="26" height="26" rx="3"/>
    <rect x="180" y="184" width="26" height="26" rx="3"/>
    <rect x="76" y="210" width="26" height="26" rx="3"/>
    <rect x="128" y="210" width="26" height="26" rx="3"/>
    <rect x="154" y="210" width="26" height="26" rx="3"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.2" fill="#D1D5DB">
    <rect x="154" y="132" width="26" height="26" rx="3"/>
    <rect x="76" y="158" width="26" height="26" rx="3"/>
    <rect x="128" y="184" width="26" height="26" rx="3"/>
    <rect x="102" y="210" width="26" height="26" rx="3"/>
    <rect x="180" y="210" width="26" height="26" rx="3"/>
  </g>
  <rect x="77" y="133" width="24" height="24" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="103" y="133" width="24" height="24" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="89" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#7C3AED">?</text>
  <text x="115" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#7C3AED">?</text>

  <text x="128" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">50 trillion cells</text>
  <text x="128" y="290" text-anchor="middle" font-size="14" fill="#4B5563">100M users × 500K items</text>
  <rect x="46" y="303" width="12" height="12" rx="2" fill="#D1D5DB"/>
  <text x="64" y="314" font-size="14" fill="#4B5563">rated</text>
  <rect x="116.5" y="303.5" width="11" height="11" rx="2" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="134" y="314" font-size="14" font-weight="700" fill="#92400E">~99% empty</text>

  <!-- flow arrow 1 -> 2 -->
  <circle cx="252" cy="184" r="13" fill="#7C3AED" stroke="#FAFAF7" stroke-width="3"/>
  <path d="M245.5,184 H257 M252.5,179 L258,184 L252.5,189" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Card 2: taste space ===== -->
  <rect x="264" y="74" width="360" height="256" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="286" cy="97" r="11" fill="#1E1B4B"/>
  <text x="286" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="304" y="102" font-size="16" font-weight="700" fill="#1E1B4B">Factorize: 2 learned numbers each</text>

  <!-- axes, origin (306,302), 1.0 = 160 -->
  <line x1="306" y1="302" x2="474" y2="302" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#pb081-ah-ax)"/>
  <line x1="306" y1="302" x2="306" y2="140" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#pb081-ah-ax)"/>
  <text x="482" y="322" text-anchor="end" font-size="14" fill="#4B5563">intensity →</text>
  <text x="0" y="0" transform="translate(294 222) rotate(-90)" text-anchor="middle" font-size="14" fill="#4B5563">humor →</text>

  <!-- angle between you and B -->
  <path d="M368.5,288.1 A64,64 0 0 0 313.1,238.4" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="364" y="251" font-size="14" fill="#6B7280">wide angle</text>

  <!-- the recommender shrugs about the axis names -->
  <line x1="598" y1="183" x2="598" y2="190" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
  <circle cx="598" cy="182" r="2.5" fill="#7C3AED"/>
  <rect x="585" y="190" width="26" height="22" rx="7" fill="#7C3AED"/>
  <circle cx="593" cy="199" r="2.6" fill="#FFFFFF"/>
  <circle cx="603" cy="199" r="2.6" fill="#FFFFFF"/>
  <path d="M593.5,206 H602.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="384" y="178" width="188" height="52" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M571.25,194 L579,201 L571.25,208" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="569" y="195" width="3" height="12" fill="#FFFFFF"/>
  <text x="478" y="199" text-anchor="middle" font-size="15" fill="#1E1B4B">I only learn numbers.</text>
  <text x="478" y="219" text-anchor="middle" font-size="15" fill="#1E1B4B">The names are a guess.</text>

  <!-- vectors -->
  <line x1="306" y1="302" x2="321.2" y2="165" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb081-ah-n)"/>
  <line x1="306" y1="302" x2="427.1" y2="286.9" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb081-ah-p)"/>
  <line x1="306" y1="302" x2="443.2" y2="271.5" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb081-ah-g)"/>
  <circle cx="306" cy="302" r="3" fill="#1E1B4B"/>

  <text x="332" y="164" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#4B5563">B comedy</tspan> (0.1, 0.9)</text>
  <text x="460" y="266" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#065F46">You</tspan> (0.9, 0.2)</text>
  <text x="444" y="293" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#4C1D95">A thriller</tspan> (0.8, 0.1)</text>

  <!-- ===== Card 3: fill the ? ===== -->
  <rect x="16" y="344" width="608" height="88" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="38" cy="383" r="11" fill="#1E1B4B"/>
  <text x="38" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="56" y="388" font-size="16" font-weight="700" fill="#1E1B4B">Fill each <tspan fill="#7C3AED">?</tspan></text>
  <line x1="160" y1="356" x2="160" y2="420" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="176" y="379" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#065F46">You</tspan><tspan font-weight="700"> · </tspan><tspan font-weight="700" fill="#4C1D95">A</tspan> = 0.9×0.8 + 0.2×0.1 =</text>
  <rect x="410" y="360" width="56" height="26" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="438" y="379" text-anchor="middle" font-size="16" font-weight="700" fill="#4C1D95">0.74</text>
  <text x="478" y="379" font-size="15" font-weight="700" fill="#065F46">strong match</text>

  <text x="176" y="415" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#065F46">You</tspan><tspan font-weight="700"> · </tspan><tspan font-weight="700" fill="#4B5563">B</tspan> = 0.9×0.1 + 0.2×0.9 =</text>
  <rect x="410" y="396" width="56" height="26" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="438" y="415" text-anchor="middle" font-size="16" font-weight="700" fill="#4B5563">0.27</text>
  <text x="478" y="415" font-size="15" fill="#6B7280">weak match</text>

  <text x="320" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Taste vectors pointing the <tspan fill="#065F46">same way</tspan> → <tspan fill="#7C3AED">high predicted rating</tspan></text>
</svg>
