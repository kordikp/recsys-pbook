<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" role="img" aria-labelledby="pb037-title pb037-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb037-title">The clerk stays. The ad gets around.</title>
<desc id="pb037-desc">Four-panel comic. In a shoe shop the clerk, the shop's recommender, suggests socks because you bought running shoes there: it uses only what you did on that one platform. An ad tracker peeking in notes the shoes, follows you to a news site and a recipe site, builds a file on you and auctions your attention to bidders. Back in the shop the clerk says he only knows what you did in there.</desc>
