<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn01-title pn01-desc">
  <title id="pn01-title">Same five tracks, different order: why order matters</title>
  <desc id="pn01-desc">Ana and Ben both played three fast running songs and two rain recordings, but in opposite order. An unordered bag of items sees two identical listeners and gives both a fast song, even to Ana at bedtime; a sequential recommender weighs the latest plays most and gives Ana more rain and Ben the next fast song.</desc>
  <defs>
    <marker id="pn01-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
    <marker id="pn01-ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
  </defs>
