<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="system-ui, sans-serif">
  <style>
    .flow-arrow {
      stroke-dasharray: 7 5;
      animation: flow 2.4s linear infinite;
    }
    @keyframes flow {
      to { stroke-dashoffset: -24; }
    }
  </style>

  <defs>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#D97706"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="498" height="398" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="250" y="29" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">The Recommendation Feedback Loop</text>

  <!-- Flow connections -->
  <path d="M325 79 C366 79 399 96 399 128"
        class="flow-arrow" fill="none" stroke="#7C3AED" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#arrow-purple)"/>
  <path d="M399 188 C399 220 366 237 325 237"
        class="flow-arrow" fill="none" stroke="#0EA5E9" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M175 237 C134 237 101 220 101 188"
        class="flow-arrow" fill="none" stroke="#D97706" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#arrow-amber)"/>
  <path d="M101 128 C101 96 134 79 175 79"
        class="flow-arrow" fill="none" stroke="#10B981" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#arrow-green)"/>

  <!-- Model -->
  <g>
    <rect x="175" y="49" width="150" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="250" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Model Trains</text>
    <text x="250" y="92" text-anchor="middle" font-size="11" fill="#6B7280">Retrains on signals</text>
  </g>

  <!-- Recommendations -->
  <g>
    <rect x="324" y="128" width="150" height="60" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="399" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Recommends Items</text>
    <text x="399" y="171" text-anchor="middle" font-size="11" fill="#6B7280">Recommendations change</text>
  </g>

  <!-- User interaction -->
  <g>
    <rect x="175" y="207" width="150" height="60" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="250" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Users Interact</text>
    <text x="250" y="250" text-anchor="middle" font-size="11" fill="#6B7280">User acts</text>
  </g>

  <!-- Data collection -->
  <g>
    <rect x="26" y="128" width="150" height="60" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="101" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Data Collected</text>
    <text x="101" y="171" text-anchor="middle" font-size="11" fill="#6B7280">Signals logged</text>
  </g>

  <!-- Bias amplification -->
  <g>
    <circle cx="250" cy="158" r="42" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="250" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#EF4444">BIAS</text>
    <text x="250" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">AMPLIFIES</text>
  </g>

  <!-- Explanation -->
  <g>
    <rect x="20" y="288" width="460" height="98" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="250" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Each cycle reinforces existing patterns</text>
    <text x="250" y="333" text-anchor="middle" font-size="11" fill="#6B7280">Popular items get more data → better predictions → more recommendations</text>
    <text x="250" y="352" text-anchor="middle" font-size="11" fill="#6B7280">New items get no data → poor predictions → never recommended</text>
    <text x="250" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">Breaking the loop requires deliberate exploration</text>
  </g>
</svg>