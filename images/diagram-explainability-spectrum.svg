<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 305" width="600" height="305" font-family="system-ui, sans-serif">
  <defs>
    <clipPath id="spectrumClip">
      <rect x="40" y="64" width="520" height="46" rx="23"/>
    </clipPath>
    <marker id="arrLeft" markerWidth="7" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="7,0 1,3 7,6" fill="#0EA5E9"/>
    </marker>
    <marker id="arrRight" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="598" height="303" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="300" y="25" text-anchor="middle" fill="#1E1B4B" font-size="14" font-weight="700">Explainability Spectrum</text>

  <!-- Accuracy versus interpretability -->
  <text x="105" y="46" text-anchor="middle" fill="#0EA5E9" font-size="11" font-weight="600">More accurate</text>
  <text x="300" y="46" text-anchor="middle" fill="#6B7280" font-size="11">Trade-off</text>
  <text x="495" y="46" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">More interpretable</text>
  <line x1="151" y1="54" x2="60" y2="54" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrLeft)"/>
  <line x1="449" y1="54" x2="540" y2="54" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrRight)"/>

  <!-- Main spectrum -->
  <g clip-path="url(#spectrumClip)">
    <rect x="40" y="64" width="174" height="46" fill="#1E1B4B"/>
    <rect x="214" y="64" width="172" height="46" fill="#EDE9FE"/>
    <rect x="386" y="64" width="174" height="46" fill="#D1FAE5"/>
  </g>
  <rect x="40" y="64" width="520" height="46" rx="23" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <line x1="214" y1="69" x2="214" y2="105" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2"/>
  <line x1="386" y1="69" x2="386" y2="105" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="2"/>

  <text x="130" y="83" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">Black Box</text>
  <text x="130" y="101" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.8" font-size="11">Opaque</text>

  <text x="300" y="83" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="700">Gray Box</text>
  <text x="300" y="101" text-anchor="middle" fill="#6B7280" font-size="11">Semi-transparent</text>

  <text x="470" y="83" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="700">Glass Box</text>
  <text x="470" y="101" text-anchor="middle" fill="#6B7280" font-size="11">Transparent</text>

  <!-- Black Box models -->
  <rect x="50" y="121" width="160" height="96" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="130" y="139" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="700">Deep Learning</text>

  <rect x="58" y="147" width="88" height="20" rx="5" fill="#EDE9FE"/>
  <text x="102" y="161" text-anchor="middle" fill="#1E1B4B" font-size="11">Transformers</text>
  <rect x="150" y="147" width="52" height="20" rx="5" fill="#EDE9FE"/>
  <text x="176" y="161" text-anchor="middle" fill="#1E1B4B" font-size="11">Ensembles</text>

  <rect x="58" y="171" width="66" height="20" rx="5" fill="#EDE9FE"/>
  <text x="91" y="185" text-anchor="middle" fill="#1E1B4B" font-size="11">Deep MF</text>
  <rect x="128" y="171" width="74" height="20" rx="5" fill="#EDE9FE"/>
  <text x="165" y="185" text-anchor="middle" fill="#1E1B4B" font-size="11">GNN models</text>

  <!-- Gray Box models -->
  <rect x="220" y="121" width="160" height="96" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="300" y="139" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="700">Post-hoc Explanations</text>

  <rect x="228" y="147" width="92" height="20" rx="5" fill="#E0F2FE"/>
  <text x="274" y="161" text-anchor="middle" fill="#1E1B4B" font-size="11">Attention wts</text>
  <rect x="324" y="147" width="48" height="20" rx="5" fill="#E0F2FE"/>
  <text x="348" y="161" text-anchor="middle" fill="#1E1B4B" font-size="11">SHAP</text>

  <rect x="228" y="171" width="94" height="20" rx="5" fill="#E0F2FE"/>
  <text x="275" y="185" text-anchor="middle" fill="#1E1B4B" font-size="11">Saliency maps</text>
  <rect x="326" y="171" width="46" height="20" rx="5" fill="#E0F2FE"/>
  <text x="349" y="185" text-anchor="middle" fill="#1E1B4B" font-size="11">LIME</text>

  <rect x="247" y="195" width="106" height="18" rx="5" fill="#E0F2FE"/>
  <text x="300" y="208" text-anchor="middle" fill="#1E1B4B" font-size="11">Counterfactual</text>

  <!-- Glass Box models -->
  <rect x="390" y="121" width="160" height="96" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="470" y="139" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="700">Inherently Interpretable</text>

  <rect x="398" y="147" width="88" height="20" rx="5" fill="#D1FAE5"/>
  <text x="442" y="161" text-anchor="middle" fill="#1E1B4B" font-size="11">Decision tree</text>
  <rect x="490" y="147" width="52" height="20" rx="5" fill="#D1FAE5"/>
  <text x="516" y="161" text-anchor="middle" fill="#1E1B4B" font-size="11">k-NN</text>

  <rect x="398" y="171" width="86" height="20" rx="5" fill="#D1FAE5"/>
  <text x="441" y="185" text-anchor="middle" fill="#1E1B4B" font-size="11">Rule-based</text>
  <rect x="488" y="171" width="54" height="20" rx="5" fill="#D1FAE5"/>
  <text x="515" y="185" text-anchor="middle" fill="#1E1B4B" font-size="11">Linear</text>

  <rect x="432" y="195" width="76" height="18" rx="5" fill="#D1FAE5"/>
  <text x="470" y="208" text-anchor="middle" fill="#1E1B4B" font-size="11">ItemKNN</text>

  <!-- DSA/GDPR requirement -->
  <rect x="40" y="229" width="520" height="62" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 3"/>

  <path d="M57 242 L57 266 Q57 275 70 279 Q83 275 83 266 L83 242 Q70 237 57 242 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="264" text-anchor="middle" fill="#D97706" font-size="14" font-weight="800">!</text>

  <text x="95" y="249" fill="#1E1B4B" font-size="11" font-weight="700">DSA / GDPR Requirement</text>

  <rect x="463" y="237" width="87" height="20" rx="10" fill="#FEF3C7"/>
  <text x="506.5" y="251" text-anchor="middle" fill="#D97706" font-size="11" font-weight="700">Art. 27 DSA</text>

  <text x="95" y="269" fill="#6B7280" font-size="11">EU Digital Services Act requires platforms to explain</text>
  <text x="95" y="284" fill="#6B7280" font-size="11">&quot;the main parameters&quot; of recommender systems.</text>
</svg>