<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb123-title pb123-desc">
<title id="pb123-title">Two ways to explain a recommendation: intrinsic and post-hoc</title>
<desc id="pb123-desc">Intrinsic methods use a transparent model, such as a linear scorer with weights for genre match 0.4, recency 0.3 and popularity 0.2, so the explanation is read directly from the model and is faithful by construction, but simple models miss complex taste. Post-hoc methods such as LIME, SHAP and counterfactuals probe a black-box deep model by tweaking inputs and watching the score, producing estimated contributions such as genre match about +0.3; they work on any model, but the explanation is an approximation.</desc>
<defs>
<marker id="pb123-ahg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#10B981"/></marker>
<marker id="pb123-aha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/></marker>
</defs>
<rect x=".5" y=".5" width="639" height="455" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Two ways to answer “why this item?”</text>

<!-- cards -->
<rect x="16" y="56" width="296" height="350" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="328" y="56" width="296" height="350" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="164" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">Intrinsic</text>
<text x="164" y="104" text-anchor="middle" font-size="14" fill="#4B5563">the model is the explanation</text>
<text x="476" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">Post-hoc</text>
<text x="476" y="104" text-anchor="middle" font-size="14" fill="#4B5563">explain a black box afterwards</text>

<!-- LEFT: glass box with readable weights -->
<rect x="36" y="120" width="256" height="116" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="164" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#4C1D95">transparent model (linear)</text>
<text x="52" y="168" font-size="14" fill="#1E1B4B">genre match</text>
<rect x="148" y="156" width="100" height="14" rx="3" fill="#7C3AED"/>
<text x="256" y="168" font-size="14" font-weight="600" fill="#1E1B4B">0.4</text>
<text x="52" y="194" font-size="14" fill="#1E1B4B">recency</text>
<rect x="148" y="182" width="75" height="14" rx="3" fill="#7C3AED"/>
<text x="231" y="194" font-size="14" font-weight="600" fill="#1E1B4B">0.3</text>
<text x="52" y="220" font-size="14" fill="#1E1B4B">popularity</text>
<rect x="148" y="208" width="50" height="14" rx="3" fill="#7C3AED"/>
<text x="206" y="220" font-size="14" font-weight="600" fill="#1E1B4B">0.2</text>

<line x1="64" y1="244" x2="64" y2="270" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb123-ahg)"/>
<text x="78" y="262" font-size="14" fill="#4B5563">read the weights directly</text>

<rect x="36" y="280" width="256" height="40" rx="20" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
<text x="164" y="305" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">“Because: genre match”</text>

<!-- RIGHT: black box probed from outside -->
<rect x="348" y="120" width="256" height="66" rx="10" fill="#1E1B4B"/>
<text x="476" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">deep model</text>
<text x="476" y="171" text-anchor="middle" font-size="14" fill="#C4B5FD">inside: not human-readable</text>

<line x1="376" y1="194" x2="376" y2="218" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#pb123-aha)"/>
<text x="390" y="211" font-size="14" fill="#4B5563">tweak inputs, watch the score</text>

<rect x="348" y="226" width="256" height="94" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="362" y="254" font-size="14" fill="#1E1B4B">genre match</text>
<rect x="458" y="242" width="81" height="14" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="547" y="254" font-size="14" font-weight="600" fill="#92400E">≈ +0.3</text>
<text x="362" y="280" font-size="14" fill="#1E1B4B">recency</text>
<rect x="458" y="268" width="54" height="14" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="520" y="280" font-size="14" font-weight="600" fill="#92400E">≈ +0.2</text>
<text x="362" y="306" font-size="14" fill="#1E1B4B">social signal</text>
<rect x="458" y="294" width="27" height="14" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="493" y="306" font-size="14" font-weight="600" fill="#92400E">≈ +0.1</text>

<!-- verdicts -->
<circle cx="45" cy="345" r="9" fill="#10B981"/>
<text x="45" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">+</text>
<text x="62" y="350" font-size="15" font-weight="600" fill="#065F46">faithful by construction</text>
<circle cx="45" cy="371" r="9" fill="#F59E0B"/>
<text x="45" y="376" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">−</text>
<text x="62" y="376" font-size="15" fill="#92400E">misses complex taste</text>
<text x="164" y="398" text-anchor="middle" font-size="14" fill="#6B7280">e.g. decision trees, rules, k-NN</text>

<circle cx="357" cy="345" r="9" fill="#10B981"/>
<text x="357" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">+</text>
<text x="374" y="350" font-size="15" font-weight="600" fill="#065F46">works on any model</text>
<circle cx="357" cy="371" r="9" fill="#F59E0B"/>
<text x="357" y="376" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">−</text>
<text x="374" y="376" font-size="15" fill="#92400E">only an approximation</text>
<text x="476" y="398" text-anchor="middle" font-size="14" fill="#6B7280">e.g. LIME, SHAP, counterfactuals</text>

<!-- takeaway -->
<text x="320" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B"><tspan fill="#065F46">Intrinsic:</tspan> the explanation is the model. <tspan fill="#92400E">Post-hoc:</tspan> an estimate of it.</text>
</svg>
