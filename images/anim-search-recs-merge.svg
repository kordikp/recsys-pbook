<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 492" role="img" aria-labelledby="pb029-title pb029-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb029-title">Search and recommendation: one engine, different inputs</title>
<desc id="pb029-desc">Search and recommendation run on the same retrieval engine: a query becomes an embedding e_q, the user's history becomes e_u, every item has an embedding e_i in one shared ANN index, and one scorer f(e_q, e_u, e_i) ranks the items. Search leans on the query and uses history to personalize, so for a coder the query "python" ranks a Python course first and snake care far down. A conversational request uses both inputs, and a recommendation feed sets the query to zero: a feed is a search with an empty query.</desc>
