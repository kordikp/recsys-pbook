@keyframes pb029-oq{0%,40%{opacity:1}43%,58%{opacity:.25}61%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.pb029-hs,.pb029-hc,.pb029-hf,.pb029-wq,.pb029-wu,.pb029-oq{animation:none !important}}
</style>
