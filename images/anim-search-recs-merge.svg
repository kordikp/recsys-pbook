<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .mergeL{animation:mL 5s ease-in-out infinite}
    .mergeR{animation:mR 5s ease-in-out infinite}
    @keyframes mL{0%,15%{transform:translate(0,0)}55%,85%{transform:translate(105px,0)}100%{transform:translate(0,0)}}
    @keyframes mR{0%,15%{transform:translate(0,0)}55%,85%{transform:translate(-105px,0)}100%{transform:translate(0,0)}}
    .core{animation:g 5s ease-in-out infinite}
    @keyframes g{0%,15%,100%{opacity:.55}55%,85%{opacity:1}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Search and Recommendations Are Converging</text>

  <g class="mergeL" text-anchor="middle">
    <rect x="80" y="110" width="230" height="180" rx="14" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2.5"/>
    <text x="195" y="142" font-size="16" font-weight="800" fill="#075985">SEARCH</text>
    <text x="195" y="168" font-size="12.5" fill="#075985">explicit intent: a query</text>
    <text x="195" y="190" font-size="12.5" fill="#075985">"running shoes 44"</text>
    <text x="195" y="222" font-size="12.5" fill="#6B7280">answers what you ASK</text>
    <text x="195" y="266" font-size="12" fill="#6B7280">retrieval → ranking</text>
  </g>
  <g class="mergeR" text-anchor="middle">
    <rect x="490" y="110" width="230" height="180" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="605" y="142" font-size="16" font-weight="800" fill="#4C1D95">RECOMMENDATIONS</text>
    <text x="605" y="168" font-size="12.5" fill="#4C1D95">implicit intent: behavior</text>
    <text x="605" y="190" font-size="12.5" fill="#4C1D95">clicks · dwell · history</text>
    <text x="605" y="222" font-size="12.5" fill="#6B7280">answers what you MEAN</text>
    <text x="605" y="266" font-size="12" fill="#6B7280">retrieval → ranking</text>
  </g>
  <g class="core" text-anchor="middle">
    <rect x="330" y="150" width="140" height="100" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="3"/>
    <text x="400" y="184" font-size="14" font-weight="800" fill="#065F46">ONE ENGINE</text>
    <text x="400" y="206" font-size="12" fill="#065F46">shared embeddings</text>
    <text x="400" y="224" font-size="12" fill="#065F46">personalized ranking</text>
  </g>
  <text x="400" y="330" text-anchor="middle" font-size="13.5" fill="#1E1B4B" font-weight="600">query + profile → the same candidate machinery</text>
  <text x="400" y="368" text-anchor="middle" font-size="13" fill="#6B7280">Personalized search IS recommendation with a query attached — the stacks merged years before the org charts did.</text>
</svg>
