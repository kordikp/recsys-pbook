<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .tok{animation:t 6s linear infinite;offset-path:path('M400 120 C610 120 610 320 400 320 C190 320 190 120 400 120');}
    @keyframes t{to{offset-distance:100%}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Recommendation as Reinforcement Learning</text>

  <path d="M400 120 C610 120 610 320 400 320 C190 320 190 120 400 120" fill="none" stroke="#E5E7EB" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle class="tok" r="7" fill="#7C3AED"/>

  <g text-anchor="middle" font-size="12.5">
    <rect x="315" y="86" width="170" height="62" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="400" y="112" font-size="15" font-weight="800" fill="#4C1D95">AGENT</text>
    <text x="400" y="132" fill="#4C1D95">the recommender π(a|s)</text>

    <rect x="580" y="185" width="165" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="662" y="209" font-weight="800" fill="#92400E">ACTION a</text>
    <text x="662" y="228" fill="#92400E">show this slate</text>
    <text x="662" y="245" fill="#6B7280">(pick from millions)</text>

    <rect x="315" y="288" width="170" height="62" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2.5"/>
    <text x="400" y="314" font-size="15" font-weight="800" fill="#075985">ENVIRONMENT</text>
    <text x="400" y="334" fill="#075985">the user reacts</text>

    <rect x="55" y="185" width="165" height="70" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="137" y="207" font-weight="800" fill="#065F46">STATE s′ · REWARD r</text>
    <text x="137" y="226" fill="#065F46">new context + signal</text>
    <text x="137" y="245" fill="#6B7280">watch? like? leave?</text>
  </g>

  <text x="400" y="226" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E1B4B">maximize Σ γᵗ rₜ</text>
  <text x="400" y="246" text-anchor="middle" font-size="12" fill="#6B7280">long-term value, not the next click</text>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">Myopic CTR chasing is a greedy policy — RL framing makes tomorrow's session part of today's objective.</text>
</svg>
