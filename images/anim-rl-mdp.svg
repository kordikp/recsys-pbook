<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="pb026-title pb026-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb026-title">A bandit sees one step; reinforcement learning sees the whole session</title>
  <desc id="pb026-desc">Toy music example. Two playlist policies for one listener over four steps. Greedy (top 3 favorites on repeat) earns rewards 5, 4, 2, 0 as the listener gets bored and leaves; Mixed (favorites plus new tracks) earns 4, 4, 5, 5. A bandit weighs only the immediate reward (gamma = 0) and picks Greedy, 5 against 4. Reinforcement learning weighs every step by gamma to the power t (gamma = 0.9) and picks Mixed, 15.3 against 10.2, because each recommendation changes the listener's next state. A bandit is reinforcement learning with gamma = 0.</desc>
  <defs>
    <marker id="pb026-ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#7C3AED"/></marker>
  </defs>
  <style>
    .pb026-hz{fill:#EDE9FE;animation:pb026-grow 10s ease-in-out infinite}
    @keyframes pb026-grow{0%,13%{clip-path:inset(0 76% 0 0 round 12px);fill:#FEF3C7}17%{fill:#EDE9FE}22%,25%{clip-path:inset(0 50.5% 0 0 round 12px)}31%,34%{clip-path:inset(0 25% 0 0 round 12px)}40%,100%{clip-path:inset(0 0% 0 0 round 12px);fill:#EDE9FE}}
    @media (prefers-reduced-motion: reduce){.pb026-hz{animation:none !important}}
  </style>
  <rect x=".5" y=".5" width="639" height="519" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#1E1B4B">A bandit sees one step. RL sees the whole session.</text>
  <text x="24" y="64" font-size="14" fill="#6B7280">Toy numbers · face = listener state <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">s</tspan>ₜ · arrow = recommendation <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">a</tspan>ₜ · +n = reward <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">r</tspan>ₜ</text>
  <rect class="pb026-hz" x="12" y="158" width="402" height="90" rx="12"/>
  <rect class="pb026-hz" x="12" y="280" width="402" height="90" rx="12"/>
  <text x="60" y="124" font-size="15" font-weight="700" text-anchor="middle" fill="#4B5563"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">t</tspan> = 0</text>
  <text x="162" y="124" font-size="15" font-weight="700" text-anchor="middle" fill="#4B5563"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">t</tspan> = 1</text>
  <text x="264" y="124" font-size="15" font-weight="700" text-anchor="middle" fill="#4B5563"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">t</tspan> = 2</text>
  <text x="366" y="124" font-size="15" font-weight="700" text-anchor="middle" fill="#4B5563"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">t</tspan> = 3</text>
  <text x="470" y="102" font-size="16" font-weight="700" text-anchor="middle" fill="#92400E">Bandit</text>
  <text x="470" y="124" font-size="15" text-anchor="middle" fill="#4B5563"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">r</tspan>₀ only</text>
  <text x="574" y="102" font-size="16" font-weight="700" text-anchor="middle" fill="#4C1D95">RL</text>
  <text x="574" y="124" font-size="15" text-anchor="middle" fill="#4B5563">Σ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">γ</tspan>ᵗ <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">r</tspan>ₜ</text>
