<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="650" height="350" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="648" height="348" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="325" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Offline vs. Online Evaluation</text>
  <text x="325" y="43" text-anchor="middle" font-size="11" fill="#6B7280">Two complementary paradigms for measuring recommender quality</text>

  <!-- Left Column: Offline Evaluation -->
  <rect x="20" y="58" width="295" height="210" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="167.5" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Offline Evaluation</text>

  <!-- Dataset split icon -->
  <g transform="translate(55,94)">
    <rect x="0" y="0" width="100" height="22" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
    <path d="M4 0H65V22H4A4 4 0 0 1 0 18V4A4 4 0 0 1 4 0Z" fill="#0EA5E9"/>
    <line x1="65" y1="0" x2="65" y2="22" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="32.5" y="15" text-anchor="middle" font-size="11" fill="#1E1B4B" font-weight="600">Train</text>
    <text x="82.5" y="15" text-anchor="middle" font-size="11" fill="#1E1B4B" font-weight="600">Test</text>
  </g>

  <!-- Offline metrics -->
  <text x="185" y="102" font-size="11" fill="#1E1B4B" font-weight="600">Metrics:</text>
  <g transform="translate(185,108)">
    <rect x="0" y="0" width="48" height="22" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="24" y="15" text-anchor="middle" font-size="11" fill="#1E1B4B" font-weight="600">nDCG</text>
    <rect x="54" y="0" width="48" height="22" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="78" y="15" text-anchor="middle" font-size="11" fill="#1E1B4B" font-weight="600">Recall</text>
  </g>

  <!-- Offline pros and cons -->
  <circle cx="42" cy="148" r="5" fill="#10B981"/>
  <text x="53" y="152" font-size="11" fill="#1E1B4B">Fast, Cheap, Reproducible</text>

  <circle cx="42" cy="171" r="5" fill="#EF4444"/>
  <text x="53" y="175" font-size="11" fill="#1E1B4B">Biased (MNAR), No real users</text>

  <!-- Offline process description -->
  <text x="167.5" y="202" text-anchor="middle" font-size="11" fill="#6B7280">Split historical data into train/test.</text>
  <text x="167.5" y="218" text-anchor="middle" font-size="11" fill="#6B7280">Train model, predict on held-out items,</text>
  <text x="167.5" y="234" text-anchor="middle" font-size="11" fill="#6B7280">compare predictions to ground truth.</text>

  <!-- Divider -->
  <line x1="325" y1="68" x2="325" y2="128" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="325" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">vs</text>
  <line x1="325" y1="152" x2="325" y2="258" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Right Column: Online Evaluation -->
  <rect x="335" y="58" width="295" height="210" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="482.5" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Online Evaluation (A/B Test)</text>

  <!-- User split icon -->
  <g transform="translate(370,92)">
    <rect x="0" y="0" width="40" height="24" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="20" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">A</text>

    <rect x="50" y="0" width="40" height="24" rx="5" fill="#D1FAE5" stroke="#10B981"/>
    <text x="70" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">B</text>

    <circle cx="12" cy="34" r="4" fill="#0EA5E9"/>
    <circle cx="28" cy="34" r="4" fill="#0EA5E9"/>
    <circle cx="62" cy="34" r="4" fill="#10B981"/>
    <circle cx="78" cy="34" r="4" fill="#10B981"/>
  </g>

  <!-- Online metrics -->
  <text x="490" y="102" font-size="11" fill="#1E1B4B" font-weight="600">Metrics:</text>
  <g transform="translate(490,108)">
    <rect x="0" y="0" width="42" height="22" rx="5" fill="#D1FAE5" stroke="#10B981"/>
    <text x="21" y="15" text-anchor="middle" font-size="11" fill="#1E1B4B" font-weight="600">CTR</text>
    <rect x="48" y="0" width="62" height="22" rx="5" fill="#D1FAE5" stroke="#10B981"/>
    <text x="79" y="15" text-anchor="middle" font-size="11" fill="#1E1B4B" font-weight="600">Revenue</text>
  </g>

  <!-- Online pros and cons -->
  <circle cx="357" cy="148" r="5" fill="#10B981"/>
  <text x="368" y="152" font-size="11" fill="#1E1B4B">Causal evidence, Real behavior</text>

  <circle cx="357" cy="171" r="5" fill="#EF4444"/>
  <text x="368" y="175" font-size="11" fill="#1E1B4B">Slow, Expensive, Risky</text>

  <!-- Online process description -->
  <text x="482.5" y="202" text-anchor="middle" font-size="11" fill="#6B7280">Randomly assign live users to control</text>
  <text x="482.5" y="218" text-anchor="middle" font-size="11" fill="#6B7280">vs. treatment. Measure real engagement</text>
  <text x="482.5" y="234" text-anchor="middle" font-size="11" fill="#6B7280">differences with statistical significance.</text>

  <!-- Evaluation Funnel -->
  <rect x="30" y="280" width="590" height="50" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="325" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">The Evaluation Funnel</text>

  <text x="68" y="320" text-anchor="middle" font-size="11" fill="#0EA5E9" font-weight="700">Offline</text>
  <text x="119" y="320" text-anchor="middle" font-size="12" fill="#6B7280">→</text>
  <text x="181" y="320" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="700">Counterfactual</text>
  <text x="246" y="320" text-anchor="middle" font-size="12" fill="#6B7280">→</text>
  <text x="308" y="320" text-anchor="middle" font-size="11" fill="#D97706" font-weight="700">Interleaving</text>
  <text x="367" y="320" text-anchor="middle" font-size="12" fill="#6B7280">→</text>
  <text x="416" y="320" text-anchor="middle" font-size="11" fill="#10B981" font-weight="700">A/B Test</text>
  <text x="466" y="320" text-anchor="middle" font-size="12" fill="#6B7280">→</text>
  <text x="552" y="320" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="700">Deploy</text>
</svg>