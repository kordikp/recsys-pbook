<text x="186" y="161" text-anchor="middle" font-size="24" font-weight="700" fill="#4C1D95">9</text>

<path d="M22,42 H174 Q186,42 186,54 V58 Q186,70 174,70 H47 L42,132 L33,70 H22 Q10,70 10,58 V54 Q10,42 22,42 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
