    <tspan x="278" dy="0">MANGO ↑</tspan>
    <tspan x="278" dy="19">TRENDING: 3 MIN</tspan>
  </text>
  <text x="278" y="370" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="middle">DING! CHANGE POINT</text>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">BMAB resets priors at change points; trends surface in minutes.</text>

  <!-- Panel 4 -->
  <circle cx="474" cy="448" r="10" fill="#7C3AED"/>
  <path d="M474 459 L474 504 M474 470 L526 477 M474 470 L454 484 M474 504 L461 528 M474 504 L487 528" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="708" cy="448" r="10" fill="#0EA5E9"/>
  <path d="M708 459 L708 504 M708 470 L662 483 M708 470 L727 484 M708 504 L695 528 M708 504 L721 528" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="590" y="356" width="175" height="52" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="677.5" y="377" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="677.5" dy="0">Put my regret</tspan>
    <tspan x="677.5" dy="17">on the receipt.</tspan>
  </text>
  <rect x="526" y="435" width="136" height="82" rx="6" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="594" y="458" font-size="12" fill="#6B7280" text-anchor="middle">
    <tspan x="594" dy="0">CUMULATIVE REGRET</tspan>
    <tspan x="594" dy="23" font-size="14" font-weight="700" fill="#1E1B4B">O(√(KT log T))</tspan>
  </text>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Regret remains near-optimal: O(√(KT log T)).</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Explore uncertainty or exploit winners; Thompson Sampling balances both by sampling beliefs.</text>
</svg>