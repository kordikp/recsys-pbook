<text x="320" y="626" text-anchor="middle" font-size="16" fill="#1E1B4B"><tspan font-weight="700" fill="#7C3AED">Thompson Sampling:</tspan> unsure options sometimes draw high, so they <tspan font-weight="700" fill="#92400E">get tried</tspan>.</text>
