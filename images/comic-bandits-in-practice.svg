<text x="188" y="97" text-anchor="middle" font-size="16" fill="#1E1B4B">Safe vanilla (<tspan font-weight="700">exploit</tspan>),</text>
<text x="188" y="117" text-anchor="middle" font-size="16" fill="#1E1B4B">or new mango (<tspan font-weight="700" fill="#92400E">explore</tspan>)?</text>

<text x="36" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">You</text>
<text x="240" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Recommender</text>
</g>

