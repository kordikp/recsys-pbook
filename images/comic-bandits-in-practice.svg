<circle cx="-9" cy="-80" r="2.2" fill="#1E1B4B" stroke="none"/><circle cx="3" cy="-80" r="2.2" fill="#1E1B4B" stroke="none"/>
<path d="M-8,-70 H0"/>
</g>

<!-- counter with two tubs -->
