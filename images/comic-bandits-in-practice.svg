  <text x="595" y="97" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="595" dy="0">I draw one guess</tspan>
    <tspan x="595" dy="17">from each jar.</tspan>
  </text>
  <path d="M525 184 H568 V232 H525 Z M536 198 A4 4 0 1 0 544 198 A4 4 0 1 0 536 198 M548 215 A4 4 0 1 0 556 215 A4 4 0 1 0 548 215 M590 184 H633 V232 H590 Z M600 207 A4 4 0 1 0 608 207 A4 4 0 1 0 600 207 M616 194 A4 4 0 1 0 624 194 A4 4 0 1 0 616 194" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="579" y="248" font-size="11.5" fill="#6B7280" text-anchor="middle">KNOWN　　 UNCERTAIN</text>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Thompson samples beliefs, so the balance tunes itself.</text>

  <!-- Panel 3 -->
  <circle cx="82" cy="443" r="10" fill="#7C3AED"/>
  <path d="M82 454 L82 499 M82 466 L107 480 M82 466 L62 481 M82 499 L69 523 M82 499 L95 523" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
