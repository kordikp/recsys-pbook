    <tspan x="296.5" dy="0">The usual...</tspan>
    <tspan x="296.5" dy="17">or something new?</tspan>
  </text>
  <path d="M132 205 Q151 234 170 205 Z" fill="#EDE9FE" stroke="#7C3AED"/>
  <path d="M187 205 Q206 234 225 205 Z" fill="#FEF3C7" stroke="#D97706"/>
  <text x="178" y="199" font-size="11.5" fill="#6B7280" text-anchor="middle">VANILLA　 MANGO?</text>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Exploit the favorite—or explore the uncertain special?</text>

  <!-- Panel 2 -->
  <circle cx="466" cy="157" r="10" fill="#7C3AED"/>
  <path d="M466 168 L466 213 M466 180 L493 197 M466 181 L447 196 M466 213 L452 237 M466 213 L480 237" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="735" cy="157" r="10" fill="#0EA5E9"/>
  <path d="M735 168 L735 213 M735 180 L716 195 M735 180 L752 195 M735 213 L722 237 M735 213 L748 237" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
