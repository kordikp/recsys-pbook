  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">Thompson's Scoop of the Draw</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <circle cx="92" cy="157" r="10" fill="#7C3AED"/>
  <path d="M92 168 L92 213 M92 178 L70 195 M92 178 L118 193 M92 213 L77 237 M92 213 L107 237" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="300" cy="157" r="10" fill="#0EA5E9"/>
