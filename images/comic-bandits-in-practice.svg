<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb041-title pb041-desc">
<title id="pb041-title">Thompson's Scoop of the Draw</title>
<desc id="pb041-desc">Four-panel comic. A guest asks an ice-cream recommender what is good. It can play safe with vanilla, sold 50 times (exploit), or risk the new mango, sold twice (explore). It keeps a jar of guesses from 0 to 10 for each flavour: vanilla's guesses agree (7 or 8), mango's, from only two scoops, are all over the place (2 to 10): fewer scoops, wilder guesses. For each guest it draws one guess from each jar and serves the highest: this time mango's 9 beats vanilla's 8, so mango gets a try. "You pick by lottery?" "A well-informed lottery." A month and 40 scoops later, mango's guesses agree at 8 or 9 and the guest asks for mango again. Thompson Sampling: unsure options sometimes draw high, so they get tried.</desc>
<defs>
<marker id="pb041-up" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#9CA3AF"/>
</marker>
<g id="pb041-guest">
<path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#10B981"/>
<circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
</g>
<g id="pb041-rec">
<path d="M-23,0 V-40 Q-23,-56 -7,-56 H7 Q23,-56 23,-40 V0 Z" fill="#7C3AED"/>
<rect x="5" y="-47" width="12" height="8" rx="2" fill="#FFFFFF"/>
<circle cx="0" cy="-77" r="17" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2"/>
</g>
</defs>

<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Thompson's Scoop of the Draw</text>

<!-- ===== Panel 1: the usual, or new? ===== -->
