<text x="180" y="228" text-anchor="middle" font-size="14" fill="#4B5563">2 scoops</text>

<!-- bubbles -->
<path d="M22,42 H156 Q168,42 168,54 V58 Q168,70 156,70 H45 L38,132 L31,70 H22 Q10,70 10,58 V54 Q10,42 22,42 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
