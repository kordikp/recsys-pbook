<path d="M136,76 H276 Q288,76 288,88 V92 Q288,104 276,104 H243 L252,136 L229,104 H136 Q124,104 124,92 V88 Q124,76 136,76 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
