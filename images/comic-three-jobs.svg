<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb102-title pb102-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb102-title">The bookseller with three job titles</title>
<desc id="pb102-desc">Four-panel comic: a bookseller does the three jobs of every recommender. 1 Discover: the reader only searches for authors they already know, so the bookseller hands over a book by one they don't. 2 Navigate: facing a wall of books, the reader asks where to start; the bookseller points to three picks. 3 Engage: a week later the reader loved the book and asks what's next; the sequel just came in. 4 Engage, too much: at 2 a.m., next to a pile of books, the bookseller offers one more and the reader says "I said one more, not move in." Engagement is good only while it still serves the reader.</desc>
<defs>
<pattern id="pb102-wall" x="0" y="18" width="64" height="80" patternUnits="userSpaceOnUse">
<rect x="0" y="6" width="8" height="30" fill="#E5E7EB"/><rect x="9" y="2" width="6" height="34" fill="#D1D5DB"/><rect x="16" y="9" width="10" height="27" fill="#E5E7EB"/><rect x="27" y="4" width="7" height="32" fill="#D1D5DB"/><rect x="35" y="7" width="9" height="29" fill="#E5E7EB"/><rect x="45" y="3" width="6" height="33" fill="#D1D5DB"/><rect x="52" y="6" width="11" height="30" fill="#E5E7EB"/><rect x="0" y="36" width="64" height="4" fill="#D1D5DB"/>
<rect x="0" y="45" width="10" height="31" fill="#D1D5DB"/><rect x="11" y="49" width="7" height="27" fill="#E5E7EB"/><rect x="19" y="43" width="6" height="33" fill="#D1D5DB"/><rect x="26" y="46" width="9" height="30" fill="#E5E7EB"/><rect x="36" y="42" width="8" height="34" fill="#D1D5DB"/><rect x="45" y="48" width="11" height="28" fill="#E5E7EB"/><rect x="57" y="45" width="6" height="31" fill="#D1D5DB"/><rect x="0" y="76" width="64" height="4" fill="#D1D5DB"/>
</pattern>
</defs>
