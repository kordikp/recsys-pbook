<text x="62" y="240" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">You</text>
<text x="222" y="240" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="middle">Bookseller</text>
</g>

