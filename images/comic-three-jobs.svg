<!-- takeaway -->
<text x="320" y="597" font-size="17" fill="#1E1B4B" text-anchor="middle">Same three jobs for every recommender: <tspan font-weight="700" fill="#7C3AED">discover</tspan>, <tspan font-weight="700" fill="#7C3AED">navigate</tspan>, <tspan font-weight="700" fill="#7C3AED">engage</tspan>.</text>
<text x="320" y="623" font-size="17" fill="#1E1B4B" text-anchor="middle">Engagement only counts while it <tspan font-weight="700" fill="#065F46">still serves the reader</tspan>.</text>
</svg>
