<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#1E1B4B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#10B981"/>
    </marker>
    <linearGradient id="noveltyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="598" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Intra-List Diversity -->
  <text x="80" y="27" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">Intra-List Diversity</text>

  <text x="42" y="45" text-anchor="middle" fill="#6B7280" font-size="11">Low ILD</text>
  <rect x="12" y="52" width="18" height="18" rx="3" fill="#10B981"/>
  <rect x="33" y="52" width="18" height="18" rx="3" fill="#10B981"/>
  <rect x="54" y="52" width="18" height="18" rx="3" fill="#10B981"/>
  <rect x="12" y="73" width="18" height="18" rx="3" fill="#10B981"/>
  <rect x="33" y="73" width="18" height="18" rx="3" fill="#10B981"/>
  <rect x="54" y="73" width="18" height="18" rx="3" fill="#10B981"/>
  <text x="42" y="106" text-anchor="middle" fill="#6B7280" font-size="11">All same genre</text>

  <text x="125" y="45" text-anchor="middle" fill="#6B7280" font-size="11">High ILD</text>
  <rect x="95" y="52" width="18" height="18" rx="3" fill="#7C3AED"/>
  <rect x="116" y="52" width="18" height="18" rx="3" fill="#10B981"/>
  <rect x="137" y="52" width="18" height="18" rx="3" fill="#D97706"/>
  <rect x="95" y="73" width="18" height="18" rx="3" fill="#0EA5E9"/>
  <rect x="116" y="73" width="18" height="18" rx="3" fill="#7C3AED"/>
  <rect x="137" y="73" width="18" height="18" rx="3" fill="#10B981"/>
  <text x="125" y="106" text-anchor="middle" fill="#6B7280" font-size="11">Mixed genres</text>

  <line x1="75" y1="72" x2="91" y2="72" stroke="#1E1B4B" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Coverage -->
  <text x="235" y="27" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">Coverage</text>

  <circle cx="235" cy="71" r="32" fill="#E5E7EB"/>
  <path d="M235,71 L235,39 A32,32 0 1,1 212.6,98.6 Z" fill="#10B981"/>
  <text x="224" y="70" fill="#FFFFFF" font-size="11" font-weight="700">68%</text>
  <text x="256" y="96" fill="#6B7280" font-size="11">32%</text>

  <rect x="190" y="113" width="9" height="9" rx="2" fill="#10B981"/>
  <text x="205" y="122" fill="#6B7280" font-size="11">Recommended</text>
  <rect x="190" y="128" width="9" height="9" rx="2" fill="#E5E7EB"/>
  <text x="205" y="137" fill="#6B7280" font-size="11">Never shown</text>

  <!-- Novelty -->
  <text x="400" y="27" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">Novelty</text>

  <line x1="330" y1="75" x2="470" y2="75" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="330" y="59" width="140" height="13" rx="4" fill="url(#noveltyGrad)"/>

  <circle cx="340" cy="65.5" r="4" fill="#D97706"/>
  <circle cx="351" cy="65.5" r="3.5" fill="#D97706"/>
  <circle cx="360" cy="65.5" r="3" fill="#D97706"/>
  <circle cx="382" cy="65.5" r="2.5" fill="#D97706"/>
  <circle cx="410" cy="65.5" r="2.5" fill="#10B981"/>
  <circle cx="436" cy="65.5" r="2.5" fill="#10B981"/>
  <circle cx="455" cy="65.5" r="2" fill="#10B981"/>

  <text x="330" y="95" fill="#6B7280" font-size="11">Most popular</text>
  <text x="470" y="95" text-anchor="end" fill="#6B7280" font-size="11">Least popular</text>

  <line x1="370" y1="108" x2="449" y2="108" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="410" y="124" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">More novel</text>

  <!-- Serendipity -->
  <text x="548" y="27" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">Serendipity</text>

  <circle cx="515" cy="78" r="26" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="551" cy="78" r="26" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>

  <text x="503" y="69" text-anchor="middle" fill="#0EA5E9" font-size="11" font-weight="600">Relevant</text>
  <text x="560" y="81" text-anchor="middle" fill="#D97706" font-size="11" font-weight="600">Unexpected</text>
  <text x="533" y="96" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="700">Serendipitous</text>

  <!-- Beyond-Accuracy Metrics -->
  <line x1="20" y1="148" x2="580" y2="148" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="300" y="169" text-anchor="middle" fill="#1E1B4B" font-size="13" font-weight="700">Beyond-Accuracy Metrics</text>

  <rect x="15" y="180" width="135" height="64" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="82.5" y="198" text-anchor="middle" fill="#7C3AED" font-size="11" font-weight="700">ILD</text>
  <text x="82.5" y="215" text-anchor="middle" fill="#1E1B4B" font-size="11">Avg pairwise distance</text>
  <text x="82.5" y="231" text-anchor="middle" fill="#6B7280" font-size="11">in a recommendation list</text>

  <rect x="162" y="180" width="135" height="64" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="229.5" y="198" text-anchor="middle" fill="#7C3AED" font-size="11" font-weight="700">Coverage</text>
  <text x="229.5" y="215" text-anchor="middle" fill="#1E1B4B" font-size="11">|Recommended items|</text>
  <text x="229.5" y="231" text-anchor="middle" fill="#6B7280" font-size="11">/ |All catalog items|</text>

  <rect x="309" y="180" width="135" height="64" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="376.5" y="198" text-anchor="middle" fill="#7C3AED" font-size="11" font-weight="700">Novelty</text>
  <text x="376.5" y="215" text-anchor="middle" fill="#1E1B4B" font-size="11">-log2(popularity)</text>
  <text x="376.5" y="231" text-anchor="middle" fill="#6B7280" font-size="11">Self-information score</text>

  <rect x="456" y="180" width="135" height="64" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="523.5" y="198" text-anchor="middle" fill="#7C3AED" font-size="11" font-weight="700">Serendipity</text>
  <text x="523.5" y="215" text-anchor="middle" fill="#1E1B4B" font-size="11">Relevant + Unexpected</text>
  <text x="523.5" y="231" text-anchor="middle" fill="#6B7280" font-size="11">minus obvious picks</text>

  <circle cx="156" cy="212" r="2.5" fill="#E5E7EB"/>
  <circle cx="303" cy="212" r="2.5" fill="#E5E7EB"/>
  <circle cx="450" cy="212" r="2.5" fill="#E5E7EB"/>

  <text x="300" y="267" text-anchor="middle" fill="#6B7280" font-size="11">Optimizing only for accuracy creates filter bubbles.</text>
  <text x="300" y="283" text-anchor="middle" fill="#6B7280" font-size="11">These metrics measure recommendation quality holistically.</text>
</svg>