<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" role="img" aria-labelledby="pb119-title pb119-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb119-title">A diverse list can still be a narrow system</title>
<desc id="pb119-desc">Toy example: every user gets the same list of four different items from a 20-item catalog. Intra-list diversity is high because it looks at one list, but coverage is 4 of 20, novelty is low because all four are the most popular items, and serendipity is near zero because a popularity baseline would pick them too. ILD checks one list; coverage, novelty and serendipity check the whole system.</desc>
