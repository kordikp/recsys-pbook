<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The House Special Comes With Receipts</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="136" y="78" width="230" height="55" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="251" y="100" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="251" dy="0">Mushroom bowl—because</tspan>
    <tspan x="251" dy="17">you loved the risotto.</tspan>
  </text>
  <circle cx="100" cy="172" r="10" fill="#10B981"/>
  <path d="M100 183 L100 220 M100 194 L77 207 M100 194 L124 207 M100 220 L87 241 M100 220 L113 241" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="300" cy="172" r="10" fill="#7C3AED"/>
  <path d="M300 183 L300 220 M300 194 L278 207 M300 194 L322 207 M300 220 L287 241 M300 220 L313 241" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
