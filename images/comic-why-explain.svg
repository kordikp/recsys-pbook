<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb107-title pb107-desc">
<title id="pb107-title">The House Special Comes With Receipts</title>
<desc id="pb107-desc">Four-panel comic. A waiter, the recommender, suggests the mushroom bowl "because you loved the risotto", and the diner trusts it and orders. In the kitchen, the chef reads the same reasons in a log and spots a nonsense one, ice cream because of fish soup, so a bug gets caught. A food inspector says the law asks for meaningful reasons, and the waiter hands over every receipt. One explanation serves three readers: users trust it, developers debug with it, regulators audit it.</desc>
