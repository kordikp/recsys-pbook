  <path d="M326 477 L326 508 M326 487 L306 499 M326 487 L346 499 M326 508 L314 527 M326 508 L338 527" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="156" y="450" width="90" height="65" rx="6" fill="#FFFFFF" stroke="#D97706"/>
  <text x="201" y="475" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">
    <tspan x="201" dy="0">REASON</tspan>
    <tspan x="201" dy="17">LOG</tspan>
  </text>
  <path d="M38 526 L370 526" fill="none" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The inspector audits the trail before mystery becomes policy.</text>

  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="440" y="358" width="220" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="550" y="381" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="550" dy="0">I’ll have the one</tspan>
    <tspan x="550" dy="17">with the paper trail.</tspan>
  </text>
  <circle cx="475" cy="462" r="10" fill="#7C3AED"/>
  <path d="M475 473 L475 510 M475 484 L454 498 M475 484 L496 498 M475 510 L463 528 M475 510 L487 528" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="600" cy="462" r="10" fill="#0EA5E9"/>
  <path d="M600 473 L600 510 M600 484 L579 498 M600 484 L621 498 M600 510 L588 528 M600 510 L612 528" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="720" cy="462" r="10" fill="#D97706"/>
  <path d="M720 473 L720 510 M720 484 L699 498 M720 484 L741 498 M720 510 L708 528 M720 510 L732 528" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M445 536 L470 530 L495 536 L520 530 L545 536 L570 530 L595 536 L620 530 L645 536 L670 530 L695 536 L720 530 L747 536 L747 554 L720 548 L695 554 L670 548 L645 554 L620 548 L595 554 L570 548 L545 554 L520 548 L495 554 L470 548 L445 554 Z" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">One paper trail satisfies three very different appetites.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Explainability helps users trust, developers debug, and regulators audit recommendation systems.</text>
</svg>