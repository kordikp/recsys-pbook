  <path d="M205 219 L221 207" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M45 245 L363 245" fill="none" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">The diner sees the reason, trusts the pick, and orders.</text>

  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="515" y="75" width="245" height="55" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="637.5" y="97" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="637.5" dy="0">The reason changed:</tspan>
    <tspan x="637.5" dy="17">“dish” became “fish.”</tspan>
  </text>
  <circle cx="460" cy="180" r="10" fill="#10B981"/>
  <path d="M460 191 L460 224 M460 201 L440 213 M460 201 L480 213 M460 224 L448 243 M460 224 L472 243" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="700" cy="180" r="10" fill="#0EA5E9"/>
  <path d="M700 191 L700 224 M700 201 L680 213 M700 201 L720 213 M700 224 L688 243 M700 224 L712 243" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="543" y="154" width="96" height="57" rx="6" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="591" y="174" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">
    <tspan x="591" dy="0">ORDER LOG</tspan>
    <tspan x="591" dy="20" font-size="13" fill="#EF4444">dish → fish</tspan>
  </text>
  <path d="M430 246 L762 246" fill="none" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">The chef catches a quiet drift before dinner does.</text>

  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="101" y="358" width="260" height="58" rx="9" fill="#FEF3C7" stroke="#D97706"/>
  <text x="231" y="381" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="231" dy="0">Meaningful reasons, please.</tspan>
    <tspan x="231" dy="17">Article 22 and the DSA.</tspan>
  </text>
  <circle cx="72" cy="466" r="10" fill="#10B981"/>
  <path d="M72 477 L72 508 M72 487 L52 499 M72 487 L92 499 M72 508 L60 527 M72 508 L84 527" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
