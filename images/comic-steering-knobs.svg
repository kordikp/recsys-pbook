<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 652" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb101-title pb101-desc">
<title id="pb101-title">The algorithm finally hands over the remote</title>
<desc id="pb101-desc">Four-panel comic. 1: The recommender untangles a viewer's tangled taste with a sparse autoencoder into separate knobs (romance, Kurosawa, gloom), found in viewing habits rather than labels. 2: A viewer says it is date night; turning the romance knob up moves a rom-com from third to first in their list. 3: An editor turns the Kurosawa knob up for Kurosawa week, and a Kurosawa film lands at a different spot in each viewer's own list. 4: A viewer stuck on nine gloomy films turns the gloom knob down; comedy and a road trip move up while rain stays lower down, a gentle way out. Takeaway: each knob is one taste found in viewing habits; turn it and the list follows.</desc>
