<text x="320" y="586" font-size="17" fill="#1E1B4B" text-anchor="middle">Your feed is the belt: <tspan font-weight="700" fill="#7C3AED">an algorithm</tspan> loads it, not people.</text>
<text x="320" y="612" font-size="17" fill="#1E1B4B" text-anchor="middle">It counts <tspan font-weight="700" fill="#92400E">plates taken</tspan> (engagement), not <tspan font-weight="700" fill="#065F46">how you feel</tspan>.</text>
