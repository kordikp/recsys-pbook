<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" role="img" aria-labelledby="pb106-title pb106-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb106-title">Today’s Special: Whatever Keeps You Here</title>
<desc id="pb106-desc">Four-panel comic at a conveyor-belt restaurant. A diner finds the belt full of dishes she never ordered. The waiter says neither he nor the chef picks them: a machine loads the belt. The machine, the algorithm, sees she grabs cake fastest and sends more cake while its screen counts plates taken: 4. At the end she sits by a stack of 12 plates feeling sick, saying she came for a balanced dinner, while the machine celebrates a record and calls it the best dinner ever. Your feed works like the belt: an algorithm decides what comes by, and it counts engagement, not how you feel.</desc>
<rect x=".5" y=".5" width="639" height="633" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
