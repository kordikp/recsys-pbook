<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">Today’s Special: Whatever Keeps You Here</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <g>
    <rect x="35" y="76" width="184" height="42" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="127" y="102" font-size="12.5" fill="#1E1B4B" text-anchor="middle">I’ll decide what looks good.</text>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="104" cy="151" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M104 162 L104 199 M104 173 L85 187 M104 173 L125 184 M104 199 L91 217 M104 199 L117 217"/>
  </g>
  <g>
    <rect x="273" y="102" width="78" height="88" rx="8" fill="#E0F2FE" stroke="#0EA5E9"/>
    <rect x="283" y="113" width="58" height="38" rx="5" fill="#FFFFFF" stroke="#0EA5E9"/>
    <text x="312" y="129" font-size="11" font-weight="700" fill="#1E1B4B" text-anchor="middle">AUTO-SERVE</text>
    <text x="312" y="144" font-size="10.5" fill="#10B981" text-anchor="middle">READY</text>
    <circle cx="312" cy="170" r="7" fill="#10B981"/>
  </g>
  <g>
    <path d="M42 221 H366" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    <path d="M55 235 H352" stroke="#E5E7EB" stroke-width="7" stroke-linecap="round"/>
    <circle cx="71" cy="221" r="15" fill="#D1FAE5" stroke="#10B981"/>
    <rect x="168" y="207" width="30" height="14" rx="5" fill="#FEF3C7" stroke="#D97706"/>
    <circle cx="259" cy="221" r="15" fill="#FEE2E2" stroke="#EF4444"/>
  </g>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Mara sits down; the conveyor has already chosen the menu.</text>

  <!-- Panel 2 -->
  <g>
    <rect x="425" y="77" width="82" height="39" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="466" y="102" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Again?</text>
  </g>
  <g>
    <rect x="540" y="76" width="210" height="42" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="645" y="102" font-size="12.5" fill="#1E1B4B" text-anchor="middle">You took the first one.</text>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="476" cy="151" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M476 162 L476 199 M476 174 L458 185 M476 174 L496 180 M476 199 L464 217 M476 199 L488 217"/>
  </g>
  <g>
    <rect x="676" y="130" width="72" height="61" rx="8" fill="#E0F2FE" stroke="#0EA5E9"/>
    <rect x="686" y="141" width="52" height="25" rx="5" fill="#FFFFFF" stroke="#0EA5E9"/>
    <text x="712" y="158" font-size="10.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">MORE</text>
    <circle cx="712" cy="178" r="6" fill="#10B981"/>
  </g>
  <g>
    <path d="M432 221 H760" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    <path d="M445 235 H747" stroke="#E5E7EB" stroke-width="7" stroke-linecap="round"/>
    <circle cx="545" cy="221" r="15" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="606" cy="221" r="15" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="665" cy="221" r="15" fill="#FEE2E2" stroke="#EF4444"/>
  </g>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">The belt optimizes for plates taken, not dinners enjoyed.</text>

  <!-- Panel 3 -->
  <g>
    <rect x="35" y="356" width="159" height="42" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="114.5" y="382" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Who picked all this?</text>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="105" cy="431" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M105 442 L105 478 M105 453 L86 442 M105 453 L125 442 M105 478 L93 497 M105 478 L117 497"/>
  </g>
  <g>
    <rect x="225" y="365" width="133" height="105" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
    <rect x="239" y="378" width="105" height="59" rx="6" fill="#FFFFFF" stroke="#0EA5E9"/>
    <text x="291.5" y="397" font-size="11.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">AUTO-RANKED</text>
    <text x="291.5" y="417" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="middle">BILLIONS</text>
    <text x="291.5" y="431" font-size="10.5" fill="#6B7280" text-anchor="middle">OF TABLES DAILY</text>
    <circle cx="291.5" cy="452" r="7" fill="#10B981"/>
  </g>
  <g>
    <path d="M40 512 H362" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    <circle cx="177" cy="512" r="14" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="225" cy="512" r="14" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="273" cy="512" r="14" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="321" cy="512" r="14" fill="#FEE2E2" stroke="#EF4444"/>
  </g>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The automatic host plates billions of tables without a chef.</text>

  <!-- Panel 4 -->
  <g>
    <rect x="426" y="356" width="188" height="42" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="520" y="382" font-size="12.5" fill="#1E1B4B" text-anchor="middle">I wanted a balanced meal.</text>
  </g>
  <g>
    <rect x="628" y="356" width="137" height="42" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="696.5" y="382" font-size="12.5" fill="#1E1B4B" text-anchor="middle">You kept reaching.</text>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="485" cy="439" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M485 450 L477 486 M480 461 L458 474 M480 462 L506 477 M477 486 L462 501 M477 486 L489 504"/>
  </g>
  <g>
    <rect x="672" y="425" width="76" height="75" rx="8" fill="#E0F2FE" stroke="#0EA5E9"/>
    <rect x="681" y="436" width="58" height="39" rx="5" fill="#FFFFFF" stroke="#0EA5E9"/>
    <text x="710" y="451" font-size="10" font-weight="700" fill="#1E1B4B" text-anchor="middle">PLATES</text>
    <text x="710" y="466" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">TAKEN ↑</text>
    <circle cx="710" cy="487" r="6" fill="#10B981"/>
  </g>
  <g>
    <path d="M432 516 H758" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    <circle cx="545" cy="516" r="17" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="576" cy="516" r="17" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="607" cy="516" r="17" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="560" cy="488" r="17" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="592" cy="488" r="17" fill="#FEE2E2" stroke="#EF4444"/>
  </g>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The belt records another highly engaging meal.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">On recommendation platforms, algorithms choose what you see—often for engagement, not well-being.</text>
</svg>