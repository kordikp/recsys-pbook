<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" role="img" aria-labelledby="pb002-title pb002-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb002-title">What a benchmark log can't see</title>
<desc id="pb002-desc">A typical benchmark log only records reactions to what the old recommender chose to show, so its blank cells are unknowns, not dislikes. KuaiRand adds a few randomly shown slots that uncover some hidden likes; KuaiRec shows every item to every user, but only for a small block.</desc>
<style>
.pb002-a1{animation:pb002-k1 10s ease-out infinite}
.pb002-a2{animation:pb002-k2 10s ease-out infinite}
.pb002-a3{animation:pb002-k3 10s ease-out infinite}
@keyframes pb002-k1{0%,4%{opacity:0}12%,95%{opacity:1}100%{opacity:0}}
@keyframes pb002-k2{0%,20%{opacity:0}28%,95%{opacity:1}100%{opacity:0}}
@keyframes pb002-k3{0%,34%{opacity:0}42%,95%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.pb002-a1,.pb002-a2,.pb002-a3{animation:none !important}}
</style>
