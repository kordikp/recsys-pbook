<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .b1{animation:bb 5s ease-in-out infinite}
    .b2{animation:bb 5s ease-in-out infinite;animation-delay:.3s}
    .b3{animation:bb 5s ease-in-out infinite;animation-delay:.6s}
    .b4{animation:bb 5s ease-in-out infinite;animation-delay:.9s}
    @keyframes bb{0%,10%{transform:scaleY(.25)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(.25)}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">The Benchmarks Everyone Reports On</text>

  <g stroke="#9CA3AF" stroke-width="1.5"><line x1="90" y1="300" x2="740" y2="300"/></g>
  <g text-anchor="middle">
    <rect class="b1" x="120" y="140" width="90" height="160" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" style="transform-origin:165px 300px"/>
    <text x="165" y="326" font-size="13.5" font-weight="700" fill="#4C1D95">MovieLens</text>
    <text x="165" y="344" font-size="11.5" fill="#6B7280">25M ratings · movies</text>
    <text x="165" y="128" font-size="12" fill="#4C1D95">the classic — everyone starts here</text>

    <rect class="b2" x="280" y="170" width="90" height="130" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2" style="transform-origin:325px 300px"/>
    <text x="325" y="326" font-size="13.5" font-weight="700" fill="#065F46">Amazon Reviews</text>
    <text x="325" y="344" font-size="11.5" fill="#6B7280">233M · e-commerce</text>
    <text x="325" y="158" font-size="12" fill="#065F46">rich text + sparse users</text>

    <rect class="b3" x="440" y="190" width="90" height="110" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" style="transform-origin:485px 300px"/>
    <text x="485" y="326" font-size="13.5" font-weight="700" fill="#92400E">Yelp</text>
    <text x="485" y="344" font-size="11.5" fill="#6B7280">local businesses</text>
    <text x="485" y="178" font-size="12" fill="#92400E">geo + social edges</text>

    <rect class="b4" x="600" y="120" width="90" height="180" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2" style="transform-origin:645px 300px"/>
    <text x="645" y="326" font-size="13.5" font-weight="700" fill="#075985">KuaiRand</text>
    <text x="645" y="344" font-size="11.5" fill="#6B7280">video · RANDOM slots</text>
    <text x="645" y="108" font-size="12" fill="#075985">unbiased gold: randomized exposure</text>
  </g>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">Offline wins on MovieLens don't guarantee production wins — check the dataset's bias story before trusting a paper.</text>
</svg>
