<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb042-title pb042-desc">
  <title id="pb042-title">The explore–exploit restaurant</title>
  <desc id="pb042-desc">New city, 20 restaurants, 3 tried, one great (Luigi's). Always exploiting means great dinners but 17 places never tried; always exploring means knowing all 20 but many worse dinners. Thompson Sampling keeps a belief per place: Luigi's, liked 9 of 10 visits, has a narrow Beta(10, 2) curve; an untried place has a flat Beta(1, 1). Each night it draws one guess from each belief and goes with the highest. Tonight the untried place drew 0.94 against Luigi's 0.78, so it gets tried, and its belief updates with the result. The favourite wins most nights; wide uncertainty earns new places a try.</desc>
