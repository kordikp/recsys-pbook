<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .spiral{animation:sp 6s ease-in-out infinite}
    @keyframes sp{0%,25%{opacity:1}55%,85%{opacity:.4}100%{opacity:1}}
    .exit{animation:ex 6s ease-in-out infinite}
    @keyframes ex{0%,25%{opacity:.35}55%,85%{opacity:1}100%{opacity:.35}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Rabbit Hole Detected — Exit via Neighbors, Not Whiplash</text>

  <!-- spiral of same topic -->
  <g class="spiral">
    <path d="M200 230 m0 -95 a95 95 0 1 1 -1 0 M200 230 m0 -65 a65 65 0 1 1 -1 0 M200 230 m0 -38 a38 38 0 1 1 -1 0" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5 5"/>
    <g font-size="12" text-anchor="middle" fill="#B91C1C">
      <text x="200" y="122">true crime</text><text x="290" y="215">true crime</text>
      <text x="200" y="285">true crime</text><text x="122" y="215">true crime</text>
      <text x="200" y="222" font-size="16">😵‍💫</text>
    </g>
  </g>
  <text x="200" y="360" text-anchor="middle" font-size="12.5" fill="#B91C1C">5 same-topic sessions in a row → diversity guard fires</text>

  <!-- adjacent stepping stones -->
  <g class="exit">
    <path d="M310 230 C380 200 420 190 470 175 C540 155 600 140 660 120" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="8 6"/>
    <g text-anchor="middle" font-size="12">
      <rect x="380" y="170" width="120" height="44" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
      <text x="440" y="188" font-weight="700" fill="#92400E">investigative</text><text x="440" y="204" fill="#92400E">journalism</text>
      <rect x="520" y="128" width="110" height="44" rx="9" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
      <text x="575" y="146" font-weight="700" fill="#075985">psychology</text><text x="575" y="162" fill="#075985">of memory</text>
      <rect x="648" y="84" width="110" height="44" rx="9" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <text x="703" y="102" font-weight="700" fill="#065F46">history</text><text x="703" y="118" fill="#065F46">documentary</text>
    </g>
  </g>
  <text x="560" y="252" text-anchor="middle" font-size="12.5" fill="#065F46">adjacent concepts keep the thread — the loop opens</text>

  <text x="400" y="398" text-anchor="middle" font-size="13" fill="#6B7280">Jumping to random content feels like an ad; stepping through neighboring interests feels like curiosity.</text>
</svg>
