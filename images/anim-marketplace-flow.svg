<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .flowr{stroke-dasharray:7 6;animation:fr 1.4s linear infinite}
    @keyframes fr{to{stroke-dashoffset:-13}}
    .flowl{stroke-dasharray:7 6;animation:fl 1.4s linear infinite}
    @keyframes fl{to{stroke-dashoffset:13}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Marketplace Recommendations Serve Two Sides</text>

  <g text-anchor="middle">
    <rect x="55" y="110" width="180" height="200" rx="12" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="145" y="140" font-size="16" font-weight="800" fill="#075985">BUYERS</text>
    <text x="145" y="168" font-size="12.5" fill="#075985">want: relevant finds,</text>
    <text x="145" y="186" font-size="12.5" fill="#075985">fair prices, trust</text>
    <text x="145" y="226" font-size="26">🧑‍🤝‍🧑</text>
    <text x="145" y="272" font-size="12" fill="#6B7280">signals: views, saves,</text>
    <text x="145" y="290" font-size="12" fill="#6B7280">messages, purchases</text>

    <rect x="310" y="130" width="180" height="160" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="400" y="162" font-size="16" font-weight="800" fill="#4C1D95">MATCHING</text>
    <text x="400" y="188" font-size="12.5" fill="#4C1D95">every item is unique —</text>
    <text x="400" y="206" font-size="12.5" fill="#4C1D95">sold once, then gone</text>
    <text x="400" y="236" font-size="12.5" fill="#4C1D95">recommend the LISTING</text>
    <text x="400" y="254" font-size="12.5" fill="#4C1D95">while it still exists</text>

    <rect x="565" y="110" width="180" height="200" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="655" y="140" font-size="16" font-weight="800" fill="#065F46">SELLERS</text>
    <text x="655" y="168" font-size="12.5" fill="#065F46">want: visibility,</text>
    <text x="655" y="186" font-size="12.5" fill="#065F46">quick sale, repeat use</text>
    <text x="655" y="226" font-size="26">🏪</text>
    <text x="655" y="272" font-size="12" fill="#6B7280">exposure must spread —</text>
    <text x="655" y="290" font-size="12" fill="#6B7280">not pile on one listing</text>
  </g>
  <line class="flowr" x1="238" y1="185" x2="308" y2="185" stroke="#0EA5E9" stroke-width="2.5"/>
  <line class="flowl" x1="492" y1="185" x2="562" y2="185" stroke="#10B981" stroke-width="2.5"/>
  <line class="flowl" x1="238" y1="240" x2="308" y2="240" stroke="#0EA5E9" stroke-width="2.5"/>
  <line class="flowr" x1="492" y1="240" x2="562" y2="240" stroke="#10B981" stroke-width="2.5"/>

  <text x="400" y="355" text-anchor="middle" font-size="13" fill="#6B7280">Optimizing one side only breaks the other: buyers flooded with stale hits, sellers starved of exposure.</text>
  <text x="400" y="378" text-anchor="middle" font-size="13" fill="#6B7280">Two-sided objectives + freshness-aware ranking keep the flywheel spinning.</text>
</svg>
