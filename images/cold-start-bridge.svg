<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui,sans-serif">
  <!-- Item cold start: three stages, left to right. Minimal palette:
       amber = the new item, purple = the system, green = behavioral signal. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Stage panels -->
  <rect x="16" y="36" width="184" height="228" rx="12" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="228" y="36" width="184" height="228" rx="12" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="440" y="36" width="184" height="228" rx="12" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="108" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1 · New item arrives</text>
  <text x="320" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">2 · Content bridges the gap</text>
  <text x="532" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">3 · Behavior takes over</text>

  <!-- Stage 1: the new item, zero interactions -->
  <circle cx="108" cy="110" r="34" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="108" y="117" text-anchor="middle" font-size="22" fill="#D97706">?</text>
  <text x="108" y="168" text-anchor="middle" font-size="11" fill="#6B7280">0 interactions</text>
  <text x="108" y="186" text-anchor="middle" font-size="11" fill="#6B7280">no co-clicks, no ratings</text>
  <text x="108" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">collaborative filtering: blind</text>

  <!-- Stage 2: metadata places it among known items -->
  <rect x="252" y="66" width="62" height="20" rx="10" fill="#EDE9FE"/>
  <text x="283" y="80" text-anchor="middle" font-size="10" fill="#7C3AED">title</text>
  <rect x="322" y="66" width="62" height="20" rx="10" fill="#EDE9FE"/>
  <text x="353" y="80" text-anchor="middle" font-size="10" fill="#7C3AED">tags</text>
  <rect x="287" y="92" width="62" height="20" rx="10" fill="#EDE9FE"/>
  <text x="318" y="106" text-anchor="middle" font-size="10" fill="#7C3AED">description</text>

  <!-- embedding neighborhood: known items (gray), new item (amber) placed near neighbors -->
  <circle cx="268" cy="176" r="9" fill="#E5E7EB"/>
  <circle cx="296" cy="152" r="9" fill="#E5E7EB"/>
  <circle cx="304" cy="196" r="9" fill="#E5E7EB"/>
  <circle cx="368" cy="150" r="9" fill="#E5E7EB"/>
  <circle cx="384" cy="192" r="9" fill="#E5E7EB"/>
  <circle cx="330" cy="172" r="11" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <line x1="330" y1="172" x2="296" y2="152" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="330" y1="172" x2="304" y2="196" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="330" y1="172" x2="368" y2="150" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="236" text-anchor="middle" font-size="11" fill="#6B7280">"similar by what it IS,</text>
  <text x="320" y="251" text-anchor="middle" font-size="11" fill="#6B7280">not by who clicked it"</text>

  <!-- Stage 3: exploration buys the first real signals -->
  <circle cx="482" cy="96" r="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="532" cy="96" r="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="582" cy="96" r="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="482" y="101" text-anchor="middle" font-size="11" fill="#7C3AED">u1</text>
  <text x="532" y="101" text-anchor="middle" font-size="11" fill="#7C3AED">u2</text>
  <text x="582" y="101" text-anchor="middle" font-size="11" fill="#7C3AED">u3</text>

  <circle cx="532" cy="176" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <line x1="489" y1="108" x2="519" y2="158" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="532" y1="112" x2="532" y2="150" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="562" y="150" font-size="13" fill="#10B981">❤</text>
  <text x="578" y="176" font-size="13" fill="#10B981">▶</text>
  <text x="532" y="228" text-anchor="middle" font-size="11" fill="#6B7280">small exploration budget →</text>
  <text x="532" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#10B981">first interactions → CF wakes up</text>

  <!-- flow arrows between stages -->
  <line x1="204" y1="150" x2="224" y2="150" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="416" y1="150" x2="436" y2="150" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arr)"/>

  <text x="320" y="288" text-anchor="middle" font-size="10" fill="#9CA3AF">item cold start · content similarity + exploration bridge the first days</text>
</svg>
