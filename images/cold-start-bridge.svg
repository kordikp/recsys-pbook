<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb034-title pb034-desc">
  <title id="pb034-title">Item cold start in three panels: blind, bridged, learning</title>
  <desc id="pb034-desc">A brand-new item has no clicks, so the recommender cannot match it to anyone; its tags place it next to similar items A and B, and a small trial shown to fans of A and B brings the first likes, after which behavior takes over.</desc>
  <style>
    .pb034-anim { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .pb034-imp1 { animation-name: pb034-imp1; }
    .pb034-up1 { animation-name: pb034-up1; }
    .pb034-imp2 { animation-name: pb034-imp2; }
    .pb034-up2 { animation-name: pb034-up2; }
    @keyframes pb034-imp1 { 0%, 5% { opacity: 0 } 9%, 100% { opacity: 1 } }
    @keyframes pb034-up1 { 0%, 14% { opacity: 0 } 18%, 100% { opacity: 1 } }
    @keyframes pb034-imp2 { 0%, 23% { opacity: 0 } 27%, 100% { opacity: 1 } }
    @keyframes pb034-up2 { 0%, 32% { opacity: 0 } 36%, 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .pb034-anim { animation: none !important; } }
  </style>
  <defs>
    <marker id="pb034-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="331" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <!-- ===== Panel 1: blind ===== -->
  <g transform="translate(16,0)">
    <rect x="0" y="16" width="184" height="272" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="92" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1B4B">1 · Blind</text>
    <text x="92" y="65" text-anchor="middle" font-size="14" fill="#6B7280">0 interactions</text>

    <!-- who liked what -->
    <g transform="translate(0,6)">
    <rect x="133" y="78" width="42" height="116" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="52" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">A</text>
    <text x="80" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">B</text>
    <text x="108" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">C</text>
    <text x="154" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">NEW</text>

    <g fill="#10B981">
      <circle cx="22" cy="118" r="4.5"/><path d="M15,131 Q15,123 22,123 Q29,123 29,131 Z"/>
      <circle cx="22" cy="146" r="4.5"/><path d="M15,159 Q15,151 22,151 Q29,151 29,159 Z"/>
      <circle cx="22" cy="174" r="4.5"/><path d="M15,187 Q15,179 22,179 Q29,179 29,187 Z"/>
    </g>
    <text x="52" y="130" text-anchor="middle" font-size="15">👍</text>
    <text x="80" y="130" text-anchor="middle" font-size="15">👍</text>
    <text x="108" y="130" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="52" y="158" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="80" y="158" text-anchor="middle" font-size="15">👍</text>
    <text x="108" y="158" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="52" y="186" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="80" y="186" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="108" y="186" text-anchor="middle" font-size="15">👍</text>

    </g>
    <!-- the recommender, blindfolded -->
    <g transform="translate(0,8)">
    <line x1="20" y1="222" x2="20" y2="229" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="221" r="2.5" fill="#7C3AED"/>
    <rect x="7" y="229" width="26" height="22" rx="7" fill="#7C3AED"/>
    <rect x="4" y="234" width="32" height="8" rx="3" fill="#4C1D95"/>
    <path d="M36,236 l5,4 M36,240 l4,6" stroke="#4C1D95" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="16" y1="246" x2="24" y2="246" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

    <rect x="46" y="214" width="130" height="52" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M46.75,233 L39,240 L46.75,247" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="45" y="234" width="3" height="12" fill="#FFFFFF"/>
    <text x="111" y="236" text-anchor="middle" font-size="15" fill="#1E1B4B">No clicks,</text>
    <text x="111" y="256" text-anchor="middle" font-size="15" fill="#1E1B4B">no clue.</text>
    </g>
  </g>

  <!-- ===== Panel 2: bridged by content ===== -->
  <g transform="translate(228,0)">
    <rect x="0" y="16" width="184" height="272" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="92" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1B4B">2 · Bridged</text>
    <text x="87" y="65" text-anchor="end" font-size="14" fill="#6B7280">bridge 1:</text>
    <rect x="93" y="50" width="66" height="21" rx="10.5" fill="#EDE9FE"/>
    <text x="126" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#4C1D95">content</text>

    <!-- the new item: tags + description -->
    <g transform="translate(0,8)">
    <rect x="26" y="72" width="132" height="70" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="92" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">NEW</text>
    <rect x="38" y="98" width="48" height="21" rx="10.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="62" y="113.5" text-anchor="middle" font-size="14" fill="#92400E">cozy</text>
    <rect x="94" y="98" width="52" height="21" rx="10.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="120" y="113.5" text-anchor="middle" font-size="14" fill="#92400E">warm</text>
    <line x1="40" y1="129" x2="144" y2="129" stroke="#F59E0B" stroke-opacity=".4" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="136" x2="112" y2="136" stroke="#F59E0B" stroke-opacity=".4" stroke-width="4" stroke-linecap="round"/>

    <!-- matched by tags -->
    <line x1="62" y1="142" x2="36" y2="162" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="120" y1="142" x2="94" y2="162" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="8" y="162" width="52" height="44" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="34" y="179" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">A</text>
    <text x="34" y="198" text-anchor="middle" font-size="14" fill="#4C1D95">cozy</text>
    <rect x="66" y="162" width="52" height="44" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="92" y="179" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">B</text>
    <text x="92" y="198" text-anchor="middle" font-size="14" fill="#4C1D95">warm</text>
    <rect x="124" y="162" width="52" height="44" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="150" y="179" text-anchor="middle" font-size="15" font-weight="700" fill="#9CA3AF">C</text>
    <text x="150" y="198" text-anchor="middle" font-size="14" fill="#9CA3AF">fast</text>
    </g>

    <!-- the recommender, reading -->
    <g transform="translate(0,8)">
    <line x1="20" y1="222" x2="20" y2="229" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="221" r="2.5" fill="#7C3AED"/>
    <rect x="7" y="229" width="26" height="22" rx="7" fill="#7C3AED"/>
    <circle cx="15" cy="238" r="2.6" fill="#FFFFFF"/>
    <circle cx="25" cy="238" r="2.6" fill="#FFFFFF"/>
    <line x1="16" y1="245.5" x2="24" y2="245.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

    <rect x="46" y="214" width="130" height="52" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M46.75,233 L39,240 L46.75,247" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="45" y="234" width="3" height="12" fill="#FFFFFF"/>
    <text x="111" y="236" text-anchor="middle" font-size="15" fill="#1E1B4B">Looks like</text>
    <text x="111" y="256" text-anchor="middle" font-size="15" fill="#1E1B4B">A and B.</text>
    </g>
  </g>

  <!-- ===== Panel 3: learning from a small trial ===== -->
  <g transform="translate(440,0)">
    <rect x="0" y="16" width="184" height="272" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="92" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1B4B">3 · Learning</text>
    <text x="76" y="65" text-anchor="end" font-size="14" fill="#6B7280">bridge 2:</text>
    <rect x="82" y="50" width="90" height="21" rx="10.5" fill="#FEF3C7"/>
    <text x="127" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">small trial</text>

    <g transform="translate(0,6)">
    <rect x="133" y="78" width="42" height="116" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="52" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">A</text>
    <text x="80" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">B</text>
    <text x="108" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">C</text>
    <text x="154" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">NEW</text>

    <g fill="#10B981">
      <circle cx="22" cy="118" r="4.5"/><path d="M15,131 Q15,123 22,123 Q29,123 29,131 Z"/>
      <circle cx="22" cy="146" r="4.5"/><path d="M15,159 Q15,151 22,151 Q29,151 29,159 Z"/>
      <circle cx="22" cy="174" r="4.5"/><path d="M15,187 Q15,179 22,179 Q29,179 29,187 Z"/>
    </g>
    <text x="52" y="130" text-anchor="middle" font-size="15">👍</text>
    <text x="80" y="130" text-anchor="middle" font-size="15">👍</text>
    <text x="108" y="130" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="52" y="158" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="80" y="158" text-anchor="middle" font-size="15">👍</text>
    <text x="108" y="158" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="52" y="186" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="80" y="186" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>
    <text x="108" y="186" text-anchor="middle" font-size="15">👍</text>

    <!-- trial impressions to fans of A and B, then their first likes -->
    <rect class="pb034-anim pb034-imp1" x="138" y="111" width="32" height="25" rx="6" fill="#FEF3C7"/>
    <text class="pb034-anim pb034-up1" x="154" y="130" text-anchor="middle" font-size="15">👍</text>
    <rect class="pb034-anim pb034-imp2" x="138" y="139" width="32" height="25" rx="6" fill="#FEF3C7"/>
    <text class="pb034-anim pb034-up2" x="154" y="158" text-anchor="middle" font-size="15">👍</text>
    <text x="154" y="186" text-anchor="middle" font-size="15" fill="#9CA3AF">·</text>

    </g>
    <!-- the recommender, eyes open -->
    <g transform="translate(0,8)">
    <line x1="20" y1="222" x2="20" y2="229" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="221" r="2.5" fill="#7C3AED"/>
    <rect x="7" y="229" width="26" height="22" rx="7" fill="#7C3AED"/>
    <circle cx="15" cy="238" r="2.6" fill="#FFFFFF"/>
    <circle cx="25" cy="238" r="2.6" fill="#FFFFFF"/>
    <path d="M15.5,244 Q20,249 24.5,244" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <rect x="46" y="214" width="130" height="52" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M46.75,233 L39,240 L46.75,247" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="45" y="234" width="3" height="12" fill="#FFFFFF"/>
    <text x="111" y="236" text-anchor="middle" font-size="15" fill="#1E1B4B">Fans of A and B</text>
    <text x="111" y="256" text-anchor="middle" font-size="15" fill="#1E1B4B">like it!</text>
    </g>
  </g>

  <!-- flow between panels -->
  <line x1="204" y1="140" x2="223" y2="140" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb034-arr)"/>
  <line x1="416" y1="140" x2="435" y2="140" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb034-arr)"/>

  <text x="320" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#1E1B4B">Content guesses first; a small trial’s clicks let behavior take over.</text>
</svg>
