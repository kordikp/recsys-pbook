<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb039-title pb039-desc">
<title id="pb039-title">Who’s training whom?</title>
<desc id="pb039-desc">Four-panel comic. The algorithm is an eager puppy that fetches your feed. 1: You pause on a bread video only to sneeze, and the puppy fetches two bread videos. 2: You tap Not interested and the bread disappears. 3: You search deep sea and watch one video to the end, and deep-sea videos appear. 4: Your feed now shows what you chose; you say good algorithm, it says good human, same time tomorrow? It learns from everything you do, even by accident, so teach it on purpose.</desc>
<rect x="0.5" y="0.5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Who’s training whom?</text>
<text x="320" y="56" text-anchor="middle" font-size="15" fill="#4B5563">Your algorithm is an eager puppy. It fetches your feed.</text>
