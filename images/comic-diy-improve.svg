  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Changing one seat keeps the applause attributable.</text>

  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="565" y="355" width="196" height="49" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="663" y="375" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="663" dy="0">Perfect.</tspan>
    <tspan x="663" dy="17">Invite the neighbors.</tspan>
  </text>
