  <rect x="34" y="355" width="205" height="50" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="136.5" y="375" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="136.5" dy="0">One place card per trial.</tspan>
    <tspan x="136.5" dy="17">I want to know what helped.</tspan>
  </text>
