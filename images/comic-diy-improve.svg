<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb060-title pb060-desc">
<title id="pb060-title">The more, the merrier — one change at a time</title>
<desc id="pb060-desc">Four-panel comic. 1: With a small survey the recommender cannot guess Dana's rating for Dune: the only person who rates like Dana never saw it. 2: After asking twice as many people, Cleo and Eli rate like Dana and both gave Dune a 5, so Dana's guess becomes about 5. 3: The builder adds genres, clicks and a new formula all at once; predictions get better, but nobody can say which change helped. 4: One change per round: check the error, keep the change if it is better, undo it if worse, then try the next. The biggest win is more ratings; test everything else one change at a time.</desc>
