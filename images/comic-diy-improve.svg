  <rect x="35" y="76" width="184" height="48" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="127" y="96" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="127" dy="0">The seating plan works.</tspan>
    <tspan x="127" dy="17">Mostly.</tspan>
  </text>
  <circle cx="84" cy="169" r="10" fill="#7C3AED"/>
  <path d="M84 179 L84 218 M84 190 L65 204 M84 190 L102 203" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
