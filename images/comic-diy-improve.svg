  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Production quality develops a waiting list.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">More interaction data is the biggest improvement; test every other change one at a time.</text>
