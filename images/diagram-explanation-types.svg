<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 270" width="650" height="270" font-family="system-ui, sans-serif">
  <!-- Background -->
  <rect x="1" y="1" width="648" height="268" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Recommendation Explanation Types</text>
  <text x="325" y="43" text-anchor="middle" font-size="11" fill="#6B7280">How to communicate "why this recommendation?" to users</text>

  <!-- Card 1: Item-based -->
  <g transform="translate(14,58)">
    <rect width="118" height="164" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <path d="M8 0H110A8 8 0 0 1 118 8V30H0V8A8 8 0 0 1 8 0Z" fill="#10B981"/>
    <text x="59" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Item-Based</text>

    <rect x="10" y="39" width="98" height="14" rx="3" fill="#D1FAE5"/>
    <rect x="10" y="39" width="38" height="14" rx="3" fill="#10B981" fill-opacity="0.32"/>
    <rect x="10" y="59" width="98" height="14" rx="3" fill="#D1FAE5"/>
    <rect x="10" y="59" width="64" height="14" rx="3" fill="#10B981" fill-opacity="0.32"/>

    <rect x="8" y="84" width="102" height="40" rx="4" fill="#D1FAE5"/>
    <text x="59" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">"Because you</text>
    <text x="59" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">watched X"</text>

    <rect x="12" y="136" width="94" height="20" rx="10" fill="#D1FAE5"/>
    <text x="59" y="150" text-anchor="middle" font-size="11" fill="#10B981">Most common</text>
  </g>

  <!-- Card 2: Social proof -->
  <g transform="translate(142,58)">
    <rect width="118" height="164" rx="8" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <path d="M8 0H110A8 8 0 0 1 118 8V30H0V8A8 8 0 0 1 8 0Z" fill="#0EA5E9"/>
    <text x="59" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Social Proof</text>

    <circle cx="27" cy="55" r="11" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="27" y="59" text-anchor="middle" font-size="11">📍</text>
    <circle cx="55" cy="55" r="9" fill="#E0F2FE"/>
    <circle cx="73" cy="55" r="9" fill="#E0F2FE"/>
    <circle cx="91" cy="55" r="9" fill="#E0F2FE"/>
    <text x="55" y="59" text-anchor="middle" font-size="11">♟</text>
    <text x="73" y="59" text-anchor="middle" font-size="11">♟</text>
    <text x="91" y="59" text-anchor="middle" font-size="11">♟</text>

    <rect x="8" y="84" width="102" height="40" rx="4" fill="#E0F2FE"/>
    <text x="59" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">"Popular in</text>
    <text x="59" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">your area"</text>

    <rect x="12" y="136" width="94" height="20" rx="10" fill="#E0F2FE"/>
    <text x="59" y="150" text-anchor="middle" font-size="11" fill="#0EA5E9">Trust signal</text>
  </g>

  <!-- Card 3: Collaborative -->
  <g transform="translate(270,58)">
    <rect width="118" height="164" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <path d="M8 0H110A8 8 0 0 1 118 8V30H0V8A8 8 0 0 1 8 0Z" fill="#D97706"/>
    <text x="59" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Collaborative</text>

    <circle cx="31" cy="55" r="11" fill="#FEF3C7" stroke="#D97706"/>
    <text x="31" y="59" text-anchor="middle" font-size="11">♟</text>
    <line x1="42" y1="55" x2="68" y2="55" stroke="#D97706" stroke-width="1.5"/>
    <text x="55" y="48" text-anchor="middle" font-size="11" fill="#D97706">likes</text>
    <circle cx="80" cy="55" r="11" fill="#FEF3C7" stroke="#D97706"/>
    <text x="80" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">X</text>
    <line x1="55" y1="61" x2="55" y2="70" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="59" y="80" text-anchor="middle" font-size="11" fill="#D97706">also likes Y</text>

    <rect x="8" y="84" width="102" height="40" rx="4" fill="#FEF3C7"/>
    <text x="59" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">"Fans of X</text>
    <text x="59" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">also like Y"</text>

    <rect x="7" y="136" width="104" height="20" rx="10" fill="#FEF3C7"/>
    <text x="59" y="150" text-anchor="middle" font-size="11" fill="#D97706">Community taste</text>
  </g>

  <!-- Card 4: Content-based -->
  <g transform="translate(398,58)">
    <rect width="118" height="164" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M8 0H110A8 8 0 0 1 118 8V30H0V8A8 8 0 0 1 8 0Z" fill="#7C3AED"/>
    <text x="59" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Content-Based</text>

    <rect x="12" y="39" width="34" height="34" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="29" y="61" text-anchor="middle" font-size="15">🔖</text>
    <text x="54" y="48" font-size="11" fill="#6B7280">saved</text>
    <line x1="53" y1="57" x2="101" y2="57" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="76" y="72" text-anchor="middle" font-size="11" fill="#7C3AED">similar</text>

    <rect x="8" y="84" width="102" height="40" rx="4" fill="#EDE9FE"/>
    <text x="59" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">"Similar to</text>
    <text x="59" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">saved items"</text>

    <rect x="7" y="136" width="104" height="20" rx="10" fill="#EDE9FE"/>
    <text x="59" y="150" text-anchor="middle" font-size="11" fill="#7C3AED">Feature matching</text>
  </g>

  <!-- Card 5: Confidence score -->
  <g transform="translate(526,58)">
    <rect width="110" height="164" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <path d="M8 0H102A8 8 0 0 1 110 8V30H0V8A8 8 0 0 1 8 0Z" fill="#EF4444"/>
    <text x="55" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Confidence</text>

    <circle cx="55" cy="58" r="18" fill="none" stroke="#E5E7EB" stroke-width="4"/>
    <circle cx="55" cy="58" r="18" fill="none" stroke="#EF4444" stroke-width="4" stroke-dasharray="98.5 113" stroke-dashoffset="28" stroke-linecap="round"/>
    <text x="55" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">87%</text>

    <rect x="5" y="84" width="100" height="40" rx="4" fill="#FEE2E2"/>
    <text x="55" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">"87% match"</text>
    <text x="55" y="116" text-anchor="middle" font-size="11" fill="#6B7280">based on profile</text>

    <rect x="8" y="136" width="94" height="20" rx="10" fill="#FEE2E2"/>
    <text x="55" y="150" text-anchor="middle" font-size="11" fill="#EF4444">Quantified fit</text>
  </g>

  <!-- Bottom note -->
  <text x="325" y="242" text-anchor="middle" font-size="11" fill="#6B7280">Explanations increase user trust, satisfaction, and willingness to try recommended items.</text>
  <text x="325" y="259" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">The best systems combine multiple explanation types depending on context and confidence.</text>
</svg>