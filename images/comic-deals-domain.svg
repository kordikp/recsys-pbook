<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb056-title pb056-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb056-title">Today's Special Can't Wait for Tomorrow</title>
<desc id="pb056-desc">Four-panel comic about a deal aggregator. 10:00: a sushi bar posts half-price sushi that ends at noon; the recommender has no clicks yet and no time to wait for any. 10:03: it matches the deal by what it is (sushi, Old Town) to Ben, who loves sushi and lives in Old Town, and sends it to his phone. 10:10: a taco partner offers 2 dollars commission per order if his cilantro tacos go first. 10:11: Ben's list shows sushi first and tacos lifted from third to second; Ben hates cilantro, so the paid boost moves the tacos up but not past what Ben wants. Takeaway: a new deal with no clicks is matched by what it is within minutes, and a commission boost is balanced against what the user wants.</desc>
