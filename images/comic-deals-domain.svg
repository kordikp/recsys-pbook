    <rect x="651" y="351" width="121" height="46" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="711.5" y="370" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Ben hates</text>
    <text x="711.5" y="387" font-size="12.5" fill="#1E1B4B" text-anchor="middle">cilantro.</text>

    <rect x="536" y="414" width="132" height="78" rx="8" fill="#FFFFFF" stroke="#1E1B4B"/>
    <rect x="546" y="425" width="112" height="24" rx="5" fill="#D1FAE5"/>
    <text x="602" y="442" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">1  SUSHI  ♥</text>
    <rect x="546" y="457" width="112" height="24" rx="5" fill="#FEF3C7"/>
    <text x="602" y="474" font-size="12.5" font-weight="700" fill="#1E1B4B" text-anchor="middle">2  TACOS  +$2</text>

