    <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The boost gets a vote, not custody.</text>
  </g>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Deal aggregators match expiring offers in minutes, balancing user relevance with commissions.</text>
