    <rect x="252" y="436" width="48" height="66" rx="5" fill="#FFFFFF" stroke="#7C3AED"/>
    <path d="M261 452 L289 452 M261 466 L289 466 M261 480 L281 480" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>

