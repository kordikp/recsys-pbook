<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The Recommendation Pipeline</title>
  <desc id="desc">A four-stage pipeline that retrieves one thousand candidates from one million items, scores them down to one hundred, re-ranks them to twenty, and serves the final response in under two hundred milliseconds.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#1E1B4B"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="698" height="248" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="350" y="31" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">The Recommendation Pipeline</text>

  <!-- Retrieve -->
  <g>
    <rect x="20" y="60" width="150" height="122" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="95" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">RETRIEVE</text>
    <text x="95" y="111" text-anchor="middle" font-size="11" fill="#6B7280">Candidate Generation</text>
    <text x="95" y="146" text-anchor="middle" font-size="23" font-weight="700" fill="#7C3AED">1M → 1K</text>
    <text x="95" y="169" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">~50ms</text>
  </g>

  <path d="M177 121 H198" fill="none" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- Score -->
  <g>
    <rect x="205" y="60" width="150" height="122" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="280" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">SCORE</text>
    <text x="280" y="111" text-anchor="middle" font-size="11" fill="#6B7280">Precise Ranking</text>
    <text x="280" y="146" text-anchor="middle" font-size="23" font-weight="700" fill="#0EA5E9">1K → 100</text>
    <text x="280" y="169" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">~100ms</text>
  </g>

  <path d="M362 121 H383" fill="none" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- Re-rank -->
  <g>
    <rect x="390" y="60" width="150" height="122" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="465" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">RE-RANK</text>
    <text x="465" y="111" text-anchor="middle" font-size="11" fill="#6B7280">Diversity + Rules</text>
    <text x="465" y="146" text-anchor="middle" font-size="23" font-weight="700" fill="#D97706">100 → 20</text>
    <text x="465" y="169" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">~30ms</text>
  </g>

  <path d="M547 121 H568" fill="none" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- Serve -->
  <g>
    <rect x="575" y="60" width="105" height="122" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="627.5" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">SERVE</text>
    <text x="627.5" y="111" text-anchor="middle" font-size="11" fill="#6B7280">Final Response</text>
    <text x="627.5" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#10B981">20 items</text>
    <text x="627.5" y="169" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">~20ms</text>
  </g>

  <!-- Total latency -->
  <g>
    <rect x="20" y="199" width="660" height="32" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="350" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1B4B">Total: &lt; 200ms for millions of items → 20 personalized results</text>
  </g>
</svg>