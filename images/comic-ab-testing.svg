<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb035-title pb035-desc">
  <title id="pb035-title">An A/B test, diner edition</title>
  <desc id="pb035-desc">Four-panel comic. A chef and the owner argue about which special to recommend. A coin flip sends each guest to special A (burger) or special B (soup). A guest praises the soup but orders the burger, and the order is what gets counted. One night with 6 guests could be luck; after 4 weeks with 200 guests per group, 96 A guests came back versus 70 B guests, so the burger stays: data decides, not opinion.</desc>

  <defs>
    <marker id="pb035-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <style>
    .pb035-coin { transform-box: fill-box; transform-origin: center; animation: pb035-flip 8s ease-in-out infinite; }
    .pb035-dot { opacity: 0; animation: pb035-go 8s ease-in-out infinite; }
    @keyframes pb035-flip {
      0%, 6%, 50%, 56%, 100% { transform: scaleX(1); }
      3%, 53% { transform: scaleX(0.1); }
    }
    @keyframes pb035-go {
      0%, 6% { opacity: 0; transform: translate(0, 0); }
      9% { opacity: 1; transform: translate(0, 0); }
      26% { opacity: 1; transform: translate(80px, -64px); }
      34%, 56% { opacity: 0; transform: translate(80px, -64px); }
      57% { opacity: 0; transform: translate(0, 0); }
      60% { opacity: 1; transform: translate(0, 0); }
      77% { opacity: 1; transform: translate(80px, 20px); }
      85%, 100% { opacity: 0; transform: translate(80px, 20px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pb035-coin, .pb035-dot { animation: none !important; }
    }
  </style>

  <rect x="0.5" y="0.5" width="639" height="609" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">An A/B test, diner edition</text>

  <!-- Panels -->
  <rect x="16" y="52" width="298" height="248" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="326" y="52" width="298" height="248" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="16" y="312" width="298" height="248" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="326" y="312" width="298" height="248" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ===== Panel 1: two opinions ===== -->
  <circle cx="40" cy="77" r="11" fill="#1E1B4B"/>
  <text x="40" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="59" y="82" font-size="16" font-weight="700" fill="#1E1B4B">Two opinions</text>

  <!-- chef bubble -->
  <path d="M42,96 H214 Q226,96 226,108 V134 Q226,146 214,146 H77 L70,190 L63,146 H42 Q30,146 30,134 V108 Q30,96 42,96 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="128" y="117" text-anchor="middle" font-size="15" fill="#1E1B4B">My new soup should be</text>
  <text x="128" y="137" text-anchor="middle" font-size="15" fill="#1E1B4B">the special!</text>

  <!-- owner bubble -->
  <path d="M122,154 H294 Q306,154 306,166 V176 Q306,188 294,188 H257 L250,208 L243,188 H122 Q110,188 110,176 V166 Q110,154 122,154 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="208" y="176" text-anchor="middle" font-size="15" fill="#1E1B4B">Says who? Let’s test it.</text>

  <!-- floor -->
  <line x1="30" y1="278.5" x2="300" y2="278.5" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- chef -->
  <path d="M48,278 V262 Q48,246 70,246 Q92,246 92,262 V278 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <circle cx="70" cy="228" r="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <circle cx="65" cy="227" r="1.8" fill="#1E1B4B"/>
  <circle cx="75" cy="227" r="1.8" fill="#1E1B4B"/>
  <path d="M65,233 Q70,237 75,233" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M60,217 V207 A6,6 0 0 1 64,198 A7,7 0 0 1 76,198 A6,6 0 0 1 80,207 V217 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- the special board -->
  <rect x="122" y="214" width="76" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="160" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Special</text>
  <text x="160" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#7C3AED">?</text>

  <!-- owner -->
  <path d="M228,278 V262 Q228,246 250,246 Q272,246 272,262 V278 Z" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M250,247 L246,253 L250,270 L254,253 Z" fill="#1E1B4B"/>
  <circle cx="250" cy="228" r="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <circle cx="245" cy="227" r="1.8" fill="#1E1B4B"/>
  <circle cx="255" cy="227" r="1.8" fill="#1E1B4B"/>
  <path d="M241,221 L248,218 M252,222 L259,222" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M245,235 H255" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ===== Panel 2: split at random ===== -->
  <circle cx="350" cy="77" r="11" fill="#1E1B4B"/>
  <text x="350" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="369" y="82" font-size="16" font-weight="700" fill="#1E1B4B">Split at random</text>

  <!-- coin -->
  <path d="M346,130 Q340,142 346,154 M398,130 Q404,142 398,154" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <g class="pb035-coin">
    <circle cx="372" cy="142" r="19" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="372" cy="142" r="14" fill="none" stroke="#F59E0B" stroke-width="1"/>
    <text x="372" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#92400E">?</text>
  </g>

  <!-- guest -->
  <path d="M350,250 V234 Q350,218 372,218 Q394,218 394,234 V250 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="372" cy="200" r="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="367" cy="199" r="1.8" fill="#1E1B4B"/>
  <circle cx="377" cy="199" r="1.8" fill="#1E1B4B"/>
  <path d="M367,205 Q372,209 377,205" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- assignment arrows -->
  <line x1="400" y1="192" x2="481" y2="138" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb035-arrow)"/>
  <line x1="400" y1="210" x2="481" y2="222" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb035-arrow)"/>
  <text x="440" y="130" text-anchor="middle" font-size="14" fill="#6B7280">heads</text>
  <text x="440" y="246" text-anchor="middle" font-size="14" fill="#6B7280">tails</text>
  <circle class="pb035-dot" cx="400" cy="201" r="6" fill="#10B981"/>

  <!-- variants -->
  <rect x="488" y="104" width="122" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="549" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Special A</text>
  <text x="549" y="148" text-anchor="middle" font-size="15" fill="#1E1B4B">🍔 Burger</text>
  <rect x="488" y="196" width="122" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="549" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Special B</text>
  <text x="549" y="240" text-anchor="middle" font-size="15" fill="#1E1B4B">🍲 Soup</text>

  <text x="475" y="284" text-anchor="middle" font-size="15" fill="#6B7280">Only the special differs.</text>

  <!-- ===== Panel 3: watch what they do ===== -->
  <circle cx="40" cy="337" r="11" fill="#1E1B4B"/>
  <text x="40" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="59" y="342" font-size="16" font-weight="700" fill="#1E1B4B">Watch what they do</text>

  <path d="M42,356 H204 Q216,356 216,368 V378 Q216,390 204,390 H91 L84,412 L77,390 H42 Q30,390 30,378 V368 Q30,356 42,356 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="123" y="378" text-anchor="middle" font-size="15" fill="#1E1B4B">Soup? Sounds amazing!</text>

  <!-- guest -->
  <path d="M62,482 V466 Q62,450 84,450 Q106,450 106,466 V482 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="84" cy="432" r="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <path d="M77,430 Q79,427 81,430 M87,430 Q89,427 91,430" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M78,436 Q84,443 90,436" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>

  <line x1="114" y1="460" x2="178" y2="460" stroke="#6B7280" stroke-width="2" stroke-linecap="round" marker-end="url(#pb035-arrow)"/>
  <text x="146" y="450" text-anchor="middle" font-size="14" fill="#6B7280">orders</text>

  <!-- order ticket -->
  <path d="M190,404 H294 Q298,404 298,408 V494 L290,500 L282,494 L274,500 L266,494 L258,500 L250,494 L242,500 L234,494 L226,500 L218,494 L210,500 L202,494 L194,500 L186,494 V408 Q186,404 190,404 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
  <text x="242" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46" letter-spacing="1">ORDER</text>
  <text x="242" y="462" text-anchor="middle" font-size="26">🍔</text>
  <text x="242" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Burger</text>

  <text x="165" y="540" text-anchor="middle" font-size="15" fill="#6B7280">Count orders, not compliments.</text>

  <!-- ===== Panel 4: enough guests, enough time ===== -->
  <circle cx="350" cy="337" r="11" fill="#1E1B4B"/>
  <text x="350" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="369" y="342" font-size="16" font-weight="700" fill="#1E1B4B">Enough guests, enough time</text>

  <rect x="342" y="354" width="266" height="30" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="475" y="374" text-anchor="middle" font-size="14" fill="#92400E">Night 1, 6 guests? Could be luck.</text>

  <rect x="342" y="392" width="266" height="104" rx="10" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="356" y="413" font-size="14" font-weight="700" fill="#1E1B4B">Came back within 4 weeks</text>
  <text x="356" y="431" font-size="14" fill="#6B7280">200 guests per group</text>
  <text x="356" y="457" font-size="15" font-weight="700" fill="#1E1B4B">A 🍔</text>
  <rect x="404" y="442" width="154" height="20" rx="4" fill="#10B981"/>
  <text x="564" y="457" font-size="15" font-weight="700" fill="#1E1B4B">96</text>
  <text x="356" y="483" font-size="15" font-weight="700" fill="#1E1B4B">B 🍲</text>
  <rect x="404" y="468" width="112" height="20" rx="4" fill="#D1D5DB"/>
  <text x="522" y="483" font-size="15" font-weight="700" fill="#1E1B4B">70</text>

  <!-- the chef takes it well -->
  <circle cx="362" cy="537" r="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M357,535 H360 M364,535 H367" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M357,543 Q362,540 367,543" fill="none" stroke="#1E1B4B" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M353,528 V519 A5,5 0 0 1 357,511 A6,6 0 0 1 367,511 A5,5 0 0 1 371,519 V528 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="384" y="542" font-size="15" font-weight="700" fill="#065F46">A wins: the burger stays.</text>

  <!-- takeaway -->
  <text x="320" y="592" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Data decides, not opinion. Not even the chef’s.</text>
</svg>
