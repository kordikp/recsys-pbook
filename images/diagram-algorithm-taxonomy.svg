<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" width="640" height="456" role="img" aria-labelledby="pb109-title pb109-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb109-title">Two algorithm families: what does each one look at?</title>
  <desc id="pb109-desc">Collaborative filtering looks at what other users did (readers of article A also read B), while content-based filtering looks at what the item is (its tags and text), so only content-based can recommend a new article that has zero readers; hybrid systems combine both signals.</desc>
  <defs>
    <marker id="pb109-head-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
    <marker id="pb109-head-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="455" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <text x="320" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Two algorithm families: what does each look at?</text>

  <!-- ===== Collaborative filtering card ===== -->
  <rect x="20" y="58" width="292" height="268" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="40" y="88" font-size="17" font-weight="700" fill="#1E1B4B">Collaborative filtering</text>
  <text x="40" y="111" font-size="15" fill="#4B5563">looks at <tspan font-weight="700" fill="#065F46">what other users did</tspan></text>

  <!-- three readers -->
  <g fill="#10B981">
    <circle cx="52" cy="147" r="8"/><path d="M38,178 Q38,160 52,160 Q66,160 66,178 Z"/>
    <circle cx="86" cy="147" r="8"/><path d="M72,178 Q72,160 86,160 Q100,160 100,178 Z"/>
    <circle cx="120" cy="147" r="8"/><path d="M106,178 Q106,160 120,160 Q134,160 134,178 Z"/>
  </g>
  <text x="86" y="202" text-anchor="middle" font-size="14" fill="#4B5563">Readers of A</text>

  <line x1="144" y1="166" x2="174" y2="166" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb109-head-g)"/>

  <rect x="184" y="132" width="112" height="72" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="240" y="154" text-anchor="middle" font-size="14" fill="#4B5563">also read</text>
  <rect x="198" y="166" width="84" height="26" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="240" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Article B</text>

  <text x="166" y="234" text-anchor="middle" font-size="15" fill="#1E1B4B">You read A → you get B</text>

  <rect x="32" y="250" width="268" height="62" rx="9" fill="#FEF3C7"/>
  <text x="166" y="273" text-anchor="middle" font-size="14" fill="#92400E">New article, 0 readers?</text>
  <text x="166" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">✗ Nothing to go on yet</text>

  <!-- ===== Content-based filtering card (focal) ===== -->
  <rect x="328" y="58" width="292" height="268" rx="12" fill="#FAF8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="348" y="88" font-size="17" font-weight="700" fill="#1E1B4B">Content-based filtering</text>
  <text x="348" y="111" font-size="15" fill="#4B5563">looks at <tspan font-weight="700" fill="#4C1D95">what the item is</tspan></text>

  <!-- article you read -->
  <rect x="340" y="128" width="120" height="84" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="400" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">You read</text>
  <rect x="348" y="158" width="104" height="22" rx="7" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="400" y="174" text-anchor="middle" font-size="14" fill="#1E1B4B">#systems</text>
  <rect x="348" y="184" width="104" height="22" rx="7" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="400" y="200" text-anchor="middle" font-size="14" fill="#1E1B4B">#distributed</text>

  <text x="474" y="178" text-anchor="middle" font-size="24" font-weight="700" fill="#7C3AED">≈</text>

  <!-- brand-new article -->
  <rect x="488" y="128" width="120" height="84" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="548" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">New article</text>
  <rect x="496" y="158" width="104" height="22" rx="7" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="548" y="174" text-anchor="middle" font-size="14" fill="#4C1D95">#systems</text>
  <rect x="496" y="184" width="104" height="22" rx="7" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="548" y="200" text-anchor="middle" font-size="14" fill="#4C1D95">#distributed</text>

  <text x="474" y="234" text-anchor="middle" font-size="15" fill="#1E1B4B">Same tags → recommended</text>

  <rect x="340" y="250" width="268" height="62" rx="9" fill="#FEF3C7"/>
  <text x="474" y="273" text-anchor="middle" font-size="14" fill="#92400E">New article, 0 readers?</text>
  <text x="474" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">✓ Match it right away</text>

  <!-- ===== Hybrid: both feed in ===== -->
  <path d="M166,326 V370 H190" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pb109-head-g)"/>
  <path d="M474,326 V370 H450" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pb109-head-p)"/>
  <rect x="200" y="351" width="240" height="38" rx="19" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="320" y="375" text-anchor="middle" font-size="15" fill="#1E1B4B"><tspan font-weight="700">Hybrid</tspan> systems combine both</text>

  <!-- takeaway -->
  <text x="320" y="426" text-anchor="middle" font-size="15" fill="#1E1B4B">Collaborative asks <tspan font-weight="700" fill="#065F46">who liked it</tspan>. Content-based asks <tspan font-weight="700" fill="#4C1D95">what it is</tspan>.</text>
</svg>
