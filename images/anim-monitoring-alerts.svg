<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="pb020-title pb020-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb020-title">All green, and still broken</title>
  <desc id="pb020-desc">Toy example over four weeks. A data job behind a recommender silently fails in week 1. The classic health checks (server up, 200 OK, fast) stay flat and green and no alert fires. The quality of the recommendations drops right after the failure, and the business line (retention, revenue) only drops weeks later. Classic checks watch the server; recommender monitoring must also watch what users get and what it leads to.</desc>
  <style>
    .pb020-cover{transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0);animation:pb020-wipe 12s linear infinite}
    @keyframes pb020-wipe{0%,4%{transform:scaleX(1)}54%,100%{transform:scaleX(0)}}
    .pb020-cursor{opacity:0;animation:pb020-sweep 12s linear infinite}
    @keyframes pb020-sweep{0%{opacity:0;transform:translateX(0)}4%{opacity:1;transform:translateX(0)}54%{opacity:1;transform:translateX(400px)}58%,100%{opacity:0;transform:translateX(400px)}}
    .pb020-ev{animation:pb020-ev 12s linear infinite}
    @keyframes pb020-ev{0%,10%{opacity:0}13%,100%{opacity:1}}
    .pb020-q{animation:pb020-q 12s linear infinite}
    @keyframes pb020-q{0%,32%{opacity:0}35%,100%{opacity:1}}
    .pb020-late{animation:pb020-late 12s linear infinite}
    @keyframes pb020-late{0%,38%{opacity:0}41%,100%{opacity:1}}
    .pb020-ok{animation:pb020-ok 12s linear infinite}
    @keyframes pb020-ok{0%,50%{opacity:0}54%,100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.pb020-cover,.pb020-cursor,.pb020-ev,.pb020-q,.pb020-late,.pb020-ok{animation:none !important}}
  </style>
  <defs>
    <marker id="pb020-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#B45309"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="429" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">All green — and still broken</text>
  <text x="320" y="62" text-anchor="middle" font-size="14" fill="#6B7280">One silent failure, three monitors · toy example</text>

  <!-- chart card -->
  <rect x="20" y="76" width="600" height="276" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- lane labels -->
  <text x="36" y="132" font-size="16" font-weight="700" fill="#1E1B4B">Health checks</text>
  <text x="36" y="152" font-size="14" fill="#4B5563">up · 200 OK · fast</text>
  <text x="36" y="204" font-size="16" font-weight="700" fill="#1E1B4B">Recommendations</text>
  <text x="36" y="224" font-size="14" fill="#4B5563">fresh · varied · clicked</text>
  <text x="36" y="276" font-size="16" font-weight="700" fill="#1E1B4B">Business</text>
  <text x="36" y="296" font-size="14" fill="#4B5563">retention · revenue</text>

  <!-- where the lines would have stayed -->
  <line x1="252" y1="195" x2="596" y2="195" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
  <line x1="472" y1="266" x2="596" y2="266" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
  <!-- lines -->
  <path d="M196 126 L236 125 L276 127 L316 126 L356 125 L396 127 L436 126 L476 125 L516 127 L556 126 L596 126" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M196 195 L222 193 L250 195 C290 197 320 222 380 226 L420 228 L460 226 L500 229 L540 227 L596 228" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M196 266 L236 265 L276 267 L316 266 L356 265 L396 267 L436 266 L470 266 C505 268 540 290 596 298" fill="none" stroke="#1E1B4B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- wipe cover (animation only) -->
  <rect class="pb020-cover" x="197" y="100" width="402" height="214" fill="#FFFFFF"/>

  <!-- lane separators + axis -->
  <line x1="36" y1="170" x2="604" y2="170" stroke="#E5E7EB" stroke-width="1.5"/>
  <line x1="36" y1="242" x2="604" y2="242" stroke="#E5E7EB" stroke-width="1.5"/>
  <line x1="196" y1="316" x2="596" y2="316" stroke="#D1D5DB" stroke-width="1.5"/>
  <g stroke="#D1D5DB" stroke-width="1.5">
    <line x1="196" y1="312" x2="196" y2="320"/><line x1="296" y1="312" x2="296" y2="320"/>
    <line x1="396" y1="312" x2="396" y2="320"/><line x1="496" y1="312" x2="496" y2="320"/>
    <line x1="596" y1="312" x2="596" y2="320"/>
  </g>
  <g font-size="14" fill="#6B7280" text-anchor="middle">
    <text x="246" y="338">week 1</text><text x="346" y="338">week 2</text>
    <text x="446" y="338">week 3</text><text x="546" y="338">week 4</text>
  </g>

  <!-- silent failure event -->
  <g class="pb020-ev">
    <line x1="250" y1="102" x2="250" y2="312" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>
    <circle cx="250" cy="95" r="5" fill="#F59E0B"/>
    <text x="260" y="100" font-size="14" font-weight="700" fill="#92400E">Data job silently fails</text>
    <text x="260" y="152" font-size="14" fill="#4B5563">🔕 no alert</text>
  </g>

  <!-- annotations -->
  <g class="pb020-q">
    <text x="470" y="216" font-size="14" font-weight="700" fill="#4C1D95">quietly worse</text>
  </g>
  <g class="pb020-late">
    <line x1="256" y1="297" x2="462" y2="297" stroke="#B45309" stroke-width="2" stroke-linecap="round" marker-end="url(#pb020-ah)"/>
    <text x="358" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">users leave weeks later</text>
  </g>
  <g class="pb020-ok">
    <rect x="404" y="137" width="186" height="26" rx="13" fill="#D1FAE5"/>
    <text x="497" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">✓ All systems operational</text>
  </g>

  <!-- time cursor (animation only) -->
  <line class="pb020-cursor" x1="196" y1="102" x2="196" y2="312" stroke="#9CA3AF" stroke-width="2"/>

  <!-- takeaway -->
  <text x="320" y="390" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">Classic checks watch the server.</text>
  <text x="320" y="414" text-anchor="middle" font-size="16" fill="#1E1B4B">Recommender monitoring also watches <tspan font-weight="700" fill="#6D28D9">what users get</tspan>.</text>
</svg>
