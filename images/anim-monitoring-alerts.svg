<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .blink{animation:b 2.2s ease-in-out infinite}
    @keyframes b{0%,100%{opacity:1}50%{opacity:.55}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Alert Severity: Match the Response to the Risk</text>

  <g text-anchor="middle" font-size="13">
    <rect x="55" y="80" width="215" height="240" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <circle cx="162" cy="128" r="22" fill="#10B981"/><text x="162" y="136" font-size="20" fill="#fff">ℹ</text>
    <text x="162" y="176" font-size="16" font-weight="800" fill="#065F46">INFO</text>
    <text x="162" y="202" fill="#065F46">metrics moved a little</text>
    <text x="162" y="222" fill="#065F46">within normal bands</text>
    <rect x="80" y="248" width="165" height="42" rx="8" fill="#FFFFFF" stroke="#10B981"/>
    <text x="162" y="274" font-weight="700" fill="#065F46">→ weekly review</text>

    <rect x="292" y="80" width="215" height="240" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <circle cx="400" cy="128" r="22" fill="#D97706"/><text x="400" y="136" font-size="19" fill="#fff">⚠</text>
    <text x="400" y="176" font-size="16" font-weight="800" fill="#92400E">WARNING</text>
    <text x="400" y="202" fill="#92400E">trend crossing a band:</text>
    <text x="400" y="222" fill="#92400E">latency ↑, coverage ↓</text>
    <rect x="317" y="248" width="165" height="42" rx="8" fill="#FFFFFF" stroke="#D97706"/>
    <text x="400" y="274" font-weight="700" fill="#92400E">→ ticket, next standup</text>

    <g class="blink">
      <rect x="529" y="80" width="215" height="240" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
      <circle cx="637" cy="128" r="22" fill="#EF4444"/><text x="637" y="136" font-size="19" fill="#fff">🔥</text>
      <text x="637" y="176" font-size="16" font-weight="800" fill="#B91C1C">CRITICAL</text>
      <text x="637" y="202" fill="#B91C1C">recs empty / fallback on</text>
      <text x="637" y="222" fill="#B91C1C">CTR cliff, errors spiking</text>
      <rect x="554" y="248" width="165" height="42" rx="8" fill="#FFFFFF" stroke="#EF4444"/>
      <text x="637" y="274" font-weight="700" fill="#B91C1C">→ page on-call NOW</text>
    </g>
  </g>
  <text x="400" y="368" text-anchor="middle" font-size="13" fill="#6B7280">Alert fatigue is the real enemy: if everything pages, nothing does. Tune thresholds until CRITICAL is rare and real.</text>
</svg>
