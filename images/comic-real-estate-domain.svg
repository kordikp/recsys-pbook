<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb092-title pb092-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb092-title">Location, location, notification</title>
<desc id="pb092-desc">Four-panel comic. 1: A couple views a flat the site recommended for them, 90 minutes from work, and loses their Saturday. 2: The recommender, whose last search with them was 5 years ago, barely knows them and asks them to draw the map: their area and 30 minutes to work; only listings inside both count. 3: A watchdog alert: a 3-room flat just listed, in their area, 25 minutes to work, while a flat from Sunday is already sold. 4: At the viewing: we came for 20 minutes, we may stay 30 years. Takeaway: every viewing costs hours and there is little data, so suggest only inside the area and commute; listings come and go daily, so alert on the first match.</desc>
