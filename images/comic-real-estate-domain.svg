<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">Location, Location, Notification</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="35" y="76" width="125" height="51" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="97.5" y="97" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="97.5" dy="0">Our life fits</tspan>
    <tspan x="97.5" dy="17">inside this shape.</tspan>
  </text>
  <circle cx="74" cy="184" r="10" fill="#7C3AED"/>
  <path d="M74 194 L74 224 M74 203 L55 216 M74 203 L93 214 M74 224 L61 247 M74 224 L87 247" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="122" cy="184" r="10" fill="#10B981"/>
  <path d="M122 194 L122 224 M122 203 L104 214 M122 203 L140 216 M122 224 L109 247 M122 224 L135 247" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="174" y="82" width="190" height="140" rx="8" fill="#E0F2FE" stroke="#0EA5E9"/>
  <path d="M200 111 L252 94 L330 116 L341 170 L291 204 L217 190 L190 148 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="274" cy="147" r="7" fill="#D97706"/>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">They draw a polygon around where life is allowed.</text>

  <!-- Panel 2 -->
  <rect x="430" y="82" width="195" height="140" rx="8" fill="#E0F2FE" stroke="#0EA5E9"/>
  <circle cx="527" cy="152" r="52" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <circle cx="527" cy="152" r="7" fill="#7C3AED"/>
  <rect x="642" y="78" width="128" height="55" rx="9" fill="#FEF3C7" stroke="#D97706"/>
  <text x="706" y="99" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="706" dy="0">Thirty minutes.</tspan>
    <tspan x="706" dy="17">Then wilderness.</tspan>
  </text>
  <circle cx="675" cy="192" r="10" fill="#7C3AED"/>
  <path d="M675 202 L675 232 M675 211 L656 224 M675 211 L694 222 M675 232 L662 255 M675 232 L688 255" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="728" cy="192" r="10" fill="#10B981"/>
  <path d="M728 202 L728 232 M728 211 L709 222 M728 211 L747 224 M728 232 L715 255 M728 232 L741 255" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Then shrink it to a commute they can survive.</text>

  <!-- Panel 3 -->
  <circle cx="86" cy="450" r="10" fill="#7C3AED"/>
  <path d="M86 460 L86 490 M86 469 L67 481 M86 469 L111 479 M86 490 L73 513 M86 490 L99 513" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="310" cy="450" r="10" fill="#10B981"/>
  <path d="M310 460 L310 490 M310 469 L285 479 M310 469 L329 481 M310 490 L297 513 M310 490 L323 513" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="149" y="372" width="102" height="138" rx="12" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2.5"/>
  <circle cx="244" cy="378" r="12" fill="#EF4444"/>
  <text x="244" y="383" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="200" y="422" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="200" dy="0" font-weight="700">MATCH FOUND</tspan>
    <tspan x="200" dy="19">Area + commute</tspan>
  </text>
  <path d="M259 394 Q271 402 259 410 M265 383 Q285 402 265 421" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">The watchdog finds one new listing inside both limits.</text>

  <!-- Panel 4 -->
  <path d="M438 439 L514 381 L590 439 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="450" y="439" width="128" height="82" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <rect x="475" y="458" width="30" height="27" rx="3" fill="#E0F2FE" stroke="#0EA5E9"/>
  <rect x="584" y="365" width="182" height="55" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="675" y="386" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="675" dy="0">We came for 20 minutes.</tspan>
    <tspan x="675" dy="17">We may stay 30 years.</tspan>
  </text>
  <circle cx="660" cy="474" r="10" fill="#7C3AED"/>
  <path d="M660 484 L660 514 M660 493 L641 505 M660 493 L679 503 M660 514 L647 537 M660 514 L673 537" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="711" cy="474" r="10" fill="#10B981"/>
  <path d="M711 484 L711 514 M711 493 L692 503 M711 493 L730 505 M711 514 L698 537 M711 514 L724 537" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">One viewing later, the shortlist becomes a life plan.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Real estate is high-stakes: geography and alerts save viewing time before a life decision.</text>
</svg>