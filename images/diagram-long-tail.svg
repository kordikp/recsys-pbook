<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" aria-labelledby="pb132-title pb132-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb132-title">The long tail: a few hits, a huge unseen rest</title>
<desc id="pb132-desc">A toy bookstore with a million titles ranked by sales: 100 bestsellers take half of all sales, a few thousand titles take most of the rest, and 990,000 titles in the warehouse barely sell. Tail titles have too little data, so recommenders rarely show them.</desc>
