<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="598" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E1B4B">The Long-Tail Distribution</text>
  <text x="300" y="40" text-anchor="middle" font-size="11" fill="#6B7280">Most interactions concentrate on a few popular items</text>

  <!-- Axes -->
  <line x1="70" y1="50" x2="70" y2="220" stroke="#1E1B4B" stroke-width="1.5"/>
  <line x1="70" y1="220" x2="560" y2="220" stroke="#1E1B4B" stroke-width="1.5"/>

  <text x="30" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B" transform="rotate(-90, 30, 135)">Interactions</text>
  <text x="315" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Items (ranked by popularity)</text>

  <!-- Y-axis ticks -->
  <line x1="65" y1="70" x2="70" y2="70" stroke="#1E1B4B" stroke-width="1"/>
  <line x1="65" y1="120" x2="70" y2="120" stroke="#1E1B4B" stroke-width="1"/>
  <line x1="65" y1="170" x2="70" y2="170" stroke="#1E1B4B" stroke-width="1"/>

  <!-- Head boundary -->
  <line x1="168" y1="50" x2="168" y2="225" stroke="#1E1B4B" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="168" y="237" text-anchor="middle" font-size="11" fill="#6B7280">20%</text>

  <defs>
    <clipPath id="headClip">
      <rect x="70" y="50" width="98" height="170"/>
    </clipPath>
    <clipPath id="tailClip">
      <rect x="168" y="50" width="392" height="170"/>
    </clipPath>
  </defs>

  <!-- Head shading -->
  <path d="M70,220 L70,62 C85,62 95,65 105,72 C120,82 135,105 148,135 C158,158 163,180 168,200 L168,220 Z"
        fill="#10B981" fill-opacity="0.22"/>

  <!-- Tail shading -->
  <path d="M168,220 L168,200 C175,207 190,212 220,215 C260,217 320,218 400,219 C450,219 520,219.5 560,219.8 L560,220 Z"
        fill="#D97706" fill-opacity="0.2"/>

  <!-- Main curve -->
  <path d="M70,62 C85,62 95,65 105,72 C120,82 135,105 148,135 C158,158 163,180 168,200 C175,207 190,212 220,215 C260,217 320,218 400,219 C450,219 520,219.5 560,219.8"
        fill="none" stroke="#1E1B4B" stroke-width="2.5"/>

  <!-- Head label, positioned clear of the curve -->
  <g transform="translate(75, 143)">
    <rect x="0" y="0" width="72" height="72" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="36" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#10B981">Head</text>
    <text x="36" y="29" text-anchor="middle" font-size="11" fill="#1E1B4B">20% of</text>
    <text x="36" y="41" text-anchor="middle" font-size="11" fill="#1E1B4B">items</text>
    <text x="36" y="55" text-anchor="middle" font-size="11" fill="#1E1B4B">80% of</text>
    <text x="36" y="67" text-anchor="middle" font-size="11" fill="#1E1B4B">interactions</text>
  </g>

  <!-- Tail label -->
  <g transform="translate(290, 158)">
    <rect x="0" y="0" width="128" height="52" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="64" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97706">Long Tail</text>
    <text x="64" y="31" text-anchor="middle" font-size="11" fill="#1E1B4B">80% of items</text>
    <text x="64" y="45" text-anchor="middle" font-size="11" fill="#1E1B4B">20% of interactions</text>
  </g>

  <!-- Hidden-value insight -->
  <g transform="translate(430, 98)">
    <rect x="0" y="0" width="155" height="56" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="77.5" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">Hidden value</text>
    <text x="77.5" y="34" text-anchor="middle" font-size="11" fill="#1E1B4B">Niche items with highest</text>
    <text x="77.5" y="49" text-anchor="middle" font-size="11" fill="#1E1B4B">per-user satisfaction</text>
  </g>

  <!-- Arrow pointing to tail -->
  <g transform="translate(430, 158)">
    <path d="M55,0 Q35,20 20,35 Q10,45 0,55" fill="none" stroke="#EF4444" stroke-width="1.5"/>
    <polygon points="-3,52 0,60 3,52" fill="#EF4444" transform="rotate(-15, 0, 55)"/>
  </g>

  <!-- Bottom insight -->
  <rect x="85" y="260" width="430" height="30" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="300" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Good recommenders help users discover the tail, not just echo the head.</text>
</svg>