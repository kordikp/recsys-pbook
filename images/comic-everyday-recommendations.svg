<text x="24" y="178" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#6B7280">Skipped</tspan> cats</text>
<text x="24" y="202" font-size="15" fill="#1E1B4B"><tspan font-weight="700" fill="#065F46">Liked</tspan> pasta</text>

<path d="M160,127 L177,137 L160,147 Z" fill="#7C3AED"/>

