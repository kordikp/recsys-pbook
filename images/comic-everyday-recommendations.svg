<!-- takeaway -->
<text x="320" y="608" text-anchor="middle" font-size="16" fill="#1E1B4B"><tspan font-weight="700" fill="#7C3AED">Not mind reading:</tspan> your clicks, watches and skips decide what you see.</text>
