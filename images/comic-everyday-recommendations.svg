<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb069-title pb069-desc">
<title id="pb069-title">Your feed has been taking notes</title>
<desc id="pb069-desc">Four-panel comic. 1: You scroll a video app late at night while your feed, a purple character with a notepad, notes that you watched the pasta video to the end and skipped the cat video. 2: The notes (watched pasta, skipped cats, watched ramen, skipped cats, liked pasta) add up to a profile, for example cooking plus 3 and cats minus 2. 3: Your feed now shows pasta, ramen and curry; you ask how it knew, and the feed, hiding its notepad behind its back, says lucky guess. 4: Your colleague opens the same app and gets football, running and cycling: different notes, different feeds. Takeaway: it is not mind reading; your clicks, watches and skips decide what you see.</desc>

<rect x=".5" y=".5" width="639" height="629" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Your feed has been taking notes</text>

