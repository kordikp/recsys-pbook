<circle cx="219" cy="147" r="2.2" fill="#1E1B4B"/>
<circle cx="229" cy="147" r="2.2" fill="#1E1B4B"/>
<path d="M220,154 Q224,157 228,154" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

<!-- bubbles -->
