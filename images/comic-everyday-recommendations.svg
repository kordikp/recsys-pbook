<text x="200" y="65" text-anchor="middle" font-size="15" fill="#1E1B4B"><tspan x="200">Pasta: watched it all.</tspan><tspan x="200" dy="20">Cats: skipped.</tspan><tspan x="200" dy="20" font-weight="700" fill="#4C1D95">Noted.</tspan></text>

<text x="58" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">You</text>
<text x="226" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Your feed</text>
