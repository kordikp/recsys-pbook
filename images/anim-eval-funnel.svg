<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .dot{animation:travel 5s linear infinite}
    @keyframes travel{0%{transform:translate(0,0);opacity:0}8%{opacity:1}30%{transform:translate(155px,0)}55%{transform:translate(310px,0)}80%{transform:translate(465px,0)}92%{opacity:1}100%{transform:translate(560px,0);opacity:0}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">The Evaluation Funnel: Cheap Filters First</text>

  <!-- funnel stages -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="120" width="150" height="170" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="135" y="148" font-weight="700" fill="#4C1D95">Offline metrics</text>
    <text x="135" y="170" fill="#6B7280">recall · nDCG</text>
    <text x="135" y="272" font-weight="700" fill="#4C1D95">100 ideas</text>

    <rect x="215" y="140" width="150" height="150" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="290" y="168" font-weight="700" fill="#075985">Counterfactual</text>
    <text x="290" y="190" fill="#6B7280">replay on logs</text>
    <text x="290" y="272" font-weight="700" fill="#075985">20 survive</text>

    <rect x="370" y="160" width="150" height="130" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="445" y="188" font-weight="700" fill="#92400E">Interleaving</text>
    <text x="445" y="210" fill="#6B7280">mixed rankings</text>
    <text x="445" y="272" font-weight="700" fill="#92400E">6 survive</text>

    <rect x="525" y="180" width="150" height="110" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="600" y="208" font-weight="700" fill="#065F46">A/B test</text>
    <text x="600" y="230" fill="#6B7280">real users, weeks</text>
    <text x="600" y="272" font-weight="700" fill="#065F46">2 survive</text>

    <rect x="700" y="200" width="60" height="90" rx="10" fill="#1E1B4B"/>
    <text x="730" y="238" font-weight="800" fill="#FFFFFF">SHIP</text>
    <text x="730" y="260" fill="#C7D2FE" font-size="12">1</text>
  </g>
  <circle class="dot" cx="135" cy="330" r="7" fill="#7C3AED"/>
  <line x1="60" y1="330" x2="740" y2="330" stroke="#E5E7EB" stroke-width="2"/>
  <text x="400" y="398" text-anchor="middle" font-size="13" fill="#6B7280">Each stage is pricier and slower than the last — so each must earn the next. Most ideas die cheap.</text>
</svg>
