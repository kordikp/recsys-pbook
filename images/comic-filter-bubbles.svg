<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 626" role="img" aria-labelledby="pb075-title pb075-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb075-title">The usual keeps getting more usual</title>
<desc id="pb075-desc">Four-panel comic. Visit 1: you order pasta from a menu of six dishes and the waiter, who stands for the recommender, notes it. Visit 5: he has filtered the menu down to three dishes like it, and you find that thoughtful. Visit 20: the menu is just pasta; you sit happily inside a bubble saying the place really gets you, while five dishes are never shown to you. Visit 21: he passes one new dish, a curry, into the bubble next to your usual, and it becomes your new favourite. A filter bubble is more of the same until you cannot see what is missing; good recommenders mix in something new.</desc>
<rect x=".5" y=".5" width="639" height="625" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
