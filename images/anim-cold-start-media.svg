<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .stage{animation:st 7.5s ease-in-out infinite}
    .stage.s2{animation-delay:2.5s}.stage.s3{animation-delay:5s}
    @keyframes st{0%,33%,100%{stroke-width:2;transform:translateY(0)}5%,28%{stroke-width:3.5;transform:translateY(-4px)}}
    .note{animation:np 2.4s ease-in-out infinite}
    @keyframes np{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">A Brand-New Track Meets the Recommender</text>

  <g class="note"><text x="65" y="120" font-size="30">🎵</text></g>

  <g text-anchor="middle" font-size="12">
    <g class="stage">
    <rect x="110" y="80" width="190" height="150" rx="12" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="205" y="108" font-size="14" font-weight="800" fill="#4C1D95">1 · DAY ZERO</text>
    <text x="205" y="132" fill="#4C1D95">0 plays · 0 skips</text>
    <text x="205" y="152" fill="#6B7280">CF is blind — nobody</text>
    <text x="205" y="170" fill="#6B7280">co-listened to anything</text>
    <text x="205" y="196" fill="#4C1D95" font-weight="700">only metadata exists:</text>
    <text x="205" y="214" fill="#6B7280">"indie folk · slow · acoustic"</text>
    </g>
    <g class="stage s2">
    <rect x="330" y="80" width="190" height="150" rx="12" fill="#D1FAE5" stroke="#10B981"/>
    <text x="425" y="108" font-size="14" font-weight="800" fill="#065F46">2 · SOUND BRIDGE</text>
    <text x="425" y="132" fill="#065F46">audio + text embedding</text>
    <text x="425" y="152" fill="#6B7280">lands next to tracks</text>
    <text x="425" y="170" fill="#6B7280">that SOUND like it</text>
    <text x="425" y="196" fill="#065F46" font-weight="700">borrowed audience:</text>
    <text x="425" y="214" fill="#6B7280">folk-playlist listeners</text>
    </g>
    <g class="stage s3">
    <rect x="550" y="80" width="190" height="150" rx="12" fill="#FEF3C7" stroke="#D97706"/>
    <text x="645" y="108" font-size="14" font-weight="800" fill="#92400E">3 · FIRST WEEK</text>
    <text x="645" y="132" fill="#92400E">real plays &amp; saves arrive</text>
    <text x="645" y="152" fill="#6B7280">skips prune the wrong</text>
    <text x="645" y="170" fill="#6B7280">audience, saves confirm</text>
    <text x="645" y="196" fill="#92400E" font-weight="700">behavior takes over —</text>
    <text x="645" y="214" fill="#6B7280">CF wakes up</text>
    </g>
  </g>
  <g stroke="#9CA3AF" stroke-width="2" fill="none">
    <path d="M300 155 L326 155" marker-end="url(#ar)"/><path d="M520 155 L546 155" marker-end="url(#ar)"/>
  </g>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9CA3AF"/></marker></defs>

  <rect x="150" y="272" width="500" height="66" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="400" y="298" text-anchor="middle" font-size="13" fill="#1E1B4B" font-weight="600">content features carry the first days; behavior carries the rest</text>
  <text x="400" y="320" text-anchor="middle" font-size="12" fill="#6B7280">the hand-off is gradual — each play shifts weight from "sounds like" to "is loved by"</text>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">Same recipe as every cold start: borrow an audience through content, then let real reactions correct the guess.</text>
</svg>
