<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" aria-labelledby="pb006-title pb006-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb006-title">No plays yet, so the sound picks the playlist</title>
  <desc id="pb006-desc">A brand-new track has zero plays, so listening behavior says nothing about it. Its audio features (lo-fi, 72 bpm, instrumental) match the Deep Focus playlist and not Workout Hype, so it gets a trial spot in Deep Focus next to similar-sounding tracks. Then the first listener presses play, plays, skips and saves start flowing, and behavior takes over from the sound.</desc>
  <style>
    .pb006-a{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-out;animation-fill-mode:both}
    .pb006-glow{opacity:0;animation-name:pb006-glow}
    .pb006-match{animation-name:pb006-match}
    .pb006-miss{animation-name:pb006-miss}
    .pb006-place{animation-name:pb006-place}
    .pb006-slide{animation-name:pb006-slide}
    .pb006-listen{animation-name:pb006-listen}
    .pb006-ring{opacity:0;animation-name:pb006-ring}
    .pb006-over{animation-name:pb006-over}
    @keyframes pb006-glow{0%,4%{opacity:0}9%{opacity:1}18%,100%{opacity:0}}
    @keyframes pb006-match{0%,12%{opacity:0}18%,100%{opacity:1}}
    @keyframes pb006-miss{0%,17%{opacity:0}23%,100%{opacity:1}}
    @keyframes pb006-place{0%,22%{opacity:0}28%,100%{opacity:1}}
    @keyframes pb006-slide{0%,26%{opacity:0;transform:translateX(-36px)}34%,100%{opacity:1;transform:translateX(0)}}
    @keyframes pb006-listen{0%,37%{opacity:0}43%,100%{opacity:1}}
    @keyframes pb006-ring{0%,43%{opacity:0}46%{opacity:1}53%,100%{opacity:0}}
    @keyframes pb006-over{0%,48%{opacity:0}54%,100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.pb006-a{animation:none !important}}
  </style>
  <defs>
    <marker id="pb006-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
    <marker id="pb006-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="475" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="24" y="42" font-size="20" font-weight="700" fill="#1E1B4B">No plays yet, so the sound picks the playlist</text>

  <!-- ===== 1 · the new track ===== -->
  <rect x="24" y="62" width="216" height="258" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="46" cy="88" r="11" fill="#1E1B4B"/>
  <text x="46" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="64" y="94" font-size="17" font-weight="700" fill="#92400E">🎵 New track</text>

  <text x="40" y="132" font-size="15" fill="#4B5563">Who has played it?</text>
  <rect x="40" y="142" width="184" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="132" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#4B5563">0 plays so far 🦗</text>

  <text x="40" y="220" font-size="15" fill="#4B5563">What does it sound like?</text>
  <rect class="pb006-a pb006-glow" x="36" y="226" width="66" height="34" rx="17" fill="none" stroke="#F59E0B" stroke-width="5" stroke-opacity=".45"/>
  <rect class="pb006-a pb006-glow" x="102" y="226" width="82" height="34" rx="17" fill="none" stroke="#F59E0B" stroke-width="5" stroke-opacity=".45"/>
  <rect class="pb006-a pb006-glow" x="36" y="260" width="122" height="34" rx="17" fill="none" stroke="#F59E0B" stroke-width="5" stroke-opacity=".45"/>
  <g font-size="15" text-anchor="middle" fill="#92400E">
    <rect x="40" y="230" width="58" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="69" y="248">lo-fi</text>
    <rect x="106" y="230" width="74" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="143" y="248">72 bpm</text>
    <rect x="40" y="264" width="114" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="97" y="282">instrumental</text>
  </g>

  <!-- ===== 2 · matched by sound ===== -->
  <rect x="300" y="62" width="316" height="174" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="322" cy="88" r="11" fill="#1E1B4B"/>
  <text x="322" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="340" y="94" font-size="17" font-weight="700" fill="#1E1B4B">🎧 Deep Focus</text>
  <g class="pb006-a pb006-match">
    <rect x="484" y="76" width="120" height="24" rx="12" fill="#D1FAE5"/>
    <text x="544" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">✓ sounds alike</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#065F46">
    <rect x="316" y="108" width="58" height="26" rx="13" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <rect class="pb006-a pb006-match" x="316" y="108" width="58" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="345" y="126">lo-fi</text>
    <rect x="382" y="108" width="80" height="26" rx="13" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <rect class="pb006-a pb006-match" x="382" y="108" width="80" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="422" y="126">~70 bpm</text>
    <rect x="470" y="108" width="114" height="26" rx="13" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <rect class="pb006-a pb006-match" x="470" y="108" width="114" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="527" y="126">instrumental</text>
  </g>
  <!-- playlist rows: sibling, NEW, sibling -->
  <rect x="316" y="146" width="18" height="18" rx="4" fill="#EDE9FE"/>
  <rect x="344" y="152" width="170" height="6" rx="3" fill="#D1D5DB"/>
  <g class="pb006-a pb006-slide">
    <rect x="310" y="172" width="296" height="28" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="322" y="191" font-size="15" font-weight="700" fill="#92400E">🎵 New track</text>
    <text x="594" y="191" text-anchor="end" font-size="14" font-weight="600" fill="#92400E">trial spot</text>
  </g>
  <rect x="316" y="208" width="18" height="18" rx="4" fill="#EDE9FE"/>
  <rect x="344" y="214" width="140" height="6" rx="3" fill="#D1D5DB"/>

  <rect x="300" y="250" width="316" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="316" y="276" font-size="16" font-weight="700" fill="#4B5563">🏋️ Workout Hype</text>
  <text class="pb006-a pb006-miss" x="600" y="276" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280">✗ different</text>
  <g font-size="15" text-anchor="middle" fill="#4B5563">
    <rect x="316" y="286" width="52" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="342" y="304">EDM</text>
    <rect x="376" y="286" width="80" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="416" y="304">128 bpm</text>
    <rect x="464" y="286" width="68" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="498" y="304">vocals</text>
  </g>

  <!-- placement arrows: into Deep Focus; stopped before Workout Hype -->
  <path class="pb006-a pb006-place" d="M244,243 C272,243 276,186 302,186" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb006-arr-p)"/>
  <g class="pb006-a pb006-miss">
    <path d="M244,277 C262,277 266,285 278,285" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
    <circle cx="287" cy="285" r="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <path d="M283.5,281.5 L290.5,288.5 M290.5,281.5 L283.5,288.5" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ===== 3 · first play ===== -->
  <rect x="24" y="336" width="592" height="80" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="46" cy="362" r="11" fill="#1E1B4B"/>
  <text x="46" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <g class="pb006-a pb006-listen">
    <path d="M70,402 V392 Q70,380 86,380 Q102,380 102,392 V402 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="86" cy="364" r="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="82" cy="363" r="1.6" fill="#1E1B4B"/>
    <circle cx="90" cy="363" r="1.6" fill="#1E1B4B"/>
    <path d="M82,368 Q86,371 90,368" fill="none" stroke="#1E1B4B" stroke-width="1.5" stroke-linecap="round"/>
    <circle class="pb006-a pb006-ring" cx="126" cy="380" r="21" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity=".5"/>
    <circle cx="126" cy="380" r="15" fill="#10B981"/>
    <path d="M121,372 L133,380 L121,388 Z" fill="#FFFFFF"/>
    <text x="156" y="372" font-size="16" font-weight="700" fill="#065F46">The first listener presses play</text>
    <text x="156" y="396" font-size="15" fill="#4B5563">plays, skips and saves start flowing in</text>
  </g>
  <g class="pb006-a pb006-over">
    <line x1="452" y1="376" x2="472" y2="376" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb006-arr-g)"/>
    <rect x="480" y="348" width="124" height="56" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="542" y="371" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">now behavior</text>
    <text x="542" y="391" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">takes over</text>
  </g>

  <text x="320" y="452" text-anchor="middle" font-size="16" font-weight="600" fill="#1E1B4B">Sound gets it in the door; real plays decide if it stays.</text>
</svg>
