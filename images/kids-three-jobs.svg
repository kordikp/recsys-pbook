<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="pb156-title pb156-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pb156-title">The three jobs of a recommender</title>
  <desc id="pb156-desc">A recommender does three jobs: it helps you discover things you did not know existed, navigate a huge catalog by putting the few relevant items first, and engage you so you come back, which is good when it serves you and risky when it only maximizes your time.</desc>
  <defs>
    <marker id="pb156-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="459" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">The three jobs of a recommender</text>

  <!-- Row 1: Discover -->
  <g>
    <rect x="16" y="56" width="608" height="108" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="44" cy="84" r="14" fill="#7C3AED"/>
    <text x="44" y="89" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
    <text x="66" y="91" font-size="20" font-weight="700" fill="#1E1B4B">Discover</text>
    <text x="32" y="122" font-size="15" fill="#4B5563">what you didn't know</text>
    <text x="32" y="142" font-size="15" fill="#4B5563">existed</text>
    <line x1="204" y1="72" x2="204" y2="148" stroke="#E5E7EB" stroke-width="1.5"/>

    <text x="220" y="88" font-size="14" fill="#6B7280">You read</text>
    <rect x="220" y="96" width="142" height="36" rx="18" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="291" y="119" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">Karpathy's blog</text>
    <line x1="368" y1="114" x2="392" y2="114" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb156-arr)"/>
    <rect x="402" y="72" width="206" height="78" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="418" y="95" font-size="14" fill="#4C1D95">You might also like</text>
    <text x="418" y="117" font-size="15" font-weight="700" fill="#1E1B4B">Lilian Weng's writing</text>
    <text x="418" y="139" font-size="14" fill="#7C3AED">✨ new to you</text>
  </g>

  <!-- Row 2: Navigate -->
  <g>
    <rect x="16" y="176" width="608" height="108" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="44" cy="204" r="14" fill="#7C3AED"/>
    <text x="44" y="209" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
    <text x="66" y="211" font-size="20" font-weight="700" fill="#1E1B4B">Navigate</text>
    <text x="32" y="242" font-size="15" fill="#4B5563">the right few,</text>
    <text x="32" y="262" font-size="15" fill="#4B5563">first</text>
    <line x1="204" y1="192" x2="204" y2="268" stroke="#E5E7EB" stroke-width="1.5"/>

    <text x="220" y="206" font-size="14" fill="#6B7280">100 million tracks</text>
    <g fill="#E5E7EB">
      <rect x="220" y="216" width="10" height="10" rx="2"/><rect x="234" y="216" width="10" height="10" rx="2"/><rect x="248" y="216" width="10" height="10" rx="2"/><rect x="262" y="216" width="10" height="10" rx="2"/><rect x="276" y="216" width="10" height="10" rx="2"/><rect x="290" y="216" width="10" height="10" rx="2"/><rect x="304" y="216" width="10" height="10" rx="2"/><rect x="332" y="216" width="10" height="10" rx="2"/><rect x="346" y="216" width="10" height="10" rx="2"/>
      <rect x="220" y="230" width="10" height="10" rx="2"/><rect x="234" y="230" width="10" height="10" rx="2"/><rect x="262" y="230" width="10" height="10" rx="2"/><rect x="276" y="230" width="10" height="10" rx="2"/><rect x="290" y="230" width="10" height="10" rx="2"/><rect x="304" y="230" width="10" height="10" rx="2"/><rect x="318" y="230" width="10" height="10" rx="2"/><rect x="332" y="230" width="10" height="10" rx="2"/><rect x="346" y="230" width="10" height="10" rx="2"/>
      <rect x="220" y="244" width="10" height="10" rx="2"/><rect x="234" y="244" width="10" height="10" rx="2"/><rect x="248" y="244" width="10" height="10" rx="2"/><rect x="262" y="244" width="10" height="10" rx="2"/><rect x="276" y="244" width="10" height="10" rx="2"/><rect x="290" y="244" width="10" height="10" rx="2"/><rect x="304" y="244" width="10" height="10" rx="2"/><rect x="318" y="244" width="10" height="10" rx="2"/><rect x="332" y="244" width="10" height="10" rx="2"/><rect x="346" y="244" width="10" height="10" rx="2"/>
      <rect x="220" y="258" width="10" height="10" rx="2"/><rect x="234" y="258" width="10" height="10" rx="2"/><rect x="248" y="258" width="10" height="10" rx="2"/><rect x="262" y="258" width="10" height="10" rx="2"/><rect x="290" y="258" width="10" height="10" rx="2"/><rect x="304" y="258" width="10" height="10" rx="2"/><rect x="318" y="258" width="10" height="10" rx="2"/><rect x="332" y="258" width="10" height="10" rx="2"/><rect x="346" y="258" width="10" height="10" rx="2"/>
    </g>
    <g fill="#10B981">
      <rect x="318" y="216" width="10" height="10" rx="2"/>
      <rect x="248" y="230" width="10" height="10" rx="2"/>
      <rect x="276" y="258" width="10" height="10" rx="2"/>
    </g>
    <line x1="368" y1="242" x2="392" y2="242" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb156-arr)"/>
    <rect x="402" y="192" width="206" height="76" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="418" y="214" font-size="15" font-weight="700" fill="#4C1D95">Start here</text>
    <g font-size="15" font-weight="700" fill="#7C3AED">
      <text x="426" y="249">1</text><text x="480" y="249">2</text><text x="534" y="249">3</text>
    </g>
    <g fill="#10B981">
      <rect x="440" y="236" width="16" height="16" rx="3"/>
      <rect x="494" y="236" width="16" height="16" rx="3"/>
      <rect x="548" y="236" width="16" height="16" rx="3"/>
    </g>
    <text x="574" y="249" font-size="15" fill="#6B7280">…</text>
  </g>

  <!-- Row 3: Engage -->
  <g>
    <rect x="16" y="296" width="608" height="108" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="44" cy="324" r="14" fill="#7C3AED"/>
    <text x="44" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    <text x="66" y="331" font-size="20" font-weight="700" fill="#1E1B4B">Engage</text>
    <text x="32" y="362" font-size="15" fill="#4B5563">a reason to</text>
    <text x="32" y="382" font-size="15" fill="#4B5563">come back</text>
    <line x1="204" y1="312" x2="204" y2="388" stroke="#E5E7EB" stroke-width="1.5"/>

    <path d="M 281 338 A 20 20 0 1 1 268 323" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb156-arr)"/>
    <text x="261" y="390" text-anchor="middle" font-size="14" fill="#4B5563">you return</text>
    <rect x="304" y="310" width="304" height="38" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="318" y="334" font-size="15" fill="#065F46"><tspan font-weight="700">✓ Good:</tspan> things you're glad you found</text>
    <rect x="304" y="356" width="304" height="38" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="318" y="380" font-size="15" fill="#92400E"><tspan font-weight="700">⚠ Risky:</tspan> 2 a.m., “just one more…”</text>
  </g>

  <text x="320" y="438" text-anchor="middle" font-size="15" font-weight="600" fill="#1E1B4B">Shops lean on navigation, media on discovery, social feeds on engagement.</text>
</svg>
