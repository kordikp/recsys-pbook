<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb030-title pb030-desc">
  <title id="pb030-title">Same search, three different #1s</title>
  <desc id="pb030-desc">Toy example: Ana, Ben and Cleo type the same search, "best project management tool". If everyone got one list, a generic "Top 10 tools!!!" page would be #1 and your startup guide #50 for all three. With personalized ranking each person gets their own list: your guide is #1 for Ana, who runs a startup, and stays #50 for Ben and Cleo, while the old #1 is nobody's #1. There is no #1 for everyone to win; aim to be #1 for your audience.</desc>
  <style>
    .pb030-mv { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .pb030-p154 { animation-name: pb030-p154; }
    .pb030-p90 { animation-name: pb030-p90; }
    .pb030-p48 { animation-name: pb030-p48; }
    .pb030-m48 { animation-name: pb030-m48; }
    .pb030-m42 { animation-name: pb030-m42; }
    .pb030-m106 { animation-name: pb030-m106; }
    .pb030-knob { animation-name: pb030-knob; }
    .pb030-lthen { animation-name: pb030-lthen; }
    .pb030-lnow { animation-name: pb030-lnow; }
    @keyframes pb030-p154 { 0%, 25% { transform: translateY(154px); opacity: 1 } 29% { transform: translateY(142px); opacity: 0 } 31% { transform: translateY(12px); opacity: 0 } 37%, 100% { transform: translateY(0); opacity: 1 } }
    @keyframes pb030-p90 { 0%, 25% { transform: translateY(90px); opacity: 1 } 29% { transform: translateY(83px); opacity: 0 } 31% { transform: translateY(7px); opacity: 0 } 37%, 100% { transform: translateY(0); opacity: 1 } }
    @keyframes pb030-p48 { 0%, 25% { transform: translateY(48px); opacity: 1 } 29% { transform: translateY(44px); opacity: 0 } 31% { transform: translateY(4px); opacity: 0 } 37%, 100% { transform: translateY(0); opacity: 1 } }
    @keyframes pb030-m48 { 0%, 25% { transform: translateY(-48px); opacity: 1 } 29% { transform: translateY(-44px); opacity: 0 } 31% { transform: translateY(-4px); opacity: 0 } 37%, 100% { transform: translateY(0); opacity: 1 } }
    @keyframes pb030-m42 { 0%, 25% { transform: translateY(-42px); opacity: 1 } 29% { transform: translateY(-39px); opacity: 0 } 31% { transform: translateY(-3px); opacity: 0 } 37%, 100% { transform: translateY(0); opacity: 1 } }
    @keyframes pb030-m106 { 0%, 25% { transform: translateY(-106px); opacity: 1 } 29% { transform: translateY(-98px); opacity: 0 } 31% { transform: translateY(-8px); opacity: 0 } 37%, 100% { transform: translateY(0); opacity: 1 } }
    @keyframes pb030-knob { 0%, 25% { transform: translateX(-142px) } 33%, 100% { transform: translateX(0) } }
    @keyframes pb030-lthen { 0%, 25% { fill: #4C1D95 } 33%, 100% { fill: #6B7280 } }
    @keyframes pb030-lnow { 0%, 25% { fill: #6B7280 } 33%, 100% { fill: #4C1D95 } }
    @media (prefers-reduced-motion: reduce) { .pb030-mv { animation: none !important; } }
  </style>

  <rect x=".5" y=".5" width="639" height="455" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <!-- title -->
  <text x="24" y="42" font-size="20" font-weight="700" fill="#1E1B4B">Same search, three different #1s</text>
  <text x="24" y="66" font-size="14" fill="#6B7280">Toy example · each list is ranked for one person</text>

  <!-- the query -->
  <rect x="24" y="82" width="290" height="36" rx="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <circle cx="45" cy="98" r="6" fill="none" stroke="#6B7280" stroke-width="2"/>
  <line x1="49.5" y1="102.5" x2="54" y2="107" stroke="#6B7280" stroke-width="2.2" stroke-linecap="round"/>
  <text x="64" y="105" font-size="15" fill="#1E1B4B">best project management tool</text>

  <!-- then / now switch -->
  <rect x="330" y="82" width="290" height="36" rx="18" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <g class="pb030-mv pb030-knob">
    <rect x="475" y="85" width="142" height="30" rx="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text class="pb030-mv pb030-lthen" x="404" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#6B7280">Then: same list</text>
  <text class="pb030-mv pb030-lnow" x="546" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">Now: per person</text>

  <!-- people -->
  <g>
    <rect x="68" y="134" width="176" height="56" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="88" cy="152" r="7" fill="#10B981"/>
    <path d="M77,176 Q77,163 88,163 Q99,163 99,176 Z" fill="#10B981"/>
    <text x="108" y="157" font-size="16" font-weight="700" fill="#1E1B4B">Ana</text>
    <text x="108" y="178" font-size="14" fill="#4B5563">runs a startup</text>

    <rect x="256" y="134" width="176" height="56" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="276" cy="152" r="7" fill="#10B981"/>
    <path d="M265,176 Q265,163 276,163 Q287,163 287,176 Z" fill="#10B981"/>
    <text x="296" y="157" font-size="16" font-weight="700" fill="#1E1B4B">Ben</text>
    <text x="296" y="178" font-size="14" fill="#4B5563">IT lead, big bank</text>

    <rect x="444" y="134" width="176" height="56" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="464" cy="152" r="7" fill="#10B981"/>
    <path d="M453,176 Q453,163 464,163 Q475,163 475,176 Z" fill="#10B981"/>
    <text x="484" y="157" font-size="16" font-weight="700" fill="#1E1B4B">Cleo</text>
    <text x="484" y="178" font-size="14" fill="#4B5563">student, on mobile</text>
  </g>

  <!-- the #1 row -->
  <rect x="18" y="200" width="610" height="46" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>

  <!-- rank gutter -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="42" y="229" fill="#4C1D95">#1</text>
    <text x="42" y="277" fill="#6B7280">#2</text>
    <text x="42" y="319" fill="#6B7280">#3</text>
    <text x="42" y="350" fill="#9CA3AF">⋮</text>
    <text x="42" y="383" fill="#6B7280">#50</text>
  </g>
  <g font-size="16" fill="#9CA3AF" text-anchor="middle">
    <text x="156" y="350">⋮</text>
    <text x="344" y="350">⋮</text>
    <text x="532" y="350">⋮</text>
  </g>

  <!-- Ana's list (final: guide, top10, student, enterprise) -->
  <g font-size="15">
    <g class="pb030-mv pb030-m48">
      <rect x="68" y="254" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="80" y="276" fill="#1E1B4B">Top 10 tools!!!</text>
    </g>
    <g>
      <rect x="68" y="296" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="80" y="318" fill="#1E1B4B">Free student apps</text>
    </g>
    <g class="pb030-mv pb030-m106">
      <rect x="68" y="360" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="80" y="382" fill="#1E1B4B">Enterprise suites</text>
    </g>
    <g class="pb030-mv pb030-p154">
      <rect x="68" y="206" width="176" height="34" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="80" y="228" font-weight="700" fill="#92400E">Your startup guide</text>
    </g>
  </g>

  <!-- Ben's list (final: enterprise, top10, student, guide) -->
  <g font-size="15">
    <g class="pb030-mv pb030-m48">
      <rect x="256" y="254" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="268" y="276" fill="#1E1B4B">Top 10 tools!!!</text>
    </g>
    <g class="pb030-mv pb030-p48">
      <rect x="256" y="206" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="268" y="228" fill="#1E1B4B">Enterprise suites</text>
    </g>
    <g>
      <rect x="256" y="296" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="268" y="318" fill="#1E1B4B">Free student apps</text>
    </g>
    <g>
      <rect x="256" y="360" width="176" height="34" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="268" y="382" font-weight="700" fill="#92400E">Your startup guide</text>
    </g>
  </g>

  <!-- Cleo's list (final: student, top10, enterprise, guide) -->
  <g font-size="15">
    <g class="pb030-mv pb030-m48">
      <rect x="444" y="254" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="456" y="276" fill="#1E1B4B">Top 10 tools!!!</text>
    </g>
    <g class="pb030-mv pb030-m42">
      <rect x="444" y="296" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="456" y="318" fill="#1E1B4B">Enterprise suites</text>
    </g>
    <g class="pb030-mv pb030-p90">
      <rect x="444" y="206" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="456" y="228" fill="#1E1B4B">Free student apps</text>
    </g>
    <g>
      <rect x="444" y="360" width="176" height="34" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="456" y="382" font-weight="700" fill="#92400E">Your startup guide</text>
    </g>
  </g>

  <!-- takeaway -->
  <text x="320" y="432" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">No #1 for everyone anymore — <tspan fill="#92400E">be #1 for your audience.</tspan></text>
</svg>
