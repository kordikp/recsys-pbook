<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .fade{animation:f 6s ease-in-out infinite}
    @keyframes f{0%,40%,100%{opacity:1}55%,85%{opacity:.45}}
    .rise2{animation:r2 6s ease-in-out infinite}
    @keyframes r2{0%,40%{opacity:.45}55%,85%,100%{opacity:1}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">SEO Grew Up: From Keywords to Being Recommendable</text>

  <g class="fade" text-anchor="middle" font-size="12.5">
    <rect x="60" y="80" width="310" height="250" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
    <text x="215" y="110" font-size="15" font-weight="800" fill="#4B5563">OLD GAME · rank in search</text>
    <rect x="85" y="130" width="260" height="36" rx="8" fill="#F3F4F6"/><text x="215" y="153" fill="#4B5563">keywords in title &amp; headers</text>
    <rect x="85" y="176" width="260" height="36" rx="8" fill="#F3F4F6"/><text x="215" y="199" fill="#4B5563">backlinks as votes</text>
    <rect x="85" y="222" width="260" height="36" rx="8" fill="#F3F4F6"/><text x="215" y="245" fill="#4B5563">one ranking for everyone</text>
    <text x="215" y="300" fill="#6B7280">optimize for the CRAWLER</text>
  </g>

  <g class="rise2" text-anchor="middle" font-size="12.5">
    <rect x="430" y="80" width="310" height="250" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="585" y="110" font-size="15" font-weight="800" fill="#4C1D95">NEW GAME · get recommended</text>
    <rect x="455" y="130" width="260" height="36" rx="8" fill="#FFFFFF" stroke="#7C3AED"/><text x="585" y="153" fill="#4C1D95">clean metadata → good embeddings</text>
    <rect x="455" y="176" width="260" height="36" rx="8" fill="#FFFFFF" stroke="#7C3AED"/><text x="585" y="199" fill="#4C1D95">early engagement quality</text>
    <rect x="455" y="222" width="260" height="36" rx="8" fill="#FFFFFF" stroke="#7C3AED"/><text x="585" y="245" fill="#4C1D95">a ranking PER user</text>
    <text x="585" y="300" fill="#4C1D95">optimize for the FEED + LLM answers</text>
  </g>
  <path d="M375 205 L425 205" stroke="#7C3AED" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker></defs>
  <text x="400" y="375" text-anchor="middle" font-size="13" fill="#6B7280">There is no single result page to win anymore — you're ranked separately in a million private feeds.</text>
</svg>
