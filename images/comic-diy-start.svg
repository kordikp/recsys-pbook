<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="pb063-title pb063-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb063-title">Before you code, take their order</title>
<desc id="pb063-desc">Four-panel comic: you build a recommender by hand. 1 Collect data: like a waiter with a notepad you ask Mina, Leo and Sam which snacks they like; Mina has not tried pretzels yet. 2 Find similar users: Leo gave the same answers as Mina on 3 of 3 snacks, Sam on 0 of 3, so Leo is her taste twin. 3 Make a prediction: Leo likes pretzels, so Mina probably will too. 4 Test and improve: Mina tries them and asks how you knew; you answer: Leo, and a pen. Check every guess, fix the misses, repeat. Code later does the same four steps, faster.</desc>
<defs><marker id="pb063-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker></defs>
<rect x=".5" y=".5" width="639" height="639" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="32" font-size="19" font-weight="700" fill="#1E1B4B" text-anchor="middle">Before you code, take their order</text>
