<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .gap{animation:g 5s ease-in-out infinite}
    @keyframes g{0%,20%,100%{opacity:.35}50%,85%{opacity:1}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Engagement Up, Satisfaction Flat: Mind the Gap</text>

  <g stroke="#9CA3AF" stroke-width="1.5"><line x1="90" y1="320" x2="740" y2="320"/><line x1="90" y1="320" x2="90" y2="80"/></g>
  <text x="415" y="348" text-anchor="middle" font-size="12" fill="#6B7280">months of optimizing for clicks →</text>
  <text x="74" y="200" text-anchor="middle" font-size="12" fill="#6B7280" transform="rotate(-90 74 200)">metric value</text>

  <path d="M90 300 C220 270 360 200 500 150 C600 118 680 100 730 92" fill="none" stroke="#D97706" stroke-width="3.5"/>
  <text x="600" y="88" font-size="13" font-weight="700" fill="#92400E">engagement (time spent)</text>

  <path d="M90 302 C220 282 340 258 460 252 C580 248 670 252 730 258" fill="none" stroke="#10B981" stroke-width="3.5"/>
  <text x="600" y="286" font-size="13" font-weight="700" fill="#065F46">satisfaction (surveys)</text>

  <g class="gap">
    <path d="M660 100 L660 250" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="560" y="160" width="196" height="40" rx="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="658" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B91C1C">the gap = addiction risk,</text>
    <text x="658" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B91C1C">churn stored for later</text>
  </g>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#6B7280">People kept scrolling — and liked it less. If you only chart engagement, this failure looks like success.</text>
</svg>
