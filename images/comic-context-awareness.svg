<g id="pb051-cake"><path d="M2.5,21 H21.5 V9 L2.5,15.5 Z" fill="#FEF3C7" stroke="#92400E" stroke-width="1.8" stroke-linejoin="round"/><path d="M2.5,15.5 L21.5,9 V12.5 L2.5,18.5 Z" fill="#FFFFFF" stroke="#92400E" stroke-width="1.2" stroke-linejoin="round"/><circle cx="16.5" cy="7.2" r="2.6" fill="#92400E"/></g>
