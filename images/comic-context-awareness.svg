<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 632" role="img" aria-labelledby="pb051-title pb051-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb051-title">Same regular, different right now</title>
<desc id="pb051-desc">Comic. At 4:59 pm a café regular working on her laptop happily gets her usual coffee from the barista, who stands for the recommender. One second later, at 5:00 pm, she is on her phone with a date, and the barista offers coffee again; she answers: a second ago, sure, now it is date night. Below, three ways the recommender can use the moment "5 pm, date": a pre-filter drops coffee from the menu before ranking; a contextual model takes the moment as an input to the ranking, so wine ranks first and coffee last; a post-filter ranks as usual with coffee first, then drops coffee. All three serve wine. Takeaway: same tastes, different moment; use context before, inside or after ranking.</desc>
<defs>
<marker id="pb051-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/></marker>
