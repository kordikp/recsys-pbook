<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="pb146-title pb146-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb146-title">Every pick is relevant, yet the feed goes stale</title>
<desc id="pb146-desc">Toy example: over twelve weeks a viewer's feed narrows from three genres to thrillers only. Every pick still matches their taste, yet clicks on thrillers fall from 40% to 15% and the viewer starts searching instead. Monotony, not inaccuracy, causes fatigue.</desc>
<rect x=".5" y=".5" width="639" height="469" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
<text x="320" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Every pick is relevant. The feed still goes stale.</text>
<text x="320" y="64" text-anchor="middle" font-size="14" fill="#4B5563">One viewer's “For you” feed · <tspan fill="#047857" font-weight="700">✓</tspan> = fits their taste · toy numbers</text>
<g id="pb146-col1">
<rect x="24" y="80" width="136" height="204" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="92" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Week 1</text>
<text x="92" y="123" text-anchor="middle" font-size="14" fill="#4B5563">3 genres</text>
<g><rect x="36" y="134" width="112" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="46" y="153" font-size="15" font-weight="600" fill="#4C1D95">Thriller</text>
<text x="138" y="153" text-anchor="end" font-size="15" font-weight="700" fill="#047857">✓</text>
<rect x="36" y="170" width="112" height="28" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="46" y="189" font-size="15" fill="#1E1B4B">Comedy</text>
<text x="138" y="189" text-anchor="end" font-size="15" font-weight="700" fill="#047857">✓</text>
<rect x="36" y="206" width="112" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="46" y="225" font-size="15" font-weight="600" fill="#4C1D95">Thriller</text>
<text x="138" y="225" text-anchor="end" font-size="15" font-weight="700" fill="#047857">✓</text>
<rect x="36" y="242" width="112" height="28" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="46" y="261" font-size="15" fill="#1E1B4B">Drama</text>
<text x="138" y="261" text-anchor="end" font-size="15" font-weight="700" fill="#047857">✓</text>
</g></g>
<rect class="pb146-bar" x="64" y="344" width="56" height="64" rx="4" fill="#FCD34D"/>
<text x="92" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">40%</text>
<g id="pb146-col2">
<rect x="176" y="80" width="136" height="204" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
