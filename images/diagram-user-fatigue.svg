</g><path d="M498,170 H598 Q608,170 608,180 V214 Q608,224 598,224 H558 L548,236 L542,224 H498 Q488,224 488,214 V180 Q488,170 498,170 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
<text x="548" y="192" text-anchor="middle" font-size="15" fill="#1E1B4B">Skip, skip…</text>
<text x="548" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">I'll search.</text>
</g>
<rect class="pb146-bar" x="520" y="384" width="56" height="24" rx="4" fill="#F59E0B"/>
<text x="548" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">15%</text>
<text x="24" y="314" font-size="15" font-weight="700" fill="#1E1B4B">Clicks on thriller picks <tspan font-weight="400" fill="#4B5563">(e.g.)</tspan></text>
<line x1="24" y1="408" x2="616" y2="408" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="320" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Nothing got <tspan fill="#047857">less accurate</tspan>. The <tspan fill="#B45309">sameness</tspan> wore the viewer out.</text>
</svg>
