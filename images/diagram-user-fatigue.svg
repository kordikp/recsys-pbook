<text x="244" y="123" text-anchor="middle" font-size="14" fill="#4B5563">2 genres</text>
<g><rect x="188" y="134" width="112" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="198" y="153" font-size="15" font-weight="600" fill="#4C1D95">Thriller</text>
