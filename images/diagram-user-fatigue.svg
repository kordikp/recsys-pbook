<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 325" width="550" height="325" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="fatigueFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <marker id="arrIntervention" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="548" height="323" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="275" y="27" text-anchor="middle" fill="#1E1B4B" font-size="14" font-weight="700">User Fatigue Timeline</text>

  <!-- Zone backgrounds -->
  <rect x="65" y="45" width="135" height="195" fill="#D1FAE5" opacity="0.5"/>
  <rect x="200" y="45" width="120" height="195" fill="#D1FAE5" opacity="0.28"/>
  <rect x="320" y="45" width="190" height="195" fill="#FEE2E2" opacity="0.36"/>

  <!-- Grid lines -->
  <line x1="65" y1="80" x2="510" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="120" x2="510" y2="120" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="160" x2="510" y2="160" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="200" x2="510" y2="200" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Zone dividers -->
  <line x1="200" y1="45" x2="200" y2="240" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="45" x2="320" y2="240" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Axes -->
  <line x1="65" y1="45" x2="65" y2="240" stroke="#1E1B4B" stroke-width="1.5"/>
  <line x1="65" y1="240" x2="510" y2="240" stroke="#1E1B4B" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="22" y="145" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600" transform="rotate(-90 22 145)">Engagement</text>
  <text x="57" y="58" text-anchor="end" fill="#6B7280" font-size="11">High</text>
  <text x="57" y="240" text-anchor="end" fill="#6B7280" font-size="11">Low</text>

  <!-- Fill under curve -->
  <path d="M65,220 Q100,210 130,170 Q160,110 200,75 Q240,60 270,62 Q300,65 320,72 Q350,85 380,120 Q410,160 440,190 Q470,210 510,225 L510,240 L65,240 Z" fill="url(#fatigueFill)" opacity="0.14"/>

  <!-- Fatigue curve -->
  <path d="M65,220 Q100,210 130,170 Q160,110 200,75 Q240,60 270,62 Q300,65 320,72" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <path d="M320,72 Q350,85 380,120 Q410,160 440,190 Q470,210 510,225" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Sweet spot marker -->
  <circle cx="265" cy="62" r="5" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="265" y="50" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">Sweet spot</text>

  <!-- Intervention annotation -->
  <rect x="333" y="52" width="124" height="25" rx="12.5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="395" y="69" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">Inject diversity here</text>
  <line x1="380" y1="78" x2="380" y2="115" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrIntervention)" stroke-dasharray="3 2"/>

  <!-- Examples -->
  <text x="110" y="145" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">User discovers</text>
  <text x="110" y="159" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">new content</text>

  <text x="450" y="166" text-anchor="middle" fill="#EF4444" font-size="11" font-weight="600">Same items</text>
  <text x="450" y="180" text-anchor="middle" fill="#EF4444" font-size="11" font-weight="600">repeated</text>

  <!-- Zone labels -->
  <text x="132" y="257" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">Discovery</text>
  <text x="260" y="257" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">Peak Engagement</text>
  <text x="415" y="257" text-anchor="middle" fill="#EF4444" font-size="11" font-weight="700">Fatigue</text>

  <!-- X axis -->
  <text x="287" y="279" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Time / Repeated Exposure</text>

  <!-- Bottom insight -->
  <rect x="55" y="289" width="440" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="275" y="307" text-anchor="middle" fill="#6B7280" font-size="11">Increasing diversity before fatigue sets in improves long-term engagement</text>
</svg>