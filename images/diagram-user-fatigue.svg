<text x="290" y="225" text-anchor="end" font-size="15" font-weight="700" fill="#047857">✓</text>
<rect x="188" y="242" width="112" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="198" y="261" font-size="15" font-weight="600" fill="#4C1D95">Thriller</text>
<text x="290" y="261" text-anchor="end" font-size="15" font-weight="700" fill="#047857">✓</text>
</g></g>
