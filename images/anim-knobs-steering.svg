<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pb018-title pb018-desc">
  <title id="pb018-title">Steering knobs: an SAE turns a tangled user vector into named neurons you can boost</title>
  <desc id="pb018-desc">A collaborative-filtering autoencoder squeezes a user's history into a dense vector whose 256 dimensions each blend many tastes. A sparse autoencoder rewrites it as thousands of neurons of which only a few fire, and each active one means one thing (Tarantino, Studio Ghibli, true crime, romantic), named afterwards from tags. In a toy date-night example, boosting the romantic neuron and dampening true crime, then decoding with the unchanged decoder, lifts Notting Hill from 3rd to 1st and drops Making a Murderer from 1st to 3rd: steering without retraining.</desc>
  <style>
    .pb018-anim { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .pb018-move { transform-box: fill-box; transform-origin: 0 50%; }
    .pb018-kb { animation-name: pb018-kb; }
    .pb018-fb { animation-name: pb018-fb; }
    .pb018-kd { animation-name: pb018-kd; }
    .pb018-fd { animation-name: pb018-fd; }
    .pb018-draw { stroke-dasharray: 100 100; animation-name: pb018-draw; }
    .pb018-after { animation-name: pb018-after; }
    .pb018-head { animation-name: pb018-head; }
    @keyframes pb018-kb { 0%, 8% { transform: translateX(-102.4px) } 28%, 100% { transform: translateX(0) } }
    @keyframes pb018-fb { 0%, 8% { transform: scaleX(0.111) } 28%, 100% { transform: scaleX(1) } }
    @keyframes pb018-kd { 0%, 8% { transform: translateX(83.2px) } 28%, 100% { transform: translateX(0) } }
    @keyframes pb018-fd { 0%, 8% { transform: scaleX(4.25) } 28%, 100% { transform: scaleX(1) } }
    @keyframes pb018-draw { 0%, 30% { stroke-dashoffset: 100 } 44%, 100% { stroke-dashoffset: 0 } }
    @keyframes pb018-head { 0%, 40% { opacity: 0 } 44%, 100% { opacity: 1 } }
    @keyframes pb018-after { 0%, 30% { opacity: 0 } 42%, 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .pb018-anim { animation: none !important; } }
  </style>
  <defs>
    <marker id="pb018-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="639" height="495" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="24" y="38" font-size="19" font-weight="700" fill="#1E1B4B">An SAE turns a tangled vector into knobs</text>
  <text x="24" y="60" font-size="14" fill="#6B7280">Toy example: date night for a true-crime fan</text>

  <!-- ===== 1 · Knots: the dense embedding ===== -->
  <rect x="16" y="76" width="180" height="210" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="106" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1B4B">1 · Knots</text>
  <text x="106" y="124" text-anchor="middle" font-size="14" fill="#6B7280">dense z · 256 dims</text>
  <line x1="30" y1="186" x2="182" y2="186" stroke="#D1D5DB" stroke-width="1.5"/>
  <g fill="#9CA3AF">
    <rect x="36" y="164.4" width="8" height="21.6" rx="2"/>
    <rect x="48" y="186" width="8" height="14.4" rx="2"/>
    <rect x="60" y="157.2" width="8" height="28.8" rx="2"/>
    <rect x="72" y="186" width="8" height="25.2" rx="2"/>
    <rect x="84" y="175.2" width="8" height="10.8" rx="2"/>
    <rect x="96" y="153.6" width="8" height="32.4" rx="2"/>
    <rect x="108" y="186" width="8" height="18" rx="2"/>
    <rect x="120" y="178.8" width="8" height="7.2" rx="2"/>
    <rect x="132" y="186" width="8" height="28.8" rx="2"/>
    <rect x="144" y="168" width="8" height="18" rx="2"/>
    <rect x="156" y="186" width="8" height="10.8" rx="2"/>
    <rect x="168" y="160.8" width="8" height="25.2" rx="2"/>
  </g>
  <text x="106" y="248" text-anchor="middle" font-size="15" fill="#1E1B4B">every dim blends</text>
  <text x="106" y="268" text-anchor="middle" font-size="15" fill="#1E1B4B">many tastes</text>

  <!-- arrow: SAE encode -->
  <line x1="204" y1="181" x2="246" y2="181" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb018-arr-p)"/>
  <text x="226" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">SAE</text>
  <text x="226" y="203" text-anchor="middle" font-size="14" fill="#6B7280">encode</text>

  <!-- ===== 2 · Knobs: the sparse code ===== -->
  <rect x="256" y="76" width="368" height="210" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="440" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1B4B">2 · Knobs</text>
  <text x="440" y="124" text-anchor="middle" font-size="14" fill="#4B5563">sparse z · neurons named afterwards, via tags</text>

  <g font-size="15" fill="#1E1B4B">
    <text x="276" y="156">Tarantino</text>
    <text x="276" y="182">Studio Ghibli</text>
    <text x="276" y="208" fill="#6B7280">true crime</text>
    <text x="276" y="234" font-weight="700" fill="#065F46">romantic</text>
  </g>
  <!-- tracks -->
  <g fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1">
    <rect x="388" y="148" width="128" height="6" rx="3"/>
    <rect x="388" y="174" width="128" height="6" rx="3"/>
    <rect x="388" y="200" width="128" height="6" rx="3"/>
    <rect x="388" y="226" width="128" height="6" rx="3"/>
  </g>
  <!-- fills + knobs (unchanged) -->
  <rect x="388" y="148" width="70.4" height="6" rx="3" fill="#7C3AED"/>
  <circle cx="458.4" cy="151" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="388" y="174" width="44.8" height="6" rx="3" fill="#7C3AED"/>
  <circle cx="432.8" cy="177" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
  <!-- true crime: dampened (ghost = old value) -->
  <circle cx="496.8" cy="203" r="7" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="3 2.5"/>
  <rect class="pb018-anim pb018-move pb018-fd" x="388" y="200" width="25.6" height="6" rx="3" fill="#7C3AED"/>
  <circle class="pb018-anim pb018-kd" cx="413.6" cy="203" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
  <!-- romantic: boosted (ghost = old value) -->
  <circle cx="400.8" cy="229" r="7" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="3 2.5"/>
  <rect class="pb018-anim pb018-move pb018-fb" x="388" y="226" width="115.2" height="6" rx="3" fill="#7C3AED"/>
  <circle class="pb018-anim pb018-kb" cx="503.2" cy="229" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
  <!-- the user's steer -->
  <rect x="526" y="192" width="88" height="22" rx="11" fill="#D1FAE5" stroke="#10B981" stroke-width="1.2"/>
  <text x="570" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">▼ dampen</text>
  <rect x="526" y="218" width="88" height="22" rx="11" fill="#D1FAE5" stroke="#10B981" stroke-width="1.2"/>
  <text x="570" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">▲ boost</text>
  <!-- the silent majority -->
  <text x="276" y="264" font-size="14" fill="#6B7280">thousands more</text>
  <g fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.2">
    <circle cx="392" cy="259" r="3"/><circle cx="403.5" cy="259" r="3"/><circle cx="415" cy="259" r="3"/>
    <circle cx="426.5" cy="259" r="3"/><circle cx="438" cy="259" r="3"/><circle cx="449.5" cy="259" r="3"/>
    <circle cx="461" cy="259" r="3"/><circle cx="472.5" cy="259" r="3"/><circle cx="484" cy="259" r="3"/>
    <circle cx="495.5" cy="259" r="3"/><circle cx="507" cy="259" r="3"/>
  </g>
  <text x="530" y="264" font-size="14" fill="#6B7280">all at 0</text>

  <!-- arrow: decode -->
  <line x1="440" y1="292" x2="440" y2="314" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#pb018-arr-p)"/>
  <text x="452" y="309" font-size="14" fill="#4C1D95">decode</text>

  <!-- ===== 3 · Ranking ===== -->
  <rect x="16" y="322" width="608" height="128" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="106" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1B4B">3 · Ranking</text>
  <text x="106" y="386" text-anchor="middle" font-size="14" fill="#4B5563">same CFAE decoder</text>
  <text x="106" y="406" text-anchor="middle" font-size="14" fill="#4B5563">🔒 not retrained</text>

  <text x="216" y="350" font-size="14" fill="#6B7280">before</text>
  <g font-size="15" fill="#6B7280">
    <text x="216" y="378">1</text><text x="234" y="378">Making a Murderer</text>
    <text x="216" y="402">2</text><text x="234" y="402">Pulp Fiction</text>
    <text x="216" y="426">3</text><text x="234" y="426">Notting Hill</text>
  </g>

  <line x1="376" y1="397" x2="450" y2="397" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
  <path class="pb018-anim pb018-draw" pathLength="100" d="M376,373 L446,419" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
  <path class="pb018-anim pb018-head" d="M449.3,421.2 L438.3,419.9 L443.7,411.5 Z" fill="#9CA3AF"/>
  <path class="pb018-anim pb018-draw" pathLength="100" d="M376,421 L446,375" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <path class="pb018-anim pb018-head" d="M449.3,372.8 L443.7,382.5 L438.2,374.1 Z" fill="#10B981"/>

  <g class="pb018-anim pb018-after">
    <text x="462" y="350" font-size="14" font-weight="700" fill="#065F46">after: date night</text>
    <text x="462" y="378" font-size="15" font-weight="700" fill="#065F46">1</text><text x="480" y="378" font-size="15" font-weight="700" fill="#065F46">Notting Hill</text>
    <text x="462" y="402" font-size="15" fill="#1E1B4B">2</text><text x="480" y="402" font-size="15" fill="#1E1B4B">Pulp Fiction</text>
    <text x="462" y="426" font-size="15" fill="#6B7280">3</text><text x="480" y="426" font-size="15" fill="#6B7280">Making a Murderer</text>
  </g>

  <!-- takeaway -->
  <text x="320" y="478" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Turn <tspan fill="#7C3AED">one neuron</tspan> up, decode as usual: <tspan fill="#047857">the ranking follows</tspan>.</text>
</svg>
