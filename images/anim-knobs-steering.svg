<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,sans-serif">
  <style>
    .knob{animation:kn 5s ease-in-out infinite}
    @keyframes kn{0%,20%{transform:translateX(0)}50%,80%{transform:translateX(96px)}100%{transform:translateX(0)}}
    .resA{animation:ra 5s ease-in-out infinite}
    @keyframes ra{0%,20%{opacity:1}50%,80%{opacity:.35}100%{opacity:1}}
    .resB{animation:rb 5s ease-in-out infinite}
    @keyframes rb{0%,20%{opacity:.35}50%,80%{opacity:1}100%{opacity:.35}}
  </style>
  <rect width="800" height="420" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">From Black-Box Vector to Knobs You Can Turn</text>

  <!-- dense vector -->
  <text x="150" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#4B5563">dense user embedding</text>
  <g>
    <rect x="70" y="98" width="160" height="30" rx="7" fill="#E5E7EB" stroke="#9CA3AF"/>
    <text x="150" y="118" text-anchor="middle" font-size="11" fill="#6B7280">0.21 −0.77 0.04 0.93 …</text>
  </g>
  <text x="150" y="150" text-anchor="middle" font-size="11.5" fill="#B91C1C">meaningful to the model, opaque to you</text>

  <path d="M240 113 L300 113" stroke="#7C3AED" stroke-width="3" marker-end="url(#k)"/>
  <defs><marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker></defs>
  <text x="270" y="98" text-anchor="middle" font-size="11.5" fill="#4C1D95">SAE</text>

  <!-- knobs panel -->
  <rect x="310" y="70" width="220" height="180" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="420" y="96" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4C1D95">interpretable knobs</text>
  <g font-size="12" fill="#4C1D95">
    <text x="330" y="126">classic hollywood</text>
    <rect x="330" y="134" width="180" height="8" rx="4" fill="#FFFFFF" stroke="#C4B5FD"/>
    <circle class="knob" cx="384" cy="138" r="9" fill="#7C3AED"/>
    <text x="330" y="176">musicals</text>
    <rect x="330" y="184" width="180" height="8" rx="4" fill="#FFFFFF" stroke="#C4B5FD"/>
    <circle cx="360" cy="188" r="9" fill="#A78BFA"/>
    <text x="330" y="226">film noir</text>
    <rect x="330" y="234" width="180" height="8" rx="4" fill="#FFFFFF" stroke="#C4B5FD"/>
    <circle cx="470" cy="238" r="9" fill="#A78BFA"/>
  </g>

  <!-- results swap -->
  <g class="resA" font-size="12" text-anchor="middle">
    <rect x="580" y="80" width="170" height="76" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
    <text x="665" y="104" font-weight="700" fill="#4B5563">before</text>
    <text x="665" y="124" fill="#6B7280">Casablanca</text>
    <text x="665" y="142" fill="#6B7280">The Third Man</text>
  </g>
  <g class="resB" font-size="12" text-anchor="middle">
    <rect x="580" y="170" width="170" height="76" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="665" y="194" font-weight="700" fill="#065F46">knob turned →</text>
    <text x="665" y="214" fill="#065F46">Singin' in the Rain</text>
    <text x="665" y="232" fill="#065F46">West Side Story</text>
  </g>

  <text x="400" y="310" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E1B4B">sparse autoencoders name the hidden taste axes — steering becomes a UI control</text>
  <text x="400" y="360" text-anchor="middle" font-size="13" fill="#6B7280">Instead of "the algorithm decided", the profile exposes sliders the reader can move — and the ranking follows, visibly.</text>
</svg>
