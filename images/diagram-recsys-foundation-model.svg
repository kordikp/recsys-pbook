  <text x="246.5" y="110" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">short slice</text>
  <line x1="246.5" y1="119" x2="246.5" y2="129" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ag)"/>
  <rect x="204.5" y="132" width="84" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="246.5" y="151" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">Model B</text>
  <line x1="246.5" y1="161" x2="246.5" y2="171" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
