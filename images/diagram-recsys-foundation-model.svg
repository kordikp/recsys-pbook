  <rect x="179" y="480" width="135" height="36" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="246.5" y="503" font-size="15" font-weight="400" fill="#1E1B4B" text-anchor="middle">Search</text>
  <rect x="326" y="480" width="135" height="36" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="393.5" y="503" font-size="15" font-weight="400" fill="#1E1B4B" text-anchor="middle">More like this</text>
  <rect x="473" y="480" width="135" height="36" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="540.5" y="503" font-size="15" font-weight="400" fill="#1E1B4B" text-anchor="middle">New-episode alert</text>
  <rect x="16" y="548" width="608" height="62" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="320" y="574" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">It costs compute, latency work and coupling between surfaces.</text>
  <text x="320" y="595" font-size="15" font-weight="400" fill="#1E1B4B" text-anchor="middle">Worth it with huge behavior data and many surfaces to share it.</text>
</svg>
