  <rect x="498.5" y="132" width="84" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="540.5" y="151" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">Model D</text>
  <line x1="540.5" y1="161" x2="540.5" y2="171" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
  <rect x="32" y="174" width="135" height="36" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="99.5" y="197" font-size="15" font-weight="400" fill="#1E1B4B" text-anchor="middle">Home rows</text>
  <rect x="179" y="174" width="135" height="36" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="246.5" y="197" font-size="15" font-weight="400" fill="#1E1B4B" text-anchor="middle">Search</text>
  <rect x="326" y="174" width="135" height="36" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="393.5" y="197" font-size="15" font-weight="400" fill="#1E1B4B" text-anchor="middle">More like this</text>
  <rect x="473" y="174" width="135" height="36" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="540.5" y="197" font-size="15" font-weight="400" fill="#1E1B4B" text-anchor="middle">New-episode alert</text>
  <line x1="147.5" y1="146" x2="183.5" y2="146" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#pn08-aa)"/>
  <line x1="190.5" y1="135" x2="190.5" y2="157" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="235" font-size="15" font-weight="600" fill="#92400E" text-anchor="middle">A trick model A finds never reaches B, C or D.</text>
  <rect x="16" y="262" width="608" height="272" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="288" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="start">After: one foundation model</text>
  <rect x="32" y="302" width="576" height="30" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="320" y="322" font-size="15" font-weight="600" fill="#065F46" text-anchor="middle">All plays, searches and skips · full history</text>
  <line x1="320" y1="333" x2="320" y2="345" stroke="#10B981" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-agr)"/>
  <rect x="32" y="348" width="576" height="52" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="320" y="370" font-size="17" font-weight="700" fill="#4C1D95" text-anchor="middle">Foundation model</text>
  <text x="320" y="390" font-size="14" font-weight="400" fill="#4C1D95" text-anchor="middle">learns by predicting each person’s next action</text>
  <line x1="99.5" y1="401" x2="99.5" y2="417" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
  <rect x="34" y="420" width="131" height="46" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="99.5" y="439" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">plug-in part</text>
  <text x="99.5" y="457" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">fresher, heavier</text>
  <line x1="99.5" y1="467" x2="99.5" y2="477" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
  <line x1="246.5" y1="401" x2="246.5" y2="417" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
  <rect x="181" y="420" width="131" height="46" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="246.5" y="439" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">embeddings</text>
  <text x="246.5" y="457" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">cheap, a bit stale</text>
  <line x1="246.5" y1="467" x2="246.5" y2="477" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
  <line x1="393.5" y1="401" x2="393.5" y2="417" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
  <rect x="328" y="420" width="131" height="46" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="393.5" y="439" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">embeddings</text>
  <text x="393.5" y="457" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">cheap, a bit stale</text>
  <line x1="393.5" y1="467" x2="393.5" y2="477" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
  <line x1="540.5" y1="401" x2="540.5" y2="417" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
  <rect x="475" y="420" width="131" height="46" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="540.5" y="439" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">fine-tuned copy</text>
  <text x="540.5" y="457" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">trained for its job</text>
  <line x1="540.5" y1="467" x2="540.5" y2="477" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
