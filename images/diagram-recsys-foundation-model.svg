<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 626" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pn08-title pn08-desc">
  <title id="pn08-title">One model, many surfaces: from a model per surface to one foundation model</title>
  <desc id="pn08-desc">Before, each surface of the fictional streaming service Nightjar has its own model trained on a short slice of data, so a trick found by one never reaches the others; after, one foundation model learns from all plays, searches and skips over the full history by predicting each person's next action, and every surface reuses it as a plug-in part, as embeddings or as a fine-tuned copy, at a cost in compute, latency work and coupling.</desc>
