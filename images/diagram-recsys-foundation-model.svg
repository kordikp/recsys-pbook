  <rect x=".5" y=".5" width="639" height="625" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="24" y="36" font-size="19" font-weight="700" fill="#1E1B4B" text-anchor="start">One model, many surfaces</text>
  <text x="616" y="36" font-size="14" font-weight="400" fill="#6B7280" text-anchor="end">Nightjar, a fictional streaming service</text>
  <rect x="16" y="52" width="608" height="196" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="78" font-size="16" font-weight="700" fill="#1E1B4B" text-anchor="start">Before: one model per surface</text>
  <rect x="43.5" y="92" width="112" height="26" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="99.5" y="110" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle">short slice</text>
  <line x1="99.5" y1="119" x2="99.5" y2="129" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ag)"/>
  <rect x="57.5" y="132" width="84" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="99.5" y="151" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">Model A</text>
  <line x1="99.5" y1="161" x2="99.5" y2="171" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
