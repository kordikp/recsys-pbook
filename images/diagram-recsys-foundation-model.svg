  <line x1="393.5" y1="119" x2="393.5" y2="129" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ag)"/>
  <rect x="351.5" y="132" width="84" height="28" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="393.5" y="151" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">Model C</text>
  <line x1="393.5" y1="161" x2="393.5" y2="171" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#pn08-ap)"/>
  <rect x="484.5" y="92" width="112" height="26" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/>
