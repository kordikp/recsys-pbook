<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">The Recommendation Has Left the Table</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="28" y="76" width="146" height="52" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="101" y="98" font-size="12.5" fill="#1E1B4B" text-anchor="middle">I listed my...</text>
  <text x="101" y="116" font-size="12.5" fill="#1E1B4B" text-anchor="middle">mostly chair.</text>

  <circle cx="72" cy="164" r="10" fill="#10B981"/>
  <path d="M72 175 L72 213 M72 184 L54 198 M72 184 L91 195 M72 213 L59 235 M72 213 L85 235" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="184" y="76" width="120" height="132" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
  <rect x="196" y="89" width="96" height="72" rx="6" fill="#EDE9FE" stroke="#E5E7EB"/>
  <path d="M217 145 L220 116 L256 111 L268 145 M222 128 L260 128 M225 145 L220 155 M263 145 L269 155" fill="none" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <text x="244" y="187" font-size="11.5" fill="#1E1B4B" text-anchor="middle">“mostly chair”</text>

  <circle cx="348" cy="164" r="10" fill="#0EA5E9"/>
  <path d="M348 175 L348 213 M348 185 L327 172 M348 185 L365 198 M348 213 L337 235 M348 213 L360 235" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="320" cy="153" r="10" fill="none" stroke="#0EA5E9" stroke-width="2.5"/>
  <path d="M327 160 L335 168" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>

  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Vision and language turn homemade posts into usable clues.</text>

  <!-- Panel 2 -->
  <rect x="420" y="75" width="184" height="48" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="512" y="96" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Everyone gets one turn</text>
  <text x="512" y="114" font-size="12.5" fill="#1E1B4B" text-anchor="middle">up front.</text>

  <circle cx="456" cy="166" r="10" fill="#0EA5E9"/>
  <path d="M456 177 L456 215 M456 187 L438 199 M456 187 L475 198 M456 215 L444 237 M456 215 L468 237" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M499 139 C536 124 592 124 632 139 M625 132 L632 139 L622 144" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="494" y="151" width="58" height="74" rx="7" fill="#E0F2FE" stroke="#0EA5E9"/>
  <path d="M511 176 L511 193 Q511 202 520 202 Q529 202 529 193 L529 176 Z M529 181 Q539 181 536 191 Q534 196 529 195" fill="none" stroke="#1E1B4B" stroke-width="2"/>
  <text x="523" y="216" font-size="10.5" fill="#6B7280" text-anchor="middle">MUG</text>

  <rect x="562" y="145" width="62" height="80" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <path d="M578 176 L606 176 L600 162 L584 162 Z M592 176 L592 200 M582 202 L602 202" fill="none" stroke="#1E1B4B" stroke-width="2"/>
  <text x="593" y="216" font-size="10.5" fill="#6B7280" text-anchor="middle">LAMP</text>

  <rect x="634" y="151" width="58" height="74" rx="7" fill="#EDE9FE" stroke="#7C3AED"/>
  <path d="M649 181 L650 168 L676 168 L677 192 M651 181 L676 181 M654 192 L651 202 M674 192 L677 202" fill="none" stroke="#1E1B4B" stroke-width="2"/>
  <text x="663" y="216" font-size="10.5" fill="#6B7280" text-anchor="middle">CHAIR</text>

  <circle cx="746" cy="166" r="10" fill="#10B981"/>
  <path d="M746 177 L746 215 M746 187 L728 198 M746 187 L763 198 M746 215 L735 237 M746 215 L758 237" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Every new listing gets a brief turn where buyers can see it.</text>

  <!-- Panel 3 -->
  <rect x="28" y="355" width="154" height="46" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="105" y="383" font-size="12.5" fill="#1E1B4B" text-anchor="middle">I’ll take that lamp.</text>

  <circle cx="68" cy="450" r="10" fill="#7C3AED"/>
  <path d="M68 461 L68 500 M68 471 L51 484 M68 471 L88 482 M68 500 L56 522 M68 500 L81 522" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="164" y="426" width="108" height="102" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <path d="M194 463 L242 463 L233 441 L203 441 Z M218 463 L218 494 M201 497 L235 497" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="180" y="482" width="76" height="28" rx="8" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="218" y="501" font-size="12.5" font-weight="700" fill="#EF4444" text-anchor="middle">SOLD</text>

  <circle cx="338" cy="450" r="10" fill="#10B981"/>
  <path d="M338 461 L338 500 M338 471 L319 483 M338 471 L356 483 M338 500 L326 522 M338 500 L350 522" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M303 482 L318 482 M306 477 L306 487 M313 477 L313 487" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>

  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">One purchase removes one recommendation from the shelf.</text>

  <!-- Panel 4 -->
  <rect x="420" y="355" width="170" height="46" rx="9" fill="#FEF3C7" stroke="#D97706"/>
  <text x="505" y="383" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Show me that lamp again.</text>

  <rect x="631" y="355" width="139" height="52" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="700" y="377" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Only in the</text>
  <text x="700" y="395" font-size="12.5" fill="#1E1B4B" text-anchor="middle">past tense.</text>

  <circle cx="462" cy="450" r="10" fill="#D97706"/>
  <path d="M462 461 L462 500 M462 471 L445 484 M462 471 L481 482 M462 500 L450 522 M462 500 L475 522" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="612" cy="450" r="10" fill="#7C3AED"/>
  <path d="M612 461 L612 500 M612 472 L594 484 M612 472 L635 473 M612 500 L600 522 M612 500 L625 522" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M632 465 L668 465 L660 447 L640 447 Z M650 465 L650 496 M638 498 L662 498" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="746" cy="450" r="10" fill="#0EA5E9"/>
  <path d="M746 461 L746 500 M746 472 L728 462 M746 472 L764 461 M746 500 L734 522 M746 500 L758 522" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>

  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Yesterday’s perfect match is today’s empty shelf.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Marketplace recommenders must rank unique listings that vanish from inventory when sold.</text>
</svg>