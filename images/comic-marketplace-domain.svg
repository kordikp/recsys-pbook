<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" role="img" aria-labelledby="pb080-title pb080-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="pb080-title">One lamp, one buyer</title>
<desc id="pb080-desc">Four-panel comic: in a marketplace every listing is one of a kind and sells once, so the recommender must understand a new listing on day one, give it a fair turn, and drop it the moment it is sold. 1, listed tonight: a seller posts an old lamp, thumb in the photo, described as "old lamp. works. mostly."; with zero clicks, the recommender reads the photo and text as brass lamp, retro, works-ish. 2, a fair first look: the brand-new lamp gets a highlighted spot in your feed next to popular items; you decide to wait until tomorrow. 3, an hour later: someone else buys it after 3 clicks; the seller says it was the only one. 4, next morning: you ask where the lamp went; the recommender has crossed the sold lamp out of your feed and shows two similar lamps instead.</desc>
<defs><clipPath id="pb080-photo"><rect x="78" y="114" width="142" height="54" rx="6"/></clipPath></defs>
