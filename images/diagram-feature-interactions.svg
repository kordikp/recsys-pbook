<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 410" width="650" height="410" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowGray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="648" height="408" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="325" y="27" text-anchor="middle" fill="#1E1B4B" font-size="16" font-weight="700">Feature Interaction Models</text>

  <!-- FM -->
  <rect x="15" y="42" width="195" height="358" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M25 42H200A10 10 0 0 1 210 52V78H15V52A10 10 0 0 1 25 42Z" fill="#0EA5E9"/>
  <text x="112.5" y="65" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">FM</text>

  <text x="112.5" y="101" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Linear Terms</text>
  <rect x="35" y="110" width="155" height="32" rx="6" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="112.5" y="130" text-anchor="middle" fill="#1E1B4B" font-size="11">w0 + w1x1 + w2x2 + ...</text>

  <text x="112.5" y="161" text-anchor="middle" fill="#1E1B4B" font-size="18">+</text>
  <text x="112.5" y="183" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Factorized Interactions</text>

  <g transform="translate(47,193)">
    <rect x="0" y="0" width="42" height="62" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="21" y="28" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">V</text>
    <text x="21" y="48" text-anchor="middle" fill="#6B7280" font-size="11">n x k</text>

    <text x="53" y="35" text-anchor="middle" fill="#1E1B4B" font-size="14">x</text>

    <rect x="64" y="10" width="66" height="44" rx="5" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="97" y="30" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">V^T</text>
    <text x="97" y="46" text-anchor="middle" fill="#6B7280" font-size="11">k x n</text>
  </g>

  <text x="112.5" y="278" text-anchor="middle" fill="#6B7280" font-size="11">Each feature i gets a</text>
  <text x="112.5" y="294" text-anchor="middle" fill="#6B7280" font-size="11">k-dim latent vector vi</text>

  <rect x="52" y="309" width="121" height="32" rx="16" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="112.5" y="330" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">O(kn)</text>
  <text x="112.5" y="372" text-anchor="middle" fill="#6B7280" font-size="11">Linear in features</text>

  <!-- DeepFM -->
  <rect x="225" y="42" width="195" height="358" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M235 42H410A10 10 0 0 1 420 52V78H225V52A10 10 0 0 1 235 42Z" fill="#10B981"/>
  <text x="322.5" y="65" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">DeepFM</text>

  <text x="322.5" y="101" text-anchor="middle" fill="#1E1B4B" font-size="11">y-hat</text>
  <line x1="322.5" y1="105" x2="322.5" y2="112" stroke="#6B7280"/>

  <rect x="269" y="112" width="107" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="322.5" y="132" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Sigmoid (concat)</text>

  <line x1="278.5" y1="176" x2="300" y2="146" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="368" y1="176" x2="346" y2="146" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="241" y="178" width="75" height="72" rx="6" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="278.5" y="201" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">FM</text>
  <text x="278.5" y="219" text-anchor="middle" fill="#1E1B4B" font-size="11">Component</text>
  <text x="278.5" y="237" text-anchor="middle" fill="#6B7280" font-size="11">order-2</text>

  <rect x="327" y="178" width="82" height="72" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="368" y="201" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">DNN</text>
  <text x="368" y="219" text-anchor="middle" fill="#1E1B4B" font-size="11">Component</text>
  <text x="368" y="237" text-anchor="middle" fill="#6B7280" font-size="11">high-order</text>

  <line x1="291" y1="282" x2="281" y2="253" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="352" y1="282" x2="366" y2="253" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="246" y="282" width="153" height="34" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="322.5" y="303" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Shared Embeddings</text>

  <rect x="250" y="329" width="145" height="32" rx="16" fill="#D1FAE5" stroke="#10B981"/>
  <text x="322.5" y="350" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">O(kn + DNN)</text>
  <text x="322.5" y="383" text-anchor="middle" fill="#6B7280" font-size="11">End-to-end, no manual features</text>

  <!-- DCN -->
  <rect x="435" y="42" width="200" height="358" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M445 42H625A10 10 0 0 1 635 52V78H435V52A10 10 0 0 1 445 42Z" fill="#D97706"/>
  <text x="535" y="65" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">DCN (Deep &amp; Cross)</text>

  <text x="492.5" y="96" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Cross Network</text>
  <text x="587" y="96" text-anchor="middle" fill="#1E1B4B" font-size="11" font-weight="600">Deep Network</text>

  <rect x="450" y="103" width="85" height="42" rx="5" fill="#FEF3C7" stroke="#D97706"/>
  <text x="492.5" y="121" text-anchor="middle" fill="#1E1B4B" font-size="11">x_l+1 =</text>
  <text x="492.5" y="137" text-anchor="middle" fill="#1E1B4B" font-size="11">x_0 x_l^T w</text>

  <rect x="450" y="151" width="85" height="30" rx="5" fill="#FEF3C7" stroke="#D97706"/>
  <text x="492.5" y="171" text-anchor="middle" fill="#1E1B4B" font-size="11">Cross Layer 2</text>

  <rect x="450" y="187" width="85" height="30" rx="5" fill="#FEF3C7" stroke="#D97706"/>
  <text x="492.5" y="207" text-anchor="middle" fill="#1E1B4B" font-size="11">Cross Layer 3</text>

  <line x1="443" y1="118" x2="443" y2="202" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="447" y="229" fill="#D97706" font-size="11" font-weight="600">x_0</text>

  <rect x="548" y="103" width="78" height="42" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="587" y="121" text-anchor="middle" fill="#1E1B4B" font-size="11">Dense +</text>
  <text x="587" y="137" text-anchor="middle" fill="#1E1B4B" font-size="11">ReLU</text>

  <rect x="548" y="151" width="78" height="30" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="587" y="171" text-anchor="middle" fill="#1E1B4B" font-size="11">Dense + ReLU</text>

  <rect x="548" y="187" width="78" height="30" rx="5" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="587" y="207" text-anchor="middle" fill="#1E1B4B" font-size="11">Dense + ReLU</text>

  <text x="539" y="238" text-anchor="middle" fill="#6B7280" font-size="11">concat + logits</text>

  <line x1="493" y1="250" x2="493" y2="220" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="587" y1="250" x2="587" y2="220" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="452" y="250" width="166" height="34" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="535" y="271" text-anchor="middle" fill="#1E1B4B" font-size="11">Input: [x_sparse ; x_dense]</text>

  <text x="535" y="304" text-anchor="middle" fill="#6B7280" font-size="11">Explicit cross-features</text>
  <text x="535" y="321" text-anchor="middle" fill="#6B7280" font-size="11">up to L-th order in L layers</text>

  <rect x="469" y="335" width="132" height="32" rx="16" fill="#FEF3C7" stroke="#D97706"/>
  <text x="535" y="356" text-anchor="middle" fill="#1E1B4B" font-size="12" font-weight="700">O(kd + DNN)</text>
  <text x="535" y="388" text-anchor="middle" fill="#6B7280" font-size="11">Bounded cross-feature cost</text>
</svg>